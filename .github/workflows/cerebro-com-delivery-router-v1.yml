name: CEREBRO COM-001 Delivery Router V1

on:
  push:
    paths:
      - 'cerebro/communication/com-delivery-router-v1.mjs'
      - 'cerebro/tests/com-delivery-router-v1.test.mjs'
      - 'cerebro/revenue/lead-nba-v1.mjs'
      - 'cerebro/revenue/sale-action-v1.mjs'
      - 'cerebro/multichannel/channel-registry.v1.json'
      - '.github/workflows/cerebro-com-delivery-router-v1.yml'
  pull_request:
    paths:
      - 'cerebro/communication/com-delivery-router-v1.mjs'
      - 'cerebro/tests/com-delivery-router-v1.test.mjs'
      - 'cerebro/revenue/lead-nba-v1.mjs'
      - 'cerebro/revenue/sale-action-v1.mjs'
      - 'cerebro/multichannel/channel-registry.v1.json'
      - '.github/workflows/cerebro-com-delivery-router-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  com-delivery-router-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Revenue delivery focused tests
        run: >-
          node --test
          cerebro/tests/lead-nba-v1.test.mjs
          cerebro/tests/sale-action-v1.test.mjs
          cerebro/tests/com-delivery-router-v1.test.mjs
          cerebro/tests/durable-job-runtime-v1.test.mjs
          cerebro/tests/durable-worker-runner-v1.test.mjs
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression suite
        working-directory: cerebro
        run: npm test
