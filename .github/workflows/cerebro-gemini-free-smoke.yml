name: CEREBRO Gemini Free Smoke

on:
  push:
    branches:
      - cerebro-skill-supply-chain-v0-20261006
    paths:
      - '.github/workflows/cerebro-gemini-free-smoke.yml'

permissions:
  contents: read

jobs:
  gemini-free-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.CEREBRO_GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
    steps:
      - name: Verify secret is bound without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::CEREBRO_GEMINI_API_KEY is not bound in GitHub Actions."
            exit 1
          fi
          echo '{"secret_bound":true,"secret_value_emitted":false,"synthetic_only":true,"prod_data":false,"customer_data":false,"paid_fallback":false}'

      - name: Execute exactly one synthetic Gemini free-tier inference
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"contents":[{"parts":[{"text":"Synthetic CEREBRO connectivity check only. Reply exactly: CEREBRO_GEMINI_FREE_OK"}]}],"generationConfig":{"maxOutputTokens":32,"temperature":0}}'
          HTTP_CODE="$(curl -sS --max-time 45 -o /tmp/gemini-response.json -w '%{http_code}' \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$BODY")"

          if [ "$HTTP_CODE" != "200" ]; then
            STATUS="$(jq -r '.error.status // "UNKNOWN"' /tmp/gemini-response.json 2>/dev/null || echo UNKNOWN)"
            CODE="$(jq -r '.error.code // "UNKNOWN"' /tmp/gemini-response.json 2>/dev/null || echo UNKNOWN)"
            echo "::error::Gemini synthetic smoke failed: http=${HTTP_CODE} api_code=${CODE} status=${STATUS}. No retry and no paid fallback."
            rm -f /tmp/gemini-response.json
            exit 1
          fi

          TEXT="$(jq -r '[.candidates[0].content.parts[]?.text // empty] | join("")' /tmp/gemini-response.json)"
          if [[ "$TEXT" != *"CEREBRO_GEMINI_FREE_OK"* ]]; then
            echo "::error::Gemini returned HTTP 200 but semantic marker was not present. No retry."
            rm -f /tmp/gemini-response.json
            exit 1
          fi

          PROMPT_TOKENS="$(jq -r '.usageMetadata.promptTokenCount // 0' /tmp/gemini-response.json)"
          OUTPUT_TOKENS="$(jq -r '.usageMetadata.candidatesTokenCount // 0' /tmp/gemini-response.json)"
          TOTAL_TOKENS="$(jq -r '.usageMetadata.totalTokenCount // 0' /tmp/gemini-response.json)"
          echo "Gemini synthetic smoke GREEN: model=${GEMINI_MODEL} calls=1 http=200 marker=OK prompt_tokens=${PROMPT_TOKENS} output_tokens=${OUTPUT_TOKENS} total_tokens=${TOTAL_TOKENS} paid_fallback=false prod_data=false customer_data=false secret_value_emitted=false"
          rm -f /tmp/gemini-response.json
