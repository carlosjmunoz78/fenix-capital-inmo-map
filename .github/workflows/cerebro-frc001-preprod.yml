name: CEREBRO FRC-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-str001-strategy-engine-v0-20260911']
    paths:
      - 'cerebro/strategy/forecasting-engine.mjs'
      - 'cerebro/tests/forecasting-engine.test.mjs'
      - '.github/workflows/cerebro-frc001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/forecasting-engine.test.mjs
