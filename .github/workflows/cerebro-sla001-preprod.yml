name: CEREBRO SLA-001 PREPROD
on:
  pull_request:
    paths:
      - 'cerebro/operations/sla-engine.mjs'
      - 'cerebro/tests/sla-engine.test.mjs'
      - '.github/workflows/cerebro-sla001-preprod.yml'
jobs:
  sla001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/sla-engine.test.mjs
