name: CEREBRO Strict179 Batch02 SEO JDG V1

on:
  push:
    branches:
      - 'cerebro/close-179-per-engine-autonomy-v1-20261102'
    paths:
      - 'cerebro/missions/strict179-batch02-seo-jdg-recovery-observability-v1.mjs'
      - '.github/workflows/cerebro-strict179-batch02-seo-jdg-v1.yml'
      - 'cerebro/evidence/backup/STRICT179_BATCH02_SEO001_JDG001_BACKUP_2026-11-02.json'
      - 'cerebro/evidence/rollback/STRICT179_BATCH02_SEO001_JDG001_ROLLBACK_2026-11-02.json'
      - 'cerebro/evidence/rebuild/STRICT179_BATCH02_SEO001_JDG001_REBUILD_2026-11-02.json'
      - 'cerebro/evidence/observability/STRICT179_BATCH02_JDG001_OBSERVABILITY_2026-11-02.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-strict179-batch02-seo-jdg-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-batch02:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test SEO-001 and JDG-001 recovery and observability
        run: |
          set -euo pipefail
          node cerebro/missions/strict179-batch02-seo-jdg-recovery-observability-v1.mjs --out /tmp/strict179-batch02
          cat /tmp/strict179-batch02/SUMMARY.json
          cat /tmp/strict179-batch02/JDG001_OBSERVABILITY.json

      - name: Re-run strict 179x12 readiness audit
        run: |
          set -euo pipefail
          node cerebro/missions/audit-179-autonomy-readiness-v1.mjs --out /tmp/strict179-readiness
          cat /tmp/strict179-readiness/SUMMARY.json

      - name: Assert no repository mutation
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'GREEN: Batch02 read-only PREPROD verification; no PROD writes, Trading, secrets or paid fallback.'

      - name: Upload immutable Batch02 evidence
        uses: actions/upload-artifact@v4
        with:
          name: strict179-batch02-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/strict179-batch02/SUMMARY.json
            /tmp/strict179-batch02/JDG001_OBSERVABILITY.json
            /tmp/strict179-readiness/SUMMARY.json
            /tmp/strict179-readiness/AUTONOMY_READINESS_BASELINE.json
          if-no-files-found: error
          retention-days: 30
