name: FACT001 Notion D1 CAS Candidate LAB CI
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/notion-checkpoint-cas-lab/**
      - .github/workflows/fact001-notion-checkpoint-cas-lab-ci.yml
permissions:
  contents: read
jobs:
  local-sql-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Isolated SQLite CAS, audit, rollback and legacy isolation
        working-directory: cerebro/connectors/universal/services/notion-checkpoint-cas-lab
        run: python3 -m unittest discover -s tests -p test_cas.py -v
      - name: No D1 write in this CI
        run: echo FACT001_D1_CAS_CANDIDATE_ONLY_NO_REMOTE_WRITES=true