name: OPERATIVA directory minimal staged PROD build NO DOMAIN
on:
  push:
    branches: [cerebro/operativa-agent-directory-prod-candidate-20261117]
permissions:
  contents: read
concurrency:
  group: cerebro-operativa-directory-stage-no-domain
  cancel-in-progress: false
jobs:
  stage:
    if: contains(github.event.head_commit.message, '[STAGE_OPERATIVA_DIRECTORY_NO_DOMAIN]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_qnh6u1Ofy2WPp0MGEKlyMA50
      VERCEL_PROJECT_ID: prj_4ElVl8e2KzrHS7r5yvBGBban1DXV
    steps:
      - name: Checkout exact isolated release branch, no token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact branch, target and unchanged baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/cerebro/operativa-agent-directory-prod-candidate-20261117
          test "$VERCEL_ORG_ID" = team_qnh6u1Ofy2WPp0MGEKlyMA50
          test "$VERCEL_PROJECT_ID" = prj_4ElVl8e2KzrHS7r5yvBGBban1DXV
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" # Exact source checkout; baseline was verified by PR comparison
      - name: Install existing locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict production-compatible build and owner-only contract
        run: |
          npm run build
          node --experimental-strip-types cerebro/universal/v0/operativa-owner-directory-minimal.acceptance.mjs
      - name: Install existing reviewed Vercel CLI version
        run: npm install --global vercel@65.8.0
      - name: Pull existing production configuration without domains or changes
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then echo 'HUMAN_REQUIRED_EXISTING_VERCEL_TOKEN_MISSING'; exit 2; fi
          export XDG_DATA_HOME="$RUNNER_TEMP/cerebro-directory-stage-auth"
          echo "XDG_DATA_HOME=$XDG_DATA_HOME" >> "$GITHUB_ENV"
          node -e 'const fs=require("node:fs"),p=require("node:path"),dir=p.join(process.env.XDG_DATA_HOME,"com.vercel.cli");fs.mkdirSync(dir,{recursive:true,mode:0o700});fs.writeFileSync(p.join(dir,"auth.json"),JSON.stringify({token:process.env.VERCEL_TOKEN}),{mode:0o600})'
          vercel pull --yes --environment=production --scope=carlosjmunozcabeza-2582s-projects
          node -e 'const p=require("./.vercel/project.json");if(p.orgId!==process.env.VERCEL_ORG_ID||p.projectId!==process.env.VERCEL_PROJECT_ID)throw Error("PROJECT_ID_DRIFT")'
      - name: Build isolated artifact for existing production target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --scope=carlosjmunozcabeza-2582s-projects
      - name: Deploy candidate ONLY with NO DOMAINS
        id: stage
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --skip-domain --yes --scope=carlosjmunozcabeza-2582s-projects)"
          case "$url" in https://fenix-capital-preprod-*.vercel.app) ;; *) echo 'BLOCKED_UNEXPECTED_HOST'; exit 4;; esac
          echo "STAGED_URL=$url" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'PROD_DOMAIN_CHANGE=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PROD_PROMOTION=HOLD_UNTIL_E2E_AND_ROLLBACK' >> "$GITHUB_STEP_SUMMARY"
      - name: Purge runner credentials and generated local Vercel metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/cerebro-directory-stage-auth" .vercel
          echo 'CREDENTIALS_PURGED; PROD_DOMAIN_UNCHANGED'
