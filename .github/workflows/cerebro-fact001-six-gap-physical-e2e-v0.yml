name: CEREBRO FACT001 Six Gap Physical E2E V0

on:
  push:
    paths:
      - 'cerebro/runtime/fact001-six-gap-physical-e2e-v0.mjs'
      - 'cerebro/runtime/fact001-gap-capabilities-v0.mjs'
      - 'cerebro/tests/fact001-six-gap-physical-e2e-v0.test.mjs'
      - 'cerebro/registry/fact001-six-gap-physical-e2e.v0.json'
      - 'cerebro/skills/cerebro-184-live-convergence.v2.json'
      - 'cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs'
      - '.github/workflows/cerebro-fact001-six-gap-physical-e2e-v0.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/fact001-six-gap-physical-e2e-v0.mjs'
      - 'cerebro/runtime/fact001-gap-capabilities-v0.mjs'
      - 'cerebro/tests/fact001-six-gap-physical-e2e-v0.test.mjs'
      - 'cerebro/registry/fact001-six-gap-physical-e2e.v0.json'
      - 'cerebro/skills/cerebro-184-live-convergence.v2.json'
      - 'cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs'
      - '.github/workflows/cerebro-fact001-six-gap-physical-e2e-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Focused physical E2E tests
        run: node --test cerebro/tests/fact001-six-gap-physical-e2e-v0.test.mjs
      - name: Generate physical E2E evidence
        run: node cerebro/runtime/fact001-six-gap-physical-e2e-v0.mjs --out /tmp/fact001-six-gap-physical-e2e-report.json
      - name: Validate evidence and authority boundary
        run: >-
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/fact001-six-gap-physical-e2e-report.json','utf8')); const p=require('./cerebro/registry/fact001-six-gap-physical-e2e.v0.json'); const items=[47,48,57,62,74,183]; if(r.status!=='LOCAL_E2E_GREEN_PHYSICAL_EXTERNAL_BINDINGS_PENDING'||r.passed!==6||r.total!==6||JSON.stringify(r.results.map(x=>x.item))!==JSON.stringify(items)) process.exit(1); if(r.prod_authorized||r.prod_write_authorized||r.trading_access||r.additional_cost_eur!==0||r.human_required.length) process.exit(1); if(p.status!=='VERIFIED_LOCAL_E2E_EXTERNAL_BINDINGS_PENDING'||Object.values(p.items).length!==6||Object.values(p.items).some(x=>!x.remaining_gate||!x.verified_state)) process.exit(1); if(p.authority.prod_authorized||p.authority.prod_write_authorized||p.authority.external_dependency_install_authorized||p.authority.external_provider_write_authorized||p.authority.customer_data_authorized||p.authority.trading_access||p.authority.automatic_paid_fallback||p.authority.additional_cost_eur!==0) process.exit(1); console.log('six-gap local physical E2E evidence GREEN; external bindings still fail-closed');"
      - name: Canonical registry validation
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression
        working-directory: cerebro
        run: npm test
      - name: Upload physical E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: fact001-six-gap-physical-e2e-report
          path: /tmp/fact001-six-gap-physical-e2e-report.json
          retention-days: 14
