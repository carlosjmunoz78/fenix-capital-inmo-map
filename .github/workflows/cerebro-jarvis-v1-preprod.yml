name: CEREBRO JARVIS V1 PREPROD Launch

on:
  workflow_dispatch:
  push:
    branches:
      - cerebro/jarvis-v1-launch-2026-10-30
    paths:
      - 'cerebro/missions/jarvis-v1/**'
      - 'cerebro/runtime/jarvis-*.mjs'
      - '.github/workflows/cerebro-jarvis-v1-preprod.yml'

permissions:
  contents: read

env:
  CEREBRO_MODE: PREPROD
  CEREBRO_POLICY_CEILING: PREPROD
  CEREBRO_AUTONOMOUS_PROD: '0'
  CEREBRO_PAID_AI_USD: '0'
  JARVIS_MAXIMUM_SAFE_THROUGHPUT: '1'

jobs:
  ingest-and-p00-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check launch runtimes
        run: |
          node --check cerebro/runtime/jarvis-v1-backlog-loader.mjs
          node --check cerebro/runtime/jarvis-p00-baseline-audit-v1.mjs
          node --check cerebro/runtime/jarvis-p00-control-plane-v1.mjs

      - name: Validate canonical backlog and seed P00 queue
        run: node cerebro/runtime/jarvis-v1-backlog-loader.mjs

      - name: Execute read-only P00 repository baseline
        run: node cerebro/runtime/jarvis-p00-baseline-audit-v1.mjs

      - name: Materialize P00 control-plane registries and task ledger
        run: node cerebro/runtime/jarvis-p00-control-plane-v1.mjs

      - name: Verify safety ceiling
        shell: bash
        run: |
          test "$CEREBRO_MODE" = "PREPROD"
          test "$CEREBRO_POLICY_CEILING" = "PREPROD"
          test "$CEREBRO_AUTONOMOUS_PROD" = "0"
          test "$CEREBRO_PAID_AI_USD" = "0"

      - name: Upload JARVIS launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-jarvis-v1-p00-evidence-${{ github.run_id }}
          path: runtime-artifacts/jarvis-v1/
          retention-days: 30
