name: JARVIS UX Physical Typography Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/jarvis-work-v2.css'
      - 'src/jarvis-work-premium-final.css'
      - 'tests/cerebro-jarvis-v1-preview.spec.ts'
      - '.github/workflows/jarvis-ux-physical-typography-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ux-physical-typography-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FENIX_ENV: preprod
      VITE_SUPABASE_URL: https://hnqlnvakzaywtafeiybt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uvtiidkBBkFRt2K34so27g_JpCbMUZw
      CEREBRO_ENVIRONMENT: PREPROD
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - name: Verify JARVIS desktop and mobile computed font sizes
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npx playwright test tests/cerebro-jarvis-v1-preview.spec.ts --project=desktop-chromium --reporter=line --grep 'physical typography remains legible'
      - name: Upload isolated visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ux-physical-typography-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
