name: Operativa V3 voice speed 1.15 · isolated QA
on:
  push:
    branches: [fix/operativa-voice-rate-115-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Voice speed and owner contracts
        run: node --test tests/cerebro-operativa-voice-rate.test.mjs tests/cerebro-operativa-v3-live-bridge-contract.test.mjs tests/cerebro-operativa-audio-device-diagnostic.test.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript and Vite
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Regression of authenticated text, dictation and voice
        env:
          VITE_FENIX_ENV: test
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: operativa-e2e-not-a-real-key
        run: npx playwright test tests/cerebro-operativa-v3-live-bridge-e2e.spec.ts --project=desktop-chromium --reporter=line
