name: CEREBRO Operativa V1 Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/CerebroConsoleHost.tsx'
      - 'src/CerebroOperativeConsole.tsx'
      - 'src/cerebroActivityApi.ts'
      - 'src/cerebro-console-host.css'
      - 'src/cerebro-operative-console.css'
      - 'src/cerebro-operative-console-v2.css'
      - 'src/RouteAccessGuard.tsx'
      - 'supabase/functions/cerebro-console-activity-v0/**'
      - 'tests/cerebro-operativa-e2e.spec.ts'
      - 'scripts/verify-cerebro-operativa-v1.mjs'
      - '.github/workflows/cerebro-operativa-v1.yml'
  push:
    branches: [main]
    paths:
      - 'src/CerebroConsoleHost.tsx'
      - 'src/CerebroOperativeConsole.tsx'
      - 'src/cerebroActivityApi.ts'
      - 'src/cerebro-console-host.css'
      - 'src/cerebro-operative-console.css'
      - 'src/cerebro-operative-console-v2.css'
      - 'src/RouteAccessGuard.tsx'
      - 'supabase/functions/cerebro-console-activity-v0/**'
      - 'tests/cerebro-operativa-e2e.spec.ts'
      - 'scripts/verify-cerebro-operativa-v1.mjs'
      - '.github/workflows/cerebro-operativa-v1.yml'

permissions:
  contents: read

jobs:
  operativa-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify V0 wrapping, provenance and no fake metrics
        run: node scripts/verify-cerebro-operativa-v1.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise OPERATIVA over the real V0 client contract
        env:
          VITE_FENIX_ENV: test
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: operativa-e2e-not-a-real-key
        run: npx playwright test tests/cerebro-operativa-e2e.spec.ts --project=desktop-chromium --reporter=line
      - name: TypeScript and Vite build
        run: npm run build
