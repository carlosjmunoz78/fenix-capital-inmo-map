name: TEMP Browser Work Total Fail Closed PREPROD

on:
  push:
    branches:
      - fix/browser-work-total-fail-closed-20261025
  pull_request:
    branches:
      - promote/browser-work-total-prod-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Work Total fail-closed contract
        run: node cerebro/runtime/browser-work-total-fail-closed-contract.test.mjs
      - name: Browser session bundle regression
        run: |
          if [ -f cerebro/runtime/browser-session-bundle-v1.test.mjs ]; then node cerebro/runtime/browser-session-bundle-v1.test.mjs; fi
      - name: Browser live runner regression
        run: |
          if [ -f cerebro/runtime/browser-live-runner-host.test.mjs ]; then node cerebro/runtime/browser-live-runner-host.test.mjs; fi
      - name: Browser natural command regression
        run: |
          if [ -f cerebro/runtime/browser-natural-command-v3.test.mjs ]; then node cerebro/runtime/browser-natural-command-v3.test.mjs; fi
      - name: App build
        run: npm run build
