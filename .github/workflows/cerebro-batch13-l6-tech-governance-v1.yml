name: CEREBRO Batch13 L6 Tech Governance V1
on:
  push:
    branches: [cerebro/close-179-per-engine-autonomy-v1-20261102]
    paths:
      - 'cerebro/runtime/batch13-l6-tech-governance-v1.mjs'
      - 'cerebro/tests/batch13-l6-tech-governance-v1.test.mjs'
      - 'cerebro/missions/close-batch13-l6-tech-governance-v1.mjs'
      - '.github/workflows/cerebro-batch13-l6-tech-governance-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OUT: /tmp/cerebro-batch13-l6-tech-governance
jobs:
  batch13-autonomy-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Verify isolated branch
        run: test "$GITHUB_REF_NAME" = 'cerebro/close-179-per-engine-autonomy-v1-20261102'
      - name: Validate registry and factory without mutation
        run: |
          set -euo pipefail
          cd cerebro
          npm run validate
          node factory-v1.mjs validate --registry registry/engine-registry.v1.json
      - name: Rebuild complete prior certified chain 89/179
        run: |
          set -euo pipefail
          node cerebro/missions/close-orch-hex-autonomy-v1.mjs
          node cerebro/missions/close-batch07-iam001-v1.mjs
          node cerebro/missions/close-batch07-job-route-v1.mjs
          node cerebro/missions/close-batch07-observ001-v1.mjs
          node cerebro/missions/close-batch07-evt001-v1.mjs
          node cerebro/missions/close-batch07-qa001-v1.mjs
          node cerebro/missions/close-batch07-cmd001-v1.mjs
          node cerebro/missions/close-batch07-chat001-v1.mjs
          node cerebro/missions/close-batch07-ctx001-v1.mjs
          node cerebro/missions/close-batch07-actgw001-v1.mjs
          node cerebro/missions/close-batch07-self001-v1.mjs
          node cerebro/missions/close-batch07-aud001-v1.mjs
          node cerebro/missions/close-batch07-reg001-v1.mjs
          node cerebro/missions/close-batch07-red001-v1.mjs
          node cerebro/missions/close-batch08-sup001-v1.mjs
          node cerebro/missions/close-batch08-lead001-v1.mjs
          node cerebro/missions/close-batch08-prv001-v1.mjs
          node cerebro/missions/close-batch08-comp-reg001-v1.mjs
          node cerebro/missions/close-batch08-tenant001-v1.mjs
          node cerebro/missions/close-batch08-comp-onb001-v1.mjs
          node cerebro/missions/close-batch08-trnboot001-v1.mjs
          node cerebro/missions/close-batch08-autboot001-v1.mjs
          node cerebro/missions/close-batch08-engact001-v1.mjs
          node cerebro/missions/close-batch08-appboot001-v1.mjs
          node cerebro/missions/close-batch08-crmboot001-v1.mjs
          node cerebro/missions/close-batch08-mktboot001-v1.mjs
          node cerebro/missions/close-batch08-kboot001-v1.mjs
          node cerebro/missions/close-batch08-seoboot001-v1.mjs
          node cerebro/missions/close-batch08-socboot001-v1.mjs
          node cerebro/missions/close-batch08-scan001-v1.mjs
          node cerebro/missions/close-batch08-kw001-v1.mjs
          node cerebro/missions/close-batch08-waud001-v1.mjs
          node cerebro/missions/close-batch08-socaud001-v1.mjs
          node cerebro/missions/close-batch08-localp001-v1.mjs
          node cerebro/missions/close-batch08-app001-v1.mjs
          node cerebro/missions/close-batch08-crm001-v1.mjs
          node cerebro/missions/close-batch08-sale001-v1.mjs
          node cerebro/missions/close-batch09-voice001-v1.mjs
          node cerebro/missions/close-batch09-com001-v1.mjs
          node cerebro/missions/close-batch09-notif001-v1.mjs
          node cerebro/missions/close-batch09-c360001-v1.mjs
          node cerebro/missions/close-batch09-ret001-v1.mjs
          node cerebro/missions/close-batch09-nba001-v1.mjs
          node cerebro/missions/close-batch09-customer-lifecycle-group-v1.mjs
          node cerebro/missions/close-batch10-l2-resilience-group-v1.mjs
          node cerebro/missions/close-batch11-cmp001-v1.mjs
          node cerebro/missions/close-batch12-ops-group-v1.mjs
      - name: Execute Batch13 semantic closure
        run: node cerebro/missions/close-batch13-l6-tech-governance-v1.mjs
      - name: Strict179 requires 97 of 179 and Batch13 individual 12/12
        run: |
          set -euo pipefail
          node cerebro/missions/audit-179-autonomy-readiness-v1.mjs --out "$OUT"
          node <<'NODE'
          const fs=require('fs');
          const ids=['API-001','DEP-001','ARCH-001','DEBT-001','FF-001','CAN-001','LOCAL-001','MIG-001'];
          const r=JSON.parse(fs.readFileSync(process.env.OUT+'/AUTONOMY_READINESS_BASELINE.json'));
          const s=JSON.parse(fs.readFileSync(process.env.OUT+'/SUMMARY.json'));
          for(const id of ids){const x=r.engines.find(e=>e.engine_id===id);if(!x)throw new Error(id+' missing');if(x.gate_count!==12||x.gate_total!==12||!x.autonomous_prod_ready)throw new Error(`${id} ${x.gate_count}/12 ${(x.readiness_blockers||[]).join(',')}`);if((x.readiness_blockers||[]).length)throw new Error(id+' blockers remain');if(x.prod_execution_authorized!==false)throw new Error(id+' PROD authority drift');}
          if(s.autonomous_prod_ready<97)throw new Error(`Expected 97/179, got ${s.autonomous_prod_ready}`);
          if(s.prod_writes!==false||s.trading_touched!==false||s.additional_cost_eur!==0||s.factory_mutated!==false||s.registry_mutated!==false)throw new Error('safety drift');
          const q=JSON.parse(fs.readFileSync('cerebro/evidence/batch13-l6-tech-governance-autonomy-closure/2026-11-03/GROUP_SUMMARY.json'));
          if(q.status!=='GREEN'||q.certified_count!==8||q.prod_execution_authorized!==false||q.additional_cost_eur!==0)throw new Error('Batch13 scope overclaim');
          fs.writeFileSync(process.env.OUT+'/BATCH13_L6_TECH_GOVERNANCE_DIAGNOSTIC.json',JSON.stringify({engines:ids.map(id=>r.engines.find(e=>e.engine_id===id)),summary:s,scope:q},null,2)+'\n');
          NODE
      - name: Upload Batch13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-batch13-l6-tech-governance-${{ github.run_id }}
          path: |
            /tmp/cerebro-batch13-l6-tech-governance/
            cerebro/evidence/batch13-l6-tech-governance-autonomy-closure/
          if-no-files-found: error
          retention-days: 30
