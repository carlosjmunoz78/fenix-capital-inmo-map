name: PROD Preparation Build

on:
  push:
    branches:
      - prod-preparation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prod-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Enforce release credential readiness
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          failed=0
          if [ -n "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN_READY=yes"
          else
            echo "NOTION_TOKEN_READY=no"
            failed=1
          fi
          if [ -n "$PROD_SUPABASE_URL" ]; then
            echo "PROD_SUPABASE_URL_READY=yes"
          else
            echo "PROD_SUPABASE_URL_READY=no"
            failed=1
          fi
          if [ -n "$PROD_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "PROD_SUPABASE_PUBLISHABLE_KEY_READY=yes"
          else
            echo "PROD_SUPABASE_PUBLISHABLE_KEY_READY=no"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Required release credentials are incomplete."
            exit 2
          fi

      - name: Validate canonical Notion datasource read access
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 20 \
            -X POST \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H 'Notion-Version: 2025-09-03' \
            -H 'Content-Type: application/json' \
            --data '{"page_size":1}' \
            'https://api.notion.com/v1/data_sources/56665cb7-4277-4557-acff-f6fd46601e77/query')"
          if [ "$status" != "200" ]; then
            code="$(node -e "try{const x=require('fs').readFileSync(process.argv[1],'utf8');const j=JSON.parse(x);process.stdout.write(String(j.code||'unknown'))}catch{}" "$body")"
            echo "Canonical Notion datasource read failed: HTTP ${status}, code=${code:-unknown}" >&2
            exit 3
          fi
          echo 'CANONICAL_NOTION_DATASOURCE_READ=yes'

      - name: Install dependencies reproducibly
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Dependency versions
        run: npm list --depth=0

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build PRE-PROD-compatible code path
        run: npm run build

      - name: Browser QA
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npm run test:e2e

      - name: Validate isolated PROD build path with inert values
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: https://prod.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: prod-build-validation-placeholder
        run: npm run build

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-prod-preparation-playwright-report
          path: playwright-report
          if-no-files-found: ignore

# Validation only. Dummy PROD values prove the production code path builds without
# reusing PRE-PROD fallbacks. Release checks report credential presence and verify
# read-only access to the canonical Notion datasource without printing secret values
# or response content. No deployment, branch write or backend mutation occurs here.
