name: PROD Preparation Build

on:
  push:
    branches:
      - prod-preparation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prod-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Enforce release credential readiness
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          failed=0
          [ -n "$NOTION_TOKEN" ] && echo "NOTION_TOKEN_READY=yes" || { echo "NOTION_TOKEN_READY=no"; failed=1; }
          [ -n "$PROD_SUPABASE_URL" ] && echo "PROD_SUPABASE_URL_READY=yes" || { echo "PROD_SUPABASE_URL_READY=no"; failed=1; }
          [ -n "$PROD_SUPABASE_PUBLISHABLE_KEY" ] && echo "PROD_SUPABASE_PUBLISHABLE_KEY_READY=yes" || { echo "PROD_SUPABASE_PUBLISHABLE_KEY_READY=no"; failed=1; }
          [ "$failed" -eq 0 ] || { echo "Required release credentials are incomplete."; exit 2; }

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Dependency versions
        run: npm list --depth=0

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build isolated PROD candidate
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: https://prod.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: prod-build-validation-placeholder
        run: npm run build

      - name: PROD candidate browser QA
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
          FENIX_QA_PROD_CANDIDATE: '1'
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: https://prod.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: prod-build-validation-placeholder
        run: npx playwright test tests/prod-candidate-browser.spec.ts tests/prod-release-gate.spec.ts tests/prod-runtime-config.spec.ts tests/prod-canonical-write-contracts.spec.ts tests/bancos-prod-bank-code-regression.spec.ts tests/bank-contacts-prod-runtime.spec.ts

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-prod-preparation-playwright-report
          path: playwright-report
          if-no-files-found: ignore

# Validation-only PROD candidate gate. PRE-PROD is intentionally not started,
# repaired or used as a runtime dependency. Dummy values validate the production
# code path without contacting PROD backends or publishing any deployment.
