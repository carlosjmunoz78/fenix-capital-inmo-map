name: CEREBRO SALE FULL E2E REAL V1
on:
  workflow_dispatch:
  push:
    branches: [main, 'cerebro/lote3-sale-full-preprod-v1*']
    paths:
      - 'cerebro/runtime/sale-native-v1.mjs'
      - 'cerebro/runtime/sale-real-consumer-adoption-v1.mjs'
      - 'cerebro/tests/sale-native-v1.test.mjs'
      - 'cerebro/tests/sale-real-consumer-adoption-v1.test.mjs'
      - 'cerebro/registry/sale-real-consumer-adoption-v1.json'
      - 'cerebro/docs/SALE_REAL_CONSUMER_ADOPTION_V1_RUNBOOK.md'
      - 'cerebro/evidence/lote3-decision-gate-2026-10-17.json'
      - '.github/workflows/cerebro-sale-full-e2e-real-v1.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/sale-native-v1.mjs'
      - 'cerebro/runtime/sale-real-consumer-adoption-v1.mjs'
      - 'cerebro/tests/sale-native-v1.test.mjs'
      - 'cerebro/tests/sale-real-consumer-adoption-v1.test.mjs'
      - 'cerebro/registry/sale-real-consumer-adoption-v1.json'
      - 'cerebro/docs/SALE_REAL_CONSUMER_ADOPTION_V1_RUNBOOK.md'
      - 'cerebro/evidence/lote3-decision-gate-2026-10-17.json'
      - '.github/workflows/cerebro-sale-full-e2e-real-v1.yml'
permissions: {contents: read, actions: read}

jobs:
  strict-sale-real-consumer-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Canonical factory registry remains valid
        working-directory: cerebro
        run: npm run validate
      - name: Preserve already-certified LEAD and existing COM router
        run: |
          git diff --exit-code c68a2a41400f8f1fb371d8252a3cfe0e956cae04 -- \
            cerebro/runtime/lead-native-v1.mjs \
            cerebro/runtime/lead-real-consumer-adoption-v1.mjs \
            cerebro/communication/com-delivery-router-v1.mjs \
            cerebro/registry/lead-real-consumer-adoption-v1.json
      - name: SALE native plus strict adoption tests
        run: >-
          node --test
          cerebro/tests/sale-native-v1.test.mjs
          cerebro/tests/sale-real-consumer-adoption-v1.test.mjs
      - name: Execute strict SALE route
        run: |
          mkdir -p /tmp/cerebro-sale-real
          node cerebro/runtime/sale-real-consumer-adoption-v1.mjs \
            --company fenix \
            --workdir /tmp/cerebro-sale-real/state \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "${{ github.sha }}" \
            --out /tmp/cerebro-sale-real/report.json
      - name: Strict FULL E2E REAL gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cerebro-sale-real/report.json','utf8'));
          const required=['COM-001','NBA-001','C360-001','CRM-001','LRN-001','OBSERV-001','FINOPS-001'];
          const expected={
            'COM-001':'COM_ROUTE_READY','NBA-001':'SALES_NEXT_BEST_ACTION_READY','C360-001':'CUSTOMER360_SALES_SIGNAL_READY','CRM-001':'CRM_SALES_PROJECTION_READY',
            'LRN-001':'LRN_FEEDBACK_PERSISTED','OBSERV-001':'OBSERVABILITY_RECORDED','FINOPS-001':'FINOPS_ZERO_COST_RECORDED'
          };
          if(r.status!=='FULL_E2E_REAL_PREPROD'||r.full_e2e_real_preprod!==true)throw new Error('SALE strict FULL not green');
          if(JSON.stringify(r.required_consumers)!==JSON.stringify(required)||r.consumers.length!==required.length)throw new Error('consumer map mismatch');
          if(r.consumer_coverage!==1||r.functional_consumer_coverage!==1||r.missing_consumers.length||r.failed_consumers.length)throw new Error('semantic coverage incomplete');
          if(!required.every(id=>r.consumer_map?.[id]?.decision===expected[id]&&r.consumer_map[id].real_consumption===true&&r.consumer_map[id].outcome_hash))throw new Error('semantic consumer decision proof incomplete');
          if(r.independent_tribunal?.decision!=='PASS'||r.audit_green!==true)throw new Error('tribunal/audit gate failed');
          const rr=r.backup_rollback_rebuild;
          if(!rr?.backup_ready||!rr.rollback_green||!rr.rebuild_green||rr.rebuilt_consumer_count!==4||rr.applied_state_hash!==rr.rebuilt_state_hash)throw new Error('backup/rollback/rebuild gate failed');
          if(r.state_persisted!==true||r.semantic_state_persisted!==true||r.restartable!==true||r.idempotency_proven!==true||r.additional_cost_eur!==0)throw new Error('durability/idempotency/cost gate failed');
          const forbidden=['prod_authorized','prod_write_authorized','db_mutation_authorized','provider_write_authorized','crm_write_authorized','spend_authorized','trading_access','android_touched','external_code_execution'];
          if(forbidden.some(k=>r[k]!==false))throw new Error('authority expanded');
          console.log(JSON.stringify({status:'GREEN',capability:r.capability_id,consumer_count:r.consumers.length,semantic_outcome_hash:r.semantic_outcome_hash,outcome_hash:r.outcome_hash}));
          NODE
      - name: Registry candidate gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('cerebro/registry/sale-real-consumer-adoption-v1.json','utf8'));
          const required=['COM-001','NBA-001','C360-001','CRM-001','LRN-001','OBSERV-001','FINOPS-001'];
          if(r.capability_id!=='SALE-NATIVE'||r.engine_id!=='SALE-001'||r.environment!=='PREPROD'||JSON.stringify(r.required_consumers)!==JSON.stringify(required))throw new Error('registry identity/consumer map invalid');
          const g=r.strict_gates;
          if(!g.real_runtime_use_required||!g.semantic_state_change_required||!g.native_replay_verification_required||!g.evaluation_required||!g.independent_tribunal_required||!g.learning_feedback_required||!g.observability_required||!g.finops_required||!g.audit_required||!g.backup_rollback_rebuild_required||!g.idempotency_required||!g.crm_write_denied||!g.provider_write_denied||!g.direct_dispatch_denied)throw new Error('strict gate weakened');
          if(r.consumer_model?.receipt_only_forbidden!==true||r.producer?.crm_write_authorized!==false||r.producer?.external_code_execution!==false)throw new Error('consumer/producer policy invalid');
          const a=r.authority;if(a.prod_authorized||a.prod_write_authorized||a.db_mutation_authorized||a.provider_write_authorized||a.crm_write_authorized||a.spend_authorized||a.trading_access||a.android_touched||a.external_code_execution||a.additional_cost_eur!==0)throw new Error('authority/cost expanded');
          NODE
      - name: Upload strict SALE evidence
        uses: actions/upload-artifact@v4
        with:
          name: sale-full-e2e-real-v1-${{ github.run_id }}
          path: |
            /tmp/cerebro-sale-real/report.json
            /tmp/cerebro-sale-real/state
          retention-days: 30
          if-no-files-found: error
