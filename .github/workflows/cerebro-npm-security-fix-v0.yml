name: CEREBRO NPM Security Fix V0

on:
  push:
    branches:
      - 'cerebro/npm-security-fix-v0'
    paths:
      - '.github/workflows/cerebro-npm-security-fix-v0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gated-security-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cerebro/npm-security-fix-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked baseline
        run: npm ci
      - name: Apply only targeted non-major Vite security update
        run: npm install vite@8.3.5 --save-exact
      - name: Require zero high or critical npm vulnerabilities
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-after.json
          set -e
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('npm-audit-after.json','utf8'));
          const v=a.metadata?.vulnerabilities||{};
          console.log(JSON.stringify(v));
          if ((v.high||0)!==0 || (v.critical||0)!==0) process.exit(1);
          NODE
      - name: Build exact candidate
        run: npm run build
      - name: Full CEREBRO regression isolated per test file
        shell: bash
        run: |
          set -uo pipefail
          count=0
          failures=0
          failed_files=()
          while IFS= read -r test_file; do
            count=$((count + 1))
            tmp_output="$(mktemp)"
            echo "::group::${test_file}"
            if node --test "${test_file}" >"${tmp_output}" 2>&1; then
              cat "${tmp_output}"
            else
              failures=$((failures + 1))
              failed_files+=("${test_file}")
              cat "${tmp_output}"
              echo "::error file=${test_file},title=CEREBRO regression failure::Test file failed"
            fi
            rm -f "${tmp_output}"
            echo "::endgroup::"
          done < <(find cerebro/tests -maxdepth 1 -type f -name '*.test.mjs' -print | sort)
          if (( count == 0 || failures > 0 )); then
            printf 'Failed files (%d):\n' "${failures}"
            printf ' - %s\n' "${failed_files[@]}"
            exit 1
          fi
          echo "Executed ${count} CEREBRO test files."
      - name: Commit only package manifest and lockfile after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git diff -- package.json package-lock.json
          test -n "$(git status --porcelain -- package.json package-lock.json)"
          git config user.name 'CEREBRO Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'CEREBRO: update Vite to 8.3.5 after security gates'
          git push origin HEAD:cerebro/npm-security-fix-v0
