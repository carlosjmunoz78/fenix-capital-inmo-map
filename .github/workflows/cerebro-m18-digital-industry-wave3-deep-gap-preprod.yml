name: CEREBRO M18 DIGITAL INDUSTRY · PREPROD WAVE 3 DEEP GAP
run-name: M18 Digital Industry · deep verify 9 BUILD candidates

on:
  workflow_dispatch:
  push:
    branches:
      - cerebro/m18-digital-industry-preprod-20261030
    paths:
      - 'cerebro/digital-build/m18-deep-gap-verifier-v1.mjs'
      - 'cerebro/tests/m18-deep-gap-verifier-v1.test.mjs'
      - 'cerebro/evidence/M18_DIGITAL_INDUSTRY_WAVE2_CROSSWALK_2026-10-30.json'
      - '.github/workflows/cerebro-m18-digital-industry-wave3-deep-gap-preprod.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-m18-digital-industry-wave3-deep-gap-preprod
  cancel-in-progress: false

env:
  CEREBRO_SUPERVISOR_ENV: PREPROD
  CEREBRO_ALLOW_PAID_FANOUT: 'NO'
  CEREBRO_PROD_WRITE: 'false'
  CEREBRO_TRADING_ACCESS: 'false'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deep verifier contract tests
        run: node --test cerebro/tests/m18-deep-gap-verifier-v1.test.mjs
      - name: Validate Wave2 receipt and guards
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('cerebro/evidence/M18_DIGITAL_INDUSTRY_WAVE2_CROSSWALK_2026-10-30.json','utf8'));
          if(p.environment!=='PREPROD'||p.final_decisions_made!==0) throw new Error('Wave2 receipt invalid');
          if(p.BUILD_CANDIDATES_REQUIRING_DEEP_VERIFICATION.length!==9) throw new Error('expected exactly 9 deep candidates');
          if(p.safety.prod_write!==false||p.safety.paid_ai!==false||p.safety.trading!==false||p.safety.additional_cost_eur!==0) throw new Error('safety mismatch');
          console.log(JSON.stringify({ok:true,candidates:9,prod_write:false,paid_ai:false,trading:false,additional_cost_eur:0}));
          NODE

  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        capability:
          - accessibility_factory
          - funnel_and_landing_factory
          - legal_compliance_factory
          - localization_factory
          - marketplace_factory
          - pwa_factory
          - saas_factory
          - support_factory
          - wordpress_factory
    steps:
      - uses: actions/checkout@v4
      - name: Deep verify physical implementation and governed surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/m18-wave3
          output="$(node cerebro/digital-build/m18-deep-gap-verifier-v1.mjs --capability=${{ matrix.capability }} --out=artifacts/m18-wave3/${{ matrix.capability }}.json)"
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -q '"ok":true'
          printf '%s' "$output" | grep -q '"final_build_decision":false'
          printf '%s' "$output" | grep -q '"prod_write":false'
          printf '%s' "$output" | grep -q '"paid_ai":false'
          printf '%s' "$output" | grep -q '"trading":false'
          test -s artifacts/m18-wave3/${{ matrix.capability }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: m18-wave3-${{ matrix.capability }}-${{ github.run_id }}
          path: artifacts/m18-wave3/${{ matrix.capability }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: m18-wave3-*-${{ github.run_id }}
          path: artifacts/m18-wave3-input
          merge-multiple: true
      - name: Aggregate deep verification
        shell: bash
        run: |
          set -euo pipefail
          count="$(find artifacts/m18-wave3-input -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$count" -eq 9
          node cerebro/digital-build/m18-deep-gap-verifier-v1.mjs --aggregate=artifacts/m18-wave3-input --out=artifacts/M18_WAVE3_DEEP_GAP_VERIFICATION.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('artifacts/M18_WAVE3_DEEP_GAP_VERIFICATION.json','utf8'));
          if(a.candidate_count!==9||a.final_build_decisions!==0) throw new Error('Wave3 aggregate invalid');
          if(a.safety.prod_write!==false||a.safety.paid_ai!==false||a.safety.trading!==false||a.safety.additional_cost_eur!==0) throw new Error('Wave3 safety mismatch');
          console.log(JSON.stringify({ok:true,candidates:a.candidate_count,states:a.verified_states,dispositions:a.disposition_candidates,build_pending:a.build_pending_business_value,final_build_decisions:0,prod_write:false,paid_ai:false,trading:false,additional_cost_eur:0}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: m18-wave3-aggregate-${{ github.run_id }}
          path: artifacts/M18_WAVE3_DEEP_GAP_VERIFICATION.json
          if-no-files-found: error
          retention-days: 14

  summary:
    needs: aggregate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Safety summary
        shell: bash
        run: |
          echo 'M18 Wave 3 deeply verifies the 9 Wave2 BUILD candidates before FACT-001 may scaffold anything.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No BUILD decision is made here. PROD write: false | Paid AI: false | Trading: false | additional spend: 0 EUR.' >> "$GITHUB_STEP_SUMMARY"
