name: CEREBRO Creative Studio V2.7 Generative PREPROD

on:
  push:
    branches:
      - 'cerebro/creative-v27-generative-preprod-2026-10-25'
    paths:
      - 'cerebro/runtime/creative-generative-router-v27.mjs'
      - 'cerebro/runtime/creative-voice-chatterbox-v27.py'
      - 'cerebro/runtime/creative-voice-delivery-v27.mjs'
      - '.github/workflows/cerebro-creative-v27-generative-preprod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generative-router-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe generative capability fail-closed
        env:
          CEREBRO_ENVIRONMENT: PREPROD
          CEREBRO_COMPANY_ID: fenix
        run: |
          mkdir -p .cerebro-v27
          node cerebro/runtime/creative-generative-router-v27.mjs | tee .cerebro-v27/generative-router.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('.cerebro-v27/generative-router.json', 'utf8'));
          if (r.publish_authorized !== false) throw new Error('publish must remain blocked');
          if (r.promotion_eligible !== false) throw new Error('promotion must remain blocked');
          if (r.additional_recurring_cost_eur !== 0) throw new Error('recurring cost must remain zero');
          if (!['READY_PREPROD', 'CAPABILITY_BLOCKED'].includes(r.state)) throw new Error(`unexpected state ${r.state}`);
          if (r.state === 'CAPABILITY_BLOCKED' && r.human_required !== false) throw new Error('capability absence must not be mislabeled HUMAN_REQUIRED');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-v27-generative-capability-${{ github.sha }}
          path: .cerebro-v27/generative-router.json
          retention-days: 7

  chatterbox-es-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
      - name: Install Chatterbox V3 pinned upstream
        run: pip install 'git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2'
      - name: Generate physical Spanish V3 voice candidate
        env:
          CEREBRO_TTS_DEVICE: cpu
        run: |
          mkdir -p .cerebro-v27/voice
          python cerebro/runtime/creative-voice-chatterbox-v27.py \
            --text 'Para. Si una casa te encanta, no dejes que la prisa decida por ti. Primero comprobamos si la operación encaja y después decides con datos.' \
            --output .cerebro-v27/voice/chatterbox-v3-es-raw.wav \
            --manifest .cerebro-v27/voice/raw-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('.cerebro-v27/voice/raw-manifest.json').read_text())
          assert m['engine'] == 'CHATTERBOX_MTL_V3'
          assert m['language_id'] == 'es'
          assert m['publish_authorized'] is False
          assert m['promotion_eligible'] is False
          assert m['additional_recurring_cost_eur'] == 0
          assert m['sample_rate_hz'] > 0
          assert m['duration_seconds'] > 1
          PY
      - name: Master physical voice delivery
        run: |
          node cerebro/runtime/creative-voice-delivery-v27.mjs \
            .cerebro-v27/voice/chatterbox-v3-es-raw.wav \
            .cerebro-v27/voice/chatterbox-v3-es-master-48k-stereo.wav \
            .cerebro-v27/voice/master-report.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('.cerebro-v27/voice/master-report.json', 'utf8'));
          if (r.physical_output.sample_rate_hz !== 48000) throw new Error('master sample rate must be 48 kHz');
          if (r.physical_output.channels !== 2) throw new Error('master must be stereo');
          if (r.measured_output.integrated_lufs === null || Math.abs(r.measured_output.integrated_lufs - (-16)) > 0.6) throw new Error(`master loudness out of gate: ${r.measured_output.integrated_lufs}`);
          if (r.measured_output.true_peak_dbfs === null || r.measured_output.true_peak_dbfs > -1.3) throw new Error(`master true peak out of gate: ${r.measured_output.true_peak_dbfs}`);
          if (r.raw_preserved !== true) throw new Error('raw audio must remain preserved');
          if (r.publish_authorized !== false || r.promotion_eligible !== false) throw new Error('voice master must remain PREPROD');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-v27-chatterbox-es-${{ github.sha }}
          path: .cerebro-v27/voice/
          retention-days: 7
