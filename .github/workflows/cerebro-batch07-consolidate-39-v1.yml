# Reproducible consolidation: AUD-001 + SELF-001 must coexist in one Strict179 runner.
name: CEREBRO Batch07 Consolidate 39 V1

on:
  push:
    branches: [cerebro/close-179-per-engine-autonomy-v1-20261102]
    paths:
      - '.github/workflows/cerebro-batch07-consolidate-39-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT: /tmp/cerebro-batch07-consolidate39

jobs:
  consolidate-39:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify isolated branch
        run: test "$GITHUB_REF_NAME" = 'cerebro/close-179-per-engine-autonomy-v1-20261102'
      - name: Validate registry and factory
        run: |
          set -euo pipefail
          cd cerebro
          npm run validate
          node factory-v1.mjs validate --registry registry/engine-registry.v1.json
      - name: Rebuild complete certified Batch07 chain
        run: |
          set -euo pipefail
          node cerebro/missions/close-orch-hex-autonomy-v1.mjs
          node cerebro/missions/close-batch07-iam001-v1.mjs
          node cerebro/missions/close-batch07-job-route-v1.mjs
          node cerebro/missions/close-batch07-observ001-v1.mjs
          node cerebro/missions/close-batch07-evt001-v1.mjs
          node cerebro/missions/close-batch07-qa001-v1.mjs
          node cerebro/missions/close-batch07-cmd001-v1.mjs
          node cerebro/missions/close-batch07-chat001-v1.mjs
          node cerebro/missions/close-batch07-ctx001-v1.mjs
          node cerebro/missions/close-batch07-actgw001-v1.mjs
          node cerebro/missions/close-batch07-self001-v1.mjs
          node cerebro/missions/close-batch07-aud001-v1.mjs
      - name: Strict179 requires simultaneous 39 of 179
        run: |
          set -euo pipefail
          node cerebro/missions/audit-179-autonomy-readiness-v1.mjs --out "$OUT"
          node <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync(process.env.OUT+'/AUTONOMY_READINESS_BASELINE.json','utf8'));
          const s=JSON.parse(fs.readFileSync(process.env.OUT+'/SUMMARY.json','utf8'));
          const ids=['ORCH-001','HEX-001','IAM-001','JOB-001','ROUTE-001','OBSERV-001','EVT-001','QA-001','CMD-001','CHAT-001','CTX-001','ACTGW-001','SELF-001','AUD-001'];
          const selected=ids.map(id=>report.engines.find(x=>x.engine_id===id));
          if(selected.some(x=>!x)) throw new Error('Selected engine missing');
          for(const e of selected){if(e.gate_count!==12||e.gate_total!==12||e.autonomous_prod_ready!==true)throw new Error(`${e.engine_id} ${e.gate_count}/${e.gate_total}: ${(e.readiness_blockers||[]).join(',')}`)}
          if(s.autonomous_prod_ready<39) throw new Error(`Expected 39/179, got ${s.autonomous_prod_ready}`);
          if(s.prod_writes!==false||s.trading_touched!==false||s.additional_cost_eur!==0||s.factory_mutated!==false||s.registry_mutated!==false) throw new Error('safety/inventory drift');
          fs.writeFileSync(process.env.OUT+'/BATCH07_CONSOLIDATED_39.json',JSON.stringify({engines:selected,summary:s},null,2)+'\n');
          NODE
      - name: Upload consolidated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-batch07-consolidated39-${{ github.run_id }}
          path: |
            /tmp/cerebro-batch07-consolidate39/
            cerebro/evidence/orch-hex-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-iam001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-job-route-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-observ001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-evt001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-qa001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-cmd001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-chat001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-ctx001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-actgw001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-self001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-aud001-autonomy-closure/2026-11-02/
          if-no-files-found: error
          retention-days: 30
