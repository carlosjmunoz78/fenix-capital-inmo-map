name: UMS001 ONE real LinkedIn Seedream4 alternate generator LAB prepaid
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'cerebro/media-studio/v2/requests/UMS001_LINKEDIN_SEEDREAM_ONE_SHOT_LAUNCH_20261111.json'
permissions:
  contents: write
concurrency:
  group: ums001-alternative-seedream-linkedin-20261111-once
  cancel-in-progress: false
jobs:
  one-prepaid-image-no-publication:
    if: >-
      github.repository == 'carlosjmunoz78/fenix-capital-inmo-map' &&
      github.event.pull_request.number == 45 &&
      github.head_ref == 'cerebro/ums001-visual-learning-no-reference-lab-20261111' &&
      github.event.pull_request.base.ref == 'cerebro/ums-replicate-flux-paid-lab-v0-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Reject all triggers except signed one-shot new-model owner intent
        shell: bash
        run: |
          set -euo pipefail
          FILE=cerebro/media-studio/v2/requests/UMS001_LINKEDIN_SEEDREAM_ONE_SHOT_LAUNCH_20261111.json
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 1
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$FILE"
          test "$(git rev-parse HEAD:cerebro/media-studio/v2/runtime/ums001_seedream_linkedin_isolated_lab_v0.py)" = 8d62bd310def510310acfb7d0623439bfc4e4808
          test "$(git rev-parse HEAD:cerebro/media-studio/v2/requests/UMS001_LINKEDIN_SEEDREAM_4_16X9_ONCE_LAB_V0.json)" = 1699981075a9ce92d12a42a95bccefe02004dee9
          test "$(git rev-parse HEAD:cerebro/media-studio/v2/runtime/ums001_multichannel_prompt_owner_lab_v1.py)" = d169bd1af12ded46d7b61bce79a81c60ab416ad6
          test "$(git rev-parse HEAD:cerebro/media-studio/v2/requests/UMS001_MULTICHANNEL_IMAGE_11_20261111.json)" = 59f6e8bb4886b858fe12a08bc6c1994962b5e707
          test "$(git rev-parse HEAD:cerebro/media-studio/v2/runtime/ums001_deepseek_primary_auto_lab_v1.py)" = 2b36f5569d999d2262d2bab103de7e9a5568b9dc
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('cerebro/media-studio/v2/requests/UMS001_LINKEDIN_SEEDREAM_ONE_SHOT_LAUNCH_20261111.json').read_text())
          assert j=={"launch_id":"UMS001-MULTI11-LINKEDIN-SEEDREAM4-20261111-FIRST-ONLY",
           "company_id":"fenix","engine_id":"UMS-001","environment":"LAB",
           "item_id":"LI-FEED-01","max_predictions":1,"max_model_budget_usd":0.03,
           "max_deepseek_calls":1,"max_deepseek_usd":0.02,
           "prepaid_verified":True,"autoreload_off":True,"publish":False,"run_once":True}
          PY
      - name: Offline source and safety contract before contacting providers
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          python3 cerebro/media-studio/v2/tests/test_ums001_seedream_linkedin_isolated_lab_v0.py -v
          python3 cerebro/media-studio/v2/runtime/ums001_seedream_linkedin_isolated_lab_v0.py --preflight
      - name: Execute exactly one new Seedream model image then independent DeepSeek Vision QA
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.CEREBRO_UMS001_DEEPSEEK_API_KEY }}
          GH_TOKEN_FOR_LAB: ${{ secrets.GITHUB_TOKEN }}
          UMS001_SEEDREAM_ONE_SHOT_GATE: PREPAID_OWNER_ONE_LINKEDIN_CANARY_20261111
        run: python3 cerebro/media-studio/v2/runtime/ums001_seedream_linkedin_isolated_lab_v0.py --execute
      - name: Preserve actual raw image, original CEREBRO prompt, model QA and hash even on reject
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ums001-alt-seedream-linkedin-one-real-picture-lab
          path: ${{ runner.temp }}/ums001-seedream-linkedin/
          if-no-files-found: warn
          retention-days: 14
      - name: Assert no production and no hidden spending
        if: always()
        run: |
          echo 'MAX 1 Seedream4 prediction, $0.03 model estimate + max $0.02 DeepSeek.'
          echo 'NO new subscription, no auto reload, no retry, no social publishing, no App, no CRM, no PROD.'
          echo 'Image quality can only pass after physical pixel review, verified official Fénix brand and rights.'
