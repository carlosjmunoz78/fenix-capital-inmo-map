name: CEREBRO Skill Autonomy Action Application V1

on:
  pull_request:
    paths:
      - 'cerebro/skills/skill-autonomy-action-application-v1.mjs'
      - 'cerebro/skills/skill-autonomy-safe-action-worker-v1.mjs'
      - 'cerebro/skills/skill-autoloop-safe-handler.mjs'
      - 'cerebro/tests/skill-autonomy-action-application-v1.test.mjs'
      - 'cerebro/tests/skill-autonomy-safe-action-worker-v1.test.mjs'
      - 'cerebro/tests/skill-autoloop-safe-handler.test.mjs'
      - '.github/workflows/cerebro-skill-autonomy-action-application-v1.yml'
      - '.github/workflows/cerebro-skill-autonomy-safe-action-worker-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'cerebro/skills/skill-autonomy-action-application-v1.mjs'
      - 'cerebro/skills/skill-autonomy-safe-action-worker-v1.mjs'
      - 'cerebro/skills/skill-autoloop-safe-handler.mjs'
      - 'cerebro/tests/skill-autonomy-action-application-v1.test.mjs'
      - 'cerebro/tests/skill-autonomy-safe-action-worker-v1.test.mjs'
      - 'cerebro/tests/skill-autoloop-safe-handler.test.mjs'
      - '.github/workflows/cerebro-skill-autonomy-action-application-v1.yml'
      - '.github/workflows/cerebro-skill-autonomy-safe-action-worker-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-autonomy-action-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-action-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/skill-autonomy-action-application-v1.test.mjs cerebro/tests/skill-autonomy-safe-action-worker-v1.test.mjs cerebro/tests/skill-autoloop-safe-handler.test.mjs cerebro/tests/skill-capability-autonomy-closure-v1.test.mjs cerebro/tests/skill-autoloop-autonomy-decision.test.mjs cerebro/tests/skill-promotion-readiness.test.mjs

  existing-factory-and-evolution-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/fact001-request-runner.test.mjs cerebro/tests/fact001-autofactory-workflow.test.mjs cerebro/tests/skill-capability-evolution.test.mjs cerebro/tests/skill-capability-evolution-bridge.test.mjs cerebro/tests/evaluation-tribunal.test.mjs

  full-cerebro-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs

  main-baseline-full-cerebro:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs
