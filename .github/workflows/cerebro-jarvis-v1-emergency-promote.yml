name: JARVIS Work Final PROD Promote

on:
  push:
    branches:
      - cerebro/jarvis-work-codex-complete-20261102
    paths:
      - '.github/workflows/cerebro-jarvis-v1-emergency-promote.yml'

permissions:
  contents: write

concurrency:
  group: jarvis-work-final-prod-promote
  cancel-in-progress: false

jobs:
  verify-build-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_FENIX_ENV: prod
      EXPECTED_PROD_SHA: 415ba61e692403cc8413c48b30698d6019a4594d
      EXPECTED_PROD_SOURCE_SHA: e9cc7e2134b7cce75e0b6391360c317999eab4d8
      EXPECTED_MAIN_SHA: 71ef399d41a6a22ef717e242eca5485a38e08577
      MAIN_FRONTEND_BASE_SHA: 476ce30152554c944a94282f39ddc5ec368b7879
      ROLLBACK_BRANCH: backup/emergency-pages-jarvis-clean-home-before-20261102
    steps:
      - name: Checkout isolated final Jarvis Work source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current PROD, current main and rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main emergency-pages "$ROLLBACK_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/emergency-pages)" = "$EXPECTED_PROD_SHA"
          test "$(git rev-parse "origin/$ROLLBACK_BRANCH")" = "$EXPECTED_PROD_SHA"
          test "$(git show origin/emergency-pages:CNAME | tr -d '\r\n')" = 'app.fenixcapital.es'
          test "$(git show origin/emergency-pages:PROD_SOURCE_SHA.txt | tr -d '\r\n')" = "$EXPECTED_PROD_SOURCE_SHA"
          git cat-file -e origin/emergency-pages:404.html
          git cat-file -e origin/emergency-pages:.nojekyll
          git cat-file -e origin/emergency-pages:browser-ergonomics-v1.css
          git cat-file -e origin/emergency-pages:browser-ergonomics-v1.js
          git cat-file -e "origin/$ROLLBACK_BRANCH:404.html"
          git cat-file -e "origin/$ROLLBACK_BRANCH:.nojekyll"
          git cat-file -e "origin/$ROLLBACK_BRANCH:browser-ergonomics-v1.css"
          git cat-file -e "origin/$ROLLBACK_BRANCH:browser-ergonomics-v1.js"

      - name: Verify main has no newer frontend delta to preserve
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only "$MAIN_FRONTEND_BASE_SHA" origin/main -- src public package.json package-lock.json index.html vite.config.ts tsconfig.json playwright.config.ts 2>/dev/null || true)"
          if [ -n "$changed" ]; then
            echo 'MAIN_FRONTEND_DELTA_DETECTED'
            echo "$changed"
            exit 1
          fi
          echo 'MAIN_FRONTEND_DELTA_NONE'

      - name: Rollback rehearsal without touching PROD
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jarvis-rollback-rehearsal
          mkdir -p /tmp/jarvis-rollback-rehearsal
          git archive "origin/$ROLLBACK_BRANCH" | tar -x -C /tmp/jarvis-rollback-rehearsal
          test "$(cat /tmp/jarvis-rollback-rehearsal/CNAME | tr -d '\r\n')" = 'app.fenixcapital.es'
          test "$(cat /tmp/jarvis-rollback-rehearsal/PROD_SOURCE_SHA.txt | tr -d '\r\n')" = "$EXPECTED_PROD_SOURCE_SHA"
          cmp /tmp/jarvis-rollback-rehearsal/index.html /tmp/jarvis-rollback-rehearsal/404.html
          test -s /tmp/jarvis-rollback-rehearsal/browser-ergonomics-v1.css
          test -s /tmp/jarvis-rollback-rehearsal/browser-ergonomics-v1.js
          test -d /tmp/jarvis-rollback-rehearsal/assets
          echo 'ROLLBACK_REHEARSAL_GREEN'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-run final Jarvis Work contract gate
        shell: bash
        run: |
          set -euo pipefail
          test -f src/JarvisEmbeddedConsole.tsx
          test -f src/JarvisWorkTools.tsx
          test -f src/JarvisGitAdvancedPanel.tsx
          test -f src/jarvisGitInspectApi.ts
          test -f src/JarvisOperativaComposerPortal.tsx
          test -f src/JarvisVisibleLanguageGuard.tsx
          test -f src/jarvisWorkApi.ts
          test -f src/jarvis-work-v2.css
          test -f src/jarvis-work-premium-final.css
          test -f src/jarvis-work-tools.css
          test -f supabase/functions/jarvis-git-gateway-v1-preprod/index.ts
          grep -q "JarvisEmbeddedConsole" src/CerebroJarvisWorkConsole.tsx
          grep -q "CerebroConsoleShell" src/JarvisEmbeddedConsole.tsx
          grep -q "createJarvisProject" src/CerebroJarvisWorkConsole.tsx
          grep -q "importJarvisProject" src/CerebroJarvisWorkConsole.tsx
          grep -q "renameJarvisProject" src/CerebroJarvisWorkConsole.tsx
          grep -q "focusPane('left')" src/CerebroJarvisWorkConsole.tsx
          grep -q "focusPane('center')" src/CerebroJarvisWorkConsole.tsx
          grep -q "focusPane('right')" src/CerebroJarvisWorkConsole.tsx
          grep -q "setLayout(DEFAULT_LAYOUT)" src/CerebroJarvisWorkConsole.tsx
          grep -q "jarvis-home-shell" src/CerebroJarvisWorkConsole.tsx
          grep -q "Inicio de Jarvis" src/CerebroJarvisWorkConsole.tsx
          grep -q "storageKey(LAYOUT_KEY,selectedProjectId)" src/CerebroJarvisWorkConsole.tsx
          grep -q "JarvisOperativaComposerPortal" src/JarvisEmbeddedConsole.tsx
          grep -q "operativa-jarvis-composer" src/JarvisOperativaComposerPortal.tsx
          grep -q "JarvisWorkTools" src/JarvisWorkbenchPortal.tsx
          grep -q "JarvisGitAdvancedPanel" src/JarvisWorkTools.tsx
          grep -q "BrowserHandoff" src/JarvisWorkTools.tsx
          grep -q "JarvisVisibleLanguageGuard" src/CerebroConsoleHost.tsx
          grep -q "INSPECT_OPS" supabase/functions/jarvis-git-gateway-v1-preprod/index.ts
          grep -q "'STATUS','DIFF','CI_READ','COMPARE'" supabase/functions/jarvis-git-gateway-v1-preprod/index.ts
          grep -q "JARVIS Work" src/CerebroJarvisWorkConsole.tsx
          grep -q "VISIBLE_REPLACEMENTS" src/JarvisEmbeddedConsole.tsx
          echo 'JARVIS_WORK_FINAL_CONTRACT_GREEN'

      - name: Install Chromium for physical QA
        run: npx playwright install --with-deps chromium

      - name: Re-run final visual acceptance before PROD
        env:
          VITE_FENIX_ENV: preprod
          VITE_SUPABASE_URL: https://hnqlnvakzaywtafeiybt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uvtiidkBBkFRt2K34so27g_JpCbMUZw
          PLAYWRIGHT_SKIP_BUILD: '0'
        run: npx playwright test tests/cerebro-jarvis-v1-preview.spec.ts --project=desktop-chromium

      - name: Build production bundle
        env:
          VITE_FENIX_ENV: prod
        run: npm run build

      - name: Verify deployable output and inherited ergonomics
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          grep -q '/assets/' dist/index.html
          test -f dist/browser-ergonomics-v1.css
          test -f dist/browser-ergonomics-v1.js
          cmp public/browser-ergonomics-v1.css dist/browser-ergonomics-v1.css
          cmp public/browser-ergonomics-v1.js dist/browser-ergonomics-v1.js

      - name: Promote final Jarvis Work build to PROD snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin emergency-pages "$ROLLBACK_BRANCH"
          test "$(git rev-parse origin/emergency-pages)" = "$EXPECTED_PROD_SHA"
          test "$(git rev-parse "origin/$ROLLBACK_BRANCH")" = "$EXPECTED_PROD_SHA"
          rm -rf /tmp/fenix-emergency-pages
          git worktree add -B emergency-pages-deploy /tmp/fenix-emergency-pages origin/emergency-pages
          find /tmp/fenix-emergency-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a dist/. /tmp/fenix-emergency-pages/
          cp dist/index.html /tmp/fenix-emergency-pages/404.html
          printf 'app.fenixcapital.es\n' > /tmp/fenix-emergency-pages/CNAME
          printf '%s\n' "$GITHUB_SHA" > /tmp/fenix-emergency-pages/PROD_SOURCE_SHA.txt
          touch /tmp/fenix-emergency-pages/.nojekyll
          test "$(cat /tmp/fenix-emergency-pages/CNAME | tr -d '\r\n')" = 'app.fenixcapital.es'
          test "$(cat /tmp/fenix-emergency-pages/PROD_SOURCE_SHA.txt | tr -d '\r\n')" = "$GITHUB_SHA"
          cmp /tmp/fenix-emergency-pages/index.html /tmp/fenix-emergency-pages/404.html
          cmp public/browser-ergonomics-v1.css /tmp/fenix-emergency-pages/browser-ergonomics-v1.css
          cmp public/browser-ergonomics-v1.js /tmp/fenix-emergency-pages/browser-ergonomics-v1.js
          cd /tmp/fenix-emergency-pages
          git add -A
          git commit -m 'deploy(prod): final Jarvis clean-home workspace snapshot'
          git push origin HEAD:emergency-pages
          echo "PROD_DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify remote PROD postcondition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin emergency-pages "$ROLLBACK_BRANCH"
          test "$(git rev-parse "origin/$ROLLBACK_BRANCH")" = "$EXPECTED_PROD_SHA"
          test "$(git show origin/emergency-pages:CNAME | tr -d '\r\n')" = 'app.fenixcapital.es'
          test "$(git show origin/emergency-pages:PROD_SOURCE_SHA.txt | tr -d '\r\n')" = "$GITHUB_SHA"
          git cat-file -e origin/emergency-pages:404.html
          git cat-file -e origin/emergency-pages:.nojekyll
          git cat-file -e origin/emergency-pages:browser-ergonomics-v1.css
          git cat-file -e origin/emergency-pages:browser-ergonomics-v1.js
          test "$(git rev-parse origin/emergency-pages)" != "$EXPECTED_PROD_SHA"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "PROD_SHA=$(git rev-parse origin/emergency-pages)"
          echo 'JARVIS_WORK_FINAL_PROD_PROMOTION_GREEN'
