name: UMS001 Autonomous Prompt Factory IGC202603 zero cost QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ums001-autonomous-prompt-factory-lab-v0.yml'
      - 'cerebro/media-studio/v2/runtime/ums001_prompt_forge_lab_v0.py'
      - 'cerebro/media-studio/v2/tests/test_ums001_prompt_forge_lab_v0.py'
      - 'cerebro/media-studio/v2/requests/UMS001_IGC202603_STRUCTURED_CREATIVE_BRIEF_LAB_V0.json'
      - 'cerebro/media-studio/v2/qa/UMS001_IGC202603_TRANSFER_LEARNINGS_FROM_IGC202601.json'
permissions:
  contents: read
concurrency:
  group: ums001-prompt-factory-lab-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate-own-prompts:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'cerebro/ums-replicate-flux-paid-lab-v0-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test autonomous prompt generation, safety and feedback memory without paid APIs
        run: |
          python3 -m py_compile cerebro/media-studio/v2/runtime/ums001_prompt_forge_lab_v0.py
          python3 cerebro/media-studio/v2/tests/test_ums001_prompt_forge_lab_v0.py -v
      - name: CEREBRO composes six original image prompts from structured request and prior QA
        run: >-
          python3 cerebro/media-studio/v2/runtime/ums001_prompt_forge_lab_v0.py
          --brief cerebro/media-studio/v2/requests/UMS001_IGC202603_STRUCTURED_CREATIVE_BRIEF_LAB_V0.json
          --feedback cerebro/media-studio/v2/qa/UMS001_IGC202603_TRANSFER_LEARNINGS_FROM_IGC202601.json
          --out "${{ runner.temp }}/ums001-prompt-factory/IGC202603_PROMPTS_AUTOGENERATED.json"
      - name: Preserve prompts and explainable learning receipts
        uses: actions/upload-artifact@v4
        with:
          name: ums001-igc202603-six-autonomous-prompts-lab
          path: ${{ runner.temp }}/ums001-prompt-factory/IGC202603_PROMPTS_AUTOGENERATED.json
          retention-days: 14
          if-no-files-found: error
      - name: Publish-safe receipt
        run: |
          echo 'Prompt generator: deterministic CEREBRO engine'
          echo 'DeepSeek used: NO. New language API cost EUR 0. Replicate predictions: 0.'
          echo 'Requires independent creative QA and paid image gate before any publication.'
