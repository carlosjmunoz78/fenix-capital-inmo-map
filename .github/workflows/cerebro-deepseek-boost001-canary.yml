name: CEREBRO DeepSeek BOOST-001 Tiny Canary

# CUT35: branch-scoped safe override only; main workflow is unchanged.
# Run manually only with ref cerebro/jarvis-deepseek-weekend-lab-20261106.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-cut35-isolated-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  one-shot-lab:
    if: github.ref == 'refs/heads/cerebro/jarvis-deepseek-weekend-lab-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: JARVIS_DEEPSEEK_LAB
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      JARVIS_LAB_SMOKE_APPROVED: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed authorization gate (no secrets printed)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/cerebro/jarvis-deepseek-weekend-lab-20261106'
          test "$JARVIS_LAB_SMOKE_APPROVED" = 'YES'
          test -n "$DEEPSEEK_API_KEY"
      - name: Offline only LAB gate
        run: node --test zeus/jarvis/training/*.test.mjs
      - name: Single DeepSeek paid LAB canary (maximum 32 output tokens)
        run: node zeus/jarvis/training/jarvis-deepseek-lab-canary.mjs
