name: CEREBRO DeepSeek BOOST-001 Tiny Canary

on:
  push:
    branches:
      - cerebro/jarvis-boost-001-bootstrap-20261026
    paths:
      - '.github/workflows/cerebro-deepseek-boost001-canary.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-deepseek-boost001-canary
  cancel-in-progress: false

jobs:
  tiny-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CEREBRO_ALLOW_PAID_CANARY: 'YES'
      DEEPSEEK_CANARY_PROJECTED_EUR: '0.01'
    steps:
      - name: Checkout BOOST-001 candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify secret reference without exposing value
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "DEEPSEEK_API_KEY_MISSING"; exit 1; }
          echo "DEEPSEEK_API_KEY_PRESENT=true"

      - name: DeepSeek provider and cost guards
        run: node --test cerebro/tests/deepseek-budget-guard-v0.test.mjs cerebro/tests/deepseek-cost-v0.test.mjs cerebro/tests/deepseek-provider-v0.test.mjs

      - name: Paid tiny canary
        run: node cerebro/jarvis/boost-001/canary.mjs
