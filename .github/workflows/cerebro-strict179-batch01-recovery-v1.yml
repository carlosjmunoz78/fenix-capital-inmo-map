name: CEREBRO Strict179 Batch01 Recovery V1

on:
  push:
    branches:
      - 'cerebro/close-179-per-engine-autonomy-v1-20261102'
    paths:
      - 'cerebro/missions/strict179-batch01-recovery-gates-v1.mjs'
      - '.github/workflows/cerebro-strict179-batch01-recovery-v1.yml'
      - 'cerebro/evidence/backup/STRICT179_BATCH01_FACT001_LRN001_BACKUP_2026-11-02.json'
      - 'cerebro/evidence/rollback/STRICT179_BATCH01_FACT001_LRN001_ROLLBACK_2026-11-02.json'
      - 'cerebro/evidence/rebuild/STRICT179_BATCH01_FACT001_LRN001_REBUILD_2026-11-02.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-strict179-batch01-recovery-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-recovery-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch durable LRN PREPROD state read-only
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/cerebro-rsi-learning-state-v0:refs/remotes/origin/cerebro-rsi-learning-state-v0'

      - name: Test FACT-001 and LRN-001 recovery gates
        run: |
          set -euo pipefail
          node cerebro/missions/strict179-batch01-recovery-gates-v1.mjs --out /tmp/strict179-batch01
          cat /tmp/strict179-batch01/SUMMARY.json

      - name: Re-run strict 179x12 readiness audit
        run: |
          set -euo pipefail
          node cerebro/missions/audit-179-autonomy-readiness-v1.mjs --out /tmp/strict179-readiness
          cat /tmp/strict179-readiness/SUMMARY.json

      - name: Assert no repository mutation
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'GREEN: read-only PREPROD recovery verification; no PROD writes, Trading, secrets or paid fallback.'

      - name: Upload immutable recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: strict179-batch01-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/strict179-batch01/SUMMARY.json
            /tmp/strict179-readiness/SUMMARY.json
            /tmp/strict179-readiness/AUTONOMY_READINESS_BASELINE.json
          if-no-files-found: error
          retention-days: 30
