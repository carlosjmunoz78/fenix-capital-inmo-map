name: Operativa Cockpit V3 · Visual LAB (no deploy)
on:
  push:
    branches:
      - cerebro/operativa-cockpit-visual-lab-v0-20261112
    paths:
      - src/CerebroOperativeCockpitV3.tsx
      - src/cerebro-operative-cockpit-v3.css
      - src/CerebroOperativeConsole.tsx
      - src/CerebroConsoleHost.tsx
      - tests/cerebro-operativa-cockpit-v3-visual.test.mjs
      - .github/workflows/cerebro-operativa-cockpit-v3-visual-lab.yml
  pull_request:
    paths:
      - src/CerebroOperativeCockpitV3.tsx
      - src/cerebro-operative-cockpit-v3.css
      - src/CerebroOperativeConsole.tsx
      - src/CerebroConsoleHost.tsx
      - tests/cerebro-operativa-cockpit-v3-visual.test.mjs
      - .github/workflows/cerebro-operativa-cockpit-v3-visual-lab.yml
permissions:
  contents: read
concurrency:
  group: operativa-cockpit-v3-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-code-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify protected original navigation and functional preview
        run: node --test tests/cerebro-operativa-cockpit-v3-visual.test.mjs
      - name: Install locked dependencies (no new packages)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript and Vite compile
        run: npm run build
      - name: Confirm no production deployment configured
        run: |
          test "${{ github.event_name }}" != "workflow_dispatch" || exit 1
          echo 'QA ONLY: no publish, deployment or database mutation in this workflow'
