name: JARVIS Orchestrator PREPROD Smoke

on:
  push:
    branches:
      - cerebro/jarvis-work-codex-complete-20261102
    paths:
      - '.github/workflows/jarvis-orchestrator-preprod-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health is deterministic and safe
        shell: bash
        run: |
          set -euo pipefail
          base='https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/jarvis-orchestrator-v0-preprod'
          code="$(curl --silent --show-error --output health.json --write-out '%{http_code}' "$base/health")"
          test "$code" = '200'
          jq -e '
            .ok == true and
            .environment == "PREPROD" and
            .mode == "DETERMINISTIC" and
            .model_router == "PLANIFICADO" and
            .natural_language_planning == false and
            .safe_branch == "cerebro/jarvis-work-codex-complete-20261102" and
            (.protected_branches | index("main") != null) and
            (.protected_branches | index("emergency-pages") != null) and
            .browser_mutation == false and
            .prod_branch_mutation == false and
            .trading_access == false and
            .additional_cost_eur == 0
          ' health.json

      - name: Anonymous execution fails closed
        shell: bash
        run: |
          set -euo pipefail
          base='https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/jarvis-orchestrator-v0-preprod'
          code="$(curl --silent --show-error --output denied.json --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data '{"intent":"REPO_HEAD","args":{}}' "$base/execute")"
          test "$code" = '403'
          jq -e '.status == "FORBIDDEN" and .reason == "OWNER_TOKEN_REQUIRED"' denied.json

      - name: Untrusted browser origin is denied
        shell: bash
        run: |
          set -euo pipefail
          base='https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/jarvis-orchestrator-v0-preprod'
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X OPTIONS -H 'Origin: https://evil.example' "$base/execute")"
          test "$code" = '403'

      - name: Report
        run: echo 'JARVIS_ORCHESTRATOR_PREPROD_SMOKE=GREEN'

