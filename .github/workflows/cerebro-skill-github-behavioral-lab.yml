name: CEREBRO Skill GitHub Behavioral LAB

on:
  push:
    branches:
      - cerebro-skill-supply-chain-v0-20261006
    paths:
      - 'cerebro/skills/.github-behavioral-lab-trigger.json'

permissions:
  contents: read
  actions: read

env:
  CEREBRO_BEHAVIORAL_EXECUTION_ENABLED: 'true'
  CEREBRO_ALLOW_PROD_DATA: 'false'
  CEREBRO_ALLOW_CUSTOMER_DATA: 'false'
  CEREBRO_GEMINI_MODEL: gemini-3.5-flash-lite
  CEREBRO_GITHUB_PROVIDER_TIMEOUT_MS: '45000'

jobs:
  synthetic-github-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate exact one-shot GitHub authorization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('cerebro/skills/.github-behavioral-lab-trigger.json','utf8'));
          const ok=t.confirm==='RUN_SYNTHETIC_LAB'&&t.target_candidate==='github'&&t.target_candidate_id==='lobehub-skills:52441cd3d76607ffffab'&&t.expected_upstream_full_name==='openclaw/openclaw'&&t.expected_manifest_path==='skills/github/SKILL.md'&&t.scope==='LAB_SYNTHETIC_ONLY'&&t.max_calls===6&&t.max_retries_per_call===0&&t.paid_fallback===false&&t.allow_prod_data===false&&t.allow_customer_data===false&&t.allow_external_skill_code_execution===false&&t.allow_prod_write===false&&t.allow_trading_access===false&&typeof t.one_shot_id==='string'&&t.one_shot_id.length>=16;
          if(!ok){console.error('Invalid GitHub one-shot LAB trigger');process.exit(1)}
          console.log(JSON.stringify({trigger:'AUTHORIZED_ONE_SHOT_GITHUB_BRANCH_ONLY',one_shot_id:t.one_shot_id,target:t.target_candidate,target_candidate_id:t.target_candidate_id,max_calls:6,max_retries_per_call:0,paid_fallback:false,prod_data:false,customer_data:false,external_skill_code:false,prod_write:false,trading:false}));
          NODE

      - name: Wait for GREEN discovery evidence for exactly this branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for i in $(seq 1 42); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "CEREBRO Skill Discovery Scout" --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId,headSha,status,conclusion --jq ".[] | select(.headSha == \"$GITHUB_SHA\" and .status == \"completed\" and .conclusion == \"success\") | .databaseId" | head -n 1)"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::No GREEN discovery evidence for the exact GitHub LAB branch head."
            exit 1
          fi
          RUN_SHA="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          test "$RUN_SHA" = "$GITHUB_SHA"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cerebro-skill-discovery-$RUN_ID" --dir artifacts
          test -f artifacts/cerebro-skill-static-lab-p0.json
          test -f artifacts/cerebro-skill-old-vs-new-p0.json
          test -f artifacts/cerebro-skill-manifests.json
          test -f artifacts/cerebro-skill-wrapper-plans-p0.json
          test -f artifacts/cerebro-skill-license-evidence.json
          test -f artifacts/cerebro-skill-rsi-shadow.json

      - name: Assess normalized GitHub wrapper admission without mutating raw evidence
        run: node cerebro/skills/skill-github-normalized-wrapper-admission.mjs --static-lab artifacts/cerebro-skill-static-lab-p0.json --wrappers artifacts/cerebro-skill-wrapper-plans-p0.json --output artifacts/cerebro-skill-github-normalized-wrapper-admission.manual.json

      - name: Build focused GitHub OLD vs NEW package
        run: node cerebro/skills/skill-github-old-vs-new.mjs --admission artifacts/cerebro-skill-github-normalized-wrapper-admission.manual.json --oldnew artifacts/cerebro-skill-old-vs-new-p0.json --output artifacts/cerebro-skill-old-vs-new-github.manual.json

      - name: Verify exact target raw GREEN preservation and wrapper normalization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('cerebro/skills/.github-behavioral-lab-trigger.json','utf8'));
          const a=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-github-normalized-wrapper-admission.manual.json','utf8'));
          const o=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-old-vs-new-github.manual.json','utf8'));
          const green=(a.results??[]).filter(x=>x.status==='NORMALIZED_WRAPPER_GREEN_FOR_BEHAVIORAL_EVAL');
          const x=green[0];
          const p=o.packages?.[0];
          const ok=green.length===1&&x.candidate_id===t.target_candidate_id&&x.upstream_full_name===t.expected_upstream_full_name&&x.manifest_path===t.expected_manifest_path&&x.raw_static_status==='STATIC_LAB_GREEN_FOR_BEHAVIORAL_EVAL'&&x.raw_status_preserved===true&&(x.raw_hard_blocks??[]).length===0&&Number(x.raw_policy_alignment_score)>=90&&x.normalized_policy_alignment_score===100&&a.thresholds_relaxed===false&&a.raw_static_results_mutated===false&&o.packages_total===1&&p?.candidate_id===t.target_candidate_id&&p?.admission_basis==='NORMALIZED_CEREBRO_WRAPPER'&&(p?.fixtures??[]).length===3;
          if(!ok){console.error('GitHub normalized admission evidence is not exact/fail-closed');process.exit(1)}
          console.log(JSON.stringify({candidate_id:x.candidate_id,raw_static_status:x.raw_static_status,raw_policy_alignment_score:x.raw_policy_alignment_score,raw_status_preserved:true,normalized_policy_alignment_score:100,fixtures:3,planned_calls:6,thresholds_relaxed:false}));
          NODE

      - name: Select exact GitHub wrapper plan for rollback proof
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-old-vs-new-github.manual.json','utf8'));
          const w=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-wrapper-plans-p0.json','utf8'));
          const id=o.packages?.[0]?.candidate_id;
          const plans=(w.plans??[]).filter(x=>x.candidate_id===id);
          if(plans.length!==1){console.error('Exact GitHub wrapper plan not found');process.exit(1)}
          fs.writeFileSync('artifacts/cerebro-skill-wrapper-plans-github.manual.json',JSON.stringify({...w,wrapper_plans:1,enabled_wrappers:0,plans},null,2)+'\n');
          NODE

      - name: Bind current Gemini free-tier readiness without exposing secret value
        env:
          CEREBRO_GEMINI_KEY_PRESENT: ${{ secrets.CEREBRO_GEMINI_API_KEY != '' }}
          CEREBRO_GEMINI_POLICY_GREEN: 'false'
          CEREBRO_GEMINI_FREE_QUOTA_GUARD: 'true'
        run: node cerebro/skills/skill-provider-binding-from-env.mjs --providers cerebro/skills/zero-cost-provider-evidence.v0.json --output artifacts/cerebro-skill-provider-binding.github.manual.json

      - name: Select verified Gemini zero-cost synthetic route
        run: node cerebro/skills/skill-zero-cost-route-audit.mjs --providers artifacts/cerebro-skill-provider-binding.github.manual.json --oldnew artifacts/cerebro-skill-old-vs-new-github.manual.json --preferred-provider google-gemini-api-free --output artifacts/cerebro-skill-zero-cost-route.github.manual.json

      - name: Build hard six-call quota with zero retries and no paid fallback
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {buildFreeQuotaPlan} from './cerebro/skills/skill-free-quota-guard.mjs';
          const oldnew=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-old-vs-new-github.manual.json','utf8'));
          const route=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-zero-cost-route.github.manual.json','utf8'));
          const report=buildFreeQuotaPlan(oldnew,route,{limits:{max_packages:1,max_fixtures_per_package:3,max_model_calls:6,max_retries_per_call:0,paid_fallback:false,prod_data:false,customer_data:false}});
          if(!report.executable||report.planned_calls.total!==6||report.limits.max_model_calls!==6||report.limits.max_retries_per_call!==0){console.error('Hard six-call GitHub quota not established');process.exit(1)}
          fs.writeFileSync('artifacts/cerebro-skill-free-quota-plan.github.manual.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({provider_id:report.provider_id,planned_calls:report.planned_calls,max_model_calls:6,max_retries_per_call:0,paid_fallback:false}));
          NODE

      - name: Open behavioral gate for synthetic GitHub package only
        run: node cerebro/skills/skill-behavioral-execution-gate.mjs --oldnew artifacts/cerebro-skill-old-vs-new-github.manual.json --route artifacts/cerebro-skill-zero-cost-route.github.manual.json --quota artifacts/cerebro-skill-free-quota-plan.github.manual.json --output artifacts/cerebro-skill-behavioral-execution-gate.github.manual.json

      - name: Execute exactly six synthetic baseline-vs-wrapper calls on verified Gemini model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CEREBRO_GEMINI_API_KEY: ${{ secrets.CEREBRO_GEMINI_API_KEY }}
          CEREBRO_GEMINI_MODEL: gemini-3.5-flash-lite
          CEREBRO_GITHUB_PROVIDER_TIMEOUT_MS: '45000'
        run: node cerebro/skills/skill-github-behavioral-proxy-runner.mjs --oldnew artifacts/cerebro-skill-old-vs-new-github.manual.json --manifests artifacts/cerebro-skill-manifests.json --gate artifacts/cerebro-skill-behavioral-execution-gate.github.manual.json --quota artifacts/cerebro-skill-free-quota-plan.github.manual.json --route artifacts/cerebro-skill-zero-cost-route.github.manual.json --output artifacts/cerebro-skill-behavioral-proxy.github.manual.json

      - name: Verify exact call count provider model wrapper and no unsafe execution
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-behavioral-proxy.github.manual.json','utf8'));
          const arms=(p.results??[]).flatMap(r=>(r.fixture_results??[]).flatMap(f=>f.arms??[]));
          const candidateArms=arms.filter(a=>a.arm==='CANDIDATE_SKILL_PROXY');
          const baselineArms=arms.filter(a=>a.arm==='BASELINE_PROXY');
          const ok=p.status==='PROXY_COMPLETE'&&p.calls_executed===6&&p.provider_id==='google-gemini-api-free'&&arms.length===6&&candidateArms.length===3&&baselineArms.length===3&&arms.every(a=>a.model==='gemini-3.5-flash-lite')&&candidateArms.every(a=>a.wrapper_applied===true&&a.wrapper_id==='skillwrap:cerebro-github-v0.1.0')&&baselineArms.every(a=>a.wrapper_applied===false)&&p.synthetic_only===true&&p.external_skill_code_executed===false&&p.prod_authorized===false;
          if(!ok){console.error('GitHub behavioral execution invariant failed');process.exit(1)}
          console.log(JSON.stringify({status:p.status,calls_executed:6,provider_id:p.provider_id,model:'gemini-3.5-flash-lite',candidate_wrapper_applied:3,baseline_wrapper_applied:0,synthetic_only:true,external_skill_code_executed:false,prod_authorized:false}));
          NODE

      - name: Run fixed-threshold deterministic independent judge
        run: node cerebro/skills/skill-independent-judge.mjs --behavioral-results artifacts/cerebro-skill-behavioral-proxy.github.manual.json --output artifacts/cerebro-skill-independent-judge.github.manual.json

      - name: Prove focused wrapper rollback and rebuild
        run: node cerebro/skills/skill-rollback-proof.mjs --wrappers artifacts/cerebro-skill-wrapper-plans-github.manual.json --output artifacts/cerebro-skill-rollback-proof.github.manual.json

      - name: Run normalized GitHub evidence tribunal
        run: node cerebro/skills/skill-github-tribunal.mjs --admission artifacts/cerebro-skill-github-normalized-wrapper-admission.manual.json --licenses artifacts/cerebro-skill-license-evidence.json --behavioral-results artifacts/cerebro-skill-behavioral-proxy.github.manual.json --independent-judge artifacts/cerebro-skill-independent-judge.github.manual.json --rollback artifacts/cerebro-skill-rollback-proof.github.manual.json --route artifacts/cerebro-skill-zero-cost-route.github.manual.json --rsi-shadow artifacts/cerebro-skill-rsi-shadow.json --output artifacts/cerebro-skill-github-tribunal.manual.json

      - name: Assess PREPROD review readiness without promotion
        run: node cerebro/skills/skill-github-promotion-readiness.mjs --admission artifacts/cerebro-skill-github-normalized-wrapper-admission.manual.json --oldnew artifacts/cerebro-skill-old-vs-new-github.manual.json --route artifacts/cerebro-skill-zero-cost-route.github.manual.json --quota artifacts/cerebro-skill-free-quota-plan.github.manual.json --behavioral-gate artifacts/cerebro-skill-behavioral-execution-gate.github.manual.json --rsi-shadow artifacts/cerebro-skill-rsi-shadow.json --behavioral-results artifacts/cerebro-skill-behavioral-proxy.github.manual.json --independent-judge artifacts/cerebro-skill-independent-judge.github.manual.json --tribunal artifacts/cerebro-skill-github-tribunal.manual.json --rollback artifacts/cerebro-skill-rollback-proof.github.manual.json --output artifacts/cerebro-skill-github-promotion-readiness.manual.json

      - name: Verify no unsafe promotion or raw threshold mutation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-github-normalized-wrapper-admission.manual.json','utf8'));
          const p=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-behavioral-proxy.github.manual.json','utf8'));
          const j=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-independent-judge.github.manual.json','utf8'));
          const r=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-rollback-proof.github.manual.json','utf8'));
          const t=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-github-tribunal.manual.json','utf8'));
          const pr=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-github-promotion-readiness.manual.json','utf8'));
          const admitted=(a.results??[]).filter(x=>x.status==='NORMALIZED_WRAPPER_GREEN_FOR_BEHAVIORAL_EVAL');
          const rawPreserved=admitted.length===1&&admitted.every(x=>x.raw_static_status==='STATIC_LAB_GREEN_FOR_BEHAVIORAL_EVAL'&&x.raw_status_preserved===true);
          if(!rawPreserved||a.thresholds_relaxed!==false||a.raw_static_results_mutated!==false||p.prod_authorized!==false||p.external_skill_code_executed!==false||j.prod_authorized!==false||j.tribunal_satisfied!==false||r.prod_authorized!==false||t.prod_authorized!==false||t.autonomous_promotion_authorized!==false||pr.merge_authorized!==false||pr.prod_authorized!==false||pr.autonomous_promotion_authorized!==false) process.exit(1);
          console.log(JSON.stringify({safe:true,raw_static_green_preserved:true,thresholds_relaxed:false,proxy_status:p.status,calls_executed:p.calls_executed,judge_decision:j.decision,rollback_status:r.status,tribunal_decision:t.decision,promotion_readiness:pr.status,human_required:pr.human_required??null,prod_authorized:false,auto_promotion:false}));
          NODE

      - name: Upload GitHub synthetic behavioral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-github-behavioral-lab-${{ github.run_id }}
          path: |
            artifacts/cerebro-skill-github-normalized-wrapper-admission.manual.json
            artifacts/cerebro-skill-old-vs-new-github.manual.json
            artifacts/cerebro-skill-provider-binding.github.manual.json
            artifacts/cerebro-skill-zero-cost-route.github.manual.json
            artifacts/cerebro-skill-free-quota-plan.github.manual.json
            artifacts/cerebro-skill-behavioral-execution-gate.github.manual.json
            artifacts/cerebro-skill-behavioral-proxy.github.manual.json
            artifacts/cerebro-skill-wrapper-plans-github.manual.json
            artifacts/cerebro-skill-independent-judge.github.manual.json
            artifacts/cerebro-skill-rollback-proof.github.manual.json
            artifacts/cerebro-skill-github-tribunal.manual.json
            artifacts/cerebro-skill-github-promotion-readiness.manual.json
          if-no-files-found: warn
          retention-days: 14