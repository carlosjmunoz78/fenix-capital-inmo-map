name: CEREBRO Skill Governed Write V1

on:
  push:
    branches:
      - cerebro/governed-write-v1-20261016
    paths:
      - 'cerebro/governance/skill-governed-write-authorization.v1.json'
      - 'cerebro/registry/governed-write-skills.v1.json'
      - 'cerebro/skills/skill-governed-write-guard-v1.mjs'
      - 'cerebro/tests/skill-governed-write-guard-v1.test.mjs'
      - '.github/workflows/cerebro-skill-governed-write-v1.yml'
      - 'cerebro/evidence/governed-write/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'cerebro/governance/skill-governed-write-authorization.v1.json'
      - 'cerebro/registry/governed-write-skills.v1.json'
      - 'cerebro/skills/skill-governed-write-guard-v1.mjs'
      - 'cerebro/tests/skill-governed-write-guard-v1.test.mjs'
      - '.github/workflows/cerebro-skill-governed-write-v1.yml'
      - 'cerebro/evidence/governed-write/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  governed-write-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run fail-closed governed-write contracts
        run: node --test cerebro/tests/skill-governed-write-guard-v1.test.mjs

      - name: Prove readonly fallback registry is unchanged by this lane
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          if ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- cerebro/registry/autonomous-readonly-skills.v1.json; then
            echo 'Readonly fallback registry was modified by governed-write lane.' >&2
            exit 1
          fi

      - name: Execute bounded synthetic canary through the guard
        run: |
          set -euo pipefail
          mkdir -p artifacts/governed-write
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {evaluateGovernedWriteRequest} from './cerebro/skills/skill-governed-write-guard-v1.mjs';

          const base={
            company_id:'GLOBAL',engine_id:'FACT-001',environment:'PROD_CONTROL_PLANE',version:'1.0.0',
            base_ref:'main',base_sha:'48eef7bdeec05237e7fdb35d04a4502639599901',
            branch:'cerebro/governed-write/canary-v1',
            safety:{direct_main_write:false,force_push:false,auto_merge:false,merge:false,workflow_mutation:false,governance_self_mutation:false,customer_data:false,prod_business_data:false,external_skill_code_execution:false,trading:false,paid_fallback:false,new_credentials:false,app_fenix_deploy:false,additional_cost_eur:0}
          };
          const cases=[
            {...base,candidate_id:'lobehub-skills:52441cd3d76607ffffab',operation:'CREATE_GOVERNED_BRANCH'},
            {...base,candidate_id:'lobehub-skills:950cf07380d1daa6de69',operation:'CREATE_OR_UPDATE_GOVERNED_BRANCH_FILE',target_path:'cerebro/generated/skills/canary-v1/SKILL.md'},
            {...base,candidate_id:'lobehub-skills:52441cd3d76607ffffab',operation:'CREATE_GOVERNED_PULL_REQUEST',pr_base_ref:'main',pr_head_ref:'cerebro/governed-write/canary-v1',auto_merge:false}
          ];
          const decisions=cases.map((request)=>evaluateGovernedWriteRequest(request,{activation_mode:'CANARY'}));
          if(decisions.some((d)=>!d.authorized)) throw new Error(JSON.stringify(decisions));
          if(decisions.some((d)=>d.authority.direct_main_write||d.authority.auto_merge||d.authority.merge||d.authority.workflow_mutation||d.authority.governance_self_mutation||d.authority.customer_data||d.authority.external_skill_code_execution||d.authority.trading||d.authority.paid_fallback||d.authority.app_fenix_deploy||Number(d.authority.additional_cost_eur)!==0)) throw new Error('AUTHORITY_CEILING_BREACH');
          const evidence={schema_version:'1.0.0',status:'GREEN_SYNTHETIC_GOVERNED_WRITE_GUARD_CANARY',company_id:'GLOBAL',engine_id:'FACT-001',environment:'PROD_CONTROL_PLANE',version:'1.0.0',head_sha:process.env.GITHUB_SHA,branch:process.env.GITHUB_REF_NAME,decisions:decisions.map(({candidate_id,operation,status,authorized,authority})=>({candidate_id,operation,status,authorized,authority})),direct_main_write:false,auto_merge:false,merge:false,readonly_fallback_preserved:true,additional_cost_eur:0};
          fs.writeFileSync('artifacts/governed-write/evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload immutable governed-write evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-governed-write-v1-${{ github.run_id }}
          path: artifacts/governed-write/evidence.json
          if-no-files-found: error
          retention-days: 30
