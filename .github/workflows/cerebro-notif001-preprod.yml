name: CEREBRO NOTIF-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-com001-communication-engine-v0-20260911']
    paths:
      - 'cerebro/communications/notification-engine.mjs'
      - 'cerebro/tests/notification-engine.test.mjs'
      - '.github/workflows/cerebro-notif001-preprod.yml'
jobs:
  notif001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/notification-engine.test.mjs
