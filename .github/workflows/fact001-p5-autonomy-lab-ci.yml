name: FACT001 P5 autonomous registered LAB read-only policy CI
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/p5-autonomy-lab/**
      - .github/workflows/fact001-p5-autonomy-lab-ci.yml
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          node --check cerebro/connectors/universal/services/p5-autonomy-lab/worker.mjs
          node --test cerebro/connectors/universal/services/p5-autonomy-lab/tests/*.test.mjs
          node --experimental-strip-types --check cerebro/connectors/universal/services/p5-autonomy-lab/edge/index.ts
