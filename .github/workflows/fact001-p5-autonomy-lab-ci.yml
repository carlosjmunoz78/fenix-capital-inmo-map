name: FACT001 P5 autonomous registered LAB read-only policy CI
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/p5-autonomy-lab/**
      - .github/workflows/fact001-p5-autonomy-lab-ci.yml
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          node --check cerebro/connectors/universal/services/p5-autonomy-lab/worker.mjs
          node --test cerebro/connectors/universal/services/p5-autonomy-lab/tests/*.test.mjs
          node --check cerebro/connectors/universal/services/p5-autonomy-lab/recovery-wrapper.mjs
          node --experimental-strip-types --check cerebro/connectors/universal/services/p5-autonomy-lab/edge/index.ts

  negative-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject anonymous, malformed, PROD and forged tickets without provider writes
        run: |
          node --input-type=module <<'NODE'
          const u='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-fact001-p5-dispatch-lab/dispatch';
          const body={company_id:'fenix-capital',engine_id:'FACT-001',environment:'LAB',version:'1.0.0',source:'registered_automation',operation:'providers.five.inventory.read',provider_set:'cloudflare,vercel,supabase,notion,github',max_cost_eur:0,request_id:'FACT001-P5-20261112'};
          async function post(auth,payload){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth}:{})},body:JSON.stringify(payload),redirect:'error',signal:AbortSignal.timeout(25000)});let data={};try{data=await r.json()}catch{}return {http:r.status,status:data.status,code:data.code||null};}
          const anon=await post(null,body);
          const short=await post('invalid',body);
          const prod=await post('0'.repeat(64),{...body,environment:'PROD'});
          const bad=await post('0'.repeat(64),body);
          console.log('P5_ANON='+anon.http+';P5_BAD_FORMAT='+short.http+';P5_PROD='+prod.http+';P5_INVALID_TICKET='+bad.http);
          if(anon.http!==401||short.http!==401||prod.http!==403||bad.http!==409||bad.status!=='DENIED_OR_ALREADY_CLAIMED')throw Error('P5_NEGATIVE_LIVE_GATE_FAILED');
          console.log('P5_NEGATIVE_LIVE_SECURITY=PASS');
          NODE
