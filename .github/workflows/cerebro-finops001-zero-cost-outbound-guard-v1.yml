name: CEREBRO FINOPS001 Zero Cost Outbound Guard V1
on:
  push:
    branches: [cerebro/close-179-per-engine-autonomy-v1-20261102]
    paths:
      - 'cerebro/runtime/finops001-zero-cost-outbound-guard-v1.mjs'
      - 'cerebro/tests/finops001-zero-cost-outbound-guard-v1.test.mjs'
      - '.github/workflows/cerebro-finops001-zero-cost-outbound-guard-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pre-call-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Test zero-cost pre-call authorization and regressions
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'cerebro/close-179-per-engine-autonomy-v1-20261102'
          node cerebro/tests/finops001-zero-cost-outbound-guard-v1.test.mjs
          node cerebro/tests/foundation-holds-v1.test.mjs
