name: CEREBRO VENT-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-fran001-franchise-replication-v0-20260911']
    paths:
      - 'cerebro/strategy/new-venture-engine.mjs'
      - 'cerebro/tests/new-venture-engine.test.mjs'
      - '.github/workflows/cerebro-vent001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/new-venture-engine.test.mjs