name: CEREBRO RECOVER MAX FANOUT LIVE V0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cerebro-recover-max-fanout-live-v0.yml

permissions:
  contents: read
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable deterministic fanout workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cerebro-max-fanout-24h-v1.yml/enable"

      - name: Dispatch deterministic fanout without paid AI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cerebro-max-fanout-24h-v1.yml/dispatches" \
            -d '{"ref":"main","inputs":{"run_deepseek":"false"}}'
