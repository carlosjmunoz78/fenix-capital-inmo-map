name: CEREBRO Governed Promotion V1

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Candidate pull request number'
        required: true
        type: string
      expected_head_sha:
        description: 'Exact 40-char candidate head SHA'
        required: true
        type: string
      promotion_packet_b64:
        description: 'Base64-encoded governed promotion packet JSON'
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: cerebro-governed-promotion-v1
  cancel-in-progress: false

jobs:
  governed-promote:
    name: Governed exact-head promotion to physical PROD
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      PROMOTION_PACKET_B64: ${{ inputs.promotion_packet_b64 }}
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in ''|*[!0-9]*) echo 'invalid PR number' >&2; exit 2 ;; esac
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          test -n "$PROMOTION_PACKET_B64"
          printf '%s' "$PROMOTION_PACKET_B64" | base64 -d > /tmp/cerebro-promotion-packet.json
          jq -e . /tmp/cerebro-promotion-packet.json >/dev/null

      - name: Verify PR exact head and carrier state
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$pr")" = open
          test "$(jq -r '.draft' <<<"$pr")" = false
          test "$(jq -r '.base.ref' <<<"$pr")" = main
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD_SHA"

      - name: Checkout immutable candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Assess governed promotion packet
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/governance/governed-promotion-executor-v1.mjs \
            --packet /tmp/cerebro-promotion-packet.json \
            --out /tmp/cerebro-promotion-pre.json
          test "$(jq -r '.status' /tmp/cerebro-promotion-pre.json)" = PROMOTE_READY
          test "$(jq -r '.pr_number' /tmp/cerebro-promotion-pre.json)" = "$PR_NUMBER"
          test "$(jq -r '.expected_head_sha' /tmp/cerebro-promotion-pre.json)" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.target' /tmp/cerebro-promotion-pre.json)" = APP_FENIX_STATIC

      - name: Require candidate checks complete and green
        shell: bash
        run: |
          set -euo pipefail
          checks="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/check-runs?per_page=100")"
          count="$(jq '.total_count' <<<"$checks")"
          test "$count" -gt 0
          bad="$(jq '[.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$checks")"
          test "$bad" -eq 0

      - name: Exact-head governed merge
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$EXPECTED_HEAD_SHA" \
            --subject "CEREBRO governed promotion PR #${PR_NUMBER}" \
            --body "Exact-head governed promotion. Required gates green; physical PROD proof follows."
          merged="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.merged' <<<"$merged")" = true
          main_sha="$(jq -r '.merge_commit_sha' <<<"$merged")"
          printf '%s' "$main_sha" | grep -Eq '^[0-9a-fA-F]{40}$'
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$main_sha"
          printf '%s\n' "$main_sha" > /tmp/prod-main-sha.txt

      - name: Dispatch existing physical PROD deploy explicitly
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(cat /tmp/prod-main-sha.txt)"
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$main_sha"
          gh workflow run prod-live-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirm=DEPLOY_PROD

      - name: Wait for physical PROD deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(cat /tmp/prod-main-sha.txt)"
          run_id=''
          for _ in $(seq 1 30); do
            run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/prod-live-deploy.yml/runs?event=workflow_dispatch&head_sha=${main_sha}&per_page=10" --jq '.workflow_runs[0].id // empty')"
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id"
          printf '%s\n' "$run_id" > /tmp/prod-run-id.txt
          for _ in $(seq 1 120); do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status + ":" + (.conclusion // "")')"
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "PROD deploy failed: $state" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo 'PROD deploy receipt timeout' >&2
          exit 1

      - name: Dispatch canonical PROD Runtime Smoke for exact live SHA
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(cat /tmp/prod-main-sha.txt)"
          gh workflow run prod-runtime-smoke.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "expected_live_sha=${main_sha}"

      - name: Require canonical PROD Runtime Smoke green
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(cat /tmp/prod-main-sha.txt)"
          smoke_id=''
          for _ in $(seq 1 30); do
            smoke_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/prod-runtime-smoke.yml/runs?event=workflow_dispatch&head_sha=${main_sha}&per_page=10" --jq '.workflow_runs[0].id // empty')"
            [ -n "$smoke_id" ] && break
            sleep 5
          done
          test -n "$smoke_id"
          printf '%s\n' "$smoke_id" > /tmp/prod-smoke-run-id.txt
          for _ in $(seq 1 120); do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${smoke_id}" --jq '.status + ":" + (.conclusion // "")')"
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "PROD Runtime Smoke failed: $state" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo 'PROD Runtime Smoke timeout' >&2
          exit 1

      - name: Prove physical PROD source and monitor stability
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(cat /tmp/prod-main-sha.txt)"
          proof='https://app.fenixcapital.es/PROD_SOURCE_SHA.txt'
          matched=false
          for attempt in $(seq 1 36); do
            actual="$(curl -fsSL --max-time 20 "${proof}?sha=${main_sha}&attempt=${attempt}" | tr -d '\r\n' || true)"
            if [ "$actual" = "$main_sha" ]; then matched=true; break; fi
            sleep 5
          done
          test "$matched" = true
          for sample in 1 2 3; do
            actual="$(curl -fsSL --max-time 20 "${proof}?sha=${main_sha}&monitor=${sample}" | tr -d '\r\n')"
            test "$actual" = "$main_sha"
            [ "$sample" -eq 3 ] || sleep 10
          done
          printf '%s\n' "$proof" > /tmp/prod-proof-url.txt

      - name: Seal terminal PROD_PROMOTED evidence
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/governance/governed-promotion-executor-v1.mjs \
            --packet /tmp/cerebro-promotion-packet.json \
            --out /tmp/cerebro-promotion-final.json \
            --deployment-run-id "$(cat /tmp/prod-run-id.txt)" \
            --prod-source-sha "$(cat /tmp/prod-main-sha.txt)" \
            --smoke-passed true \
            --monitor-passed true \
            --proof-url "$(cat /tmp/prod-proof-url.txt)"
          test "$(jq -r '.status' /tmp/cerebro-promotion-final.json)" = PROD_PROMOTED
          printf '\nCanonical PROD Runtime Smoke run: %s\n' "$(cat /tmp/prod-smoke-run-id.txt)" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cerebro-promotion-final.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-prod-promotion-${{ inputs.pr_number }}-${{ github.run_id }}
          path: |
            /tmp/cerebro-promotion-packet.json
            /tmp/cerebro-promotion-pre.json
            /tmp/cerebro-promotion-final.json
            /tmp/prod-main-sha.txt
            /tmp/prod-run-id.txt
            /tmp/prod-smoke-run-id.txt
            /tmp/prod-proof-url.txt
          if-no-files-found: error
          retention-days: 30
