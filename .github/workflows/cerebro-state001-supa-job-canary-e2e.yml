name: STATE001 · Supabase job canary E2E owner boundary
on:
  push:
    branches: [cerebro/shared-state-all-interfaces-v0-20261118]
    paths:
      - 'supabase/functions/cerebro-state001-jobs-readonly-canary/index.ts'
      - '.github/workflows/cerebro-state001-supa-job-canary-e2e.yml'
permissions: {contents: read}
jobs:
  negative-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
      CEREBRO_E2E_TEST_PASSWORD: ${{ secrets.CEREBRO_E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Deny unauthenticated GET and any write without editing resources
        shell: bash
        run: |
          set -euo pipefail
          url='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-state001-jobs-readonly-canary'
          status="$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' -H "apikey: $PROD_SUPABASE_PUBLISHABLE_KEY" "$url")"
          test "$status" = 401 || { echo "BLOCKED_ANONYMOUS_$status"; exit 5; }
          echo 'PASS_ANONYMOUS_DENIED'
          status="$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' -X POST -H "apikey: $PROD_SUPABASE_PUBLISHABLE_KEY" "$url")"
          case "$status" in 401|405) echo 'PASS_WRITE_DENIED';; *) echo "BLOCKED_WRITE_$status"; exit 6;; esac
      - name: Issue only a new restricted technical session
        run: |
          set -euo pipefail
          node cerebro/universal/v0/e2e-ephemeral-token.mjs
      - name: Technical CI identity cannot inspect Fénix job logs
        run: |
          set -euo pipefail
          test -n "${CEREBRO_E2E_RUNTIME_JWT:-}" || { echo 'NO_EPHEMERAL_SESSION'; exit 7; }
          url='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-state001-jobs-readonly-canary'
          code="$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CEREBRO_E2E_RUNTIME_JWT" -H "apikey: $PROD_SUPABASE_PUBLISHABLE_KEY" "$url")"
          test "$code" = 403 || { echo "BLOCKED_TECHNICAL_OWNER_BYPASS_$code"; exit 8; }
          echo 'PASS_CI_TECHNICAL_ACCOUNT_DENIED'
      - name: Terminate technical session
        if: always()
        run: |
          if [ -n "${CEREBRO_E2E_RUNTIME_JWT:-}" ]; then
            curl -sS --max-time 15 -o /dev/null -X POST -H "authorization: Bearer $CEREBRO_E2E_RUNTIME_JWT" -H "apikey: $PROD_SUPABASE_PUBLISHABLE_KEY" 'https://cluhljgonannaafpmblx.supabase.co/auth/v1/logout' || true
          fi
          echo 'NO_SUPABASE_DB_WRITE_PERFORMED; NO_CREDENTIAL_PRINTED'
