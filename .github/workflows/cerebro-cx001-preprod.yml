name: CEREBRO CX-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-c360001-customer360-v0-20260911']
    paths:
      - 'cerebro/customer/customer-experience-engine.mjs'
      - 'cerebro/tests/customer-experience-engine.test.mjs'
      - '.github/workflows/cerebro-cx001-preprod.yml'
jobs:
  cx001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/customer-experience-engine.test.mjs
