name: Promote PROD once 0bc39d

on:
  push:
    branches:
      - prod-preparation
    paths:
      - '.github/workflows/promote-prod-once-0bc39d.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: fenix-prod-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.fenixcapital.es
    steps:
      - name: Validate exact PREPROD source/run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 0bc39d27750de93a025c11c62059ccc8864fe0f6
          RUN_ID: '34393018440'
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_SHA"
          test "$(jq -r '.head_branch' <<<"$run_json")" = 'preprod-app-phase1'
          test "$(jq -r '.event' <<<"$run_json")" = 'push'

      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: fenix-prod-candidate-0bc39d27750de93a025c11c62059ccc8864fe0f6
          path: candidate
          run-id: 34393018440
          github-token: ${{ github.token }}

      - name: Validate and extract exact immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c fenix-prod-candidate.tgz.sha256
          test "$(tr -d '\r\n' < PROD_CANDIDATE_SHA)" = '0bc39d27750de93a025c11c62059ccc8864fe0f6'
          grep -qx 'source_sha=0bc39d27750de93a025c11c62059ccc8864fe0f6' PROD_CANDIDATE_METADATA.txt
          mkdir ../candidate-dist
          tar -xzf fenix-prod-candidate.tgz -C ../candidate-dist
          test -f ../candidate-dist/index.html
          test -f ../candidate-dist/404.html
          test "$(cat ../candidate-dist/CNAME)" = 'app.fenixcapital.es'
          if grep -RInE --include='*.js' --include='*.html' --include='*.css' 'functions/v1/[A-Za-z0-9_-]+-test' ../candidate-dist; then
            echo 'TEST endpoint leaked into candidate; refusing promotion' >&2
            exit 1
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: live

      - name: Promote exact artifact without rebuild
        shell: bash
        run: |
          set -euo pipefail
          cd live
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../candidate-dist/. .
          printf '%s\n' '0bc39d27750de93a025c11c62059ccc8864fe0f6' > PROD_SOURCE_SHA.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'deploy(prod): promote 0bc39d27750de93a025c11c62059ccc8864fe0f6'
            git push origin HEAD:gh-pages
          fi

      - name: Post-deploy read-only smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --output /tmp/prod-index --write-out '%{http_code}' --max-time 20 'https://app.fenixcapital.es/')" || status=000
            marker="$(curl --silent --show-error --max-time 20 'https://app.fenixcapital.es/PROD_SOURCE_SHA.txt' || true)"
            if [ "$status" = '200' ] && grep -qi '<!doctype html' /tmp/prod-index && [ "$marker" = '0bc39d27750de93a025c11c62059ccc8864fe0f6' ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
