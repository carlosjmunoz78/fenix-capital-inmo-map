name: CEREBRO Console Chain Promotion TEMP

on:
  push:
    branches:
      - cerebro/console-chain-v0
    paths:
      - '.github/workflows/console-chain-promote-temp.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'CMD · run isolated version promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cerebro/console-chain-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote CMD-001 through FACT-001 V0.4
        shell: bash
        run: |
          set -euo pipefail
          test ! -e cerebro/factory/versions/CMD-001/0.2.0/engine.manifest.json
          python cerebro/factory/scripts/version_engine.py apply --engine-id CMD-001 --manifest-file cerebro/factory/candidates/CMD-001-0.2.0.json
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('cerebro/factory/registry/engine-registry.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('registry_version') != '0.9.0': raise SystemExit(f"unexpected Registry {d.get('registry_version')}")
          d['registry_version']='0.10.0'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Validate Factory and shared runtime
        run: |
          python cerebro/factory/scripts/validate_manifest.py
          python -m unittest discover -s cerebro/factory/tests -p 'test_*.py' -v
          python -m unittest discover -s cerebro/runtime/tests -p 'test_*.py' -v
      - name: Commit exact CMD promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cerebro/factory/registry/engine-registry.json cerebro/factory/versions/CMD-001/0.2.0/engine.manifest.json
          git commit -m 'CMD · promote version 0.2.0 [versioned]'
          git push origin HEAD:cerebro/console-chain-v0
