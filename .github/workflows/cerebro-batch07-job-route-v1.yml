name: CEREBRO Batch07 JOB ROUTE V1

on:
  push:
    branches: [cerebro/close-179-per-engine-autonomy-v1-20261102]
    paths:
      - 'cerebro/missions/close-batch07-job-route-v1.mjs'
      - 'cerebro/missions/close-batch07-iam001-v1.mjs'
      - 'cerebro/missions/close-orch-hex-autonomy-v1.mjs'
      - 'cerebro/runtime/job001-ledger-control-plane-v1.mjs'
      - 'cerebro/runtime/route001-resource-discovery.mjs'
      - 'cerebro/runtime/route001-safe-preprod-loop.mjs'
      - 'cerebro/tests/job001-ledger-control-plane-v1.test.mjs'
      - 'cerebro/tests/route001-real-resource-preprod-loop-v0.test.mjs'
      - '.github/workflows/cerebro-batch07-job-route-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT: /tmp/cerebro-batch07-job-route

jobs:
  job-route-autonomy-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify isolated branch
        run: test "$GITHUB_REF_NAME" = 'cerebro/close-179-per-engine-autonomy-v1-20261102'
      - name: Validate canonical registry and factory
        run: |
          set -euo pipefail
          cd cerebro
          npm run validate
          node factory-v1.mjs validate --registry registry/engine-registry.v1.json
      - name: Rebuild prior certified evidence
        run: |
          set -euo pipefail
          node cerebro/missions/close-orch-hex-autonomy-v1.mjs
          node cerebro/missions/close-batch07-iam001-v1.mjs
      - name: Execute JOB-001 and ROUTE-001 closure mission
        run: |
          set -euo pipefail
          node cerebro/missions/close-batch07-job-route-v1.mjs
      - name: Re-run Strict179 and require 30 of 179
        run: |
          set -euo pipefail
          node cerebro/missions/audit-179-autonomy-readiness-v1.mjs --out "$OUT"
          node <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync(process.env.OUT+'/AUTONOMY_READINESS_BASELINE.json','utf8'));
          const s=JSON.parse(fs.readFileSync(process.env.OUT+'/SUMMARY.json','utf8'));
          const ids=['ORCH-001','HEX-001','IAM-001','JOB-001','ROUTE-001'];
          const selected=ids.map(id=>report.engines.find(x=>x.engine_id===id));
          if(selected.some(x=>!x)) throw new Error('Selected engine missing');
          fs.writeFileSync(process.env.OUT+'/BATCH07_JOB_ROUTE_DIAGNOSTIC.json',JSON.stringify({engines:selected,summary:s},null,2)+'\n');
          for(const e of selected){if(e.gate_count!==12||e.gate_total!==12||e.autonomous_prod_ready!==true)throw new Error(`${e.engine_id} closure failed ${e.gate_count}/${e.gate_total}: ${(e.readiness_blockers||[]).join(',')}`)}
          if(s.autonomous_prod_ready<30) throw new Error(`Expected at least 30/179, got ${s.autonomous_prod_ready}`);
          if(s.prod_writes!==false||s.trading_touched!==false||s.additional_cost_eur!==0) throw new Error('safety/cost isolation drift');
          console.log(JSON.stringify({selected:selected.map(x=>({engine_id:x.engine_id,gates:x.gate_count,ready:x.autonomous_prod_ready})),autonomous_prod_ready:s.autonomous_prod_ready,registry_total:s.registry_total}));
          NODE
      - name: Upload Batch07 JOB ROUTE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-batch07-job-route-${{ github.run_id }}
          path: |
            /tmp/cerebro-batch07-job-route/
            cerebro/evidence/orch-hex-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-iam001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-job-route-autonomy-closure/2026-11-02/
          if-no-files-found: error
          retention-days: 30
