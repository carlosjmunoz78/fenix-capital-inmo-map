name: TEMP PREPROD Expediente Journey Validation

on:
  push:
    branches:
      - work/expediente-journey-short-save-2026-10-15

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FUNCTION_SUFFIX: '-test'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: Expediente journey contracts
        run: npx playwright test tests/expediente-stage-contract.spec.ts tests/preprod-environment-isolation.spec.ts
