name: CEREBRO VOICE-001 Dedicated es-ES Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/voice/runtime/es_es_dedicated_smoke.py'
      - 'cerebro/voice/profiles/ESM05_CEREBRO_EXECUTIVE_AI_ES_ES_V0.json'
      - 'cerebro/voice/profiles/ESM05_QA_CORPUS_V0.txt'
      - 'cerebro/voice/VOICE_ES_ES_DEDICATED_BACKEND_V0.md'
      - 'cerebro/voice/voice-bank.v0.json'
      - 'cerebro/tests/voice-esm05-executive-ai-v0.test.mjs'
      - '.github/workflows/cerebro-voice-es-es-dedicated-smoke.yml'

permissions:
  contents: read

jobs:
  windows-es-es-dedicated-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reviewed VOICE-001 LAB runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./cerebro/voice/runtime/windows/Install-VoiceLab.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Generate dedicated Spain-Spanish listening sample
        shell: pwsh
        env:
          CEREBRO_ENVIRONMENT: LAB
          CEREBRO_VOICE_DEVICE: cpu
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'CEREBRO\voice-runtime\.venv\Scripts\python.exe'
          $out = Join-Path $env:RUNNER_TEMP 'voice001-es-es-dedicated'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $python ./cerebro/voice/runtime/es_es_dedicated_smoke.py --output-dir $out --device cpu
          if ($LASTEXITCODE -ne 0) { throw 'VOICE-001 dedicated es-ES smoke failed' }

      - name: Verify evidence boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'voice001-es-es-dedicated\es-es-dedicated-smoke.json'
          if (-not (Test-Path $evidencePath)) { throw 'dedicated es-ES evidence missing' }
          $e = Get-Content -Raw $evidencePath | ConvertFrom-Json
          if ($e.status -ne 'ES_ES_DEDICATED_T3_LISTENING_SMOKE_ONLY') { throw 'wrong evidence status' }
          if ($e.target_locale -ne 'es-ES') { throw 'wrong locale' }
          if ($e.authority.automatic_promotion -ne $false) { throw 'promotion forbidden' }
          if ($e.authority.prod_enabled -ne $false) { throw 'PROD forbidden' }
          if ($e.authority.esm05_accepted -ne $false) { throw 'ESM05 cannot be auto-accepted' }
          if ($e.wav_bytes -le 1024) { throw 'generated WAV too small' }
          Write-Host "GREEN dedicated es-ES listening sample generated. audio_seconds=$($e.audio_seconds)"

      - name: Upload dedicated es-ES listening evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice001-es-es-dedicated-listening-smoke
          path: ${{ runner.temp }}\voice001-es-es-dedicated\
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Record scope
        if: success()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'VOICE-001 dedicated es-ES model path generated one listening-only sample.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'This does NOT accept ESM05, a speaker identity, cloning quality, PREPROD binding or PROD.'
