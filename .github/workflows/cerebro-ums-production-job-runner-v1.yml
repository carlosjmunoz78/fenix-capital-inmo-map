name: CEREBRO UMS Production Job Runner V1

on:
  push:
    branches:
      - cerebro/ums-physical-production-executor-20261026
    paths:
      - 'cerebro/media-studio/v2/runtime/premium-owned-assets-renderer.mjs'
      - 'cerebro/media-studio/v2/runtime/premium-creative-preflight-gate.mjs'
      - 'cerebro/media-studio/v2/runtime/ums-production-job-runner-v1.mjs'
      - 'cerebro/media-studio/v2/tests/ums-production-job-runner.test.mjs'
      - 'cerebro/media-studio/v2/tests/premium-creative-preflight-gate.test.mjs'
      - 'cerebro/media-studio/v2/orders/bm13-fenix-premium-trial-v1.json'
      - 'cerebro/media-studio/v2/evaluation/owner-feedback/**'
      - 'supabase/functions/cerebro-ums-production-dispatch-v1/**'
      - 'supabase/migrations/*cerebro_ums_production_lease_v1*'
      - '.github/workflows/cerebro-ums-production-job-runner-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ums-premium-governance-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Contract and owner-regression tests
        run: |
          node --test \
            cerebro/media-studio/v2/tests/ums-production-job-runner.test.mjs \
            cerebro/media-studio/v2/tests/premium-creative-preflight-gate.test.mjs

      - name: Verify rejected BM-13 trial is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { evaluatePremiumCreativePreflight } from './cerebro/media-studio/v2/runtime/premium-creative-preflight-gate.mjs';
          const order=JSON.parse(fs.readFileSync('./cerebro/media-studio/v2/orders/bm13-fenix-premium-trial-v1.json','utf8'));
          const result=evaluatePremiumCreativePreflight(order);
          if(result.ok) throw new Error('REJECTED_OWNER_TRIAL_FALSE_GREEN');
          if(result.status!=='CREATIVE_REJECTED_PRE_FLIGHT') throw new Error(`UNEXPECTED_STATUS:${result.status}`);
          console.log(JSON.stringify(result));
          NODE

      - name: PREPROD truth
        shell: bash
        run: |
          {
            echo '## CEREBRO UMS Productora PREPROD'
            echo '- engine: UMS-001'
            echo '- owner_trial: REJECTED / NEGATIVE_REFERENCE_LOCKED'
            echo '- canary_owned_stills_renderer: NOT PREMIUM PRIMARY'
            echo '- piper_voice: CANARY ONLY'
            echo '- premium_fail_closed: true'
            echo '- premium_physical_renderer_v2: WAITING_FOR_BOUND_AND_TESTED_CAPABILITY'
            echo '- expected_cost_eur: 0'
            echo '- publish_authorized: false'
            echo '- BM-13: NOT PASSED'
          } >> "$GITHUB_STEP_SUMMARY"
