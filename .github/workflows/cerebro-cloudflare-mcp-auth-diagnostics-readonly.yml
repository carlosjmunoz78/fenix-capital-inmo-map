name: FACT-001 Official MCP - account token scope diagnostics GET only
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths: [.github/workflows/cerebro-cloudflare-mcp-auth-diagnostics-readonly.yml]
permissions:
  contents: read
jobs:
  scope-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the encrypted token can enumerate account resources (GET only)
        env:
          CF_TOKEN: ${{ secrets.CEREBRO_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: e39a57e1ac42650ca5a6d5307cf0ac8e
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN,account=process.env.CF_ACCOUNT_ID;
          if(!token){console.log('TOKEN_PRESENT=false');process.exit(1)}
          const api='https://api.cloudflare.com/client/v4';
          async function status(label,path){
           try{
            const res=await fetch(api+path,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(12000)});
            console.log(`${label}_HTTP=${res.status}`);
            // Only parse the ACTIVE verification status. No account data or secret values are printed.
            if(label==='TOKEN_VERIFY' && res.ok){const obj=await res.json();console.log('TOKEN_VERIFIED_ACTIVE='+Boolean(obj.success&&obj.result?.status==='active'));}
            return res.status;
           }catch{console.log(`${label}_HTTP=NETWORK_ERROR`);return null}
          }
          await status('TOKEN_VERIFY','/user/tokens/verify');
          await status('ACCOUNT_RESOURCES','/accounts?per_page=1');
          await status('ACCOUNT_DETAIL',`/accounts/${account}`);
          await status('WORKERS_LIST',`/accounts/${account}/workers/scripts`);
          console.log('MCP_SCOPE_DIAGNOSTIC_GET_ONLY=true');
          console.log('MCP_SCOPE_DIAGNOSTIC_MUTATIONS=0');
          NODE