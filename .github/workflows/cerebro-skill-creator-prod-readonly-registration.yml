name: CEREBRO Skill Creator PROD Read-only Registration

on:
  push:
    branches:
      - cerebro/skill-creator-prod-readonly-registration-20261016
    paths:
      - 'cerebro/registry/autonomous-readonly-skills.v1.json'
      - 'cerebro/governance/skill-autonomy-standing-authorization.v1.json'
      - 'cerebro/skills/skill-creator-prod-readonly-registration-validator-v1.mjs'
      - 'cerebro/tests/skill-creator-prod-readonly-registration-validator-v1.test.mjs'
      - '.github/workflows/cerebro-skill-creator-prod-readonly-registration.yml'
  pull_request:
    paths:
      - 'cerebro/registry/autonomous-readonly-skills.v1.json'
      - 'cerebro/governance/skill-autonomy-standing-authorization.v1.json'
      - 'cerebro/skills/skill-creator-prod-readonly-registration-validator-v1.mjs'
      - 'cerebro/tests/skill-creator-prod-readonly-registration-validator-v1.test.mjs'
      - '.github/workflows/cerebro-skill-creator-prod-readonly-registration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cerebro-skill-creator-prod-readonly-registration-${{ github.ref }}
  cancel-in-progress: true

env:
  CEREBRO_ENVIRONMENT: PROD_READONLY_ADVISORY
  CEREBRO_ALLOW_PROD_WRITE: 'false'
  CEREBRO_ALLOW_GITHUB_WRITE: 'false'
  CEREBRO_ALLOW_CUSTOMER_DATA: 'false'
  CEREBRO_ALLOW_PROD_DATA: 'false'
  CEREBRO_ALLOW_EXTERNAL_SKILL_CODE: 'false'
  CEREBRO_ALLOW_DIRECT_TOOL_EXECUTION: 'false'
  CEREBRO_ALLOW_TRADING: 'false'
  CEREBRO_PAID_FALLBACK: 'false'

jobs:
  skill-creator-prod-readonly-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate canonical Skill Creator PROD read-only advisory registration
        run: |
          set -euo pipefail
          mkdir -p artifacts/skill-creator-prod-registration
          node cerebro/skills/skill-creator-prod-readonly-registration-validator-v1.mjs \
            --output artifacts/skill-creator-prod-registration/registration-validation.json
          node --test \
            cerebro/tests/skill-creator-prod-readonly-registration-validator-v1.test.mjs \
            cerebro/tests/skill-obsidian-prod-readonly-registration-validator-v1.test.mjs

      - name: Verify standing authorization covers only this bounded registration
        run: |
          set -euo pipefail
          A='cerebro/governance/skill-autonomy-standing-authorization.v1.json'
          test "$(jq -r '.status' "$A")" = 'ACTIVE_STANDING_AUTHORIZATION'
          test "$(jq -r '.policy_id' "$A")" = 'CEREBRO-SKILL-AUTONOMY-STANDING-AUTH-001'
          test "$(jq -r '.scope.autonomous_readonly_advisory_registration' "$A")" = 'true'
          test "$(jq -r '.scope.autonomous_prod_write' "$A")" = 'false'
          test "$(jq -r '.scope.autonomous_customer_data_access' "$A")" = 'false'
          test "$(jq -r '.scope.autonomous_external_skill_code_execution' "$A")" = 'false'
          test "$(jq -r '.scope.autonomous_trading' "$A")" = 'false'
          test "$(jq -r '.scope.autonomous_paid_fallback' "$A")" = 'false'
          test "$(jq -r '.mandatory_gates.additional_cost_eur' "$A")" = '0'
          test "$(jq -r '.promotion_semantics.final_registration' "$A")" = 'READONLY_ADVISORY_METADATA_ONLY'
          test "$(jq -r '.promotion_semantics.business_prod_side_effects' "$A")" = 'DENY'

      - name: Verify immutable successful Skill Creator PROD canary evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/skill-creator-prod-registration/canary
          RUN_ID=37698393553
          SHA=5493cf3d120c5bec89261512a9097a97f167c198
          ARTIFACT_ID=11516252090
          ARTIFACT_DIGEST='sha256:27658b395b51b8696dc329075c84a5b27ca391276b884d030fb916da4d80e679'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')" = 'completed'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.name')" = 'CEREBRO Skill Creator PROD Read-only Canary'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .id")" = "$ARTIFACT_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .digest")" = "$ARTIFACT_DIGEST"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cerebro-skill-creator-prod-readonly-canary-$RUN_ID" --dir artifacts/skill-creator-prod-registration/canary
          REPORT="$(find artifacts/skill-creator-prod-registration/canary -type f -name 'cerebro-skill-creator-prod-readonly-canary.json' -print -quit)"
          TRIBUNAL="$(find artifacts/skill-creator-prod-registration/canary -type f -name 'cerebro-skill-creator-prod-readonly-canary-tribunal.json' -print -quit)"
          test -n "$REPORT"; test -n "$TRIBUNAL"
          node - "$REPORT" "$TRIBUNAL" <<'NODE'
          const fs=require('fs');const [rPath,tPath]=process.argv.slice(2);
          const r=JSON.parse(fs.readFileSync(rPath,'utf8'));const t=JSON.parse(fs.readFileSync(tPath,'utf8'));
          const ok=r.status==='GREEN_SKILL_CREATOR_PROD_READONLY_CANARY'&&r.target_candidate==='skill-creator'&&
            r.target_candidate_id==='lobehub-skills:950cf07380d1daa6de69'&&r.wrapper_id==='skillwrap:cerebro-skill-creator-v0.1.0'&&
            r.engine_id==='FACT-001'&&r.live_requests===2&&JSON.stringify(r.methods_used)===JSON.stringify(['GET'])&&
            r.audit_chain_valid===true&&r.measured_additional_cost_eur===0&&r.prod_write===false&&r.github_write===false&&
            r.merge_performed===false&&r.push_performed===false&&r.issue_or_pr_mutation===false&&r.workflow_dispatch_performed===false&&
            r.customer_data_used===false&&r.prod_data_used===false&&r.external_skill_code_executed===false&&r.trading_access===false&&
            r.paid_fallback===false&&r.rollback_proven===true&&r.rebuild_proven===true&&r.binding_after==='DISABLED'&&
            t.green===true&&t.decision==='GREEN_FOR_CONTROLLED_READONLY_ADVISORY_PROMOTION_REVIEW'&&t.human_required==='HIGH_RISK'&&
            t.prod_authorized===false&&t.prod_write_authorized===false&&t.merge_authorized===false&&t.autonomous_promotion_authorized===false;
          if(!ok){console.error('Immutable Skill Creator PROD canary or tribunal evidence is not read-only registration-safe');process.exit(1)}
          console.log(JSON.stringify({canary:'GREEN',tribunal:'GREEN_REVIEW',prod_write:false,github_write:false,cost_eur:0,rollback:true,rebuild:true}));
          NODE

      - name: Verify immutable successful FULL SAFE PREPROD evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=38805648804
          SHA=540333f2bf9db6ed06f53a60f6f8325b7df67cc4
          ARTIFACT_ID=12005049041
          ARTIFACT_DIGEST='sha256:2958627c76013d0292a46eac5fdc188d114b3166ea46b7885f5ef768cd070050'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')" = 'completed'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.name')" = 'CEREBRO Skill Full Adoption V1'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .digest")" = "$ARTIFACT_DIGEST"

      - name: Assert Skill Creator registration remains bounded to read-only advisory
        run: |
          set -euo pipefail
          R='cerebro/registry/autonomous-readonly-skills.v1.json'
          E='.entries["skill-creator"]'
          test "$(jq -r '.status' "$R")" = 'ACTIVE'
          test "$(jq -r '.environment' "$R")" = 'PROD_READONLY_ADVISORY'
          test "$(jq -r "$E.status" "$R")" = 'ACTIVE_READONLY_ADVISORY'
          test "$(jq -r "$E.execution_mode" "$R")" = 'PROD_READONLY_ADVISORY'
          test "$(jq -r "$E.target_engine_bindings | length" "$R")" = '1'
          test "$(jq -r "$E.allowed_capabilities | length" "$R")" = '2'
          test "$(jq -r "$E.mutation_gate" "$R")" = 'HIGH_RISK'
          for key in prod_write github_write merge push issue_or_pr_mutation workflow_dispatch direct_tool_execution customer_data prod_data external_skill_code_execution trading paid_fallback permission_expansion autonomous_business_prod_write; do
            test "$(jq -r "$E.safety.$key" "$R")" = 'false'
          done
          test "$(jq -r "$E.safety.additional_cost_eur" "$R")" = '0'
          test "$(jq -r "$E.activation.fail_closed" "$R")" = 'true'
          test "$(jq -r "$E.activation.rollback_state" "$R")" = 'DISABLED'
          test "$(jq -r "$E.activation.rebuild_default" "$R")" = 'DISABLED'
          test "$(jq -r "$E.activation.prod_write_authorized" "$R")" = 'false'
          test "$(jq -r "$E.activation.github_write_authorized" "$R")" = 'false'
          test "$(jq -r "$E.activation.direct_tool_execution_authorized" "$R")" = 'false'

      - name: Upload immutable registration validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-creator-prod-readonly-registration-${{ github.run_id }}
          path: artifacts/skill-creator-prod-registration/**
          if-no-files-found: warn
          retention-days: 30

  full-cerebro-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs

  main-baseline-full-cerebro:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs
