name: Roll back PROD to previous stable artifact

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROD_URL: https://app.fenixcapital.es

concurrency:
  group: fenix-prod-promotion
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.fenixcapital.es
    steps:
      - name: Checkout operational history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Resolve previous stable snapshot
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          message="$(git log -1 --pretty=%s)"
          if [[ "$message" != deploy\(prod\):\ promote\ * ]]; then
            echo "Current gh-pages commit was not created by protected promotion; refusing blind rollback." >&2
            exit 1
          fi
          target="$(git rev-parse HEAD^)"
          test -n "$target"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Move operational branch back without rebuilding
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "${TARGET_SHA}:refs/heads/gh-pages"
          {
            echo '### PROD rollback'
            echo "- from: \`${{ steps.resolve.outputs.current }}\`"
            echo "- to: \`${TARGET_SHA}\`"
            echo '- rebuild: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post-rollback read-only smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --output /tmp/prod-index --write-out '%{http_code}' --max-time 20 "${PROD_URL}/")" || status=000
            if [ "$status" = '200' ] && grep -qi '<!doctype html' /tmp/prod-index; then
              exit 0
            fi
            sleep 10
          done
          echo 'Operational site did not pass post-rollback smoke in time' >&2
          exit 1
