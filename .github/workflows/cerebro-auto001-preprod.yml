name: CEREBRO AUTO-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-opt001-resource-optimization-v0-20260911']
    paths:
      - 'cerebro/platform/automation-factory-engine.mjs'
      - 'cerebro/tests/automation-factory-engine.test.mjs'
      - '.github/workflows/cerebro-auto001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/automation-factory-engine.test.mjs
