name: UMS001 creative Prompt Factory multichannel correction QA LAB no spend
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ums001-prompt-forge-multichannel-qa-lab.yml'
      - 'cerebro/media-studio/v2/runtime/ums001_prompt_forge_lab_v0.py'
      - 'cerebro/media-studio/v2/tests/test_ums001_prompt_forge_lab_v0.py'
permissions:
  contents: read
jobs:
  verify-internal-producer-prompt-factory:
    if: github.head_ref == 'cerebro/ums001-visual-learning-no-reference-lab-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate existing CEREBRO Prompt Factory and channel-specific regression at no provider cost
        run: |
          python3 -m py_compile cerebro/media-studio/v2/runtime/ums001_prompt_forge_lab_v0.py
          python3 cerebro/media-studio/v2/tests/test_ums001_prompt_forge_lab_v0.py -v
      - name: Confirm studio retained creative ownership
        run: echo 'Producer=UMS001; DeepSeek=temporary teacher; Replicate=provider; ZERO paid calls. QA remains blocked until real pixel acceptance.'
