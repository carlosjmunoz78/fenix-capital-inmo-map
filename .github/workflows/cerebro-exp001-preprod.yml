name: CEREBRO EXP-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-opp001-opportunity-engine-v0-20260911']
    paths:
      - 'cerebro/strategy/experiment-engine.mjs'
      - 'cerebro/tests/experiment-engine.test.mjs'
      - '.github/workflows/cerebro-exp001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/experiment-engine.test.mjs