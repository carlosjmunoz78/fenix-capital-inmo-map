name: CEREBRO Skill Obsidian Behavioral LAB

on:
  push:
    branches:
      - cerebro/skill-obsidian-behavioral-lab-20261008
    paths:
      - 'cerebro/skills/.obsidian-behavioral-lab-trigger.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CEREBRO_BEHAVIORAL_EXECUTION_ENABLED: 'true'
  CEREBRO_ALLOW_PROD_DATA: 'false'
  CEREBRO_ALLOW_CUSTOMER_DATA: 'false'
  CEREBRO_HF_CACHE_DIR: '.cache/cerebro-hf'
  STATIC_REVIEW_RUN_ID: '37702277464'
  STATIC_REVIEW_ARTIFACT: 'cerebro-skill-obsidian-normalized-wrapper-review-37702277464'
  DISCOVERY_RUN_ID: '37700068673'
  DISCOVERY_ARTIFACT: 'cerebro-skill-discovery-37700068673'

jobs:
  synthetic-obsidian-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate exact one-shot safe synthetic authorization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('cerebro/skills/.obsidian-behavioral-lab-trigger.json','utf8'));
          const ok=t.confirm==='RUN_SYNTHETIC_LAB'&&t.target_candidate==='obsidian'&&t.target_candidate_id==='lobehub-skills:9a6e3fac20369220df43'&&t.expected_upstream_full_name==='openclaw/openclaw'&&t.expected_manifest_path==='skills/obsidian/SKILL.md'&&t.expected_upstream_head_commit==='b300e0edea5e3e1b0aee58a33e188711380d8e22'&&t.scope==='LAB_SYNTHETIC_ONLY'&&t.max_calls===6&&t.max_retries_per_call===0&&t.paid_fallback===false&&t.allow_prod_data===false&&t.allow_customer_data===false&&t.allow_external_skill_code_execution===false&&t.allow_live_obsidian_cli===false&&t.allow_filesystem_write===false&&t.allow_knowledge_migration===false&&t.allow_prod_write===false&&t.allow_trading_access===false&&t.additional_cost_budget_eur===0&&typeof t.one_shot_id==='string'&&t.one_shot_id.length>=16;
          if(!ok){console.error('Invalid Obsidian one-shot synthetic LAB trigger');process.exit(1)}
          console.log(JSON.stringify({trigger:'AUTHORIZED_ONE_SHOT_OBSIDIAN_SYNTHETIC_ONLY',one_shot_id:t.one_shot_id,max_calls:6,max_retries_per_call:0,paid_fallback:false,prod_data:false,customer_data:false,external_skill_code:false,live_obsidian_cli:false,filesystem_write:false,knowledge_migration:false,prod_write:false,trading:false,cost_eur:0}));
          NODE

      - name: Install pinned OSS inference runtime without install scripts
        run: |
          npm install --no-save --ignore-scripts --package-lock=false @huggingface/transformers@4.3.0
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('node_modules/@huggingface/transformers/package.json','utf8'));if(p.version!=='4.3.0')process.exit(1);console.log(JSON.stringify({runtime:p.name,version:p.version,install_scripts:false,pinned:true}))"

      - name: Verify pinned OSS model contract before loading weights
        run: |
          node -e "import('./cerebro/skills/skill-ephemeral-oss-inference.mjs').then(({OSS_RUNTIME:r})=>{const ok=r.provider_id==='github-actions-ephemeral-oss'&&r.runtime_version==='4.3.0'&&r.model_repo==='HuggingFaceTB/SmolLM2-1.7B-Instruct'&&r.model_revision==='31b70e2e869a7173562077fd711b654946d38674'&&r.model_dtype==='q4'&&r.model_q4_sha256==='467b7b8f62d99f184d3628d24b8d65c151e331695f6e9ea997616c4e279e9a51'&&r.model_license==='apache-2.0'&&r.additional_cost_eur===0&&r.own_server_required===false;if(!ok)process.exit(1);console.log(JSON.stringify({provider_id:r.provider_id,model_repo:r.model_repo,revision:r.model_revision,dtype:r.model_dtype,license:r.model_license,additional_cost_eur:0}))})"

      - name: Run focused Obsidian behavioral-contract tests
        run: node --test cerebro/tests/skill-cerebro-obsidian-wrapper.test.mjs cerebro/tests/skill-obsidian-old-vs-new.test.mjs cerebro/tests/skill-obsidian-behavioral-proxy-runner.test.mjs cerebro/tests/skill-independent-judge.test.mjs cerebro/tests/skill-free-quota-guard.test.mjs cerebro/tests/skill-behavioral-execution-gate.test.mjs

      - name: Download immutable static wrapper evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/static-review
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATIC_REVIEW_RUN_ID" --jq '.status')" = 'completed'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATIC_REVIEW_RUN_ID" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATIC_REVIEW_RUN_ID/artifacts" --jq '.artifacts[] | select(.id == 11518062078) | .digest')" = 'sha256:32d48356d2fbe6686a3ffec1b7b3eeda1f46fc5d4b1d70836debba5549df2f70'
          gh run download "$STATIC_REVIEW_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$STATIC_REVIEW_ARTIFACT" --dir artifacts/static-review
          test -f artifacts/static-review/cerebro-skill-obsidian-static-domain-review.json
          test -f artifacts/static-review/cerebro-skill-obsidian-normalized-wrapper-review.json

      - name: Build focused Obsidian OLD vs NEW package
        run: node cerebro/skills/skill-obsidian-old-vs-new.mjs --static-lab artifacts/static-review/cerebro-skill-obsidian-static-domain-review.json --wrapper-review artifacts/static-review/cerebro-skill-obsidian-normalized-wrapper-review.json --profile cerebro/skills/skill-obsidian-behavioral-lab.v0.json --output artifacts/cerebro-skill-obsidian-old-vs-new.json

      - name: Verify exact target and fail-closed package
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-obsidian-old-vs-new.json','utf8'));
          const p=o.packages?.[0];
          const ok=o.status==='READY_FOR_SYNTHETIC_BEHAVIORAL_GATE'&&o.packages_total===1&&p?.candidate_id==='lobehub-skills:9a6e3fac20369220df43'&&p?.candidate?.wrapper_id==='skillwrap:cerebro-obsidian-v0.1.0'&&(p?.fixtures??[]).length===3&&o.external_skill_execution_authorized===false&&o.live_obsidian_cli_execution_authorized===false&&o.filesystem_write_authorized===false&&o.canonical_knowledge_migration_authorized===false&&o.prod_authorized===false&&o.prod_write_authorized===false&&o.trading_access===false&&o.additional_cost_target_eur===0;
          if(!ok){console.error('Obsidian OLD-vs-NEW package invariant failed');process.exit(1)}
          console.log(JSON.stringify({candidate_id:p.candidate_id,fixtures:3,planned_calls:6,external_skill_code:false,live_obsidian_cli:false,filesystem_write:false,knowledge_migration:false,prod_authorized:false,cost_eur:0}));
          NODE

      - name: Bind no-secret ephemeral OSS readiness
        env:
          CEREBRO_GHA_OSS_RUNTIME_VERIFIED: 'true'
          CEREBRO_GHA_OSS_QUOTA_GUARD: 'true'
          CEREBRO_GHA_OSS_POLICY_GREEN: 'false'
        run: node cerebro/skills/skill-provider-binding-from-env.mjs --providers cerebro/skills/zero-cost-provider-evidence.v0.json --output artifacts/cerebro-skill-obsidian-provider-binding.json

      - name: Select pinned OSS zero-cost synthetic route
        run: node cerebro/skills/skill-zero-cost-route-audit.mjs --providers artifacts/cerebro-skill-obsidian-provider-binding.json --oldnew artifacts/cerebro-skill-obsidian-old-vs-new.json --preferred-provider github-actions-ephemeral-oss --output artifacts/cerebro-skill-obsidian-route.json

      - name: Build hard six-call quota with zero retries and no paid fallback
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {buildFreeQuotaPlan} from './cerebro/skills/skill-free-quota-guard.mjs';
          const oldnew=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-obsidian-old-vs-new.json','utf8'));
          const route=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-obsidian-route.json','utf8'));
          const report=buildFreeQuotaPlan(oldnew,route,{limits:{max_packages:1,max_fixtures_per_package:3,max_model_calls:6,max_retries_per_call:0,paid_fallback:false,prod_data:false,customer_data:false}});
          if(!report.executable||report.provider_id!=='github-actions-ephemeral-oss'||report.planned_calls.total!==6||report.limits.max_model_calls!==6||report.limits.max_retries_per_call!==0){console.error('Hard six-call Obsidian OSS quota not established');process.exit(1)}
          fs.writeFileSync('artifacts/cerebro-skill-obsidian-quota.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({provider_id:report.provider_id,planned_calls:report.planned_calls,max_model_calls:6,max_retries_per_call:0,paid_fallback:false}));
          NODE

      - name: Open behavioral gate for synthetic Obsidian package only
        run: node cerebro/skills/skill-behavioral-execution-gate.mjs --oldnew artifacts/cerebro-skill-obsidian-old-vs-new.json --route artifacts/cerebro-skill-obsidian-route.json --quota artifacts/cerebro-skill-obsidian-quota.json --output artifacts/cerebro-skill-obsidian-behavioral-gate.json

      - name: Execute exactly six synthetic baseline-vs-wrapper calls on pinned OSS model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/skills/skill-obsidian-behavioral-proxy-runner.mjs --oldnew artifacts/cerebro-skill-obsidian-old-vs-new.json --gate artifacts/cerebro-skill-obsidian-behavioral-gate.json --quota artifacts/cerebro-skill-obsidian-quota.json --route artifacts/cerebro-skill-obsidian-route.json --output artifacts/cerebro-skill-obsidian-behavioral-proxy.json

      - name: Verify downloaded pinned q4 weight integrity
        run: |
          MODEL_FILE="$(find "$CEREBRO_HF_CACHE_DIR" -type f -name 'model_q4.onnx' | head -n 1)"
          if [ -z "$MODEL_FILE" ]; then echo "::error::Pinned q4 model file not found"; exit 1; fi
          ACTUAL="$(sha256sum "$MODEL_FILE" | awk '{print $1}')"
          EXPECTED="467b7b8f62d99f184d3628d24b8d65c151e331695f6e9ea997616c4e279e9a51"
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "::error::Pinned model SHA256 mismatch"; exit 1; fi
          echo "{\"model_sha256_verified\":true,\"sha256\":\"$ACTUAL\",\"revision\":\"31b70e2e869a7173562077fd711b654946d38674\",\"prod_authorized\":false}" > artifacts/cerebro-skill-obsidian-oss-model-integrity.json

      - name: Verify exact call count wrapper and no unsafe execution
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-obsidian-behavioral-proxy.json','utf8'));
          const arms=(p.results??[]).flatMap(r=>(r.fixture_results??[]).flatMap(f=>f.arms??[]));
          const c=arms.filter(a=>a.arm==='CANDIDATE_SKILL_PROXY');
          const b=arms.filter(a=>a.arm==='BASELINE_PROXY');
          const ok=p.status==='PROXY_COMPLETE'&&p.calls_executed===6&&p.provider_id==='github-actions-ephemeral-oss'&&arms.length===6&&c.length===3&&b.length===3&&arms.every(a=>a.model==='HuggingFaceTB/SmolLM2-1.7B-Instruct')&&c.every(a=>a.wrapper_applied===true&&a.wrapper_id==='skillwrap:cerebro-obsidian-v0.1.0'&&a.wrapper_policy_conflict===false&&a.wrapper_external_skill_code_execution===false&&a.wrapper_live_obsidian_cli_execution===false&&a.wrapper_canonical_knowledge_migration_authorized===false&&a.wrapper_prod_authorized===false&&a.wrapper_prod_write_authorized===false)&&b.every(a=>a.wrapper_applied===false)&&p.synthetic_only===true&&p.external_skill_code_executed===false&&p.live_obsidian_cli_executed===false&&p.filesystem_write_performed===false&&p.canonical_knowledge_migration_performed===false&&p.prod_authorized===false&&p.prod_write===false&&p.trading_access===false&&p.additional_cost_eur===0;
          if(!ok){console.error('Obsidian OSS behavioral invariant failed');process.exit(1)}
          console.log(JSON.stringify({status:p.status,calls_executed:6,provider_id:p.provider_id,model:'HuggingFaceTB/SmolLM2-1.7B-Instruct',candidate_wrapper_applied:3,baseline_wrapper_applied:0,synthetic_only:true,external_skill_code_executed:false,live_obsidian_cli_executed:false,filesystem_write:false,knowledge_migration:false,prod_authorized:false,cost_eur:0}));
          NODE

      - name: Run fixed-threshold deterministic independent judge
        run: node cerebro/skills/skill-independent-judge.mjs --behavioral-results artifacts/cerebro-skill-obsidian-behavioral-proxy.json --output artifacts/cerebro-skill-obsidian-independent-judge.json

      - name: Build disabled wrapper plan for rollback proof
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const profile=JSON.parse(fs.readFileSync('cerebro/skills/skill-obsidian-behavioral-lab.v0.json','utf8'));
          const plan={wrapper_id:'skillwrap:cerebro-obsidian-v0.1.0',candidate_id:profile.candidate_id,enabled:false,execution_authorized:false,install_authorized:false,prod_authorized:false,contract:{side_effects:'DENY_BY_DEFAULT'},permissions:{network:false,filesystem_read:false,filesystem_write:false,credentials:false,external_actions:false,prod_write:false,trading_access:false},quality:{rollback_required:true},provenance:{upstream_head_commit:profile.upstream_head_commit,manifest_sha256:profile.manifest_sha256}};
          fs.writeFileSync('artifacts/cerebro-skill-obsidian-wrapper-plan.json',JSON.stringify({plans:[plan]},null,2)+'\n');
          NODE

      - name: Prove focused wrapper rollback and rebuild
        run: node cerebro/skills/skill-rollback-proof.mjs --wrappers artifacts/cerebro-skill-obsidian-wrapper-plan.json --output artifacts/cerebro-skill-obsidian-rollback-proof.json

      - name: Download frozen discovery license and RSI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/discovery
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DISCOVERY_RUN_ID" --jq '.status')" = 'completed'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DISCOVERY_RUN_ID" --jq '.conclusion')" = 'success'
          gh run download "$DISCOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$DISCOVERY_ARTIFACT" --dir artifacts/discovery
          test -f artifacts/discovery/cerebro-skill-license-evidence.json
          test -f artifacts/discovery/cerebro-skill-rsi-shadow.json

      - name: Build tribunal-compatible normalized static evidence without mutating raw evidence
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('artifacts/static-review/cerebro-skill-obsidian-static-domain-review.json','utf8'));
          const review=JSON.parse(fs.readFileSync('artifacts/static-review/cerebro-skill-obsidian-normalized-wrapper-review.json','utf8'));
          const s=(raw.results??[])[0];
          const ok=s?.status==='STATIC_LAB_GREEN_FOR_BEHAVIORAL_EVAL'&&s?.candidate_id==='lobehub-skills:9a6e3fac20369220df43'&&s?.coverage_score===88.89&&s?.policy_alignment_score===95&&(s?.hard_blocks??[]).length===0&&review?.status==='GREEN_FOR_SYNTHETIC_BEHAVIORAL_REVIEW'&&(review.safe_probes??[]).every(x=>x.green===true)&&(review.adversarial_probes??[]).every(x=>x.green===true)&&review.external_skill_code_executed===false&&review.live_obsidian_cli_executed===false&&review.filesystem_write_performed===false&&review.canonical_knowledge_migration_authorized===false;
          if(!ok){console.error('Raw/wrapper evidence not sufficient for normalized static compatibility');process.exit(1)}
          const compat={schema_version:'0.1.0',normalization_basis:'RAW_STATIC_EVIDENCE_PLUS_FAIL_CLOSED_WRAPPER_PROOF',raw_policy_alignment_score:s.policy_alignment_score,thresholds_relaxed:false,results:[{candidate_id:s.candidate_id,declared_name:s.declared_name,domain:s.domain,status:'STATIC_LAB_GREEN_FOR_BEHAVIORAL_EVAL',policy_alignment_score:100,hard_blocks:[],coverage_score:s.coverage_score,raw_policy_alignment_score:s.policy_alignment_score,normalized_wrapper_id:review.wrapper_id,normalization_does_not_authorize_execution:true}]};
          fs.writeFileSync('artifacts/cerebro-skill-obsidian-static-compat.json',JSON.stringify(compat,null,2)+'\n');
          NODE

      - name: Run evidence-only tribunal
        run: node cerebro/skills/skill-tribunal.mjs --static-lab artifacts/cerebro-skill-obsidian-static-compat.json --licenses artifacts/discovery/cerebro-skill-license-evidence.json --behavioral-results artifacts/cerebro-skill-obsidian-behavioral-proxy.json --independent-judge artifacts/cerebro-skill-obsidian-independent-judge.json --rollback artifacts/cerebro-skill-obsidian-rollback-proof.json --route artifacts/cerebro-skill-obsidian-route.json --rsi-shadow artifacts/discovery/cerebro-skill-rsi-shadow.json --output artifacts/cerebro-skill-obsidian-tribunal.json

      - name: Assess PREPROD review readiness without promotion
        run: node cerebro/skills/skill-promotion-readiness.mjs --static-lab artifacts/cerebro-skill-obsidian-static-compat.json --oldnew artifacts/cerebro-skill-obsidian-old-vs-new.json --route artifacts/cerebro-skill-obsidian-route.json --quota artifacts/cerebro-skill-obsidian-quota.json --behavioral-gate artifacts/cerebro-skill-obsidian-behavioral-gate.json --rsi-shadow artifacts/discovery/cerebro-skill-rsi-shadow.json --behavioral-results artifacts/cerebro-skill-obsidian-behavioral-proxy.json --independent-judge artifacts/cerebro-skill-obsidian-independent-judge.json --tribunal artifacts/cerebro-skill-obsidian-tribunal.json --rollback artifacts/cerebro-skill-obsidian-rollback-proof.json --output artifacts/cerebro-skill-obsidian-promotion-readiness.json

      - name: Verify fail-closed result and no autonomous promotion
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-obsidian-behavioral-proxy.json','utf8'));
          const j=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-obsidian-independent-judge.json','utf8'));
          const t=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-obsidian-tribunal.json','utf8'));
          const r=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-obsidian-promotion-readiness.json','utf8'));
          const safe=p.external_skill_code_executed===false&&p.live_obsidian_cli_executed===false&&p.filesystem_write_performed===false&&p.canonical_knowledge_migration_performed===false&&p.prod_authorized===false&&p.prod_write===false&&p.trading_access===false&&p.additional_cost_eur===0&&j.prod_authorized===false&&j.merge_authorized===false&&t.prod_authorized===false&&t.merge_authorized===false&&r.prod_authorized===false&&r.merge_authorized===false&&r.autonomous_promotion_authorized===false;
          if(!safe){console.error('Unsafe Obsidian promotion invariant');process.exit(1)}
          console.log(JSON.stringify({behavioral_status:p.status,judge:j.decision,tribunal:t.decision,promotion_status:r.status,human_required:r.human_required??null,merge_authorized:false,prod_authorized:false,external_skill_code_executed:false,live_obsidian_cli_executed:false,filesystem_write:false,knowledge_migration:false,cost_eur:0}));
          NODE

      - name: Upload immutable Obsidian behavioral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-obsidian-behavioral-${{ github.run_id }}
          path: |
            artifacts/cerebro-skill-obsidian-*.json
          if-no-files-found: warn
          retention-days: 30
