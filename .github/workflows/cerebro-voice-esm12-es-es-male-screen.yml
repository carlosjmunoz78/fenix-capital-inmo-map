name: CEREBRO VOICE-001 ESM12 es-ES Male Timbre Screen

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/voice/runtime/esm12_es_es_male_voicebank_screen.py'
      - '.github/workflows/cerebro-voice-esm12-es-es-male-screen.yml'

permissions:
  contents: read

jobs:
  esm12-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install screening client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'edge-tts>=7,<8'

      - name: Generate all available Spain-Spanish male screening samples
        env:
          CEREBRO_ENVIRONMENT: LAB
        run: |
          mkdir -p "$RUNNER_TEMP/esm12"
          python cerebro/voice/runtime/esm12_es_es_male_voicebank_screen.py --output-dir "$RUNNER_TEMP/esm12"

      - name: Verify evidence boundary
        shell: python
        run: |
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'esm12' / 'ESM12_voicebank_screen_evidence.json'
          e = json.loads(p.read_text(encoding='utf-8'))
          assert e['engine_id'] == 'VOICE-001'
          assert e['voice_target'] == 'ESM12'
          assert e['target_locale'] == 'es-ES'
          assert e['usage_boundary']['external_lab_discovery_only'] is True
          assert e['usage_boundary']['production_dependency'] is False
          assert e['usage_boundary']['training_or_cloning_reference_use'] is False
          assert e['identity_policy']['actor_clone'] is False
          assert e['identity_policy']['movie_audio_reference'] is False
          assert e['authority']['automatic_promotion'] is False
          assert e['authority']['prod_enabled'] is False
          assert len(e['candidates']) >= 1
          print(f"GREEN: ESM12 generated {len(e['candidates'])} native es-ES male audition samples; no promotion.")

      - name: Upload owner-listening screening pack
        uses: actions/upload-artifact@v4
        with:
          name: voice001-esm12-es-es-male-screen
          path: |
            ${{ runner.temp }}/esm12/*.mp3
            ${{ runner.temp }}/esm12/ESM12_voicebank_screen_evidence.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Record scope
        run: |
          echo 'External LAB discovery only; not a production dependency.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Samples are not authorized as training/cloning references without a separate licensing review.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No actor, character or movie audio used. Owner listening required.' >> "$GITHUB_STEP_SUMMARY"
