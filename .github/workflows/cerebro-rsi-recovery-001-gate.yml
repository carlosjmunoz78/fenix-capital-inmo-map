permissions:
  contents: read

jobs:
  rsi-recovery-001-runtime-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse Windows host PowerShell assets
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem 'cerebro/host/windows/*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("PowerShell parse error in {0}: {1}" -f $_.Name, (($errors | ForEach-Object { $_.Message }) -join '; '))
            }
          }
          if ($failed) { exit 1 }
      - name: Recovered RSI runtime, hostless control plane, HYG audit-only, bounded recovery, measured MetaLearn, horizon execution, autonomous scheduling, real event wiring, PREPROD persistence, host binding, governance and bridge regression tests
        run: >-
          node --test
          cerebro/tests/continuous-improvement-contract.test.mjs
          cerebro/tests/continuous-improvement-scheduler.test.mjs
          cerebro/tests/learning-orchestrator.test.mjs
          cerebro/tests/learning-horizon-executor.test.mjs
          cerebro/tests/learning-pipeline.test.mjs
          cerebro/tests/learning-ledger.test.mjs
          cerebro/tests/learning-preprod-pipeline.test.mjs
          cerebro/tests/rsi-learning-worker.test.mjs
          cerebro/tests/rsi-learning-host.test.mjs
          cerebro/tests/rsi-learning-auto-host.test.mjs
          cerebro/tests/rsi-event-outbox.test.mjs
          cerebro/tests/rsi-outbox-client.test.mjs
          cerebro/tests/rsi-outbox-publisher-workflow.test.mjs
          cerebro/tests/rsi-hostless-control-plane-workflow.test.mjs
          cerebro/tests/rsi-learning-windows-host.test.mjs
          cerebro/tests/meta-observability-ledger.test.mjs
          cerebro/tests/meta-learning-runner.test.mjs
          cerebro/tests/hygiene-audit.test.mjs
          cerebro/tests/bounded-recovery-supervisor.test.mjs
          cerebro/tests/experiment-pipeline.test.mjs
          cerebro/tests/evaluation-tribunal.test.mjs
          cerebro/tests/promotion-pipeline.test.mjs
          cerebro/tests/meta-learning.test.mjs
          cerebro/tests/multi-company-learning.test.mjs
          cerebro/tests/factory-supervisor-improvement.test.mjs
          cerebro/tests/knowledge-obsolescence.test.mjs
          cerebro/tests/continuity-handoff.test.mjs
          cerebro/tests/rsi-observability-adapter.test.mjs
          cerebro/tests/rsi-recovery-e2e.test.mjs
