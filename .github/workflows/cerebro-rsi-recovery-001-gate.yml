      - 'cerebro/tests/meta-learning.test.mjs'
      - 'cerebro/tests/multi-company-learning.test.mjs'
      - 'cerebro/tests/factory-supervisor-improvement.test.mjs'
      - 'cerebro/tests/knowledge-obsolescence.test.mjs'
      - 'cerebro/tests/continuity-handoff.test.mjs'
      - 'cerebro/tests/rsi-observability-adapter.test.mjs'
      - 'cerebro/tests/rsi-recovery-e2e.test.mjs'
      - 'cerebro/tests/skill-rsi-shadow-bridge.test.mjs'
      - 'cerebro/docs/RSI_RECOVERY_001_*.md'
      - 'cerebro/docs/RSI_RECOVERY_002_*.md'
      - '.github/workflows/cerebro-rsi-recovery-001-gate.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/continuous-improvement-contract.mjs'
      - 'cerebro/runtime/continuous-improvement-scheduler.mjs'
      - 'cerebro/runtime/learning-pipeline.mjs'
      - 'cerebro/runtime/learning-ledger.mjs'
