      - 'cerebro/runtime/experiment-pipeline.mjs'
      - 'cerebro/runtime/evaluation-tribunal.mjs'
      - 'cerebro/runtime/promotion-pipeline.mjs'
      - 'cerebro/runtime/meta-learning.mjs'
      - 'cerebro/runtime/multi-company-learning.mjs'
      - 'cerebro/runtime/factory-supervisor-improvement.mjs'
      - 'cerebro/runtime/knowledge-obsolescence.mjs'
      - 'cerebro/runtime/continuity-handoff.mjs'
      - 'cerebro/runtime/rsi-observability-adapter.mjs'
      - 'cerebro/skills/skill-rsi-shadow-bridge.mjs'
      - 'cerebro/tests/continuous-improvement-contract.test.mjs'
      - 'cerebro/tests/continuous-improvement-scheduler.test.mjs'
      - 'cerebro/tests/learning-pipeline.test.mjs'
      - 'cerebro/tests/learning-ledger.test.mjs'
      - 'cerebro/tests/learning-preprod-pipeline.test.mjs'
      - 'cerebro/tests/experiment-pipeline.test.mjs'
      - 'cerebro/tests/evaluation-tribunal.test.mjs'
      - 'cerebro/tests/promotion-pipeline.test.mjs'
      - 'cerebro/tests/meta-learning.test.mjs'
      - 'cerebro/tests/multi-company-learning.test.mjs'
      - 'cerebro/tests/factory-supervisor-improvement.test.mjs'
      - 'cerebro/tests/knowledge-obsolescence.test.mjs'
      - 'cerebro/tests/continuity-handoff.test.mjs'
      - 'cerebro/tests/rsi-observability-adapter.test.mjs'
      - 'cerebro/tests/rsi-recovery-e2e.test.mjs'
      - 'cerebro/tests/skill-rsi-shadow-bridge.test.mjs'
      - 'cerebro/docs/RSI_RECOVERY_001_*.md'
      - 'cerebro/docs/RSI_RECOVERY_002_*.md'
      - '.github/workflows/cerebro-rsi-recovery-001-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rsi-recovery-001-runtime-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recovered RSI runtime, PREPROD persistence, governance and bridge regression tests
        run: >-
          node --test
          cerebro/tests/continuous-improvement-contract.test.mjs
          cerebro/tests/continuous-improvement-scheduler.test.mjs
          cerebro/tests/learning-pipeline.test.mjs
          cerebro/tests/learning-ledger.test.mjs
          cerebro/tests/learning-preprod-pipeline.test.mjs
          cerebro/tests/experiment-pipeline.test.mjs
          cerebro/tests/evaluation-tribunal.test.mjs
          cerebro/tests/promotion-pipeline.test.mjs
          cerebro/tests/meta-learning.test.mjs
          cerebro/tests/multi-company-learning.test.mjs
          cerebro/tests/factory-supervisor-improvement.test.mjs
          cerebro/tests/knowledge-obsolescence.test.mjs
          cerebro/tests/continuity-handoff.test.mjs
          cerebro/tests/rsi-observability-adapter.test.mjs
          cerebro/tests/rsi-recovery-e2e.test.mjs
          cerebro/tests/skill-rsi-shadow-bridge.test.mjs
