name: CEREBRO RSI Recovery 001 Gate

on:
  push:
    paths:
      - 'cerebro/runtime/continuous-improvement-contract.mjs'
      - 'cerebro/runtime/continuous-improvement-scheduler.mjs'
      - 'cerebro/runtime/learning-pipeline.mjs'
      - 'cerebro/runtime/experiment-pipeline.mjs'
      - 'cerebro/runtime/evaluation-tribunal.mjs'
      - 'cerebro/runtime/promotion-pipeline.mjs'
      - 'cerebro/runtime/meta-learning.mjs'
      - 'cerebro/runtime/multi-company-learning.mjs'
      - 'cerebro/skills/skill-rsi-shadow-bridge.mjs'
      - 'cerebro/tests/continuous-improvement-contract.test.mjs'
      - 'cerebro/tests/continuous-improvement-scheduler.test.mjs'
      - 'cerebro/tests/learning-pipeline.test.mjs'
      - 'cerebro/tests/experiment-pipeline.test.mjs'
      - 'cerebro/tests/evaluation-tribunal.test.mjs'
      - 'cerebro/tests/promotion-pipeline.test.mjs'
      - 'cerebro/tests/meta-learning.test.mjs'
      - 'cerebro/tests/multi-company-learning.test.mjs'
      - 'cerebro/tests/skill-rsi-shadow-bridge.test.mjs'
      - 'cerebro/docs/RSI_RECOVERY_001_AUDIT_2026-10-08.md'
      - '.github/workflows/cerebro-rsi-recovery-001-gate.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/continuous-improvement-contract.mjs'
      - 'cerebro/runtime/continuous-improvement-scheduler.mjs'
      - 'cerebro/runtime/learning-pipeline.mjs'
      - 'cerebro/runtime/experiment-pipeline.mjs'
      - 'cerebro/runtime/evaluation-tribunal.mjs'
      - 'cerebro/runtime/promotion-pipeline.mjs'
      - 'cerebro/runtime/meta-learning.mjs'
      - 'cerebro/runtime/multi-company-learning.mjs'
      - 'cerebro/skills/skill-rsi-shadow-bridge.mjs'
      - 'cerebro/tests/continuous-improvement-contract.test.mjs'
      - 'cerebro/tests/continuous-improvement-scheduler.test.mjs'
      - 'cerebro/tests/learning-pipeline.test.mjs'
      - 'cerebro/tests/experiment-pipeline.test.mjs'
      - 'cerebro/tests/evaluation-tribunal.test.mjs'
      - 'cerebro/tests/promotion-pipeline.test.mjs'
      - 'cerebro/tests/meta-learning.test.mjs'
      - 'cerebro/tests/multi-company-learning.test.mjs'
      - 'cerebro/tests/skill-rsi-shadow-bridge.test.mjs'
      - 'cerebro/docs/RSI_RECOVERY_001_AUDIT_2026-10-08.md'
      - '.github/workflows/cerebro-rsi-recovery-001-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rsi-recovery-001-runtime-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recovered RSI runtime slice and current bridge regression tests
        run: >-
          node --test
          cerebro/tests/continuous-improvement-contract.test.mjs
          cerebro/tests/continuous-improvement-scheduler.test.mjs
          cerebro/tests/learning-pipeline.test.mjs
          cerebro/tests/experiment-pipeline.test.mjs
          cerebro/tests/evaluation-tribunal.test.mjs
          cerebro/tests/promotion-pipeline.test.mjs
          cerebro/tests/meta-learning.test.mjs
          cerebro/tests/multi-company-learning.test.mjs
          cerebro/tests/skill-rsi-shadow-bridge.test.mjs
