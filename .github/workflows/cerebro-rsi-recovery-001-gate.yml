      - 'cerebro/runtime/multi-company-learning.mjs'
      - 'cerebro/runtime/factory-supervisor-improvement.mjs'
      - 'cerebro/runtime/knowledge-obsolescence.mjs'
      - 'cerebro/runtime/continuity-handoff.mjs'
      - 'cerebro/runtime/rsi-observability-adapter.mjs'
      - 'cerebro/skills/skill-rsi-shadow-bridge.mjs'
      - 'cerebro/tests/continuous-improvement-contract.test.mjs'
      - 'cerebro/tests/continuous-improvement-scheduler.test.mjs'
      - 'cerebro/tests/learning-pipeline.test.mjs'
