name: JARVIS Public Asset Read-Only Diagnostic
on:
  push:
    branches: [diagnostics/jarvis-asset-probe-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public SPA HTML and compiled asset fingerprints
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,hashlib,json
          origins=[
            'https://app.fenixcapital.es',
            'https://fenix-capital-preprod-kkluxplcu.vercel.app',
          ]
          import socket
          print('DNS_RECORDS')
          for host in ['app.fenixcapital.es','fenix-capital-preprod-kkluxplcu.vercel.app']:
            try:print('HOST',host,[tuple(x[4]) for x in socket.getaddrinfo(host,443,proto=socket.IPPROTO_TCP)])
            except Exception as e:print('DNS_ERROR',host,str(e))
          for origin in origins:
            print('ORIGIN',origin)
            url=origin+'/cerebro?section=jarvis&diag=20261103'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'JARVIS-read-only-asset-probe/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                raw=resp.read(200000)
                html=raw.decode('utf8','replace')
                print('HTML',json.dumps({'status':resp.status,'final':resp.url,'sha256':hashlib.sha256(raw).hexdigest()[:16],'cache_control':resp.headers.get('cache-control'),'cf_cache_status':resp.headers.get('cf-cache-status'),'age':resp.headers.get('age'),'x_vercel_cache':resp.headers.get('x-vercel-cache'),'content_type':resp.headers.get('content-type')}))
                assets=list(dict.fromkeys(re.findall(r'["\'](/assets/[^"\']+\\.(?:js|css))["\']',html)))
                print('ASSETS',assets[:16])
              for path in assets[:12]:
                try:
                  with urllib.request.urlopen(urllib.request.Request(origin+path,headers={'User-Agent':'JARVIS-read-only-asset-probe/1.0'}),timeout=15) as asset:
                    body=asset.read(5000000)
                    print('ASSET',json.dumps({'path':path,'status':asset.status,'sha256':hashlib.sha256(body).hexdigest()[:16],'bytes':len(body),'has_font_control_key':b'jarvis_home_font_scale_v1' in body,'has_font_control_label':b'Aumentar letra' in body,'cache_control':asset.headers.get('cache-control'),'cf_cache_status':asset.headers.get('cf-cache-status')}))
                except Exception as e:
                  print('ASSET_ERROR',path,type(e).__name__,str(e)[:160])
            except urllib.error.HTTPError as e:
              print('HTML_HTTP_ERROR',json.dumps({'status':e.code,'url':e.url,'headers':{k:v for k,v in e.headers.items() if k.lower() in ('server','cf-ray','cf-cache-status','cache-control','content-type','x-vercel-error','x-vercel-id','location','age')},'body_start':(body:=e.read(150000)).decode('utf8','replace')[:320],'assets':list(dict.fromkeys(re.findall(r'/assets/[^"\\s]+?\\.(?:js|css)',body.decode('utf8','replace'))))[:12]}))
            except Exception as e:
              print('HTML_ERROR',type(e).__name__,str(e)[:180])
          PY

      - name: Check DNS and origin-specific response headers without modifying them
        shell: bash
        run: |
          echo 'DNS CNAME:'
          dig +short CNAME app.fenixcapital.es
          echo 'DNS A:'
          dig +short A app.fenixcapital.es
          echo 'DNS AAAA:'
          dig +short AAAA app.fenixcapital.es
          for url in https://app.fenixcapital.es/ https://app.fenixcapital.es/cerebro https://app.fenixcapital.es/cerebro?section=jarvis; do
            echo "URL $url"
            curl -sSL --max-time 10 -o /dev/null -D - "$url" | grep -Ei '^(HTTP/|server:|via:|x-github|x-vercel|cf-|cache-control:|location:|age:)' | head -n 16 || true
          done

      - name: Probe Vercel custom-domain origin without changing public DNS
        shell: bash
        run: |
          set -euo pipefail
          HOST='app.fenixcapital.es'
          ORIGIN_IP='76.76.21.21'
          echo 'VERCEL_ORIGIN_READ_ONLY=true'
          status="$(curl --compressed -sS --max-time 20 --resolve "${HOST}:443:${ORIGIN_IP}" -H 'Cache-Control: no-cache' -o /tmp/jarvis-vercel-html -D /tmp/jarvis-vercel-headers -w '%{http_code}' "https://${HOST}/cerebro?section=jarvis")" || status='CURL_ERROR'
          echo "VERCEL_ORIGIN_HTML_STATUS=$status"
          grep -Ei '^(server:|content-type:|cache-control:|x-vercel-id:|x-vercel-error:|location:)' /tmp/jarvis-vercel-headers || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          data=Path('/tmp/jarvis-vercel-html').read_text(errors='replace')
          assets=list(dict.fromkeys(re.findall(r'["\'](/assets/[^"\']+\.(?:js|css))["\']',data)))
          Path('/tmp/jarvis-vercel-assets.txt').write_text('\n'.join(assets[:12]))
          print('VERCEL_ORIGIN_HTML_IS_APP', '<div id="root"' in data)
          print('VERCEL_ORIGIN_ASSET_PATHS',assets[:12])
          PY
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in *.js) ;; *) continue ;; esac
            code="$(curl --compressed -sS --max-time 20 --resolve "${HOST}:443:${ORIGIN_IP}" -o /tmp/jarvis-vercel-asset -w '%{http_code}' "https://${HOST}${path}")" || code='CURL_ERROR'
            echo "VERCEL_JS_STATUS=$code PATH=$path"
            python3 - <<'PY'
          from pathlib import Path
          body=Path('/tmp/jarvis-vercel-asset').read_bytes()
          print('JARVIS_FONTS_BUNDLED',b'jarvis_home_font_scale_v1' in body)
          print('VOICE_PERMISSION_DIAGNOSTICS_BUNDLED',b'Chrome no tiene permiso para usar el micr' in body)
          print('PROD_SUPABASE_REFERENCE_BUNDLED',b'cluhljgonannaafpmblx.supabase.co' in body)
          PY
          done < /tmp/jarvis-vercel-assets.txt
