name: CEREBRO EXPAND-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-mkt002-market-intelligence-v0-20260911']
    paths:
      - 'cerebro/strategy/expansion-engine.mjs'
      - 'cerebro/tests/expansion-engine.test.mjs'
      - '.github/workflows/cerebro-expand001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/expansion-engine.test.mjs