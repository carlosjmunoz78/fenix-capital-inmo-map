name: CEREBRO REGP-001 PREPROD
on:
  pull_request:
    paths:
      - 'cerebro/property/registry-engine.mjs'
      - 'cerebro/tests/registry-engine.test.mjs'
      - '.github/workflows/cerebro-regp001-preprod.yml'
jobs:
  regp001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/registry-engine.test.mjs
