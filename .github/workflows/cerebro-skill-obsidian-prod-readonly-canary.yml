name: CEREBRO Obsidian PROD Read-only Canary

on:
  push:
    branches:
      - cerebro/skills-full-admitted-first-v1-20261015
    paths:
      - 'cerebro/skills/.obsidian-prod-readonly-canary-trigger.json'
      - 'cerebro/skills/skill-obsidian-prod-readonly-canary.mjs'
      - 'cerebro/skills/skill-obsidian-prod-readonly-canary-tribunal.mjs'
      - 'cerebro/tests/skill-obsidian-prod-readonly-canary.test.mjs'
      - '.github/workflows/cerebro-skill-obsidian-prod-readonly-canary.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cerebro-obsidian-prod-readonly-canary
  cancel-in-progress: false

env:
  CEREBRO_ENVIRONMENT: PROD_CANARY
  CEREBRO_ALLOW_PROD_DATA: 'false'
  CEREBRO_ALLOW_CUSTOMER_DATA: 'false'
  CEREBRO_ALLOW_EXTERNAL_SKILL_CODE: 'false'
  CEREBRO_ALLOW_PROD_WRITE: 'false'
  CEREBRO_ALLOW_FILESYSTEM_WRITE: 'false'
  CEREBRO_ALLOW_LIVE_OBSIDIAN_CLI: 'false'
  CEREBRO_ALLOW_CANONICAL_KNOWLEDGE_MIGRATION: 'false'
  CEREBRO_ALLOW_TRADING: 'false'
  CEREBRO_PAID_FALLBACK: 'false'

jobs:
  obsidian-prod-readonly-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact canary source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate explicit bounded Obsidian HIGH_RISK authorization
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('cerebro/skills/.obsidian-prod-readonly-canary-trigger.json','utf8'));
          const expectedBindings=['RSH-001','KNW-001','TRN-001','TRNBOOT-001','RAG-001','PRV-001'];
          const ok=t.confirm==='RUN_OBSIDIAN_PROD_READONLY_CANARY'&&
            t.scope==='PROD_OBSIDIAN_READONLY_ADVISORY_ONLY'&&
            t.target_candidate==='obsidian'&&
            t.target_candidate_id==='lobehub-skills:9a6e3fac20369220df43'&&
            t.expected_wrapper_id==='skillwrap:cerebro-obsidian-v0.1.0'&&
            t.company_id==='GLOBAL'&&t.engine_id==='FACT-001'&&t.environment==='PROD_CANARY'&&
            JSON.stringify(t.target_engine_bindings)===JSON.stringify(expectedBindings)&&
            t.additional_cost_budget_eur===0&&t.allow_prod_data===false&&t.allow_customer_data===false&&
            t.allow_external_skill_code_execution===false&&t.allow_prod_write===false&&t.allow_filesystem_write===false&&
            t.allow_live_obsidian_cli===false&&t.allow_canonical_knowledge_migration===false&&t.allow_notion_or_rag_replacement===false&&
            t.allow_github_write===false&&t.allow_merge===false&&t.allow_push===false&&t.allow_issue_or_pr_mutation===false&&
            t.allow_workflow_dispatch===false&&t.allow_trading_access===false&&t.paid_fallback===false&&
            t.expected_human_gate==='HIGH_RISK'&&t.human_authorization_granted===true&&
            t.authorization_basis==='explicit_owner_instruction_current_chat_2026-10-16_obsidian_prod_first'&&
            Array.isArray(t.allowed_http_methods)&&t.allowed_http_methods.length===1&&t.allowed_http_methods[0]==='GET'&&
            t.expected_preprod_run_id===38816670501&&t.expected_preprod_head_sha==='8cafae8088c60c90582a2a271a8b88997ee7b3f0'&&
            t.expected_preprod_artifact_id===12010728219&&
            t.expected_preprod_artifact_digest==='sha256:40c012ea12b5b39db4f6965b47a5e7ad12edc80ac6244653ca3ca83da1011bcb'&&
            typeof t.one_shot_id==='string'&&t.one_shot_id.length>=16;
          if(!ok){console.error('Invalid Obsidian PROD read-only canary authorization');process.exit(1)}
          console.log(JSON.stringify({authorized:true,target:'obsidian',scope:t.scope,environment:t.environment,bindings:t.target_engine_bindings,methods:t.allowed_http_methods,cost_budget_eur:0,human_gate:'HIGH_RISK',prod_write:false,filesystem_write:false,live_obsidian_cli:false}));
          NODE
          git merge-base --is-ancestor "$(node -p "require('./cerebro/skills/.obsidian-prod-readonly-canary-trigger.json').expected_preprod_head_sha")" HEAD

      - name: Verify immutable successful Obsidian FULL SAFE PREPROD evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/preprod
          RUN_ID=38816670501
          SHA=8cafae8088c60c90582a2a271a8b88997ee7b3f0
          ARTIFACT_ID=12010728219
          ARTIFACT_DIGEST='sha256:40c012ea12b5b39db4f6965b47a5e7ad12edc80ac6244653ca3ca83da1011bcb'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')" = 'completed'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.name')" = 'CEREBRO Skill Full Adoption V1'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .id")" = "$ARTIFACT_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .digest")" = "$ARTIFACT_DIGEST"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cerebro-skill-full-adoption-$RUN_ID" --dir artifacts/preprod
          P="$(find artifacts/preprod -type f -path '*/obsidian/preprod-integration.json' -print -quit)"
          C="$(find artifacts/preprod -type f -path '*/obsidian/closure-validation.json' -print -quit)"
          test -n "$P"; test -n "$C"
          node - "$P" "$C" <<'NODE'
          const fs=require('fs');const [pPath,cPath]=process.argv.slice(2);
          const p=JSON.parse(fs.readFileSync(pPath,'utf8'));const c=JSON.parse(fs.readFileSync(cPath,'utf8'));
          const bindings=['RSH-001','KNW-001','TRN-001','TRNBOOT-001','RAG-001','PRV-001'];
          const pOk=p.status==='PREPROD_INTEGRATION_COMPLETE'&&p.candidate_id==='lobehub-skills:9a6e3fac20369220df43'&&
            JSON.stringify(p.target_engine_bindings)===JSON.stringify(bindings)&&p.binding_count===6&&
            p.binding_report_status==='GREEN_PREPROD_BINDINGS_ALL_RELEVANT_ENGINES'&&p.binding_judge_decision==='GREEN_FOR_BINDING_TRIBUNAL'&&
            p.binding_tribunal_decision==='GREEN_BINDINGS_FOR_FULL_BUILDOUT'&&p.durable_binding_receipts?.first_persisted===6&&
            p.durable_binding_receipts?.replay_duplicates===6&&p.durable_binding_receipts?.idempotency_proven===true&&
            p.observability_records===12&&p.audit_records===12&&p.finops_records===12&&p.audit_chain_valid===true&&p.measured_additional_cost_eur===0&&
            p.lrn001_feedback?.first_persisted===6&&p.lrn001_feedback?.replay_duplicates===6&&p.lrn001_feedback?.held_total===0&&p.lrn001_feedback?.idempotency_proven===true&&
            p.rollback_proven===true&&p.rebuild_default_disabled===true&&p.final_binding_state==='DISABLED'&&p.binding_activation_authorized===false&&
            p.canonical_knowledge_replaced===false&&p.notion_or_rag_migration_authorized===false&&p.real_vault_used===false&&p.filesystem_write===false&&
            p.external_skill_code_execution===false&&p.live_obsidian_cli_execution===false&&p.customer_data_used===false&&p.prod_data_used===false&&
            p.prod_authorized===false&&p.prod_write_authorized===false&&p.trading_access===false&&p.paid_fallback===false&&p.permission_expansion===false&&
            p.autonomous_prod_promotion===false&&p.additional_cost_eur===0&&p.human_required===null;
          const cOk=c.status==='READY_TO_PROMOTE_QUEUE'&&c.candidate_id==='lobehub-skills:9a6e3fac20369220df43'&&
            JSON.stringify(c.target_engine_bindings)===JSON.stringify(bindings)&&Array.isArray(c.errors)&&c.errors.length===0&&
            c.prod_write_authorized===false&&c.trading_access===false&&c.external_skill_code_execution_authorized===false&&c.additional_cost_eur===0;
          if(!pOk||!cOk){console.error('Immutable Obsidian FULL SAFE PREPROD evidence is not GREEN/fail-closed');process.exit(1)}
          console.log(JSON.stringify({preprod_gate:'GREEN_FULL_SAFE_PREPROD',bindings:p.target_engine_bindings,cost_eur:0,rollback:true,rebuild_disabled:true,real_vault:false,prod_write:false}));
          NODE

      - name: Verify current main and standing authorization remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:cerebro/registry/autonomous-readonly-skills.v1.json > /tmp/readonly-registry-main.json
          git show origin/main:cerebro/governance/skill-autonomy-standing-authorization.v1.json > /tmp/standing-auth-main.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/readonly-registry-main.json','utf8'));
          const a=JSON.parse(fs.readFileSync('/tmp/standing-auth-main.json','utf8'));
          const registryOk=r.registry_type==='CEREBRO_AUTONOMOUS_READONLY_SKILL_ADVISORY_REGISTRY'&&r.environment==='PROD_READONLY_ADVISORY'&&
            r.entries?.obsidian==null&&r.safety?.prod_write===false&&r.safety?.customer_data===false&&r.safety?.external_skill_code_execution===false&&
            r.safety?.trading===false&&r.safety?.paid_fallback===false&&r.safety?.additional_cost_eur===0;
          const authOk=a.status==='ACTIVE_STANDING_AUTHORIZATION'&&a.scope?.autonomous_prod_readonly_canary===true&&a.scope?.autonomous_readonly_advisory_registration===true&&
            a.scope?.autonomous_prod_write===false&&a.scope?.autonomous_customer_data_access===false&&a.scope?.autonomous_external_skill_code_execution===false&&
            a.scope?.autonomous_new_credentials===false&&a.scope?.autonomous_trading===false&&a.scope?.autonomous_paid_fallback===false&&a.cost?.additional_cost_budget_eur===0;
          if(!registryOk||!authOk){console.error('Main read-only advisory safety boundary is not fail-closed');process.exit(1)}
          console.log(JSON.stringify({main_registry:'FAIL_CLOSED_NO_OBSIDIAN_ENTRY',standing_readonly_authorization:'ACTIVE',prod_write:false,cost_eur:0}));
          NODE

      - name: Unit-test Obsidian canary contract
        run: node --test cerebro/tests/skill-obsidian-prod-readonly-canary.test.mjs cerebro/tests/skill-cerebro-obsidian-wrapper.test.mjs

      - name: Execute Obsidian PROD read-only canary and Tribunal
        shell: bash
        env:
          CEREBRO_OBSIDIAN_PROD_CANARY_CONFIRM: RUN_OBSIDIAN_PROD_READONLY_CANARY
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/obsidian-prod-canary
          node cerebro/skills/skill-obsidian-prod-readonly-canary.mjs --output artifacts/obsidian-prod-canary/cerebro-obsidian-prod-readonly-canary.json
          node cerebro/skills/skill-obsidian-prod-readonly-canary-tribunal.mjs \
            --input artifacts/obsidian-prod-canary/cerebro-obsidian-prod-readonly-canary.json \
            --authorization cerebro/skills/.obsidian-prod-readonly-canary-trigger.json \
            --output artifacts/obsidian-prod-canary/cerebro-obsidian-prod-readonly-canary-tribunal.json

      - name: Assert canary and Tribunal are GREEN and bounded to read-only advisory
        shell: bash
        run: |
          set -euo pipefail
          f=artifacts/obsidian-prod-canary/cerebro-obsidian-prod-readonly-canary.json
          t=artifacts/obsidian-prod-canary/cerebro-obsidian-prod-readonly-canary-tribunal.json
          test "$(jq -r '.status' "$f")" = 'GREEN_OBSIDIAN_PROD_READONLY_CANARY'
          test "$(jq -r '.environment' "$f")" = 'PROD_CANARY'
          test "$(jq -r '.live_requests' "$f")" = '2'
          test "$(jq -r '.target_engine_bindings | length' "$f")" = '6'
          test "$(jq -r '.fixture_probes | length' "$f")" = '3'
          test "$(jq -r '.observability_records' "$f")" = '5'
          test "$(jq -r '.audit_records' "$f")" = '5'
          test "$(jq -r '.finops_records' "$f")" = '5'
          test "$(jq -r '.audit_chain_valid' "$f")" = 'true'
          test "$(jq -r '.measured_additional_cost_eur' "$f")" = '0'
          test "$(jq -r '.prod_write' "$f")" = 'false'
          test "$(jq -r '.filesystem_write' "$f")" = 'false'
          test "$(jq -r '.live_obsidian_cli_execution' "$f")" = 'false'
          test "$(jq -r '.real_vault_used' "$f")" = 'false'
          test "$(jq -r '.canonical_knowledge_replaced' "$f")" = 'false'
          test "$(jq -r '.notion_or_rag_migration_authorized' "$f")" = 'false'
          test "$(jq -r '.customer_data_used' "$f")" = 'false'
          test "$(jq -r '.prod_data_used' "$f")" = 'false'
          test "$(jq -r '.external_skill_code_executed' "$f")" = 'false'
          test "$(jq -r '.trading_access' "$f")" = 'false'
          test "$(jq -r '.paid_fallback' "$f")" = 'false'
          test "$(jq -r '.rollback_proven' "$f")" = 'true'
          test "$(jq -r '.rebuild_proven' "$f")" = 'true'
          test "$(jq -r '.binding_after' "$f")" = 'DISABLED'
          test "$(jq -r '.decision' "$t")" = 'GREEN_FOR_OBSIDIAN_PROD_READONLY_ADVISORY_REGISTRATION'
          test "$(jq -r '.green' "$t")" = 'true'
          test "$(jq -r '.human_required' "$t")" = 'null'
          test "$(jq -r '.authorization_consumed' "$t")" = 'true'
          test "$(jq -r '.registration_scope' "$t")" = 'PROD_READONLY_ADVISORY_METADATA_ONLY'
          test "$(jq -r '.prod_authorized' "$t")" = 'false'
          test "$(jq -r '.prod_write_authorized' "$t")" = 'false'
          test "$(jq -r '.filesystem_write_authorized' "$t")" = 'false'
          test "$(jq -r '.canonical_knowledge_migration_authorized' "$t")" = 'false'
          test "$(jq -r '.merge_authorized' "$t")" = 'false'

      - name: Upload immutable Obsidian PROD read-only canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-obsidian-prod-readonly-canary-${{ github.run_id }}
          path: artifacts/obsidian-prod-canary/**
          if-no-files-found: warn
          retention-days: 30

  full-cerebro-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs

  main-baseline-full-cerebro:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs
