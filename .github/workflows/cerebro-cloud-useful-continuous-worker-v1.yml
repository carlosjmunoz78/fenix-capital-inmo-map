# JARVIS-001 canary trigger v2
name: CEREBRO Continuous Useful Worker V1
run-name: JARVIS-001 · W${{ inputs.wave || '0' }} · C${{ inputs.cycle || '0' }} · PREPROD

on:
  push:
    branches:
      - cerebro/mission-jarvis-001-20261030
    paths:
      - .github/workflows/cerebro-cloud-useful-continuous-worker-v1.yml
  workflow_dispatch:
    inputs:
      mission_id:
        description: 'Mission id'
        required: false
        default: 'MISSION-JARVIS-001'
        type: string
      lane:
        description: 'Single-writer lane'
        required: false
        default: '0'
        type: string
      cycle:
        description: 'Self-feeding cycle'
        required: false
        default: '0'
        type: string
      wave:
        description: 'JARVIS DAG wave'
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: cerebro-jarvis-001-single-writer
  cancel-in-progress: false

jobs:
  sustained-jarvis-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MISSION_ID: ${{ inputs.mission_id || 'MISSION-JARVIS-001' }}
      LANE: ${{ inputs.lane || '0' }}
      CYCLE: ${{ inputs.cycle || '0' }}
      WAVE: ${{ inputs.wave || '0' }}
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
      CEREBRO_ALLOW_PAID_FANOUT: 'NO'
      CEREBRO_MAX_REPO_WRITE_CONCURRENCY: '1'
      CEREBRO_JOB001_LEDGER_FILE: cerebro/jarvis/mission-001/runtime/job001-ledger.v1.json
      JARVIS_EXEC_OUT: artifacts/jarvis-mission-001-exec

    steps:
      - name: Checkout mission branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Hard PREPROD guards
        shell: bash
        run: |
          set -euo pipefail
          test "$MISSION_ID" = 'MISSION-JARVIS-001'
          test "$CEREBRO_SUPERVISOR_ENV" = 'PREPROD'
          test "$CEREBRO_PROD_WRITE" = 'false'
          test "$CEREBRO_TRADING_ACCESS" = 'false'
          test "$CEREBRO_ALLOW_PAID_FANOUT" = 'NO'
          test "$CEREBRO_MAX_REPO_WRITE_CONCURRENCY" = '1'
          case "$LANE:$CYCLE:$WAVE" in *[!0-9:]*) exit 2;; esac
          test "$LANE" = '0'

      - name: Contract and durability tests
        run: |
          set -euo pipefail
          node --test cerebro/tests/job001-runtime-v1.test.mjs
          node --test cerebro/tests/jarvis-mission-job001-adapter-v1.test.mjs
          node --test cerebro/tests/jarvis-state-fabric-v1.test.mjs
          node --test cerebro/tests/jarvis-core-v1.test.mjs
          node --test cerebro/tests/jarvis-mission-dag-v2.test.mjs

      - name: Execute one durable JARVIS batch
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/runtime/jarvis-mission-continuous-executor-v1.mjs --wave="$WAVE" --max_units=48 | tee /tmp/jarvis-cycle.log
          tail -n 1 /tmp/jarvis-cycle.log > /tmp/jarvis-cycle.json
          jq -e '.ok == true and .mission_id == "MISSION-JARVIS-001" and .prod_write == false and .trading == false' /tmp/jarvis-cycle.json >/dev/null
          next_wave="$(jq -r '.next_wave // empty' /tmp/jarvis-cycle.json)"
          blocked="$(jq -r '.blocked' /tmp/jarvis-cycle.json)"
          completed="$(jq -r '.completed' /tmp/jarvis-cycle.json)"
          echo "next_wave=$next_wave" >> "$GITHUB_OUTPUT"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "completed=$completed" >> "$GITHUB_OUTPUT"
          echo "mission_id=MISSION-JARVIS-001" >> "$GITHUB_STEP_SUMMARY"
          echo "wave=$WAVE" >> "$GITHUB_STEP_SUMMARY"
          echo "completed=$completed" >> "$GITHUB_STEP_SUMMARY"
          echo "blocked=$blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "next_wave=$next_wave" >> "$GITHUB_STEP_SUMMARY"
          echo "job001_durable_ledger=true" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist JOB-001 ledger and mission checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cerebro/jarvis/mission-001/runtime
          cp /tmp/jarvis-cycle.json cerebro/jarvis/mission-001/runtime/last-cycle.v1.json
          git config user.name 'cerebro-preprod-bot'
          git config user.email 'cerebro-preprod-bot@users.noreply.github.com'
          git add cerebro/jarvis/mission-001/runtime/job001-ledger.v1.json cerebro/jarvis/mission-001/runtime/last-cycle.v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(cerebro): persist JARVIS-001 durable cycle C${CYCLE} W${WAVE}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish detailed evidence
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-001-w${{ inputs.wave || '0' }}-c${{ inputs.cycle || '0' }}-${{ github.run_id }}
          path: artifacts/jarvis-mission-001-exec/**
          if-no-files-found: error
          retention-days: 3

      - name: Self-refill same mission
        if: success() && steps.execute.outputs.blocked == '0' && steps.execute.outputs.next_wave != ''
        shell: bash
        run: |
          set -euo pipefail
          next_cycle=$((CYCLE + 1))
          gh api --method POST "/repos/${GH_REPO}/actions/workflows/cerebro-cloud-useful-continuous-worker-v1.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f 'inputs[mission_id]=MISSION-JARVIS-001' \
            -f 'inputs[lane]=0' \
            -f "inputs[cycle]=${next_cycle}" \
            -f "inputs[wave]=${{ steps.execute.outputs.next_wave }}"
          echo "self_refilled=true" >> "$GITHUB_STEP_SUMMARY"
          echo "next_cycle=$next_cycle" >> "$GITHUB_STEP_SUMMARY"
