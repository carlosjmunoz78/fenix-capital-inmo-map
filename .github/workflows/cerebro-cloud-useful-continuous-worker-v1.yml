name: CEREBRO Continuous Useful Worker V1
run-name: CEREBRO SUSTAINED ${{ inputs.lane }} · C${{ inputs.cycle }} · PAUSED

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Sustained useful-work lane 0..67'
        required: true
        type: string
      cycle:
        description: 'Starting cycle'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: cerebro-continuous-useful-worker-v1-${{ inputs.lane }}
  cancel-in-progress: true

jobs:
  paused-for-user-priority:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Sustained background work temporarily paused for user-priority work.'
