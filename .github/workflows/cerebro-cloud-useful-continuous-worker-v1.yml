name: CEREBRO Continuous Useful Worker V1
run-name: CEREBRO SUSTAINED ${{ inputs.lane }} · C${{ inputs.cycle }} · PREPROD

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Sustained useful-work lane 0..67'
        required: true
        type: string
      cycle:
        description: 'Starting self-feeding cycle 0..999999'
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebro-continuous-useful-worker-v1-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  sustained-useful-work:
    name: SUSTAINED-${{ inputs.lane }}-C${{ inputs.cycle }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_INITIAL_CONCURRENCY: '48'
      CEREBRO_MAX_CONCURRENCY: '68'
      CEREBRO_MAX_PER_COMPANY: '68'
      CEREBRO_ALLOW_PAID_FANOUT: 'NO'
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
      CEREBRO_WORKER_LEASE_SECONDS: '420'
      CEREBRO_MAX_UNITS_PER_LEASE: '256'
    steps:
      - name: Checkout immutable execution revision
        uses: actions/checkout@v4

      - name: Enforce sustained PREPROD zero-paid guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_visibility }}" = "public"
          test "$CEREBRO_SUPERVISOR_ENV" = "PREPROD"
          test "$CEREBRO_ALLOW_PAID_FANOUT" = "NO"
          test "$CEREBRO_PROD_WRITE" = "false"
          test "$CEREBRO_TRADING_ACCESS" = "false"
          test "$CEREBRO_WORKER_LEASE_SECONDS" -ge 300
          test "$CEREBRO_WORKER_LEASE_SECONDS" -le 480
          test "$CEREBRO_MAX_UNITS_PER_LEASE" -ge 1
          test "$CEREBRO_MAX_UNITS_PER_LEASE" -le 256
          for value in "${{ inputs.lane }}" "${{ inputs.cycle }}"; do
            case "$value" in ''|*[!0-9]*) exit 2 ;; esac
          done
          test "${{ inputs.lane }}" -ge 0 && test "${{ inputs.lane }}" -le 67
          test "${{ inputs.cycle }}" -ge 0 && test "${{ inputs.cycle }}" -le 999999

      - name: Contract tests
        run: node --test cerebro/tests/continuous-useful-work-factory-v0.test.mjs

      - name: Execute sustained self-fed useful-work lease
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          deadline=$((start + CEREBRO_WORKER_LEASE_SECONDS))
          current=${{ inputs.cycle }}
          units=0

          while [ "$(date +%s)" -lt "$deadline" ] && [ "$units" -lt "$CEREBRO_MAX_UNITS_PER_LEASE" ]; do
            node cerebro/runtime/continuous-useful-work-factory-v0.mjs \
              --lane=${{ inputs.lane }} \
              --cycle="$current"
            units=$((units + 1))
            if [ "$current" -ge 999999 ]; then current=0; else current=$((current + 1)); fi
          done

          elapsed=$(( $(date +%s) - start ))
          echo "next_cycle=$current" >> "$GITHUB_OUTPUT"
          echo "units_completed=$units" >> "$GITHUB_OUTPUT"
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "lane=${{ inputs.lane }}" >> "$GITHUB_OUTPUT"
          echo "sustained_worker=true" >> "$GITHUB_STEP_SUMMARY"
          echo "units_completed=$units" >> "$GITHUB_STEP_SUMMARY"
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_STEP_SUMMARY"
          echo "next_cycle=$current" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish inspectable lease evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-sustained-${{ inputs.lane }}-c${{ inputs.cycle }}-${{ github.run_id }}
          path: artifacts/continuous-work-v0/**
          if-no-files-found: error
          retention-days: 1

      - name: Self-refill sustained lane before releasing capacity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          next='${{ steps.lease.outputs.next_cycle }}'
          test -n "$next"
          gh api --method POST "/repos/${GH_REPO}/actions/workflows/cerebro-cloud-useful-continuous-worker-v1.yml/dispatches" \
            -f ref=main \
            -f "inputs[lane]=${{ inputs.lane }}" \
            -f "inputs[cycle]=${next}"
          echo "self_refilled_lane=${{ inputs.lane }}" >> "$GITHUB_STEP_SUMMARY"
          echo "next_cycle=${next}" >> "$GITHUB_STEP_SUMMARY"
          echo "continuous=true" >> "$GITHUB_STEP_SUMMARY"
          echo "paid_ai=false" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"
