name: CEREBRO Continuous Useful Worker V1
run-name: CEREBRO SUSTAINED ${{ inputs.lane }} · C${{ inputs.cycle }} · PREPROD

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Sustained useful-work lane 0..67'
        required: true
        type: string
      cycle:
        description: 'Starting unique Mission DAG / continuous maintenance cycle 0..999999'
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebro-continuous-useful-worker-v1-${{ inputs.lane }}
  cancel-in-progress: false

env:
  CEREBRO_REARM_LANE_LIMIT: '68'
  CEREBRO_ENTERPRISE_ENTITLEMENT_VERIFIED: 'true'
  CEREBRO_MISSION_LANE_COUNT: '68'

jobs:
  sustained-useful-work:
    name: SUSTAINED-${{ inputs.lane }}-C${{ inputs.cycle }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_INITIAL_CONCURRENCY: '360'
      CEREBRO_MAX_CONCURRENCY: '360'
      CEREBRO_MAX_PER_COMPANY: '360'
      CEREBRO_MAX_DEEPSEEK_CONCURRENCY: '8'
      CEREBRO_MAX_REPO_WRITE_CONCURRENCY: '1'
      CEREBRO_ALLOW_PAID_FANOUT: 'NO'
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
      CEREBRO_WORKER_LEASE_SECONDS: '420'
      CEREBRO_MAX_UNITS_PER_LEASE: '8192'
      CEREBRO_MAINTENANCE_INNER_PARALLELISM: '4'
      CEREBRO_MISSION_WORK_WRITE_MODE: rolling
      CEREBRO_CONTINUOUS_WORK_WRITE_MODE: rolling
      CEREBRO_MISSION_WORK_OUT_DIR: artifacts/mission-derived-work-v1
      CEREBRO_CONTINUOUS_WORK_OUT_DIR: artifacts/continuous-work-v0
    steps:
      - name: Checkout immutable execution revision
        uses: actions/checkout@v4

      - name: Enforce sustained PREPROD zero-paid guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_visibility }}" = "public"
          test "$CEREBRO_SUPERVISOR_ENV" = "PREPROD"
          test "$CEREBRO_ALLOW_PAID_FANOUT" = "NO"
          test "$CEREBRO_PROD_WRITE" = "false"
          test "$CEREBRO_TRADING_ACCESS" = "false"
          test "$CEREBRO_INITIAL_CONCURRENCY" = "360"
          test "$CEREBRO_MAX_CONCURRENCY" = "360"
          test "$CEREBRO_MAX_PER_COMPANY" = "360"
          test "$CEREBRO_MAX_DEEPSEEK_CONCURRENCY" = "8"
          test "$CEREBRO_MAX_REPO_WRITE_CONCURRENCY" = "1"
          test "$CEREBRO_WORKER_LEASE_SECONDS" -ge 300
          test "$CEREBRO_WORKER_LEASE_SECONDS" -le 480
          test "$CEREBRO_MAX_UNITS_PER_LEASE" -ge 256
          test "$CEREBRO_MAX_UNITS_PER_LEASE" -le 8192
          test "$CEREBRO_MAINTENANCE_INNER_PARALLELISM" -eq 4
          test "$CEREBRO_MISSION_WORK_WRITE_MODE" = rolling
          test "$CEREBRO_CONTINUOUS_WORK_WRITE_MODE" = rolling
          test "$CEREBRO_REARM_LANE_LIMIT" -eq 68
          test "$CEREBRO_ENTERPRISE_ENTITLEMENT_VERIFIED" = "true"
          test "$CEREBRO_MISSION_LANE_COUNT" -eq 68
          for value in "${{ inputs.lane }}" "${{ inputs.cycle }}"; do
            case "$value" in ''|*[!0-9]*) exit 2 ;; esac
          done
          test "${{ inputs.lane }}" -ge 0 && test "${{ inputs.lane }}" -le 67
          test "${{ inputs.cycle }}" -ge 0 && test "${{ inputs.cycle }}" -le 999999

      - name: Enforce canonical JOB-001 Control Plane capacity contract
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/runtime/job001-ledger-control-plane-cli-v1.mjs contract > control-plane-contract.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('control-plane-contract.json','utf8'));
          const expected={
            environment:'PREPROD',
            target_useful_default:360,
            max_global_default:360,
            max_company_default:360,
            max_deepseek_default:8,
            max_repo_write_default:1,
            second_queue:false,
            second_scheduler:false,
            second_daemon:false,
            prod_authorized:false,
            trading_access:false,
          };
          for (const [key,value] of Object.entries(expected)) {
            if (x[key] !== value) throw new Error(`JOB001_CONTROL_CONTRACT_MISMATCH:${key}:${x[key]}!=${value}`);
          }
          NODE

      - name: Contract tests Mission DAG plus continuous useful fallback
        run: |
          node --test cerebro/tests/continuous-useful-work-factory-v0.test.mjs
          node cerebro/runtime/mission-recursive-decomposer-v1.test.mjs
          node --test cerebro/tests/mission-derived-useful-work-v1.test.mjs
          node --test cerebro/tests/continuous-worker-job001-control-plane-binding-v1.test.mjs

      - name: Execute sustained mission lease with continuous useful fallback
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          deadline=$((start + CEREBRO_WORKER_LEASE_SECONDS))
          current=${{ inputs.cycle }}
          lane=${{ inputs.lane }}
          parallelism="$CEREBRO_MAINTENANCE_INNER_PARALLELISM"
          units=0
          batches=0
          mission_units=0
          maintenance_units=0
          mission_exhausted=false
          atomic_count="$(node --input-type=module -e "import {selectMissionUnit} from './cerebro/runtime/mission-derived-useful-work-v1.mjs'; console.log(selectMissionUnit(0,0).atomic_count)")"
          test "$atomic_count" -ge 1

          while [ "$(date +%s)" -lt "$deadline" ] && [ "$units" -lt "$CEREBRO_MAX_UNITS_PER_LEASE" ]; do
            remaining=$((CEREBRO_MAX_UNITS_PER_LEASE - units))
            batch_size="$parallelism"
            if [ "$remaining" -lt "$batch_size" ]; then batch_size="$remaining"; fi
            pids=''
            batch_mission=0
            batch_maintenance=0
            for slot in $(seq 0 $((batch_size - 1))); do
              cycle=$(( (current + slot) % 1000000 ))
              linear=$((cycle * CEREBRO_MISSION_LANE_COUNT + lane))
              if [ "$linear" -lt "$atomic_count" ]; then
                node cerebro/runtime/mission-derived-useful-work-v1.mjs \
                  --lane="$lane" \
                  --cycle="$cycle" \
                  --slot="$slot" \
                  --fallback=true &
                batch_mission=$((batch_mission + 1))
              else
                mission_exhausted=true
                node cerebro/runtime/continuous-useful-work-factory-v0.mjs \
                  --lane="$lane" \
                  --cycle="$cycle" \
                  --slot="$slot" &
                batch_maintenance=$((batch_maintenance + 1))
              fi
              pids="$pids $!"
            done
            for pid in $pids; do wait "$pid"; done
            units=$((units + batch_size))
            mission_units=$((mission_units + batch_mission))
            maintenance_units=$((maintenance_units + batch_maintenance))
            batches=$((batches + 1))
            current=$(( (current + batch_size) % 1000000 ))
          done

          next_linear=$((current * CEREBRO_MISSION_LANE_COUNT + lane))
          if [ "$next_linear" -ge "$atomic_count" ]; then mission_exhausted=true; fi
          elapsed=$(( $(date +%s) - start ))
          echo "next_cycle=$current" >> "$GITHUB_OUTPUT"
          echo "units_completed=$units" >> "$GITHUB_OUTPUT"
          echo "batches_completed=$batches" >> "$GITHUB_OUTPUT"
          echo "mission_units=$mission_units" >> "$GITHUB_OUTPUT"
          echo "maintenance_units=$maintenance_units" >> "$GITHUB_OUTPUT"
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "inner_parallelism=$parallelism" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "atomic_count=$atomic_count" >> "$GITHUB_OUTPUT"
          echo "mission_exhausted=$mission_exhausted" >> "$GITHUB_OUTPUT"
          echo "continuous_source_available=true" >> "$GITHUB_OUTPUT"
          echo "sustained_worker=true" >> "$GITHUB_STEP_SUMMARY"
          echo "primary_source=MISSION_DAG_V1" >> "$GITHUB_STEP_SUMMARY"
          echo "post_dag_source=continuous-useful-work-factory-v0" >> "$GITHUB_STEP_SUMMARY"
          echo "job001_capacity_contract=360/360/360" >> "$GITHUB_STEP_SUMMARY"
          echo "units_completed=$units" >> "$GITHUB_STEP_SUMMARY"
          echo "batches_completed=$batches" >> "$GITHUB_STEP_SUMMARY"
          echo "mission_units=$mission_units" >> "$GITHUB_STEP_SUMMARY"
          echo "maintenance_units=$maintenance_units" >> "$GITHUB_STEP_SUMMARY"
          echo "atomic_count=$atomic_count" >> "$GITHUB_STEP_SUMMARY"
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_STEP_SUMMARY"
          echo "inner_parallelism=$parallelism" >> "$GITHUB_STEP_SUMMARY"
          echo "mission_evidence_write_mode=$CEREBRO_MISSION_WORK_WRITE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "continuous_evidence_write_mode=$CEREBRO_CONTINUOUS_WORK_WRITE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "next_cycle=$current" >> "$GITHUB_STEP_SUMMARY"
          echo "mission_exhausted=$mission_exhausted" >> "$GITHUB_STEP_SUMMARY"
          echo "continuous_source_available=true" >> "$GITHUB_STEP_SUMMARY"
          echo "paid_ai=false" >> "$GITHUB_STEP_SUMMARY"
          echo "additional_cost_eur=0" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish inspectable lease evidence
        if: steps.lease.outputs.units_completed != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-sustained-${{ inputs.lane }}-c${{ inputs.cycle }}-${{ github.run_id }}
          path: |
            artifacts/mission-derived-work-v1/**
            artifacts/continuous-work-v0/**
          if-no-files-found: error
          retention-days: 1

      - name: Self-refill sustained lane while a useful source is available
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          lane='${{ inputs.lane }}'
          next='${{ steps.lease.outputs.next_cycle }}'
          source_available='${{ steps.lease.outputs.continuous_source_available }}'
          test -n "$next"
          ref="${GITHUB_REF_NAME}"
          test -n "$ref"

          if [ "$source_available" != "true" ]; then
            echo "self_refilled_lane=false" >> "$GITHUB_STEP_SUMMARY"
            echo "drain_reason=NO_USEFUL_SOURCE_AVAILABLE" >> "$GITHUB_STEP_SUMMARY"
            echo "lane=$lane" >> "$GITHUB_STEP_SUMMARY"
            echo "continuous=false" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$CEREBRO_ENTERPRISE_ENTITLEMENT_VERIFIED" != "true" ] || [ "$lane" -ge "$CEREBRO_REARM_LANE_LIMIT" ]; then
            echo "self_refilled_lane=false" >> "$GITHUB_STEP_SUMMARY"
            echo "drain_reason=ENTERPRISE_CAPACITY_GUARD" >> "$GITHUB_STEP_SUMMARY"
            echo "rearm_lane_limit=$CEREBRO_REARM_LANE_LIMIT" >> "$GITHUB_STEP_SUMMARY"
            echo "lane=$lane" >> "$GITHUB_STEP_SUMMARY"
            echo "continuous=false" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          dispatch_with_transient_retry() {
            local endpoint="$1"; shift
            local attempt output
            for attempt in 1 2 3 4; do
              if output="$(gh api --method POST "$endpoint" "$@" 2>&1)"; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              printf '%s\n' "$output" >&2
              case "$output" in
                *'HTTP 500'*|*'HTTP 502'*|*'HTTP 503'*|*'HTTP 504'*)
                  if [ "$attempt" -lt 4 ]; then sleep $((attempt * 2)); continue; fi
                  ;;
                *) return 1 ;;
              esac
              return 1
            done
          }

          # Critical-pressure admission is owned centrally by the Global Capacity
          # Controller. Workers do not repeat Actions API reads per lease.
          dispatch_with_transient_retry "/repos/${GH_REPO}/actions/workflows/cerebro-cloud-useful-continuous-worker-v1.yml/dispatches" \
            -f "ref=${ref}" \
            -f "inputs[lane]=${lane}" \
            -f "inputs[cycle]=${next}"
          echo "self_refilled_lane=$lane" >> "$GITHUB_STEP_SUMMARY"
          echo "self_refilled_ref=${ref}" >> "$GITHUB_STEP_SUMMARY"
          echo "next_cycle=${next}" >> "$GITHUB_STEP_SUMMARY"
          echo "continuous=true" >> "$GITHUB_STEP_SUMMARY"
          echo "critical_gate_priority=central_controller" >> "$GITHUB_STEP_SUMMARY"
          echo "pressure_reads_per_worker=0" >> "$GITHUB_STEP_SUMMARY"
          echo "dispatch_transient_retry=500,502,503,504:max4" >> "$GITHUB_STEP_SUMMARY"
          echo "primary_source=MISSION_DAG_V1" >> "$GITHUB_STEP_SUMMARY"
          echo "post_dag_source=continuous-useful-work-factory-v0" >> "$GITHUB_STEP_SUMMARY"
          echo "job001_capacity_contract=360/360/360" >> "$GITHUB_STEP_SUMMARY"
          echo "paid_ai=false" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"
