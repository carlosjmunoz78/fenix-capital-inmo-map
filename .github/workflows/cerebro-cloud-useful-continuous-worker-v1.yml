name: CEREBRO Continuous Useful Worker V1
run-name: CEREBRO SUSTAINED ${{ inputs.lane }} · C${{ inputs.cycle }} · PREPROD

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Sustained useful-work lane 0..63'
        required: true
        type: string
      cycle:
        description: 'Starting self-feeding cycle 0..999999'
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebro-continuous-useful-worker-v1-${{ inputs.lane }}
  cancel-in-progress: false

env:
  CEREBRO_REARM_LANE_LIMIT: '0'
  CEREBRO_ENTERPRISE_ENTITLEMENT_VERIFIED: 'false'

jobs:
  sustained-useful-work:
    name: SUSTAINED-${{ inputs.lane }}-C${{ inputs.cycle }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_INITIAL_CONCURRENCY: '48'
      CEREBRO_MAX_CONCURRENCY: '64'
      CEREBRO_MAX_PER_COMPANY: '48'
      CEREBRO_MAX_DEEPSEEK_CONCURRENCY: '8'
      CEREBRO_MAX_REPO_WRITE_CONCURRENCY: '1'
      CEREBRO_ALLOW_PAID_FANOUT: 'NO'
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
      CEREBRO_WORKER_LEASE_SECONDS: '420'
      CEREBRO_MAX_UNITS_PER_LEASE: '256'
      CEREBRO_MISSION_WORK_OUT_DIR: artifacts/mission-derived-work-v1
    steps:
      - name: Checkout immutable execution revision
        uses: actions/checkout@v4

      - name: Enforce sustained PREPROD zero-paid guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_visibility }}" = "public"
          test "$CEREBRO_SUPERVISOR_ENV" = "PREPROD"
          test "$CEREBRO_ALLOW_PAID_FANOUT" = "NO"
          test "$CEREBRO_PROD_WRITE" = "false"
          test "$CEREBRO_TRADING_ACCESS" = "false"
          test "$CEREBRO_INITIAL_CONCURRENCY" = "48"
          test "$CEREBRO_MAX_CONCURRENCY" = "64"
          test "$CEREBRO_MAX_PER_COMPANY" = "48"
          test "$CEREBRO_MAX_DEEPSEEK_CONCURRENCY" = "8"
          test "$CEREBRO_MAX_REPO_WRITE_CONCURRENCY" = "1"
          test "$CEREBRO_WORKER_LEASE_SECONDS" -ge 300
          test "$CEREBRO_WORKER_LEASE_SECONDS" -le 480
          test "$CEREBRO_MAX_UNITS_PER_LEASE" -ge 1
          test "$CEREBRO_MAX_UNITS_PER_LEASE" -le 256
          test "$CEREBRO_REARM_LANE_LIMIT" -ge 0
          test "$CEREBRO_REARM_LANE_LIMIT" -le 64
          test "$CEREBRO_ENTERPRISE_ENTITLEMENT_VERIFIED" = "false"
          for value in "${{ inputs.lane }}" "${{ inputs.cycle }}"; do
            case "$value" in ''|*[!0-9]*) exit 2 ;; esac
          done
          test "${{ inputs.lane }}" -ge 0 && test "${{ inputs.lane }}" -le 63
          test "${{ inputs.cycle }}" -ge 0 && test "${{ inputs.cycle }}" -le 999999

      - name: Enforce canonical JOB-001 Control Plane capacity contract
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/runtime/job001-ledger-control-plane-cli-v1.mjs contract > control-plane-contract.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('control-plane-contract.json','utf8'));
          const expected={
            environment:'PREPROD',
            target_useful_default:48,
            max_global_default:64,
            max_company_default:48,
            max_deepseek_default:8,
            max_repo_write_default:1,
            second_queue:false,
            second_scheduler:false,
            second_daemon:false,
            prod_authorized:false,
            trading_access:false,
          };
          for (const [key,value] of Object.entries(expected)) {
            if (x[key] !== value) throw new Error(`JOB001_CONTROL_CONTRACT_MISMATCH:${key}:${x[key]}!=${value}`);
          }
          NODE

      - name: Contract tests OLD + MISSION DAG NEW
        run: |
          node --test cerebro/tests/continuous-useful-work-factory-v0.test.mjs
          node cerebro/runtime/mission-recursive-decomposer-v1.test.mjs
          node --test cerebro/tests/mission-derived-useful-work-v1.test.mjs
          node --test cerebro/tests/continuous-worker-job001-control-plane-binding-v1.test.mjs

      - name: Execute sustained mission-derived lease with V0 fallback
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          deadline=$((start + CEREBRO_WORKER_LEASE_SECONDS))
          current=${{ inputs.cycle }}
          units=0

          while [ "$(date +%s)" -lt "$deadline" ] && [ "$units" -lt "$CEREBRO_MAX_UNITS_PER_LEASE" ]; do
            node cerebro/runtime/mission-derived-useful-work-v1.mjs \
              --lane=${{ inputs.lane }} \
              --cycle="$current" \
              --fallback=true
            units=$((units + 1))
            if [ "$current" -ge 999999 ]; then current=0; else current=$((current + 1)); fi
          done

          elapsed=$(( $(date +%s) - start ))
          echo "next_cycle=$current" >> "$GITHUB_OUTPUT"
          echo "units_completed=$units" >> "$GITHUB_OUTPUT"
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "lane=${{ inputs.lane }}" >> "$GITHUB_OUTPUT"
          echo "sustained_worker=true" >> "$GITHUB_STEP_SUMMARY"
          echo "primary_source=MISSION_DAG_V1" >> "$GITHUB_STEP_SUMMARY"
          echo "fallback_source=continuous-useful-work-factory-v0" >> "$GITHUB_STEP_SUMMARY"
          echo "job001_capacity_contract=48/64/48" >> "$GITHUB_STEP_SUMMARY"
          echo "units_completed=$units" >> "$GITHUB_STEP_SUMMARY"
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_STEP_SUMMARY"
          echo "next_cycle=$current" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish inspectable lease evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-sustained-${{ inputs.lane }}-c${{ inputs.cycle }}-${{ github.run_id }}
          path: |
            artifacts/mission-derived-work-v1/**
            artifacts/continuous-work-v0/**
          if-no-files-found: error
          retention-days: 1

      - name: Self-refill sustained lane before releasing capacity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          lane='${{ inputs.lane }}'
          next='${{ steps.lease.outputs.next_cycle }}'
          test -n "$next"
          ref="${GITHUB_REF_NAME}"
          test -n "$ref"

          if [ "$CEREBRO_ENTERPRISE_ENTITLEMENT_VERIFIED" != "true" ] && [ "$lane" -ge "$CEREBRO_REARM_LANE_LIMIT" ]; then
            echo "self_refilled_lane=false" >> "$GITHUB_STEP_SUMMARY"
            echo "drain_reason=ENTERPRISE_ENTITLEMENT_UNVERIFIED" >> "$GITHUB_STEP_SUMMARY"
            echo "rearm_lane_limit=$CEREBRO_REARM_LANE_LIMIT" >> "$GITHUB_STEP_SUMMARY"
            echo "lane=$lane" >> "$GITHUB_STEP_SUMMARY"
            echo "continuous=false" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api --method POST "/repos/${GH_REPO}/actions/workflows/cerebro-cloud-useful-continuous-worker-v1.yml/dispatches" \
            -f "ref=${ref}" \
            -f "inputs[lane]=${lane}" \
            -f "inputs[cycle]=${next}"
          echo "self_refilled_lane=$lane" >> "$GITHUB_STEP_SUMMARY"
          echo "self_refilled_ref=${ref}" >> "$GITHUB_STEP_SUMMARY"
          echo "next_cycle=${next}" >> "$GITHUB_STEP_SUMMARY"
          echo "continuous=true" >> "$GITHUB_STEP_SUMMARY"
          echo "primary_source=MISSION_DAG_V1" >> "$GITHUB_STEP_SUMMARY"
          echo "job001_capacity_contract=48/64/48" >> "$GITHUB_STEP_SUMMARY"
          echo "paid_ai=false" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"
