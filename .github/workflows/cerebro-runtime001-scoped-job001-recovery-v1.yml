name: CEREBRO Runtime001 Scoped JOB001 Recovery V1
on:
  push:
    branches: [cerebro/close-179-per-engine-autonomy-v1-20261102]
    paths:
      - 'cerebro/runtime/durable-job-runtime-v1.mjs'
      - 'cerebro/runtime/runtime001-durable-job001-adapter-v1.mjs'
      - 'cerebro/tests/runtime001-scoped-job001-recovery-v1.test.mjs'
      - '.github/workflows/cerebro-runtime001-scoped-job001-recovery-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  tenant-safe-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Test tenant/engine isolated watchdog plus legacy durable runtime
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'cerebro/close-179-per-engine-autonomy-v1-20261102'
          node --test cerebro/tests/runtime001-scoped-job001-recovery-v1.test.mjs cerebro/tests/runtime001-shared-worker-v1.test.mjs
          node cerebro/missions/runtime001-job001-durable-physical-smoke-v1.mjs
