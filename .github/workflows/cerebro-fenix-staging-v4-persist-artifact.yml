name: CEREBRO Fenix STAGING V4 Persist Artifact

on:
  push:
    branches:
      - cerebro/seo001-staging-audit-v5-20261018
    paths:
      - .github/workflows/cerebro-fenix-staging-v4-persist-artifact.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: cerebro-fenix-staging-v4-persist-artifact
  cancel-in-progress: false

jobs:
  persist-v4-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '12120333543'
      EXPECTED_ZIP_SHA256: '59944be1aba38d15a29991e7aa27579941382fc6dae701ef6032adfeae2f2b04'
      TARGET_BRANCH: cerebro/seo001-staging-audit-v5-20261018
      TARGET_DIR: docs/web-baseline/2026-10-18-v4
      ZIP_NAME: CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip
    steps:
      - name: Checkout current audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download immutable V4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/fenix-v4-artifact
          mkdir -p /tmp/fenix-v4-artifact
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/fenix-v4-artifact-wrapper.zip
          unzip -q /tmp/fenix-v4-artifact-wrapper.zip -d /tmp/fenix-v4-artifact
          test -f "/tmp/fenix-v4-artifact/${ZIP_NAME}"

      - name: Validate exact V4 artifact contract
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "/tmp/fenix-v4-artifact/${ZIP_NAME}" | awk '{print $1}')"
          test "${ACTUAL}" = "${EXPECTED_ZIP_SHA256}"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/fenix-v4-artifact/baseline/manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          c = m['counts']
          assert m['environment'] == 'STAGING'
          assert m['prod_touched'] is False
          assert c['content_urls_snapshotted'] == 204, c
          assert c['unique_internal_http_targets_checked'] == 212, c
          assert c['broken_internal_targets'] == 0, c
          assert c['redirected_internal_targets'] == 2, c
          assert c['images'] == 680, c
          assert c['errors'] == 0, c
          print(json.dumps(c, ensure_ascii=False, indent=2))
          PY

      - name: Persist exact ZIP without overwriting prior baseline
        run: |
          set -euo pipefail
          mkdir -p "${TARGET_DIR}"
          cp "/tmp/fenix-v4-artifact/${ZIP_NAME}" "${TARGET_DIR}/${ZIP_NAME}"
          printf '%s  %s\n' "${EXPECTED_ZIP_SHA256}" "${ZIP_NAME}" > "${TARGET_DIR}/${ZIP_NAME}.sha256"
          git config user.name 'cerebro-bot'
          git config user.email 'cerebro-bot@users.noreply.github.com'
          git add "${TARGET_DIR}/${ZIP_NAME}" "${TARGET_DIR}/${ZIP_NAME}.sha256"
          if git diff --cached --quiet; then
            echo 'Exact V4 artifact already persisted.'
            exit 0
          fi
          git commit -m 'docs(cerebro): persist exact Fenix STAGING V4 artifact'
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
