name: CEREBRO Phase 13 Marketing SEO V0

on:
  push:
    paths:
      - 'cerebro/marketing/phase13-marketing-seo-feedback-runtime-v0.mjs'
      - 'cerebro/tests/phase13-marketing-seo-feedback-runtime-v0.test.mjs'
      - 'cerebro/registry/phase13-marketing-seo-feedback-profile.v0.json'
      - 'cerebro/docs/CEREBRO_PHASE13_MARKETING_SEO_BLOCKS_152_161_V0_2026-10-14.md'
      - 'cerebro/evidence/phase13-marketing-seo-blocks-152-161-v0.json'
      - '.github/workflows/cerebro-phase13-marketing-seo-v0.yml'
  pull_request:
    paths:
      - 'cerebro/marketing/phase13-marketing-seo-feedback-runtime-v0.mjs'
      - 'cerebro/tests/phase13-marketing-seo-feedback-runtime-v0.test.mjs'
      - 'cerebro/registry/phase13-marketing-seo-feedback-profile.v0.json'
      - 'cerebro/docs/CEREBRO_PHASE13_MARKETING_SEO_BLOCKS_152_161_V0_2026-10-14.md'
      - 'cerebro/evidence/phase13-marketing-seo-blocks-152-161-v0.json'
      - '.github/workflows/cerebro-phase13-marketing-seo-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase13-marketing-seo-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Phase 13 focused contract tests
        run: node --test cerebro/tests/phase13-marketing-seo-feedback-runtime-v0.test.mjs
      - name: Validate profile and evidence JSON
        run: >-
          node -e "for (const f of ['cerebro/registry/phase13-marketing-seo-feedback-profile.v0.json','cerebro/evidence/phase13-marketing-seo-blocks-152-161-v0.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('phase13-marketing-seo-json GREEN')"
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression suite
        working-directory: cerebro
        run: npm test
