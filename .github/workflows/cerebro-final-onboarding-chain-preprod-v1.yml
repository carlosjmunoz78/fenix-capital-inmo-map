name: CEREBRO Final Onboarding Chain PREPROD V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/multicompany/final-onboarding-chain-v1.mjs'
      - 'cerebro/multicompany/sql/final-onboarding-chain-preprod-v1.sql'
      - 'cerebro/multicompany/rollback/final-onboarding-chain-preprod-v1.rollback.sql'
      - 'cerebro/tests/final-onboarding-chain-v1.test.mjs'
      - 'cerebro/tests/final-onboarding-chain-preprod-persistence-v1.test.mjs'
      - '.github/workflows/cerebro-final-onboarding-chain-preprod-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/multicompany/final-onboarding-chain-v1.mjs'
      - 'cerebro/multicompany/sql/final-onboarding-chain-preprod-v1.sql'
      - 'cerebro/multicompany/rollback/final-onboarding-chain-preprod-v1.rollback.sql'
      - 'cerebro/tests/final-onboarding-chain-v1.test.mjs'
      - 'cerebro/tests/final-onboarding-chain-preprod-persistence-v1.test.mjs'
      - '.github/workflows/cerebro-final-onboarding-chain-preprod-v1.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-final-onboarding-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  final-onboarding-chain-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Validate all CEREBRO contracts
        working-directory: cerebro
        run: |
          npm run validate
          npm test
      - name: Focused final onboarding proof
        run: |
          node --test cerebro/tests/final-onboarding-chain-v1.test.mjs cerebro/tests/final-onboarding-chain-preprod-persistence-v1.test.mjs
      - name: Assert strict boundary
        shell: bash
        run: |
          set -euo pipefail
          runtime='cerebro/multicompany/final-onboarding-chain-v1.mjs'
          m='cerebro/multicompany/sql/final-onboarding-chain-preprod-v1.sql'
          r='cerebro/multicompany/rollback/final-onboarding-chain-preprod-v1.rollback.sql'
          grep -F "FINAL_ONBOARDING_ENGINE_IDS=Object.freeze(['APPBOOT-001','AUTBOOT-001','TRNBOOT-001','ENGACT-001'])" "$runtime"
          grep -F "FINAL_ONBOARDING_ENVIRONMENT='PREPROD'" "$runtime"
          grep -F "from '../digital-build/brand-commerce-appfactory-runtime-v0.mjs'" "$runtime"
          grep -F "composed_engines:['EVT-001','JOB-001','AUTO-001']" "$runtime"
          grep -F "composed_engines:['TRN-001','LRN-001','EVA-001']" "$runtime"
          grep -F 'cerebro_final_onboarding_record_preprod' "$m"
          grep -F "engine_id='AUTBOOT-001' and state='BLOCKED'" "$m"
          grep -F "engine_id='TRNBOOT-001' and state='BLOCKED'" "$m"
          grep -F "engine_id='ENGACT-001' and state='BLOCKED'" "$m"
          grep -F "'MULTICOMPANY_LRN001_AUTONOMOUS_CONTINUATION_REQUIRED'" "$m"
          grep -F 'enable row level security' "$m"
          grep -F 'to service_role' "$m"
          ! grep -F 'fenix_prod.' "$m"
          ! grep -Eqi '\btruncate\b|\bdelete[[:space:]]+from\b' "$m"
          ! grep -Fi 'cascade' "$r"
      - name: Record boundary
        run: |
          echo 'APPBOOT/AUTBOOT/TRNBOOT/ENGACT share one bounded PREPROD runtime and receipt layer.' >> "$GITHUB_STEP_SUMMARY"
          echo 'APP reuses FACT App Factory; automation reuses EVT/JOB/AUTO; training reuses TRN/LRN/EVA; activation never grants PROD.' >> "$GITHUB_STEP_SUMMARY"
