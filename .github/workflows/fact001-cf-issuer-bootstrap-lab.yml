name: FACT001 Cloudflare gateway D1 Write credential once LAB
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase/cf-token-issuer-lab/requests/gateway-d1-writer-20261111.v1.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: fact001-cf-token-issuer-once-lab
  cancel-in-progress: false
jobs:
  issue-once-then-verify-d1-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm approved issuer policies and OIDC claims
        run: node --test cerebro/connectors/universal/supabase/cf-token-issuer-lab/tests/issuer-policy.test.mjs
      - name: "Signed LAB Gateway D1 Write credential, Vault sealed, no token exposed"
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const file='cerebro/connectors/universal/supabase/cf-token-issuer-lab/requests/gateway-d1-writer-20261111.v1.json';
          const x=JSON.parse(readFileSync(file,'utf8'));
          const known={company_id:'fenix-capital',engine_id:'FACT-001',environment:'LAB',version:'1.0.0',
            account_id:'e39a57e1ac42650ca5a6d5307cf0ac8e',client_id:'cerebro',
            operation:'cloudflare.gateway_lab_d1_writer.issue_once',request_id:'FACT001-CF-GW-20261111-ISSUE-001'};
          if(JSON.stringify(Object.keys(x).sort())!==JSON.stringify(Object.keys(known).sort())||
             Object.entries(known).some(([k,v])=>x[k]!==v))throw Error('GATEWAY_WRITER_ORDER_DENIED');
          const uri=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,grant=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!uri||!grant)throw Error('OIDC_SIGNER_UNAVAILABLE');
          const jwtResp=await fetch(uri+(uri.includes('?')?'&':'?')+'audience='+encodeURIComponent('cerebro-fact001-cf-token-issuer-lab-20261110'),
             {headers:{Authorization:'Bearer '+grant},redirect:'error',signal:AbortSignal.timeout(12000)});
          if(!jwtResp.ok)throw Error('OIDC_HTTP_'+jwtResp.status);
          const jwt=(await jwtResp.json()).value;
          if(typeof jwt!=='string'||jwt.split('.').length!==3)throw Error('OIDC_SIGNATURE_NOT_OBTAINED');
          const base='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-fact001-cf-issuer-lab';
          async function call(route,auth,order){
            const r=await fetch(base+'/'+route,{method:order?'POST':'GET',
              headers:{Accept:'application/json',...(auth?{Authorization:'Bearer '+auth}:{}),
                ...(order?{'Content-Type':'application/json'}:{})},...(order?{body:JSON.stringify(order)}:{}),
              redirect:'error',signal:AbortSignal.timeout(30000)});
            let body={};try{body=await r.json()}catch{}
            return {status:r.status,body};
          }
          if((await call('health')).status!==401||(await call('health','forged')).status!==401)
            throw Error('ANON_OR_FORGED_NOT_DENIED');
          const health=await call('health',jwt);
          if(health.status!==200||health.body?.status!=='AUTHENTICATED')throw Error('OIDC_OWNER_DENIED');
          console.log('CF_GW_D1_WRITER_OWNER_OIDC=PASS');
          const issued=await call('issue-gateway-d1-writer-once',jwt,x);
          console.log('CF_GW_D1_WRITER_ISSUE_HTTP='+issued.status);
          console.log('CF_GW_D1_WRITER_ISSUE_STATUS='+String(issued.body?.status||issued.body?.code||'UNKNOWN').replace(/[^A-Z0-9_]/g,'').slice(0,70));
          if(issued.status!==200||!['D1_WRITER_SEALED_PENDING_VERIFICATION','ALREADY_STORED_REQUIRES_READBACK'].includes(issued.body?.status)||
             issued.body?.credential_exposed===true)throw Error('D1_WRITER_VAULT_CREATION_NOT_CONFIRMED');
          let accepted=false;
          for(let i=0;i<4;i++){
            if(i>0)await new Promise(r=>setTimeout(r,[0,6000,9000,12000][i]));
            const test=await call('verify-gateway-d1-writer',jwt,x);
            console.log('CF_GW_D1_WRITER_CHECK_'+(i+1)+'_HTTP='+test.status);
            if(test.status===200&&test.body?.status==='D1_WRITER_EFFECTIVE_VERIFIED'&&
               test.body?.d1_http===200&&test.body?.admin_denied===true&&test.body?.token_exposed===false){
               accepted=true;break;
            }
            if(test.status!==409||test.body?.status!=='D1_WRITER_EFFECTIVE_PENDING')
              throw Error('D1_WRITER_SCOPE_VERIFICATION_BLOCKED');
          }
          if(!accepted)throw Error('D1_WRITER_PROPAGATION_NOT_CONFIRMED');
          console.log('CF_GW_D1_WRITER_VAULT_AND_PERMISSIONS=PASS');
          console.log('CF_GW_D1_WRITER_TOKEN_VALUES_LOGGED=false');
          console.log('CF_GW_D1_WRITER_OTHER_RESOURCES_WRITES=0');
          NODE
