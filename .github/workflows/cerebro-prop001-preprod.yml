name: CEREBRO PROP-001 PREPROD
on:
  pull_request:
    paths:
      - 'cerebro/property/property-risk-engine.mjs'
      - 'cerebro/tests/property-risk-engine.test.mjs'
      - '.github/workflows/cerebro-prop001-preprod.yml'
jobs:
  prop001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/property-risk-engine.test.mjs
