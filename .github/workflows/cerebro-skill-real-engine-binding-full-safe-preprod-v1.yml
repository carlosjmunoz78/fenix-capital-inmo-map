name: CEREBRO SKILL REAL ENGINE BINDING FULL SAFE PREPROD V1
on:
  workflow_dispatch:
  push:
    branches: [main, 'cerebro/skill-real-engine-binding-full-preprod-v1*']
    paths:
      - 'cerebro/skills/skill-real-engine-binding-v1.mjs'
      - 'cerebro/tests/skill-real-engine-binding-v1.test.mjs'
      - 'cerebro/registry/skill-real-engine-binding-v1.json'
      - 'cerebro/registry/skill-high-risk-review-resolution-2026-10-17.json'
      - '.github/workflows/cerebro-skill-real-engine-binding-full-safe-preprod-v1.yml'
  pull_request:
    paths:
      - 'cerebro/skills/skill-real-engine-binding-v1.mjs'
      - 'cerebro/tests/skill-real-engine-binding-v1.test.mjs'
      - 'cerebro/registry/skill-real-engine-binding-v1.json'
      - 'cerebro/registry/skill-high-risk-review-resolution-2026-10-17.json'
      - '.github/workflows/cerebro-skill-real-engine-binding-full-safe-preprod-v1.yml'
permissions: {contents: read, actions: read}

jobs:
  strict-skill-real-engine-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Canonical registry validation
        working-directory: cerebro
        run: npm run validate
      - name: Preserve source wrappers and governed binding topology
        run: |
          git diff --exit-code 9b75acad3e84ad9555a8947cc867f0507332a1e0 -- \
            cerebro/skills/skill-cerebro-supabase-wrapper.mjs \
            cerebro/skills/skill-cerebro-agent-browser-wrapper.mjs \
            cerebro/skills/internal-capability-signals.v0.json \
            cerebro/registry/browser-transversal-autonomy-policy.v1.json \
            cerebro/registry/engine-registry.v1.json \
            cerebro/registry/skill-supply-chain-v0.json
      - name: Focused real-binding tests
        run: node --test cerebro/tests/skill-real-engine-binding-v1.test.mjs
      - name: Execute strict real-engine binding route
        run: |
          mkdir -p /tmp/cerebro-skill-bindings
          node cerebro/skills/skill-real-engine-binding-v1.mjs \
            --company fenix \
            --workdir /tmp/cerebro-skill-bindings/state \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "${{ github.sha }}" \
            --out /tmp/cerebro-skill-bindings/report.json
      - name: Strict FULL SAFE PREPROD gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cerebro-skill-bindings/report.json','utf8'));
          const sup=['DATA-001','DBOFF-001','STOROFF-001','API-001','CRM-001'];
          const browser=['AUTO-001','AUTBOOT-001','QA-001','WEB-001','SCAN-001'];
          if(r.status!=='FULL_SAFE_PREPROD'||r.full_safe_preprod!==true)throw new Error('strict FULL SAFE PREPROD not green');
          if(JSON.stringify(r.bindings?.supabase)!==JSON.stringify(sup)||JSON.stringify(r.bindings?.browser)!==JSON.stringify(browser)||r.binding_count!==10)throw new Error('governed binding topology mismatch');
          if(r.semantic_bindings.length!==10||!r.semantic_bindings.every(x=>x.real_consumption===true&&x.meaningful_change===true&&x.outcome?.old_vs_new==='PASS'&&x.outcome?.candidate_coverage===1&&x.outcome?.baseline_coverage<1))throw new Error('semantic binding proof incomplete');
          if(r.per_binding_old_vs_new_pass!==true||r.old_vs_new_results.length!==10||!r.old_vs_new_results.every(x=>x.decision==='PASS'))throw new Error('per-binding OLD-vs-NEW incomplete');
          if(r.independent_tribunal?.decision!=='PASS'||r.learning_sink?.decision!=='LRN_FEEDBACK_PERSISTED'||r.observability_consumer?.decision!=='OBSERVABILITY_RECORDED'||r.finops_consumer?.decision!=='FINOPS_ZERO_COST_RECORDED'||r.audit_green!==true)throw new Error('tribunal/learning/ops gate failed');
          const br=r.backup_rollback_rebuild;if(!br?.backup_ready||!br.rollback_green||!br.rebuild_green||br.applied_state_hash!==br.rebuilt_state_hash)throw new Error('backup/rollback/rebuild failed');
          if(r.restartable!==true||r.idempotency_proven!==true||r.external_skill_code_executed!==false||r.raw_external_skill_runtime_installed!==false||r.additional_cost_eur!==0)throw new Error('runtime safety/cost gate failed');
          if(r.human_resolution?.decision!=='AUTHORIZE_SAFE_PREPROD_BINDING_CLOSURE_ONLY'||r.prior_evidence?.prior_high_risk_review_green!==true)throw new Error('high-risk review resolution missing');
          const forbidden=['prod_authorized','prod_write_authorized','prod_mutation_authorized','db_mutation_authorized','crm_write_authorized','provider_write_authorized','browser_external_side_effect_authorized','permission_expansion_authorized','customer_data_used','paid_fallback','spend_authorized','trading_access'];
          if(forbidden.some(k=>r[k]!==false))throw new Error('authority expanded');
          console.log(JSON.stringify({status:'GREEN',skills:2,bindings:10,binding_id:r.binding_id,outcome_hash:r.outcome_hash}));
          NODE
      - name: Candidate registry and human-resolution gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('cerebro/registry/skill-real-engine-binding-v1.json','utf8'));
          const h=JSON.parse(fs.readFileSync('cerebro/registry/skill-high-risk-review-resolution-2026-10-17.json','utf8'));
          const allowed=new Set(['STRICT_CANDIDATE_PREPROD','FULL_SAFE_PREPROD']);
          if(r.environment!=='PREPROD'||!allowed.has(r.status)||r.strict_target_status!=='FULL_SAFE_PREPROD'||r.binding_count!==10)throw new Error('registry state invalid');
          if(h.decision!=='AUTHORIZE_SAFE_PREPROD_BINDING_CLOSURE_ONLY'||h.scope?.external_skill_code_execution!==false||h.scope?.prod_write_authorized!==false||h.scope?.permission_expansion_authorized!==false||h.scope?.additional_cost_eur!==0)throw new Error('human resolution unsafe');
          const a=r.authority;const keys=['prod_authorized','prod_write_authorized','prod_mutation_authorized','db_mutation_authorized','crm_write_authorized','provider_write_authorized','browser_external_side_effect_authorized','external_skill_code_execution','permission_expansion_authorized','customer_data_authorized','paid_fallback','spend_authorized','trading_access'];
          if(keys.some(k=>a[k]!==false)||a.additional_cost_eur!==0)throw new Error('registry authority/cost expanded');
          NODE
      - name: Upload strict binding evidence
        uses: actions/upload-artifact@v4
        with:
          name: skill-real-engine-binding-${{ github.run_id }}
          path: |
            /tmp/cerebro-skill-bindings/report.json
            /tmp/cerebro-skill-bindings/state
          retention-days: 30
          if-no-files-found: error
