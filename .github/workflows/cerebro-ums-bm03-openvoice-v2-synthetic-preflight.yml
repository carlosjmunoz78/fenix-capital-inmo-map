name: CEREBRO UMS BM03 OpenVoice V2 Synthetic Preflight

on:
  push:
    branches:
      - cerebro/ums-qwen3-tts-cpu-probe-20261025
    paths:
      - '.github/workflows/cerebro-ums-bm03-openvoice-v2-synthetic-preflight.yml'
      - 'cerebro/media-studio/v2/probes/bm03_openvoice_v2_synthetic_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openvoice_v2_synthetic_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CEREBRO_ENVIRONMENT: PREPROD
      CEREBRO_SPEND_AUTHORIZED: 'false'
      BM03_OV_OUT: ums-bm03-openvoice-v2-preflight
      OPENVOICE_COMMIT: 74a1d147b17a8c3092dd5430504bd83ef6c7eb23
      OPENVOICE_HF_REV: 0ca21e94934d02c13c161296791a5a35972d019c
      BM03_OV_CHECKPOINT_SHA256: 9652c27e92b6b2a91632590ac9962ef7ae2b712e5c5b7f4c34ec55ee2b37ab9e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare diagnostic evidence paths
        run: mkdir -p "$BM03_OV_OUT" synthetic-voices openvoice-checkpoint
      - name: Install isolated zero-cost CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg git libsndfile1
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2
          git clone --filter=blob:none https://github.com/myshell-ai/OpenVoice.git openvoice-upstream
          git -C openvoice-upstream checkout "$OPENVOICE_COMMIT"
          test "$(git -C openvoice-upstream rev-parse HEAD)" = "$OPENVOICE_COMMIT"
          grep -Fq 'Permission is hereby granted, free of charge' openvoice-upstream/LICENSE
          grep -Fq 'sell copies of the Software' openvoice-upstream/LICENSE
          cp openvoice-upstream/LICENSE "$BM03_OV_OUT/openvoice-code-license.txt"
          python -m pip install numpy==1.23.5 librosa==0.9.2 soundfile==0.12.1 pydub==0.25.1 eng_to_ipa==0.0.2 inflect==7.0.0 unidecode==1.3.7 pypinyin==0.50.0 cn2an==0.5.22 jieba==0.42.1 langid==1.1.6
          python -m pip install -e ./openvoice-upstream --no-deps
      - name: Pin and verify MIT OpenVoice V2 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://huggingface.co/myshell-ai/OpenVoiceV2/resolve/$OPENVOICE_HF_REV/converter"
          curl --fail --location --retry 3 -o openvoice-checkpoint/config.json "$BASE/config.json"
          curl --fail --location --retry 3 -o openvoice-checkpoint/checkpoint.pth "$BASE/checkpoint.pth"
          test "$(sha256sum openvoice-checkpoint/checkpoint.pth | awk '{print $1}')" = "$BM03_OV_CHECKPOINT_SHA256"
          curl --fail --location --retry 3 -o openvoice-checkpoint/model-card.md "https://huggingface.co/myshell-ai/OpenVoiceV2/raw/$OPENVOICE_HF_REV/README.md"
          grep -Eiq '^license:[[:space:]]*mit[[:space:]]*$' openvoice-checkpoint/model-card.md
          cp openvoice-checkpoint/model-card.md "$BM03_OV_OUT/openvoice-v2-model-card.md"
      - name: Generate two distinct synthetic speaker references
        shell: bash
        run: |
          set -euo pipefail
          espeak-ng -v en-us+m3 -s 150 -w synthetic-voices/source.wav 'Cerebro synthetic source voice for physical conversion testing.'
          espeak-ng -v en-us+f3 -s 145 -w synthetic-voices/target.wav 'Cerebro synthetic target voice for physical conversion testing.'
          test -s synthetic-voices/source.wav && test -s synthetic-voices/target.wav
          test "$(sha256sum synthetic-voices/source.wav | awk '{print $1}')" != "$(sha256sum synthetic-voices/target.wav | awk '{print $1}')"
      - name: Physical OpenVoice V2 CPU conversion preflight
        env:
          BM03_OV_SOURCE: synthetic-voices/source.wav
          BM03_OV_TARGET: synthetic-voices/target.wav
          BM03_OV_CONFIG: openvoice-checkpoint/config.json
          BM03_OV_CHECKPOINT: openvoice-checkpoint/checkpoint.pth
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 900s python cerebro/media-studio/v2/probes/bm03_openvoice_v2_synthetic_preflight.py | tee bm03-openvoice.stdout.log
          test -s "$BM03_OV_OUT/bm03-openvoice-v2-preflight.json"
          test -s "$BM03_OV_OUT/openvoice-v2-converted.wav"
          python - <<'PY'
          import json
          x=json.load(open('ums-bm03-openvoice-v2-preflight/bm03-openvoice-v2-preflight.json'))
          assert x['status']=='OPENVOICE_V2_VOICE_CONVERSION_RUNTIME_PROVEN_SYNTHETIC_ONLY'
          assert x['benchmark_credit'] is False and x['source']['real_person_media'] is False and x['target']['real_person_media'] is False
          assert x['runtime']['device']=='cpu' and x['runtime']['code_license']=='MIT' and x['runtime']['checkpoint_license']=='MIT'
          assert x['runtime']['embedding_distance']>0
          assert x['output']['duration_seconds']>=1 and x['output']['rms_linear']>0.001
          assert x['human_required_reason']=='LEGAL_REQUIRED'
          assert x['additional_cost_eur']==0 and x['prod_authorized'] is False
          PY
      - name: Upload immutable capability preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ums-bm03-openvoice-v2-synthetic-preflight-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ums-bm03-openvoice-v2-preflight/
            synthetic-voices/
            bm03-openvoice.stdout.log
            openvoice-checkpoint/model-card.md
