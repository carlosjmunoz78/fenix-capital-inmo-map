name: CEREBRO Fenix STAGING Whole-Site Baseline

on:
  push:
    branches:
      - cerebro/seo001-staging-audit-v5-20261018
    paths:
      - scripts/export_fenix_staging_baseline.py
      - .github/workflows/cerebro-fenix-staging-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cerebro-fenix-staging-baseline
  cancel-in-progress: false

jobs:
  export-staging-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASELINE_OUT: baseline
    steps:
      - name: Checkout isolated CEREBRO branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install zero-cost open-source readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pillow ImageHash

      - name: Export STAGING baseline read-only
        run: |
          rm -rf baseline CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip
          python scripts/export_fenix_staging_baseline.py

      - name: Validate baseline contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('baseline/manifest.json')
          if not p.exists(): raise SystemExit('manifest missing')
          m=json.loads(p.read_text(encoding='utf-8'))
          assert m['environment']=='STAGING'
          assert m['prod_touched'] is False
          c=m['counts']
          assert c['wp_pages'] >= 160, c
          assert c['wp_posts'] >= 30, c
          assert c['content_urls_snapshotted'] >= 195, c
          assert c['images'] >= 680, c
          assert Path('baseline/urls.csv').exists()
          assert Path('baseline/tree/internal_links.csv').exists()
          assert Path('baseline/images/images.csv').exists()
          assert Path('baseline/SHA256SUMS.txt').exists()
          print(json.dumps(c, indent=2, ensure_ascii=False))
          PY

      - name: Package exact snapshot
        run: |
          zip -qr CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip baseline
          sha256sum CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip > CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip.sha256

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CEREBRO_FENIX_STAGING_BASELINE_2026-10-18
          path: |
            CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip
            CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip.sha256
            baseline/manifest.json
            baseline/README.md
          if-no-files-found: error
          retention-days: 90

      - name: Persist baseline inside CEREBRO branch
        run: |
          mkdir -p docs/web-baseline/2026-10-18
          cp CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip docs/web-baseline/2026-10-18/
          cp CEREBRO_FENIX_STAGING_BASELINE_2026-10-18.zip.sha256 docs/web-baseline/2026-10-18/
          cp baseline/manifest.json docs/web-baseline/2026-10-18/manifest.json
          cp baseline/README.md docs/web-baseline/2026-10-18/README.md
          cp baseline/urls.csv docs/web-baseline/2026-10-18/urls.csv
          cp baseline/tree/internal_links.csv docs/web-baseline/2026-10-18/internal_links.csv
          cp baseline/tree/internal_target_status.csv docs/web-baseline/2026-10-18/internal_target_status.csv
          cp baseline/tree/dependencies.csv docs/web-baseline/2026-10-18/dependencies.csv
          cp baseline/tree/wordpress_parent_tree.md docs/web-baseline/2026-10-18/wordpress_parent_tree.md
          cp baseline/tree/path_tree.csv docs/web-baseline/2026-10-18/path_tree.csv
          cp baseline/images/images.csv docs/web-baseline/2026-10-18/images.csv
          cp baseline/images/image_usage.csv docs/web-baseline/2026-10-18/image_usage.csv
          cp baseline/images/missing_metadata.csv docs/web-baseline/2026-10-18/image_missing_metadata.csv
          cp baseline/images/duplicates_sha256.csv docs/web-baseline/2026-10-18/image_duplicates_sha256.csv
          cp baseline/images/near_duplicates_phash.csv docs/web-baseline/2026-10-18/image_near_duplicates_phash.csv
          git config user.name 'cerebro-bot'
          git config user.email 'cerebro-bot@users.noreply.github.com'
          git add docs/web-baseline/2026-10-18
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
          else
            git commit -m 'docs(cerebro): persist Fenix STAGING whole-site baseline 2026-10-18'
            git push origin HEAD:cerebro/seo001-staging-audit-v5-20261018
          fi
