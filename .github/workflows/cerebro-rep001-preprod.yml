name: CEREBRO REP-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-ref001-referral-engine-v0-20260911']
    paths:
      - 'cerebro/customer/reputation-engine.mjs'
      - 'cerebro/tests/reputation-engine.test.mjs'
      - '.github/workflows/cerebro-rep001-preprod.yml'
jobs:
  rep001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/reputation-engine.test.mjs
