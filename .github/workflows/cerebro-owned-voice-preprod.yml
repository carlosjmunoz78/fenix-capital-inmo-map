name: CEREBRO VOICE-001 Owned Voice PREPROD Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/voice/**'
      - 'cerebro/tests/owned-voice-v0.test.mjs'
      - 'src/AnaChatBlock.tsx'
      - 'src/CerebroConsoleBlock.tsx'
      - 'src/OperationalShellGate.tsx'
      - 'src/cerebroVoice.ts'
      - 'tests/voice-ui-ana-console.spec.ts'
      - '.github/workflows/cerebro-owned-voice-preprod.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/voice/**'
      - 'cerebro/tests/owned-voice-v0.test.mjs'
      - 'src/AnaChatBlock.tsx'
      - 'src/CerebroConsoleBlock.tsx'
      - 'src/OperationalShellGate.tsx'
      - 'src/cerebroVoice.ts'
      - 'tests/voice-ui-ana-console.spec.ts'
      - '.github/workflows/cerebro-owned-voice-preprod.yml'

permissions:
  contents: read

jobs:
  owned-voice-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FENIX_ENV: preprod
      VITE_SUPABASE_URL: https://hnqlnvakzaywtafeiybt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uvtiidkBBkFRt2K34so27g_JpCbMUZw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Test VOICE-001 owned voice contract
        run: node --test cerebro/tests/owned-voice-v0.test.mjs

      - name: Parse Python runtime without installing model dependencies
        run: |
          python -m py_compile cerebro/voice/runtime/app.py
          python -m py_compile cerebro/voice/runtime/register_voice_reference.py

      - name: Assert no voice recordings or private registry are committed
        shell: bash
        run: |
          set -euo pipefail
          if find cerebro/voice -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' -o -name 'registry.private.json' \) | grep -q .; then
            echo 'Raw/private voice asset committed inside cerebro/voice' >&2
            exit 1
          fi

      - name: Assert VOICE-001 UI authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F "voice_is_transport_not_authority" cerebro/voice/channel-registry.v1.json
          grep -F '"audio_persistence": false' cerebro/voice/channel-registry.v1.json
          grep -F "fenix_prod_chat_send_user" src/AnaChatBlock.tsx
          grep -F "from './cerebroVoice'" src/AnaChatBlock.tsx
          grep -F "cerebro-console-gateway-v0" src/CerebroConsoleBlock.tsx
          grep -F "from './cerebroVoice'" src/CerebroConsoleBlock.tsx
          grep -F "voiceNeedsClarification" src/AnaChatBlock.tsx src/CerebroConsoleBlock.tsx
          grep -F "voiceNeedsManualConfirmation" src/CerebroConsoleBlock.tsx
          test ! -e src/AnaVoiceQueryBlock.tsx
          test ! -e src/VoiceChannelAdapter.ts
          ! grep -R -F 'SUPABASE_SERVICE_ROLE_KEY' src/AnaChatBlock.tsx src/CerebroConsoleBlock.tsx src/cerebroVoice.ts
          ! git diff --name-only origin/main...HEAD 2>/dev/null | grep -Eq '^supabase/functions/(fenix-app-gateway|cerebro-console-gateway-v0)/'

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Build exact voice UI head
        run: npm run build

      - name: Install Chromium for VOICE-001 E2E
        run: npx playwright install --with-deps chromium

      - name: Prove voice reuses exact text contracts
        run: npx playwright test tests/voice-ui-ana-console.spec.ts --project=desktop-chromium

      - name: Record authority boundary
        run: |
          echo 'VOICE-001 browser UI is transport only: no new authority, DB, Edge Function, RPC, paid TTS or audio persistence.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ana Voice reuses fenix_prod_chat_send_user; Console Voice reuses its existing /chat; keyboard remains the fallback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Low-confidence voice is held for review and sensitive confirmations never bypass the existing Gateway.' >> "$GITHUB_STEP_SUMMARY"
