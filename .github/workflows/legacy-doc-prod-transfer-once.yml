name: Legacy DOC PROD Transfer Once

on:
  push:
    branches:
      - ops/legacy-doc-migration-run-20260831

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIGRATION_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/fenix-legacy-doc-migration-once
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - name: Verify secret and derive migration auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOTION_TOKEN"
          AUTH="$(printf '%s' "${NOTION_TOKEN}:fenix-docs-20260831" | sha256sum | awk '{print $1}')"
          echo "MIGRATION_AUTH=$AUTH" >> "$GITHUB_ENV"

      - name: Refresh and validate 31-page / 118-file manifest
        shell: bash
        run: |
          set -euo pipefail
          : > check.ndjson
          for start in 0 5 10 15 20 25 30; do
            curl --fail --silent --show-error --max-time 90 \
              -H "x-migration-auth: ${MIGRATION_AUTH}" \
              "${MIGRATION_URL}?mode=check&start=${start}&count=5" >> check.ndjson
            printf '\n' >> check.ndjson
          done
          jq -s '[.[].rows[]]' check.ndjson > check.json
          test "$(jq 'length' check.json)" = "31"
          test "$(jq '[.[].expected]|add' check.json)" = "118"
          test "$(jq '[.[].actual]|add' check.json)" = "118"
          test "$(jq '[.[]|select(.expected != .actual)]|length' check.json)" = "0"
          BAD="$(jq -r '[.[].files[] | select(. != null) | ascii_downcase | capture("\\.(?<ext>[^.]+)$").ext | select(. != "pdf" and . != "jpg" and . != "jpeg" and . != "png" and . != "webp" and . != "doc" and . != "docx" and . != "xls" and . != "xlsx" and . != "txt")] | length' check.json)"
          test "$BAD" = "0"
          echo "MANIFEST_OK=31/31 pages, 118/118 files"

      - name: Transfer files one by one idempotently
        shell: bash
        run: |
          set -euo pipefail
          : > migration.ndjson
          for i in $(seq 0 30); do
            count="$(jq ".[$i].actual" check.json)"
            for fi in $(seq 0 $((count-1))); do
              tmp="$(mktemp)"
              status="$(curl --silent --show-error --max-time 180 \
                -H "x-migration-auth: ${MIGRATION_AUTH}" \
                -o "$tmp" -w '%{http_code}' \
                "${MIGRATION_URL}?mode=migrate&i=${i}&fi=${fi}")"
              cat "$tmp" >> migration.ndjson
              printf '\n' >> migration.ndjson
              if test "$status" -lt 200 || test "$status" -ge 300 || test "$(jq -r '.ok' "$tmp")" != "true"; then
                echo "Migration failed i=${i} fi=${fi} status=${status}" >&2
                cat "$tmp" >&2
                exit 1
              fi
              echo "OK i=${i} fi=${fi} $(jq -r '.filename' "$tmp")"
            done
          done
          test "$(wc -l < migration.ndjson | tr -d ' ')" = "118"
          test "$(jq -s '[.[]|select(.ok==true)]|length' migration.ndjson)" = "118"

      - name: Reconcile database provenance and versions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 \
            -H "x-migration-auth: ${MIGRATION_AUTH}" \
            "${MIGRATION_URL}?mode=reconcile" > reconcile.json
          cat reconcile.json
          test "$(jq -r '.ok' reconcile.json)" = "true"
          test "$(jq -r '.origin_links' reconcile.json)" = "118"
          test "$(jq -r '.missing_version_docs|length' reconcile.json)" = "0"
          test "$(jq -r '.documents' reconcile.json)" -gt "0"
          test "$(jq -r '.versions' reconcile.json)" -gt "0"

      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-doc-prod-transfer-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            check.json
            migration.ndjson
            reconcile.json
