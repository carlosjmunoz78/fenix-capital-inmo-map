name: Legacy DOC PROD Final Reconcile

on:
  push:
    branches:
      - ops/legacy-doc-migration-run-20260831

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIGRATION_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/fenix-legacy-doc-migration-once
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - name: Derive non-exposed migration auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOTION_TOKEN"
          AUTH="$(printf '%s' "${NOTION_TOKEN}:fenix-docs-20260831" | sha256sum | awk '{print $1}')"
          echo "MIGRATION_AUTH=$AUTH" >> "$GITHUB_ENV"

      - name: Recheck live legacy manifest
        shell: bash
        run: |
          set -euo pipefail
          : > check.ndjson
          for start in 0 5 10 15 20 25 30; do
            curl --fail --silent --show-error --max-time 90 \
              -H "x-migration-auth: ${MIGRATION_AUTH}" \
              "${MIGRATION_URL}?mode=check&start=${start}&count=5" >> check.ndjson
            printf '\n' >> check.ndjson
          done
          jq -s '[.[].rows[]]' check.ndjson > check.json
          test "$(jq 'length' check.json)" = "31"
          test "$(jq '[.[].expected]|add' check.json)" = "118"
          test "$(jq '[.[].actual]|add' check.json)" = "118"
          test "$(jq '[.[]|select(.expected != .actual)]|length' check.json)" = "0"
          echo 'MANIFEST_RECHECK_OK=31/31,118/118'

      - name: Reconcile PROD provenance and versions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 \
            -H "x-migration-auth: ${MIGRATION_AUTH}" \
            "${MIGRATION_URL}?mode=reconcile" > reconcile.json
          cat reconcile.json
          test "$(jq -r '.ok' reconcile.json)" = "true"
          test "$(jq -r '.origin_links' reconcile.json)" = "118"
          test "$(jq -r '.unique_documents' reconcile.json)" = "117"
          test "$(jq -r '.versions' reconcile.json)" = "117"
          test "$(jq -r '.missing_version_docs' reconcile.json)" = "0"
          test "$(jq -r '.total_bytes' reconcile.json)" -gt "0"
          echo 'RECONCILED=118 origins,117 unique binaries,0 missing versions'

      - name: Upload non-secret reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: legacy-doc-prod-final-reconcile-${{ github.run_id }}
          retention-days: 30
          path: |
            check.json
            reconcile.json
