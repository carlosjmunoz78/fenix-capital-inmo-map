name: FACT001 Universal Cloudflare Department and Website Factory LAB
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - .github/workflows/fact001-cloudflare-factory-onboarding-lab.yml
      - cerebro/connectors/universal/src/cloudflare-onboarding.mjs
      - cerebro/connectors/universal/tests/cloudflare-onboarding.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-multi-company-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Test internal departments social-instagram/linkedin, engines, websites and multi-company resource plans
        run: |
          node --test cerebro/connectors/universal/tests/cloudflare-onboarding.test.mjs
          node --test cerebro/connectors/universal/tests/headless.test.mjs
          node --test cerebro/connectors/universal/tests/headless-registry.test.mjs
      - name: Ensure every new unit requires inventory, owner, safe quota and promotion policy
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('cerebro/connectors/universal/src/cloudflare-onboarding.mjs','utf8');
          const required=['TRUSTED_PROVIDER_INVENTORY_REQUIRED','resource_ownership','policy_grant','quota_and_cost','backup_restore','rollback','rebuild','observability','DISABLED_UNTIL_OWNERSHIP_AND_DNS_ROLLBACK','provider_writes_enabled:false'];
          for(const word of required)if(!s.includes(word))throw Error('MISSING_GATE_'+word);
          if(s.includes('fetch(')||s.includes('process.env')||s.includes('cloudflare.request('))throw Error('PLANNER_MUST_NOT_HAVE_SIDE_EFFECTS');
          console.log('FACT001_FACTORY_CAN_PLAN_ANY_DEPARTMENT=true');
          console.log('FACT001_FACTORY_CAN_PLAN_NEW_WEBSITE=true');
          console.log('FACT001_FACTORY_AUTONOMOUS_CREATE_DEPLOY_DELETE=NOT_YET_VERIFIED');
          console.log('FACT001_FACTORY_PROD_WRITES=0');
          NODE
