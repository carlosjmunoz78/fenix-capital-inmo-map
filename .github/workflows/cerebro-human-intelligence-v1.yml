name: CEREBRO Human Intelligence V1 LAB Gate

on:
  pull_request:
    paths:
      - 'cerebro/human-intelligence/**'
      - 'cerebro/tests/human-intelligence-*.test.mjs'
      - 'supabase/functions/cerebro-human-old-actor-preprod-v0/**'
      - 'supabase/functions/cerebro-human-new-actor-preprod-v1/**'
      - '.github/workflows/cerebro-human-intelligence-v1.yml'
  workflow_dispatch:

concurrency:
  group: cerebro-human-intelligence-v1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BASELINE_SHA: 3b6b3f45fb3eea624b1834d0c592c6b6f6550e1e

jobs:
  lab-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install existing repository dependencies
        run: npm ci

      - name: Validate Human Intelligence contracts planner rights HumanProfile hard gates synthetic population conversation gym metrics NEW planner and real actor boundary
        run: |
          node --test \
            cerebro/tests/human-intelligence-contract-v1.test.mjs \
            cerebro/tests/human-intelligence-scenario-plan-v1.test.mjs \
            cerebro/tests/human-intelligence-rights-gate-v1.test.mjs \
            cerebro/tests/human-intelligence-profile-gates-v1.test.mjs \
            cerebro/tests/human-intelligence-synthetic-population-v1.test.mjs \
            cerebro/tests/human-intelligence-conversation-gym-v1.test.mjs \
            cerebro/tests/human-intelligence-conversation-metrics-v1.test.mjs \
            cerebro/tests/human-intelligence-new-planner-v1.test.mjs \
            cerebro/tests/human-intelligence-real-actor-gate-v1.test.mjs

      - name: Materialize deterministic 240-episode LAB plan
        run: |
          node cerebro/human-intelligence/lab/scenario-plan.mjs \
            --baseline-sha "$BASELINE_SHA" \
            --scenario-count 60 \
            --out artifacts/human-intelligence/scenario-plan.v1.json

      - name: Materialize procedural population coverage evidence
        run: |
          node cerebro/human-intelligence/lab/population-manifest.mjs \
            --count 1000 \
            --seed-prefix "${BASELINE_SHA}-population-v1" \
            --out artifacts/human-intelligence/population-manifest.v1.json

      - name: Run physical PREPROD OLD actor preflight and first multi-turn episode
        run: |
          node cerebro/human-intelligence/lab/run-real-old-sample.mjs \
            --out artifacts/human-intelligence/real-old-sample.v1.json

      - name: Run representative physical OLD baseline batch
        run: |
          node cerebro/human-intelligence/lab/run-real-old-batch.mjs \
            --out artifacts/human-intelligence/real-old-batch.v1.json
          jq '{status,scope,cases_total,metrics:{episodes_verified_real_actor,actor_turns_total,duplicate_reply_rate,useful_question_rate,ignored_concern_rate,grounding_rate,clear_explanation_rate,hidden_facts_revealed_total,ontology_leaks_total,actor_errors_total}}' artifacts/human-intelligence/real-old-batch.v1.json

      - name: Run physical paired OLD vs NEW directional gate
        run: |
          node cerebro/human-intelligence/lab/run-real-old-vs-new-batch.mjs \
            --out artifacts/human-intelligence/old-vs-new-batch.v1.json
          jq '{status,scope,cases_total,old:{duplicate_reply_rate:.old_metrics.duplicate_reply_rate,useful_question_rate:.old_metrics.useful_question_rate,ignored_concern_rate:.old_metrics.ignored_concern_rate},new:{duplicate_reply_rate:.new_metrics.duplicate_reply_rate,useful_question_rate:.new_metrics.useful_question_rate,ignored_concern_rate:.new_metrics.ignored_concern_rate},deltas,gates,decision}' artifacts/human-intelligence/old-vs-new-batch.v1.json

      - name: Enforce immutable safety boundaries and physical actor evidence
        run: |
          jq -e '
            .state_type=="CEREBRO_HUMAN_INTELLIGENCE_SCENARIO_PLAN_V1" and
            .engine_id=="SIM-001" and
            .environment=="LAB" and
            .episodes_total==240 and
            .safety.contains_customer_data==false and
            .safety.contains_secrets==false and
            .safety.prod_authorized==false and
            .safety.prod_write_authorized==false and
            .safety.trading_access==false and
            .safety.additional_cost_eur==0 and
            ([.episodes[] | select(.environment!="LAB" or .prod_authorized!=false or .prod_write_authorized!=false or .trading_access!=false or .contains_customer_data!=false or .contains_secrets!=false or .additional_cost_eur!=0)] | length)==0
          ' artifacts/human-intelligence/scenario-plan.v1.json >/dev/null

          jq -e '
            .state_type=="CEREBRO_SYNTHETIC_HUMAN_POPULATION_MANIFEST_V1" and
            .engine_id=="SIM-001" and
            .environment=="LAB" and
            .requested_profiles==1000 and
            .unique_coverage_signatures>=850 and
            .private_profiles_persisted==false and
            .identifiable_customer_data==false and
            .secrets==false and
            .prod_authorized==false and
            .prod_write_authorized==false and
            .trading_access==false and
            .additional_cost_eur==0
          ' artifacts/human-intelligence/population-manifest.v1.json >/dev/null

          jq -e '
            .state_type=="CEREBRO_REAL_OLD_ACTOR_PHYSICAL_SAMPLE_V1" and
            .status=="GREEN" and
            .preflight.ok==true and
            .preflight.actor_evidence.environment=="PREPROD" and
            .preflight.actor_evidence.source_mode=="FROZEN_PROD_V33_SANDBOX" and
            .episode.real_cerebro_actor==true and
            .episode.turns>=3 and
            .episode.completion_reason=="PREPROD_MULTI_TURN_CONNECTIVITY_CONFIRMED" and
            .safety.prod_invoked==false and
            .safety.prod_write_authorized==false and
            .safety.prod_execution_enabled==false and
            .safety.contains_customer_data==false and
            .safety.trading_access==false and
            .safety.additional_cost_eur==0
          ' artifacts/human-intelligence/real-old-sample.v1.json >/dev/null

          jq -e '
            .state_type=="CEREBRO_REAL_OLD_BASELINE_BATCH_V1" and
            .status=="GREEN" and
            .cases_total==12 and
            .metrics.episodes_verified_real_actor==12 and
            .metrics.verified_real_actor_rate==1 and
            .metrics.actor_errors_total==0 and
            .metrics.ontology_leaks_total==0 and
            .safety.prod_invoked==false and
            .safety.prod_write_authorized==false and
            .safety.prod_execution_enabled==false and
            .safety.contains_customer_data==false and
            .safety.trading_access==false and
            .safety.additional_cost_eur==0 and
            .safety.learning_dispatch_authorized==false
          ' artifacts/human-intelligence/real-old-batch.v1.json >/dev/null

          jq -e '
            .state_type=="CEREBRO_HUMAN_INTELLIGENCE_OLD_VS_NEW_BATCH_V1" and
            .status=="GREEN" and
            .cases_total==12 and
            .old_metrics.episodes_verified_real_actor==12 and
            .new_metrics.episodes_verified_real_actor==12 and
            .old_metrics.actor_errors_total==0 and
            .new_metrics.actor_errors_total==0 and
            .old_metrics.ontology_leaks_total==0 and
            .new_metrics.ontology_leaks_total==0 and
            .gates.preflight==true and
            .gates.all_pairs_real_and_comparable==true and
            .gates.duplicate_replies_improve==true and
            .gates.useful_questions_improve==true and
            .gates.ignored_concern_improves_or_holds==true and
            .decision.candidate_advances_to_next_lab_gate==true and
            .decision.prod_promotion_authorized==false and
            .decision.preprod_promotion_authorized==false and
            .safety.prod_invoked==false and
            .safety.prod_write_authorized==false and
            .safety.prod_execution_enabled==false and
            .safety.contains_customer_data==false and
            .safety.trading_access==false and
            .safety.additional_cost_eur==0 and
            .safety.learning_dispatch_authorized==false
          ' artifacts/human-intelligence/old-vs-new-batch.v1.json >/dev/null

      - name: Upload LAB planning population and physical actor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-human-intelligence-v1-${{ github.run_id }}
          path: artifacts/human-intelligence/**
          if-no-files-found: warn
          retention-days: 30
