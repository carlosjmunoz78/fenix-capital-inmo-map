name: CEREBRO JARVIS V2 Full UI Regression Isolated Corrected ONE SHOT 20261109
on:
  push:
    branches:
      - cerebro/jarvis-rollback-rehearsal-once-20261109
    paths:
      - '.github/workflows/cerebro-jarvis-full-ui-regression-once-20261109.yml'
permissions:
  contents: read
jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FENIX_ENV: preprod
      VITE_SUPABASE_URL: https://hnqlnvakzaywtafeiybt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uvtiidkBBkFRt2K34so27g_JpCbMUZw
      CEREBRO_ENVIRONMENT: PREPROD
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
      PLAYWRIGHT_SKIP_BUILD: '1'
      SOURCE_SHA: 862ee543036070bc2cbb3ccaffc6c81af6d6a225
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert pinned NEW source
        run: |\n          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"\n          git fetch --depth=1 origin 862ee543036070bc2cbb3ccaffc6c81af6d6a225\n          git diff --quiet 862ee543036070bc2cbb3ccaffc6c81af6d6a225 "$GITHUB_SHA" -- src
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install lockfile dependencies and compile isolated QA
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium isolated QA
        run: npx playwright install chromium
      - name: Run all four JARVIS UI and voice diagnostic tests with mocked gateways
        run: |
          set -euo pipefail
          npx playwright test tests/cerebro-jarvis-v1-preview.spec.ts --project=desktop-chromium --reporter=line
          echo 'JARVIS_FULL_UI_REGRESSION_MOCKED=GREEN'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-full-ui-regression-one-shot
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
