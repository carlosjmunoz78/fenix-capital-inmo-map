name: CEREBRO RET-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-cx001-customer-experience-v0-20260911']
    paths:
      - 'cerebro/customer/retention-engine.mjs'
      - 'cerebro/tests/retention-engine.test.mjs'
      - '.github/workflows/cerebro-ret001-preprod.yml'
jobs:
  ret001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/retention-engine.test.mjs
