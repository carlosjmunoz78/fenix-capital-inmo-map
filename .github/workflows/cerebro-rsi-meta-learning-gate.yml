name: CEREBRO RSI Meta Learning Gate
on:
  pull_request:
    paths:
      - 'cerebro/runtime/meta-learning.mjs'
      - 'cerebro/tests/meta-learning.test.mjs'
      - 'cerebro/docs/RSI_META_LEARNING_V0.md'
      - '.github/workflows/cerebro-rsi-meta-learning-gate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  block-h-meta-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node --test cerebro/tests/meta-learning.test.mjs
