name: Diagnose Live Hosting

on:
  push:
    branches:
      - diag-live-hosting-20260831

permissions:
  contents: read
  pages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect and restart GitHub Pages custom-domain TLS
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/${GITHUB_REPOSITORY}/pages'
          echo '=== CURRENT PAGES STATE ==='
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api" | python -m json.tool
          echo '=== RESTART CUSTOM DOMAIN PROVISIONING ==='
          curl -fsS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "$api" -d '{"cname":null}' >/dev/null
          sleep 3
          curl -fsS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "$api" -d '{"cname":"app.fenixcapital.es"}' >/dev/null
          echo '=== PAGES STATE AFTER RESTART ==='
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$api" | python -m json.tool

      - name: Wait for HTTPS certificate and exact PROD build
        shell: bash
        run: |
          set -euo pipefail
          expected='066807d19376f5dac100833e5ba7350688290961'
          test "$(dig +short app.fenixcapital.es CNAME | tail -1)" = 'carlosjmunoz78.github.io.'
          for i in $(seq 1 36); do
            echo "TLS attempt ${i}/36"
            cert=$(echo | openssl s_client -servername app.fenixcapital.es -connect app.fenixcapital.es:443 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null || true)
            if echo "$cert" | grep -F 'DNS:app.fenixcapital.es' >/dev/null; then
              sha=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://app.fenixcapital.es/PROD_SOURCE_SHA.txt?diag=$(date +%s)" || true)
              echo "LIVE_SHA=${sha}"
              if [ "$sha" = "$expected" ]; then
                html=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://app.fenixcapital.es/?diag=$(date +%s)")
                echo "$html" | grep -F 'Fénix Capital · CEREBRO OS' >/dev/null
                echo "$html" | grep -F '/assets/index-pSw9Jh1R.js' >/dev/null
                echo 'LIVE_PROD_GREEN=true'
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'TLS_OR_LIVE_SHA_NOT_READY=true'
          exit 1
