name: Diagnose Live Hosting

on:
  push:
    branches:
      - diag-live-hosting-20260831

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS and HTTP diagnostics
        shell: bash
        run: |
          set -u
          echo '=== DNS CNAME ==='
          dig +short app.fenixcapital.es CNAME || true
          echo '=== DNS A ==='
          dig +short app.fenixcapital.es A || true
          echo '=== DNS AAAA ==='
          dig +short app.fenixcapital.es AAAA || true
          echo '=== NS fenixcapital.es ==='
          dig +short fenixcapital.es NS || true
          echo '=== HTTP HEAD ==='
          curl -sSIL --max-time 30 https://app.fenixcapital.es/ || true
          echo '=== LIVE SHA ==='
          curl -sS -D - --max-time 30 https://app.fenixcapital.es/PROD_SOURCE_SHA.txt || true
          echo
          echo '=== HTML PREFIX ==='
          curl -sS --max-time 30 https://app.fenixcapital.es/ | head -c 2500 || true
          echo
          echo '=== TLS CERT ==='
          echo | openssl s_client -servername app.fenixcapital.es -connect app.fenixcapital.es:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
