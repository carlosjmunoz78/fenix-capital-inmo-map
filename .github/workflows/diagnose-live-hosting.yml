name: Diagnose Live Hosting

on:
  push:
    branches:
      - diag-live-hosting-20260831

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test current live and GitHub Pages target
        shell: bash
        run: |
          set -u
          stamp="$(date +%s)"
          echo '=== LIVE DNS ==='
          dig +short app.fenixcapital.es CNAME || true
          echo '=== LIVE ASSETS ==='
          curl -sS --max-time 30 -H 'Cache-Control: no-cache' "https://app.fenixcapital.es/?diag=${stamp}" | grep -Eo '/assets/[^" ]+\.(js|css)' | head -20 || true
          echo '=== GITHUB PAGES ROOT ==='
          curl -sSIL --max-time 30 "https://carlosjmunoz78.github.io/fenix-capital-inmo-map/" || true
          echo '=== GITHUB PAGES PROD SHA ==='
          curl -sS -D - --max-time 30 "https://carlosjmunoz78.github.io/fenix-capital-inmo-map/PROD_SOURCE_SHA.txt" || true
          echo
          echo '=== GITHUB PAGES ASSETS ==='
          curl -sS --max-time 30 "https://carlosjmunoz78.github.io/fenix-capital-inmo-map/" | grep -Eo '/[^" ]*assets/[^" ]+\.(js|css)' | head -20 || true
