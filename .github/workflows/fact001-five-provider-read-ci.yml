name: FACT001 Five CEREBRO provider read router policy CI
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/five-provider-read-lab/**
      - .github/workflows/fact001-five-provider-read-ci.yml
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - run: |
          node --test cerebro/connectors/universal/services/five-provider-read-lab/tests/*.test.mjs
          node --check cerebro/connectors/universal/services/five-provider-read-lab/run-once.mjs
