name: CEREBRO VOICE-001 ESM11 European-Spanish Forensic Trial

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/voice/runtime/esm11_kugelaudio_european_spanish_trial.py'
      - 'cerebro/voice/VOICE_ESM10_JARVIS_STYLE_FORENSIC_RESEARCH_V0.md'
      - '.github/workflows/cerebro-voice-esm11-kugelaudio-es-es.yml'

permissions:
  contents: read

jobs:
  esm11-european-spanish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight Space client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.13,<2'

      - name: Generate ESM11 original forensic-style European-Spanish candidates
        env:
          CEREBRO_ENVIRONMENT: LAB
        run: |
          mkdir -p "$RUNNER_TEMP/esm11"
          python cerebro/voice/runtime/esm11_kugelaudio_european_spanish_trial.py --output-dir "$RUNNER_TEMP/esm11"

      - name: Verify evidence boundary
        shell: python
        run: |
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'esm11' / 'ESM11_kugelaudio_evidence.json'
          e = json.loads(p.read_text(encoding='utf-8'))
          assert e['engine_id'] == 'VOICE-001'
          assert e['voice_target'] == 'ESM11'
          assert e['target_locale'] == 'es-ES'
          assert e['identity_policy']['synthetic_reference_only'] is True
          assert e['identity_policy']['actor_clone'] is False
          assert e['identity_policy']['character_clone'] is False
          assert e['identity_policy']['movie_audio_reference'] is False
          assert e['authority']['automatic_promotion'] is False
          assert e['authority']['voice_bank_ready'] is False
          assert e['authority']['prod_enabled'] is False
          assert len(e['candidates']) == 2
          print('GREEN: ESM11 owner-listening candidates generated; no promotion.')

      - name: Upload ESM11 listening candidates
        uses: actions/upload-artifact@v4
        with:
          name: voice001-esm11-european-spanish-forensic-candidates
          path: |
            ${{ runner.temp }}/esm11/ESM11_A_GRAVE_SERENE_es_ES.wav
            ${{ runner.temp }}/esm11/ESM11_B_SMOOTH_PRECISE_es_ES.wav
            ${{ runner.temp }}/esm11/ESM11_kugelaudio_evidence.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Record scope
        run: |
          echo 'ESM11 uses only original synthetic timbre references and KugelAudio European-language Spanish output.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No actor, movie, character, or identifiable-person reference audio is used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Owner listening required. PROD=false. automatic_promotion=false.' >> "$GITHUB_STEP_SUMMARY"
