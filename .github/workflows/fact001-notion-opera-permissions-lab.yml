name: FACT001 Notion Opera Root Access LAB
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/provider-headless-lab/requests/notion-opera-roots.v1.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: fact001-notion-opera-roots-readonly
  cancel-in-progress: false
jobs:
  signed-root-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: CEREBRO verifies independent Notion connection for 27 Opera roots without page content
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const order=JSON.parse(readFileSync('cerebro/connectors/universal/services/provider-headless-lab/requests/notion-opera-roots.v1.json','utf8'));
          const expected={company_id:'fenix-capital',engine_id:'FACT-001',environment:'LAB',version:'1.0.0',
           client_id:'cerebro',source:'owner_order',operation:'notion.opera_roots.access_read',
           request_id:'FACT001-NOTION-OPERA-ROOTS-20261110'};
          if(JSON.stringify(Object.keys(order).sort())!==JSON.stringify(Object.keys(expected).sort())||
             Object.entries(expected).some(([k,v])=>order[k]!==v))throw Error('FACT001_INVALID_ORDER');
          const url='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-fact001-headless-provider-lab/notion-root-access';
          async function call(jwt,body){
           const r=await fetch(url,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json',
            ...(jwt?{Authorization:'Bearer '+jwt}:{})},body:JSON.stringify(body),redirect:'error',
            signal:AbortSignal.timeout(110000)});
           let data={};try{data=await r.json()}catch{}
           return {status:r.status,data};
          }
          const anonymous=await call(null,order),forged=await call('forged-oidc',order);
          if(anonymous.status!==401||forged.status!==401)throw Error('FACT001_OIDC_GUARD_FAILED');
          console.log('FACT001_NOTION_OPERA_ANON_401=PASS');
          console.log('FACT001_NOTION_OPERA_FORGED_401=PASS');
          const endpoint=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,grant=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!endpoint||!grant)throw Error('OIDC_MISSING');
          const u=endpoint+(endpoint.includes('?')?'&':'?')+'audience='+encodeURIComponent('cerebro-fact001-provider-headless-lab-v1');
          const oidc=await fetch(u,{headers:{Authorization:'Bearer '+grant},redirect:'error',signal:AbortSignal.timeout(12000)});
          if(!oidc.ok)throw Error('OIDC_TOKEN_DENIED');
          const jwt=(await oidc.json()).value;
          if(typeof jwt!=='string'||jwt.split('.').length!==3)throw Error('OIDC_INVALID');
          const foreign=await call(jwt,{...order,environment:'PROD'});
          if(foreign.status!==403)throw Error('FACT001_SCOPE_GUARD_FAILED');
          console.log('FACT001_NOTION_OPERA_PROD_403=PASS');
          const result=await call(jwt,order),data=result.data;
          if(result.status!==200||data?.status!=='NOTION_INDEPENDENT_ROOT_PERMISSION_AUDIT'||
             data?.checked!==27||!Array.isArray(data.results)||data.results.length!==27||
             data?.read_only!==true||data?.write_operations!==0||
             data?.credentials_exposed!==false||data?.content_returned!==false)
             throw Error('FACT001_NOTION_AUDIT_RESPONSE_NOT_VERIFIED_HTTP_'+result.status);
          console.log('FACT001_NOTION_OPERA_CHECKED='+data.checked);
          console.log('FACT001_NOTION_OPERA_ACCESSIBLE='+data.accessible);
          console.log('FACT001_NOTION_OPERA_DENIED='+data.denied);
          console.log('FACT001_NOTION_OPERA_INCONCLUSIVE='+data.inconclusive);
          for(const item of data.results)
            console.log('FACT001_ROOT '+JSON.stringify({name:item.name,id:item.id,status:item.status}));
          console.log('FACT001_NOTION_OPERA_AUDIT_EXECUTED=PASS');
          NODE
