name: ZEUS JARVIS B7 Cut02 Real GitHub plus PG17 LAB
on:
  pull_request:
    paths:
      - 'zeus/jarvis/gates/b7-cut02-real-pg17-github-lab.mjs'
      - '.github/workflows/jarvis-b7-cut02-real-pg17-github-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distributed-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jarvis_ci
          POSTGRES_PASSWORD: ephemeral_only_b7_pg17_lab
          POSTGRES_DB: jarvis_b7_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_ci -d jarvis_b7_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: jarvis_ci
      PGPASSWORD: ephemeral_only_b7_pg17_lab
      PGDATABASE: jarvis_b7_lab
    steps:
      - uses: actions/checkout@v4
      - name: Ensure disposable PG17 CLI is available
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Reuse existing B6 journal in disposable B7 PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f zeus/jarvis/gates/b6-pg17-idempotency-journal-candidate.sql
      - name: Real read-only GitHub distributed DAG and restart idempotency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JARVIS_B7_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node zeus/jarvis/gates/b7-cut02-real-pg17-github-lab.mjs
