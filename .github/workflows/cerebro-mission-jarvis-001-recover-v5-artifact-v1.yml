name: JARVIS-001 RECOVER VALID V5 BLUEPRINTS · PREPROD

on:
  push:
    branches:
      - cerebro/mission-jarvis-001-20261030
    paths:
      - '.github/workflows/cerebro-mission-jarvis-001-recover-v5-artifact-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: mission-jarvis-001-recover-v5-artifact-v1
  cancel-in-progress: false

env:
  CEREBRO_SUPERVISOR_ENV: PREPROD
  CEREBRO_PROD_WRITE: 'false'
  CEREBRO_TRADING_ACCESS: 'false'
  SOURCE_RUN_ID: '41013849206'
  SOURCE_ARTIFACT_ID: '12958732178'
  KNOWN_PRIOR_COST_FLOOR_USD: '0.123340086'
  SOURCE_RUN_COST_USD: '0.028316442'

jobs:
  recover-govern-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce zero-paid PREPROD recovery guards
        shell: bash
        run: |
          set -euo pipefail
          test "$CEREBRO_SUPERVISOR_ENV" = PREPROD
          test "$CEREBRO_PROD_WRITE" = false
          test "$CEREBRO_TRADING_ACCESS" = false
          test -z "${DEEPSEEK_API_KEY:-}"
      - name: Download previously generated V5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jarvis-v5-recovery
          mkdir -p /tmp/jarvis-v5-recovery
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/jarvis-v5-recovery/artifact.zip
          unzip -q /tmp/jarvis-v5-recovery/artifact.zip -d /tmp/jarvis-v5-recovery/unpacked
          test -f /tmp/jarvis-v5-recovery/unpacked/generated-blueprints/summary.json
          count="$(find /tmp/jarvis-v5-recovery/unpacked/generated-blueprints -mindepth 2 -maxdepth 2 -type f \( -name design.json -o -name implementation.json \) | wc -l | tr -d ' ')"
          test "$count" = 36
      - name: Restore generated blueprints into candidate branch workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cerebro/jarvis/mission-001/generated-blueprints
          mkdir -p cerebro/jarvis/mission-001/generated-blueprints
          cp -a /tmp/jarvis-v5-recovery/unpacked/generated-blueprints/. cerebro/jarvis/mission-001/generated-blueprints/
      - name: Apply deterministic blueprint governance
        run: |
          node cerebro/runtime/jarvis-blueprint-governance-v1.mjs \
            --root=cerebro/jarvis/mission-001/generated-blueprints \
            --source_run_id=${SOURCE_RUN_ID}
      - name: Validate governance and current JARVIS prerequisite tests
        run: |
          node --test cerebro/tests/jarvis-blueprint-governance-v1.test.mjs
          node --test cerebro/tests/jarvis-core-v1.test.mjs
          node --test cerebro/tests/jarvis-core-readiness-v1.test.mjs
          node --test cerebro/tests/jarvis-integration-v1.test.mjs
          node --test cerebro/tests/jarvis-mission-job001-adapter-v1.test.mjs
          node --test cerebro/tests/jarvis-mission-dag-v2.test.mjs
      - name: Validate recovered semantic and governance gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const root='cerebro/jarvis/mission-001/generated-blueprints';
          const s=JSON.parse(fs.readFileSync(`${root}/summary.json`,'utf8'));
          if(s.valid_blueprints!==36) throw new Error(`VALID_BLUEPRINT_COUNT:${s.valid_blueprints}`);
          if(s.semantic_gate!=='GREEN'||s.governance_gate!=='GREEN') throw new Error('SEMANTIC_OR_GOVERNANCE_GATE_NOT_GREEN');
          if((s.active_human_required||[]).length!==0||(s.human_required||[]).length!==0) throw new Error('ACTIVE_HUMAN_REQUIRED_NOT_ZERO');
          if(Number(s.source_run_id)!==41013849206) throw new Error(`SOURCE_RUN_MISMATCH:${s.source_run_id}`);
          for(let i=1;i<=18;i++){
            const pid=`P${String(i).padStart(2,'0')}`;
            for(const file of ['design.json','implementation.json']){
              const x=JSON.parse(fs.readFileSync(`${root}/${pid}/${file}`,'utf8'));
              if(x.active_human_required!==null) throw new Error(`MODEL_HUMAN_REQUIRED_LEAK:${pid}/${file}`);
              if(x.governance_rule!=='MODEL_CANNOT_SELF_DECLARE_HUMAN_REQUIRED') throw new Error(`GOVERNANCE_RULE_MISSING:${pid}/${file}`);
              if(!x.blueprint||Object.keys(x.blueprint).length<2) throw new Error(`INVALID_BLUEPRINT:${pid}/${file}`);
            }
          }
          console.log(JSON.stringify({valid_blueprints:s.valid_blueprints,governance_gate:s.governance_gate,advisories:s.raw_model_advisory_approval_count,active_human_required:s.active_human_required}));
          NODE
      - name: Build current reuse map and evidence-true mission state
        shell: bash
        run: |
          set -euo pipefail
          JARVIS_REUSE_MAP_OUT=cerebro/jarvis/mission-001/reuse-map.v1.json node cerebro/runtime/jarvis-reuse-map-v1.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const {coreReadiness}=await import('./cerebro/jarvis/core-v1/core-readiness-v1.mjs');
          const summary=JSON.parse(fs.readFileSync('cerebro/jarvis/mission-001/generated-blueprints/summary.json','utf8'));
          const reuse=JSON.parse(fs.readFileSync('cerebro/jarvis/mission-001/reuse-map.v1.json','utf8'));
          const core=coreReadiness();
          const prior=Number(process.env.KNOWN_PRIOR_COST_FLOOR_USD);
          const sourceCost=Number(process.env.SOURCE_RUN_COST_USD);
          const floor=Math.round((prior+sourceCost)*1e9)/1e9;
          const state={
            schema_version:'1.5',
            mission_id:'MISSION-JARVIS-001',
            environment:'PREPROD',
            status:`CORE_${core.minimal_core_status}_SEMANTIC_BLUEPRINTS_GOVERNED_GREEN`,
            master:'JARVIS_MASTER_V1_RC2',
            programs:18,
            master_sections:421,
            work_units:5924,
            tasks:5473,
            blueprint_provenance:{source_run_id:Number(process.env.SOURCE_RUN_ID),source_artifact_id:Number(process.env.SOURCE_ARTIFACT_ID),recovered_without_new_paid_calls:true,valid_blueprints:36,semantic_gate:'GREEN',governance_gate:'GREEN',model_advisory_approval_count:Number(summary.raw_model_advisory_approval_count||0),active_human_required:[]},
            deepseek:{role:'TEMPORARY_COGNITIVE_ACCELERATOR',new_calls_in_recovery:0,source_run_estimated_cost_usd:sourceCost,known_estimated_cost_floor_usd_before_source_run:prior,known_estimated_cost_floor_usd_after_source_run:floor,unreconciled_failed_calls:1,exact_total_cost_known:false,dependency_target:0},
            reuse_map:reuse.summary,
            minimal_core:{status:core.minimal_core_status,green_or_defined_count:core.green_or_defined_count,partial_count:core.partial_count,missing_evidence_count:core.missing_evidence_count,components:core.components},
            human_required:[],
            prod_touched:false,
            trading_touched:false,
            multicompany_router_state:'PARCIAL_FENIX_EXISTING_OTHER_COMPANIES_NOT_BOUND',
            next_action:'Close remaining Minimal Core partials: sovereign World/Memory, live JARVIS JOB-001 E2E acceptance, per-engine Capability Fabric evidence, and Journal-to-runtime binding. Then execute bounded P01/P03/P04/P07 implementation batches.'
          };
          fs.writeFileSync('cerebro/jarvis/mission-001/state.v1.json',JSON.stringify(state,null,2)+'\n');
          console.log(JSON.stringify({status:state.status,known_cost_floor_usd:floor,new_paid_calls:0,reuse_map:state.reuse_map,minimal_core:{status:core.minimal_core_status,partial_count:core.partial_count},human_required:state.human_required}));
          NODE
      - name: Persist recovered governed blueprints and state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CEREBRO JARVIS PREPROD'
          git config user.email 'actions@users.noreply.github.com'
          git add cerebro/jarvis/mission-001/generated-blueprints cerebro/jarvis/mission-001/reuse-map.v1.json cerebro/jarvis/mission-001/state.v1.json
          git commit -m 'chore(jarvis): recover and govern valid V5 blueprints [generated]'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Publish recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-jarvis-001-v5-recovery-${{ github.run_id }}
          path: |
            cerebro/jarvis/mission-001/generated-blueprints/**
            cerebro/jarvis/mission-001/reuse-map.v1.json
            cerebro/jarvis/mission-001/state.v1.json
          if-no-files-found: warn
          retention-days: 7
