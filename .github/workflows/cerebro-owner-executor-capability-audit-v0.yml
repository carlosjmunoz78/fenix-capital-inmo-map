name: CEREBRO Owner Executor Capability Audit V0

on:
  pull_request:
    paths:
      - 'cerebro/runtime/owner-executor-capability-registry.v0.json'
      - 'cerebro/runtime/owner-executor-capability-audit.mjs'
      - 'cerebro/tests/owner-executor-capability-audit-v0.test.mjs'
      - 'cerebro/docs/CEREBRO_OWNER_EXECUTOR_CAPABILITY_AUDIT_V0_2026-10-11.md'
      - '.github/workflows/cerebro-owner-executor-capability-audit-v0.yml'
  workflow_run:
    workflows: ['CEREBRO Continuous Human QA V0']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cerebro-qa-control-state-writer-v0
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  QA_STATE_BRANCH: cerebro/qa-state-v0
  QA_HEALING_PATH: cerebro/runtime/qa-healing-plans.v0.json
  EXECUTOR_AUDIT_PATH: cerebro/runtime/owner-executor-capability-audit.v0.json

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prove executor audit contracts
        run: node --test cerebro/tests/owner-executor-capability-audit-v0.test.mjs cerebro/tests/self-healing.test.mjs

      - name: Load verified SELF-001 plans from dedicated QA state
        run: |
          set -euo pipefail
          mkdir -p artifacts/executor-audit
          git fetch --no-tags origin "+refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH"
          git cat-file -e "refs/remotes/origin/$QA_STATE_BRANCH:$QA_HEALING_PATH"
          git show "refs/remotes/origin/$QA_STATE_BRANCH:$QA_HEALING_PATH" > artifacts/executor-audit/healing.json

      - name: Audit current owner execution authority without inference
        run: |
          node cerebro/runtime/owner-executor-capability-audit.mjs \
            --registry cerebro/runtime/owner-executor-capability-registry.v0.json \
            --healing artifacts/executor-audit/healing.json \
            --out artifacts/executor-audit/audit.json
          jq '{status,owners_total,verified_code_executors,owners_without_verified_executor,owners,decision,next_gate,authority,safety}' artifacts/executor-audit/audit.json

      - name: Enforce fail-closed zero-cost boundary
        run: |
          jq -e '.safety.prod_write==false and .safety.customer_data==false and .safety.trading==false and .safety.paid_fallback==false and .safety.additional_subscription_eur==0 and .authority.code_mutation_authorized==false and .authority.auto_merge==false and .authority.promotion_authorized==false and .authority.prod_authorized==false and .authority.prod_write_authorized==false' artifacts/executor-audit/audit.json >/dev/null

      - name: Persist audit evidence without touching business PROD
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cp artifacts/executor-audit/audit.json /tmp/executor-audit.json
          git config user.name 'cerebro-qa[bot]'
          git config user.email 'cerebro-qa[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --force origin "+refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH"
            git checkout --detach "refs/remotes/origin/$QA_STATE_BRANCH"
            mkdir -p "$(dirname "$EXECUTOR_AUDIT_PATH")"
            cp /tmp/executor-audit.json "$EXECUTOR_AUDIT_PATH"
            git add "$EXECUTOR_AUDIT_PATH"
            if git diff --cached --quiet; then
              echo 'Executor audit evidence already current.'
              exit 0
            fi
            git commit -m 'chore(cerebro): persist owner executor capability audit'
            if git push origin "HEAD:refs/heads/$QA_STATE_BRANCH"; then
              exit 0
            fi
            echo "QA state ref moved concurrently; retrying from latest head ($attempt/5)."
            sleep "$attempt"
          done
          echo 'Unable to persist executor audit after bounded retries.' >&2
          exit 1

      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-owner-executor-capability-audit-v0-${{ github.run_id }}
          path: artifacts/executor-audit/**
          if-no-files-found: warn
          retention-days: 30
