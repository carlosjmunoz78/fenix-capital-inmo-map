name: CEREBRO CAP-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-mkt001-marketing-engine-v0-20260911']
    paths:
      - 'cerebro/marketing/acquisition-engine.mjs'
      - 'cerebro/tests/acquisition-engine.test.mjs'
      - '.github/workflows/cerebro-cap001-preprod.yml'
jobs:
  cap001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/acquisition-engine.test.mjs
