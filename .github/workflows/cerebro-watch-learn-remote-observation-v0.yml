name: CEREBRO Watch Learn Remote Observation V0

on:
  push:
    paths:
      - 'cerebro/runtime/watch-learn-remote-observation-v0.mjs'
      - 'cerebro/registry/watch-learn-remote-observation.v0.json'
      - '.github/workflows/cerebro-watch-learn-remote-observation-v0.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/watch-learn-remote-observation-v0.mjs'
      - 'cerebro/registry/watch-learn-remote-observation.v0.json'
      - '.github/workflows/cerebro-watch-learn-remote-observation-v0.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CEREBRO_WATCH_TARGET_URL: 'https://staging.fenixcapital.es/wp-json/wp/v2/pages?per_page=1&_fields=id,link,slug,title,modified,status'

jobs:
  remote-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned repository dependencies
        run: npm ci --ignore-scripts
      - name: Public source security contracts
        run: node --test cerebro/tests/public-source-adapter-v0.test.mjs
      - name: Resolve deterministic UTC cycle anchor
        id: cycle
        shell: bash
        run: echo "anchor=$(date -u +'%Y-%m-%dT00:00:00Z')" >> "$GITHUB_OUTPUT"
      - name: Run durable authorized remote observation cycle
        run: >-
          node cerebro/runtime/watch-learn-remote-observation-v0.mjs
          --url "$CEREBRO_WATCH_TARGET_URL"
          --cycle-anchor '${{ steps.cycle.outputs.anchor }}'
          --cadence-hours 24
          --out /tmp/watch-learn-remote-observation-report.json
      - name: Validate durable observation evidence and authority
        run: >-
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/watch-learn-remote-observation-report.json','utf8')); const p=require('./cerebro/registry/watch-learn-remote-observation.v0.json'); if(r.status!=='REMOTE_OBSERVATION_DURABLE_CYCLE_GREEN'||r.job_status!=='SUCCEEDED'||!r.next_job||r.observation?.status!=='REMOTE_OBSERVATION_REPLAY_GREEN'||r.observation?.replay_status!=='REPLAY_MATCH'||r.observation?.stable!==true||r.observation?.network_reads!==2) process.exit(1); if(r.external_writes!==0||r.provider_write||r.customer_data_used||r.prod_authorized||r.prod_write_authorized||r.trading_access||r.additional_cost_eur!==0) process.exit(1); if(p.rollout_item!==47||p.environment!=='PREPROD'||p.scheduler?.kind!=='GITHUB_ACTIONS_CRON'||p.scheduler?.cron!=='17 4 * * *'||p.scheduler?.cadence_hours!==24||p.retention?.artifact_days!==30||p.authority.prod_authorized||p.authority.prod_write_authorized||p.authority.provider_write_authorized||p.authority.customer_data_authorized||p.authority.external_dependency_install_authorized||p.authority.trading_access||p.authority.automatic_paid_fallback||p.authority.additional_cost_eur!==0) process.exit(1); console.log('Watch & Learn scheduled durable remote PREPROD observation cycle GREEN');"
      - name: Canonical registry validation
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression
        working-directory: cerebro
        run: npm test
      - name: Upload observation evidence
        uses: actions/upload-artifact@v4
        with:
          name: watch-learn-remote-observation-report
          path: /tmp/watch-learn-remote-observation-report.json
          retention-days: 30
