name: FACT001 Vercel LAB Anonymous SSO Gate
on:
  push:
    branches:
      - cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109
    paths:
      - .github/workflows/fact001-vercel-lab-anonymous-sso.yml
      - cerebro/connectors/universal/services/provider-headless-lab/tests/vercel-anonymous-sso-lab.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'carlosjmunoz78/fenix-capital-inmo-map' && github.ref == 'refs/heads/cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert all four LAB Vercel URLs demand authentication
        run: python3 cerebro/connectors/universal/services/provider-headless-lab/tests/vercel-anonymous-sso-lab.py
