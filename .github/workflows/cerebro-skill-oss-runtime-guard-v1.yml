name: CEREBRO Skill OSS Runtime Guard V1

on:
  push:
    branches:
      - main
      - 'cerebro/safe-handler-context-guard-*'
      - 'cerebro/oss-context-window-guard-*'
      - 'cerebro/oss-runtime-guard-chain-driver-*'
    paths:
      - 'cerebro/skills/skill-ephemeral-oss-inference.mjs'
      - 'cerebro/tests/skill-ephemeral-oss-context-guard.test.mjs'
      - '.github/workflows/cerebro-skill-oss-runtime-guard-v1.yml'
  workflow_dispatch:

concurrency:
  group: cerebro-skill-oss-runtime-guard-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  context-window-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prove local OSS context guard contracts
        run: node --test cerebro/tests/skill-ephemeral-oss-context-guard.test.mjs

      - name: Dispatch governed Chain Driver after main runtime change
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cerebro-skill-chain-driver-v0.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Assert immutable safety boundary
        run: |
          node -e "const r={prod_write:false,customer_data:false,external_skill_code_execution:false,trading:false,paid_fallback:false,additional_cost_eur:0};if(Object.values(r).slice(0,5).some(Boolean)||r.additional_cost_eur!==0)process.exit(1);console.log(JSON.stringify(r))"
