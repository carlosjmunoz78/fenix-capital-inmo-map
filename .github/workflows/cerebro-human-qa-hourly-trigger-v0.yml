name: CEREBRO Human QA Hourly Trigger V0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cerebro-human-qa-hourly-trigger-v0.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: cerebro-human-qa-hourly-trigger-v0
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch-canonical-human-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip hours already covered by canonical 4-hour schedule
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR="$(date -u +%H)"
            if (( 10#$HOUR % 4 == 0 )); then
              echo 'dispatch=false' >> "$GITHUB_OUTPUT"
              echo "Canonical Human QA already runs this UTC hour; avoiding duplicate."
              exit 0
            fi
          fi
          echo 'dispatch=true' >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Continuous Human QA V0
        if: steps.cadence.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -X POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/cerebro-continuous-human-qa-v0.yml/dispatches" \
            -f ref=main
          echo 'Canonical CEREBRO Continuous Human QA V0 dispatched on main.'
