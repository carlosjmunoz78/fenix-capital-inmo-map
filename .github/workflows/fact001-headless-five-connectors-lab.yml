name: FACT001 CEREBRO headless signed orders LAB
on:
  push:
    branches:
      - cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109
    paths:
      - .github/workflows/fact001-headless-five-connectors-lab.yml
      - cerebro/connectors/universal/src/headless.mjs
      - cerebro/connectors/universal/tests/headless.test.mjs
      - cerebro/connectors/universal/src/core.mjs
      - cerebro/connectors/universal/src/catalog.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fact001-headless-five-connectors-lab
  cancel-in-progress: false
jobs:
  test-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify unattended and owner signed command gates in parallel-capable shared runtime
        run: |
          node --test cerebro/connectors/universal/tests/headless.test.mjs
          node --test cerebro/connectors/universal/tests/core.test.mjs
          node --test cerebro/connectors/universal/tests/vercel.test.mjs
      - name: GitHub read through GitHub Actions service token without ChatGPT
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.github.com/repos/carlosjmunoz78/fenix-capital-inmo-map/contents/cerebro/connectors/universal/src/headless.mjs?ref=cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109';
          const jwt=process.env.GITHUB_TOKEN;
          if(typeof jwt!=='string'||jwt.length<20)throw Error('GITHUB_JOB_TOKEN_MISSING');
          const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+jwt,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},redirect:'error',signal:AbortSignal.timeout(12000)});
          if(!r.ok)throw Error('GITHUB_READ_HTTP_'+r.status);
          const d=await r.json();
          if(d.type!=='file'||d.name!=='headless.mjs'||typeof d.sha!=='string')throw Error('GITHUB_READ_UNTRUSTED');
          console.log('FACT001_GITHUB_HEADLESS_INDEPENDENT_OF_CHATGPT=true');
          console.log('FACT001_GITHUB_SCOPED_REPO_READ=PASS');
          console.log('FACT001_GITHUB_API_WRITES=0');
          NODE
      - name: No credentials and no productive operations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='cerebro/connectors/universal/src/headless.mjs';
          const s=fs.readFileSync(p,'utf8');
          if(!s.includes("verifySignedOrder")||!s.includes("owner_signed_command")||!s.includes("registered_automation"))throw Error('IAM_MISSING');
          if(!s.includes("PROD write requires approved promotion contract")||!s.includes("grant({caller"))throw Error('POLICY_MISSING');
          if(s.includes("SUPABASE_SERVICE_ROLE_KEY")||s.includes("process.env.")||s.includes("fetch("))throw Error('UNSAFE_BRIDGE');
          console.log('FACT001_HEADLESS_TESTS_ONLY=true');
          console.log('FACT001_HEADLESS_PROD_WRITES=0');
          console.log('FACT001_HEADLESS_NEW_PROVIDER_RESOURCES=0');
          NODE
