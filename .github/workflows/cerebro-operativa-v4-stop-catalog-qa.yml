name: Operativa V4 · STOP voice and full master engine catalogue · LAB
on:
  push:
    branches:
      - cerebro/operativa-stop-and-engine-catalog-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Engine registry integrity and voice interruption contracts
        run: node --test tests/cerebro-operativa-v4-stop-catalog.test.mjs tests/cerebro-operativa-v3-live-bridge-contract.test.mjs tests/cerebro-operativa-voice-rate.test.mjs
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Synthetic owner session, catalogue, stop button and spoken 'para'
        env:
          VITE_FENIX_ENV: test
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: operativa-e2e-not-a-real-key
        run: npx playwright test tests/cerebro-operativa-v3-live-bridge-e2e.spec.ts --project=desktop-chromium --reporter=line
