name: CEREBRO Skill Creator Behavioral LAB

on:
  push:
    branches:
      - cerebro-skill-creator-static-lab-20261007
    paths:
      - 'cerebro/skills/.skill-creator-behavioral-lab-trigger.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CEREBRO_BEHAVIORAL_EXECUTION_ENABLED: 'true'
  CEREBRO_ALLOW_PROD_DATA: 'false'
  CEREBRO_ALLOW_CUSTOMER_DATA: 'false'
  CEREBRO_GEMINI_MODEL: gemini-3.5-flash-lite
  CEREBRO_SKILL_CREATOR_PROVIDER_TIMEOUT_MS: '45000'

jobs:
  synthetic-skill-creator-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate exact one-shot Skill Creator authorization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('cerebro/skills/.skill-creator-behavioral-lab-trigger.json','utf8'));
          const ok=t.confirm==='RUN_SYNTHETIC_LAB'&&t.target_candidate==='skill-creator'&&t.target_candidate_id==='lobehub-skills:950cf07380d1daa6de69'&&t.expected_upstream_full_name==='openclaw/openclaw'&&t.expected_manifest_path==='skills/skill-creator/SKILL.md'&&t.expected_upstream_head_commit==='dc26366b07e7d08395b83de0d767150ffcb6ad50'&&t.scope==='LAB_SYNTHETIC_ONLY'&&t.max_calls===6&&t.max_retries_per_call===0&&t.paid_fallback===false&&t.allow_prod_data===false&&t.allow_customer_data===false&&t.allow_external_skill_code_execution===false&&t.allow_prod_write===false&&t.allow_trading_access===false&&typeof t.one_shot_id==='string'&&t.one_shot_id.length>=16;
          if(!ok){console.error('Invalid skill-creator one-shot LAB trigger');process.exit(1)}
          console.log(JSON.stringify({trigger:'AUTHORIZED_ONE_SHOT_SKILL_CREATOR_BRANCH_ONLY',one_shot_id:t.one_shot_id,max_calls:6,max_retries_per_call:0,paid_fallback:false,prod_data:false,customer_data:false,external_skill_code:false,prod_write:false,trading:false}));
          NODE

      - name: Run focused static and wrapper tests
        run: node --test cerebro/tests/skill-selected-candidate-static-lab.test.mjs cerebro/tests/skill-creator-wrapper.test.mjs

      - name: Re-run exact-commit static LAB on inert SKILL.md text
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/skills/skill-selected-candidate-static-lab.mjs --profile cerebro/skills/skill-creator-static-lab.v0.json --output artifacts/cerebro-skill-creator-static-lab.json

      - name: Build focused Skill Creator OLD vs NEW package
        run: node cerebro/skills/skill-creator-old-vs-new.mjs --static-lab artifacts/cerebro-skill-creator-static-lab.json --profile cerebro/skills/skill-creator-static-lab.v0.json --output artifacts/cerebro-skill-creator-old-vs-new.json

      - name: Verify exact static target and wrapper package
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-static-lab.json','utf8'));
          const o=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-old-vs-new.json','utf8'));
          const p=o.packages?.[0];
          const ok=s.status==='STATIC_LAB_GREEN_FOR_NORMALIZED_WRAPPER_DESIGN'&&s.provenance_exact===true&&s.coverage_score===100&&s.external_code_executed===false&&o.status==='READY_FOR_SYNTHETIC_BEHAVIORAL_GATE'&&o.packages_total===1&&p?.candidate_id==='lobehub-skills:950cf07380d1daa6de69'&&p?.candidate?.wrapper_id==='skillwrap:cerebro-skill-creator-v0.1.0'&&(p?.fixtures??[]).length===3&&o.prod_authorized===false;
          if(!ok){console.error('Skill Creator static/OLD-vs-NEW evidence not exact');process.exit(1)}
          console.log(JSON.stringify({candidate_id:p.candidate_id,static_status:s.status,coverage_score:s.coverage_score,fixtures:3,planned_calls:6,external_skill_code:false,prod_authorized:false}));
          NODE

      - name: Bind current Gemini free-tier readiness without exposing secret value
        env:
          CEREBRO_GEMINI_KEY_PRESENT: ${{ secrets.CEREBRO_GEMINI_API_KEY != '' }}
          CEREBRO_GEMINI_POLICY_GREEN: 'false'
          CEREBRO_GEMINI_FREE_QUOTA_GUARD: 'true'
        run: node cerebro/skills/skill-provider-binding-from-env.mjs --providers cerebro/skills/zero-cost-provider-evidence.v0.json --output artifacts/cerebro-skill-creator-provider-binding.json

      - name: Select verified Gemini zero-cost synthetic route
        run: node cerebro/skills/skill-zero-cost-route-audit.mjs --providers artifacts/cerebro-skill-creator-provider-binding.json --oldnew artifacts/cerebro-skill-creator-old-vs-new.json --preferred-provider google-gemini-api-free --output artifacts/cerebro-skill-creator-route.json

      - name: Build hard six-call quota with zero retries and no paid fallback
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {buildFreeQuotaPlan} from './cerebro/skills/skill-free-quota-guard.mjs';
          const oldnew=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-old-vs-new.json','utf8'));
          const route=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-route.json','utf8'));
          const report=buildFreeQuotaPlan(oldnew,route,{limits:{max_packages:1,max_fixtures_per_package:3,max_model_calls:6,max_retries_per_call:0,paid_fallback:false,prod_data:false,customer_data:false}});
          if(!report.executable||report.planned_calls.total!==6||report.limits.max_model_calls!==6||report.limits.max_retries_per_call!==0){console.error('Hard six-call skill-creator quota not established');process.exit(1)}
          fs.writeFileSync('artifacts/cerebro-skill-creator-quota.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({provider_id:report.provider_id,planned_calls:report.planned_calls,max_model_calls:6,max_retries_per_call:0,paid_fallback:false}));
          NODE

      - name: Open behavioral gate for synthetic Skill Creator package only
        run: node cerebro/skills/skill-behavioral-execution-gate.mjs --oldnew artifacts/cerebro-skill-creator-old-vs-new.json --route artifacts/cerebro-skill-creator-route.json --quota artifacts/cerebro-skill-creator-quota.json --output artifacts/cerebro-skill-creator-behavioral-gate.json

      - name: Execute exactly six synthetic baseline-vs-wrapper calls on verified Gemini model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CEREBRO_GEMINI_API_KEY: ${{ secrets.CEREBRO_GEMINI_API_KEY }}
          CEREBRO_GEMINI_MODEL: gemini-3.5-flash-lite
          CEREBRO_SKILL_CREATOR_PROVIDER_TIMEOUT_MS: '45000'
        run: node cerebro/skills/skill-creator-behavioral-proxy-runner.mjs --oldnew artifacts/cerebro-skill-creator-old-vs-new.json --gate artifacts/cerebro-skill-creator-behavioral-gate.json --quota artifacts/cerebro-skill-creator-quota.json --route artifacts/cerebro-skill-creator-route.json --output artifacts/cerebro-skill-creator-behavioral-proxy.json

      - name: Verify exact call count model wrapper and no unsafe execution
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-behavioral-proxy.json','utf8'));
          const arms=(p.results??[]).flatMap(r=>(r.fixture_results??[]).flatMap(f=>f.arms??[]));
          const c=arms.filter(a=>a.arm==='CANDIDATE_SKILL_PROXY');
          const b=arms.filter(a=>a.arm==='BASELINE_PROXY');
          const ok=p.status==='PROXY_COMPLETE'&&p.calls_executed===6&&p.provider_id==='google-gemini-api-free'&&arms.length===6&&c.length===3&&b.length===3&&arms.every(a=>a.model==='gemini-3.5-flash-lite')&&c.every(a=>a.wrapper_applied===true&&a.wrapper_id==='skillwrap:cerebro-skill-creator-v0.1.0'&&a.wrapper_external_skill_code_execution===false&&a.wrapper_prod_authorized===false)&&b.every(a=>a.wrapper_applied===false)&&p.synthetic_only===true&&p.external_skill_code_executed===false&&p.prod_authorized===false;
          if(!ok){console.error('Skill Creator behavioral invariant failed');process.exit(1)}
          console.log(JSON.stringify({status:p.status,calls_executed:6,provider_id:p.provider_id,model:'gemini-3.5-flash-lite',candidate_wrapper_applied:3,baseline_wrapper_applied:0,synthetic_only:true,external_skill_code_executed:false,prod_authorized:false}));
          NODE

      - name: Run fixed-threshold deterministic independent judge
        run: node cerebro/skills/skill-independent-judge.mjs --behavioral-results artifacts/cerebro-skill-creator-behavioral-proxy.json --output artifacts/cerebro-skill-creator-independent-judge.json

      - name: Build disabled wrapper plan for rollback proof
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const profile=JSON.parse(fs.readFileSync('cerebro/skills/skill-creator-static-lab.v0.json','utf8'));
          const plan={
            wrapper_id:'skillwrap:cerebro-skill-creator-v0.1.0',candidate_id:profile.candidate_id,enabled:false,execution_authorized:false,install_authorized:false,prod_authorized:false,
            contract:{side_effects:'DENY_BY_DEFAULT'},
            permissions:{network:false,filesystem_read:false,filesystem_write:false,credentials:false,external_actions:false,prod_write:false,trading_access:false},
            quality:{rollback_required:true},
            provenance:{upstream_head_commit:profile.upstream_head_commit,manifest_sha256:profile.manifest_sha256}
          };
          fs.writeFileSync('artifacts/cerebro-skill-creator-wrapper-plan.json',JSON.stringify({plans:[plan]},null,2)+'\n');
          NODE

      - name: Prove focused wrapper rollback and rebuild
        run: node cerebro/skills/skill-rollback-proof.mjs --wrappers artifacts/cerebro-skill-creator-wrapper-plan.json --output artifacts/cerebro-skill-creator-rollback-proof.json

      - name: Download frozen main discovery license and RSI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/discovery
          gh run download 37687625962 --repo "$GITHUB_REPOSITORY" --name cerebro-skill-discovery-37687625962 --dir artifacts/discovery
          test -f artifacts/discovery/cerebro-skill-license-evidence.json
          test -f artifacts/discovery/cerebro-skill-rsi-shadow.json

      - name: Build generic tribunal-compatible static evidence without mutating raw result
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-static-lab.json','utf8'));
          if(s.status!=='STATIC_LAB_GREEN_FOR_NORMALIZED_WRAPPER_DESIGN'||s.provenance_exact!==true||(s.forbidden_hits??[]).length!==0||!(s.required_safeguards??[]).every(x=>x.hit===true)) process.exit(1);
          const compat={results:[{candidate_id:s.candidate_id,declared_name:s.declared_name,domain:'agent-ai-orchestration',status:'STATIC_LAB_GREEN_FOR_BEHAVIORAL_EVAL',policy_alignment_score:100,hard_blocks:[],coverage_score:s.coverage_score}]};
          fs.writeFileSync('artifacts/cerebro-skill-creator-static-compat.json',JSON.stringify(compat,null,2)+'\n');
          NODE

      - name: Run evidence-only tribunal
        run: node cerebro/skills/skill-tribunal.mjs --static-lab artifacts/cerebro-skill-creator-static-compat.json --licenses artifacts/discovery/cerebro-skill-license-evidence.json --behavioral-results artifacts/cerebro-skill-creator-behavioral-proxy.json --independent-judge artifacts/cerebro-skill-creator-independent-judge.json --rollback artifacts/cerebro-skill-creator-rollback-proof.json --route artifacts/cerebro-skill-creator-route.json --rsi-shadow artifacts/discovery/cerebro-skill-rsi-shadow.json --output artifacts/cerebro-skill-creator-tribunal.json

      - name: Assess PREPROD review readiness without promotion
        run: node cerebro/skills/skill-promotion-readiness.mjs --static-lab artifacts/cerebro-skill-creator-static-compat.json --oldnew artifacts/cerebro-skill-creator-old-vs-new.json --route artifacts/cerebro-skill-creator-route.json --quota artifacts/cerebro-skill-creator-quota.json --behavioral-gate artifacts/cerebro-skill-creator-behavioral-gate.json --rsi-shadow artifacts/discovery/cerebro-skill-rsi-shadow.json --behavioral-results artifacts/cerebro-skill-creator-behavioral-proxy.json --independent-judge artifacts/cerebro-skill-creator-independent-judge.json --tribunal artifacts/cerebro-skill-creator-tribunal.json --rollback artifacts/cerebro-skill-creator-rollback-proof.json --output artifacts/cerebro-skill-creator-promotion-readiness.json

      - name: Verify no unsafe promotion and exact HIGH_RISK next gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-behavioral-proxy.json','utf8'));
          const j=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-independent-judge.json','utf8'));
          const r=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-rollback-proof.json','utf8'));
          const t=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-tribunal.json','utf8'));
          const pr=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-creator-promotion-readiness.json','utf8'));
          const ok=p.status==='PROXY_COMPLETE'&&p.external_skill_code_executed===false&&p.prod_authorized===false&&j.decision==='GREEN_FOR_TRIBUNAL_REVIEW'&&j.green===true&&r.status==='GREEN_ROLLBACK_REBUILD_PROOF'&&r.ready===true&&t.decision==='GREEN'&&t.green===true&&t.prod_authorized===false&&pr.status==='READY_FOR_PREPROD_PROMOTION_REVIEW'&&pr.ready===true&&pr.human_required==='HIGH_RISK'&&pr.merge_authorized===false&&pr.prod_authorized===false&&pr.autonomous_promotion_authorized===false;
          if(!ok){console.error('Skill Creator final LAB gate not GREEN/fail-closed');process.exit(1)}
          console.log(JSON.stringify({safe:true,proxy_status:p.status,calls_executed:p.calls_executed,judge_decision:j.decision,rollback_status:r.status,tribunal_decision:t.decision,promotion_readiness:pr.status,human_required:pr.human_required,prod_authorized:false,auto_promotion:false}));
          NODE

      - name: Upload Skill Creator synthetic behavioral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-creator-behavioral-lab-${{ github.run_id }}
          path: |
            artifacts/cerebro-skill-creator-static-lab.json
            artifacts/cerebro-skill-creator-old-vs-new.json
            artifacts/cerebro-skill-creator-provider-binding.json
            artifacts/cerebro-skill-creator-route.json
            artifacts/cerebro-skill-creator-quota.json
            artifacts/cerebro-skill-creator-behavioral-gate.json
            artifacts/cerebro-skill-creator-behavioral-proxy.json
            artifacts/cerebro-skill-creator-independent-judge.json
            artifacts/cerebro-skill-creator-wrapper-plan.json
            artifacts/cerebro-skill-creator-rollback-proof.json
            artifacts/cerebro-skill-creator-static-compat.json
            artifacts/cerebro-skill-creator-tribunal.json
            artifacts/cerebro-skill-creator-promotion-readiness.json
          if-no-files-found: warn
          retention-days: 30
