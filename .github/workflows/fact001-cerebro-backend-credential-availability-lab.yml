name: FACT-001 CEREBRO backend secure credential broker availability LAB
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths: [.github/workflows/fact001-cerebro-backend-credential-availability-lab.yml]
permissions:
  contents: read
jobs:
  read-only-secret-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      SUPABASE_MANAGEMENT_API_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_API_TOKEN }}
      CEREBRO_SUPABASE_ACCESS_TOKEN: ${{ secrets.CEREBRO_SUPABASE_ACCESS_TOKEN }}
      CEREBRO_OWNER_EMAIL: ${{ secrets.CEREBRO_OWNER_EMAIL }}
      CEREBRO_E2E_USER_JWT: ${{ secrets.CEREBRO_E2E_USER_JWT }}
      CEREBRO_GITHUB_TOKEN: ${{ secrets.CEREBRO_GITHUB_TOKEN }}
    steps:
      - name: Check only secure broker existence, never log values
        run: |
          node --input-type=module <<'NODE'
          const names=['PROD_SUPABASE_SERVICE_ROLE_KEY','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_ACCESS_TOKEN','SUPABASE_PAT','SUPABASE_MANAGEMENT_API_TOKEN','CEREBRO_SUPABASE_ACCESS_TOKEN','CEREBRO_OWNER_EMAIL','CEREBRO_E2E_USER_JWT','CEREBRO_GITHUB_TOKEN'];
          for(const key of names) console.log('FACT001_SECRET_'+key+'_PRESENT='+Boolean(process.env[key]));
          const candidates=['SUPABASE_ACCESS_TOKEN','SUPABASE_PAT','SUPABASE_MANAGEMENT_API_TOKEN','CEREBRO_SUPABASE_ACCESS_TOKEN'];
          const token=candidates.map(x=>process.env[x]).find(Boolean);
          if(token){
            try{
              const r=await fetch('https://api.supabase.com/v1/projects/cluhljgonannaafpmblx',{headers:{Authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(12000)});
              console.log('FACT001_SUPABASE_MGMT_PROJECT_GET_HTTP='+r.status);
            }catch{console.log('FACT001_SUPABASE_MGMT_PROJECT_GET_HTTP=NETWORK');}
          }else console.log('FACT001_SUPABASE_MGMT_PROJECT_GET_HTTP=NO_TOKEN');
          console.log('FACT001_SECRET_VALUES_LOGGED=0');
          console.log('FACT001_MUTATIONS=0');
          NODE