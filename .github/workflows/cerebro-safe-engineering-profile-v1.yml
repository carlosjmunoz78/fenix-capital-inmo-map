name: CEREBRO Safe Engineering Profile V1

on:
  pull_request:
    paths:
      - 'cerebro/runtime/cerebro-safe-engineering-profile-v1.mjs'
      - 'cerebro/runtime/skill-capability-evolution.mjs'
      - 'cerebro/tests/cerebro-safe-engineering-profile-v1.test.mjs'
      - 'cerebro/tests/skill-capability-evolution-v0.test.mjs'
      - 'cerebro/skills/SAFE_ENGINEERING_PROFILE_ROLLOUT_V1.md'
      - '.github/workflows/cerebro-safe-engineering-profile-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  focused-contract:
    name: safe-engineering-focused-contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/cerebro-safe-engineering-profile-v1.test.mjs

  auto001-regression:
    name: safe-engineering-auto001-regression
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/auto001-preprod-patch-executor-v0.test.mjs

  skill-evolution-regression:
    name: safe-engineering-skill-evolution-regression
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/skill-capability-evolution-v0.test.mjs

  evaluation-tribunal-regression:
    name: safe-engineering-evaluation-tribunal-regression
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/evaluation-tribunal.test.mjs

  full-cerebro-regression:
    name: safe-engineering-full-cerebro-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs

  main-baseline-full-cerebro:
    name: safe-engineering-main-baseline-full-cerebro
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs

  discover-tests:
    name: safe-engineering-discover-tests
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        run: |
          tests=$(find cerebro/tests -maxdepth 1 -type f -name '*.test.mjs' -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')
          count=$(jq 'length' <<< "$tests")
          echo "Discovered $count CEREBRO test files"
          if [ "$count" -eq 0 ] || [ "$count" -gt 240 ]; then
            echo "Unsafe diagnostic matrix size: $count" >&2
            exit 1
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  per-file-diagnostic:
    name: cerebro-test · ${{ matrix.test }}
    needs: discover-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        test: ${{ fromJson(needs.discover-tests.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "cerebro/tests/${{ matrix.test }}"
