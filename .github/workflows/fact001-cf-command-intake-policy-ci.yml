name: FACT001 Cloudflare signed command intake policy CI LAB
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase/cf-command-intake-lab/**
      - .github/workflows/fact001-cf-command-intake-policy-ci.yml
permissions:
  contents: read
jobs:
  fact001-cf-intake-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: node --test cerebro/connectors/universal/supabase/cf-command-intake-lab/tests/*.test.mjs
      - name: Deny PROD, dynamic SQL and signer bypass
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='cerebro/connectors/universal/supabase/cf-command-intake-lab/';
          const policy=fs.readFileSync(root+'policy.mjs','utf8'),index=fs.readFileSync(root+'index.ts','utf8');
          if(!policy.includes("payload.workflow_ref!==WORKFLOW_REF")||!policy.includes("payload.actor!=='carlosjmunoz78'")||!policy.includes("payload.event_name!=='push'")||!policy.includes("payload.aud!==OIDC_AUDIENCE"))throw Error('SIGNED_IDENTITY_WEAK');
          if(!index.includes('verifyGitHubOidc(auth(req))')||!index.includes('ON CONFLICT(idempotency_key) DO NOTHING')||!index.includes('params})'))throw Error('IDEMPOTENT_BINDING_MISSING');
          if(index.includes("method:'DELETE'")||index.includes('/workers/scripts')||index.includes('console.log('))throw Error('PROVIDER_MUTATION_OR_SECRET_LOGGING');
          console.log('FACT001_CF_INTAKE_HARDENING=PASS');
          NODE
