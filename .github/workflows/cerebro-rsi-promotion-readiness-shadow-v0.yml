name: CEREBRO RSI Promotion Readiness Shadow V0

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/**'
      - 'src/AnaChatBlock.tsx'
      - 'src/CerebroConsoleBlock.tsx'
      - 'src/OperationalShellGate.tsx'
      - 'src/cerebroVoice.ts'
      - 'tests/voice-ui-ana-console.spec.ts'
      - '.github/workflows/cerebro-human-intelligence-promotion-readiness-v1.yml'
      - '.github/workflows/cerebro-owned-voice-preprod.yml'
      - '.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-rsi-promotion-readiness-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  factory-preprod-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Validate canonical Factory and Registry
        working-directory: cerebro
        run: |
          npm run validate
          npm test
          npm run generate -- --out /tmp/cerebro-generated
      - name: Assert canonical engine count and no repo mutation
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -e "const x=require('./cerebro/registry/engine-registry.seed.json'); console.log(Array.isArray(x)?x.length:(x.engines?.length ?? x.engine_count ?? x.count ?? ''))")"
          generated="$(node -e "const x=require('/tmp/cerebro-generated/skeleton-index.json'); console.log(x.engine_count)")"
          test -n "$expected"; test "$generated" = "$expected"; git diff --exit-code

  app-surface-isolation-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FENIX_ENV: preprod
      VITE_SUPABASE_URL: https://hnqlnvakzaywtafeiybt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uvtiidkBBkFRt2K34so27g_JpCbMUZw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Assert exact bounded VOICE-001 UI surface
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git fetch origin "$PR_BASE_SHA" --depth=1
          changed="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
          allowed='^(\.github/workflows/cerebro-(human-intelligence-promotion-readiness-v1|owned-voice-preprod|rsi-promotion-readiness-shadow-v0)\.yml$|cerebro/voice/(VOICE_UI_V1_RUNBOOK\.md|channel-registry\.v1\.json)$|src/(AnaChatBlock|CerebroConsoleBlock|OperationalShellGate)\.tsx$|tests/voice-ui-ana-console\.spec\.ts$)'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then echo 'RSI scope invalidated by unexpected surface:' >&2; printf '%s\n' "$bad" >&2; exit 1; fi
          if printf '%s\n' "$changed" | grep -q '^supabase/'; then echo 'VOICE-001 UI PR must not mutate Supabase/backend.' >&2; exit 1; fi
          grep -F 'voice_is_transport_not_authority' cerebro/voice/channel-registry.v1.json
          grep -F '"audio_persistence": false' cerebro/voice/channel-registry.v1.json
          grep -F '"learning_inherited": true' cerebro/voice/channel-registry.v1.json
          grep -F 'fenix_prod_chat_send_user' src/AnaChatBlock.tsx
          grep -F "from './cerebroVoice'" src/AnaChatBlock.tsx
          grep -F 'voiceNeedsClarification' src/AnaChatBlock.tsx
          grep -F 'cerebro-console-gateway-v0' src/CerebroConsoleBlock.tsx
          grep -F "actor_code==='CARLOS-ADMIN'" src/CerebroConsoleBlock.tsx
          grep -F "from './cerebroVoice'" src/CerebroConsoleBlock.tsx
          grep -F 'voiceNeedsManualConfirmation' src/CerebroConsoleBlock.tsx
          ! grep -R -F 'SUPABASE_SERVICE_ROLE_KEY' src/AnaChatBlock.tsx src/CerebroConsoleBlock.tsx src/cerebroVoice.ts
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Build exact head
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove Ana and Console voice reuse exact text contracts
        run: npx playwright test tests/voice-ui-ana-console.spec.ts --project=desktop-chromium
      - name: PREPROD Ana CORS smoke
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 -X OPTIONS -H 'Origin: https://carlosjmunoz78.github.io' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization,apikey' 'https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/fenix-ana-api-test/capabilities')"
          test "$status" = "204"; grep -qi '^access-control-allow-origin:' "$headers"
      - name: Archive exact-head build evidence
        uses: actions/upload-artifact@v4
        with:
          name: rsi-voice-ui-readiness-${{ env.EXACT_HEAD }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  tribunal-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Independent evaluation promotion and rollback contracts
        run: |
          node --test \
            cerebro/tests/evaluation-tribunal.test.mjs \
            cerebro/tests/experiment-pipeline.test.mjs \
            cerebro/tests/promotion-pipeline.test.mjs \
            cerebro/tests/rsi-recovery-e2e.test.mjs \
            cerebro/tests/bounded-recovery-supervisor.test.mjs \
            cerebro/tests/universal-learning-ingress.test.mjs \
            cerebro/tests/multichannel-conversation-old-vs-new-v1.test.mjs
      - name: Assert no authority or learning bypass
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/AnaVoiceQueryBlock.tsx
          test ! -e src/VoiceChannelAdapter.ts
          grep -F 'fenix_prod_chat_send_user' src/AnaChatBlock.tsx
          grep -F 'cerebro-console-gateway-v0' src/CerebroConsoleBlock.tsx
          grep -F '"human_required_inherited": true' cerebro/voice/channel-registry.v1.json
          grep -F '"learning_inherited": true' cerebro/voice/channel-registry.v1.json
          grep -F 'LRN-001' cerebro/voice/VOICE_UI_V1_RUNBOOK.md
          ! grep -R -F 'SUPABASE_SERVICE_ROLE_KEY' src/AnaChatBlock.tsx src/CerebroConsoleBlock.tsx src/cerebroVoice.ts
      - name: Mark bounded shadow result
        run: |
          echo 'RSI shadow preserves Factory, Tribunal, rollback and governed LRN-001 while allowing only the exact VOICE-001 UI surface.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No backend, Supabase authority, Trading or stable gateway mutation is permitted by this PR.' >> "$GITHUB_STEP_SUMMARY"
