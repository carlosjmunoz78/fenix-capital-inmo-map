name: CEREBRO RSI Promotion Readiness Shadow V1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cerebro/**'
      - 'src/CerebroBrowserConsole.tsx'
      - 'src/cerebroBrowserInteractive.ts'
      - 'supabase/functions/cerebro-human-old-actor-preprod-v0/**'
      - 'supabase/functions/cerebro-human-new-actor-preprod-v1/**'
      - 'supabase/functions/cerebro-human-route-control-preprod-v1/**'
      - 'supabase/functions/cerebro-console-gateway-human-v1-canary/**'
      - 'supabase/functions/cerebro-console-human-router-zero-v1/**'
      - 'supabase/functions/_shared/cerebro-conversation-policy-v1.ts'
      - 'supabase/functions/_shared/cerebro-channel-access-policy-v1.ts'
      - 'supabase/functions/cerebro-telegram-gateway-v0/**'
      - 'supabase/functions/cerebro-telegram-voice-v1/**'
      - 'supabase/functions/cerebro-browser-dispatch-v1/index.ts'
      - 'supabase/functions/cerebro-browser-dispatch-v2/**'
      - 'supabase/functions/cerebro-browser-dispatch-v2-prod/**'
      - 'supabase/functions/cerebro-browser-interactive-v3/**'
      - 'supabase/functions/cerebro-creative-dispatch-v1/**'
      - 'supabase/migrations/20261012132000_cerebro_human_route_control_preprod_v1.sql'
      - 'supabase/migrations/20261013010500_cerebro_multichannel_ana_overlay_v1.sql'
      - 'supabase/migrations/20261013042000_cerebro_channel_access_profiles_v1.sql'
      - 'supabase/migrations/20261013075000_cerebro_company_registry_preprod_persistence_v1.sql'
      - 'supabase/migrations/20261013083000_cerebro_company_onboarding_preprod_persistence_v1.sql'
      - 'supabase/migrations/20261013093000_cerebro_scan001_preprod_persistence_v1.sql'
      - 'supabase/migrations/20261013101500_cerebro_post_scan_parallel_preprod_v1.sql'
      - 'supabase/migrations/20261023093000_cerebro_browser_dispatch_v1.sql'
      - 'supabase/migrations/20261023093100_cerebro_browser_credential_broker_v1.sql'
      - 'supabase/migrations/20261023180000_cerebro_browser_orchestrator_v2.sql'
      - 'supabase/migrations/20261023194500_cerebro_browser_credential_broker_v2.sql'
      - 'supabase/migrations/20261023195500_cerebro_browser_credential_broker_v2_scope_fix.sql'
      - 'supabase/migrations/20261023201500_cerebro_browser_barrier_v2_table.sql'
      - 'supabase/migrations/20261023201600_cerebro_browser_barrier_v2_acl.sql'
      - 'supabase/migrations/20261023201700_cerebro_browser_barrier_v2_functions.sql'
      - 'supabase/migrations/20261023201800_cerebro_browser_lease_benchmark_v2.sql'
      - 'supabase/migrations/20261024103000_cerebro_creative_job_v1.sql'
      - 'supabase/migrations/20261024103100_cerebro_creative_job_v1_scope_hardening.sql'
      - 'supabase/migrations/20261024103200_cerebro_creative_job_v1_explicit_deny_policy.sql'
      - 'supabase/migrations/20261024230000_cerebro_browser_phase3_interactive_v0.sql'
      - 'supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0.rollback.sql'
      - '.github/workflows/cerebro-rsi-*.yml'
      - '.github/workflows/cerebro-hygiene-audit-v0.yml'
      - '.github/workflows/cerebro-human-intelligence-*.yml'
      - '.github/workflows/cerebro-multichannel-conversation-unification-v1.yml'
      - '.github/workflows/cerebro-browser-*.yml'
      - '.github/workflows/cerebro-creative-job-runner-v1.yml'
      - '.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-rsi-promotion-readiness-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  factory-preprod-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Install pinned root runtime dependencies for cross-package contract imports
        run: npm ci --ignore-scripts
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Test complete CEREBRO contracts
        working-directory: cerebro
        run: npm test
      - name: Generate all engine skeletons
        working-directory: cerebro
        run: npm run generate -- --out /tmp/cerebro-generated
      - name: Assert canonical engine count and no repo mutation
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_COUNT="$(node -e "const x=require('./cerebro/registry/engine-registry.seed.json'); console.log(Array.isArray(x)?x.length:(x.engines?.length ?? x.engine_count ?? x.count ?? ''))")"
          GENERATED_COUNT="$(node -e "const x=require('/tmp/cerebro-generated/skeleton-index.json'); console.log(x.engine_count)")"
          test -n "$EXPECTED_COUNT"
          test "$GENERATED_COUNT" = "$EXPECTED_COUNT"
          git diff --exit-code

  app-surface-isolation-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_FENIX_ENV: preprod
      VITE_SUPABASE_URL: https://hnqlnvakzaywtafeiybt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uvtiidkBBkFRt2K34so27g_JpCbMUZw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Assert exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Assert zero unrelated App drift and exact governed Supabase surface
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA:-}" ]; then
            git fetch origin "$PR_BASE_SHA" --depth=1
            base="$PR_BASE_SHA"
          else
            git fetch origin main --depth=1
            base="$(git rev-parse FETCH_HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          protected='^(src/|tests/|public/|scripts/|index\.html$|package(-lock)?\.json$|playwright\.config\.(ts|js)$|vite\.config\.(ts|js)$|tsconfig[^/]*\.json$|\.env|\.github/workflows/(preprod-build|app-restoration-build|prod-[^/]+)\.yml$)'
          phase3_app='^(src/CerebroBrowserConsole\.tsx|src/cerebroBrowserInteractive\.ts)$'
          unexpected_app="$(printf '%s\n' "$changed" | grep -E "$protected" | grep -Ev "$phase3_app" || true)"
          if [ -n "$unexpected_app" ]; then
            echo 'RSI bounded scope invalidated: unrelated App/UI/test/build/deploy surface changed.' >&2
            printf '%s\n' "$unexpected_app" >&2
            exit 1
          fi
          phase3_changed="$(printf '%s\n' "$changed" | grep -E "$phase3_app" || true)"
          if [ -n "$phase3_changed" ]; then
            required_phase3='cerebro/runtime/browser-interactive-session-v3.mjs cerebro/runtime/browser-job-runner-v2.mjs supabase/functions/cerebro-browser-interactive-v3/index.ts supabase/migrations/20261024230000_cerebro_browser_phase3_interactive_v0.sql supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0.rollback.sql'
            for file in $required_phase3; do
              test -f "$file" || { echo "Phase 3 companion missing: $file" >&2; exit 1; }
            done
          fi
          allowed='^(supabase/functions/(cerebro-human-old-actor-preprod-v0|cerebro-human-new-actor-preprod-v1|cerebro-human-route-control-preprod-v1|cerebro-console-gateway-human-v1-canary|cerebro-console-human-router-zero-v1|cerebro-telegram-gateway-v0|cerebro-telegram-voice-v1|cerebro-browser-dispatch-v2|cerebro-browser-dispatch-v2-prod|cerebro-browser-interactive-v3|cerebro-creative-dispatch-v1)/|supabase/functions/cerebro-browser-dispatch-v1/index\.ts$|supabase/functions/_shared/cerebro-(conversation|channel-access)-policy-v1\.ts$|supabase/migrations/(20261012132000_cerebro_human_route_control_preprod_v1|20261013010500_cerebro_multichannel_ana_overlay_v1|20261013042000_cerebro_channel_access_profiles_v1|20261013075000_cerebro_company_registry_preprod_persistence_v1|20261013083000_cerebro_company_onboarding_preprod_persistence_v1|20261013093000_cerebro_scan001_preprod_persistence_v1|20261013101500_cerebro_post_scan_parallel_preprod_v1|20261023093000_cerebro_browser_dispatch_v1|20261023093100_cerebro_browser_credential_broker_v1|20261023180000_cerebro_browser_orchestrator_v2|20261023194500_cerebro_browser_credential_broker_v2|20261023195500_cerebro_browser_credential_broker_v2_scope_fix|20261023201500_cerebro_browser_barrier_v2_table|20261023201600_cerebro_browser_barrier_v2_acl|20261023201700_cerebro_browser_barrier_v2_functions|20261023201800_cerebro_browser_lease_benchmark_v2|20261024103000_cerebro_creative_job_v1|20261024103100_cerebro_creative_job_v1_scope_hardening|20261024103200_cerebro_creative_job_v1_explicit_deny_policy|20261024230000_cerebro_browser_phase3_interactive_v0)\.sql$|supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0\.rollback\.sql$)'
          unexpected_supabase="$(printf '%s\n' "$changed" | grep '^supabase/' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected_supabase" ]; then
            echo 'Unapproved Supabase surface changed:' >&2
            printf '%s\n' "$unexpected_supabase" >&2
            exit 1
          fi
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Build exact head
        run: npm run build
      - name: PREPROD Ana CORS smoke
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
            -X OPTIONS \
            -H 'Origin: https://carlosjmunoz78.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,apikey' \
            'https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/fenix-ana-api-test/capabilities')"
          test "$status" = "204"
          grep -qi '^access-control-allow-origin:' "$headers"

  tribunal-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Independent evaluation and promotion safety contracts
        run: >-
          node --test
          cerebro/tests/evaluation-tribunal.test.mjs
          cerebro/tests/experiment-pipeline.test.mjs
          cerebro/tests/promotion-pipeline.test.mjs
          cerebro/tests/rsi-recovery-e2e.test.mjs
          cerebro/tests/bounded-recovery-supervisor.test.mjs
      - name: Assert bounded authority surface
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA:-}" ]; then
            git fetch origin "$PR_BASE_SHA" --depth=1
            base="$PR_BASE_SHA"
          else
            git fetch origin main --depth=1
            base="$(git rev-parse FETCH_HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          protected='^(src/|tests/|public/|scripts/|index\.html$|package(-lock)?\.json$|playwright\.config\.(ts|js)$|vite\.config\.(ts|js)$|tsconfig[^/]*\.json$|\.env|\.github/workflows/(preprod-build|app-restoration-build|prod-[^/]+)\.yml$)'
          phase3_app='^(src/CerebroBrowserConsole\.tsx|src/cerebroBrowserInteractive\.ts)$'
          unexpected_app="$(printf '%s\n' "$changed" | grep -E "$protected" | grep -Ev "$phase3_app" || true)"
          if [ -n "$unexpected_app" ]; then
            echo 'Unexpected App/application/test/production surface changed.' >&2
            printf '%s\n' "$unexpected_app" >&2
            exit 1
          fi
          allowed='^(supabase/functions/(cerebro-human-old-actor-preprod-v0|cerebro-human-new-actor-preprod-v1|cerebro-human-route-control-preprod-v1|cerebro-console-gateway-human-v1-canary|cerebro-console-human-router-zero-v1|cerebro-telegram-gateway-v0|cerebro-telegram-voice-v1|cerebro-browser-dispatch-v2|cerebro-browser-dispatch-v2-prod|cerebro-browser-interactive-v3|cerebro-creative-dispatch-v1)/|supabase/functions/cerebro-browser-dispatch-v1/index\.ts$|supabase/functions/_shared/cerebro-(conversation|channel-access)-policy-v1\.ts$|supabase/migrations/(20261012132000_cerebro_human_route_control_preprod_v1|20261013010500_cerebro_multichannel_ana_overlay_v1|20261013042000_cerebro_channel_access_profiles_v1|20261013075000_cerebro_company_registry_preprod_persistence_v1|20261013083000_cerebro_company_onboarding_preprod_persistence_v1|20261013093000_cerebro_scan001_preprod_persistence_v1|20261013101500_cerebro_post_scan_parallel_preprod_v1|20261023093000_cerebro_browser_dispatch_v1|20261023093100_cerebro_browser_credential_broker_v1|20261023180000_cerebro_browser_orchestrator_v2|20261023194500_cerebro_browser_credential_broker_v2|20261023195500_cerebro_browser_credential_broker_v2_scope_fix|20261023201500_cerebro_browser_barrier_v2_table|20261023201600_cerebro_browser_barrier_v2_acl|20261023201700_cerebro_browser_barrier_v2_functions|20261023201800_cerebro_browser_lease_benchmark_v2|20261024103000_cerebro_creative_job_v1|20261024103100_cerebro_creative_job_v1_scope_hardening|20261024103200_cerebro_creative_job_v1_explicit_deny_policy|20261024230000_cerebro_browser_phase3_interactive_v0)\.sql$|supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0\.rollback\.sql$)'
          unexpected_supabase="$(printf '%s\n' "$changed" | grep '^supabase/' | grep -Ev "$allowed" || true)"
          test -z "$unexpected_supabase" || { printf '%s\n' "$unexpected_supabase" >&2; exit 1; }
      - name: Creative Pipeline bounded-authority contract
        shell: bash
        run: |
          set -euo pipefail
          edge='supabase/functions/cerebro-creative-dispatch-v1/index.ts'
          queue='supabase/migrations/20261024103000_cerebro_creative_job_v1.sql'
          scope='supabase/migrations/20261024103100_cerebro_creative_job_v1_scope_hardening.sql'
          deny='supabase/migrations/20261024103200_cerebro_creative_job_v1_explicit_deny_policy.sql'
          runner='cerebro/runtime/creative-job-runner-v1.mjs'
          for file in "$edge" "$queue" "$scope" "$deny" "$runner"; do test -f "$file"; done
          grep -F 'const GITHUB_AUDIENCE="cerebro-creative-worker-v1"' "$edge"
          grep -F 'const GITHUB_REPOSITORY="carlosjmunoz78/fenix-capital-inmo-map"' "$edge"
          grep -F 'const GITHUB_WORKFLOW=".github/workflows/cerebro-creative-job-runner-v1.yml"' "$edge"
          grep -F 'else if(ref!=="refs/heads/main")' "$edge"
          grep -F 'if(!PREPROD)return out(req,404,{ok:false,error:"CANARY_ROUTE_NOT_AVAILABLE"})' "$edge"
          grep -F 'enable row level security' "$queue"
          grep -F 'revoke all on table public.cerebro_creative_job_v1 from public, anon, authenticated' "$queue"
          grep -F 'grant all on table public.cerebro_creative_job_v1 to service_role' "$queue"
          grep -F 'CREATIVE_JOB_PUBLISH_AUTHORITY_DENIED' "$queue"
          grep -F 'CREATIVE_JOB_MONEY_LIMIT' "$queue"
          grep -F 'CREATIVE_JOB_CROSS_COMPANY_DENIED' "$scope"
          grep -F 'to anon, authenticated' "$deny"
          grep -F 'using (false)' "$deny"
          grep -F 'heavy_render_outside_supabase:true' "$runner"
          grep -F 'publish_authorized:false' "$runner"
          grep -F 'additional_cost_eur:0' "$runner"
          ! grep -R -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]+' "$edge" "$queue" "$scope" "$deny" "$runner"
          echo 'Creative Pipeline is company-scoped, OIDC-bound, service-role-only, non-publishing, external-rendered and zero-cost.' >> "$GITHUB_STEP_SUMMARY"
      - name: Browser Phase 3 bounded-authority contract
        shell: bash
        run: |
          set -euo pipefail
          edge='supabase/functions/cerebro-browser-interactive-v3/index.ts'
          migration='supabase/migrations/20261024230000_cerebro_browser_phase3_interactive_v0.sql'
          runtime='cerebro/runtime/browser-interactive-session-v3.mjs'
          runner='cerebro/runtime/browser-job-runner-v2.mjs'
          client='src/cerebroBrowserInteractive.ts'
          rollback='supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0.rollback.sql'
          for file in "$edge" "$migration" "$runtime" "$runner" "$client" "$rollback"; do test -f "$file"; done
          grep -F "'CARLOS-ADMIN'" "$edge"
          grep -F "const LIVE_WORKFLOW='.github/workflows/cerebro-browser-job-runner-v2-live.yml'" "$edge"
          grep -F "const LIVE_REF='refs/heads/main'" "$edge"
          grep -F "browser1.interactive" "$edge"
          grep -F "owner/stop" "$edge"
          grep -F "HUMAN_CONTROLLED" "$edge"
          grep -F "human_lease_expires_at" "$edge"
          grep -F 'enable row level security' "$migration"
          grep -F "capability:'browser1.interactive'" "$runtime"
          grep -F 'exclusive_control_lease:true' "$runtime"
          grep -F 'frames_encrypted_aes_gcm:true' "$runtime"
          grep -F 'human_input_encrypted_aes_gcm:true' "$runtime"
          grep -F 'raw_cdp_exposed:false' "$runtime"
          grep -F 'default_browser1_unchanged:true' "$runtime"
          grep -F 'incremental_cost_eur:0' "$runtime"
          grep -F "String(job.capability||'')==='browser1.interactive'" "$runner"
          grep -F "name:'AES-GCM'" "$client"
          ! grep -R -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]+' "$edge" "$runtime" "$runner" "$client" "$migration"
          echo 'Browser Phase 3 is owner-scoped, OIDC-bound, encrypted, lease-exclusive, emergency-stoppable, additive and zero-cost.' >> "$GITHUB_STEP_SUMMARY"

  browser-dispatch-governance-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact PR head checkout
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Browser Dispatch and Vault broker bounded-authority contract
        shell: bash
        run: |
          set -euo pipefail
          edge='supabase/functions/cerebro-browser-dispatch-v1/index.ts'
          queue='supabase/migrations/20261023093000_cerebro_browser_dispatch_v1.sql'
          broker='supabase/migrations/20261023093100_cerebro_browser_credential_broker_v1.sql'
          if [ ! -f "$edge" ] && [ ! -f "$queue" ] && [ ! -f "$broker" ]; then
            echo 'Browser Dispatch not present on this head; no Browser Dispatch contract to evaluate.'
            exit 0
          fi
          test -f "$edge"
          test -f "$queue"
          test -f "$broker"
          test -f cerebro/runtime/browser-job-runner-v1.mjs
          test -f cerebro/tests/browser-job-runner-v1.test.mjs
          node --test cerebro/tests/browser-job-runner-v1.test.mjs
          grep -F 'enable row level security' "$queue"
          grep -F 'enable row level security' "$broker"
          grep -F 'revoke all on public.cerebro_browser_job_v1 from anon, authenticated' "$queue"
          grep -F 'revoke all on public.cerebro_credential_binding_v1 from anon, authenticated' "$queue"
          grep -F 'revoke all on public.cerebro_credential_lease_audit_v1 from anon, authenticated' "$broker"
          grep -F 'to service_role' "$queue"
          grep -F 'to service_role' "$broker"
          grep -F 'RAW_SECRET_FIELD_FORBIDDEN' "$queue"
          grep -F 'CROSS_COMPANY_CREDENTIAL_DENIED' "$broker"
          grep -F 'CREDENTIAL_ENVIRONMENT_DENIED' "$broker"
          grep -F 'CREDENTIAL_ORIGIN_DENIED' "$broker"
          grep -F 'CREDENTIAL_CAPABILITY_DENIED' "$broker"
          grep -F 'const GITHUB_AUDIENCE="cerebro-browser-worker-v1"' "$edge"
          grep -F 'const GITHUB_REPOSITORY="carlosjmunoz78/fenix-capital-inmo-map"' "$edge"
          grep -F 'const GITHUB_WORKFLOW=".github/workflows/cerebro-browser-job-runner-v1.yml"' "$edge"
          grep -F 'else if(ref!=="refs/heads/main")' "$edge"
          grep -F 'if(!PREPROD)return out(req,404,{ok:false,error:"CANARY_ROUTE_NOT_AVAILABLE"})' "$edge"
          grep -F 'raw_credentials_in_queue:false' cerebro/runtime/browser-job-runner-v1.mjs
          grep -F 'vault_credential_materialization:true' cerebro/runtime/browser-job-runner-v1.mjs
          grep -F 'credential_values_logged:false' cerebro/runtime/browser-job-runner-v1.mjs
          grep -F 'incremental_cost_eur:0' cerebro/runtime/browser-job-runner-v1.mjs
          ! grep -R -E 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]+' "$edge" cerebro/runtime/browser-job-runner-v1.mjs "$queue" "$broker"
          ! grep -R -F 'carlosj.munozcabeza@gmail.com' "$edge" cerebro/runtime/browser-job-runner-v1.mjs "$queue" "$broker"
          echo 'Browser Dispatch is exact-scoped, service-role-only, OIDC-bound, Vault-brokered and does not expand Browser 1 engine authority.' >> "$GITHUB_STEP_SUMMARY"
