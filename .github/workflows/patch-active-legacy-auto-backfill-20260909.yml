name: Patch active legacy auto backfill
on:
  push:
    branches: [preprod-app-phase1]
    paths: ['.github/workflows/patch-active-legacy-auto-backfill-20260909.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preprod-app-phase1
          fetch-depth: 0
      - name: Add authenticated active-only background loop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ContextEvidenceUpload.tsx')
          s=p.read_text()
          a=" const autoUploading=useRef(false);"
          b=" const autoUploading=useRef(false);\n const autoLegacyStarted=useRef(false);"
          if s.count(a)!=1: raise SystemExit(f'autoUploading anchor count={s.count(a)}')
          s=s.replace(a,b)
          anchor=""" useEffect(()=>{\n  if(!queue||!context||context.staging||!context.code||queue.originType!==context.type||busy||autoUploading.current)return;\n  autoUploading.current=true;const files=queue.files;setQueue(null);setOpen(true);setMsg(`Vinculando ${files.length} archivo${files.length===1?'':'s'} a ${context.label}…`);\n  void uploadFiles(files,context).finally(()=>{autoUploading.current=false});\n },[location.pathname,context?.type,context?.code,context?.staging,queue,busy]);\n"""
          insert=anchor+""" useEffect(()=>{\n  if(!IS_PRODUCTION||autoLegacyStarted.current||!/^\\/expedientes\\/(?!nuevo(?:\\/|$))/.test(location.pathname))return;\n  if(sessionStorage.getItem('fenix-active-legacy-backfill-v1')==='done')return;\n  autoLegacyStarted.current=true;\n  void autoReprocessActiveLegacy().finally(()=>{autoLegacyStarted.current=false});\n },[location.pathname]);\n"""
          if s.count(anchor)!=1: raise SystemExit(f'queue effect anchor count={s.count(anchor)}')
          s=s.replace(anchor,insert)
          fn=""" async function reprocessLegacy(){\n"""
          auto=""" async function autoReprocessActiveLegacy(){\n  if(!IS_PRODUCTION)return;let processed=0;\n  for(let i=0;i<60;i++){\n   const r=await extractFetch<LegacyBatch>({mode:'legacy_batch',limit:2});\n   if(r.status===403||r.status===401)return;\n   if(r.status!==200||!r.data?.ok)return;\n   const attempted=r.data.attempted??0;if(!attempted){sessionStorage.setItem('fenix-active-legacy-backfill-v1','done');break;}\n   processed+=attempted;\n  }\n  if(processed)window.dispatchEvent(new CustomEvent('fenix-active-legacy-backfill-complete',{detail:{processed}}));\n }\n\n async function reprocessLegacy(){\n"""
          if s.count(fn)!=1: raise SystemExit(f'reprocess anchor count={s.count(fn)}')
          s=s.replace(fn,auto)
          p.write_text(s)
          PY
          git diff --check
          grep -F "fenix-active-legacy-backfill-v1" src/ContextEvidenceUpload.tsx
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ContextEvidenceUpload.tsx
          git commit -m 'feat: auto backfill active legacy documents for Direccion'
          git push origin HEAD:preprod-app-phase1
