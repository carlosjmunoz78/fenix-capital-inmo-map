name: CEREBRO PROD Smoke Secret References Safe Probe V1
on:
  push:
    branches: [cerebro/close-179-per-engine-autonomy-v1-20261102]
    paths:
      - '.github/workflows/cerebro-prod-smoke-secret-refs-safe-probe-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLISHABLE: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
      LEGACY: ${{ secrets.PROD_SUPABASE_LEGACY_ANON_JWT }}
    steps:
      - name: Inspect ONLY presence and reference shape; no secret values
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'cerebro/close-179-per-engine-autonomy-v1-20261102'
          mkdir -p /tmp/cerebro-secret-ref-safe
          status_p='MISSING'
          status_l='MISSING'
          if [[ -n "$PUBLISHABLE" ]]; then
            status_p='INVALID_PREFIX'
            if [[ "$PUBLISHABLE" == sb_publishable_* ]]; then status_p='PRESENT_EXPECTED_PREFIX'; fi
          fi
          if [[ -n "$LEGACY" ]]; then
            status_l='PRESENT_NOT_DECODED'
          fi
          export STATUS_P="$status_p" STATUS_L="$status_l"
          python3 - <<'PY'
          import json,os,pathlib
          report={
           'schema_version':'1.0.0',
           'mission':'PROD_SMOKE_SECRET_REFERENCES_SAFE_PROBE',
           'environment':'GITHUB_ACTIONS_ISOLATED_BRANCH',
           'refs':{
            'PROD_SUPABASE_PUBLISHABLE_KEY':os.environ['STATUS_P'],
            'PROD_SUPABASE_LEGACY_ANON_JWT':os.environ['STATUS_L']
           },
           'values_exposed':False,
           'values_persisted':False,
           'secrets_mutated':False,
           'prod_writes':False,
           'prod_smoke_unblocked':os.environ['STATUS_P']=='PRESENT_EXPECTED_PREFIX' and os.environ['STATUS_L']=='PRESENT_NOT_DECODED',
           'scope':'REFERENCE_ONLY_NOT_PROD_RUNTIME_PROOF'
          }
          pathlib.Path('/tmp/cerebro-secret-ref-safe/SUMMARY.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
           f.write('## PROD smoke secret reference probe (no values)\n')
           for k,v in report['refs'].items(): f.write(f'- {k}: {v}\n')
           f.write('No secrets displayed, no PROD writes.\n')
          print('SAFE_REFERENCE_PROBE_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-secret-refs-safe-probe-${{ github.run_id }}
          path: /tmp/cerebro-secret-ref-safe/SUMMARY.json
          if-no-files-found: error
          retention-days: 7
