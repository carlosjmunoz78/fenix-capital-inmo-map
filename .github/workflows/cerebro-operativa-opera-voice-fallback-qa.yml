name: Operativa V3 Opera voice fallback · Isolated QA
on:
  push:
    branches:
      - fix/operativa-v3-opera-voice-fallback-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Static voice + security contracts
        run: node --test tests/cerebro-operativa-v3-live-bridge-contract.test.mjs tests/cerebro-operativa-v3-preview-gateway.test.mjs
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript Vite compile
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Synthetic owner session and voice fallback regression
        env:
          VITE_FENIX_ENV: test
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: operativa-e2e-not-a-real-key
        run: npx playwright test tests/cerebro-operativa-v3-live-bridge-e2e.spec.ts --project=desktop-chromium --reporter=line
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operativa-opera-voice-fallback-qa
          path: test-results/cockpit-v3-*.png
          if-no-files-found: ignore
          retention-days: 7
