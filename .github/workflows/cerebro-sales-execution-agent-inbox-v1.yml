name: CEREBRO SALE-001 Sales Execution Agent Inbox V1

on:
  push:
    paths:
      - 'cerebro/revenue/sales-execution-agent-inbox-v1.mjs'
      - 'cerebro/tests/sales-execution-agent-inbox-v1.test.mjs'
      - 'cerebro/registry/sales-execution-agent-inbox-profile.v1.json'
      - 'cerebro/docs/CEREBRO_SALES_EXECUTION_AGENT_INBOX_V1_2026-10-14.md'
      - '.github/workflows/cerebro-sales-execution-agent-inbox-v1.yml'
  pull_request:
    paths:
      - 'cerebro/revenue/sales-execution-agent-inbox-v1.mjs'
      - 'cerebro/tests/sales-execution-agent-inbox-v1.test.mjs'
      - 'cerebro/registry/sales-execution-agent-inbox-profile.v1.json'
      - 'cerebro/docs/CEREBRO_SALES_EXECUTION_AGENT_INBOX_V1_2026-10-14.md'
      - '.github/workflows/cerebro-sales-execution-agent-inbox-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-execution-agent-inbox-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sales execution focused tests
        run: node --test cerebro/tests/sales-execution-agent-inbox-v1.test.mjs
      - name: Validate profile JSON
        run: >-
          node -e "JSON.parse(require('fs').readFileSync('cerebro/registry/sales-execution-agent-inbox-profile.v1.json','utf8')); console.log('profile-json GREEN')"
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression suite
        working-directory: cerebro
        run: npm test
