name: CEREBRO Skill PROD Real Consumer V1

on:
  workflow_run:
    workflows:
      - CEREBRO Skill PROD Operational Fast Lane V1
    types:
      - completed
  schedule:
    - cron: '14,29,44,59 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cerebro/skill-real-prod-consumer-*'
      - 'cerebro/skill-wrapper-*'
    paths:
      - 'cerebro/registry/skill-operational-wrapper-registry-v1.json'
      - 'cerebro/runtime/skill-prod-operational-fastlane-v1.mjs'
      - 'cerebro/runtime/skill-prod-real-consumer-v1.mjs'
      - 'cerebro/runtime/skill-wrappers/**'
      - 'cerebro/tests/skill-prod-operational-fastlane-v1.test.mjs'
      - 'cerebro/tests/skill-prod-real-consumer-v1.test.mjs'
      - '.github/workflows/cerebro-skill-prod-real-consumer-v1.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-skill-prod-real-consumer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-prod-capability-consumer:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate operational fast lane and real consumer
        run: node --test cerebro/tests/skill-prod-capability-fastlane-v1.test.mjs cerebro/tests/skill-prod-operational-fastlane-v1.test.mjs cerebro/tests/skill-prod-real-consumer-v1.test.mjs
      - name: Execute representative real dynamic skill operations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cerebro-skill-real-consumer-batch"
          node cerebro/runtime/skill-prod-real-consumer-v1.mjs --candidate 'repo:be539f32206970b088329ceaf60b' --company fenix --engine APP-001 --mode PLAN --task AUTH_ARCHITECTURE_PLAN --goal 'Representative governed Cognito architecture plan' --output "$RUNNER_TEMP/cerebro-skill-real-consumer-batch/aws-cognito.json"
          node cerebro/runtime/skill-prod-real-consumer-v1.mjs --candidate 'repo:9a0225a6e15ebccefb2b18c38eaf' --company fenix --engine SEC-001 --mode PLAN --task INSTANCE_ARCHITECTURE_PLAN --goal 'Representative governed EC2 architecture plan' --output "$RUNNER_TEMP/cerebro-skill-real-consumer-batch/aws-ec2.json"
          node cerebro/runtime/skill-prod-real-consumer-v1.mjs --candidate 'repo:45634853e08ec0e33ec3f9cceacd' --company fenix --engine ARCH-001 --mode GENERATE --task DESIGN_SYSTEM_SCAFFOLD --goal 'Representative governed DESIGN.md scaffold' --output "$RUNNER_TEMP/cerebro-skill-real-consumer-batch/design-md.json"
          node cerebro/runtime/skill-prod-real-consumer-v1.mjs --candidate 'repo:fc81dac4018cb6cdf3b2e98a901f' --company fenix --engine WEB-001 --mode GENERATE --task PRODUCT_VIEWER --goal 'Representative governed Drei product viewer' --output "$RUNNER_TEMP/cerebro-skill-real-consumer-batch/drei.json"
          node cerebro/runtime/skill-prod-real-consumer-v1.mjs --candidate 'repo:92207779a87a5dd5282b5b69b099' --company fenix --engine APP-001 --mode GENERATE --task CODE_SCAFFOLD --goal 'Representative governed Figma-to-code scaffold' --output "$RUNNER_TEMP/cerebro-skill-real-consumer-batch/figma-to-code.json"
      - name: Assert semantic results and zero external authority
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=path.join(process.env.RUNNER_TEMP,'cerebro-skill-real-consumer-batch');
          const names=['aws-cognito','aws-ec2','design-md','drei','figma-to-code'];
          const receipts=Object.fromEntries(names.map(name=>[name,JSON.parse(fs.readFileSync(path.join(root,`${name}.json`),'utf8'))]));
          for(const [name,r] of Object.entries(receipts)){
            if(r.status!=='PROD_CAPABILITY_REAL_INTERNAL_EXECUTION_GREEN') throw new Error(`REAL_CONSUMER_NOT_GREEN:${name}:${r.status}`);
            if(r.technical_name!==name) throw new Error(`IDENTITY_MISMATCH:${name}:${r.technical_name}`);
            if(!String(r.wrapper_id??'').startsWith('skillwrap:')) throw new Error(`WRAPPER_MISSING:${name}`);
            if(r.result?.provenance?.raw_external_skill_code_executed!==false) throw new Error(`RAW_EXTERNAL_SKILL_CODE_EXECUTION:${name}`);
            const a=r.authority??{};
            if(a.direct_prod_write_authorized!==false||a.direct_prod_mutation_authorized!==false||a.external_side_effects_authorized!==false||a.external_skill_code_execution!==false||a.trading_access!==false||a.spend_authorized!==false||Number(a.additional_cost_eur)!==0) throw new Error(`REAL_CONSUMER_AUTHORITY_EXPANSION:${name}`);
          }
          if(!receipts['aws-cognito'].result?.output?.recommended_layers?.includes('JWT verification boundary')) throw new Error('SEMANTIC_COGNITO_RESULT_MISSING');
          if(!receipts['aws-ec2'].result?.output?.baseline_controls?.some(x=>/least-privilege/i.test(x))) throw new Error('SEMANTIC_EC2_RESULT_MISSING');
          if(!/## Foundations/.test(receipts['design-md'].result?.output?.generated_markdown??'')) throw new Error('SEMANTIC_DESIGN_RESULT_MISSING');
          if(!receipts.drei.result?.output?.recommended_components?.includes('Stage')) throw new Error('SEMANTIC_DREI_RESULT_MISSING');
          if(!/Page/.test(receipts['figma-to-code'].result?.output?.generated_scaffold??'')) throw new Error('SEMANTIC_FIGMA_RESULT_MISSING');
          console.log(JSON.stringify({status:'GREEN_REAL_CONSUMER_BATCH',count:names.length,skills:names,direct_prod_write_authorized:false,external_side_effects_authorized:false,trading_access:false,additional_cost_eur:0}));
          NODE
      - name: Upload immutable real-consumer evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-prod-real-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/cerebro-skill-real-consumer-batch/*.json
          if-no-files-found: error
          retention-days: 30
