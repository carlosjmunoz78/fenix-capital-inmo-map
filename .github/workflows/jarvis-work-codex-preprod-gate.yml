name: JARVIS Work Codex PREPROD Gate

on:
  push:
    branches:
      - cerebro/jarvis-work-codex-complete-20261102
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  contract-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cerebro/jarvis-work-codex-complete-20261102
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: Jarvis workspace contract
        shell: bash
        run: |
          set -euo pipefail
          test -f src/JarvisEmbeddedConsole.tsx
          test -f src/jarvisWorkApi.ts
          test -f src/jarvis-work-v2.css
          grep -q "createJarvisProject" src/CerebroJarvisWorkConsole.tsx
          grep -q "importJarvisProject" src/CerebroJarvisWorkConsole.tsx
          grep -q "renameJarvisProject" src/CerebroJarvisWorkConsole.tsx
          grep -q "focusPane('left')" src/CerebroJarvisWorkConsole.tsx
          grep -q "focusPane('center')" src/CerebroJarvisWorkConsole.tsx
          grep -q "focusPane('right')" src/CerebroJarvisWorkConsole.tsx
          grep -q "setLayout(DEFAULT_LAYOUT)" src/CerebroJarvisWorkConsole.tsx
          if grep -n "CEREBRO" src/CerebroJarvisWorkConsole.tsx | grep -Ev "Cerebro|replace|fetchCerebro"; then
            echo "Visible CEREBRO literal detected in Jarvis workspace"
            exit 1
          fi
          grep -q "JARVIS Work" src/CerebroJarvisWorkConsole.tsx
          grep -q "VISIBLE_REPLACEMENTS" src/JarvisEmbeddedConsole.tsx
      - name: Guard protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "cerebro/jarvis-work-codex-complete-20261102"
          echo "Branch isolated; no PROD/main write in this gate."
