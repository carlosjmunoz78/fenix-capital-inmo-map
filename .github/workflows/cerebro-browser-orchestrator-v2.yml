name: CEREBRO Browser 1 Phase 2 Orchestrator V2

on:
  push:
    branches:
      - 'cerebro/browser1-phase2-orchestrator-v1'
    paths:
      - 'cerebro/runtime/browser-orchestrator-v2.mjs'
      - 'cerebro/runtime/browser-job-runner-v2.mjs'
      - 'cerebro/tests/browser-orchestrator-v2.test.mjs'
      - 'cerebro/tests/browser-job-runner-v2.test.mjs'
      - 'supabase/functions/cerebro-browser-dispatch-v2/**'
      - 'supabase/migrations/20261023180000_cerebro_browser_orchestrator_v2.sql'
      - '.github/workflows/cerebro-browser-orchestrator-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CEREBRO_BROWSER_DISPATCH_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-browser-dispatch-v2
  CEREBRO_BROWSER_OIDC_AUDIENCE: cerebro-browser-worker-v1
  CEREBRO_BROWSER_STAGE_CONCURRENCY: '4'

jobs:
  contracts:
    name: Phase 2 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prove scheduler and worker contracts
        run: >-
          node --test
          cerebro/tests/browser-orchestrator-v2.test.mjs
          cerebro/tests/browser-job-runner-v2.test.mjs
      - name: Prove Phase 1 files are not replaced by Phase 2
        run: |
          test -f cerebro/runtime/browser1-access-v1.mjs
          test -f cerebro/runtime/browser-job-runner-v1.mjs
          test -f .github/workflows/cerebro-browser-job-runner-v1.yml
          grep -q "SINGLE_ACTIVE_SESSION_SERIAL" cerebro/runtime/browser1-access-v1.mjs
          grep -q "serial_v1_rollback_preserved:true" cerebro/runtime/browser-orchestrator-v2.mjs

  seed:
    name: Seed four isolated PREPROD jobs
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seed all jobs before workers start
        env:
          STAGE: '4'
        run: |
          node --input-type=module <<'NODE'
          const reqUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const reqToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!reqUrl || !reqToken) throw new Error('OIDC_REQUEST_CONTEXT_MISSING');
          const u = new URL(reqUrl);
          u.searchParams.set('audience', process.env.CEREBRO_BROWSER_OIDC_AUDIENCE);
          const tr = await fetch(u,{headers:{authorization:`Bearer ${reqToken}`},redirect:'error'});
          if(!tr.ok) throw new Error(`OIDC_TOKEN_FAILED:${tr.status}`);
          const {value:token}=await tr.json();
          for(let slot=1;slot<=Number(process.env.STAGE);slot++){
            const r=await fetch(`${process.env.CEREBRO_BROWSER_DISPATCH_URL}/phase2-canary-seed`,{
              method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},
              body:JSON.stringify({worker_slot:slot,stage_concurrency:Number(process.env.STAGE)}),redirect:'error'
            });
            const body=await r.json().catch(()=>null);
            if(!r.ok||body?.ok!==true) throw new Error(`SEED_FAILED:${slot}:${r.status}:${JSON.stringify(body)}`);
            console.log(JSON.stringify({slot,job_id:body.job_id,status:body.status,secret_material_logged:false}));
          }
          NODE

  workers:
    name: Chromium worker ${{ matrix.slot }} / 4
    needs: seed
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CEREBRO_BROWSER_WORKER_SLOT: ${{ matrix.slot }}
      CEREBRO_BROWSER_PHASE2_SEED_CANARY: 'false'
      CEREBRO_PHYSICAL_BROWSER_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Lease and execute one governed Browser 1 job
        run: node cerebro/runtime/browser-job-runner-v2.mjs
      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-phase2-stage4-slot-${{ matrix.slot }}
          path: .cerebro/browser-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

  status:
    name: Verify V2 queue drained
    needs: workers
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read governed PREPROD V2 status
        run: |
          node --input-type=module <<'NODE'
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience',process.env.CEREBRO_BROWSER_OIDC_AUDIENCE);
          const tr=await fetch(u,{headers:{authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          const {value:token}=await tr.json();
          const r=await fetch(`${process.env.CEREBRO_BROWSER_DISPATCH_URL}/status-v2`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:'{}'});
          const body=await r.json();
          console.log(JSON.stringify(body));
          if(!r.ok||body?.ok!==true)process.exit(1);
          if(Number(body.active_profiles||0)!==0)process.exit(2);
          NODE
