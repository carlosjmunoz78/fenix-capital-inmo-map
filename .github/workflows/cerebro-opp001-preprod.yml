name: CEREBRO OPP-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-capa001-capacity-engine-v0-20260911']
    paths:
      - 'cerebro/strategy/opportunity-engine.mjs'
      - 'cerebro/tests/opportunity-engine.test.mjs'
      - '.github/workflows/cerebro-opp001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/opportunity-engine.test.mjs
