name: CEREBRO MKT-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-marketing-bootstrap-v0-20260911']
    paths:
      - 'cerebro/marketing/marketing-engine.mjs'
      - 'cerebro/tests/marketing-engine.test.mjs'
      - '.github/workflows/cerebro-mkt001-preprod.yml'
jobs:
  mkt001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/marketing-engine.test.mjs
