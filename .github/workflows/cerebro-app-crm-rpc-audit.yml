name: CEREBRO APP CRM RPC Audit

on:
  push:
    branches:
      - cerebro-app-crm-rpc-migration-v0-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static direct PROD RPC inventory
        run: node scripts/audit-direct-prod-rpc.mjs | tee direct-prod-rpc-audit.json
      - name: Typecheck and build
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: https://prod.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: prod-build-validation-placeholder
        run: npm run build
      - name: Upload RPC audit
        uses: actions/upload-artifact@v4
        with:
          name: direct-prod-rpc-audit
          path: direct-prod-rpc-audit.json

# Audit only: no deployment, DB mutation, Edge deployment, secret output or PROD write.
