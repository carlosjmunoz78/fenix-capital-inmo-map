name: CEREBRO Human Intelligence PROD Canary V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/human-intelligence/integration/production-conversation-overlay-v1.mjs'
      - 'cerebro/tests/human-intelligence-production-overlay-v1.test.mjs'
      - 'cerebro/tests/channel-access-profiles-v1.test.mjs'
      - 'supabase/functions/_shared/cerebro-channel-access-policy-v1.ts'
      - 'supabase/functions/cerebro-console-gateway-human-v1-canary/**'
      - '.github/workflows/cerebro-human-intelligence-prod-canary-v1.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cerebro-human-intelligence-prod-canary-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  CANARY_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-gateway-human-v1-canary
  CANARY_AUDIENCE: cerebro-console-gateway-human-v1-canary

jobs:
  no-write-prod-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test conservative production overlay and channel profiles
        run: |
          node --test \
            cerebro/tests/human-intelligence-production-overlay-v1.test.mjs \
            cerebro/tests/channel-access-profiles-v1.test.mjs

      - name: Assert additive canary cannot replace operational authority
        shell: bash
        run: |
          set -euo pipefail
          f='supabase/functions/cerebro-console-gateway-human-v1-canary/index.ts'
          o='supabase/functions/cerebro-console-gateway-human-v1-canary/overlay.ts'
          r='supabase/functions/cerebro-console-gateway-human-v1-canary/router.ts'
          p='supabase/functions/_shared/cerebro-channel-access-policy-v1.ts'
          test -f "$f" && test -f "$o" && test -f "$r" && test -f "$p"
          grep -F 'cerebro-console-gateway-v0' "$f"
          grep -F 'cluhljgonannaafpmblx' "$f"
          grep -F '/canary/rehearsal' "$f"
          grep -F '/canary/router-rehearsal' "$f"
          grep -F '/canary/access-profile-rehearsal' "$f"
          grep -F 'evaluateChannelAccess' "$f"
          grep -F 'FULL_OWNER' "$p"
          grep -F 'FENIX_OPERATIONAL' "$p"
          grep -F 'live_chat_invoked:false' "$f"
          grep -F 'prod_write_authorized:false' "$f"
          grep -F 'LIVE_CANARY_PERCENT=0' "$r"
          ! grep -F 'SUPABASE_SERVICE_ROLE_KEY' "$f"
          ! grep -Eq 'trading_access[[:space:]]*:[[:space:]]*true|prod_write_authorized[[:space:]]*:[[:space:]]*true|secrets_disclosure_authorized[[:space:]]*:[[:space:]]*true' "$f" "$o" "$r" "$p"
          grep -F 'PASS_THROUGH_UNCHANGED' cerebro/human-intelligence/integration/production-conversation-overlay-v1.mjs

      - name: Acquire short-lived GitHub OIDC token for unrouted canary only
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CANARY_AUDIENCE}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$url" | jq -r '.value' > /tmp/cerebro-human-canary-oidc
          test -s /tmp/cerebro-human-canary-oidc
          chmod 600 /tmp/cerebro-human-canary-oidc

      - name: Physical PROD-project canary health proves ZERO routing
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-canary-oidc)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            "${CANARY_URL}/canary/health" > /tmp/health.json
          jq -e '.ok==true and .environment=="PROD_CANARY_UNROUTED" and .traffic_enabled==false and .consumer_routing_enabled==false and .live_canary_percent==0 and .fail_closed_target=="OLD" and .live_chat_invoked==false and .access_profile_rehearsal==true and .prod_write_authorized==false and .trading_access==false and .additional_cost_eur==0' /tmp/health.json >/dev/null

      - name: Physical ZERO router rehearsal never calls PROD upstream
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-canary-oidc)"
          cat > /tmp/router-rehearsal.json <<'JSON'
          {
            "requested_percent": 5,
            "cohort_keys": ["synthetic-a","synthetic-b","synthetic-c","synthetic-d"]
          }
          JSON
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/router-rehearsal.json \
            "${CANARY_URL}/canary/router-rehearsal" > /tmp/router-rehearsal-out.json
          jq -e '.ok==true and .environment=="PROD_CANARY_UNROUTED" and .live_canary_percent==0 and .requested_rehearsal_percent==5 and .safety.synthetic_only==true and .safety.upstream_prod_chat_called==false and .safety.route_state_mutated==false and .safety.consumer_routing_enabled==false and .safety.prod_write_authorized==false and .safety.trading_access==false and .safety.customer_data==false and .safety.additional_cost_eur==0' /tmp/router-rehearsal-out.json >/dev/null

      - name: Physical FULL_OWNER and FENIX_OPERATIONAL access-profile rehearsal
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-canary-oidc)"
          exercise(){
            local channel="$1" message="$2" outfile="$3"
            jq -n --arg channel "$channel" --arg message "$message" '{channel_id:$channel,user_message:$message}' > /tmp/access-in.json
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
              --data-binary @/tmp/access-in.json "${CANARY_URL}/canary/access-profile-rehearsal" > "$outfile"
          }
          exercise APP_ANA_TEXT 'Activa una nueva empresa en Company Registry' /tmp/ana-multi.json
          jq -e '.decision.access_profile=="FENIX_OPERATIONAL" and .decision.requested_scope=="MULTICOMPANY_CONTROL" and .decision.allowed==false and .decision.human_required==false and .decision.prod_write_authorized==false and .safety.upstream_prod_chat_called==false and .safety.customer_data==false and .safety.secrets==false' /tmp/ana-multi.json >/dev/null
          exercise APP_ANA_VOICE 'Muéstrame el access token del vault' /tmp/ana-secret.json
          jq -e '.decision.access_profile=="FENIX_OPERATIONAL" and .decision.requested_scope=="SECRETS_CREDENTIALS" and .decision.allowed==false and .decision.secrets_disclosure_authorized==false and .safety.upstream_prod_chat_called==false' /tmp/ana-secret.json >/dev/null
          exercise CONSOLE_TEXT 'Activa una nueva empresa en Company Registry' /tmp/console-owner.json
          jq -e '.decision.access_profile=="FULL_OWNER" and .decision.requested_scope=="MULTICOMPANY_CONTROL" and .decision.allowed==true and .decision.authority_expanded==false and .decision.prod_write_authorized==false and .safety.upstream_prod_chat_called==false' /tmp/console-owner.json >/dev/null
          exercise TELEGRAM_VOICE 'Revisa Trading LAB' /tmp/tg-trading.json
          jq -e '.decision.access_profile=="FULL_OWNER" and .decision.requested_scope=="TRADING_ISOLATED" and .decision.allowed==true and .decision.trading_bridge_authorized==false and .decision.prod_write_authorized==false and .safety.upstream_prod_chat_called==false and .safety.trading_access==false' /tmp/tg-trading.json >/dev/null

      - name: Physical synthetic overlay rehearsal with zero PROD chat writes
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-canary-oidc)"
          cat > /tmp/rehearsal.json <<'JSON'
          {
            "user_message":"Sigo perdido con la hipoteca y no quiero otra respuesta genérica",
            "upstream":{"status":"OK","intent":"finance_knowledge","executed":false,"message":"Para valorar la operación hay que revisar ingresos, obligaciones, ahorro y precio de compra."},
            "history":[]
          }
          JSON
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/rehearsal.json \
            "${CANARY_URL}/canary/rehearsal" > /tmp/rehearsal-out.json
          jq -e '.ok==true and .environment=="PROD_CANARY_UNROUTED" and .traffic_enabled==false and .consumer_routing_enabled==false and .live_canary_percent==0 and .live_chat_invoked==false and .safety.upstream_prod_chat_called==false and .safety.prod_write_authorized==false and .safety.trading_access==false and .safety.customer_data==false and .safety.additional_cost_eur==0 and .result.overlay.applied==true and .result.overlay.authoritative_preserved==true and .result.overlay.questions_added<=1' /tmp/rehearsal-out.json >/dev/null

      - name: Verify action semantics remain untouched in physical canary
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-canary-oidc)"
          cat > /tmp/action.json <<'JSON'
          {
            "user_message":"actívalo",
            "upstream":{"status":"ACTION_PROPOSAL","intent":"seo_zone_activation","executed":false,"action":{"action_id":"SYNTHETIC"},"message":"Propuesta exacta. ¿Quieres que active exactamente este proceso?"},
            "history":[]
          }
          JSON
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/action.json "${CANARY_URL}/canary/rehearsal" > /tmp/action-out.json
          jq -e '.result.overlay.applied==false and .result.overlay.reason=="PROTECTED_OR_NONPASSIVE" and .result.response.status=="ACTION_PROPOSAL" and .result.response.action.action_id=="SYNTHETIC" and .safety.upstream_prod_chat_called==false' /tmp/action-out.json >/dev/null

      - name: Record boundary
        run: |
          echo 'GREEN proves the deployed PROD canary remains physically fail-closed at NEW 0% and also evaluates FULL_OWNER/FENIX_OPERATIONAL synthetic scope decisions without calling PROD /chat.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It does NOT route real users, authorize PROD writes, disclose secrets, bridge Trading, or replace cerebro-console-gateway-v0.' >> "$GITHUB_STEP_SUMMARY"
