name: CEREBRO AUTO-001 PROD Closure V1

on:
  workflow_run:
    workflows: ['CEREBRO AUTO-001 PREPROD Patch Executor V0']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cerebro-auto001-prod-closure-v1
  cancel-in-progress: false

env:
  QA_STATE_BRANCH: cerebro/qa-state-v0
  AUTO_REPAIR_STATE_PATH: cerebro/runtime/auto001-repair-autonomy-state.v0.json
  PROD_POLICY_PATH: cerebro/registry/prod-promotion-policy-overrides.v1.json

jobs:
  close-to-prod:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prove closure and promotion contracts
        run: >-
          node --test
          cerebro/tests/qa-promotion-readiness-v0.test.mjs
          cerebro/tests/governed-promotion-executor-v1.test.mjs

      - name: Load latest certified AUTO-001 repair state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH"
          git show "refs/remotes/origin/$QA_STATE_BRANCH:$AUTO_REPAIR_STATE_PATH" > /tmp/auto001-state.json
          jq -e '.state_type=="CEREBRO_AUTO001_REPAIR_AUTONOMY_STATE_V0" and .preprod_patch_validated==true and .regression_passed==true and .rebuild_passed==true and .rollback_passed==true and .tribunal_approved==true and .old_vs_new.improved==true and .transform_id=="APP_AUTH_SHELL_ROLE_MAIN_V0" and .owner_engine=="HCI-001" and (.target|startswith("APP:")) and .safety.additional_subscription_eur==0 and .safety.trading==false' /tmp/auto001-state.json >/dev/null

      - name: Resolve exact open PR carrier
        shell: bash
        run: |
          set -euo pipefail
          branch="$(jq -r '.branch' /tmp/auto001-state.json)"
          test -n "$branch" && test "$branch" != null
          printf '%s\n' "$branch" > /tmp/candidate-branch.txt
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number,headRefOid,isDraft --limit 1)"
          test "$(jq 'length' <<<"$pr")" -eq 1
          test "$(jq -r '.[0].isDraft' <<<"$pr")" = false
          jq -r '.[0].number' <<<"$pr" > /tmp/pr-number.txt
          jq -r '.[0].headRefOid' <<<"$pr" > /tmp/head-sha.txt
          printf '%s' "$(cat /tmp/head-sha.txt)" | grep -Eq '^[0-9a-fA-F]{40}$'

      - name: Require narrow APP-001 autonomous PROD policy
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.state_type=="CEREBRO_PROD_PROMOTION_POLICY_OVERRIDES_V1" and .company_id=="fenix" and .environment=="PROD_CONTROL_PLANE" and .trading_access==false and .additional_cost_eur==0 and .default=="FAIL_CLOSED"' "$PROD_POLICY_PATH" >/dev/null
          jq -e '.policies[] | select(.engine_id=="APP-001" and .target=="APP_FENIX_STATIC") | .autonomy_mode=="PREPROD_AUTONOMOUS" and .evidence_state=="GOVERNED_PROD_PROMOTION_V1_ELIGIBLE" and .prod_authorized==true and .prod_write_authorized==true and .kill_switch_enabled==true and .kill_switch_state=="ARMED" and .automatic_rollback_allowed==true and .additional_cost_limit_eur==0 and (.allowed_risk_classes==["LOW"]) and .max_files_changed==1 and (.allowed_paths==["src/App.tsx"]) and .required_terminal_state=="PROD_PROMOTED"' "$PROD_POLICY_PATH" >/dev/null

      - name: Prove fresh base observability backup and bounded diff prerequisites
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PROD_SOURCE_SHA.txt' .github/workflows/prod-live-deploy.yml >/dev/null
          grep -F 'app.fenixcapital.es' .github/workflows/prod-live-deploy.yml >/dev/null
          base_sha="$(jq -r '.base_sha' /tmp/auto001-state.json)"
          printf '%s' "$base_sha" | grep -Eq '^[0-9a-fA-F]{40}$'
          git cat-file -e "${base_sha}^{commit}"
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$base_sha"
          branch="$(cat /tmp/candidate-branch.txt)"
          git fetch --no-tags --force origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          head_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
          test "$head_sha" = "$(cat /tmp/head-sha.txt)"
          changed="$(git diff --name-only "$base_sha" "$head_sha")"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$changed" = 'src/App.tsx'

      - name: Build zero-cost governed promotion packet
        shell: bash
        run: |
          set -euo pipefail
          pr="$(cat /tmp/pr-number.txt)"; head="$(cat /tmp/head-sha.txt)"
          jq -n \
            --argjson pr "$pr" \
            --arg head "$head" \
            '{state_type:"CEREBRO_GOVERNED_PROMOTION_PACKET_V1",company_id:"fenix",engine_id:"APP-001",target:"APP_FENIX_STATIC",pr_number:$pr,expected_head_sha:$head,gates:{contracts:true,permissions:true,tests:true,evaluation:true,tribunal:true,observability:true,rollback:true,backup:true,rebuild:true,cost_measured:true,policy:true,preprod:true,old_vs_new:true,canary:true},additional_subscription_eur:0,trading_access:false}' > /tmp/promotion-packet.json
          node cerebro/governance/governed-promotion-executor-v1.mjs --packet /tmp/promotion-packet.json --out /tmp/promotion-decision.json
          test "$(jq -r '.status' /tmp/promotion-decision.json)" = PROMOTE_READY
          base64 -w0 /tmp/promotion-packet.json > /tmp/promotion-packet.b64

      - name: Dispatch terminal governed PROD promotion
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run cerebro-governed-promotion-v1.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "pr_number=$(cat /tmp/pr-number.txt)" \
            -f "expected_head_sha=$(cat /tmp/head-sha.txt)" \
            -f "promotion_packet_b64=$(cat /tmp/promotion-packet.b64)"
          echo 'terminal_target=PROD_PROMOTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'fallback=REPAIR_REQUIRED_OR_CANONICAL_HUMAN_REQUIRED' >> "$GITHUB_STEP_SUMMARY"
