name: CEREBRO Operativa · Legibilidad QA isolated
on:
  push:
    branches: [fix/cerebro-operativa-legibilidad-20261112]
permissions: {contents: read}
jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_FENIX_ENV: test
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: operativa-e2e-not-real
      VITE_CEREBRO_CONSOLE_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-gateway-v0/
      PLAYWRIGHT_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: npm}
      - name: Verify only Operativa and QA changed against exact live Vercel source
        shell: bash
        run: |
          set -euo pipefail
          BASE=bb9aed7ffa3dd9a6f8d38670ebb3eaee514b2542
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/operativa-diff
          while IFS= read -r file; do
            case "$file" in
              src/CerebroOperativeConsole.tsx|src/cerebro-operative-console.css|tests/cerebro-operativa-v3-e2e.spec.ts|tests/cerebro-operativa-legibilidad-contract.test.mjs|.github/workflows/cerebro-operativa-legibilidad-qa.yml|.github/workflows/cerebro-operativa-legibilidad-vercel-stage.yml) ;;
              *) echo "OUT_OF_SCOPE $file" >&2; exit 2;;
            esac
          done < /tmp/operativa-diff
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/cerebro-operativa-legibilidad-contract.test.mjs
      - run: npx playwright install chromium
      - name: Synthetic owner browser QA
        run: npx playwright test tests/cerebro-operativa-v3-e2e.spec.ts --project=desktop-chromium --reporter=line
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operativa-legibilidad-qa-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
