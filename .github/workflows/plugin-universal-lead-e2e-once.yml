name: PLUGIN-UNIVERSAL PREPROD Lead E2E Once

on:
  push:
    branches:
      - work/finops-supabase-offload-wave1-2026-09-28
    paths:
      - ".github/workflows/plugin-universal-lead-e2e-once.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit synthetic consented lead to staging
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --max-time 20             -o /tmp/lead-response.json             -w '%{http_code}'             -H 'Content-Type: application/json'             -H 'x-fenix-idempotency-key: preprod-e2e-consent-20260928-2239'             -d '{"email":"cerebro.preprod.e2e.20260928@example.com","name":"CEREBRO PREPROD E2E","landing_url":"https://staging.fenixcapital.es/","utm_source":"cerebro_e2e","utm_medium":"qa","utm_campaign":"plugin_universal_001","consent_privacy":true,"consent_marketing":true,"website":""}'             https://staging.fenixcapital.es/wp-json/fenix-cerebro/v1/lead)
          echo "HTTP_STATUS=$status"
          cat /tmp/lead-response.json
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then exit 1; fi
          grep -Fq '"ok":true' /tmp/lead-response.json
          echo 'SYNTHETIC_LEAD_E2E=PASS'
