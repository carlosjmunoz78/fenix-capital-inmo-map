name: FACT001 Supabase independent management LAB operator security CI
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase/management-canary-lab/**
      - .github/workflows/fact001-supabase-mgmt-owner-lab-ci.yml
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - run: |
          node --test cerebro/connectors/universal/supabase/management-canary-lab/tests/*.test.mjs
          node --check cerebro/connectors/universal/supabase/management-canary-lab/run-once.mjs
          node --experimental-strip-types --check cerebro/connectors/universal/supabase/management-canary-lab/index.ts
          node --check cerebro/connectors/universal/supabase/management-canary-lab/policy.mjs
