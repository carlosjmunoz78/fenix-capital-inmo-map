# Dedicated dependency/App gate. It is intentionally outside the cerebro-rsi-* namespace:
# RSI must continue rejecting package.json/package-lock.json as protected App surface.
name: CEREBRO Dependency Security Gate V1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-security-gate-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-security-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install exact lockfile
        run: npm ci
      - name: Require zero high or critical npm vulnerabilities
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-exact-head.json
          set -e
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('npm-audit-exact-head.json','utf8'));
          const v=a.metadata?.vulnerabilities||{};
          console.log(JSON.stringify({vulnerabilities:v},null,2));
          if ((v.high||0)!==0 || (v.critical||0)!==0) process.exit(1);
          NODE
      - name: Build exact head
        run: npm run build
      - name: Full CEREBRO regression isolated per test file
        shell: bash
        run: |
          set -uo pipefail
          count=0
          failures=0
          failed_files=()
          while IFS= read -r test_file; do
            count=$((count + 1))
            tmp_output="$(mktemp)"
            echo "::group::${test_file}"
            if node --test "${test_file}" >"${tmp_output}" 2>&1; then
              cat "${tmp_output}"
            else
              failures=$((failures + 1))
              failed_files+=("${test_file}")
              cat "${tmp_output}"
              echo "::error file=${test_file},title=CEREBRO regression failure::Test file failed on dependency candidate"
            fi
            rm -f "${tmp_output}"
            echo "::endgroup::"
          done < <(find cerebro/tests -maxdepth 1 -type f -name '*.test.mjs' -print | sort)
          if (( count == 0 || failures > 0 )); then
            printf 'Failed files (%d):\n' "${failures}"
            printf ' - %s\n' "${failed_files[@]}"
            exit 1
          fi
          echo "Executed ${count} CEREBRO test files."
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-dependency-security-gate-v1
          path: npm-audit-exact-head.json
          if-no-files-found: warn
          retention-days: 7
