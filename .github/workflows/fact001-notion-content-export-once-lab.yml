name: FACT001 Notion First 25 Encrypted Content LAB One Shot
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/notion-content-export-lab/requests/execute-20261110.v1.json
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: fact001-notion-content-export-first-25-lab
  cancel-in-progress: false
jobs:
  export-readonly:
    if: github.actor == 'carlosjmunoz78' && startsWith(github.event.head_commit.message, 'FACT001_NOTION_25_CONTENT_EXPORT_RUN_ONCE_20261110')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Export fixed batch through OIDC to isolated encrypted LAB worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/connectors/universal/services/notion-content-export-lab/run-once.mjs
      - name: Upload encrypted-only item outputs and fail-closed report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fact001-first-25-notion-page-content-aes256gcm-20261110
          path: fact001-first-25-encrypted-content
          if-no-files-found: warn
          retention-days: 90