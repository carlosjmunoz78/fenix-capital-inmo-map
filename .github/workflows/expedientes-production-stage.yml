name: Expedientes production stage without alias change

on:
  push:
    branches:
      - fix/expedientes-production-safe-active-order-20261109
    paths:
      - .github/workflows/expedientes-production-stage.yml

permissions:
  contents: read

jobs:
  stage-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_qnh6u1Ofy2WPp0MGEKlyMA50
      VERCEL_PROJECT_ID: prj_4ElVl8e2KzrHS7r5yvBGBban1DXV
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert protected live-base ancestry and authorized paths
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/expedientes-production-safe-active-order-20261109"
          git merge-base --is-ancestor a55f3ff57db62182c905a07b30c4ea4bb8d01b43 HEAD
          while IFS= read -r file; do
            case "${file}" in
              src/ExpedientesSharedShell.tsx|tests/expedientes-active-order.spec.ts|.github/workflows/expedientes-safe-live-base-preview.yml|.github/workflows/expedientes-production-stage.yml) ;;
              *) echo "Unexpected change: ${file}" >&2; exit 1;;
            esac
          done < <(git diff --name-only a55f3ff57db62182c905a07b30c4ea4bb8d01b43 HEAD)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E regression of active counts / filters / ordering
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: qa-inert-key
        run: npx playwright test tests/expedientes-active-order.spec.ts --project=desktop-chromium --reporter=line
      - name: Verify production build
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: https://cluhljgonannaafpmblx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Install reviewed Vercel CLI
        run: npm install --global vercel@48.0.0
      - name: Pull production settings without publishing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope=carlosjmunozcabeza-2582s-projects --token "${VERCEL_TOKEN}"
      - name: Stage production artifact without binding domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --skip-domain --yes --scope=carlosjmunozcabeza-2582s-projects --token "${VERCEL_TOKEN}")"
          case "${url}" in https://*.vercel.app) ;; *) echo "Invalid staged URL" >&2; exit 1;; esac
          printf 'Staged production build, NOT promoted: %s\n' "${url}" >> "${GITHUB_STEP_SUMMARY}"
