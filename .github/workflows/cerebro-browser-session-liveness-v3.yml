name: CEREBRO Browser V3 Session Liveness

on:
  push:
    branches: ['cerebro/navegador-runtime-recovery-20261024']
    paths:
      - 'supabase/functions/cerebro-browser-interactive-v3/**'
      - 'cerebro/runtime/browser-session-liveness-v3.test.mjs'
      - 'cerebro/runtime/browser-live-runner-host.test.mjs'
      - 'cerebro/runtime/browser-oidc-refresh-v2.test.mjs'
      - 'cerebro/runtime/browser-job-runner-v2.mjs'
      - 'cerebro/runtime/browser-interactive-session-v3.mjs'
      - '.github/workflows/cerebro-browser-job-runner-v2-live.yml'
      - '.github/workflows/cerebro-browser-session-liveness-v3.yml'
  pull_request:
    paths:
      - 'supabase/functions/cerebro-browser-interactive-v3/**'
      - 'cerebro/runtime/browser-session-liveness-v3.test.mjs'
      - 'cerebro/runtime/browser-live-runner-host.test.mjs'
      - 'cerebro/runtime/browser-oidc-refresh-v2.test.mjs'
      - 'cerebro/runtime/browser-job-runner-v2.mjs'
      - 'cerebro/runtime/browser-interactive-session-v3.mjs'
      - '.github/workflows/cerebro-browser-job-runner-v2-live.yml'
      - '.github/workflows/cerebro-browser-session-liveness-v3.yml'

permissions:
  contents: read

jobs:
  session-liveness:
    name: Stale session recovery, host runtime and OIDC lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate browser session, LIVE runtime and OIDC refresh contracts
        run: node --test cerebro/runtime/browser-session-liveness-v3.test.mjs cerebro/runtime/browser-live-runner-host.test.mjs cerebro/runtime/browser-oidc-refresh-v2.test.mjs
