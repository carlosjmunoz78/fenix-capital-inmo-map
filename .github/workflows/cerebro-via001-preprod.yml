name: CEREBRO VIA-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-coh001-expediente-coherence-v0-20260911']
    paths:
      - 'cerebro/finance/mortgage-viability-engine.mjs'
      - 'cerebro/tests/mortgage-viability-engine.test.mjs'
      - '.github/workflows/cerebro-via001-preprod.yml'
jobs:
  via001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/mortgage-viability-engine.test.mjs
