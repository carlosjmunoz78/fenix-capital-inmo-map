name: CEREBRO LEAD-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-cap001-acquisition-engine-v0-20260911']
    paths:
      - 'cerebro/sales/lead-scoring.mjs'
      - 'cerebro/tests/lead-scoring.test.mjs'
      - '.github/workflows/cerebro-lead001-preprod.yml'
jobs:
  lead001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/lead-scoring.test.mjs
