name: FACT001 Vercel independent signed intake security CI
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase/vercel-intake-lab/**
      - .github/workflows/fact001-vercel-intake-policy-ci.yml
permissions:
  contents: read
jobs:
  vercel-intake-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: node --test cerebro/connectors/universal/supabase/vercel-intake-lab/tests/*.test.mjs
      - name: Deny provider API and non-verified identity
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=readFileSync('cerebro/connectors/universal/supabase/vercel-intake-lab/policy.mjs','utf8');
          const i=readFileSync('cerebro/connectors/universal/supabase/vercel-intake-lab/index.ts','utf8');
          if(!p.includes("payload.workflow_ref!==WORKFLOW_REF")||!p.includes("payload.actor!=='carlosjmunoz78'")||
             !p.includes("payload.event_name!=='push'")||!p.includes("payload.aud!==OIDC_AUDIENCE"))throw Error('OIDC_NOT_PINNED');
          if(!i.includes('ON CONFLICT(idempotency_key) DO NOTHING')||i.includes('api.vercel.com')||i.includes('console.log('))throw Error('D1_ONLY_AUDIT_DENIED');
          console.log('FACT001_VERCEL_SIGNED_ENTRY_POLICY=PASS');
          NODE
