name: CEREBRO JARVIS DIR-TEST Readonly Policy One Shot
on:
  push:
    branches:
      - cerebro/jarvis-git-parity-lab-20261109
    paths:
      - '.github/workflows/cerebro-jarvis-dir-test-readonly-contract-once.yml'
      - 'tests/jarvis-dir-test-isolation.test.mjs'
permissions:
  contents: read
jobs:
  test-actor-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies deterministically
        run: npm ci --no-audit --no-fund
      - name: Validate actual route-policy predicates and fail-closed wiring
        run: node --test tests/jarvis-dir-test-isolation.test.mjs
      - name: Ensure no deployment no database migration and no rearm
        run: echo 'DIR_TEST_READONLY_POLICY_LAB_TESTED=GREEN; PROD_DEPLOY=NO; NEW_IDENTITY=NO'
