name: CEREBRO LAB-AI PREPROD
on:
  pull_request:
    branches:
      - cerebro-labmkt-marketing-lab-v0-20260911
jobs:
  labai-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/ai-lab.test.mjs
