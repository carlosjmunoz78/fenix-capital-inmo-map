name: CEREBRO ACTGW-001 PREPROD
on:
  pull_request:
    branches: [cerebro-command-v0-20260911]
jobs:
  actgw-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/action-gateway-v0.test.mjs cerebro/tests/console-action-gateway.integration.test.mjs
