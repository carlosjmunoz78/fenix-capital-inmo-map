name: FACT001 Notion Second 25 Live Index Plan LAB Once
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/notion-batch-planner-v2-lab/requests/execute-20261111.v1.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: fact001-notion-second-25-live-index-lab
  cancel-in-progress: false
jobs:
  plan-readonly-v2:
    if: github.actor == 'carlosjmunoz78' && startsWith(github.event.head_commit.message, 'FACT001_NOTION_SECOND_25_LIVE_PLAN_RUN_ONCE_20261111')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify previous 25 backup, issue OIDC and plan from live Notion index
        run: node cerebro/connectors/universal/services/notion-batch-planner-v2-lab/run-once.mjs
      - name: Preserve encrypted output only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fact001-second-25-notion-batch-plan-v2-aes256gcm-20261111
          path: fact001-notion-second-25-plan-v2
          if-no-files-found: warn
          retention-days: 90