name: CEREBRO SEO Corpus Workforce Identity V1

on:
  pull_request:
    paths:
      - 'cerebro/seo-enterprise/v2/**'
      - 'cerebro/factory/seo-skillpack-factory-v2.mjs'
      - '.github/workflows/cerebro-seo-corpus-workload-v1.yml'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  seo-corpus-worker:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'cerebro/seo-enterprise-family-staging-contract-v1-20261105' && github.event.pull_request.number == 22 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub OIDC issuer signature and provider job identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seo-worker"
          node cerebro/seo-enterprise/v2/runtime/seo-gh-oidc-workload-v1.mjs \
            "$RUNNER_TEMP/seo-worker/identity.json"
      - name: Execute 141 competence tasks on existing frozen WordPress corpus, no live fetches
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-corpus-job001-work-v1.mjs worker \
            "$RUNNER_TEMP/seo-worker/job001.v8" \
            "$RUNNER_TEMP/seo-worker/identity.json" \
            "$RUNNER_TEMP/seo-worker/report.json"
      - name: Bind first SEO-D05 specialist role context to verified ACTGW/JOB workload
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-first-specialist-context-proof-v1.mjs worker \
            "$RUNNER_TEMP/seo-worker/report.json" \
            "$RUNNER_TEMP/seo-worker/identity.json" \
            "$RUNNER_TEMP/seo-worker/first-role-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-corpus-worker-v1
          path: |
            ${{ runner.temp }}/seo-worker/identity.json
            ${{ runner.temp }}/seo-worker/report.json
            ${{ runner.temp }}/seo-worker/first-role-receipt.json
          retention-days: 14
          if-no-files-found: error
  seo-d05-actor:
    needs: seo-corpus-worker
    if: ${{ github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate dedicated D05 actor as Github verified OIDC workload
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d05-actor"
          node cerebro/seo-enterprise/v2/runtime/seo-gh-oidc-workload-v1.mjs "$RUNNER_TEMP/d05-actor/identity.json"
      - name: Test non-bearer signatures and revocation gates
        run: node --test cerebro/seo-enterprise/v2/tests/seo-d05-verified-actor-training-v1.test.mjs
      - name: Validate all 32 knowledge packs and honest operational readiness
        run: |
          set -euo pipefail
          node --test cerebro/seo-enterprise/v2/tests/seo-department-ops-supervisor-v1.test.mjs
          node --test cerebro/seo-enterprise/v2/tests/seo-existing-wp-draft-qa-v1.test.mjs
          node --test cerebro/seo-enterprise/v2/tests/seo-staging-bridge-owner-offline-patch-v1.test.mjs
          node --test cerebro/seo-enterprise/v2/tests/seo-source-bound-herencias-review-v1.test.mjs
          node --test cerebro/seo-enterprise/v2/tests/seo001-google-structured-data-policy-2026-v1.test.mjs
          node --test cerebro/seo-enterprise/v2/tests/seo-lead-privacy-release-guard-v1.test.mjs
          node --test cerebro/seo-enterprise/v2/tests/seo-lead-sla-aggregate-supervisor-v1.test.mjs
          node --test cerebro/seo-enterprise/v2/tests/seo-public-navigation-health-v1.test.mjs
      - name: Live public navigation health · READONLY HEAD 26 destinations, 2 concurrent
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-public-navigation-health-v1.mjs
          node cerebro/seo-enterprise/v2/runtime/seo-department-ops-supervisor-v1.mjs "$RUNNER_TEMP/d05-actor/seo-readiness.json"
      - name: Execute 3 signed case responses in isolated durable JOB001
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-d05-verified-actor-training-v1.mjs actor \
            "$RUNNER_TEMP/d05-actor/identity.json" \
            "$RUNNER_TEMP/d05-actor/job001.v8" \
            "$RUNNER_TEMP/d05-actor/submissions.json"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-d05-actor-v1
          path: |
            ${{ runner.temp }}/d05-actor/identity.json
            ${{ runner.temp }}/d05-actor/submissions.json
            ${{ runner.temp }}/d05-actor/seo-readiness.json
          retention-days: 14
          if-no-files-found: error

  seo-corpus-qa:
    needs: [seo-corpus-worker, seo-d05-actor]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seo-corpus-worker-v1
          path: ${{ runner.temp }}/seo-corpus/worker
      - uses: actions/download-artifact@v4
        with:
          name: seo-d05-actor-v1
          path: ${{ runner.temp }}/seo-corpus/d05-actor
      - name: Verify independent GitHub OIDC workload and source job success
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seo-corpus/qa"
          node cerebro/seo-enterprise/v2/runtime/seo-gh-oidc-workload-v1.mjs \
            "$RUNNER_TEMP/seo-corpus/qa/identity.json"
      - name: Recompute all 141 role outputs against same frozen corpus
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-corpus-job001-work-v1.mjs qa \
            "$RUNNER_TEMP/seo-corpus/worker/report.json" \
            "$RUNNER_TEMP/seo-corpus/worker/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/report.json"
      - name: D31 independently verify three signed D05 source-bound cases
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-d05-verified-actor-training-v1.mjs qa \
            "$RUNNER_TEMP/seo-corpus/d05-actor/submissions.json" \
            "$RUNNER_TEMP/seo-corpus/d05-actor/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/d05-qa.json"
      - name: D31 QA independently verify pinned D05 knowledge, OIDC and role work receipt
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-first-specialist-context-proof-v1.mjs qa \
            "$RUNNER_TEMP/seo-corpus/worker/report.json" \
            "$RUNNER_TEMP/seo-corpus/worker/identity.json" \
            "$RUNNER_TEMP/seo-corpus/worker/first-role-receipt.json" \
            "$RUNNER_TEMP/seo-corpus/qa/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/first-role-qa.json"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-corpus-qa-v1
          path: |
            ${{ runner.temp }}/seo-corpus/qa/identity.json
            ${{ runner.temp }}/seo-corpus/qa/report.json
            ${{ runner.temp }}/seo-corpus/qa/first-role-qa.json
            ${{ runner.temp }}/seo-corpus/qa/d05-qa.json
          retention-days: 14
          if-no-files-found: error
  seo-d05-d32:
    needs: [seo-d05-actor, seo-corpus-qa]
    if: ${{ github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seo-d05-actor-v1
          path: ${{ runner.temp }}/d05/actor
      - uses: actions/download-artifact@v4
        with:
          name: seo-corpus-qa-v1
          path: ${{ runner.temp }}/d05/qa
      - name: Verify independent D32 OIDC trainer workload
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d05/d32"
          node cerebro/seo-enterprise/v2/runtime/seo-gh-oidc-workload-v1.mjs "$RUNNER_TEMP/d05/d32/identity.json"
      - name: Independent D32 review three submitted examples; preserve HOLD
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-d05-verified-actor-training-v1.mjs d32 \
            "$RUNNER_TEMP/d05/actor/submissions.json" \
            "$RUNNER_TEMP/d05/actor/identity.json" \
            "$RUNNER_TEMP/d05/qa/d05-qa.json" \
            "$RUNNER_TEMP/d05/qa/identity.json" \
            "$RUNNER_TEMP/d05/d32/identity.json" \
            "$RUNNER_TEMP/d05/d32/feedback.json"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-d05-d32-feedback-v1
          path: |
            ${{ runner.temp }}/d05/d32/feedback.json
            ${{ runner.temp }}/d05/d32/identity.json
          retention-days: 14
          if-no-files-found: error

  seo-corpus-tribunal:
    needs: [seo-corpus-worker, seo-corpus-qa, seo-d05-d32]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seo-corpus-worker-v1
          path: ${{ runner.temp }}/seo-corpus/worker
      - uses: actions/download-artifact@v4
        with:
          name: seo-corpus-qa-v1
          path: ${{ runner.temp }}/seo-corpus/qa
      - uses: actions/download-artifact@v4
        with:
          name: seo-d05-actor-v1
          path: ${{ runner.temp }}/seo-corpus/d05-actor
      - uses: actions/download-artifact@v4
        with:
          name: seo-d05-d32-feedback-v1
          path: ${{ runner.temp }}/seo-corpus/d05-d32
      - name: Verify third independent GitHub OIDC workload
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seo-corpus/tribunal"
          node cerebro/seo-enterprise/v2/runtime/seo-gh-oidc-workload-v1.mjs \
            "$RUNNER_TEMP/seo-corpus/tribunal/identity.json"
      - name: Verify independent prior job identities and decide NO PROD release
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-corpus-job001-work-v1.mjs tribunal \
            "$RUNNER_TEMP/seo-corpus/worker/report.json" \
            "$RUNNER_TEMP/seo-corpus/qa/report.json" \
            "$RUNNER_TEMP/seo-corpus/worker/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/identity.json" \
            "$RUNNER_TEMP/seo-corpus/tribunal/identity.json" \
            "$RUNNER_TEMP/seo-corpus/tribunal/verdict.json"
      - name: Tribunal cross-check third OIDC job and keep individual agent IAM at HOLD
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-first-specialist-context-proof-v1.mjs tribunal \
            "$RUNNER_TEMP/seo-corpus/worker/report.json" \
            "$RUNNER_TEMP/seo-corpus/worker/identity.json" \
            "$RUNNER_TEMP/seo-corpus/worker/first-role-receipt.json" \
            "$RUNNER_TEMP/seo-corpus/qa/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/first-role-qa.json" \
            "$RUNNER_TEMP/seo-corpus/tribunal/identity.json" \
            "$RUNNER_TEMP/seo-corpus/tribunal/first-role-verdict.json"
      - name: Tribunal verify D05 D31 D32 distinct OIDC workloads and hold release
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-d05-verified-actor-training-v1.mjs tribunal \
            "$RUNNER_TEMP/seo-corpus/d05-actor/submissions.json" \
            "$RUNNER_TEMP/seo-corpus/d05-actor/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/d05-qa.json" \
            "$RUNNER_TEMP/seo-corpus/qa/identity.json" \
            "$RUNNER_TEMP/seo-corpus/d05-d32/feedback.json" \
            "$RUNNER_TEMP/seo-corpus/d05-d32/identity.json" \
            "$RUNNER_TEMP/seo-corpus/tribunal/identity.json" \
            "$RUNNER_TEMP/seo-corpus/tribunal/d05-verdict.json"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-corpus-tribunal-v1
          path: |
            ${{ runner.temp }}/seo-corpus/tribunal/verdict.json
            ${{ runner.temp }}/seo-corpus/tribunal/identity.json
            ${{ runner.temp }}/seo-corpus/tribunal/first-role-verdict.json
            ${{ runner.temp }}/seo-corpus/tribunal/d05-verdict.json
          retention-days: 14
          if-no-files-found: error

  seo-corpus-sandbox-writer:
    needs: [seo-corpus-worker, seo-corpus-qa, seo-corpus-tribunal]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seo-corpus-worker-v1
          path: ${{ runner.temp }}/seo-corpus/worker
      - uses: actions/download-artifact@v4
        with:
          name: seo-corpus-qa-v1
          path: ${{ runner.temp }}/seo-corpus/qa
      - uses: actions/download-artifact@v4
        with:
          name: seo-corpus-tribunal-v1
          path: ${{ runner.temp }}/seo-corpus/tribunal
      - name: Authenticate fourth scoped GitHub OIDC job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seo-write-lab"
          node cerebro/seo-enterprise/v2/runtime/seo-gh-oidc-workload-v1.mjs \
            "$RUNNER_TEMP/seo-write-lab/identity.json"
      - name: Actually write editorial proposal files to isolated runner with backup/rollback canary
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/seo-enterprise/v2/runtime/seo-draft-writer-lab-v1.mjs write \
            "$RUNNER_TEMP/seo-corpus/worker/report.json" \
            "$RUNNER_TEMP/seo-corpus/qa/report.json" \
            "$RUNNER_TEMP/seo-corpus/tribunal/verdict.json" \
            "$RUNNER_TEMP/seo-corpus/worker/identity.json" \
            "$RUNNER_TEMP/seo-corpus/qa/identity.json" \
            "$RUNNER_TEMP/seo-corpus/tribunal/identity.json" \
            "$RUNNER_TEMP/seo-write-lab/identity.json" \
            "$RUNNER_TEMP/seo-write-lab/output" \
            "$RUNNER_TEMP/seo-write-lab/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: seo-editorial-write-lab-v1
          path: |
            ${{ runner.temp }}/seo-write-lab/output/seo-editorial-draft-bundle-v1
            ${{ runner.temp }}/seo-write-lab/receipt.json
          retention-days: 14
          if-no-files-found: error

