name: App Restoration Build Gate

on:
  push:
    branches:
      - app-restoration-reconcile-current-main-20260915
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/app-restoration-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-restoration-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_FENIX_ENV: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Materialize and verify document extractor candidate
        run: |
          node scripts/build-fenix-document-extract-candidate.mjs --write
          node scripts/verify-fenix-document-extract-candidate.mjs
      - name: Group A + B + D restoration contracts
        run: npx playwright test tests/participant-labor-contract.spec.ts tests/app-restoration-ui-contract.spec.ts tests/document-person-projection-contract.spec.ts tests/document-person-e2e-contract.spec.ts tests/document-extract-v12-contract.spec.ts --reporter=line
      - name: TypeScript and Vite build
        run: npm run build
