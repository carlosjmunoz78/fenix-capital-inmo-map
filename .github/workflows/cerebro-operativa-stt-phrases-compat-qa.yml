name: Operativa STT phrases compatibility · LAB QA
on:
  push:
    branches:
      - fix/operativa-v3-phrases-not-supported-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Static voice compatibility and owner contract
        run: node --test tests/cerebro-operativa-voice-phrases-compat.test.mjs tests/cerebro-operativa-v3-live-bridge-contract.test.mjs tests/cerebro-operativa-audio-device-diagnostic.test.mjs
      - name: Locked dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript and Vite
        run: npm run build
      - name: Chromium installation
        run: npx playwright install --with-deps chromium
      - name: Synthetic recognition with phrase API but unsupported provider
        env:
          VITE_FENIX_ENV: test
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: operativa-e2e-not-a-real-key
        run: npx playwright test tests/cerebro-operativa-v3-live-bridge-e2e.spec.ts --project=desktop-chromium --reporter=line
