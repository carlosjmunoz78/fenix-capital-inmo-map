name: CEREBRO Batch07 AUD001 V1

on:
  push:
    branches: [cerebro/close-179-per-engine-autonomy-v1-20261102]
    paths:
      - 'cerebro/audit/aud001-immutable-audit-v1.mjs'
      - 'cerebro/tests/aud001-immutable-audit-v1.test.mjs'
      - 'cerebro/governance/aud001-policy-v1.json'
      - 'cerebro/missions/close-batch07-aud001-v1.mjs'
      - '.github/workflows/cerebro-batch07-aud001-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OUT: /tmp/cerebro-batch07-aud001
jobs:
  aud001-autonomy-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Verify isolated branch
        run: test "$GITHUB_REF_NAME" = 'cerebro/close-179-per-engine-autonomy-v1-20261102'
      - name: Validate canonical registry and factory
        run: |
          set -euo pipefail
          cd cerebro
          npm run validate
          node factory-v1.mjs validate --registry registry/engine-registry.v1.json
      - name: Rebuild all prior certified evidence
        run: |
          set -euo pipefail
          node cerebro/missions/close-orch-hex-autonomy-v1.mjs
          node cerebro/missions/close-batch07-iam001-v1.mjs
          node cerebro/missions/close-batch07-job-route-v1.mjs
          node cerebro/missions/close-batch07-observ001-v1.mjs
          node cerebro/missions/close-batch07-evt001-v1.mjs
          node cerebro/missions/close-batch07-qa001-v1.mjs
          node cerebro/missions/close-batch07-cmd001-v1.mjs
          node cerebro/missions/close-batch07-chat001-v1.mjs
          node cerebro/missions/close-batch07-ctx001-v1.mjs
          node cerebro/missions/close-batch07-actgw001-v1.mjs
      - name: Execute AUD-001 closure mission
        run: node cerebro/missions/close-batch07-aud001-v1.mjs
      - name: Re-run Strict179 and require 38 of 179
        run: |
          set -euo pipefail
          node cerebro/missions/audit-179-autonomy-readiness-v1.mjs --out "$OUT"
          node <<'NODE'
          const fs=require('fs');const report=JSON.parse(fs.readFileSync(process.env.OUT+'/AUTONOMY_READINESS_BASELINE.json'));const s=JSON.parse(fs.readFileSync(process.env.OUT+'/SUMMARY.json'));const ids=['ORCH-001','HEX-001','IAM-001','JOB-001','ROUTE-001','OBSERV-001','EVT-001','QA-001','CMD-001','CHAT-001','CTX-001','ACTGW-001','AUD-001'];const selected=ids.map(id=>report.engines.find(x=>x.engine_id===id));if(selected.some(x=>!x))throw new Error('Selected engine missing');for(const e of selected)if(e.gate_count!==12||!e.autonomous_prod_ready)throw new Error(`${e.engine_id} ${e.gate_count}/12 ${(e.readiness_blockers||[]).join(',')}`);if(s.autonomous_prod_ready<38)throw new Error(`Expected 38, got ${s.autonomous_prod_ready}`);if(s.prod_writes!==false||s.trading_touched!==false||s.additional_cost_eur!==0)throw new Error('safety drift');fs.writeFileSync(process.env.OUT+'/BATCH07_AUD001_DIAGNOSTIC.json',JSON.stringify({engines:selected,summary:s},null,2));
          NODE
      - name: Upload Batch07 AUD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-batch07-aud001-${{ github.run_id }}
          path: |
            /tmp/cerebro-batch07-aud001/
            cerebro/evidence/orch-hex-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-iam001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-job-route-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-observ001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-evt001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-qa001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-cmd001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-chat001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-ctx001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-actgw001-autonomy-closure/2026-11-02/
            cerebro/evidence/batch07-aud001-autonomy-closure/2026-11-02/
          if-no-files-found: error
          retention-days: 30
