name: CEREBRO Multi-company LRN-001 Continuation PREPROD V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/multicompany/lrn001-autonomous-continuation-v1.mjs'
      - 'cerebro/multicompany/sql/lrn001-autonomous-continuation-preprod-v1.sql'
      - 'cerebro/multicompany/rollback/lrn001-autonomous-continuation-preprod-v1.rollback.sql'
      - 'cerebro/tests/lrn001-autonomous-continuation-v1.test.mjs'
      - 'cerebro/tests/lrn001-autonomous-continuation-preprod-persistence-v1.test.mjs'
      - '.github/workflows/cerebro-lrn001-multicompany-preprod-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/multicompany/lrn001-autonomous-continuation-v1.mjs'
      - 'cerebro/multicompany/sql/lrn001-autonomous-continuation-preprod-v1.sql'
      - 'cerebro/multicompany/rollback/lrn001-autonomous-continuation-preprod-v1.rollback.sql'
      - 'cerebro/tests/lrn001-autonomous-continuation-v1.test.mjs'
      - 'cerebro/tests/lrn001-autonomous-continuation-preprod-persistence-v1.test.mjs'
      - '.github/workflows/cerebro-lrn001-multicompany-preprod-v1.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-lrn001-multicompany-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lrn001-multicompany-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Validate all CEREBRO contracts
        working-directory: cerebro
        run: |
          npm run validate
          npm test
      - name: Focused LRN-001 multi-company proof
        run: |
          node --test cerebro/tests/lrn001-autonomous-continuation-v1.test.mjs cerebro/tests/lrn001-autonomous-continuation-preprod-persistence-v1.test.mjs
      - name: Assert preservation-first boundaries
        shell: bash
        run: |
          set -euo pipefail
          runtime='cerebro/multicompany/lrn001-autonomous-continuation-v1.mjs'
          migration='cerebro/multicompany/sql/lrn001-autonomous-continuation-preprod-v1.sql'
          rollback='cerebro/multicompany/rollback/lrn001-autonomous-continuation-preprod-v1.rollback.sql'
          grep -F "LRN001_MULTICOMPANY_ENGINE_ID='LRN-001'" "$runtime"
          grep -F "LRN001_MULTICOMPANY_ENVIRONMENT='PREPROD'" "$runtime"
          grep -F "buildUniversalLearningEventReport" "$runtime"
          grep -F "MIXED_COMPANY_LEARNING_BATCH" "$runtime"
          grep -F "PREPROD_CONTINUATION_ELIGIBLE" "$runtime"
          grep -F "canonical_knowledge_write_authorized:false" "$runtime"
          grep -F "v_green_count<>17" "$migration"
          grep -F "v_verdict<>'NEW_BETTER'" "$migration"
          grep -F 'cerebro_lrn001_record_preprod' "$migration"
          grep -F 'enable row level security' "$migration"
          grep -F 'to service_role' "$migration"
          ! grep -F 'fenix_prod.' "$migration"
          ! grep -Eqi '\btruncate\b|\bdelete[[:space:]]+from\b' "$migration"
          ! grep -Fi 'cascade' "$rollback"
      - name: Record boundary
        run: |
          echo 'LRN-001 reuses Universal Learning Ingress; no parallel learner is created.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Continuation is tenant-bound PREPROD only and requires OLD-vs-NEW + hard gates + NEW_BETTER tribunal + rollback evidence.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No canonical knowledge auto-write, PROD authority, Trading access or additional cost is introduced.' >> "$GITHUB_STEP_SUMMARY"
