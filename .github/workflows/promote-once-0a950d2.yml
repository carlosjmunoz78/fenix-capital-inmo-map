name: Promote exact validated candidate once

on:
  push:
    branches: [preprod-app-phase1]
    paths:
      - '.github/workflows/promote-once-0a950d2.yml'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 0a950d2d0cdfac9a47de17c76e6d4f89b8e8036a
          RUN_ID: 33982195410
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_SHA"
          test "$(jq -r '.head_branch' <<<"$run_json")" = preprod-app-phase1
      - name: Download exact immutable candidate
        uses: actions/download-artifact@v4
        with:
          name: fenix-prod-candidate-0a950d2d0cdfac9a47de17c76e6d4f89b8e8036a
          path: candidate
          run-id: 33982195410
          github-token: ${{ github.token }}
      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c fenix-prod-candidate.tgz.sha256
          test "$(tr -d '\r\n' < PROD_CANDIDATE_SHA)" = '0a950d2d0cdfac9a47de17c76e6d4f89b8e8036a'
          mkdir ../candidate-dist
          tar -xzf fenix-prod-candidate.tgz -C ../candidate-dist
          test -f ../candidate-dist/index.html
          test -f ../candidate-dist/404.html
          test "$(cat ../candidate-dist/CNAME)" = 'app.fenixcapital.es'
          ! grep -RInE --include='*.js' --include='*.html' --include='*.css' 'functions/v1/[A-Za-z0-9_-]+-test' ../candidate-dist
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: live
      - name: Publish exact bytes
        shell: bash
        run: |
          set -euo pipefail
          cd live
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../candidate-dist/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'deploy(prod): promote 0a950d2d0cdfac9a47de17c76e6d4f89b8e8036a'
            git push origin HEAD:gh-pages
          fi
      - name: Post-deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --output /tmp/prod-index --write-out '%{http_code}' --max-time 20 'https://app.fenixcapital.es/')" || status=000
            if [ "$status" = '200' ] && grep -qi '<!doctype html' /tmp/prod-index; then exit 0; fi
            sleep 10
          done
          exit 1
