name: CEREBRO OPERATIVA · Activity fallback isolated QA
on:
  push:
    branches: [cerebro/operativa-runtime-p0-fix-20261118]
permissions: {contents: read}
jobs:
  activity-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: node --test cerebro/universal/v0/supabase-activity/public-github-fallback.test.mjs
      - run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const src=fs.readFileSync("cerebro/universal/v0/supabase-activity/index.ts","utf8");
            if(!src.includes("withSupabase({auth:\"user\"}")||!src.includes("authorizedOwner(req)")||!src.includes("return json(req,403")||!src.includes("selectPublicGithubRuns"))process.exit(1);
            if(src.includes("GITHUB_TOKEN=gh")||src.includes("service_role_key="))process.exit(2);
            console.log("SOURCE_AUTH_AND_FALLBACK_GATES_OK");
          '
