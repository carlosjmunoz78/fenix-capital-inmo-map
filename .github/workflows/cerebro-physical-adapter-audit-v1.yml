name: CEREBRO Physical Adapter Audit V1

on:
  push:
    paths:
      - 'cerebro/registry/physical-adapter-audit-v1.json'
      - 'cerebro/registry/current-physical-adapter-audit.v1.json'
      - 'cerebro/registry/authorized-execution-device-profile.v1.json'
      - 'cerebro/registry/company-intent-resolution-profile.v1.json'
      - 'cerebro/registry/lead-scoring-contact-confidence-profile.v1.json'
      - 'cerebro/registry/sales-execution-agent-inbox-profile.v1.json'
      - 'cerebro/registry/voice001-outreach-profile.v0.json'
      - 'cerebro/registry/sale001-agenda-commerce-profile.v0.json'
      - 'cerebro/registry/ret-ref-rep-profile.v0.json'
      - 'cerebro/registry/phase12-economic-learning-profile.v0.json'
      - 'cerebro/registry/phase13-marketing-seo-feedback-profile.v0.json'
      - 'cerebro/registry/multimedia-factory-profile.v0.json'
      - 'cerebro/registry/brand-commerce-appfactory-profile.v0.json'
      - 'cerebro/registry/fact001-android-staging-48-183.v0.json'
      - 'cerebro/tests/physical-adapter-audit-v1.test.mjs'
      - 'cerebro/docs/PHYSICAL_ADAPTER_AUDIT_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-physical-adapter-audit-v1.yml'
  pull_request:
    paths:
      - 'cerebro/registry/physical-adapter-audit-v1.json'
      - 'cerebro/registry/current-physical-adapter-audit.v1.json'
      - 'cerebro/registry/authorized-execution-device-profile.v1.json'
      - 'cerebro/registry/company-intent-resolution-profile.v1.json'
      - 'cerebro/registry/lead-scoring-contact-confidence-profile.v1.json'
      - 'cerebro/registry/sales-execution-agent-inbox-profile.v1.json'
      - 'cerebro/registry/voice001-outreach-profile.v0.json'
      - 'cerebro/registry/sale001-agenda-commerce-profile.v0.json'
      - 'cerebro/registry/ret-ref-rep-profile.v0.json'
      - 'cerebro/registry/phase12-economic-learning-profile.v0.json'
      - 'cerebro/registry/phase13-marketing-seo-feedback-profile.v0.json'
      - 'cerebro/registry/multimedia-factory-profile.v0.json'
      - 'cerebro/registry/brand-commerce-appfactory-profile.v0.json'
      - 'cerebro/registry/fact001-android-staging-48-183.v0.json'
      - 'cerebro/tests/physical-adapter-audit-v1.test.mjs'
      - 'cerebro/docs/PHYSICAL_ADAPTER_AUDIT_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-physical-adapter-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-audit-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Physical adapter audit contract
        run: node --test cerebro/tests/physical-adapter-audit-v1.test.mjs
      - name: Canonical registry validation
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression baseline
        working-directory: cerebro
        run: npm test
      - name: Emit audit report
        run: cp cerebro/registry/physical-adapter-audit-v1.json /tmp/physical-adapter-audit-v1.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-physical-adapter-audit-v1
          path: /tmp/physical-adapter-audit-v1.json
          retention-days: 30
