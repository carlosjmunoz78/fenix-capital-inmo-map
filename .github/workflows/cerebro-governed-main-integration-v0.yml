name: CEREBRO Governed Main Integration V0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: cerebro-governed-main-integration-v0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  QA_STATE_BRANCH: cerebro/qa-state-v0
  AUTO_STATE_PATH: cerebro/runtime/auto001-repair-autonomy-state.v0.json
  POLICY_PATH: cerebro/registry/qa-certified-main-integration-classes.v0.json

jobs:
  contract-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove fail-closed main integration contract
        run: node --test cerebro/tests/governed-main-integration-v0.test.mjs

  integrate-certified-auto001:
    needs: contract-proof
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && startsWith(github.head_ref, 'cerebro/auto001-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Load persisted AUTO-001 tribunal evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/integration
          git fetch --no-tags --force origin "+refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH"
          for attempt in 1 2 3 4 5; do
            if git cat-file -e "refs/remotes/origin/$QA_STATE_BRANCH:$AUTO_STATE_PATH" 2>/dev/null; then
              git show "refs/remotes/origin/$QA_STATE_BRANCH:$AUTO_STATE_PATH" > artifacts/integration/auto-state.json
              if [ "$(jq -r '.branch // empty' artifacts/integration/auto-state.json)" = "$GITHUB_HEAD_REF" ]; then
                exit 0
              fi
            fi
            sleep "$attempt"
            git fetch --no-tags --force origin "+refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH"
          done
          echo 'No snapshot-bound AUTO-001 evidence for this branch.' >&2
          exit 1

      - name: Build exact PR facts and enforce bounded diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          mapfile -t FILES < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          LINE_DELTA="$(git diff --numstat "$BASE_SHA...$HEAD_SHA" | awk '{a+=$1;d+=$2} END{print a+d+0}')"
          MESSAGES="$(git log --format='%s%n%b' "$BASE_SHA..$HEAD_SHA")"
          jq -n \
            --arg base_ref "$BASE_REF" --arg base_sha "$BASE_SHA" --arg head_ref "$HEAD_REF" --arg head_sha "$HEAD_SHA" \
            --argjson changed_files "$(printf '%s\n' "${FILES[@]}" | jq -R . | jq -s .)" \
            --argjson line_delta "$LINE_DELTA" --arg commit_messages "$MESSAGES" \
            '{state_type:"CEREBRO_AUTO001_PR_FACTS_V0",base_ref:$base_ref,base_sha:$base_sha,head_ref:$head_ref,head_sha:$head_sha,changed_files:$changed_files,line_delta:$line_delta,commit_messages:$commit_messages}' \
            > artifacts/integration/pr-facts.json
          jq '{base_ref,base_sha,head_ref,head_sha,changed_files,line_delta}' artifacts/integration/pr-facts.json

      - name: Rebuild candidate and rerun certified contracts on exact head
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test \
            cerebro/tests/auto001-preprod-patch-executor-v0.test.mjs \
            cerebro/tests/auto001-repair-validation-v0.test.mjs \
            cerebro/tests/governed-main-integration-v0.test.mjs

      - name: Re-evaluate main integration readiness from immutable evidence
        run: |
          set -euo pipefail
          node cerebro/governance/governed-main-integration-v0.mjs \
            --auto-state artifacts/integration/auto-state.json \
            --pr-facts artifacts/integration/pr-facts.json \
            --policy "$POLICY_PATH" \
            --source src/App.tsx \
            --out artifacts/integration/readiness.json
          jq -e '.status=="MAIN_INTEGRATION_READY" and .authority.main_merge_authorized==true and .authority.prod_deploy_authorized==false and .authority.prod_authorized==false and .authority.prod_write_authorized==false and .safety.prod_write==false and .safety.additional_subscription_eur==0' artifacts/integration/readiness.json >/dev/null
          jq '{status,class_id,transform_id,blockers,authority,next_gate,safety}' artifacts/integration/readiness.json

      - name: Merge certified low-risk patch into main without PROD marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --merge \
            --subject "AUTO-001: governed low-risk main integration (#$PR_NUMBER)" \
            --body "Certified bounded main integration. PREPROD validation, regression, rebuild, rollback and tribunal GREEN. PROD deployment is NOT authorized by this merge."

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-governed-main-integration-v0-${{ github.run_id }}
          path: artifacts/integration/**
          if-no-files-found: warn
          retention-days: 30
