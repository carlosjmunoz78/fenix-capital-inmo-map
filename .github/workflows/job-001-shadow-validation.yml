name: JOB-001 Shadow Validation

on:
  pull_request:
    paths:
      - "cerebro/runtime/job_scheduler.py"
      - "cerebro/runtime/job_shadow_evidence.py"
      - "cerebro/runtime/tests/test_job_scheduler.py"
      - "cerebro/runtime/tests/test_job_shadow_evidence.py"
      - ".github/workflows/job-001-shadow-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run JOB-001 isolated tests
        run: |
          python -m unittest             cerebro.runtime.tests.test_job_scheduler             cerebro.runtime.tests.test_job_shadow_evidence             -v
