name: CEREBRO Skill Supabase Behavioral LAB

on:
  push:
    branches:
      - cerebro-skill-supply-chain-v0-20261006
    paths:
      - 'cerebro/skills/.supabase-behavioral-lab-trigger.json'

permissions:
  contents: read
  actions: read

env:
  CEREBRO_BEHAVIORAL_EXECUTION_ENABLED: 'true'
  CEREBRO_ALLOW_PROD_DATA: 'false'
  CEREBRO_ALLOW_CUSTOMER_DATA: 'false'
  CEREBRO_GEMINI_MODEL: gemini-3.5-flash-lite
  CEREBRO_SUPABASE_PROVIDER_TIMEOUT_MS: '120000'

jobs:
  synthetic-supabase-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate exact one-shot Supabase authorization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('cerebro/skills/.supabase-behavioral-lab-trigger.json','utf8'));
          const ok=t.confirm==='RUN_SYNTHETIC_LAB'&&t.target_candidate==='supabase-postgres-best-practices'&&t.target_candidate_id==='mcpservers-agent-skills:4c2b2478f8fe3bed14df'&&t.expected_upstream_full_name==='supabase/agent-skills'&&t.expected_manifest_path==='skills/supabase-postgres-best-practices/SKILL.md'&&t.scope==='LAB_SYNTHETIC_ONLY'&&t.max_calls===6&&t.max_retries_per_call===0&&t.provider_timeout_ms===120000&&t.paid_fallback===false&&t.allow_prod_data===false&&t.allow_customer_data===false&&t.allow_external_skill_code_execution===false&&t.allow_prod_write===false&&t.allow_trading_access===false&&typeof t.one_shot_id==='string'&&t.one_shot_id.length>=16;
          if(!ok){console.error('Invalid Supabase one-shot LAB trigger');process.exit(1)}
          console.log(JSON.stringify({trigger:'AUTHORIZED_ONE_SHOT_SUPABASE_BRANCH_ONLY',one_shot_id:t.one_shot_id,target:t.target_candidate,target_candidate_id:t.target_candidate_id,max_calls:6,max_retries_per_call:0,provider_timeout_ms:120000,paid_fallback:false,prod_data:false,customer_data:false,external_skill_code:false,prod_write:false,trading:false}));
          NODE

      - name: Wait for GREEN discovery evidence for exactly this branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for i in $(seq 1 42); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "CEREBRO Skill Discovery Scout" --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId,headSha,status,conclusion --jq ".[] | select(.headSha == \"$GITHUB_SHA\" and .status == \"completed\" and .conclusion == \"success\") | .databaseId" | head -n 1)"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::No GREEN discovery evidence for the exact Supabase LAB branch head."
            exit 1
          fi
          RUN_SHA="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          test "$RUN_SHA" = "$GITHUB_SHA"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cerebro-skill-discovery-$RUN_ID" --dir artifacts
          test -f artifacts/cerebro-skill-static-lab-p0.json
          test -f artifacts/cerebro-skill-old-vs-new-p0.json
          test -f artifacts/cerebro-skill-manifests.json
          test -f artifacts/cerebro-skill-wrapper-plans-p0.json
          test -f artifacts/cerebro-skill-license-evidence.json
          test -f artifacts/cerebro-skill-rsi-shadow.json

      - name: Build exact focused Supabase evidence package without mutating discovery evidence
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('cerebro/skills/.supabase-behavioral-lab-trigger.json','utf8'));
          const staticLab=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-static-lab-p0.json','utf8'));
          const oldnew=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-old-vs-new-p0.json','utf8'));
          const licenses=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-license-evidence.json','utf8'));
          const wrappers=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-wrapper-plans-p0.json','utf8'));
          const manifests=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-manifests.json','utf8'));
          const target=t.target_candidate_id;
          const s=(staticLab.results??[]).filter(x=>x.candidate_id===target);
          const o=(oldnew.packages??[]).filter(x=>x.candidate_id===target);
          const l=(licenses.results??[]).filter(x=>x.candidate_id===target);
          const w=(wrappers.plans??[]).filter(x=>x.candidate_id===target);
          const m=(manifests.results??[]).filter(x=>x.candidate_id===target);
          const ok=s.length===1&&s[0].status==='STATIC_LAB_GREEN_FOR_BEHAVIORAL_EVAL'&&Number(s[0].policy_alignment_score)===100&&(s[0].hard_blocks??[]).length===0&&s[0].upstream_full_name===t.expected_upstream_full_name&&s[0].manifest_path===t.expected_manifest_path&&o.length===1&&(o[0].fixtures??[]).length===3&&o[0].candidate?.upstream_full_name===t.expected_upstream_full_name&&l.length===1&&l[0].status==='EXACT_LICENSE_FILE_EVIDENCE'&&l[0].metadata_matches_detected===true&&(l[0].detected_families??[]).includes('MIT')&&w.length===1&&w[0].enabled===false&&w[0].prod_authorized===false&&m.length===1&&m[0].manifest_path===t.expected_manifest_path;
          if(!ok){console.error('Exact focused Supabase evidence is not GREEN/fail-closed');process.exit(1)}
          fs.writeFileSync('artifacts/cerebro-skill-static-lab-supabase.manual.json',JSON.stringify({...staticLab,candidates_total:1,status_counts:{STATIC_LAB_GREEN_FOR_BEHAVIORAL_EVAL:1},results:s},null,2)+'\n');
          fs.writeFileSync('artifacts/cerebro-skill-old-vs-new-supabase.manual.json',JSON.stringify({...oldnew,packages_total:1,packages:o},null,2)+'\n');
          fs.writeFileSync('artifacts/cerebro-skill-license-evidence-supabase.manual.json',JSON.stringify({...licenses,results:l},null,2)+'\n');
          fs.writeFileSync('artifacts/cerebro-skill-wrapper-plans-supabase.manual.json',JSON.stringify({...wrappers,wrapper_plans:1,enabled_wrappers:0,plans:w},null,2)+'\n');
          console.log(JSON.stringify({candidate_id:target,static_status:s[0].status,policy_alignment_score:s[0].policy_alignment_score,hard_blocks:s[0].hard_blocks,fixtures:o[0].fixtures.length,license:l[0].detected_families,wrapper_enabled:false,prod_authorized:false}));
          NODE

      - name: Bind current Gemini free-tier readiness without exposing secret value
        env:
          CEREBRO_GEMINI_KEY_PRESENT: ${{ secrets.CEREBRO_GEMINI_API_KEY != '' }}
          CEREBRO_GEMINI_POLICY_GREEN: 'false'
          CEREBRO_GEMINI_FREE_QUOTA_GUARD: 'true'
        run: node cerebro/skills/skill-provider-binding-from-env.mjs --providers cerebro/skills/zero-cost-provider-evidence.v0.json --output artifacts/cerebro-skill-provider-binding.supabase.manual.json

      - name: Select verified Gemini zero-cost synthetic route
        run: node cerebro/skills/skill-zero-cost-route-audit.mjs --providers artifacts/cerebro-skill-provider-binding.supabase.manual.json --oldnew artifacts/cerebro-skill-old-vs-new-supabase.manual.json --preferred-provider google-gemini-api-free --output artifacts/cerebro-skill-zero-cost-route.supabase.manual.json

      - name: Build hard six-call quota with zero retries and no paid fallback
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {buildFreeQuotaPlan} from './cerebro/skills/skill-free-quota-guard.mjs';
          const oldnew=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-old-vs-new-supabase.manual.json','utf8'));
          const route=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-zero-cost-route.supabase.manual.json','utf8'));
          const report=buildFreeQuotaPlan(oldnew,route,{limits:{max_packages:1,max_fixtures_per_package:3,max_model_calls:6,max_retries_per_call:0,paid_fallback:false,prod_data:false,customer_data:false}});
          if(!report.executable||report.planned_calls.total!==6||report.limits.max_model_calls!==6||report.limits.max_retries_per_call!==0){console.error('Hard six-call Supabase quota not established');process.exit(1)}
          fs.writeFileSync('artifacts/cerebro-skill-free-quota-plan.supabase.manual.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({provider_id:report.provider_id,planned_calls:report.planned_calls,max_model_calls:6,max_retries_per_call:0,paid_fallback:false}));
          NODE

      - name: Open behavioral gate for synthetic Supabase package only
        run: node cerebro/skills/skill-behavioral-execution-gate.mjs --oldnew artifacts/cerebro-skill-old-vs-new-supabase.manual.json --route artifacts/cerebro-skill-zero-cost-route.supabase.manual.json --quota artifacts/cerebro-skill-free-quota-plan.supabase.manual.json --output artifacts/cerebro-skill-behavioral-execution-gate.supabase.manual.json

      - name: Execute exactly six synthetic baseline-vs-wrapper calls on verified Gemini model
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CEREBRO_GEMINI_API_KEY: ${{ secrets.CEREBRO_GEMINI_API_KEY }}
          CEREBRO_GEMINI_MODEL: gemini-3.5-flash-lite
          CEREBRO_SUPABASE_PROVIDER_TIMEOUT_MS: '120000'
        run: node cerebro/skills/skill-behavioral-proxy-runner.mjs --oldnew artifacts/cerebro-skill-old-vs-new-supabase.manual.json --manifests artifacts/cerebro-skill-manifests.json --gate artifacts/cerebro-skill-behavioral-execution-gate.supabase.manual.json --quota artifacts/cerebro-skill-free-quota-plan.supabase.manual.json --route artifacts/cerebro-skill-zero-cost-route.supabase.manual.json --output artifacts/cerebro-skill-behavioral-proxy.supabase.manual.json

      - name: Verify exact call count provider model wrapper and no unsafe execution
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-behavioral-proxy.supabase.manual.json','utf8'));
          const arms=(p.results??[]).flatMap(r=>(r.fixture_results??[]).flatMap(f=>f.arms??[]));
          const candidateArms=arms.filter(a=>a.arm==='CANDIDATE_SKILL_PROXY');
          const baselineArms=arms.filter(a=>a.arm==='BASELINE_PROXY');
          const ok=p.status==='PROXY_COMPLETE'&&p.calls_executed===6&&p.provider_id==='google-gemini-api-free'&&p.provider_timeout_ms===120000&&arms.length===6&&candidateArms.length===3&&baselineArms.length===3&&arms.every(a=>a.model==='gemini-3.5-flash-lite')&&candidateArms.every(a=>a.wrapper_applied===true&&a.wrapper_id==='skillwrap:cerebro-supabase-postgres-v0.1.0'&&a.wrapper_prod_authorized===false&&a.wrapper_trading_access===false)&&baselineArms.every(a=>a.wrapper_applied===false)&&p.synthetic_only===true&&p.external_skill_code_executed===false&&p.prod_authorized===false;
          if(!ok){console.error('Supabase behavioral execution invariant failed');process.exit(1)}
          console.log(JSON.stringify({status:p.status,calls_executed:6,provider_id:p.provider_id,model:'gemini-3.5-flash-lite',provider_timeout_ms:p.provider_timeout_ms,candidate_wrapper_applied:3,baseline_wrapper_applied:0,synthetic_only:true,external_skill_code_executed:false,prod_authorized:false}));
          NODE

      - name: Run fixed-threshold deterministic independent judge
        run: node cerebro/skills/skill-independent-judge.mjs --behavioral-results artifacts/cerebro-skill-behavioral-proxy.supabase.manual.json --output artifacts/cerebro-skill-independent-judge.supabase.manual.json

      - name: Prove focused wrapper rollback and rebuild
        run: node cerebro/skills/skill-rollback-proof.mjs --wrappers artifacts/cerebro-skill-wrapper-plans-supabase.manual.json --output artifacts/cerebro-skill-rollback-proof.supabase.manual.json

      - name: Run focused evidence-only Skill Tribunal
        run: node cerebro/skills/skill-tribunal.mjs --static-lab artifacts/cerebro-skill-static-lab-supabase.manual.json --licenses artifacts/cerebro-skill-license-evidence-supabase.manual.json --behavioral-results artifacts/cerebro-skill-behavioral-proxy.supabase.manual.json --independent-judge artifacts/cerebro-skill-independent-judge.supabase.manual.json --rollback artifacts/cerebro-skill-rollback-proof.supabase.manual.json --route artifacts/cerebro-skill-zero-cost-route.supabase.manual.json --rsi-shadow artifacts/cerebro-skill-rsi-shadow.json --output artifacts/cerebro-skill-tribunal.supabase.manual.json

      - name: Assess PREPROD review readiness without promotion
        run: node cerebro/skills/skill-promotion-readiness.mjs --static-lab artifacts/cerebro-skill-static-lab-supabase.manual.json --oldnew artifacts/cerebro-skill-old-vs-new-supabase.manual.json --route artifacts/cerebro-skill-zero-cost-route.supabase.manual.json --quota artifacts/cerebro-skill-free-quota-plan.supabase.manual.json --behavioral-gate artifacts/cerebro-skill-behavioral-execution-gate.supabase.manual.json --rsi-shadow artifacts/cerebro-skill-rsi-shadow.json --behavioral-results artifacts/cerebro-skill-behavioral-proxy.supabase.manual.json --independent-judge artifacts/cerebro-skill-independent-judge.supabase.manual.json --tribunal artifacts/cerebro-skill-tribunal.supabase.manual.json --rollback artifacts/cerebro-skill-rollback-proof.supabase.manual.json --output artifacts/cerebro-skill-promotion-readiness.supabase.manual.json

      - name: Verify no unsafe promotion
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-behavioral-proxy.supabase.manual.json','utf8'));
          const j=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-independent-judge.supabase.manual.json','utf8'));
          const r=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-rollback-proof.supabase.manual.json','utf8'));
          const t=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-tribunal.supabase.manual.json','utf8'));
          const pr=JSON.parse(fs.readFileSync('artifacts/cerebro-skill-promotion-readiness.supabase.manual.json','utf8'));
          if(p.prod_authorized!==false||p.external_skill_code_executed!==false||j.prod_authorized!==false||j.tribunal_satisfied!==false||r.prod_authorized!==false||t.prod_authorized!==false||t.autonomous_promotion_authorized!==false||pr.merge_authorized!==false||pr.prod_authorized!==false||pr.autonomous_promotion_authorized!==false) process.exit(1);
          console.log(JSON.stringify({safe:true,proxy_status:p.status,calls_executed:p.calls_executed,judge_decision:j.decision,rollback_status:r.status,tribunal_decision:t.decision,promotion_readiness:pr.status,human_required:pr.human_required??null,prod_authorized:false,auto_promotion:false}));
          NODE

      - name: Upload Supabase synthetic behavioral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-supabase-behavioral-lab-${{ github.run_id }}
          path: |
            artifacts/cerebro-skill-static-lab-supabase.manual.json
            artifacts/cerebro-skill-old-vs-new-supabase.manual.json
            artifacts/cerebro-skill-license-evidence-supabase.manual.json
            artifacts/cerebro-skill-wrapper-plans-supabase.manual.json
            artifacts/cerebro-skill-provider-binding.supabase.manual.json
            artifacts/cerebro-skill-zero-cost-route.supabase.manual.json
            artifacts/cerebro-skill-free-quota-plan.supabase.manual.json
            artifacts/cerebro-skill-behavioral-execution-gate.supabase.manual.json
            artifacts/cerebro-skill-behavioral-proxy.supabase.manual.json
            artifacts/cerebro-skill-independent-judge.supabase.manual.json
            artifacts/cerebro-skill-rollback-proof.supabase.manual.json
            artifacts/cerebro-skill-tribunal.supabase.manual.json
            artifacts/cerebro-skill-promotion-readiness.supabase.manual.json
          if-no-files-found: warn
          retention-days: 14
