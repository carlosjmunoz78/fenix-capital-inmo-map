name: FACT001 Vercel service LAB OIDC and reversible write tests
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - .github/workflows/fact001-vercel-service-lab-tests.yml
      - cerebro/connectors/universal/supabase/vercel-service-lab/*.mjs
      - cerebro/connectors/universal/supabase/vercel-service-lab/*.ts
      - cerebro/connectors/universal/supabase/vercel-service-lab/tests/**
permissions:
  contents: read
jobs:
  service-lab-static:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify OAuth JWT claims, LAB fixed routes, reversible PATCH and timeout compensation
        run: node --test cerebro/connectors/universal/supabase/vercel-service-lab/tests/*.test.mjs
      - name: Scan sidecar preprod contracts (no provider secret in source)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='cerebro/connectors/universal/supabase/vercel-service-lab';
          const w=fs.readFileSync(root+'/lab-write.mjs','utf8');
          const api=fs.readFileSync(root+'/index.ts','utf8');
          const p=fs.readFileSync(root+'/policy.mjs','utf8');
          if(!w.includes('BASELINE_NOT_NULL')||!w.includes('ROLLBACK_NOT_VERIFIED')||!w.includes("project_framework_after:null"))throw Error('ROLLBACK_NOT_ENFORCED');
          if(!p.includes("event_name!=='push'")||!api.includes('verifyGitHubOidc(bearer(req))'))throw Error('SIGNED_IDENTITY_MISSING');
          if(api.includes('console.log(token)')||w.includes('SUPABASE_SERVICE_ROLE_KEY')||w.includes('api.vercel.com/v1/billing'))throw Error('SECRET_OR_BILLING_ACCESS_DENIED');
          console.log('FACT001_SERVICE_WRITES_LAB_ONLY=true');
          console.log('FACT001_SERVICE_PROD_WRITES=0');
          NODE
