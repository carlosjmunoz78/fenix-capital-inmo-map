name: CEREBRO Skill Chain Driver V0

on:
  workflow_run:
    workflows:
      - CEREBRO Skill Discovery Scout
    types: [completed]
  schedule:
    - cron: '29 * * * *'
  push:
    branches:
      - main
      - cerebro/skill-chain-runid-fix-v1-20261014
    paths:
      - '.github/workflows/cerebro-skill-chain-driver-v0.yml'
  workflow_dispatch:

concurrency:
  group: cerebro-skill-chain-driver-v0
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  AUTOLOOP_STATE_BRANCH: cerebro/skill-autoloop-state-v0
  AUTOLOOP_STATE_PATH: cerebro/runtime/skill-autoloop-state.v0.json
  AUTOLOOP_WORKFLOW: cerebro-skill-autoloop-safe.yml
  SAFE_HANDLER_WORKFLOW: cerebro-skill-autoloop-safe-handler.yml
  PRIORITY_LADDER_WORKFLOW: cerebro-skill-priority-ladder-v0.yml
  MAX_CHAIN_STEPS: '40'

jobs:
  route-next-safe-skill:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load and validate canonical AutoLoop state
        run: |
          set -euo pipefail
          mkdir -p artifacts/skill-chain
          git fetch --force --no-tags origin "refs/heads/$AUTOLOOP_STATE_BRANCH:refs/remotes/origin/$AUTOLOOP_STATE_BRANCH"
          git show "refs/remotes/origin/$AUTOLOOP_STATE_BRANCH:$AUTOLOOP_STATE_PATH" > artifacts/skill-chain/state.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {validateSafeAutoloopState} from './cerebro/skills/skill-autoloop-controller.mjs';
          const s=JSON.parse(fs.readFileSync('artifacts/skill-chain/state.json','utf8'));
          const v=validateSafeAutoloopState(s);
          const a=s.safe_autonomy??{};
          if(!v.green||a.prod_write!==false||a.external_skill_code_execution!==false||a.customer_data!==false||a.trading!==false||a.paid_fallback!==false||a.additional_cost_budget_eur!==0) throw new Error('SKILL_CHAIN_SAFETY_INVARIANT_FAILED');
          NODE

      - name: Resolve safe bootstrap route
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('artifacts/skill-chain/state.json','utf8'));
          const waiting=Object.keys(s.waiting_safe_handler??{}).length;
          const inFlight=Object.keys(s.in_flight??{}).length;
          const event=process.env.EVENT_NAME;
          let allow=false, target='NONE', reason='NO_SAFE_BOOTSTRAP';
          if(event==='workflow_run') {
            allow=process.env.SOURCE_BRANCH==='main'&&process.env.SOURCE_CONCLUSION==='success';
            if(!allow) reason='DISCOVERY_SOURCE_NOT_AUTHORIZED';
          } else if(event==='schedule') allow=true;
          else if(event==='workflow_dispatch'||event==='push') {
            allow=process.env.CURRENT_REF==='refs/heads/main';
            if(!allow) reason='NON_MAIN_DRY_RUN_ONLY';
          }
          if(allow) {
            if(inFlight>0) reason='IN_FLIGHT_PRESENT_FAIL_CLOSED';
            else if(waiting>0) {target='SAFE_HANDLER'; reason='RESUME_WAITING_SAFE';}
            else {target='AUTOLOOP_SAFE'; reason='BOOTSTRAP_P0_AUTOLOOP';}
          }
          const report={schema_version:'2.1.0',event,waiting_safe_handler:waiting,in_flight:inFlight,target,reason,allow_dispatch:allow,prod_authorized:false,prod_write:false,customer_data_used:false,external_skill_code_execution:false,trading_access:false,paid_fallback:false,additional_cost_eur:0};
          fs.writeFileSync('artifacts/skill-chain/route.json',JSON.stringify(report,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`target=${target}\nallow_dispatch=${allow}\n`);
          console.log(JSON.stringify(report));
          NODE

      - name: Prove bootstrap routing matrix
        run: |
          node --input-type=module - <<'NODE'
          function r({event,ref='refs/heads/main',sourceBranch='main',sourceConclusion='success',waiting=0,inFlight=0}){
            let allow=false,target='NONE';
            if(event==='workflow_run') allow=sourceBranch==='main'&&sourceConclusion==='success';
            else if(event==='schedule') allow=true;
            else if(event==='workflow_dispatch'||event==='push') allow=ref==='refs/heads/main';
            if(allow&&inFlight===0) target=waiting>0?'SAFE_HANDLER':'AUTOLOOP_SAFE';
            return target;
          }
          const cases=[
            [{event:'workflow_run'},'AUTOLOOP_SAFE'],
            [{event:'workflow_run',waiting:1},'SAFE_HANDLER'],
            [{event:'workflow_run',sourceBranch:'dev'},'NONE'],
            [{event:'schedule'},'AUTOLOOP_SAFE'],
            [{event:'schedule',waiting:1},'SAFE_HANDLER'],
            [{event:'schedule',inFlight:1},'NONE'],
            [{event:'push'},'AUTOLOOP_SAFE'],
            [{event:'push',ref:'refs/heads/test'},'NONE']
          ];
          for(const [input,expected] of cases){const actual=r(input); if(actual!==expected) throw new Error(`ROUTING_MATRIX_FAILED ${actual} != ${expected}`);}
          NODE

      - name: Run bounded autonomous safe chain
        if: steps.route.outputs.allow_dispatch == 'true' && steps.route.outputs.target != 'NONE'
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_TARGET: ${{ steps.route.outputs.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/skill-chain/children artifacts/skill-chain/priority
          : > artifacts/skill-chain/chain.jsonl
          target="$INITIAL_TARGET"
          step=0
          seen='|'
          stop_reason='MAX_CHAIN_STEPS_REACHED'

          refresh_state() {
            git fetch --force --no-tags origin "refs/heads/$AUTOLOOP_STATE_BRANCH:refs/remotes/origin/$AUTOLOOP_STATE_BRANCH" >/dev/null 2>&1
            git show "refs/remotes/origin/$AUTOLOOP_STATE_BRANCH:$AUTOLOOP_STATE_PATH" > artifacts/skill-chain/state.json
            node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('artifacts/skill-chain/state.json','utf8'));const a=s.safe_autonomy||{};if(a.prod_write!==false||a.external_skill_code_execution!==false||a.customer_data!==false||a.trading!==false||a.paid_fallback!==false||a.additional_cost_budget_eur!==0)throw new Error('CHAIN_STATE_UNSAFE');"
          }

          state_sha() {
            git rev-parse "refs/remotes/origin/$AUTOLOOP_STATE_BRANCH"
          }

          workflow_for() {
            case "$1" in
              AUTOLOOP_SAFE) printf '%s' "$AUTOLOOP_WORKFLOW" ;;
              SAFE_HANDLER) printf '%s' "$SAFE_HANDLER_WORKFLOW" ;;
              PRIORITY_LADDER) printf '%s' "$PRIORITY_LADDER_WORKFLOW" ;;
              *) return 1 ;;
            esac
          }

          dispatch_and_wait() {
            local logical="$1" wf before ids candidate run_id='' attempt
            wf="$(workflow_for "$logical")"
            before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --event workflow_dispatch --branch main --limit 30 --json databaseId --jq '.[].databaseId' | tr '\n' ' ')"
            # Keep stdout pristine: this function must return only the numeric run id.
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main >&2
            for attempt in $(seq 1 30); do
              ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --event workflow_dispatch --branch main --limit 30 --json databaseId --jq '.[].databaseId')"
              while IFS= read -r candidate; do
                [ -z "$candidate" ] && continue
                case " $before " in *" $candidate "*) ;; *) run_id="$candidate"; break ;; esac
              done <<< "$ids"
              [ -n "$run_id" ] && break
              sleep 2
            done
            [ -n "$run_id" ] || { echo "Unable to resolve child run for $logical" >&2; return 1; }
            printf '%s\n' "$run_id" > "artifacts/skill-chain/children/${step}-${logical}.run_id"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 3 >&2
            printf '%s\n' "$run_id"
          }

          refresh_state
          while [ "$target" != 'NONE' ] && [ "$step" -lt "$MAX_CHAIN_STEPS" ]; do
            step=$((step+1))
            before_sha="$(state_sha)"
            signature="${target}:${before_sha}"
            case "$seen" in
              *"|${signature}|"*) stop_reason='STATE_ROUTE_CYCLE_DETECTED_FAIL_CLOSED'; target='NONE'; break ;;
            esac
            seen="${seen}${signature}|"

            logical="$target"
            run_id="$(dispatch_and_wait "$logical")"
            priority_decision=''

            if [ "$logical" = 'PRIORITY_LADDER' ]; then
              rm -rf artifacts/skill-chain/priority/current
              mkdir -p artifacts/skill-chain/priority/current
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "cerebro-skill-discovery-$run_id" --dir artifacts/skill-chain/priority/current
              decision_file="$(find artifacts/skill-chain/priority/current -type f -name decision.json | head -n 1)"
              [ -n "$decision_file" ] || { echo 'Priority Ladder decision evidence missing' >&2; exit 1; }
              priority_decision="$(jq -r '.decision // empty' "$decision_file")"
              cp "$decision_file" "artifacts/skill-chain/priority/${step}-${run_id}-decision.json"
            fi

            refresh_state
            after_sha="$(state_sha)"
            waiting="$(jq '.waiting_safe_handler|length' artifacts/skill-chain/state.json)"
            in_flight="$(jq '.in_flight|length' artifacts/skill-chain/state.json)"
            processed="$(jq '.processed_candidate_ids|length' artifacts/skill-chain/state.json)"

            next='NONE'
            reason='TERMINAL_OR_NO_ELIGIBLE_CANDIDATE'
            if [ "$in_flight" -gt 0 ]; then
              reason='IN_FLIGHT_PRESENT_FAIL_CLOSED'
            elif [ "$logical" = 'AUTOLOOP_SAFE' ]; then
              if [ "$waiting" -gt 0 ]; then next='SAFE_HANDLER'; reason='AUTOLOOP_CHECKPOINT_READY'; else next='PRIORITY_LADDER'; reason='P0_EXHAUSTED_TRY_P1_P2'; fi
            elif [ "$logical" = 'SAFE_HANDLER' ]; then
              if [ "$waiting" -gt 0 ]; then next='SAFE_HANDLER'; reason='SAFE_HANDLER_CONTINUE_SAFE_QUEUE'; else next='PRIORITY_LADDER'; reason='HANDLER_TERMINAL_NEXT_CANDIDATE'; fi
            elif [ "$logical" = 'PRIORITY_LADDER' ]; then
              if [ "$waiting" -gt 0 ]; then next='SAFE_HANDLER'; reason='LADDER_CHECKPOINT_READY';
              elif [ "$priority_decision" = 'DEFER_TO_EXISTING_P0_AUTOLOOP' ]; then next='AUTOLOOP_SAFE'; reason='LADDER_DEFERRED_TO_P0_AUTOLOOP';
              else reason='LADDER_TERMINAL_OR_NO_ELIGIBLE_CANDIDATE'; fi
            fi

            node -e "const fs=require('fs');const [step,logical,run,before,after,waiting,inflight,processed,decision,next,reason]=process.argv.slice(1);fs.appendFileSync('artifacts/skill-chain/chain.jsonl',JSON.stringify({step:Number(step),logical_target:logical,child_run_id:Number(run),before_state_sha:before,after_state_sha:after,state_mutated:before!==after,waiting_safe_handler:Number(waiting),in_flight:Number(inflight),processed_candidate_count:Number(processed),priority_decision:decision||null,next_target:next,reason,prod_authorized:false,prod_write:false,customer_data_used:false,external_skill_code_execution:false,trading_access:false,paid_fallback:false,additional_cost_eur:0})+'\\n');" "$step" "$logical" "$run_id" "$before_sha" "$after_sha" "$waiting" "$in_flight" "$processed" "$priority_decision" "$next" "$reason"
            target="$next"
            stop_reason="$reason"
          done

          refresh_state
          node --input-type=module - "$step" "$stop_reason" "$target" <<'NODE'
          import fs from 'node:fs';
          const [steps,stopReason,target]=process.argv.slice(2);
          const text=fs.readFileSync('artifacts/skill-chain/chain.jsonl','utf8').trim();
          const rows=text?text.split('\n').map(JSON.parse):[];
          const state=JSON.parse(fs.readFileSync('artifacts/skill-chain/state.json','utf8'));
          const summary={schema_version:'2.1.0',status:'BOUNDED_SAFE_CHAIN_COMPLETE',steps_executed:Number(steps),stop_reason:stopReason,remaining_target:target,processed_candidate_count:(state.processed_candidate_ids??[]).length,waiting_safe_handler:Object.keys(state.waiting_safe_handler??{}).length,in_flight:Object.keys(state.in_flight??{}).length,human_required:Object.keys(state.waiting_human??{}).length,child_runs:rows,prod_authorized:false,prod_write:false,customer_data_used:false,external_skill_code_execution:false,trading_access:false,paid_fallback:false,additional_cost_eur:0};
          fs.writeFileSync('artifacts/skill-chain/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary));
          NODE

      - name: Enforce immutable final safety boundary
        if: always()
        run: |
          set -euo pipefail
          if [ -f artifacts/skill-chain/state.json ]; then
            node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('artifacts/skill-chain/state.json','utf8'));const a=s.safe_autonomy||{};if(a.prod_write!==false||a.external_skill_code_execution!==false||a.customer_data!==false||a.trading!==false||a.paid_fallback!==false||a.additional_cost_budget_eur!==0)throw new Error('FINAL_SKILL_CHAIN_SAFETY_INVARIANT_FAILED');"
          fi

      - name: Upload immutable chain routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-chain-driver-${{ github.run_id }}
          path: artifacts/skill-chain/**
          if-no-files-found: warn
          retention-days: 30
