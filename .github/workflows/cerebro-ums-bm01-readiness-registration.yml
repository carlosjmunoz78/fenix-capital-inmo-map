name: CEREBRO UMS Evidence Registry Integrity

on:
  push:
    branches:
      - cerebro/ums-qwen3-tts-cpu-probe-20261025
    paths:
      - '.github/workflows/cerebro-ums-bm01-readiness-registration.yml'
      - 'cerebro/media-studio/v2/benchmarks/required-benchmarks.json'
      - 'cerebro/media-studio/v2/evidence/**'
      - 'cerebro/media-studio/v2/runtime/readiness-gate.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all registered evidence and readiness arithmetic
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {evaluateUniversalMediaStudioReadiness} from './cerebro/media-studio/v2/runtime/readiness-gate.mjs';
          const registry=JSON.parse(fs.readFileSync('./cerebro/media-studio/v2/benchmarks/required-benchmarks.json','utf8'));
          const passRows=registry.benchmarks.filter(x=>x.state==='PASS_WITH_EVIDENCE');
          const evidence=[];
          for(const row of passRows){
            const ref=String(row.evidence_ref||'');
            const m=ref.match(/^git:([0-9a-f]{40}):(.+)$/);
            if(!m) throw new Error(`INVALID_EVIDENCE_REF:${row.id}:${ref}`);
            const [,commit,path]=m;
            if(!fs.existsSync(path)) throw new Error(`EVIDENCE_FILE_MISSING:${row.id}:${path}`);
            const raw=fs.readFileSync(path);
            const doc=JSON.parse(raw.toString('utf8'));
            if(doc.status!=='PASS_WITH_EVIDENCE'||doc.benchmark_credit!==true) throw new Error(`EVIDENCE_NOT_PASS:${row.id}`);
            if(doc.benchmark_id!==row.id) throw new Error(`EVIDENCE_BENCHMARK_MISMATCH:${row.id}:${doc.benchmark_id}`);
            if(doc.authority?.prod_authorized!==false||doc.authority?.additional_cost_eur!==0) throw new Error(`EVIDENCE_AUTHORITY_OR_COST_INVALID:${row.id}`);
            evidence.push({benchmark_id:row.id,commit,path,sha256:crypto.createHash('sha256').update(raw).digest('hex')});
          }
          const result=evaluateUniversalMediaStudioReadiness(registry);
          if(result.total_required!==12) throw new Error(`REQUIRED_BENCHMARK_COUNT_CHANGED:${result.total_required}`);
          if(result.passed_with_evidence!==passRows.length) throw new Error(`PASS_ARITHMETIC_MISMATCH:${result.passed_with_evidence}:${passRows.length}`);
          if(result.incomplete.length!==result.total_required-result.passed_with_evidence) throw new Error('INCOMPLETE_ARITHMETIC_MISMATCH');
          if(result.passed_with_evidence<result.total_required && result.ready!==false) throw new Error('UMS_PREMATURE_READY');
          if(result.ready && registry.status!=='READY') throw new Error('REGISTRY_STATUS_NOT_READY_WHEN_GATE_READY');
          if(!result.ready && registry.status!=='NOT_READY') throw new Error('REGISTRY_STATUS_MUST_REMAIN_NOT_READY');
          console.log(JSON.stringify({status:'UMS_EVIDENCE_REGISTRY_GREEN',readiness:result,registered_evidence:evidence,prod_authorized:false,additional_cost_eur:0},null,2));
          NODE
