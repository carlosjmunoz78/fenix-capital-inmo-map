name: CEREBRO Multimedia Zero Cost Physical Inventory V1

on:
  push:
    paths:
      - 'cerebro/runtime/multimedia-zero-cost-physical-inventory-v1.mjs'
      - 'cerebro/scripts/multimedia-zero-cost-physical-probe-v1.mjs'
      - 'cerebro/tests/multimedia-zero-cost-physical-inventory-v1.test.mjs'
      - 'cerebro/registry/multimedia-zero-cost-physical-inventory-v1.json'
      - 'cerebro/docs/MULTIMEDIA_ZERO_COST_PHYSICAL_INVENTORY_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-multimedia-zero-cost-physical-inventory-v1.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/multimedia-zero-cost-physical-inventory-v1.mjs'
      - 'cerebro/scripts/multimedia-zero-cost-physical-probe-v1.mjs'
      - 'cerebro/tests/multimedia-zero-cost-physical-inventory-v1.test.mjs'
      - 'cerebro/registry/multimedia-zero-cost-physical-inventory-v1.json'
      - 'cerebro/docs/MULTIMEDIA_ZERO_COST_PHYSICAL_INVENTORY_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-multimedia-zero-cost-physical-inventory-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-cost-physical-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prohibit package/model installation by contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE '(^|[[:space:]])(apt(-get)?|brew|choco|npm[[:space:]]+install|pnpm[[:space:]]+(add|install)|yarn[[:space:]]+add|pip[0-9]*[[:space:]]+install|curl|wget)[[:space:]]' \
            cerebro/scripts/multimedia-zero-cost-physical-probe-v1.mjs \
            cerebro/runtime/multimedia-zero-cost-physical-inventory-v1.mjs
      - name: Deterministic contract and mutation tests
        run: node --test cerebro/tests/multimedia-zero-cost-physical-inventory-v1.test.mjs
      - name: Read-only physical inventory
        run: node cerebro/scripts/multimedia-zero-cost-physical-probe-v1.mjs /tmp/multimedia-zero-cost-physical-inventory-v1.json
      - name: Verify zero-cost and no-authority assessment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync('/tmp/multimedia-zero-cost-physical-inventory-v1.json', 'utf8'));
          const a = evidence.assessment;
          if (a.safety.install_performed !== false) throw new Error('unexpected install');
          if (a.safety.model_download_performed !== false) throw new Error('unexpected model download');
          if (a.safety.provider_call_performed !== false) throw new Error('unexpected provider call');
          if (a.safety.customer_data_used !== false) throw new Error('unexpected customer data');
          if (a.safety.prod_write_performed !== false) throw new Error('unexpected PROD write');
          if (a.safety.spend_eur !== 0 || a.safety.additional_cost_eur !== 0) throw new Error('non-zero cost');
          if (a.boundaries.grants_external_process_execution_authority !== false) throw new Error('authority expanded');
          if (a.boundaries.grants_prod_authority !== false) throw new Error('PROD authority expanded');
          console.log(JSON.stringify({status:a.status,tools:a.tools,verified_capabilities:a.verified_capabilities,evidence_fingerprint:a.evidence_fingerprint}));
          NODE
      - name: Canonical registry validation
        working-directory: cerebro
        run: npm run validate
      - name: Upload physical inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-multimedia-zero-cost-physical-inventory-v1
          path: /tmp/multimedia-zero-cost-physical-inventory-v1.json
          retention-days: 30
