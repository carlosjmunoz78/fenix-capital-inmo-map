name: CEREBRO SECDEF Wrapper Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/secdef_remaining_*_wrappers_20260914.sql'
      - 'supabase/fix_chat_send_v2_server_20260914.sql'
      - 'supabase/secdef_gateway_route_contract_20260915.json'
      - '.github/workflows/cerebro-secdef-wrapper-audit.yml'

permissions:
  contents: read

jobs:
  audit-secdef-wrappers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert wrapper files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/secdef_remaining_read_wrappers_20260914.sql
          test -f supabase/secdef_remaining_mutator_wrappers_20260914.sql
          test -f supabase/fix_chat_send_v2_server_20260914.sql
          test -f supabase/secdef_gateway_route_contract_20260915.json

      - name: Assert additive server-only boundary
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/secdef_remaining_read_wrappers_20260914.sql
            supabase/secdef_remaining_mutator_wrappers_20260914.sql
            supabase/fix_chat_send_v2_server_20260914.sql
          )
          for f in "${files[@]}"; do
            grep -F 'security definer' "$f" >/dev/null
            grep -F 'grant execute on function' "$f" >/dev/null
            grep -F 'to service_role' "$f" >/dev/null
            if grep -Eiq 'revoke .*_(user|v1|v2)\(' "$f"; then
              echo "Legacy RPC revoke detected in $f"
              exit 1
            fi
          done

      - name: Assert identity and idempotency guards
        shell: bash
        run: |
          set -euo pipefail
          grep -F "identity_not_linked" supabase/secdef_remaining_read_wrappers_20260914.sql >/dev/null
          grep -F "identity_not_linked" supabase/secdef_remaining_mutator_wrappers_20260914.sql >/dev/null
          grep -F "on conflict(sender_actor_code,idempotency_key)" supabase/fix_chat_send_v2_server_20260914.sql >/dev/null
          grep -F "forbidden" supabase/fix_chat_send_v2_server_20260914.sql >/dev/null
          grep -F "invalid_body" supabase/fix_chat_send_v2_server_20260914.sql >/dev/null

      - name: Validate Gateway route contract
        shell: bash
        run: |
          set -euo pipefail
          f='supabase/secdef_gateway_route_contract_20260915.json'
          jq -e '.mode == "ROUTE_CONTRACT_ONLY" and .legacy_retirement == false and .old_vs_new_required == true' "$f" >/dev/null
          test "$(jq '.routes | length' "$f")" = '15'
          test "$(jq '[.routes[].path] | unique | length' "$f")" = '15'
          test "$(jq '[.routes[].wrapper] | unique | length' "$f")" = '15'
          test "$(jq '[.routes[].legacy] | unique | length' "$f")" = '15'
          test "$(jq '[.routes[] | select((.wrapper|endswith("_server"))|not)] | length' "$f")" = '0'
          test "$(jq '[.routes[] | select(.method != "GET" and .method != "POST" and .method != "PATCH")] | length' "$f")" = '0'

      - name: Assert route contract covers every prepared wrapper
        shell: bash
        run: |
          set -euo pipefail
          f='supabase/secdef_gateway_route_contract_20260915.json'
          for wrapper in \
            fenix_prod_ana_knowledge_answer_server \
            fenix_prod_chat_conversations_server \
            fenix_prod_chat_list_v2_server \
            fenix_prod_chat_people_server \
            fenix_prod_profile_get_full_server \
            fenix_prod_profile_socials_get_server \
            fenix_prod_chat_attachment_add_server \
            fenix_prod_chat_attachment_add_v2_server \
            fenix_prod_chat_conversation_create_server \
            fenix_prod_chat_group_create_server \
            fenix_prod_chat_send_v2_server \
            fenix_prod_contact_create_v2_server \
            fenix_prod_inmo_followup_update_v1_server \
            fenix_prod_profile_socials_update_server \
            fenix_prod_profile_update_full_server; do
            jq -e --arg wrapper "$wrapper" '.routes | any(.wrapper == $wrapper)' "$f" >/dev/null
          done

      - name: Assert no direct PROD retirement in this change
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -Ei 'revoke .*authenticated.*fenix_prod_.*_(user|v1|v2)' supabase/secdef_remaining_*_wrappers_20260914.sql supabase/fix_chat_send_v2_server_20260914.sql

      - name: Record scope
        shell: bash
        run: |
          printf '%s\n' 'STATIC_AUDIT_ONLY=true'
          printf '%s\n' 'PROD_APPLY=false'
          printf '%s\n' 'LEGACY_RETIREMENT=false'
          printf '%s\n' 'OLD_VS_NEW_REQUIRED=true'
          printf '%s\n' 'GATEWAY_ROUTE_CONTRACT_COUNT=15'
