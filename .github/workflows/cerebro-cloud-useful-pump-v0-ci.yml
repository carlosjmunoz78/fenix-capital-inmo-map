name: CEREBRO CLOUD USEFUL PUMP V0 CI

on:
  pull_request:
    paths:
      - 'cerebro/runtime/deterministic-useful-work-worker-v0.mjs'
      - '.github/workflows/cerebro-cloud-useful-worker-v0.yml'
      - '.github/workflows/cerebro-cloud-useful-pump-v0.yml'
      - '.github/workflows/cerebro-cloud-useful-pump-v0-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check cerebro/runtime/deterministic-useful-work-worker-v0.mjs
      - name: Validate mission and governance boundaries
        run: |
          node cerebro/runtime/deterministic-useful-work-worker-v0.mjs --lane=0 --pass=0
          node cerebro/runtime/deterministic-useful-work-worker-v0.mjs --lane=24 --pass=7
          node cerebro/runtime/deterministic-useful-work-worker-v0.mjs --lane=25 --pass=1
          node cerebro/runtime/deterministic-useful-work-worker-v0.mjs --lane=47 --pass=7
      - name: Reject invalid lane and phase
        run: |
          ! node cerebro/runtime/deterministic-useful-work-worker-v0.mjs --lane=48 --pass=0
          ! node cerebro/runtime/deterministic-useful-work-worker-v0.mjs --lane=-1 --pass=0
          ! node cerebro/runtime/deterministic-useful-work-worker-v0.mjs --lane=0 --pass=8
          ! node cerebro/runtime/deterministic-useful-work-worker-v0.mjs --lane=0 --pass=-1
