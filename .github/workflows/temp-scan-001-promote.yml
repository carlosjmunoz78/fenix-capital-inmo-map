name: TEMP SCAN-001 Promotion

on:
  push:
    branches: [cerebro/scan-001-runtime-v0]
    paths:
      - '.github/workflows/temp-scan-001-promote.yml'
      - 'cerebro/factory/candidates/SCAN-001-0.2.0.json'
      - 'cerebro/runtime/digital_footprint_scanner.py'
      - 'cerebro/runtime/tests/test_digital_footprint_scanner.py'
      - 'cerebro/runtime/contracts/digital-footprint-scanner-v0.json'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cerebro/scan-001-runtime-v0
          fetch-depth: 0
      - name: Unit tests
        run: python -m unittest cerebro.runtime.tests.test_digital_footprint_scanner -v
      - name: FACT-001 version apply
        run: >-
          python cerebro/factory/scripts/version_engine.py apply
          --engine-id SCAN-001
          --manifest-file cerebro/factory/candidates/SCAN-001-0.2.0.json
      - name: Validate immutable scaffold and family contract
        run: python -m unittest cerebro.factory.tests.test_family_wave1 -v
      - name: Advance Registry version and commit pointer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('cerebro/factory/registry/engine-registry.json')
          d=json.loads(p.read_text())
          if d.get('registry_version') not in {'0.13.0','0.14.0'}:
              raise SystemExit(f"unexpected registry_version={d.get('registry_version')}")
          d['registry_version']='0.14.0'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'CEREBRO Factory'
          git config user.email 'cerebro-factory@users.noreply.github.com'
          git add cerebro/factory/registry/engine-registry.json cerebro/factory/versions/SCAN-001/0.2.0/engine.manifest.json
          git commit -m 'FACT-001 · promote SCAN-001 to 0.2.0 [skip-scan-promote]'
          git push origin HEAD:cerebro/scan-001-runtime-v0
