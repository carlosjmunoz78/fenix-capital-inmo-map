name: CEREBRO Batch07 IAM001 V1

on:
  push:
    branches: [cerebro/close-179-per-engine-autonomy-v1-20261102]
    paths:
      - 'cerebro/missions/close-batch07-iam001-v1.mjs'
      - 'cerebro/governance/identity-credential-broker.mjs'
      - 'cerebro/governance/identity-session-lifecycle.mjs'
      - 'cerebro/tests/identity-credential-broker-v0.test.mjs'
      - 'cerebro/tests/identity-session-lifecycle-v0.test.mjs'
      - '.github/workflows/cerebro-batch07-iam001-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT: /tmp/cerebro-batch07-iam001

jobs:
  iam001-autonomy-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify isolated branch
        run: test "$GITHUB_REF_NAME" = 'cerebro/close-179-per-engine-autonomy-v1-20261102'
      - name: Validate canonical registry and factory
        run: |
          set -euo pipefail
          cd cerebro
          npm run validate
          node factory-v1.mjs validate --registry registry/engine-registry.v1.json
      - name: Execute IAM-001 closure mission
        run: |
          set -euo pipefail
          node cerebro/missions/close-batch07-iam001-v1.mjs
      - name: Re-run Strict179 readiness auditor
        run: |
          set -euo pipefail
          node cerebro/missions/audit-179-autonomy-readiness-v1.mjs --out "$OUT"
          node <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync(process.env.OUT+'/AUTONOMY_READINESS_BASELINE.json','utf8'));
          const s=JSON.parse(fs.readFileSync(process.env.OUT+'/SUMMARY.json','utf8'));
          const iam=report.engines.find(x=>x.engine_id==='IAM-001');
          if(!iam) throw new Error('IAM-001 missing');
          fs.writeFileSync(process.env.OUT+'/IAM001_DIAGNOSTIC.json',JSON.stringify({engine:iam,summary:s},null,2)+'\n');
          if(iam.gate_count!==12||iam.gate_total!==12||iam.autonomous_prod_ready!==true) throw new Error(`IAM-001 closure failed ${iam.gate_count}/${iam.gate_total}: ${(iam.readiness_blockers||[]).join(',')}`);
          if(s.autonomous_prod_ready<28) throw new Error(`Expected at least 28/179, got ${s.autonomous_prod_ready}`);
          if(s.prod_writes!==false||s.trading_touched!==false||s.additional_cost_eur!==0) throw new Error('safety/cost isolation drift');
          console.log(JSON.stringify({iam_gate_count:iam.gate_count,iam_ready:iam.autonomous_prod_ready,autonomous_prod_ready:s.autonomous_prod_ready,registry_total:s.registry_total}));
          NODE
      - name: Upload Batch07 IAM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-batch07-iam001-${{ github.run_id }}
          path: |
            /tmp/cerebro-batch07-iam001/
            cerebro/evidence/batch07-iam001-autonomy-closure/2026-11-02/
          if-no-files-found: error
          retention-days: 30
