name: PROD Runtime Smoke

on:
  push:
    branches:
      - prod-preparation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gateway health is PROD and reachable
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 'https://cluhljgonannaafpmblx.supabase.co/functions/v1/fenix-app-gateway/health')"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"env":"PROD"'
          echo "$body" | grep -q '"service":"fenix-app-gateway"'

      - name: Gateway fails closed without user identity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/gateway-body --write-out '%{http_code}' --max-time 20 'https://cluhljgonannaafpmblx.supabase.co/functions/v1/fenix-app-gateway/session/context')"
          test "$status" = "401"
          grep -q 'identity_not_linked' /tmp/gateway-body

      - name: Ana Notion secret is configured without exposing it
        shell: bash
        env:
          LEGACY_ANON_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsdWhsamdvbmFubmFhZnBtYmx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwODM4MTIsImV4cCI6MjEwMzY1OTgxMn0.PGSqCe7BGLV4rKBOmhZiLtDAmjQzE7mT1JXVpPCW-f8
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/ana-body --write-out '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${LEGACY_ANON_JWT}" \
            -H "apikey: ${LEGACY_ANON_JWT}" \
            'https://cluhljgonannaafpmblx.supabase.co/functions/v1/fenix-ana-knowledge/recent')"
          if grep -q 'server_config_missing' /tmp/ana-body || test "$status" = "503"; then
            echo 'NOTION_TOKEN is not available to fenix-ana-knowledge' >&2
            cat /tmp/ana-body >&2
            exit 1
          fi
          # No real user JWT is supplied. Any fail-closed auth result is acceptable here;
          # this step exists only to prove the function passed its server-config gate.
          test "$status" = "401" -o "$status" = "403" -o "$status" = "500"
