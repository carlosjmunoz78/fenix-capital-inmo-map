name: PROD Runtime Smoke

on:
  push:
    branches:
      - prod-preparation
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_URL: https://app.fenixcapital.es
  PROD_URL: https://cluhljgonannaafpmblx.supabase.co
  PREPROD_URL: https://hnqlnvakzaywtafeiybt.supabase.co
  PROD_PUBLISHABLE_KEY: sb_publishable_yjISKmA5UPfF3d7NitP_DA_j5LGydh0
  VITE_FENIX_ENV: production
  VITE_SUPABASE_URL: https://cluhljgonannaafpmblx.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yjISKmA5UPfF3d7NitP_DA_j5LGydh0
  LEGACY_ANON_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsdWhsamdvbmFubmFhZnBtYmx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwODM4MTIsImV4cCI6MjEwMzY1OTgxMn0.PGSqCe7BGLV4rKBOmhZiLtDAmjQzE7mT1JXVpPCW-f8

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Compile production frontend
        run: npm run build

      - name: Production bundle is bound to canonical PROD only
        shell: bash
        run: |
          set -euo pipefail
          grep -R --fixed-strings "$PROD_URL" dist >/dev/null
          ! grep -R --fixed-strings "$PREPROD_URL" dist

      - name: APP domain serves deployed frontend
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --location --output "$body" --dump-header "$headers" --write-out '%{http_code}' --max-time 30 "$APP_URL/")"
          test "$status" = "200"
          grep -qi '<!doctype html' "$body"
          grep -qi 'fenix' "$body"

      - name: Gateway health is PROD and reachable
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 \
            -H "apikey: ${PROD_PUBLISHABLE_KEY}" \
            "${PROD_URL}/functions/v1/fenix-app-gateway/health")"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"env":"PROD"'
          echo "$body" | grep -q '"service":"fenix-app-gateway"'

      - name: Gateway fails closed without user identity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/gateway-body --write-out '%{http_code}' --max-time 20 \
            -H "apikey: ${PROD_PUBLISHABLE_KEY}" \
            "${PROD_URL}/functions/v1/fenix-app-gateway/session/context")"
          test "$status" = "401"
          grep -q 'identity_not_linked' /tmp/gateway-body

      - name: Directory and economy APIs fail closed anonymously
        shell: bash
        run: |
          set -euo pipefail
          for path in fenix-directory-api/notarias fenix-directory-api/registros-propiedad fenix-economia-api/economia fenix-reports-api/reports; do
            status="$(curl --silent --output /tmp/fenix-api-body --write-out '%{http_code}' --max-time 20 \
              -H "apikey: ${PROD_PUBLISHABLE_KEY}" \
              "${PROD_URL}/functions/v1/${path}")"
            test "$status" = "401"
          done

      - name: Retired migration endpoints remain unavailable
        shell: bash
        run: |
          set -euo pipefail
          for fn in fenix-directory-sync-once fenix-directory-sync-trigger-once fenix-crm-sync-once fenix-crm-sync-trigger-once fenix-prod-data-sync-once fenix-legacy-doc-migration-once; do
            status="$(curl --silent --output /tmp/retired-body --write-out '%{http_code}' --max-time 20 \
              -H "apikey: ${PROD_PUBLISHABLE_KEY}" \
              "${PROD_URL}/functions/v1/${fn}")"
            test "$status" = "401" || test "$status" = "410"
          done

      - name: Ana API accepts browser CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
            -X OPTIONS \
            -H 'Origin: https://app.fenixcapital.es' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,apikey' \
            "${PROD_URL}/functions/v1/fenix-ana-api/capabilities")"
          test "$status" = "204"
          grep -qi '^access-control-allow-origin: https://app.fenixcapital.es' "$headers"
          grep -qi '^access-control-allow-methods:.*OPTIONS' "$headers"
          grep -qi '^access-control-allow-headers:.*authorization' "$headers"

      - name: Ana Notion secret is configured without exposing it
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/ana-body --write-out '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${LEGACY_ANON_JWT}" \
            -H "apikey: ${LEGACY_ANON_JWT}" \
            "${PROD_URL}/functions/v1/fenix-ana-knowledge/recent")"
          if grep -q 'server_config_missing' /tmp/ana-body || test "$status" = "503"; then
            echo 'NOTION_TOKEN is not available to fenix-ana-knowledge' >&2
            exit 1
          fi
          test "$status" = "500"
          grep -q 'session_context_failed' /tmp/ana-body
