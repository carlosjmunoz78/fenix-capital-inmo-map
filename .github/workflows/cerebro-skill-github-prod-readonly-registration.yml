name: CEREBRO Skill GitHub PROD Read-only Registration

on:
  push:
    branches:
      - cerebro/github-prod-readonly-registration-20261016
    paths:
      - 'cerebro/registry/autonomous-readonly-skills.v1.json'
      - 'cerebro/registry/skill-github-full-safe-preprod.v1.json'
      - 'cerebro/governance/skill-autonomy-standing-authorization.v1.json'
      - 'cerebro/skills/skill-github-prod-readonly-registration-validator-v1.mjs'
      - 'cerebro/tests/skill-github-prod-readonly-registration-validator-v1.test.mjs'
      - '.github/workflows/cerebro-skill-github-prod-readonly-registration.yml'
  pull_request:
    paths:
      - 'cerebro/registry/autonomous-readonly-skills.v1.json'
      - 'cerebro/registry/skill-github-full-safe-preprod.v1.json'
      - 'cerebro/governance/skill-autonomy-standing-authorization.v1.json'
      - 'cerebro/skills/skill-github-prod-readonly-registration-validator-v1.mjs'
      - 'cerebro/tests/skill-github-prod-readonly-registration-validator-v1.test.mjs'
      - '.github/workflows/cerebro-skill-github-prod-readonly-registration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cerebro-skill-github-prod-readonly-registration-${{ github.ref }}
  cancel-in-progress: true

env:
  CEREBRO_ENVIRONMENT: PROD_READONLY_ADVISORY
  CEREBRO_ALLOW_PROD_WRITE: 'false'
  CEREBRO_ALLOW_GITHUB_WRITE: 'false'
  CEREBRO_ALLOW_CUSTOMER_DATA: 'false'
  CEREBRO_ALLOW_PROD_DATA: 'false'
  CEREBRO_ALLOW_EXTERNAL_SKILL_CODE: 'false'
  CEREBRO_ALLOW_DIRECT_TOOL_EXECUTION: 'false'
  CEREBRO_ALLOW_TRADING: 'false'
  CEREBRO_PAID_FALLBACK: 'false'

jobs:
  github-prod-readonly-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate canonical GitHub PROD read-only advisory registration
        run: |
          set -euo pipefail
          mkdir -p artifacts/github-prod-registration
          node cerebro/skills/skill-github-prod-readonly-registration-validator-v1.mjs \
            --output artifacts/github-prod-registration/registration-validation.json
          node --test \
            cerebro/tests/skill-github-prod-readonly-registration-validator-v1.test.mjs \
            cerebro/tests/skill-creator-prod-readonly-registration-validator-v1.test.mjs \
            cerebro/tests/skill-obsidian-prod-readonly-registration-validator-v1.test.mjs

      - name: Verify standing authorization covers only bounded read-only registration
        run: |
          set -euo pipefail
          A='cerebro/governance/skill-autonomy-standing-authorization.v1.json'
          test "$(jq -r '.status' "$A")" = 'ACTIVE_STANDING_AUTHORIZATION'
          test "$(jq -r '.policy_id' "$A")" = 'CEREBRO-SKILL-AUTONOMY-STANDING-AUTH-001'
          test "$(jq -r '.scope.autonomous_readonly_advisory_registration' "$A")" = 'true'
          test "$(jq -r '.scope.autonomous_prod_write' "$A")" = 'false'
          test "$(jq -r '.scope.autonomous_customer_data_access' "$A")" = 'false'
          test "$(jq -r '.scope.autonomous_external_skill_code_execution' "$A")" = 'false'
          test "$(jq -r '.scope.autonomous_trading' "$A")" = 'false'
          test "$(jq -r '.scope.autonomous_paid_fallback' "$A")" = 'false'
          test "$(jq -r '.mandatory_gates.additional_cost_eur' "$A")" = '0'
          test "$(jq -r '.promotion_semantics.final_registration' "$A")" = 'READONLY_ADVISORY_METADATA_ONLY'
          test "$(jq -r '.promotion_semantics.business_prod_side_effects' "$A")" = 'DENY'

      - name: Verify immutable successful GitHub PROD read-only canary evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/github-prod-registration/canary
          RUN_ID=37670597824
          SHA=7ee76db7a44b7e3c1153fd3b35365fc2e2ca5554
          ARTIFACT_ID=11505096443
          ARTIFACT_DIGEST='sha256:7837d90b4a12c2b1d61faf9db1ac2c3300fc166a554d8b2e3057098c08acf387'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')" = 'completed'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.name')" = 'CEREBRO Skill GitHub PROD Read-only Canary'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .id")" = "$ARTIFACT_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .digest")" = "$ARTIFACT_DIGEST"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cerebro-skill-github-prod-readonly-canary-$RUN_ID" --dir artifacts/github-prod-registration/canary
          REPORT="$(find artifacts/github-prod-registration/canary -type f -name 'cerebro-skill-github-prod-readonly-canary.json' -print -quit)"
          test -n "$REPORT"
          node - "$REPORT" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ok=r.status==='GREEN_GITHUB_PROD_READONLY_CANARY'&&r.target_candidate==='github'&&
            r.target_candidate_id==='lobehub-skills:52441cd3d76607ffffab'&&r.wrapper_id==='skillwrap:cerebro-github-v0.1.0'&&
            r.engine_id==='FACT-001'&&r.live_requests===2&&JSON.stringify(r.methods_used)===JSON.stringify(['GET'])&&
            r.repository?.full_name==='carlosjmunoz78/fenix-capital-inmo-map'&&r.repository?.default_branch==='main'&&
            r.main_ref?.sha==='3304c93b3aceed338fc2bb7d377c4d562d2d18b2'&&r.main_ref?.ref==='refs/heads/main'&&
            r.wrapper?.policy_conflict===false&&r.wrapper?.prod_authorized===false&&r.wrapper?.external_skill_code_execution===false&&
            r.prod_write===false&&r.github_write===false&&r.merge_performed===false&&r.push_performed===false&&
            r.issue_or_pr_mutation===false&&r.workflow_dispatch_performed===false&&r.customer_data_used===false&&r.credentials_exposed===false&&
            r.external_skill_code_executed===false&&r.trading_access===false&&r.additional_cost_eur===0&&r.paid_fallback===false&&
            r.prod_write_authorized===false&&r.autonomous_promotion_authorized===false&&r.binding_after==='DISABLED'&&r.rollback_proven===true&&
            r.next_state_if_green==='PROD_READONLY_ADVISORY_ELIGIBLE';
          if(!ok){console.error('Immutable GitHub PROD canary evidence is not exact read-only advisory evidence');process.exit(1)}
          console.log(JSON.stringify({canary:'GREEN',scope:['REPOSITORY_METADATA','MAIN_GIT_REF'],methods:['GET'],github_write:false,cost_eur:0,rollback:true}));
          NODE

      - name: Verify immutable FULL SAFE PREPROD closure and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=38807362064
          SHA=68e3662b3d02c06fcb4381d56d5f1397bfb8341d
          ARTIFACT_ID=12006658643
          ARTIFACT_DIGEST='sha256:9a924cc9b6becde9074f757c1cd70aa4114c09be26dd72e255956bb3233eabfc'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')" = 'completed'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.name')" = 'CEREBRO Skill Full Adoption V1'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .id")" = "$ARTIFACT_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.id == $ARTIFACT_ID) | .digest")" = "$ARTIFACT_DIGEST"
          C='cerebro/registry/skill-github-full-safe-preprod.v1.json'
          test "$(jq -r '.status' "$C")" = 'FULL_SAFE_PREPROD'
          test "$(jq -r '.validation_status' "$C")" = 'CI_GREEN'
          test "$(jq -r '.validated_by.run_id' "$C")" = "$RUN_ID"
          test "$(jq -r '.validated_by.head_sha' "$C")" = "$SHA"
          test "$(jq -r '.provenance.provenance_and_license_status' "$C")" = 'GREEN'
          test "$(jq -r '.safe_internal_wrapper.external_upstream_code_execution' "$C")" = 'false'
          test "$(jq -r '.required_closure.rollback_proven' "$C")" = 'true'
          test "$(jq -r '.required_closure.rebuild_proven' "$C")" = 'true'
          test "$(jq -r '.required_closure.observability_connected' "$C")" = 'true'
          test "$(jq -r '.required_closure.audit_chain_connected' "$C")" = 'true'
          test "$(jq -r '.required_closure.finops_connected' "$C")" = 'true'
          test "$(jq -r '.required_closure.lrn001_feedback_connected' "$C")" = 'true'
          test "$(jq -r '.required_closure.idempotency_proven' "$C")" = 'true'
          test "$(jq -r '.required_closure.zero_additional_cost' "$C")" = 'true'
          test "$(jq -r '.safety.prod_write' "$C")" = 'false'
          test "$(jq -r '.safety.prod_mutation' "$C")" = 'false'
          test "$(jq -r '.safety.auto_merge' "$C")" = 'false'
          test "$(jq -r '.safety.permission_expansion' "$C")" = 'false'

      - name: Assert canonical GitHub registration remains bounded to two GET observations
        run: |
          set -euo pipefail
          R='cerebro/registry/autonomous-readonly-skills.v1.json'
          E='.entries.github'
          test "$(jq -r '.status' "$R")" = 'ACTIVE'
          test "$(jq -r '.environment' "$R")" = 'PROD_READONLY_ADVISORY'
          test "$(jq -r "$E.status" "$R")" = 'ACTIVE_READONLY_ADVISORY'
          test "$(jq -r "$E.execution_mode" "$R")" = 'PROD_READONLY_ADVISORY'
          test "$(jq -r "$E.target_engine_bindings | length" "$R")" = '1'
          test "$(jq -r "$E.allowed_capabilities | length" "$R")" = '2'
          test "$(jq -r "$E.prod_canary_evidence.live_requests" "$R")" = '2'
          test "$(jq -r "$E.prod_canary_evidence.allowed_http_methods | join(\",\")" "$R")" = 'GET'
          test "$(jq -r "$E.prod_canary_evidence.allowed_observations | join(\",\")" "$R")" = 'REPOSITORY_METADATA,MAIN_GIT_REF'
          test "$(jq -r "$E.mutation_gate" "$R")" = 'HIGH_RISK'
          for key in prod_write github_write merge push issue_or_pr_mutation workflow_dispatch direct_tool_execution customer_data prod_data credentials_exposed external_skill_code_execution trading paid_fallback permission_expansion autonomous_business_prod_write; do
            test "$(jq -r "$E.safety.$key" "$R")" = 'false'
          done
          test "$(jq -r "$E.safety.additional_cost_eur" "$R")" = '0'
          test "$(jq -r "$E.activation.fail_closed" "$R")" = 'true'
          test "$(jq -r "$E.activation.rollback_state" "$R")" = 'DISABLED'
          test "$(jq -r "$E.activation.rebuild_default" "$R")" = 'DISABLED'
          test "$(jq -r "$E.activation.prod_write_authorized" "$R")" = 'false'
          test "$(jq -r "$E.activation.github_write_authorized" "$R")" = 'false'
          test "$(jq -r "$E.activation.direct_tool_execution_authorized" "$R")" = 'false'

      - name: Upload immutable GitHub registration validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-github-prod-readonly-registration-${{ github.run_id }}
          path: artifacts/github-prod-registration/**
          if-no-files-found: warn
          retention-days: 30

  full-cerebro-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs

  main-baseline-full-cerebro:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs
