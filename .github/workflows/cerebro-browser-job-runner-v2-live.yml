name: CEREBRO Browser 1 V2 Live Worker
# Durable live consumer: workflow_run bootstrap + schedule fallback. No authority expansion.

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/cerebro-browser-job-runner-v2-live.yml'
      - 'cerebro/runtime/browser-job-runner-v2.mjs'
      - 'cerebro/runtime/browser-interactive-session-v3.mjs'
      - 'cerebro/runtime/browser1-access-v1.mjs'
      - 'supabase/functions/cerebro-browser-dispatch-v2/**'
      - 'supabase/functions/cerebro-browser-interactive-v3/**'
      - 'supabase/functions/cerebro-browser-work-total-v1-prod/**'
  workflow_run:
    workflows: ['PROD Runtime Smoke']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: cerebro-browser1-v2-live-runtime357-v1
  cancel-in-progress: false

env:
  CEREBRO_BROWSER_DISPATCH_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-browser-dispatch-v2
  CEREBRO_BROWSER_WORKSPACE_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-browser-work-total-v1-prod
  CEREBRO_BROWSER_OIDC_AUDIENCE: cerebro-browser-worker-v1
  CEREBRO_BROWSER_RUNTIME_CONTRACT: '3.5.7'
  CEREBRO_BROWSER_STAGE_CONCURRENCY: '8'
  CEREBRO_PHYSICAL_BROWSER_E2E: '1'

jobs:
  queue:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Watch Browser 1 PROD queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pending: ${{ steps.status.outputs.pending }}
    steps:
      - name: Reject stale workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: |
          echo 'STALE_RUN_ATTEMPT_DENIED: use a fresh event so the worker checks out current main.'
          exit 1
      - id: status
        name: Wait for governed PROD work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const endpoint=process.env.CEREBRO_BROWSER_DISPATCH_URL;
          const audience=process.env.CEREBRO_BROWSER_OIDC_AUDIENCE;
          const deadline=Date.now()+4*60_000;
          let pending=0;
          let lastStates={};
          async function oidc(){
            const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            u.searchParams.set('audience',audience);
            const tr=await fetch(u,{headers:{authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},redirect:'error'});
            if(!tr.ok)throw new Error(`OIDC_TOKEN_FAILED:${tr.status}`);
            const body=await tr.json();
            if(!body?.value)throw new Error('OIDC_TOKEN_MISSING');
            return body.value;
          }
          while(Date.now()<deadline){
            const token=await oidc();
            const r=await fetch(`${endpoint}/status-v2`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:'{}',redirect:'error'});
            const body=await r.json().catch(()=>null);
            if(!r.ok||body?.ok!==true)throw new Error(`STATUS_FAILED:${r.status}:${body?.error||'UNKNOWN'}`);
            lastStates=body.states||{};
            pending=Number(lastStates.QUEUED||0)+Number(lastStates.RETRY_WAIT||0);
            if(pending>0)break;
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`pending=${pending}\n`);
          console.log(JSON.stringify({pending,states:lastStates,environment:'PROD',fresh_consumer:true,workspace_persistence:true,runtime_contract:process.env.CEREBRO_BROWSER_RUNTIME_CONTRACT,secret_material_logged:false}));
          NODE

  workers:
    name: Browser 1 V2 worker ${{ matrix.slot }} / 8
    needs: queue
    if: needs.queue.result == 'success' && needs.queue.outputs.pending != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        slot: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CEREBRO_BROWSER_WORKER_SLOT: ${{ matrix.slot }}
      CEREBRO_BROWSER_PHASE2_SEED_CANARY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Resolve browser runtime
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1; then
            echo 'CEREBRO_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
            echo '{"browser_runtime":"SYSTEM_CHROME","fallback_install":false,"secret_material_logged":false}'
          else
            npx playwright install --with-deps chromium
            echo 'CEREBRO_BROWSER_CHANNEL=' >> "$GITHUB_ENV"
            echo '{"browser_runtime":"PLAYWRIGHT_CHROMIUM","fallback_install":true,"secret_material_logged":false}'
          fi
      - name: Execute one governed Browser 1 V2 job
        run: node cerebro/runtime/browser-job-runner-v2.mjs

  status:
    name: Record live queue state
    needs: [queue, workers]
    if: always() && needs.queue.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read final status
        run: |
          node --input-type=module <<'NODE'
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience',process.env.CEREBRO_BROWSER_OIDC_AUDIENCE);
          const tr=await fetch(u,{headers:{authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},redirect:'error'});
          if(!tr.ok)throw new Error(`OIDC_TOKEN_FAILED:${tr.status}`);
          const {value:token}=await tr.json();
          const r=await fetch(`${process.env.CEREBRO_BROWSER_DISPATCH_URL}/status-v2`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:'{}',redirect:'error'});
          const body=await r.json().catch(()=>null);
          console.log(JSON.stringify(body));
          if(!r.ok||body?.ok!==true)process.exit(1);
          NODE

  rearm:
    name: Rearm fresh PROD consumer
    needs: [queue, workers, status]
    if: always() && github.run_attempt == 1 && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch next bounded consumer cycle or use schedule fallback
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const url=`https://api.github.com/repos/${process.env.REPO}/actions/workflows/cerebro-browser-job-runner-v2-live.yml/dispatches`;
          const r=await fetch(url,{method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'accept':'application/vnd.github+json','x-github-api-version':'2022-11-28','content-type':'application/json'},body:JSON.stringify({ref:'main'}),redirect:'error'});
          if(r.status===200||r.status===204){
            console.log(JSON.stringify({ok:true,rearmed:true,ref:'main',dispatch_status:r.status,schedule_fallback:true,static_secret_added:false,incremental_cost_eur:0}));
          }else if(r.status===422){
            console.log(JSON.stringify({ok:true,rearmed:false,ref:'main',dispatch_status:422,schedule_fallback:true,static_secret_added:false,incremental_cost_eur:0}));
          }else{
            throw new Error(`WORKFLOW_REARM_FAILED:${r.status}`);
          }
          NODE
