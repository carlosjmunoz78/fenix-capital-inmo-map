name: CEREBRO Priority Portfolio Sustained V1
run-name: CEREBRO PRIORITY RECLAIM 241 · USER PRIORITY

on:
  push:
    branches:
      - ops/reclaim-runner-for-pages-20261102
    paths:
      - .github/workflows/cerebro-portfolio-priority-sustained-v1.yml
  workflow_dispatch:
    inputs:
      lane:
        description: 'Priority portfolio lane 0..281; 0..181 base, 182..281 temporary loan lanes'
        required: true
        type: string
      cycle:
        description: 'Deterministic cycle 0..999999'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: cerebro-priority-portfolio-sustained-v1-241
  cancel-in-progress: true

jobs:
  paused-for-user-priority:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Priority lane 241 reclaimed for user-priority Operativa PROD deployment.'
