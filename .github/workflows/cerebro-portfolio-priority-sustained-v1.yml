name: CEREBRO Priority Portfolio Sustained V1
run-name: CEREBRO PRIORITY ${{ inputs.lane }} · C${{ inputs.cycle }} · PAUSED

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Priority portfolio lane 0..281; 0..181 base, 182..281 temporary loan lanes'
        required: true
        type: string
      cycle:
        description: 'Deterministic cycle 0..999999'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: cerebro-priority-portfolio-sustained-v1-${{ inputs.lane }}
  cancel-in-progress: true

jobs:
  paused-for-user-priority:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Priority portfolio background work temporarily paused for user-priority Operativa PROD deployment.'
