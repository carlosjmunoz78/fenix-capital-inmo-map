name: FACT001 D1 Offsite Transport Synthetic LAB
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/provider-headless-lab/tests/d1-offsite-synthetic-transport.mjs
permissions:
  contents: read
concurrency:
  group: fact001-d1-synthetic-offsite-test
  cancel-in-progress: false
jobs:
  encrypted-fixture:
    if: github.repository == 'carlosjmunoz78/fenix-capital-inmo-map' && github.ref == 'refs/heads/cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Encrypt synthetic SQLite fixture and verify isolated in-memory restore
        run: node cerebro/connectors/universal/services/provider-headless-lab/tests/d1-offsite-synthetic-transport.mjs
      - name: Preserve only synthetic encrypted fixture for offsite transport test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fact001-d1-synthetic-encrypted-transport-lab
          path: fact001-d1-offsite-synthetic-transport-lab/
          if-no-files-found: error
          retention-days: 30
