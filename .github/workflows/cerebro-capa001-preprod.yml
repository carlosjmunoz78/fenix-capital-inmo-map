name: CEREBRO CAPA-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-frc001-forecasting-engine-v0-20260911']
    paths:
      - 'cerebro/strategy/capacity-engine.mjs'
      - 'cerebro/tests/capacity-engine.test.mjs'
      - '.github/workflows/cerebro-capa001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/capacity-engine.test.mjs
