name: CEREBRO FACT-LRN CP04 LAB integration
on:
  push:
    branches: [lab/skill-chatgpt-evolution-bridge-20261124]
    paths:
      - 'cerebro/skills/skill-universal-learning-contract-v1.mjs'
      - '.github/workflows/cerebro-fact-lrn-cp04-lab.yml'
      - 'cerebro/skills/skill-private-intake-v2.mjs'
      - 'cerebro/skills/skill-private-intake-v2.test.mjs'
      - 'cerebro/skills/skill-private-commit-v1.mjs'
      - 'cerebro/skills/skill-private-commit-v1.test.mjs'
permissions:
  contents: read
jobs:
  integration:
    if: github.repository == 'carlosjmunoz78/fenix-capital-inmo-map' && github.ref == 'refs/heads/lab/skill-chatgpt-evolution-bridge-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise existing FACT and LRN paths with synthetic fixtures
        run: node --test cerebro/skills/skill-universal-learning-contract-v1.test.mjs cerebro/skills/skill-chatgpt-evolution-bridge-v1.test.mjs cerebro/skills/skill-external-learning-preprod-v1.test.mjs cerebro/skills/skill-private-intake-v2.test.mjs
      - name: Preserve existing factory behavior
        run: node --test cerebro/tests/skill-creator-wrapper.test.mjs cerebro/tests/skill-creator-preprod-integration.test.mjs cerebro/tests/skill-wrapper-scaffold-v1.test.mjs cerebro/tests/universal-skill-activation-planner-v1.test.mjs cerebro/tests/universal-skill-adapter-factory-v1.test.mjs

      - name: Verify authenticated atomic persistence contract with synthetic identities and temporary SQLite
        run: node --test cerebro/skills/skill-private-commit-v1.test.mjs
  runtime-write:
    if: github.repository == 'carlosjmunoz78/fenix-capital-inmo-map' && github.ref == 'refs/heads/lab/skill-chatgpt-evolution-bridge-20261124' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate and execute bounded FACT LAB operation
        run: |
          node --input-type=module <<'JS'
          const url='https://cerebro-fact-skill-canary-lab-eu.carlosj-munozcabeza.workers.dev/v2/runtime';
          const tokenUrl=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);tokenUrl.searchParams.set('audience','cerebro-fact-skill-canary-20261125');
          const t=await fetch(tokenUrl,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});if(!t.ok)throw Error('OIDC_TOKEN');const token=(await t.json()).value;if(typeof token!=='string')throw Error('TOKEN');
          async function call(operation,company,auth=token){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth}:{})},body:JSON.stringify({company_id:company,engine_id:'FACT-001',environment:'LAB',version:'1.0.0',operation}),redirect:'error',signal:AbortSignal.timeout(30000)});const v=await r.json();return {http:r.status,v}}
          const check=async()=>{const r=await call('verify-existing','fenix');if(r.http!==200||r.v.status!=='EXISTING_INVENTORY_VERIFIED'||r.v.revisions!==96||r.v.distinct_skills!==45||r.v.binding_count!==1152||r.v.receipts!==1||r.v.added!==0||r.v.machine!=='GITHUB_OIDC_VERIFIED')throw Error('REAL_INVENTORY_'+r.http);console.log(JSON.stringify(r.v))};
          const anon=await call('synthetic-write','synthetic','');if(anon.http!==403)throw Error('ANON');const bad=await call('synthetic-write','fenix');if(bad.http!==403)throw Error('TENANT');await check();const r=await call('synthetic-write','synthetic');if(r.http!==200||r.v.status!=='COMMITTED'||r.v.added!==1||r.v.revisions!==2||r.v.bindings!==24||r.v.artifact_verified!==true||r.v.promotion_authorized!==false)throw Error('SYNTHETIC_'+r.http+'_'+r.v.code);console.log(JSON.stringify(r.v));
          JS
  runtime-recover:
    needs: runtime-write
    if: github.repository == 'carlosjmunoz78/fenix-capital-inmo-map' && github.ref == 'refs/heads/lab/skill-chatgpt-evolution-bridge-20261124' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate and execute bounded FACT LAB operation
        run: |
          node --input-type=module <<'JS'
          const url='https://cerebro-fact-skill-canary-lab-eu.carlosj-munozcabeza.workers.dev/v2/runtime';
          const tokenUrl=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);tokenUrl.searchParams.set('audience','cerebro-fact-skill-canary-20261125');
          const t=await fetch(tokenUrl,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});if(!t.ok)throw Error('OIDC_TOKEN');const token=(await t.json()).value;if(typeof token!=='string')throw Error('TOKEN');
          async function call(operation,company,auth=token){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth}:{})},body:JSON.stringify({company_id:company,engine_id:'FACT-001',environment:'LAB',version:'1.0.0',operation}),redirect:'error',signal:AbortSignal.timeout(30000)});const v=await r.json();return {http:r.status,v}}
          const check=async()=>{const r=await call('verify-existing','fenix');if(r.http!==200||r.v.status!=='EXISTING_INVENTORY_VERIFIED'||r.v.revisions!==96||r.v.distinct_skills!==45||r.v.binding_count!==1152||r.v.receipts!==1||r.v.added!==0||r.v.machine!=='GITHUB_OIDC_VERIFIED')throw Error('REAL_INVENTORY_'+r.http);console.log(JSON.stringify(r.v))};
          await check();const r=await call('synthetic-recover','synthetic');if(r.http!==200||r.v.status!=='RECOVERED_REBUILT_ROLLED_BACK'||r.v.renewed_identity!==true||r.v.artifact_verified!==true||r.v.retained_receipt!==true||r.v.baseline_revisions!==1||r.v.promotion_authorized!==false)throw Error('RECOVERY_'+r.http+'_'+r.v.code);console.log(JSON.stringify(r.v));await check();
          JS
