name: CEREBRO Human Intelligence Promotion Readiness V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/human-intelligence/**'
      - 'cerebro/multichannel/**'
      - 'cerebro/multicompany/digital-footprint-scanner-v1.mjs'
      - 'cerebro/multicompany/post-scan-parallel-v1.mjs'
      - 'cerebro/multicompany/rollback/scan001-preprod-persistence-v1.rollback.sql'
      - 'cerebro/multicompany/rollback/post-scan-parallel-preprod-v1.rollback.sql'
      - 'cerebro/tests/human-intelligence-*.test.mjs'
      - 'cerebro/tests/multichannel-conversation-policy-v1.test.mjs'
      - 'cerebro/tests/multichannel-conversation-old-vs-new-v1.test.mjs'
      - 'cerebro/tests/channel-access-profiles-v1.test.mjs'
      - 'cerebro/tests/continuous-human-qa-v0.test.mjs'
      - 'cerebro/tests/scan001-digital-footprint-v1.test.mjs'
      - 'cerebro/tests/scan001-preprod-persistence-v1.test.mjs'
      - 'cerebro/tests/post-scan-parallel-v1.test.mjs'
      - 'cerebro/tests/post-scan-parallel-preprod-persistence-v1.test.mjs'
      - 'cerebro/contracts/creative-output-pipeline-v1.contract.json'
      - 'cerebro/registry/creative-tool-capabilities.v1.json'
      - 'cerebro/runtime/creative-job-runner-v1.mjs'
      - 'cerebro/runtime/creative-output-pipeline-v1.mjs'
      - 'cerebro/tests/cloud-browser-governed-session-v1.test.mjs'
      - 'cerebro/tests/creative-job-runner-v1.test.mjs'
      - 'cerebro/tests/creative-output-pipeline-v1.test.mjs'
      - 'docs/CEREBRO_CREATIVE_OUTPUT_PIPELINE_V1_2026-10-24.md'
      - 'supabase/functions/cerebro-human-old-actor-preprod-v0/**'
      - 'supabase/functions/cerebro-human-new-actor-preprod-v1/**'
      - 'supabase/functions/cerebro-human-route-control-preprod-v1/**'
      - 'supabase/functions/cerebro-console-gateway-human-v1-canary/**'
      - 'supabase/functions/cerebro-console-human-router-zero-v1/**'
      - 'supabase/functions/_shared/cerebro-conversation-policy-v1.ts'
      - 'supabase/functions/_shared/cerebro-channel-access-policy-v1.ts'
      - 'supabase/functions/cerebro-telegram-gateway-v0/**'
      - 'supabase/functions/cerebro-telegram-voice-v1/**'
      - 'supabase/functions/cerebro-creative-dispatch-v1/**'
      - 'supabase/migrations/20261012132000_cerebro_human_route_control_preprod_v1.sql'
      - 'supabase/migrations/20261013010500_cerebro_multichannel_ana_overlay_v1.sql'
      - 'supabase/migrations/20261013042000_cerebro_channel_access_profiles_v1.sql'
      - 'supabase/migrations/20261013093000_cerebro_scan001_preprod_persistence_v1.sql'
      - 'supabase/migrations/20261013101500_cerebro_post_scan_parallel_preprod_v1.sql'
      - 'supabase/migrations/20261024103000_cerebro_creative_job_v1.sql'
      - 'supabase/migrations/20261024103100_cerebro_creative_job_v1_scope_hardening.sql'
      - 'supabase/migrations/20261024103200_cerebro_creative_job_v1_explicit_deny_policy.sql'
      - '.github/workflows/cerebro-company-reg-tenant-preprod-v0.yml'
      - '.github/workflows/cerebro-post-scan-parallel-preprod-v1.yml'
      - '.github/workflows/cerebro-human-intelligence-*.yml'
      - '.github/workflows/cerebro-multichannel-conversation-unification-v1.yml'
      - '.github/workflows/cerebro-creative-job-runner-v1.yml'
      - '.github/workflows/cerebro-creative-output-pipeline-v1.yml'
      - '.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-human-intelligence-promotion-readiness-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scoped-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Assert exact PR head and strict Human Intelligence surface
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          if [ -n "${PR_BASE_SHA:-}" ]; then git fetch origin "$PR_BASE_SHA" --depth=1; base="$PR_BASE_SHA"; else git fetch origin main --depth=1; base="$(git rev-parse FETCH_HEAD)"; fi
          changed="$(git diff --name-only "$base" HEAD)"
          allowed='^(cerebro/human-intelligence/|cerebro/multichannel/|cerebro/multicompany/(digital-footprint-scanner-v1|post-scan-parallel-v1)\.mjs$|cerebro/multicompany/rollback/(company-registry-preprod-persistence-v1|company-onboarding-preprod-persistence-v1|scan001-preprod-persistence-v1|post-scan-parallel-preprod-v1)\.rollback\.sql$|cerebro/tests/human-intelligence-[^/]+\.test\.mjs$|cerebro/tests/multichannel-conversation-(policy|old-vs-new)-v1\.test\.mjs$|cerebro/tests/channel-access-profiles-v1\.test\.mjs$|cerebro/tests/continuous-human-qa-v0\.test\.mjs$|cerebro/tests/company-registry-preprod-persistence-v1\.test\.mjs$|cerebro/tests/company-onboarding-preprod-persistence-v1\.test\.mjs$|cerebro/tests/scan001-(digital-footprint|preprod-persistence)-v1\.test\.mjs$|cerebro/tests/post-scan-parallel(-preprod-persistence)?-v1\.test\.mjs$|supabase/functions/cerebro-human-old-actor-preprod-v0/|supabase/functions/cerebro-human-new-actor-preprod-v1/|supabase/functions/cerebro-human-route-control-preprod-v1/|supabase/functions/cerebro-console-gateway-human-v1-canary/|supabase/functions/cerebro-console-human-router-zero-v1/|supabase/functions/_shared/cerebro-(conversation|channel-access)-policy-v1\.ts$|supabase/functions/cerebro-telegram-gateway-v0/|supabase/functions/cerebro-telegram-voice-v1/|supabase/migrations/(20261012132000_cerebro_human_route_control_preprod_v1|20261013010500_cerebro_multichannel_ana_overlay_v1|20261013042000_cerebro_channel_access_profiles_v1|20261013075000_cerebro_company_registry_preprod_persistence_v1|20261013083000_cerebro_company_onboarding_preprod_persistence_v1|20261013093000_cerebro_scan001_preprod_persistence_v1|20261013101500_cerebro_post_scan_parallel_preprod_v1)\.sql$|\.github/workflows/cerebro-company-reg-tenant-preprod-v0\.yml$|\.github/workflows/cerebro-post-scan-parallel-preprod-v1\.yml$|\.github/workflows/cerebro-human-intelligence-[^/]+\.yml$|\.github/workflows/cerebro-multichannel-conversation-unification-v1\.yml$|\.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0\.yml$|cerebro/runtime/browser-interactive-session-v3\.mjs$|cerebro/runtime/browser-job-runner-v2\.mjs$|src/CerebroBrowserConsole\.tsx$|src/cerebroBrowserInteractive\.ts$|supabase/functions/cerebro-browser-interactive-v3/|supabase/migrations/20261024230000_cerebro_browser_phase3_interactive_v0\.sql$|supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0\.rollback\.sql$|\.github/workflows/cerebro-browser-job-runner-v2-live\.yml$)'
          creative='^(\.github/workflows/cerebro-creative-(job-runner|output-pipeline)-v1\.yml$|cerebro/contracts/creative-output-pipeline-v1\.contract\.json$|cerebro/registry/creative-tool-capabilities\.v1\.json$|cerebro/runtime/creative-(job-runner|output-pipeline)-v1\.mjs$|cerebro/tests/cloud-browser-governed-session-v1\.test\.mjs$|cerebro/tests/creative-(job-runner|output-pipeline)-v1\.test\.mjs$|docs/CEREBRO_CREATIVE_OUTPUT_PIPELINE_V1_2026-10-24\.md$|supabase/functions/cerebro-creative-dispatch-v1/index\.ts$|supabase/migrations/20261024103(000_cerebro_creative_job_v1|100_cerebro_creative_job_v1_scope_hardening|200_cerebro_creative_job_v1_explicit_deny_policy)\.sql$)'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" | grep -Ev "$creative" || true)"
          if [ -n "$bad" ]; then echo 'Human Intelligence PR crossed its governed surface:' >&2; printf '%s\n' "$bad" >&2; exit 1; fi
          phase3='^(cerebro/runtime/browser-interactive-session-v3\.mjs|cerebro/runtime/browser-job-runner-v2\.mjs|src/CerebroBrowserConsole\.tsx|src/cerebroBrowserInteractive\.ts|supabase/functions/cerebro-browser-interactive-v3/index\.ts|supabase/migrations/20261024230000_cerebro_browser_phase3_interactive_v0\.sql|supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0\.rollback\.sql|\.github/workflows/cerebro-browser-job-runner-v2-live\.yml)$'
          phase3_changed="$(printf '%s\n' "$changed" | grep -E "$phase3" || true)"
          if [ -n "$phase3_changed" ]; then
            printf '%s\n' "$changed" | grep -Fx '.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0.yml' >/dev/null || { echo 'Browser Phase 3 coexistence requires its RSI tribunal update.' >&2; exit 1; }
            for f in cerebro/runtime/browser-interactive-session-v3.mjs cerebro/runtime/browser-job-runner-v2.mjs src/CerebroBrowserConsole.tsx src/cerebroBrowserInteractive.ts supabase/functions/cerebro-browser-interactive-v3/index.ts supabase/migrations/20261024230000_cerebro_browser_phase3_interactive_v0.sql supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0.rollback.sql; do test -f "$f"; done
          fi
          creative_changed="$(printf '%s\n' "$changed" | grep -E "$creative" || true)"
          if [ -n "$creative_changed" ]; then
            printf '%s\n' "$changed" | grep -Fx '.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0.yml' >/dev/null || { echo 'Creative Pipeline coexistence requires its RSI tribunal update.' >&2; exit 1; }
            for f in cerebro/contracts/creative-output-pipeline-v1.contract.json cerebro/registry/creative-tool-capabilities.v1.json cerebro/runtime/creative-job-runner-v1.mjs cerebro/runtime/creative-output-pipeline-v1.mjs cerebro/tests/creative-job-runner-v1.test.mjs cerebro/tests/creative-output-pipeline-v1.test.mjs supabase/functions/cerebro-creative-dispatch-v1/index.ts supabase/migrations/20261024103000_cerebro_creative_job_v1.sql supabase/migrations/20261024103100_cerebro_creative_job_v1_scope_hardening.sql supabase/migrations/20261024103200_cerebro_creative_job_v1_explicit_deny_policy.sql; do test -f "$f"; done
          fi
          protected="$(printf '%s\n' "$changed" | grep -E '^(src/|tests/|public/|scripts/|supabase/migrations/|\.github/workflows/(preprod-build|app-restoration-build|prod-[^/]+)\.yml$)' | grep -Ev '^(src/(CerebroBrowserConsole\.tsx|cerebroBrowserInteractive\.ts)|supabase/migrations/(20261012132000_cerebro_human_route_control_preprod_v1|20261013010500_cerebro_multichannel_ana_overlay_v1|20261013042000_cerebro_channel_access_profiles_v1|20261013075000_cerebro_company_registry_preprod_persistence_v1|20261013083000_cerebro_company_onboarding_preprod_persistence_v1|20261013093000_cerebro_scan001_preprod_persistence_v1|20261013101500_cerebro_post_scan_parallel_preprod_v1|20261024103000_cerebro_creative_job_v1|20261024103100_cerebro_creative_job_v1_scope_hardening|20261024103200_cerebro_creative_job_v1_explicit_deny_policy|20261024230000_cerebro_browser_phase3_interactive_v0)\.sql|supabase/migrations/rollback/20261024230000_cerebro_browser_phase3_interactive_v0\.rollback\.sql)$' || true)"
          if [ -n "$protected" ]; then echo 'Protected App/PROD surface changed.' >&2; printf '%s\n' "$protected" >&2; exit 1; fi
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Prove canonical LRN promotion recovery Human Intelligence multichannel and bounded multiempresa contracts
        run: |
          node --test \
            cerebro/tests/universal-learning-ingress.test.mjs \
            cerebro/tests/rsi-event-outbox.test.mjs \
            cerebro/tests/rsi-learning-worker.test.mjs \
            cerebro/tests/evaluation-tribunal.test.mjs \
            cerebro/tests/experiment-pipeline.test.mjs \
            cerebro/tests/promotion-pipeline.test.mjs \
            cerebro/tests/rsi-recovery-e2e.test.mjs \
            cerebro/tests/bounded-recovery-supervisor.test.mjs \
            cerebro/tests/human-intelligence-tribunal-v1.test.mjs \
            cerebro/tests/human-intelligence-autonomy-bridge-v1.test.mjs \
            cerebro/tests/human-intelligence-gateway-routing-v1.test.mjs \
            cerebro/tests/human-intelligence-production-overlay-v1.test.mjs \
            cerebro/tests/human-intelligence-prod-router-zero-v1.test.mjs \
            cerebro/tests/multichannel-conversation-policy-v1.test.mjs \
            cerebro/tests/multichannel-conversation-old-vs-new-v1.test.mjs \
            cerebro/tests/channel-access-profiles-v1.test.mjs \
            cerebro/tests/continuous-human-qa-v0.test.mjs \
            cerebro/tests/company-registry-preprod-persistence-v1.test.mjs \
            cerebro/tests/company-onboarding-preprod-persistence-v1.test.mjs \
            cerebro/tests/scan001-digital-footprint-v1.test.mjs \
            cerebro/tests/scan001-preprod-persistence-v1.test.mjs \
            cerebro/tests/post-scan-parallel-v1.test.mjs \
            cerebro/tests/post-scan-parallel-preprod-persistence-v1.test.mjs
      - name: Assert PREPROD Human Intelligence functions remain fail-closed and PROD-free
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/functions/cerebro-human-old-actor-preprod-v0/index.ts supabase/functions/cerebro-human-new-actor-preprod-v1/index.ts; do
            test -f "$f"; grep -q 'hnqlnvakzaywtafeiybt' "$f"; grep -q 'prod_write_authorized:false' "$f"; grep -q 'prod_execution_enabled:false' "$f"; grep -q 'customer_data:false' "$f"; grep -q 'trading_access:false' "$f"; grep -q 'GITHUB_OIDC' "$f";
          done
          route='supabase/functions/cerebro-human-route-control-preprod-v1/index.ts'
          test -f "$route"; grep -q 'cerebro-human-route-control-preprod-v1' "$route"; grep -q 'cerebro_human_route_transition_preprod' "$route"; grep -q 'prod_write_authorized:false' "$route"; grep -q 'trading_access:false' "$route"; grep -q 'customer_data:false' "$route"
          if grep -R -n 'cluhljgonannaafpmblx' supabase/functions/cerebro-human-old-actor-preprod-v0 supabase/functions/cerebro-human-new-actor-preprod-v1 supabase/functions/cerebro-human-route-control-preprod-v1; then echo 'PROD project reference forbidden inside isolated PREPROD Human Intelligence functions.' >&2; exit 1; fi
      - name: Assert additive PROD canary is unrouted no-write and preserves the current gateway
        shell: bash
        run: |
          set -euo pipefail
          f='supabase/functions/cerebro-console-gateway-human-v1-canary/index.ts'; test -f "$f"; grep -F 'cerebro-console-gateway-v0' "$f"; grep -F 'PROD_CANARY_UNROUTED' "$f"; grep -F 'live_chat_invoked:false' "$f"; grep -F 'prod_write_authorized:false' "$f"; grep -F '/canary/rehearsal' "$f"; grep -F '/canary/access-profile-rehearsal' "$f"; ! grep -F 'SUPABASE_SERVICE_ROLE_KEY' "$f"; ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -Eq '^supabase/functions/cerebro-console-gateway-v0/'
      - name: Assert additive ZERO router is compiled off and preserves stable authority
        shell: bash
        run: |
          set -euo pipefail
          d='supabase/functions/cerebro-console-human-router-zero-v1'; test -f "$d/index.ts" && test -f "$d/router.ts" && test -f "$d/auth.ts"; grep -F 'export const LIVE_CANARY_PERCENT=0;' "$d/router.ts"; grep -F 'cerebro-console-gateway-v0' "$d/index.ts"; grep -F 'cerebro-console-gateway-human-v1-canary' "$d/index.ts"; grep -F 'PREPROD_NORMAL_ROUTING_DISABLED' "$d/index.ts"; grep -F 'consumer_routing_enabled:false' "$d/index.ts"; ! grep -R -F 'SUPABASE_SERVICE_ROLE_KEY' "$d"; ! grep -R -Eq 'prod_write_authorized[[:space:]]*:[[:space:]]*true|trading_access[[:space:]]*:[[:space:]]*true' "$d"; ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -Eq '^supabase/functions/cerebro-console-gateway-v0/'
      - name: Assert multichannel adapters preserve channel authority and universal learning boundary
        shell: bash
        run: |
          set -euo pipefail
          p='supabase/functions/_shared/cerebro-conversation-policy-v1.ts'; c='supabase/functions/_shared/cerebro-channel-access-policy-v1.ts'; t='supabase/functions/cerebro-telegram-gateway-v0/index.ts'; v='supabase/functions/cerebro-telegram-voice-v1/index.ts'; a='supabase/migrations/20261013010500_cerebro_multichannel_ana_overlay_v1.sql'; s='supabase/migrations/20261013042000_cerebro_channel_access_profiles_v1.sql'
          test -f "$p" && test -f "$c" && test -f "$t" && test -f "$v" && test -f "$a" && test -f "$s"
          grep -F "APP_ANA_TEXT" "$a"; grep -F "TELEGRAM_TEXT" "$t"; grep -F "TELEGRAM_VOICE" "$v"; grep -F "APP_ANA_VOICE" "$p"; grep -F "CONSOLE_VOICE" "$p"; grep -F "signal_type:'METRIC_OBSERVATION'" "$p"; grep -F "FULL_OWNER" "$c"; grep -F "FENIX_OPERATIONAL" "$c"; grep -F "prod_authorized:false" "$c"; grep -F "prod_write_authorized:false" "$c"; grep -F "trading_access:false" "$c"; grep -F "fenix_prod_ana_channel_scope_guard_v1" "$s"; ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -Eq '^supabase/functions/(cerebro-console-gateway-v0|fenix-app-gateway)/'
      - name: Assert exact PREPROD route-control Ana Company Registry COMP-ONB SCAN and post-SCAN migrations are bounded
        shell: bash
        run: |
          set -euo pipefail
          f='supabase/migrations/20261012132000_cerebro_human_route_control_preprod_v1.sql'; test -f "$f"; grep -q 'cerebro_human_route_control_preprod' "$f"; grep -q 'enable row level security' "$f"; grep -q 'grant all on table public.cerebro_human_route_control_preprod to service_role' "$f"; grep -q 'cerebro_human_route_transition_preprod' "$f"
          a='supabase/migrations/20261013010500_cerebro_multichannel_ana_overlay_v1.sql'; test -f "$a"; grep -q 'fenix_prod_ana_knowledge_answer_user(p_question)' "$a"; grep -q 'prod_authority_changed' "$a"
          s='supabase/migrations/20261013042000_cerebro_channel_access_profiles_v1.sql'; test -f "$s"; grep -q 'fenix_prod_ana_channel_scope_guard_v1' "$s"; grep -q 'channel_scope_denied' "$s"; grep -q "'human_required',false" "$s"
          r='supabase/migrations/20261013075000_cerebro_company_registry_preprod_persistence_v1.sql'; test -f "$r"; grep -q 'cerebro_company_registry_preprod' "$r"; grep -q 'DENY_CROSS_COMPANY' "$r"; grep -q 'enable row level security' "$r"; grep -q 'to service_role' "$r"; grep -q "'prod_write_authorized',false" "$r"; grep -q "'trading_access',false" "$r"
          o='supabase/migrations/20261013083000_cerebro_company_onboarding_preprod_persistence_v1.sql'; test -f "$o"; grep -q 'cerebro_company_onboarding_start_preprod' "$o"; grep -q 'cerebro_company_engine_state_preprod' "$o"; grep -q 'DENY_CROSS_COMPANY' "$o"; grep -q 'enable row level security' "$o"; grep -q 'to service_role' "$o"; grep -q "'next_gate','SCAN_001_DURABLE_EXECUTION_REQUIRED'" "$o"; grep -q "'prod_write_authorized',false" "$o"; grep -q "'trading_access',false" "$o"
          x='supabase/migrations/20261013093000_cerebro_scan001_preprod_persistence_v1.sql'; test -f "$x"; grep -q 'cerebro_scan001_record_success_preprod' "$x"; grep -q 'cerebro_company_engine_state_preprod' "$x"; grep -q "engine_id in ('KW-001','WAUD-001','SOCAUD-001','LOCALP-001')" "$x"; grep -q "'next_gate','POST_SCAN_PARALLEL_DURABLE_EXECUTION_REQUIRED'" "$x"; grep -q 'enable row level security' "$x"; grep -q 'to service_role' "$x"; grep -q "'prod_write_authorized',false" "$x"; grep -q "'trading_access',false" "$x"
          pscan='supabase/migrations/20261013101500_cerebro_post_scan_parallel_preprod_v1.sql'; test -f "$pscan"; grep -q 'cerebro_post_scan_audit_record_preprod' "$pscan"; grep -q "engine_id in ('KW-001','WAUD-001','SOCAUD-001','LOCALP-001')" "$pscan"; grep -q "engine_id='SEOBOOT-001' and state='BLOCKED'" "$pscan"; grep -q "engine_id='SOCBOOT-001' and state='BLOCKED'" "$pscan"; grep -q "engine_id='KBOOT-001' and state='BLOCKED'" "$pscan"; grep -q "'BOOTSTRAP_TIER_DURABLE_EXECUTION_REQUIRED'" "$pscan"; grep -q 'enable row level security' "$pscan"; grep -q 'to service_role' "$pscan"; grep -q "'prod_write_authorized',false" "$pscan"; grep -q "'trading_access',false" "$pscan"
          if grep -Eqi '\b(truncate)\b|\bdelete\s+from\b' "$f" "$a" "$s" "$r" "$o" "$x" "$pscan"; then echo 'Destructive SQL forbidden.' >&2; exit 1; fi
      - name: Mark strict boundary
        run: |
          echo 'Human Intelligence readiness reuses existing LRN-001 and Continuous Human QA; multichannel surfaces only wrap passive conversation, require OLD-vs-NEW non-regression evidence, and preserve each channel authority.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exact PREPROD Company Registry, COMP-ONB, SCAN-001 and post-SCAN persistence are service-role only, tenant fail-closed/read-only and grant no PROD writes, secrets disclosure or Trading access.' >> "$GITHUB_STEP_SUMMARY"
