name: CEREBRO Human Intelligence Promotion Readiness V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/human-intelligence/**'
      - 'cerebro/multichannel/**'
      - 'cerebro/voice/**'
      - 'cerebro/tests/**'
      - 'src/AnaChatBlock.tsx'
      - 'src/AnaVoiceQueryBlock.tsx'
      - 'src/CerebroConsoleBlock.tsx'
      - 'src/OperationalShellGate.tsx'
      - 'src/VoiceChannelAdapter.ts'
      - 'src/cerebroVoice.ts'
      - 'tests/voice-ui-ana-console.spec.ts'
      - 'supabase/functions/cerebro-human-old-actor-preprod-v0/**'
      - 'supabase/functions/cerebro-human-new-actor-preprod-v1/**'
      - 'supabase/functions/cerebro-human-route-control-preprod-v1/**'
      - 'supabase/functions/cerebro-console-gateway-human-v1-canary/**'
      - 'supabase/functions/cerebro-console-human-router-zero-v1/**'
      - 'supabase/functions/_shared/cerebro-conversation-policy-v1.ts'
      - 'supabase/functions/cerebro-telegram-gateway-v0/**'
      - 'supabase/functions/cerebro-telegram-voice-v1/**'
      - 'supabase/migrations/20261012132000_cerebro_human_route_control_preprod_v1.sql'
      - 'supabase/migrations/20261013010500_cerebro_multichannel_ana_overlay_v1.sql'
      - '.github/workflows/cerebro-human-intelligence-*.yml'
      - '.github/workflows/cerebro-multichannel-conversation-unification-v1.yml'
      - '.github/workflows/cerebro-owned-voice-preprod.yml'
      - '.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-human-intelligence-promotion-readiness-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scoped-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Assert exact PR head and governed surface
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git fetch origin "$PR_BASE_SHA" --depth=1
          changed="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
          allowed='^(cerebro/(human-intelligence|multichannel|voice)/|cerebro/tests/|src/(AnaChatBlock|AnaVoiceQueryBlock|CerebroConsoleBlock|OperationalShellGate|VoiceChannelAdapter|cerebroVoice)\.tsx?$|tests/voice-ui-ana-console\.spec\.ts$|supabase/functions/(cerebro-human-old-actor-preprod-v0|cerebro-human-new-actor-preprod-v1|cerebro-human-route-control-preprod-v1|cerebro-console-gateway-human-v1-canary|cerebro-console-human-router-zero-v1|cerebro-telegram-gateway-v0|cerebro-telegram-voice-v1)/|supabase/functions/_shared/cerebro-conversation-policy-v1\.ts$|supabase/migrations/(20261012132000_cerebro_human_route_control_preprod_v1|20261013010500_cerebro_multichannel_ana_overlay_v1)\.sql$|\.github/workflows/cerebro-(human-intelligence-[^/]+|multichannel-conversation-unification-v1|owned-voice-preprod|rsi-promotion-readiness-shadow-v0)\.yml$)'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then echo 'Human Intelligence PR crossed its governed surface:' >&2; printf '%s\n' "$bad" >&2; exit 1; fi
          test ! -e src/AnaVoiceQueryBlock.tsx
          test ! -e src/VoiceChannelAdapter.ts
          ! printf '%s\n' "$changed" | grep -Eq '^supabase/functions/(fenix-app-gateway|cerebro-console-gateway-v0)/'
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Prove LRN promotion Human Intelligence and multichannel contracts
        run: |
          node --test \
            cerebro/tests/universal-learning-ingress.test.mjs \
            cerebro/tests/rsi-event-outbox.test.mjs \
            cerebro/tests/rsi-learning-worker.test.mjs \
            cerebro/tests/evaluation-tribunal.test.mjs \
            cerebro/tests/experiment-pipeline.test.mjs \
            cerebro/tests/promotion-pipeline.test.mjs \
            cerebro/tests/rsi-recovery-e2e.test.mjs \
            cerebro/tests/bounded-recovery-supervisor.test.mjs \
            cerebro/tests/human-intelligence-tribunal-v1.test.mjs \
            cerebro/tests/human-intelligence-autonomy-bridge-v1.test.mjs \
            cerebro/tests/human-intelligence-gateway-routing-v1.test.mjs \
            cerebro/tests/human-intelligence-production-overlay-v1.test.mjs \
            cerebro/tests/human-intelligence-prod-router-zero-v1.test.mjs \
            cerebro/tests/multichannel-conversation-policy-v1.test.mjs \
            cerebro/tests/multichannel-conversation-old-vs-new-v1.test.mjs \
            cerebro/tests/continuous-human-qa-v0.test.mjs
      - name: Assert canonical VOICE-001 authority and learning boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'voice_is_transport_not_authority' cerebro/voice/channel-registry.v1.json
          grep -F '"audio_persistence": false' cerebro/voice/channel-registry.v1.json
          grep -F '"learning_inherited": true' cerebro/voice/channel-registry.v1.json
          grep -F 'fenix_prod_chat_send_user' src/AnaChatBlock.tsx
          grep -F "from './cerebroVoice'" src/AnaChatBlock.tsx
          grep -F 'voiceNeedsClarification' src/AnaChatBlock.tsx
          grep -F 'cerebro-console-gateway-v0' src/CerebroConsoleBlock.tsx
          grep -F "actor_code==='CARLOS-ADMIN'" src/CerebroConsoleBlock.tsx
          grep -F "from './cerebroVoice'" src/CerebroConsoleBlock.tsx
          grep -F 'voiceNeedsManualConfirmation' src/CerebroConsoleBlock.tsx
          test ! -e src/AnaVoiceQueryBlock.tsx
          test ! -e src/VoiceChannelAdapter.ts
          ! grep -R -F 'SUPABASE_SERVICE_ROLE_KEY' src/AnaChatBlock.tsx src/CerebroConsoleBlock.tsx src/cerebroVoice.ts
      - name: Assert PREPROD actors and route control remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/functions/cerebro-human-old-actor-preprod-v0/index.ts supabase/functions/cerebro-human-new-actor-preprod-v1/index.ts; do
            test -f "$f"; grep -q 'prod_write_authorized:false' "$f"; grep -q 'prod_execution_enabled:false' "$f"; grep -q 'customer_data:false' "$f"; grep -q 'trading_access:false' "$f"
          done
          route='supabase/functions/cerebro-human-route-control-preprod-v1/index.ts'
          test -f "$route"; grep -q 'prod_write_authorized:false' "$route"; grep -q 'trading_access:false' "$route"; grep -q 'customer_data:false' "$route"
      - name: Assert canary and ZERO router preserve stable PROD gateway
        shell: bash
        run: |
          set -euo pipefail
          canary='supabase/functions/cerebro-console-gateway-human-v1-canary/index.ts'
          grep -F 'cerebro-console-gateway-v0' "$canary"; grep -F 'PROD_CANARY_UNROUTED' "$canary"; grep -F 'prod_write_authorized:false' "$canary"; ! grep -F 'SUPABASE_SERVICE_ROLE_KEY' "$canary"
          d='supabase/functions/cerebro-console-human-router-zero-v1'
          grep -F 'export const LIVE_CANARY_PERCENT=0;' "$d/router.ts"; grep -F 'PREPROD_NORMAL_ROUTING_DISABLED' "$d/index.ts"; grep -F 'consumer_routing_enabled:false' "$d/index.ts"; ! grep -R -F 'SUPABASE_SERVICE_ROLE_KEY' "$d"
      - name: Assert multichannel authority is unchanged
        shell: bash
        run: |
          set -euo pipefail
          p='supabase/functions/_shared/cerebro-conversation-policy-v1.ts'
          grep -F "APP_ANA_VOICE" "$p"; grep -F "CONSOLE_VOICE" "$p"; grep -F "prod_authorized:false" "$p"; grep -F "prod_write_authorized:false" "$p"; grep -F "trading_access:false" "$p"
          grep -F "TELEGRAM_TEXT" supabase/functions/cerebro-telegram-gateway-v0/index.ts
          grep -F "TELEGRAM_VOICE" supabase/functions/cerebro-telegram-voice-v1/index.ts
          grep -F "APP_ANA_TEXT" supabase/migrations/20261013010500_cerebro_multichannel_ana_overlay_v1.sql
      - name: Build exact head
        run: npm run build
      - name: Mark strict boundary
        run: |
          echo 'VOICE-001 is transport-only. Ana Voice reuses fenix_prod_chat_send_user; Console Voice reuses the stable Console /chat.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Learning remains governed by LRN-001, OLD vs NEW, evaluation/Tribunal, PREPROD, canary and rollback.' >> "$GITHUB_STEP_SUMMARY"
