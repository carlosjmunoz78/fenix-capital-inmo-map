name: CEREBRO Human Intelligence Promotion Readiness V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/human-intelligence/**'
      - 'cerebro/tests/human-intelligence-*.test.mjs'
      - 'supabase/functions/cerebro-human-old-actor-preprod-v0/**'
      - 'supabase/functions/cerebro-human-new-actor-preprod-v1/**'
      - 'supabase/functions/cerebro-human-route-control-preprod-v1/**'
      - 'supabase/functions/cerebro-console-gateway-human-v1-canary/**'
      - 'supabase/migrations/20261012132000_cerebro_human_route_control_preprod_v1.sql'
      - '.github/workflows/cerebro-human-intelligence-*.yml'
      - '.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-human-intelligence-promotion-readiness-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scoped-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Assert exact PR head and strict Human Intelligence surface
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          if [ -n "${PR_BASE_SHA:-}" ]; then
            git fetch origin "$PR_BASE_SHA" --depth=1
            base="$PR_BASE_SHA"
          else
            git fetch origin main --depth=1
            base="$(git rev-parse FETCH_HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(cerebro/human-intelligence/|cerebro/tests/human-intelligence-[^/]+\.test\.mjs$|supabase/functions/cerebro-human-old-actor-preprod-v0/|supabase/functions/cerebro-human-new-actor-preprod-v1/|supabase/functions/cerebro-human-route-control-preprod-v1/|supabase/functions/cerebro-console-gateway-human-v1-canary/|supabase/migrations/20261012132000_cerebro_human_route_control_preprod_v1\.sql$|\.github/workflows/cerebro-human-intelligence-[^/]+\.yml$|\.github/workflows/cerebro-rsi-promotion-readiness-shadow-v0\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo 'Human Intelligence PR crossed its isolated surface:' >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          protected="$(printf '%s\n' "$changed" | grep -E '^(src/|tests/|public/|scripts/|supabase/migrations/|\.github/workflows/(preprod-build|app-restoration-build|prod-[^/]+)\.yml$)' | grep -v '^supabase/migrations/20261012132000_cerebro_human_route_control_preprod_v1\.sql$' || true)"
          if [ -n "$protected" ]; then
            echo 'Protected App/PROD surface changed.' >&2
            printf '%s\n' "$protected" >&2
            exit 1
          fi

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Prove canonical LRN promotion recovery and Human Intelligence integration contracts
        run: |
          node --test \
            cerebro/tests/universal-learning-ingress.test.mjs \
            cerebro/tests/rsi-event-outbox.test.mjs \
            cerebro/tests/rsi-learning-worker.test.mjs \
            cerebro/tests/evaluation-tribunal.test.mjs \
            cerebro/tests/experiment-pipeline.test.mjs \
            cerebro/tests/promotion-pipeline.test.mjs \
            cerebro/tests/rsi-recovery-e2e.test.mjs \
            cerebro/tests/bounded-recovery-supervisor.test.mjs \
            cerebro/tests/human-intelligence-tribunal-v1.test.mjs \
            cerebro/tests/human-intelligence-autonomy-bridge-v1.test.mjs \
            cerebro/tests/human-intelligence-gateway-routing-v1.test.mjs \
            cerebro/tests/human-intelligence-production-overlay-v1.test.mjs

      - name: Assert PREPROD Human Intelligence functions remain fail-closed and PROD-free
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            supabase/functions/cerebro-human-old-actor-preprod-v0/index.ts \
            supabase/functions/cerebro-human-new-actor-preprod-v1/index.ts; do
            test -f "$f"
            grep -q 'hnqlnvakzaywtafeiybt' "$f"
            grep -q 'prod_write_authorized:false' "$f"
            grep -q 'prod_execution_enabled:false' "$f"
            grep -q 'customer_data:false' "$f"
            grep -q 'trading_access:false' "$f"
            grep -q 'GITHUB_OIDC' "$f"
          done
          route='supabase/functions/cerebro-human-route-control-preprod-v1/index.ts'
          test -f "$route"
          grep -q 'cerebro-human-route-control-preprod-v1' "$route"
          grep -q 'cerebro_human_route_transition_preprod' "$route"
          grep -q 'prod_write_authorized:false' "$route"
          grep -q 'trading_access:false' "$route"
          grep -q 'customer_data:false' "$route"
          if grep -R -n 'cluhljgonannaafpmblx' \
            supabase/functions/cerebro-human-old-actor-preprod-v0 \
            supabase/functions/cerebro-human-new-actor-preprod-v1 \
            supabase/functions/cerebro-human-route-control-preprod-v1; then
            echo 'PROD project reference forbidden inside isolated PREPROD Human Intelligence functions.' >&2
            exit 1
          fi

      - name: Assert additive PROD canary is unrouted no-write and preserves the current gateway
        shell: bash
        run: |
          set -euo pipefail
          f='supabase/functions/cerebro-console-gateway-human-v1-canary/index.ts'
          test -f "$f"
          grep -F 'cerebro-console-gateway-v0' "$f"
          grep -F 'PROD_CANARY_UNROUTED' "$f"
          grep -F 'live_chat_invoked:false' "$f"
          grep -F 'prod_write_authorized:false' "$f"
          grep -F '/canary/rehearsal' "$f"
          ! grep -F 'SUPABASE_SERVICE_ROLE_KEY' "$f"
          ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -Eq '^supabase/functions/cerebro-console-gateway-v0/'

      - name: Assert exact PREPROD route-control migration is additive service-role only
        shell: bash
        run: |
          set -euo pipefail
          f='supabase/migrations/20261012132000_cerebro_human_route_control_preprod_v1.sql'
          test -f "$f"
          grep -q 'cerebro_human_route_control_preprod' "$f"
          grep -q 'enable row level security' "$f"
          grep -q 'grant all on table public.cerebro_human_route_control_preprod to service_role' "$f"
          grep -q 'cerebro_human_route_transition_preprod' "$f"
          if grep -Eqi '\b(drop|truncate)\b|\bdelete\s+from\b' "$f"; then
            echo 'Destructive SQL forbidden in Human Intelligence route-control migration.' >&2
            exit 1
          fi

      - name: Mark strict boundary
        run: |
          echo 'Human Intelligence promotion readiness is PREPROD plus one additive unrouted PROD canary.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The current production gateway source is immutable in this PR.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No real user is routed to the canary; no PROD /chat is called by the canary gate; no new PROD write authority is granted.' >> "$GITHUB_STEP_SUMMARY"
