name: CEREBRO EVT-001 ALL ENGINES FULL E2E REAL V1
on:
  workflow_dispatch:
  push:
    branches: [main, 'cerebro/lote12-real-consumer-evt001-v1-*']
    paths:
      - 'cerebro/runtime/evt-all-engines-real-consumer-adoption-v1.mjs'
      - 'cerebro/tests/evt-all-engines-real-consumer-adoption-v1.test.mjs'
      - 'cerebro/registry/evt-all-engines-real-consumer-adoption-v1.json'
      - 'cerebro/docs/EVT_ALL_ENGINES_REAL_CONSUMER_ADOPTION_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-evt-all-engines-full-e2e-real-v1.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/evt-all-engines-real-consumer-adoption-v1.mjs'
      - 'cerebro/tests/evt-all-engines-real-consumer-adoption-v1.test.mjs'
      - 'cerebro/registry/evt-all-engines-real-consumer-adoption-v1.json'
      - 'cerebro/docs/EVT_ALL_ENGINES_REAL_CONSUMER_ADOPTION_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-evt-all-engines-full-e2e-real-v1.yml'
permissions: {contents: read, actions: read}
jobs:
  strict-all-engine-real-consumer-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Canonical factory registry remains valid
        working-directory: cerebro
        run: npm run validate
      - name: Preserve legacy EVT-001 and Lote 1+2 runtimes
        run: |
          git diff --exit-code 121d6b0107aee146f5b4100f55480587ea9a0843 -- \
            cerebro/runtime/evt001-native-v1.mjs \
            cerebro/tests/evt001-native-v1.test.mjs \
            cerebro/registry/capability-evt001-native.v1.json \
            cerebro/evidence/evt001-native-v1-preprod.json \
            cerebro/registry/evt001-browser-staging-e2e.v0.json \
            cerebro/runtime/native-capability-operational-loop-v1.mjs \
            cerebro/registry/native-capability-operational-adoption-v1.json
      - name: Existing EVT-001 plus strict all-engine real-consumer tests
        run: >-
          node --test
          cerebro/tests/evt001-native-v1.test.mjs
          cerebro/tests/evt-all-engines-real-consumer-adoption-v1.test.mjs
          cerebro/tests/native-capability-operational-loop-v1.test.mjs
          cerebro/tests/native-capability-continuous-improvement-v1.test.mjs
      - name: Execute strict EVT-001 all-engine route
        run: |
          mkdir -p /tmp/cerebro-evtall-real
          node cerebro/runtime/evt-all-engines-real-consumer-adoption-v1.mjs \
            --company fenix \
            --workdir /tmp/cerebro-evtall-real/state \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "${{ github.sha }}" \
            --out /tmp/cerebro-evtall-real/report.json
      - name: Strict FULL E2E REAL all-engine gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cerebro-evtall-real/report.json','utf8'));
          const reg=JSON.parse(fs.readFileSync('cerebro/registry/engine-registry.v1.json','utf8'));
          const ids=reg.engine_ids;
          if(!Array.isArray(ids)||ids.length!==reg.count||new Set(ids).size!==reg.count)throw new Error('canonical engine registry invalid');
          if(r.status!=='FULL_E2E_REAL_PREPROD'||r.full_e2e_real_preprod!==true)throw new Error('EVT-001 strict FULL not green');
          if(r.required_consumer_selector!=='ALL_REGISTERED_ENGINES')throw new Error('wrong consumer selector');
          if(r.canonical_engine_count!==reg.count||JSON.stringify(r.required_consumers)!==JSON.stringify(ids))throw new Error('canonical registry coverage drift');
          if(r.consumers.length!==reg.count||r.consumer_coverage!==1||r.functional_consumer_coverage!==1)throw new Error('all-engine semantic coverage incomplete');
          if(r.missing_consumers.length||r.failed_consumers.length)throw new Error('engine consumer gap remains');
          if(!r.consumers.every(x=>x.real_consumption===true&&x.decision==='REGISTRY_EPOCH_APPLIED'&&Array.isArray(x.fields_used)&&x.fields_used.length>=6&&x.outcome_hash))throw new Error('semantic consumer proof incomplete');
          if(r.transport_event_count!==reg.count||r.dead_letter_total!==0)throw new Error('transport coverage/dead-letter gate failed');
          if(r.evaluation_consumer?.decision!=='TRIBUNAL_PASS'||r.learning_sink?.decision!=='LRN_FEEDBACK_PERSISTED')throw new Error('Tribunal/LRN gate failed');
          if(r.observability_consumer?.decision!=='OBSERVABILITY_RECORDED'||r.finops_consumer?.decision!=='FINOPS_ZERO_COST_RECORDED')throw new Error('OBSERV/FINOPS gate failed');
          const rr=r.backup_rollback_rebuild;
          if(!rr?.backup_ready||!rr.rollback_green||!rr.rebuild_green||rr.rebuilt_engine_count!==reg.count||rr.applied_state_hash!==rr.rebuilt_state_hash)throw new Error('backup/rollback/rebuild gate failed');
          if(r.state_persisted!==true||r.semantic_state_persisted!==true||r.restartable!==true||r.idempotency_proven!==true||r.additional_cost_eur!==0)throw new Error('durability/idempotency/cost gate failed');
          const forbidden=['prod_authorized','prod_write_authorized','db_mutation_authorized','provider_write_authorized','crm_write_authorized','spend_authorized','trading_access','android_touched'];
          if(forbidden.some(k=>r[k]!==false))throw new Error('authority expanded');
          console.log(JSON.stringify({status:'GREEN',capability:r.capability_id,canonical_engine_count:r.canonical_engine_count,registry_fingerprint:r.registry_fingerprint,outcome_hash:r.outcome_hash}));
          NODE
      - name: Registry candidate gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('cerebro/registry/evt-all-engines-real-consumer-adoption-v1.json','utf8'));
          const reg=JSON.parse(fs.readFileSync('cerebro/registry/engine-registry.v1.json','utf8'));
          if(r.capability_id!=='EVT-001'||r.engine_id!=='EVT-001'||r.environment!=='PREPROD'||r.required_consumer_selector!=='ALL_REGISTERED_ENGINES')throw new Error('registry identity/selector invalid');
          if(r.observed_canonical_engine_count!==reg.count)throw new Error('candidate engine count stale');
          const g=r.strict_gates;
          if(!g.canonical_registry_dynamic_coverage||!g.real_runtime_use_required||!g.semantic_state_change_required||!g.semantic_mutation_tests_required||!g.native_retry_dead_letter_required||!g.backup_rollback_rebuild_required||!g.evaluation_tribunal_required)throw new Error('strict gate weakened');
          if(r.consumer_model?.receipt_only_forbidden!==true||r.consumer_model?.no_server_per_engine!==true)throw new Error('consumer model invalid');
          const a=r.authority;if(a.prod_authorized||a.prod_write_authorized||a.db_mutation_authorized||a.provider_write_authorized||a.crm_write_authorized||a.spend_authorized||a.trading_access||a.android_touched||a.additional_cost_eur!==0)throw new Error('authority/cost expanded');
          NODE
      - name: Upload strict EVT-001 all-engine evidence
        uses: actions/upload-artifact@v4
        with:
          name: evt001-all-engines-full-e2e-real-v1-${{ github.run_id }}
          path: |
            /tmp/cerebro-evtall-real/report.json
            /tmp/cerebro-evtall-real/state
          retention-days: 30
          if-no-files-found: error
