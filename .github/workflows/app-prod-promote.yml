name: APP PROD Promote

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-prod-promote
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_FENIX_ENV: prod
      VITE_SUPABASE_URL: https://cluhljgonannaafpmblx.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yjISKmA5UPfF3d7NitP_DA_j5LGydh0
    steps:
      - name: Checkout canonical PROD candidate branch
        uses: actions/checkout@v4
        with:
          ref: prod-preparation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build exact PROD app
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          cp dist/index.html dist/404.html
          printf '%s\n' 'app.fenixcapital.es' > dist/CNAME
          printf '%s\n' "${GITHUB_SHA}" > dist/PROD_SOURCE_SHA.txt
          touch dist/.nojekyll

      - name: Assert PROD backend only
        run: |
          set -euo pipefail
          ! grep -R -F 'hnqlnvakzaywtafeiybt.supabase.co' dist
          grep -R -F 'cluhljgonannaafpmblx.supabase.co' dist >/dev/null
          ! grep -RInE --include='*.js' --include='*.html' --include='*.css' 'functions/v1/[A-Za-z0-9_-]+-test' dist

      - name: Browser QA exact PROD candidate
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
          FENIX_QA_PROD_CANDIDATE: '1'
        run: >-
          npm run test:e2e -- --workers=2
          tests/prod-candidate-browser.spec.ts
          tests/prod-runtime-config.spec.ts
          tests/prod-release-gate.spec.ts
          tests/directory-prod-gateway-contract.spec.ts
          tests/expediente-prod-contract.spec.ts
          tests/expediente-prod-detail-contract.spec.ts
          tests/inmobiliaria-prod-contract.spec.ts
          tests/prod-canonical-write-contracts.spec.ts
          tests/prod-no-active-preprod-dependency.spec.ts

      - name: PROD API reachability gate
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            'fenix-ana-api/capabilities' \
            'fenix-app-gateway/navigation' \
            'fenix-directory-api/notarias' \
            'fenix-directory-api/registros-propiedad' \
            'fenix-reports-api' \
            'fenix-economia-api' \
            'fenix-expediente-people' \
            'fenix-document-existing-backfill' \
            'fenix-document-auto-ingest'; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 \
              -X OPTIONS \
              -H 'Origin: https://app.fenixcapital.es' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,apikey,content-type' \
              "https://cluhljgonannaafpmblx.supabase.co/functions/v1/${endpoint}")"
            test "$status" = '204'
          done

      - name: Publish exact validated APP snapshot preserving history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/fenix-app-live
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/fenix-app-live
          cd /tmp/fenix-app-live
          previous_sha="$(git rev-parse HEAD)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${GITHUB_WORKSPACE}/dist/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Validated candidate bytes already match PROD.'
          else
            git commit -m "deploy: APP PROD ${GITHUB_SHA} [previous:${previous_sha}]"
            git push origin HEAD:gh-pages
          fi

      - name: Verify published source marker
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            live="$(curl -fsSL --max-time 20 https://app.fenixcapital.es/PROD_SOURCE_SHA.txt || true)"
            if test "$live" = "${GITHUB_SHA}"; then
              exit 0
            fi
            sleep 10
          done
          echo 'Published source marker did not converge' >&2
          exit 1
