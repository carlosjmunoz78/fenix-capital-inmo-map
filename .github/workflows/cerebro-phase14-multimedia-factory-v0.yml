name: CEREBRO Phase 14 Multimedia Factory V0

on:
  push:
    paths:
      - 'cerebro/digital-build/multimedia-factory-runtime-v0.mjs'
      - 'cerebro/tests/multimedia-factory-runtime-v0.test.mjs'
      - 'cerebro/registry/multimedia-factory-profile.v0.json'
      - 'cerebro/docs/CEREBRO_PHASE14_MULTIMEDIA_FACTORY_BLOCKS_162_175_V0_2026-10-14.md'
      - 'cerebro/evidence/phase14-multimedia-factory-blocks-162-175-v0.json'
      - '.github/workflows/cerebro-phase14-multimedia-factory-v0.yml'
  pull_request:
    paths:
      - 'cerebro/digital-build/multimedia-factory-runtime-v0.mjs'
      - 'cerebro/tests/multimedia-factory-runtime-v0.test.mjs'
      - 'cerebro/registry/multimedia-factory-profile.v0.json'
      - 'cerebro/docs/CEREBRO_PHASE14_MULTIMEDIA_FACTORY_BLOCKS_162_175_V0_2026-10-14.md'
      - 'cerebro/evidence/phase14-multimedia-factory-blocks-162-175-v0.json'
      - '.github/workflows/cerebro-phase14-multimedia-factory-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase14-multimedia-factory-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Phase 14 focused contract tests
        run: node --test cerebro/tests/multimedia-factory-runtime-v0.test.mjs
      - name: Validate profile and evidence JSON
        run: >-
          node -e "for (const f of ['cerebro/registry/multimedia-factory-profile.v0.json','cerebro/evidence/phase14-multimedia-factory-blocks-162-175-v0.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('phase14-multimedia-json GREEN')"
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression suite
        working-directory: cerebro
        run: npm test
