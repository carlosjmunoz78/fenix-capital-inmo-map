name: CEREBRO CAP Native V1 PREPROD
on:
  workflow_dispatch:
  pull_request:
    paths: ['cerebro/runtime/cap-native-v1.mjs','cerebro/tests/cap-native-v1.test.mjs','cerebro/registry/capability-cap-native.v1.json','cerebro/evidence/cap-native-v1-preprod.json','cerebro/docs/CAP_NATIVE_V1_RUNBOOK.md','.github/workflows/cerebro-cap-native-v1.yml']
  push:
    branches: ['cerebro/cap-native-v1-*']
permissions: {contents: read}
jobs:
  preprod-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Factory remains valid
        working-directory: cerebro
        run: npm run validate
      - name: CAP native E2E
        run: node --test cerebro/tests/cap-native-v1.test.mjs
      - name: Existing acquisition stack preserved
        run: git diff --exit-code 8c85efd911d44ccf50eb9d53c672ddd4a66cf4b9 -- cerebro/runtime/web-acquisition-intelligence-profile-v1.mjs cerebro/runtime/fact001-gap-capabilities-v0.mjs
      - name: Registry and policy gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('cerebro/registry/capability-cap-native.v1.json','utf8'));
          if(r.capability_id!=='CAP-NATIVE'||r.owner_engine_id!=='CAP-001'||r.environment!=='PREPROD')throw new Error('identity');
          if(r.prod_authorized||r.prod_write_authorized||r.additional_cost_eur!==0||r.contracts.spend_authorized||r.contracts.provider_write_authorized)throw new Error('authority/cost');
          if(r.full_gate.required.length!==14||r.ownership.new_engine_created!==false)throw new Error('gate/engine');
          if(r.existing_evidence.prod_touched||r.existing_evidence.android_touched||r.existing_evidence.spend_performed||r.existing_evidence.provider_write_performed)throw new Error('boundary');
          if(r.status==='NATIVE_FULL_PREPROD'&&(!r.full_gate.ci_green||!r.full_gate.native_full||!r.full_gate.evidence_ref||!fs.existsSync(r.full_gate.evidence_ref)))throw new Error('full evidence');
          console.log(JSON.stringify({status:'GREEN',capability:r.capability_id}));
          NODE
