name: CEREBRO Browser Postcondition Apply
on:
  push:
    branches: [cerebro/navegador-postcondition-20261024]
    paths:
      - scripts/apply-navegador-postcondition.py
      - .github/workflows/cerebro-browser-postcondition-apply.yml
permissions:
  contents: write
jobs:
  apply-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cerebro/navegador-postcondition-20261024
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded UI patch
        run: python3 scripts/apply-navegador-postcondition.py
      - name: Assert bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/CerebroBrowserConsole.tsx"
      - name: Install locked dependencies
        run: npm ci
      - name: Test command postconditions
        run: node --experimental-strip-types --test cerebro/runtime/browser-natural-command-v3.test.mjs
      - name: Build application
        run: npm run build
      - name: Commit UI patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CerebroBrowserConsole.tsx
          git commit -m 'fix(navegador): verify natural-order outcomes' || exit 0
          git push origin HEAD:cerebro/navegador-postcondition-20261024
