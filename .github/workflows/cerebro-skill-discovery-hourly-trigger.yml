name: CEREBRO Skill Discovery Hourly Trigger

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cerebro-skill-discovery-hourly-trigger.yml'

concurrency:
  group: cerebro-skill-discovery-hourly-trigger
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  trigger-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Skill Discovery Scout with retry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_with_retry() {
            local workflow="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" --ref main; then
                echo "Dispatched $workflow on attempt $attempt"
                return 0
              fi
              echo "::warning::Dispatch attempt $attempt failed for $workflow"
              sleep $(( attempt * 5 ))
            done
            echo "::error::Unable to dispatch $workflow after 3 attempts"
            return 1
          }
          dispatch_with_retry cerebro-skill-discovery-scout.yml

      - name: Recover missed GitHub-wide Scout schedule without duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WIDE_SCOUT_WORKFLOW: cerebro-skill-github-wide-scout.yml
          MAX_WIDE_SCOUT_AGE_SECONDS: '4500'
        shell: bash
        run: |
          set -euo pipefail

          dispatch_with_retry() {
            local workflow="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" --ref main; then
                echo "Dispatched $workflow on attempt $attempt"
                return 0
              fi
              echo "::warning::Dispatch attempt $attempt failed for $workflow"
              sleep $(( attempt * 5 ))
            done
            echo "::error::Unable to dispatch $workflow after 3 attempts"
            return 1
          }

          if ! latest_json="$(gh run list --workflow "$WIDE_SCOUT_WORKFLOW" --branch main --limit 1 --json databaseId,createdAt,status,conclusion 2>/tmp/wide-scout-list.err)"; then
            echo "::warning::Unable to inspect latest GitHub-wide Scout run; attempting recovery dispatch"
            cat /tmp/wide-scout-list.err || true
            dispatch_with_retry "$WIDE_SCOUT_WORKFLOW"
            exit 0
          fi

          count="$(jq 'length' <<<"$latest_json")"
          if [[ "$count" == "0" ]]; then
            echo "No prior GitHub-wide Scout run found; dispatching recovery run"
            dispatch_with_retry "$WIDE_SCOUT_WORKFLOW"
            exit 0
          fi

          status="$(jq -r '.[0].status // "unknown"' <<<"$latest_json")"
          conclusion="$(jq -r '.[0].conclusion // ""' <<<"$latest_json")"
          created_at="$(jq -r '.[0].createdAt // ""' <<<"$latest_json")"
          run_id="$(jq -r '.[0].databaseId // "unknown"' <<<"$latest_json")"

          if [[ "$status" == "queued" || "$status" == "in_progress" || "$status" == "waiting" || "$status" == "pending" ]]; then
            echo "GitHub-wide Scout run $run_id is already active ($status); no duplicate dispatch"
            exit 0
          fi

          if [[ -z "$created_at" ]]; then
            echo "::warning::Latest GitHub-wide Scout run has no createdAt; dispatching recovery run"
            dispatch_with_retry "$WIDE_SCOUT_WORKFLOW"
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          created_epoch="$(date -u -d "$created_at" +%s)"
          age_seconds=$(( now_epoch - created_epoch ))
          echo "Latest GitHub-wide Scout run=$run_id status=$status conclusion=${conclusion:-none} age_seconds=$age_seconds"

          if (( age_seconds > MAX_WIDE_SCOUT_AGE_SECONDS )); then
            echo "GitHub-wide Scout is stale; dispatching recovery run"
            dispatch_with_retry "$WIDE_SCOUT_WORKFLOW"
            exit 0
          fi

          case "$conclusion" in
            success|skipped|neutral)
              echo "Recent GitHub-wide Scout is healthy enough; direct schedule remains primary"
              ;;
            *)
              echo "::warning::Recent GitHub-wide Scout concluded '$conclusion'; dispatching bounded recovery run"
              dispatch_with_retry "$WIDE_SCOUT_WORKFLOW"
              ;;
          esac
