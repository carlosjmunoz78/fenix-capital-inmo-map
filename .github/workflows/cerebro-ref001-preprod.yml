name: CEREBRO REF-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-post001-postfirma-engine-v0-20260911']
    paths:
      - 'cerebro/customer/referral-engine.mjs'
      - 'cerebro/tests/referral-engine.test.mjs'
      - '.github/workflows/cerebro-ref001-preprod.yml'
jobs:
  ref001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/referral-engine.test.mjs
