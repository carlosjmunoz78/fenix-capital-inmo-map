name: CEREBRO Secret Reference Audit

# SECURITY_INCIDENT #383: static, non-destructive validation only.
on:
  pull_request:
    paths:
      - '.github/workflows/prod-live-deploy.yml'
      - '.github/workflows/prod-rollback-rehearsal.yml'
      - '.github/workflows/cerebro-secret-ref-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-secret-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert PROD workflows use secret reference
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/prod-live-deploy.yml .github/workflows/prod-rollback-rehearsal.yml; do
            grep -F '${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}' "$file" >/dev/null
            ! grep -E 'VITE_SUPABASE_PUBLISHABLE_KEY:[[:space:]]*sb_publishable_' "$file"
          done

      - name: Assert fail-closed availability gates exist
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/prod-live-deploy.yml .github/workflows/prod-rollback-rehearsal.yml; do
            grep -F 'Assert required secret references are available' "$file" >/dev/null
            grep -F 'test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}"' "$file" >/dev/null
          done

      - name: Assert scope remains non-destructive
        shell: bash
        run: |
          set -euo pipefail
          echo 'This audit does not rotate, revoke, deploy, mutate Supabase, or expose secret values.'
