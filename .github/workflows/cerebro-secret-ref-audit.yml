name: CEREBRO Secret Reference Audit

# SECURITY_INCIDENT #383: non-destructive validation only.
on:
  pull_request:
    paths:
      - '.github/workflows/prod-live-deploy.yml'
      - '.github/workflows/prod-rollback-rehearsal.yml'
      - '.github/workflows/cerebro-secret-ref-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-secret-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert PROD workflows use secret reference
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/prod-live-deploy.yml .github/workflows/prod-rollback-rehearsal.yml; do
            grep -F 'secrets.PROD_SUPABASE_PUBLISHABLE_KEY' "$file" >/dev/null
            ! grep -E 'VITE_SUPABASE_PUBLISHABLE_KEY:[[:space:]]*sb_publishable_' "$file"
          done

      - name: Assert publishable secret is available and browser-safe without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SUPABASE_PUBLISHABLE_KEY}"
          case "${PROD_SUPABASE_PUBLISHABLE_KEY}" in
            sb_publishable_*) ;;
            *) echo 'FAIL_CLOSED: PROD_SUPABASE_PUBLISHABLE_KEY is not a Supabase publishable browser key' >&2; exit 2 ;;
          esac
          echo 'PROD_SUPABASE_PUBLISHABLE_KEY_CLASS=publishable'

      - name: Assert fail-closed availability and class gates exist
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/prod-live-deploy.yml .github/workflows/prod-rollback-rehearsal.yml; do
            grep -F 'Assert required secret references are available' "$file" >/dev/null
            grep -F 'test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}"' "$file" >/dev/null
            grep -F 'sb_publishable_*' "$file" >/dev/null
          done

      - name: Assert scope remains non-destructive
        shell: bash
        run: |
          set -euo pipefail
          echo 'This audit does not rotate, revoke, deploy, mutate Supabase, or expose secret values.'
