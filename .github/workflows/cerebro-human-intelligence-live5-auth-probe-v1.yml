name: CEREBRO Human Intelligence Live5 Route Probe V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cerebro-human-intelligence-live5-auth-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-human-intelligence-live5-route-probe-v1
  cancel-in-progress: false

env:
  LIVE5_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-gateway-human-v1-live5
  PROD_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  live-route-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require existing browser publishable key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_PUBLISHABLE_KEY"

      - name: Prove OLD and NEW cohorts physically traverse live5 in PROD read-only
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          common=(
            -H "apikey: $PROD_PUBLISHABLE_KEY"
            -H 'Origin: https://app.fenixcapital.es'
          )

          curl --fail --silent --show-error --max-time 30 -D "$tmp/new.headers" -o "$tmp/new.body" \
            "${common[@]}" \
            -H 'x-cerebro-session-id: cerebro-e2e-live5-73' \
            "$LIVE5_URL/health"
          grep -i '^x-cerebro-human-route: new' "$tmp/new.headers"
          grep -i '^x-cerebro-human-live-percent: 5' "$tmp/new.headers"
          grep -i '^x-cerebro-human-upstream: cerebro-console-gateway-v0' "$tmp/new.headers"
          jq -e '.status=="GREEN" or .status=="OK" or .service=="cerebro-console-gateway-v0"' "$tmp/new.body" >/dev/null

          curl --fail --silent --show-error --max-time 30 -D "$tmp/old.headers" -o "$tmp/old.body" \
            "${common[@]}" \
            -H 'x-cerebro-session-id: cerebro-e2e-live5-old-0' \
            "$LIVE5_URL/health"
          grep -i '^x-cerebro-human-route: old' "$tmp/old.headers"
          grep -i '^x-cerebro-human-live-percent: 5' "$tmp/old.headers"
          grep -i '^x-cerebro-human-upstream: cerebro-console-gateway-v0' "$tmp/old.headers"
          jq -e '.status=="GREEN" or .status=="OK" or .service=="cerebro-console-gateway-v0"' "$tmp/old.body" >/dev/null

          echo 'PROD_LIVE5_ROUTE_PROOF=GREEN' >> "$GITHUB_STEP_SUMMARY"
          echo 'Physical read-only /health traversal only; no business mutation, no customer payload, no Trading access.' >> "$GITHUB_STEP_SUMMARY"
