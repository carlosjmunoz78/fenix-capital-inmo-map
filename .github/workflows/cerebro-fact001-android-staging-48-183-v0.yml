name: CEREBRO FACT001 Android Staging 48 183 V0

on:
  push:
    paths:
      - 'cerebro/runtime/build-android-preprod-v0.sh'
      - 'cerebro/registry/fact001-android-staging-48-183.v0.json'
      - '.github/workflows/cerebro-fact001-android-staging-48-183-v0.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/build-android-preprod-v0.sh'
      - 'cerebro/registry/fact001-android-staging-48-183.v0.json'
      - '.github/workflows/cerebro-fact001-android-staging-48-183-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert no dependency installer path
        run: |
          if grep -Eiq 'sdkmanager|gradle |gradlew|mvn |npm (install|ci)|apt(-get)? install|curl .*[|].*(sh|bash)|wget .*[|].*(sh|bash)' cerebro/runtime/build-android-preprod-v0.sh; then
            echo 'External dependency install path detected'; exit 1
          fi
      - name: Build signed worker and template APKs with preinstalled Android SDK
        run: bash cerebro/runtime/build-android-preprod-v0.sh /tmp/cerebro-android-preprod-v0
      - name: Verify APK signatures and acceptance evidence
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/cerebro-android-preprod-v0/android-preprod-build-evidence.json','utf8'));
          const r=require('./cerebro/registry/fact001-android-staging-48-183.v0.json');
          if(p.status!=='SIGNED_APK_BUILD_GREEN') process.exit(1);
          if(p.network_downloads_performed!==0||p.gradle_used||p.maven_used||p.npm_install_used||p.external_dependency_install) process.exit(1);
          if(p.prod_authorized||p.prod_write_authorized||p.trading_access||p.additional_cost_eur!==0) process.exit(1);
          if(!r.item_183.web_staging_acceptance.authenticated_preview_render_verified||!r.item_183.web_staging_acceptance.robots_noindex||r.item_183.web_staging_acceptance.page_status!=='draft') process.exit(1);
          if(!r.item_48.physical_device_bound||!r.item_48.transport_online_verified||!r.item_48.remote_command_execution_verified||!r.item_48.semantic_ui_readback_verified||!r.item_48.idempotent_replay_verified) process.exit(1);
          if(!r.item_183.web_staging_acceptance.physical_android_browser_render_readback_verified||!r.item_183.web_staging_acceptance.physical_android_synthetic_action_verified||!r.item_183.web_staging_acceptance.physical_android_post_action_readback_verified||!r.item_183.web_staging_acceptance.physical_android_replay_verified||!r.item_183.web_staging_acceptance.physical_android_rollback_to_draft_verified) process.exit(1);
          if(r.item_183.physical_device_installed||r.authority.prod_authorized||r.authority.prod_write_authorized||r.authority.public_deploy_authorized||r.authority.customer_data_authorized||r.authority.trading_access||r.authority.additional_cost_eur!==0) process.exit(1);
          if(r.parallel_remaining_gate!=='AUTHORIZED_TEMPLATE_APK_INSTALL_AND_RENDER_E2E_183') process.exit(1);
          console.log(JSON.stringify({status:'GREEN_PHYSICAL_48_WEB183_TEMPLATE_APK_PARALLEL',worker_sha:p.item_48.sha256,template_sha:p.item_183.sha256,device:r.item_48.physical_device_id,staging_page:r.item_183.web_staging_acceptance.page_id,template_apk_installed:false,prod:false,cost_eur:0}));
          NODE
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose /tmp/cerebro-android-preprod-v0/worker/worker-preprod.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose /tmp/cerebro-android-preprod-v0/template/template-preprod.apk
      - name: Canonical registry validation
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression
        working-directory: cerebro
        run: npm test
      - name: Upload APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-android-preprod-48-183-v0
          path: |
            /tmp/cerebro-android-preprod-v0/worker/worker-preprod.apk
            /tmp/cerebro-android-preprod-v0/worker/apksigner-verify.txt
            /tmp/cerebro-android-preprod-v0/template/template-preprod.apk
            /tmp/cerebro-android-preprod-v0/template/apksigner-verify.txt
            /tmp/cerebro-android-preprod-v0/android-preprod-build-evidence.json
          retention-days: 14
