name: Emergency bind GitHub Pages custom domain

on:
  push:
    branches: [emergency-pages]
    paths:
      - '.github/workflows/emergency-bind-pages-domain.yml'

permissions:
  contents: read
  pages: write

jobs:
  bind-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Bind app.fenixcapital.es without changing source or DNS
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"cname":"app.fenixcapital.es"}')
          echo "HTTP ${code}"
          if [ "$code" != "204" ]; then
            cat response.json
            exit 1
          fi
          echo '{"ok":true,"custom_domain":"app.fenixcapital.es","dns_changed":false,"source_changed":false}'
