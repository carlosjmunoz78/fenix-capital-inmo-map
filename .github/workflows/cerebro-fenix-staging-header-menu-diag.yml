name: CEREBRO Fenix STAGING Header Menu Diagnostic

on:
  push:
    branches:
      - cerebro/seo001-staging-audit-v5-20261018
    paths:
      - 'cerebro/qa/header-menu-diagnostic.mjs'
      - '.github/workflows/cerebro-fenix-staging-header-menu-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header-menu-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node cerebro/qa/header-menu-diagnostic.mjs
