name: CEREBRO OPERATIVA · Strict CORS owner-only isolated stage
on:
  push:
    branches: [cerebro/operativa-runtime-p0-fix-20261118]
permissions: {contents: read}
jobs:
  origin-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: node --test cerebro/universal/v0/supabase-activity/stage-cors-regression.test.mjs
