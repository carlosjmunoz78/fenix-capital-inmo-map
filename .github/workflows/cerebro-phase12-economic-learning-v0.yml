name: CEREBRO Phase 12 Economic Learning V0

on:
  push:
    paths:
      - 'cerebro/economics/phase12-economic-learning-runtime-v0.mjs'
      - 'cerebro/tests/phase12-economic-learning-runtime-v0.test.mjs'
      - 'cerebro/registry/phase12-economic-learning-profile.v0.json'
      - 'cerebro/docs/CEREBRO_PHASE12_ECONOMIC_LEARNING_BLOCKS_143_151_V0_2026-10-14.md'
      - 'cerebro/evidence/phase12-economic-learning-blocks-143-151-v0.json'
      - '.github/workflows/cerebro-phase12-economic-learning-v0.yml'
  pull_request:
    paths:
      - 'cerebro/economics/phase12-economic-learning-runtime-v0.mjs'
      - 'cerebro/tests/phase12-economic-learning-runtime-v0.test.mjs'
      - 'cerebro/registry/phase12-economic-learning-profile.v0.json'
      - 'cerebro/docs/CEREBRO_PHASE12_ECONOMIC_LEARNING_BLOCKS_143_151_V0_2026-10-14.md'
      - 'cerebro/evidence/phase12-economic-learning-blocks-143-151-v0.json'
      - '.github/workflows/cerebro-phase12-economic-learning-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase12-economic-learning-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Phase 12 focused contract tests
        run: node --test cerebro/tests/phase12-economic-learning-runtime-v0.test.mjs
      - name: Validate profile and evidence JSON
        run: >-
          node -e "for (const f of ['cerebro/registry/phase12-economic-learning-profile.v0.json','cerebro/evidence/phase12-economic-learning-blocks-143-151-v0.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('phase12-economic-json GREEN')"
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression suite
        working-directory: cerebro
        run: npm test
