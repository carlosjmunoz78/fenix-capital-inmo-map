name: CEREBRO Operativa ZEUS owner link LAB
on:
  push:
    branches:
      - cerebro/operativa-zeus-owner-readonly-lab-20261123
    paths:
      - 'src/CerebroOperativaUniverseViews.tsx'
      - '.github/workflows/cerebro-operativa-zeus-owner-link-lab.yml'
permissions:
  contents: read
jobs:
  build-readonly-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Ensure link is LAB-only, Access protected and non-executing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('src/CerebroOperativaUniverseViews.tsx','utf8');
          for(const value of ['section===\'motores\'','scope===\'fenix\'','scope===\'all\'','cerebro-console-zeus-owner-lab-eu.carlosj-munozcabeza.workers.dev','rel="noopener noreferrer"','No autoriza ejecución ni promoción']){
            if(!source.includes(value))throw Error('LAB_CONSOLE_LINK_CONTRACT_MISSING');
          }
          console.log('Operativa existing motor view links to owner-only ZEUS LAB without state mutation');
          NODE
