name: CEREBRO SEO · Physical cross-engine release tribunal PREPROD V0
on:
  pull_request:
    paths:
      - 'cerebro/seo-enterprise/v2/runtime/seo-physical-release-tribunal-v0.mjs'
      - 'cerebro/seo-enterprise/v2/tests/seo-physical-release-tribunal-v0.test.mjs'
      - '.github/workflows/cerebro-seo-physical-release-tribunal-v0.yml'
permissions:
  contents: read
  actions: read
jobs:
  evidence-preflight:
    name: Evidence availability · fail-closed, no site access
    if: ${{ github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      all_available: ${{ steps.archive-gate.outputs.all_available }}
    steps:
      - name: Check pinned archived GitHub Action artifacts; keep tribunal HOLD when expired
        id: archive-gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=()
          check_artifact() {
            local run_id="$1" wanted="$2" payload count
            payload="$(gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            count="$(jq --arg wanted "$wanted" '[.artifacts[] | select(.name == $wanted and (.expired == false))] | length' <<<"$payload")"
            if [[ "$count" != 1 ]]; then missing+=("$wanted"); fi
          }
          check_artifact 42242988793 seo001-v4-1-official-sources-corrections-release-hold
          check_artifact 42247533380 seo001-isolated-wordpress-fixture-restore-no-prod-snapshot
          check_artifact 42248337759 seo001-ums-physical-photo-intake-existing-asset-hold
          if (( ${#missing[@]} > 0 )); then
            echo "all_available=false" >> "$GITHUB_OUTPUT"
            echo "### RELEASE_HOLD · historical bytes unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "Physical tribunal SKIPPED (not PASSED): cannot verify missing source artifacts." >> "$GITHUB_STEP_SUMMARY"
            printf -- "- Missing: %s\n" "${missing[@]}" >> "$GITHUB_STEP_SUMMARY"
            echo "Restored real WP PROD snapshot: NOT VERIFIED. Original UMS photo and rights: NOT VERIFIED." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SEO physical tribunal HOLD: original historical artifacts unavailable; no release credentials or WordPress writes granted"
          else
            echo "all_available=true" >> "$GITHUB_OUTPUT"
            echo "### Evidence available · running physical HOLD tribunal" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "No website, staging, WordPress, CRM, model API or secrets consulted." >> "$GITHUB_STEP_SUMMARY"
  cross-engine-tribunal:
    needs: evidence-preflight
    # Never run the physical tribunal on absent/expired historical bytes.
    if: ${{ github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository && needs.evidence-preflight.outputs.all_available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch two V4.1 physical original copy artifacts
        uses: actions/download-artifact@v4
        with:
          name: seo001-v4-1-official-sources-corrections-release-hold
          run-id: 42242988793
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/seo001-tribunal-v41
      - name: Fetch SQL backup that was physically restored twice in networkless LAB
        uses: actions/download-artifact@v4
        with:
          name: seo001-isolated-wordpress-fixture-restore-no-prod-snapshot
          run-id: 42247533380
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/seo001-tribunal-wp-fixture
      - name: Fetch actual WebP pixel intake receipt from existing WP asset
        uses: actions/download-artifact@v4
        with:
          name: seo001-ums-physical-photo-intake-existing-asset-hold
          run-id: 42248337759
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/seo001-tribunal-media
      - name: Validate all original bytes, receipts and release constraints
        env:
          SEO_TRIBUNAL_ARTICLES_DIR: ${{ runner.temp }}/seo001-tribunal-v41
          SEO_TRIBUNAL_WP_DIR: ${{ runner.temp }}/seo001-tribunal-wp-fixture
          SEO_TRIBUNAL_MEDIA_DIR: ${{ runner.temp }}/seo001-tribunal-media
        run: |
          node --check cerebro/seo-enterprise/v2/runtime/seo-physical-release-tribunal-v0.mjs
          node --test cerebro/seo-enterprise/v2/tests/seo-physical-release-tribunal-v0.test.mjs
      - name: Write inspectable verdict with exact sha256 and outstanding HUMAN/technical gates
        env:
          ARTICLES: ${{ runner.temp }}/seo001-tribunal-v41
          WP: ${{ runner.temp }}/seo001-tribunal-wp-fixture
          MEDIA: ${{ runner.temp }}/seo001-tribunal-media
          OUT: ${{ runner.temp }}/seo001-tribunal-verdict-${{ github.run_id }}
        run: |
          node cerebro/seo-enterprise/v2/runtime/seo-physical-release-tribunal-v0.mjs "$ARTICLES" "$WP" "$MEDIA" "$OUT"
      - name: Archive full cross-engine PREPROD evidence with no publish permission
        uses: actions/upload-artifact@v4
        with:
          name: seo001-cross-engine-physical-tribunal-release-hold
          path: ${{ runner.temp }}/seo001-tribunal-verdict-${{ github.run_id }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Never infer PROD autonomy from fixture restores or existing-site photos
        run: echo 'V4_1_PHYSICAL_SHA=CHECKED PHOTOGRAPH_NEW_UMS=NO WP_REAL_BACKUP_RESTORED=NO TRIBUNAL=HOLD NO_MODEL_CALLS=YES WP_WRITES=0'
