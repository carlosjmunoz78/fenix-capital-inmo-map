name: Patch comprador evidence PROD UI

on:
  push:
    branches: [preprod-app-phase1]
    paths:
      - '.github/workflows/patch-comprador-evidence-20260909.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preprod-app-phase1
          fetch-depth: 0
      - name: Enable comprador origin and lock regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ContextEvidenceUpload.tsx')
          s=p.read_text()
          old="const PROD_SUPPORTED_ORIGINS=new Set(['expediente','contacto','firma']);"
          new="const PROD_SUPPORTED_ORIGINS=new Set(['expediente','comprador','contacto','firma']);"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one origin set, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          t=Path('tests/context-evidence-comprador-prod.spec.ts')
          t.write_text("""import {test,expect} from '@playwright/test';\nimport fs from 'node:fs';\nimport path from 'node:path';\n\ntest('PROD permite evidencia contextual de comprador y conserva extracción',()=>{\n const src=fs.readFileSync(path.resolve('src/ContextEvidenceUpload.tsx'),'utf8');\n expect(src).toContain(\"new Set(['expediente','comprador','contacto','firma'])\");\n expect(src).toContain(\"if(comprador)return{type:'comprador'\");\n expect(src).toContain(\"EXTRACT_FUNCTION=IS_PRODUCTION?'fenix-document-extract'\");\n});\n""")
          PY
          git diff --check
          grep -F "new Set(['expediente','comprador','contacto','firma'])" src/ContextEvidenceUpload.tsx
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ContextEvidenceUpload.tsx tests/context-evidence-comprador-prod.spec.ts
          git commit -m 'fix: enable comprador evidence origin in PROD UI'
          git push origin HEAD:preprod-app-phase1
