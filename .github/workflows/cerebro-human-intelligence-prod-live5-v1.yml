name: CEREBRO Human Intelligence PROD Live5 V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/cerebro-console-gateway-human-v1-canary/live5.ts'
      - 'supabase/functions/cerebro-console-gateway-human-v1-canary/router-live5.ts'
      - 'supabase/functions/cerebro-console-gateway-human-v1-canary/overlay.ts'
      - 'cerebro/tests/human-intelligence-prod-live5-v1.test.mjs'
      - '.github/workflows/cerebro-human-intelligence-prod-live5-v1.yml'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cerebro-human-intelligence-prod-live5-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  CANARY_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-gateway-human-v1-live5
  CANARY_AUDIENCE: cerebro-console-gateway-human-v1-live5

jobs:
  live5-additive-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test bounded parallel live canary and conservative overlay
        run: |
          node --test \
            cerebro/tests/human-intelligence-prod-live5-v1.test.mjs \
            cerebro/tests/human-intelligence-production-overlay-v1.test.mjs \
            cerebro/tests/channel-access-profiles-v1.test.mjs

      - name: Assert immutable zero rollback surfaces remain untouched
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero='supabase/functions/cerebro-console-gateway-human-v1-canary'
          zr='supabase/functions/cerebro-console-human-router-zero-v1'
          grep -F 'PROD_CANARY_UNROUTED' "$zero/index.ts"
          grep -F 'export const LIVE_CANARY_PERCENT=0;' "$zero/router.ts"
          grep -F 'export const LIVE_CANARY_PERCENT=0;' "$zr/router.ts"
          base="${PR_BASE_SHA:-}"
          if [ -z "$base" ]; then git fetch origin main --depth=1; base="$(git rev-parse FETCH_HEAD)"; fi
          git cat-file -e "${base}^{commit}"
          git diff --exit-code "$base"...HEAD -- \
            "$zero/index.ts" "$zero/router.ts" \
            "$zr/index.ts" "$zr/router.ts" "$zr/auth.ts" \
            supabase/functions/cerebro-console-gateway-v0

      - name: Assert live5 authority safety and privacy-minimized telemetry
        shell: bash
        run: |
          set -euo pipefail
          d='supabase/functions/cerebro-console-gateway-human-v1-canary'
          f="$d/live5.ts"
          r="$d/router-live5.ts"
          test -f "$f" && test -f "$r"
          grep -F 'export const LIVE_CANARY_PERCENT=5;' "$r"
          grep -F 'export const MAX_CANARY_PERCENT=25;' "$r"
          grep -F 'cerebro-console-gateway-v0' "$f"
          grep -F 'OVERLAY_FAIL_SAFE' "$f"
          grep -F "event:'CEREBRO_HI_ROUTE_V1'" "$f"
          grep -F 'contains_user_data:false' "$f"
          grep -F 'prod_write_authorized:false' "$f"
          grep -F 'trading_access:false' "$f"
          ! grep -F 'SUPABASE_SERVICE_ROLE_KEY' "$f" "$r"
          ! grep -Eq 'prod_write_authorized[[:space:]]*:[[:space:]]*true|trading_access[[:space:]]*:[[:space:]]*true' "$f" "$r"

      - name: Acquire short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CANARY_AUDIENCE}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$url" | jq -r '.value' > /tmp/cerebro-human-live5-oidc
          test -s /tmp/cerebro-human-live5-oidc
          chmod 600 /tmp/cerebro-human-live5-oidc

      - name: Physical PROD live5 health proves bounded 5 percent and OLD fail-safe
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-live5-oidc)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            "${CANARY_URL}/canary/health" > /tmp/live5-health.json
          jq -e '.ok==true and .environment=="PROD_CANARY_LIVE_5" and .upstream=="cerebro-console-gateway-v0" and .live_canary_percent==5 and .max_canary_percent==25 and .fail_closed_target=="OLD" and .overlay_mode=="CONSERVATIVE_AUTHORITATIVE_PRESERVING" and .privacy_safe_route_logging==true and .prod_write_authorized==false and .trading_access==false and .additional_cost_eur==0' /tmp/live5-health.json >/dev/null

      - name: Physical routing rehearsal proves 5 percent bounded and 26 percent rejected
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-live5-oidc)"
          jq -n '{requested_percent:5,cohort_keys:[range(0;100)|"synthetic-session-\(.)"]}' > /tmp/live5-route.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/live5-route.json \
            "${CANARY_URL}/canary/router-rehearsal" > /tmp/live5-route-out.json
          jq -e '.ok==true and .live_canary_percent==5 and .requested_rehearsal_percent==5 and (.decisions|length)==100 and .safety.synthetic_only==true and .safety.upstream_prod_chat_called==false and .safety.route_state_mutated==false and .safety.prod_write_authorized==false and .safety.trading_access==false and .safety.customer_data==false and .safety.additional_cost_eur==0' /tmp/live5-route-out.json >/dev/null
          code="$(curl --silent --output /tmp/live26.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data '{"requested_percent":26,"cohort_keys":["x"]}' "${CANARY_URL}/canary/router-rehearsal")"
          test "$code" = '400'
          jq -e '.error=="UNSAFE_REHEARSAL_PERCENT"' /tmp/live26.json >/dev/null

      - name: Physical synthetic overlay preserves authority and protected actions
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-live5-oidc)"
          cat > /tmp/overlay.json <<'JSON'
          {"user_message":"Sigo perdido con la hipoteca","upstream":{"status":"OK","intent":"finance_knowledge","executed":false,"message":"Para valorar la operación hay que revisar ingresos, obligaciones, ahorro y precio de compra."},"history":[]}
          JSON
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/overlay.json "${CANARY_URL}/canary/rehearsal" > /tmp/overlay-out.json
          jq -e '.ok==true and .live_canary_percent==5 and .result.overlay.applied==true and .result.overlay.authoritative_preserved==true and .result.overlay.questions_added<=1 and .safety.upstream_prod_chat_called==false and .safety.prod_write_authorized==false and .safety.trading_access==false' /tmp/overlay-out.json >/dev/null
          cat > /tmp/action.json <<'JSON'
          {"user_message":"actívalo","upstream":{"status":"ACTION_PROPOSAL","intent":"seo_zone_activation","executed":false,"action":{"action_id":"SYNTHETIC"},"message":"Propuesta exacta. ¿Quieres que active exactamente este proceso?"},"history":[]}
          JSON
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/action.json "${CANARY_URL}/canary/rehearsal" > /tmp/action-out.json
          jq -e '.result.overlay.applied==false and .result.overlay.reason=="PROTECTED_OR_NONPASSIVE" and .result.response.status=="ACTION_PROPOSAL" and .result.response.action.action_id=="SYNTHETIC"' /tmp/action-out.json >/dev/null

      - name: Record additive boundary
        run: |
          echo 'GREEN proves the parallel live5 function exists physically in PROD, is bounded to 5%, wraps OLD authoritative responses conservatively, preserves protected actions, and has no new PROD write/Trading authority.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This CEREBRO PR does not change any consumer URL. Activation requires a separate App PROD cutover after exact-head gates and cohort-sampling readiness are GREEN.' >> "$GITHUB_STEP_SUMMARY"
