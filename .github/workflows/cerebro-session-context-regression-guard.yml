name: CEREBRO Session Context Regression Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cerebro-session-context-regression-guard.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - '.github/workflows/cerebro-session-context-regression-guard.yml'

permissions:
  contents: read

jobs:
  session-context-regression-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no direct legacy session_context callers
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E "rpc\(['\"]fenix_prod_session_context['\"]" src supabase/functions; then
            echo "Direct legacy fenix_prod_session_context caller detected"
            exit 1
          fi

      - name: Assert migrated Edge functions use server identity
        shell: bash
        run: |
          set -euo pipefail
          for f in             supabase/functions/fenix-document-auto-ingest/index.ts             supabase/functions/fenix-document-existing-backfill/index.ts             supabase/functions/fenix-document-extract/index.ts             supabase/functions/fenix-document-intelligence/index.ts             supabase/functions/fenix-evidence-api/index.ts; do
            grep -F "auth.getUser" "$f" >/dev/null
            grep -F "fenix_prod_actor_context_by_auth_server" "$f" >/dev/null
          done

      - name: Assert frontend uses Edge/Gateway boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F "authenticatedEdgeFetch" src/supabase.ts >/dev/null
          grep -F "fetchAppApi" src/appRpcCompat.ts >/dev/null
          ! grep -R -n -E "rest/v1/rpc/fenix_prod_session_context|rpc\(['\"]fenix_prod_session_context['\"]" src

      - name: Assert CEREBRO knowledge routing guards
        shell: bash
        run: |
          set -euo pipefail
          grep -F "blockChildrenText" supabase/functions/cerebro-console-gateway-v0/knowledge.ts >/dev/null
          grep -F "Word boundaries prevent unrelated words" supabase/functions/cerebro-console-gateway-v0/knowledge.ts >/dev/null
          grep -F 'const scheduleIntent=/\b(proxima|siguiente|cuando|sale|publicacion|post|programada|programado|dia|hora|texto|copy|contenido|caption|imagen|foto|creativo|media|completa|completo)\b' supabase/functions/cerebro-console-gateway-v0/knowledge.ts >/dev/null
          grep -F 'intent:"seo_zone_simulation"' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'No se crea territorio, no se escribe ninguna cola, no se publica nada y no se ejecuta ningún cambio real.' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'action_type:"EMAIL_SEND"' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'fenix-communications-gateway/comunicaciones/prepare' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F '¿Confirmas este envío con «sí»?' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'EMAIL_CONTACT_SELECTION' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'envies|envíes' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'que le digas|que le digan|que le diga' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'mándaselo|enviaselo|envíaselo' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'Próxima publicación de' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'read_context.caption=result.item.caption' supabase/functions/cerebro-console-gateway-v0/knowledge.ts >/dev/null
          grep -F 'const socialShareCommand=/\b(mandasela|mandaselo|enviasela|enviaselo)\b/.test(text);' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'contactLookupMatch' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'intent:"social_schedule_complete"' supabase/functions/cerebro-console-gateway-v0/knowledge.ts >/dev/null
          grep -F 'La próxima publicación de Facebook' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F '(?:^|\\s)(?:a|para)\\s+(.+?)(?=\\s+(?:con|y)\\s+|$)' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'readContext?.kind==="social_schedule" && /^[\\p{L}.-]+' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'Prepararé el email con el texto, la fecha, la hora y la imagen de la publicación.' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'fenix_prod_cerebro_contact_search_server' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'Elige el número, el nombre exacto o el correo que quieres usar.' supabase/functions/cerebro-console-gateway-v0/index.ts >/dev/null
          grep -F 'GOOGLE_CONTACTS_VERIFIED' supabase/migrations/20260930190000_cerebro_contact_resolver_v1.sql >/dev/null
          grep -F "'contacto'::text" supabase/migrations/20260930184700_communications_contact_scope_and_send_states_v1.sql >/dev/null
          grep -F "'Enviando'::text,'Enviada'::text" supabase/migrations/20260930184700_communications_contact_scope_and_send_states_v1.sql >/dev/null

      - name: Assert CEREBRO domain answer routing
        shell: bash
        run: |
          set -euo pipefail
          K=supabase/functions/cerebro-console-gateway-v0/knowledge.ts
          grep -F 'intent:"finance_documentation"' "$K" >/dev/null
          grep -F 'intent:"seo_status"' "$K" >/dev/null
          grep -F 'intent:"multiempresa_onboarding"' "$K" >/dev/null
          grep -F 'FINANCE_PREANALYSIS_PAGE_ID' "$K" >/dev/null
          grep -F 'SEO_LATEST_AUDIT_PAGE_ID' "$K" >/dev/null
          grep -F 'CANONICAL_FALLBACK_V1' "$K" >/dev/null
          grep -F 'DNI/NIE en vigor' "$K" >/dev/null
          grep -F 'Auditoría de 156 contenidos publicados' "$K" >/dev/null
          grep -F 'const direct=await directDomainAnswer(question,domain);' "$K" >/dev/null

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
