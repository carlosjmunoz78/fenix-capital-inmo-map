name: CEREBRO DOCS-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-auto001-automation-factory-v0-20260911']
    paths:
      - 'cerebro/platform/system-documentation-engine.mjs'
      - 'cerebro/tests/system-documentation-engine.test.mjs'
      - '.github/workflows/cerebro-docs001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/system-documentation-engine.test.mjs
