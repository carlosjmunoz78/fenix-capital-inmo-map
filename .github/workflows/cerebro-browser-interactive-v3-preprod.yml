name: CEREBRO Browser 1 V3 PREPROD Interactive

on:
  push:
    branches: ['cerebro/navegador-phase3-1-ui-20261024']
    paths:
      - '.github/workflows/cerebro-browser-interactive-v3-preprod.yml'
      - 'cerebro/runtime/browser-job-runner-v2.mjs'
      - 'cerebro/runtime/browser-interactive-session-v3.mjs'
      - 'cerebro/runtime/browser1-access-v1.mjs'
      - 'cerebro/runtime/cloud-browser-governed-session-v1.mjs'
      - 'supabase/functions/cerebro-browser-interactive-v3/**'
      - 'supabase/functions/cerebro-browser-dispatch-v2/interactive-preprod.ts'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cerebro-browser1-v3-preprod-interactive
  cancel-in-progress: false

env:
  CEREBRO_BROWSER_DISPATCH_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-browser-dispatch-v3-preprod
  CEREBRO_BROWSER_INTERACTIVE_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-browser-interactive-v3
  CEREBRO_BROWSER_OIDC_AUDIENCE: cerebro-browser-worker-v1
  CEREBRO_BROWSER_STAGE_CONCURRENCY: '1'
  CEREBRO_BROWSER_WORKER_SLOT: '1'
  CEREBRO_BROWSER_PHASE2_SEED_CANARY: 'false'
  CEREBRO_BROWSER_INTERACTIVE_MAX_MS: '720000'
  CEREBRO_BROWSER_INTERACTIVE_FRAME_MS: '1200'
  CEREBRO_BROWSER_INTERACTIVE_POLL_MS: '400'

jobs:
  interactive-worker:
    name: Browser 1 V3 PREPROD governed worker
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Execute at most one PREPROD interactive job
        run: node cerebro/runtime/browser-job-runner-v2.mjs
