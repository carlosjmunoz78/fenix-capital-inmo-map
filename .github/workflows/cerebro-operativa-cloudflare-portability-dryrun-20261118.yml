name: CEREBRO OPERATIVA Cloudflare portability LAB DRY RUN ONLY
on:
  push:
    branches: [cerebro/operativa-cloudflare-portability-lab-20261118]
permissions:
  contents: read
concurrency:
  group: cerebro-operativa-cloudflare-portability-lab-20261118
  cancel-in-progress: false
jobs:
  port-safety-smoke:
    if: contains(github.event.head_commit.message, '[CF_DRYRUN_ONLY]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated source without credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Fail closed without Cloudflare or Vercel remote credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/cerebro/operativa-cloudflare-portability-lab-20261118
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          test -z "$VERCEL_TOKEN"
          node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync("cerebro/universal/cloudflare-portability-lab/wrangler.jsonc"));if(c.workers_dev!==false||c.preview_urls!==false||c.routes||c.triggers||c.vars||c.observability?.enabled!==false)throw Error("CF_PUBLIC_OR_SCHEDULED_SCOPE_DENIED")'
      - name: Original Vite build unchanged
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Real source catalog smoke without network or credentials
        run: node --experimental-strip-types cerebro/universal/cloudflare-portability-lab/smoke.mjs
      - name: Cloudflare bundling via Wrangler dry run only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.45.0 deploy --dry-run --config cerebro/universal/cloudflare-portability-lab/wrangler.jsonc --outdir "$RUNNER_TEMP/cerebro-cf-dryrun"
          test -d "$RUNNER_TEMP/cerebro-cf-dryrun"
          echo 'CF_SOURCE_COMPAT_DRYRUN=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'CLOUDFLARE_REMOTE_DEPLOYMENT=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PROD_PROMOTION=HOLD' >> "$GITHUB_STEP_SUMMARY"
