name: CEREBRO OPERATIVA Cloudflare portability LAB DRY RUN ONLY
on:
  push:
    branches: [cerebro/operativa-cloudflare-portability-lab-20261118]
permissions:
  contents: read
concurrency:
  group: cerebro-operativa-cloudflare-portability-lab-20261118
  cancel-in-progress: false
jobs:
  port-safety-smoke:
    if: contains(github.event.head_commit.message, '[CF_DRYRUN_ONLY]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated source without credential persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Fail closed without Cloudflare or Vercel remote credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/cerebro/operativa-cloudflare-portability-lab-20261118
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${VERCEL_TOKEN:-}"
          node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync("cerebro/universal/cloudflare-portability-lab/wrangler.jsonc"));if(c.workers_dev!==false||c.preview_urls!==false||c.routes||c.triggers||c.vars||c.observability?.enabled!==false)throw Error("CF_PUBLIC_OR_SCHEDULED_SCOPE_DENIED")'
      - name: Original Vite build unchanged
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Real source catalog smoke without network or credentials
        run: node --experimental-strip-types cerebro/universal/cloudflare-portability-lab/smoke.mjs
      - name: Cloudflare Access RS256 signature and Gateway double-check (synthetic only)
        run: node --experimental-strip-types cerebro/universal/cloudflare-portability-lab/owner-access-contract.test.mjs
      - name: Real workerd localhost SPA and denied API HTTP smoke (no remote deployment)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.164.0 dev --local --ip 127.0.0.1 --port 8788 --config cerebro/universal/cloudflare-portability-lab/wrangler.jsonc > "$RUNNER_TEMP/cerebro-workerd-local.log" 2>&1 &
          local_pid=$!
          trap 'kill "$local_pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8788/inicio -o "$RUNNER_TEMP/cerebro-local-index.html" 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$local_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -60 "$RUNNER_TEMP/cerebro-workerd-local.log"; echo 'WORKERD_LOCAL_SPA_UNAVAILABLE'; exit 2; fi
          grep -qi '<html' "$RUNNER_TEMP/cerebro-local-index.html"
          status=$(curl --silent --show-error --max-time 10 --output "$RUNNER_TEMP/cerebro-api-denied.json" --write-out '%{http_code}' 'http://127.0.0.1:8788/api/cerebro-agent-directory?company_id=fenix')
          test "$status" = 503
          grep -Fq 'CLOUDFLARE_PORTABILITY_LAB_API_DISABLED' "$RUNNER_TEMP/cerebro-api-denied.json"
          status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer SYNTHETIC_NO_LIVE_CREDENTIAL' 'http://127.0.0.1:8788/api/cerebro-agent-directory?company_id=fenix')
          test "$status" = 503
          status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' -X POST 'http://127.0.0.1:8788/api/cerebro-agent-directory')
          test "$status" = 405
          status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:8788/api/cerebro-preview-owner')
          test "$status" = 503
          echo 'WORKERD_LOCAL_RUNTIME_SPA_AND_FAIL_CLOSED_API=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'LOCAL_ONLY_127.0.0.1_NO_REMOTE_DEPLOYMENT' >> "$GITHUB_STEP_SUMMARY"
      - name: Cloudflare bundling via Wrangler dry run only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.164.0 deploy --dry-run --config cerebro/universal/cloudflare-portability-lab/wrangler.jsonc --outdir "$RUNNER_TEMP/cerebro-cf-dryrun" 2>&1 | tee "$RUNNER_TEMP/cerebro-cf-dryrun.log"
          ! grep -Fq "Your Worker may throw errors at runtime" "$RUNNER_TEMP/cerebro-cf-dryrun.log"
          test -d "$RUNNER_TEMP/cerebro-cf-dryrun"
          echo 'CF_SOURCE_COMPAT_DRYRUN=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'CLOUDFLARE_REMOTE_DEPLOYMENT=NO' >> "$GITHUB_STEP_SUMMARY"
          echo 'PROD_PROMOTION=HOLD' >> "$GITHUB_STEP_SUMMARY"
