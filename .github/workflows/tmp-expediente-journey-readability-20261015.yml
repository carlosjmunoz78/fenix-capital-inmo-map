name: TEMP PREPROD Expediente Journey Readability

on:
  push:
    branches:
      - work/expediente-journey-readability-2026-10-15

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FUNCTION_SUFFIX: '-test'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: PREPROD build
        run: npm run build
      - name: Journey contracts and browser E2E
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npx playwright test tests/expediente-stage-contract.spec.ts tests/preprod-environment-isolation.spec.ts tests/expediente-journey-save-e2e.spec.ts --project=desktop-chromium --workers=1
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expediente-journey-readability-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
