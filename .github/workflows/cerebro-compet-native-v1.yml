name: CEREBRO COMPET Native V1 PREPROD
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cerebro/runtime/compet-native-v1.mjs'
      - 'cerebro/tests/compet-native-v1.test.mjs'
      - 'cerebro/registry/capability-compet-native.v1.json'
      - 'cerebro/evidence/compet-native-v1-preprod.json'
      - 'cerebro/docs/COMPET_NATIVE_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-compet-native-v1.yml'
  push:
    branches: ['cerebro/compet-native-v1-*']
permissions: {contents: read}
jobs:
  preprod-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Factory remains valid
        working-directory: cerebro
        run: npm run validate
      - name: Existing COMPET contracts remain green
        run: node --test cerebro/tests/compet-real-targets-v0.test.mjs
      - name: COMPET native E2E
        run: node --test cerebro/tests/compet-native-v1.test.mjs
      - name: Existing COMPET runtimes preserved OLD vs NEW
        run: |
          git diff --exit-code be1c71a18cfd7ce871d805ed305f9860327ba2c4 -- \
            cerebro/runtime/fact001-gap-capabilities-v0.mjs \
            cerebro/runtime/compet-real-targets-v0.mjs \
            cerebro/registry/compet-real-targets.v0.json \
            cerebro/runtime/public-source-adapter-v0.mjs
      - name: Registry and policy gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('cerebro/registry/capability-compet-native.v1.json','utf8'));
          if(r.capability_id!=='COMPET-NATIVE'||r.owner_engine_id!=='COMPET-001'||r.environment!=='PREPROD')throw new Error('identity/owner/environment');
          if(r.prod_authorized||r.prod_write_authorized||r.additional_cost_eur!==0)throw new Error('unsafe authority/cost');
          if(r.ownership.new_engine_created!==false||r.policy.zero_cost_first!==true||r.policy.existing_fenix_soak_overclaim_forbidden!==true)throw new Error('engine/cost/soak policy');
          if(r.contracts.cross_company!=='DENY'||r.contracts.personal_data_extracted!==false||r.contracts.body_persisted!==false)throw new Error('data/tenant policy');
          if(r.full_gate.required.length!==14)throw new Error('full gate incomplete');
          if(r.existing_evidence.existing_runtime_modified!==false||r.existing_evidence.prod_touched!==false||r.existing_evidence.android_touched!==false)throw new Error('preservation boundary');
          if(r.status==='NATIVE_FULL_PREPROD'){
            if(r.full_gate.ci_green!==true||r.full_gate.native_full!==true||!r.full_gate.workflow_run_id||!r.full_gate.evidence_ref)throw new Error('full status without evidence');
            if(!fs.existsSync(r.full_gate.evidence_ref))throw new Error('evidence ref missing');
          } else if(r.status!=='PREPROD_CANDIDATE') throw new Error('unexpected status');
          console.log(JSON.stringify({status:'GREEN',capability:r.capability_id,registry_status:r.status}));
          NODE
