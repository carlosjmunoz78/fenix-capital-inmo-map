name: COMP-REG-001 Registry Promotion TEMP

on:
  push:
    branches:
      - cerebro/comp-reg-001-runtime-v0
    paths:
      - '.github/workflows/comp-reg-001-registry-promote-temp.yml'

permissions:
  contents: write

jobs:
  promote-registry:
    if: github.event.head_commit.message == 'COMP-REG · retry registry promotion after version-aware Wave1 test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cerebro/comp-reg-001-runtime-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote COMP-REG Registry pointer deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          registry_path = pathlib.Path('cerebro/factory/registry/engine-registry.json')
          version_path = pathlib.Path('cerebro/factory/versions/COMP-REG-001/0.2.0/engine.manifest.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          candidate = json.loads(version_path.read_text(encoding='utf-8'))
          matches = [e for e in registry['engines'] if e.get('engine_id') == 'COMP-REG-001']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one COMP-REG-001 entry, got {len(matches)}')
          entry = matches[0]
          expected = {
              'company_id': None,
              'engine_id': 'COMP-REG-001',
              'environment': 'PREPROD',
              'manifest': '../generated/COMP-REG-001/engine.manifest.json',
              'source_of_truth': 'git',
              'status': 'DEFINED_NOT_BUILT',
              'version': '0.1.0',
          }
          if entry != expected:
              raise SystemExit(f'OLD registry state mismatch; refusing write: {entry}')
          if candidate.get('engine_id') != 'COMP-REG-001' or candidate.get('version') != '0.2.0':
              raise SystemExit('candidate identity/version mismatch')
          if candidate.get('environment') != 'PREPROD' or candidate.get('status') != 'CONFIRMED_OPERATIONAL':
              raise SystemExit('candidate PREPROD/status gate mismatch')
          if candidate.get('cost_budget', {}).get('additional_monthly_eur_target') != 0:
              raise SystemExit('candidate cost gate mismatch')

          old_snapshot = {
              'manifest': entry['manifest'],
              'status': entry['status'],
              'version': entry['version'],
              'environment': entry['environment'],
              'company_id': entry['company_id'],
              'source_of_truth': entry['source_of_truth'],
          }
          entry.update({
              'manifest': '../versions/COMP-REG-001/0.2.0/engine.manifest.json',
              'status': 'CONFIRMED_OPERATIONAL',
              'source_of_truth': 'git+versioned_update',
              'environment': 'PREPROD',
              'company_id': None,
              'version': '0.2.0',
              'factory_scaffold': '../generated/COMP-REG-001/engine.manifest.json',
              'version_history': [old_snapshot],
          })
          if registry.get('registry_version') != '0.5.0':
              raise SystemExit(f"unexpected registry_version {registry.get('registry_version')}")
          registry['registry_version'] = '0.6.0'
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Validate versioned Registry and runtime
        run: |
          python cerebro/factory/scripts/validate_manifest.py
          python -m unittest discover -s cerebro/factory/tests -p 'test_*.py' -v
          python -m unittest discover -s cerebro/runtime/tests -p 'test_*.py' -v
      - name: Commit Registry promotion only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cerebro/factory/registry/engine-registry.json
          test "$(git diff --cached --name-only)" = "cerebro/factory/registry/engine-registry.json"
          git commit -m 'COMP-REG · promote Registry to version 0.2.0 [versioned]'
          git push origin HEAD:cerebro/comp-reg-001-runtime-v0
