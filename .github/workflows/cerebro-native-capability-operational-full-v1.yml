name: CEREBRO Native Capability Operational FULL V1

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches:
      - main
      - 'cerebro/lote12-operational-full-v1-*'
      - 'cerebro/lote12-continuous-improvement-v1-*'
    paths:
      - 'cerebro/runtime/native-capability-operational-loop-v1.mjs'
      - 'cerebro/runtime/native-capability-continuous-improvement-v1.mjs'
      - 'cerebro/tests/native-capability-operational-loop-v1.test.mjs'
      - 'cerebro/tests/native-capability-continuous-improvement-v1.test.mjs'
      - 'cerebro/registry/native-capability-operational-adoption-v1.json'
      - 'cerebro/registry/native-capability-continuous-improvement-v1.json'
      - 'cerebro/docs/NATIVE_CAPABILITY_OPERATIONAL_FULL_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-native-capability-operational-full-v1.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/native-capability-operational-loop-v1.mjs'
      - 'cerebro/runtime/native-capability-continuous-improvement-v1.mjs'
      - 'cerebro/tests/native-capability-operational-loop-v1.test.mjs'
      - 'cerebro/tests/native-capability-continuous-improvement-v1.test.mjs'
      - 'cerebro/registry/native-capability-operational-adoption-v1.json'
      - 'cerebro/registry/native-capability-continuous-improvement-v1.json'
      - 'cerebro/docs/NATIVE_CAPABILITY_OPERATIONAL_FULL_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-native-capability-operational-full-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  operational-full-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical factory registry remains valid
        working-directory: cerebro
        run: npm run validate
      - name: Operational adoption and continuous-improvement E2E
        run: >-
          node --test
          cerebro/tests/native-capability-operational-loop-v1.test.mjs
          cerebro/tests/native-capability-continuous-improvement-v1.test.mjs
      - name: Preserve all eight native runtimes OLD vs NEW
        run: |
          git diff --exit-code cd24c45149d336b3ecf9f4e70e4c2547fb05ee9c -- \
            cerebro/runtime/fact-skill-native-v1.mjs \
            cerebro/runtime/github-safe-native-v1.mjs \
            cerebro/runtime/db-safe-native-v1.mjs \
            cerebro/runtime/evt001-native-v1.mjs \
            cerebro/runtime/technology-capability-scout-native-v1.mjs \
            cerebro/runtime/compet-native-v1.mjs \
            cerebro/runtime/cap-native-v1.mjs \
            cerebro/runtime/lead-native-v1.mjs
      - name: Execute daily operational loop
        run: |
          mkdir -p /tmp/cerebro-opfull
          node cerebro/runtime/native-capability-operational-loop-v1.mjs \
            --company fenix \
            --cycle-anchor "$(date -u +'%Y-%m-%dT00:00:00Z')" \
            --workdir /tmp/cerebro-opfull/work \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "${{ github.sha }}" \
            --out /tmp/cerebro-opfull/report.json
      - name: Operational FULL policy gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cerebro-opfull/report.json','utf8'));
          if(r.status!=='OPERATIONAL_FULL_PREPROD'||r.operational_full!==true||r.capability_count!==8)throw new Error('aggregate operational FULL not green');
          if(!r.capabilities.every(x=>x.status==='ACTIVE_CONTINUOUS_PREPROD'&&x.consumer_coverage===1))throw new Error('consumer adoption incomplete');
          if(r.event_bus_all_engines_green!==true||r.all_registered_engines_total<1)throw new Error('EVT all-engine adoption incomplete');
          if(r.learning.status!=='OUTBOX_GREEN'||r.learning.feedback_events_total!==8)throw new Error('LRN feedback incomplete');
          if(r.authority.prod_authorized||r.authority.prod_write_authorized||r.authority.provider_write_authorized||r.authority.crm_write_authorized||r.authority.db_mutation_authorized||r.authority.spend_authorized||r.authority.trading_access||r.authority.android_touched||r.authority.additional_cost_eur!==0)throw new Error('authority or cost expanded');
          if(r.continuous.schedule_configured!==true||r.continuous.soak_overclaimed!==false)throw new Error('continuous contract invalid');
          console.log(JSON.stringify({status:'GREEN',capabilities:r.capability_count,bindings:r.binding_receipts_total,engines:r.all_registered_engines_total,evidence_hash:r.evidence_hash}));
          NODE
      - name: Locate previous successful persistent learning state
        id: previous_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=""
          mapfile -t runs < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/cerebro-native-capability-operational-full-v1.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs[].id')
          for candidate in "${runs[@]}"; do
            if [ "$candidate" = "${GITHUB_RUN_ID}" ]; then continue; fi
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" --jq '.artifacts[]? | select(.name=="native-capability-learning-state") | .id' | head -n1 || true)"
            if [ -n "$artifact_id" ]; then found="$candidate"; break; fi
          done
          echo "run_id=$found" >> "$GITHUB_OUTPUT"
          if [ -n "$found" ]; then echo "Previous persistent learning state found in run $found"; else echo "No previous state artifact: deterministic rebuild/bootstrap will be used"; fi
      - name: Restore previous persistent learning state
        if: steps.previous_state.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: native-capability-learning-state
          path: /tmp/cerebro-opfull/learning-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_state.outputs.run_id }}
      - name: Consume operational outcomes through LRN continuous-improvement host
        run: |
          node cerebro/runtime/native-capability-continuous-improvement-v1.mjs \
            --operational-report /tmp/cerebro-opfull/report.json \
            --outbox-root /tmp/cerebro-opfull/work/lrn-outbox \
            --state-root /tmp/cerebro-opfull/learning-state \
            --now "$(date -u +'%Y-%m-%dT00:00:00Z')" \
            --out /tmp/cerebro-opfull/continuous-improvement.json
      - name: Continuous improvement policy gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cerebro-opfull/continuous-improvement.json','utf8'));
          if(r.status!=='CONTINUOUS_IMPROVEMENT_GREEN_PREPROD'||r.continuous_improvement_green!==true||r.learning_events_total!==8)throw new Error('continuous improvement aggregate not green');
          if(r.learning.status!=='GREEN'||r.candidates.status!=='CANDIDATES_GREEN'||r.candidates.candidate_total<8||r.candidates.held_total!==0)throw new Error('learning/candidates incomplete');
          if(r.orchestration.status!=='ORCHESTRATOR_GREEN'||r.horizons.status!=='HORIZON_EXECUTORS_GREEN'||r.horizons.daily_green!==true||r.meta_observability.status!=='META_METRICS_GREEN')throw new Error('orchestration/horizons/meta incomplete');
          if(r.persistence.idempotency_green!==true||r.learning.idempotency_receipts_skipped_second_pass<1)throw new Error('idempotency not proven');
          if(r.governance.old_vs_new_required!==true||r.governance.evaluation_required!==true||r.governance.tribunal_required!==true||r.governance.automatic_code_mutation!==false||r.governance.automatic_prod_promotion!==false)throw new Error('improvement governance weakened');
          const a=r.authority;if(a.prod_authorized||a.prod_write_authorized||a.provider_write_authorized||a.crm_write_authorized||a.db_mutation_authorized||a.spend_authorized||a.trading_access||a.android_touched||a.additional_cost_eur!==0)throw new Error('continuous improvement authority/cost expanded');
          console.log(JSON.stringify({status:'GREEN',learning_events:r.learning_events_total,candidates:r.candidates.candidate_total,horizons:r.horizons.completed_total,input_fingerprint:r.input_fingerprint}));
          NODE
      - name: Existing technical native statuses remain GREEN
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=['capability-fact-skill-native.v1.json','capability-gh-safe-native.v1.json','capability-db-safe-native.v1.json','capability-evt001-native.v1.json','capability-tech-cap-scout-native.v1.json','capability-compet-native.v1.json','capability-cap-native.v1.json','capability-lead-native.v1.json'];
          for(const f of files){const r=JSON.parse(fs.readFileSync('cerebro/registry/'+f,'utf8'));if(r.status!=='NATIVE_FULL_PREPROD'||r.full_gate?.native_full!==true||r.full_gate?.ci_green!==true||r.prod_authorized!==false||r.additional_cost_eur!==0)throw new Error('technical native regression:'+f);}
          NODE
      - name: Upload operational and continuous-improvement evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-capability-operational-full-v1-${{ github.run_id }}
          path: |
            /tmp/cerebro-opfull/report.json
            /tmp/cerebro-opfull/continuous-improvement.json
            /tmp/cerebro-opfull/work/lrn-outbox
          retention-days: 30
      - name: Persist learning state for next automatic run
        uses: actions/upload-artifact@v4
        with:
          name: native-capability-learning-state
          path: /tmp/cerebro-opfull/learning-state
          retention-days: 30
          if-no-files-found: error
