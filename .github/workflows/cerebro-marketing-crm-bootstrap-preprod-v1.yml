name: CEREBRO Marketing CRM Bootstrap PREPROD V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/multicompany/marketing-crm-bootstrap-v1.mjs'
      - 'cerebro/multicompany/sql/marketing-crm-bootstrap-preprod-v1.sql'
      - 'cerebro/multicompany/rollback/marketing-crm-bootstrap-preprod-v1.rollback.sql'
      - 'cerebro/tests/marketing-crm-bootstrap-v1.test.mjs'
      - 'cerebro/tests/marketing-crm-bootstrap-preprod-persistence-v1.test.mjs'
      - '.github/workflows/cerebro-marketing-crm-bootstrap-preprod-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/multicompany/marketing-crm-bootstrap-v1.mjs'
      - 'cerebro/multicompany/sql/marketing-crm-bootstrap-preprod-v1.sql'
      - 'cerebro/multicompany/rollback/marketing-crm-bootstrap-preprod-v1.rollback.sql'
      - 'cerebro/tests/marketing-crm-bootstrap-v1.test.mjs'
      - 'cerebro/tests/marketing-crm-bootstrap-preprod-persistence-v1.test.mjs'
      - '.github/workflows/cerebro-marketing-crm-bootstrap-preprod-v1.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-marketing-crm-bootstrap-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  marketing-crm-bootstrap-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Validate all CEREBRO contracts
        working-directory: cerebro
        run: |
          npm run validate
          npm test
      - name: Focused marketing CRM bootstrap proof
        run: |
          node --test cerebro/tests/marketing-crm-bootstrap-v1.test.mjs cerebro/tests/marketing-crm-bootstrap-preprod-persistence-v1.test.mjs
      - name: Assert strict boundary
        shell: bash
        run: |
          set -euo pipefail
          runtime='cerebro/multicompany/marketing-crm-bootstrap-v1.mjs'
          m='cerebro/multicompany/sql/marketing-crm-bootstrap-preprod-v1.sql'
          r='cerebro/multicompany/rollback/marketing-crm-bootstrap-preprod-v1.rollback.sql'
          grep -F "MARKETING_CRM_BOOTSTRAP_ENGINE_IDS=Object.freeze(['MKTBOOT-001','CRMBOOT-001'])" "$runtime"
          grep -F "MARKETING_CRM_BOOTSTRAP_ENVIRONMENT='PREPROD'" "$runtime"
          grep -F 'crm_write_authorized:false' "$runtime"
          grep -F 'spend_authorized:false' "$runtime"
          grep -F 'cerebro_marketing_crm_bootstrap_record_preprod' "$m"
          grep -F "engine_id='APPBOOT-001' and state='BLOCKED'" "$m"
          grep -F "'APP_BOOTSTRAP_DURABLE_EXECUTION_REQUIRED'" "$m"
          grep -F 'enable row level security' "$m"
          grep -F 'to service_role' "$m"
          ! grep -F 'fenix_prod.' "$m"
          ! grep -Eqi '\btruncate\b|\bdelete[[:space:]]+from\b' "$m"
          ! grep -Fi 'cascade' "$r"
      - name: Record boundary
        run: |
          echo 'MKTBOOT-001 and CRMBOOT-001 are deterministic PREPROD plan-only wrappers over existing CEREBRO owners.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No CRM writes, campaign publication, spend, PROD authority, Trading access or paid dependency is introduced.' >> "$GITHUB_STEP_SUMMARY"
