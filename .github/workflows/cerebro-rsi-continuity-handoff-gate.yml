name: CEREBRO RSI Continuity Handoff Gate
on:
  pull_request:
    paths: ['cerebro/runtime/continuity-handoff.mjs','cerebro/tests/continuity-handoff.test.mjs','cerebro/docs/RSI_CONTINUITY_HANDOFF_V0.md','.github/workflows/cerebro-rsi-continuity-handoff-gate.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  block-m-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node --test cerebro/tests/continuity-handoff.test.mjs
