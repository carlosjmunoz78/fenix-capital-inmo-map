name: CEREBRO AUTO-001 Repair Validation V0

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'

permissions:
  contents: read
  actions: read

jobs:
  validate-certified-repair:
    if: startsWith(github.head_ref, 'cerebro/auto001-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Snapshot base and enforce one-file bounded diff
        id: diff
        run: |
          set -euo pipefail
          mkdir -p artifacts/repair-validation
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git show "$BASE_SHA:src/App.tsx" > artifacts/repair-validation/base-App.tsx
          cp src/App.tsx artifacts/repair-validation/candidate-App.tsx
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > artifacts/repair-validation/files.txt
          FILES="$(wc -l < artifacts/repair-validation/files.txt | tr -d ' ')"
          test "$FILES" -eq 1
          test "$(cat artifacts/repair-validation/files.txt)" = 'src/App.tsx'
          DELTA="$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" -- src/App.tsx | awk '{print $1+$2}')"
          test "$DELTA" -ge 1
          test "$DELTA" -le 4
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "delta=$DELTA" >> "$GITHUB_OUTPUT"
      - name: Prove permanent regression and tribunal contracts
        run: node --test cerebro/tests/auto001-preprod-patch-executor-v0.test.mjs cerebro/tests/auto001-repair-validation-v0.test.mjs
      - name: Build candidate with existing repository toolchain
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Measure OLD vs NEW and prove exact rebuild plus rollback
        run: |
          node cerebro/qa/auto001-repair-validator-v0.mjs \
            --base artifacts/repair-validation/base-App.tsx \
            --candidate artifacts/repair-validation/candidate-App.tsx \
            --base-sha '${{ github.event.pull_request.base.sha }}' \
            --head-sha '${{ github.event.pull_request.head.sha }}' \
            --out artifacts/repair-validation/validation.json
          jq -e '.status=="VALIDATION_GREEN" and .old_vs_new.old==0 and .old_vs_new.new==2 and .old_vs_new.improved==true and .regression.passed==true and .rebuild.passed==true and .rollback.passed==true and .promotion_authorized==false and .auto_merge==false' artifacts/repair-validation/validation.json >/dev/null
      - name: Independent tribunal
        run: |
          node cerebro/governance/auto001-repair-tribunal-v0.mjs \
            --validation artifacts/repair-validation/validation.json \
            --build-green true \
            --tests-green true \
            --diff-files '${{ steps.diff.outputs.files }}' \
            --diff-line-delta '${{ steps.diff.outputs.delta }}' \
            --out artifacts/repair-validation/tribunal.json
          jq -e '.status=="APPROVE_PREPROD_PATCH" and .approved==true and .authority.merge_authorized==false and .authority.promotion_authorized==false and .authority.prod_authorized==false and .authority.prod_write_authorized==false and .safety.additional_subscription_eur==0' artifacts/repair-validation/tribunal.json >/dev/null
      - name: Upload immutable validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-auto001-repair-validation-v0-${{ github.run_id }}
          path: artifacts/repair-validation/**
          if-no-files-found: warn
          retention-days: 30
