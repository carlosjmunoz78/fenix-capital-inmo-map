name: CEREBRO DATA-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-vcon001-vendor-contracts-v0-20260911']
    paths:
      - 'cerebro/platform/data-governance-engine.mjs'
      - 'cerebro/tests/data-governance-engine.test.mjs'
      - '.github/workflows/cerebro-data001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/data-governance-engine.test.mjs
