name: CEREBRO Skill Discovery Scout

on:
  push:
    paths:
      - 'cerebro/skills/**'
      - 'cerebro/tests/skill-*.test.mjs'
      - '.github/workflows/cerebro-skill-discovery-scout.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CEREBRO_DISCOVERY_OUTPUT: artifacts/cerebro-skill-discovery.json
  CEREBRO_UPSTREAM_OUTPUT: artifacts/cerebro-skill-upstreams.json
  CEREBRO_OVERLAP_OUTPUT: artifacts/cerebro-skill-overlap.json
  CEREBRO_MANIFEST_OUTPUT: artifacts/cerebro-skill-manifests.json
  CEREBRO_SHORTLIST_OUTPUT: artifacts/cerebro-skill-shortlist.json
  CEREBRO_BUNDLE_OUTPUT: artifacts/cerebro-skill-bundles-p0.json
  CEREBRO_LICENSE_OUTPUT: artifacts/cerebro-skill-license-evidence.json
  CEREBRO_PRELAB_OUTPUT: artifacts/cerebro-skill-prelab-p0.json
  CEREBRO_WRAPPER_OUTPUT: artifacts/cerebro-skill-wrapper-plans-p0.json
  CEREBRO_VALUE_OUTPUT: artifacts/cerebro-skill-value-p0.json
  CEREBRO_LAB_PLAN_OUTPUT: artifacts/cerebro-skill-lab-eval-plans-p0.json
  CEREBRO_STATIC_LAB_OUTPUT: artifacts/cerebro-skill-static-lab-p0.json
  CEREBRO_OLDNEW_OUTPUT: artifacts/cerebro-skill-old-vs-new-p0.json
  CEREBRO_PROVIDER_BINDING_OUTPUT: artifacts/cerebro-skill-provider-binding.json
  CEREBRO_ZERO_COST_ROUTE_OUTPUT: artifacts/cerebro-skill-zero-cost-route.json
  CEREBRO_FREE_QUOTA_OUTPUT: artifacts/cerebro-skill-free-quota-plan.json
  CEREBRO_BEHAVIORAL_GATE_OUTPUT: artifacts/cerebro-skill-behavioral-execution-gate.json
  CEREBRO_EVENTS_OUTPUT: artifacts/cerebro-skill-improvement-events.json
  CEREBRO_RSI_SHADOW_OUTPUT: artifacts/cerebro-skill-rsi-shadow.json
  CEREBRO_PROMOTION_READINESS_OUTPUT: artifacts/cerebro-skill-promotion-readiness.json
  CEREBRO_UPSTREAM_MAX_REPOS: '24'

jobs:
  read-only-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run all Skill Supply Chain tests
        run: node --test cerebro/tests/skill-*.test.mjs
      - name: Discover public skill candidates without executing them
        run: node cerebro/skills/skill-source-discovery.mjs --output "$CEREBRO_DISCOVERY_OUTPUT"
      - name: Resolve GitHub repository metadata, license hint and exact head without executing code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/skills/skill-upstream-resolver.mjs --input "$CEREBRO_DISCOVERY_OUTPUT" --output "$CEREBRO_UPSTREAM_OUTPUT" --max-repos "$CEREBRO_UPSTREAM_MAX_REPOS"
      - name: Resolve candidate SKILL.md files and scan as inert text only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/skills/skill-manifest-resolver.mjs --discovery "$CEREBRO_DISCOVERY_OUTPUT" --upstreams "$CEREBRO_UPSTREAM_OUTPUT" --output "$CEREBRO_MANIFEST_OUTPUT"
      - name: Resolve exact-commit license evidence without making legal compatibility claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/skills/skill-license-evidence.mjs --discovery "$CEREBRO_DISCOVERY_OUTPUT" --upstreams "$CEREBRO_UPSTREAM_OUTPUT" --manifests "$CEREBRO_MANIFEST_OUTPUT" --output "$CEREBRO_LICENSE_OUTPUT"
      - name: Analyze overlap using candidate-specific manifest evidence
        run: node cerebro/skills/skill-overlap-analyzer.mjs --discovery "$CEREBRO_DISCOVERY_OUTPUT" --upstreams "$CEREBRO_UPSTREAM_OUTPUT" --manifests "$CEREBRO_MANIFEST_OUTPUT" --output "$CEREBRO_OVERLAP_OUTPUT"
      - name: Apply candidate policy and produce non-installing LAB shortlist
        run: node cerebro/skills/skill-candidate-policy.mjs --discovery "$CEREBRO_DISCOVERY_OUTPUT" --upstreams "$CEREBRO_UPSTREAM_OUTPUT" --overlap "$CEREBRO_OVERLAP_OUTPUT" --manifests "$CEREBRO_MANIFEST_OUTPUT" --output "$CEREBRO_SHORTLIST_OUTPUT"
      - name: Statically inventory P0 skill bundles without executing instructions or code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/skills/skill-bundle-scanner.mjs --shortlist "$CEREBRO_SHORTLIST_OUTPUT" --upstreams "$CEREBRO_UPSTREAM_OUTPUT" --manifests "$CEREBRO_MANIFEST_OUTPUT" --priority P0 --output "$CEREBRO_BUNDLE_OUTPUT"
      - name: Apply fail-closed P0 pre-LAB admission gate
        run: node cerebro/skills/skill-prelab-admission.mjs --shortlist "$CEREBRO_SHORTLIST_OUTPUT" --bundles "$CEREBRO_BUNDLE_OUTPUT" --licenses "$CEREBRO_LICENSE_OUTPUT" --output "$CEREBRO_PRELAB_OUTPUT"
      - name: Generate disabled CEREBRO wrapper plans for static pre-LAB candidates
        run: node cerebro/skills/skill-wrapper-plan.mjs --prelab "$CEREBRO_PRELAB_OUTPUT" --shortlist "$CEREBRO_SHORTLIST_OUTPUT" --manifests "$CEREBRO_MANIFEST_OUTPUT" --licenses "$CEREBRO_LICENSE_OUTPUT" --output "$CEREBRO_WRAPPER_OUTPUT"
      - name: Rank static-ready candidates by evidence-based value and operational fit without popularity
        run: node cerebro/skills/skill-value-evaluator.mjs --wrappers "$CEREBRO_WRAPPER_OUTPUT" --prelab "$CEREBRO_PRELAB_OUTPUT" --upstreams "$CEREBRO_UPSTREAM_OUTPUT" --overlap "$CEREBRO_OVERLAP_OUTPUT" --licenses "$CEREBRO_LICENSE_OUTPUT" --manifests "$CEREBRO_MANIFEST_OUTPUT" --output "$CEREBRO_VALUE_OUTPUT"
      - name: Generate top-3 LAB evaluation plans without executing external code
        run: node cerebro/skills/skill-lab-eval-plan.mjs --value "$CEREBRO_VALUE_OUTPUT" --top-n 3 --output "$CEREBRO_LAB_PLAN_OUTPUT"
      - name: Run inert static LAB benchmark on exact-commit SKILL.md text
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/skills/skill-static-lab-benchmark.mjs --plans "$CEREBRO_LAB_PLAN_OUTPUT" --manifests "$CEREBRO_MANIFEST_OUTPUT" --output "$CEREBRO_STATIC_LAB_OUTPUT"
      - name: Generate OLD vs NEW synthetic behavioral contracts for static-LAB-green candidates
        run: node cerebro/skills/skill-old-vs-new-contract.mjs --static-lab "$CEREBRO_STATIC_LAB_OUTPUT" --value "$CEREBRO_VALUE_OUTPUT" --wrappers "$CEREBRO_WRAPPER_OUTPUT" --output "$CEREBRO_OLDNEW_OUTPUT"
      - name: Bind zero-cost provider readiness from secret-presence booleans only
        env:
          CEREBRO_CF_TOKEN_PRESENT: ${{ secrets.CEREBRO_CF_WORKERS_AI_TOKEN != '' }}
          CEREBRO_CF_ACCOUNT_PRESENT: ${{ secrets.CEREBRO_CF_ACCOUNT_ID != '' }}
          CEREBRO_CF_POLICY_GREEN: 'false'
          CEREBRO_CF_FREE_QUOTA_GUARD: 'true'
          CEREBRO_GEMINI_KEY_PRESENT: ${{ secrets.CEREBRO_GEMINI_API_KEY != '' }}
          CEREBRO_GEMINI_POLICY_GREEN: 'false'
          CEREBRO_GEMINI_FREE_QUOTA_GUARD: 'true'
          CEREBRO_MISTRAL_KEY_PRESENT: ${{ secrets.CEREBRO_MISTRAL_API_KEY != '' }}
          CEREBRO_MISTRAL_POLICY_GREEN: 'false'
          CEREBRO_MISTRAL_FREE_QUOTA_GUARD: 'true'
        run: node cerebro/skills/skill-provider-binding-from-env.mjs --providers cerebro/skills/zero-cost-provider-evidence.v0.json --output "$CEREBRO_PROVIDER_BINDING_OUTPUT"
      - name: Audit zero-cost online inference route without exposing credentials or invoking a model
        run: node cerebro/skills/skill-zero-cost-route-audit.mjs --providers "$CEREBRO_PROVIDER_BINDING_OUTPUT" --oldnew "$CEREBRO_OLDNEW_OUTPUT" --output "$CEREBRO_ZERO_COST_ROUTE_OUTPUT"
      - name: Build hard free-tier quota plan with no paid fallback and no model calls
        run: node cerebro/skills/skill-free-quota-guard.mjs --oldnew "$CEREBRO_OLDNEW_OUTPUT" --route "$CEREBRO_ZERO_COST_ROUTE_OUTPUT" --output "$CEREBRO_FREE_QUOTA_OUTPUT"
      - name: Keep behavioral execution fail-closed until explicitly enabled after zero-cost route is ready
        env:
          CEREBRO_BEHAVIORAL_EXECUTION_ENABLED: 'false'
          CEREBRO_ALLOW_PROD_DATA: 'false'
          CEREBRO_ALLOW_CUSTOMER_DATA: 'false'
        run: node cerebro/skills/skill-behavioral-execution-gate.mjs --oldnew "$CEREBRO_OLDNEW_OUTPUT" --route "$CEREBRO_ZERO_COST_ROUTE_OUTPUT" --quota "$CEREBRO_FREE_QUOTA_OUTPUT" --output "$CEREBRO_BEHAVIORAL_GATE_OUTPUT"
      - name: Emit LAB-aware improvement event proposals without persistent publish
        run: node cerebro/skills/skill-improvement-events.mjs --shortlist "$CEREBRO_SHORTLIST_OUTPUT" --prelab "$CEREBRO_PRELAB_OUTPUT" --wrappers "$CEREBRO_WRAPPER_OUTPUT" --value "$CEREBRO_VALUE_OUTPUT" --static-lab "$CEREBRO_STATIC_LAB_OUTPUT" --output "$CEREBRO_EVENTS_OUTPUT"
      - name: Validate current runtime and historical RSI contract through in-memory shadow bridge
        run: node cerebro/skills/skill-rsi-shadow-bridge.mjs --events "$CEREBRO_EVENTS_OUTPUT" --output "$CEREBRO_RSI_SHADOW_OUTPUT"
      - name: Emit promotion readiness evidence and explicit blockers
        run: node cerebro/skills/skill-promotion-readiness.mjs --static-lab "$CEREBRO_STATIC_LAB_OUTPUT" --oldnew "$CEREBRO_OLDNEW_OUTPUT" --route "$CEREBRO_ZERO_COST_ROUTE_OUTPUT" --quota "$CEREBRO_FREE_QUOTA_OUTPUT" --behavioral-gate "$CEREBRO_BEHAVIORAL_GATE_OUTPUT" --rsi-shadow "$CEREBRO_RSI_SHADOW_OUTPUT" --output "$CEREBRO_PROMOTION_READINESS_OUTPUT"
      - name: Upload read-only discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-discovery-${{ github.run_id }}
          path: |
            artifacts/cerebro-skill-discovery.json
            artifacts/cerebro-skill-upstreams.json
            artifacts/cerebro-skill-manifests.json
            artifacts/cerebro-skill-license-evidence.json
            artifacts/cerebro-skill-overlap.json
            artifacts/cerebro-skill-shortlist.json
            artifacts/cerebro-skill-bundles-p0.json
            artifacts/cerebro-skill-prelab-p0.json
            artifacts/cerebro-skill-wrapper-plans-p0.json
            artifacts/cerebro-skill-value-p0.json
            artifacts/cerebro-skill-lab-eval-plans-p0.json
            artifacts/cerebro-skill-static-lab-p0.json
            artifacts/cerebro-skill-old-vs-new-p0.json
            artifacts/cerebro-skill-provider-binding.json
            artifacts/cerebro-skill-zero-cost-route.json
            artifacts/cerebro-skill-free-quota-plan.json
            artifacts/cerebro-skill-behavioral-execution-gate.json
            artifacts/cerebro-skill-improvement-events.json
            artifacts/cerebro-skill-rsi-shadow.json
            artifacts/cerebro-skill-promotion-readiness.json
          if-no-files-found: error
          retention-days: 14
