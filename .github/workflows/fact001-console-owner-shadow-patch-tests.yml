name: FACT001 exact old Console v33 / new gated Cloudflare shadow regression
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/console/owner-console-v33-shadow-patch.mjs
      - cerebro/connectors/universal/console/owner-console-v33-shadow-patch.test.mjs
      - .github/workflows/fact001-console-owner-shadow-patch-tests.yml
permissions:
  contents: read
jobs:
  snapshot-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test cerebro/connectors/universal/console/owner-console-v33-shadow-patch.test.mjs
      - run: node cerebro/connectors/universal/console/owner-console-v33-shadow-patch.mjs
