name: CEREBRO Creative Job Runner V1

on:
  push:
    branches:
      - main
      - cerebro/creative-output-pipeline-v1-2026-10-24
      - cerebro/creative-prod-showcase-av-v1-2026-10-24
    paths:
      - 'cerebro/runtime/creative-job-runner-v1.mjs'
      - 'cerebro/runtime/creative-showcase-v1.mjs'
      - 'cerebro/tests/creative-job-runner-v1.test.mjs'
      - 'supabase/functions/cerebro-creative-dispatch-v1/**'
      - 'supabase/migrations/*cerebro_creative_job_v1*'
      - '.github/workflows/cerebro-creative-job-runner-v1.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cerebro-creative-job-runner-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PIPER_RELEASE: '2023.11.14-2'
  PIPER_VOICE_REV: 'b145f2ac26522d6a2ccde0164b7b0e48b1e3199c'
  CEREBRO_PIPER_BIN: /tmp/cerebro-piper/piper/piper
  CEREBRO_PIPER_MODEL: /tmp/cerebro-piper/es_ES-sharvard-medium.onnx
  CEREBRO_PIPER_CONFIG: /tmp/cerebro-piper/es_ES-sharvard-medium.onnx.json

jobs:
  creative-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CEREBRO_CREATIVE_DISPATCH_URL: ${{ github.ref == 'refs/heads/main' && 'https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-creative-dispatch-v1' || 'https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-creative-dispatch-v1' }}
      CEREBRO_CREATIVE_OIDC_AUDIENCE: cerebro-creative-worker-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit contract tests
        run: node --test cerebro/tests/creative-job-runner-v1.test.mjs
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -F ' subtitles '
      - name: Cache pinned Piper neural voice runtime
        uses: actions/cache@v4
        with:
          path: /tmp/cerebro-piper
          key: cerebro-piper-${{ runner.os }}-2023-11-14-2-b145f2a-sharvard-medium
      - name: Materialize pinned Piper neural voice runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cerebro-piper
          if [ ! -x "$CEREBRO_PIPER_BIN" ]; then
            curl --fail --location --silent --show-error \
              "https://github.com/rhasspy/piper/releases/download/${PIPER_RELEASE}/piper_linux_x86_64.tar.gz" \
              -o /tmp/cerebro-piper/piper.tar.gz
            tar -xzf /tmp/cerebro-piper/piper.tar.gz -C /tmp/cerebro-piper
          fi
          if [ ! -s "$CEREBRO_PIPER_MODEL" ]; then
            curl --fail --location --silent --show-error \
              "https://huggingface.co/rhasspy/piper-voices/resolve/${PIPER_VOICE_REV}/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx" \
              -o "$CEREBRO_PIPER_MODEL"
          fi
          if [ ! -s "$CEREBRO_PIPER_CONFIG" ]; then
            curl --fail --location --silent --show-error \
              "https://huggingface.co/rhasspy/piper-voices/resolve/${PIPER_VOICE_REV}/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx.json" \
              -o "$CEREBRO_PIPER_CONFIG"
          fi
          chmod +x "$CEREBRO_PIPER_BIN"
          "$CEREBRO_PIPER_BIN" --help >/dev/null
          {
            echo '### Piper material hashes'
            sha256sum "$CEREBRO_PIPER_BIN" "$CEREBRO_PIPER_MODEL" "$CEREBRO_PIPER_CONFIG"
          } | tee /tmp/piper-hashes.txt >> "$GITHUB_STEP_SUMMARY"
      - name: PREPROD physical image carousel reel suite
        if: ${{ github.ref == 'refs/heads/cerebro/creative-output-pipeline-v1-2026-10-24' }}
        shell: bash
        run: |
          set -euo pipefail
          CEREBRO_CREATIVE_SEED_CANARY=true node cerebro/runtime/creative-job-runner-v1.mjs | tee /tmp/creative-image.json
          CEREBRO_CREATIVE_SEED_CANARY=false node cerebro/runtime/creative-job-runner-v1.mjs | tee /tmp/creative-carousel.json
          CEREBRO_CREATIVE_SEED_CANARY=false node cerebro/runtime/creative-job-runner-v1.mjs | tee /tmp/creative-reel.json
          grep -F '"status":"SUCCEEDED"' /tmp/creative-image.json >/dev/null
          grep -F '"status":"SUCCEEDED"' /tmp/creative-carousel.json >/dev/null
          grep -F '"status":"SUCCEEDED"' /tmp/creative-reel.json >/dev/null
          grep -F '"publish_authorized":false' /tmp/creative-image.json >/dev/null
          grep -F '"publish_authorized":false' /tmp/creative-carousel.json >/dev/null
          grep -F '"publish_authorized":false' /tmp/creative-reel.json >/dev/null
      - name: PREPROD full showcase physical AV gate
        if: ${{ github.ref == 'refs/heads/cerebro/creative-prod-showcase-av-v1-2026-10-24' }}
        env:
          CEREBRO_SHOWCASE_ENV: PREPROD
          CEREBRO_SHOWCASE_DIR: /tmp/cerebro-showcase
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/runtime/creative-showcase-v1.mjs | tee /tmp/showcase-result.json
          grep -F '"item_count":7' /tmp/showcase-result.json >/dev/null
          grep -F '"publish_authorized":false' /tmp/showcase-result.json >/dev/null
          grep -F '"additional_cost_eur":0' /tmp/showcase-result.json >/dev/null
          test -f /tmp/cerebro-showcase/MANIFEST.json
          grep -F '"visual_style": "PHOTO"' /tmp/cerebro-showcase/MANIFEST.json >/dev/null
          grep -F '"visual_style": "DATA"' /tmp/cerebro-showcase/MANIFEST.json >/dev/null
          grep -F '"provider": "PIPER"' /tmp/cerebro-showcase/MANIFEST.json >/dev/null
          grep -F '"provider": "FFMPEG_PROCEDURAL"' /tmp/cerebro-showcase/MANIFEST.json >/dev/null
          grep -F '"captions": "BURNED_SRT_TIMELINE"' /tmp/cerebro-showcase/MANIFEST.json >/dev/null
          short="$(find /tmp/cerebro-showcase -maxdepth 1 -name '06-video-corto*.mp4' -print -quit)"
          long="$(find /tmp/cerebro-showcase -maxdepth 1 -name '07-video-largo*.mp4' -print -quit)"
          test -n "$short" && test -n "$long"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$short" | grep -Fx aac
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$long" | grep -Fx aac
          long_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$long")"
          awk -v d="$long_duration" 'BEGIN{exit !(d>60 && d<=180)}'
          du -sh /tmp/cerebro-showcase
          sha256sum /tmp/cerebro-showcase/* > /tmp/cerebro-showcase/SHA256SUMS.txt
      - name: Upload PREPROD showcase evidence
        if: ${{ github.ref == 'refs/heads/cerebro/creative-prod-showcase-av-v1-2026-10-24' }}
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-creative-showcase-preprod
          path: /tmp/cerebro-showcase
          if-no-files-found: error
          retention-days: 7
      - name: PROD final showcase package
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          CEREBRO_SHOWCASE_ENV: PROD
          CEREBRO_SHOWCASE_DIR: /tmp/cerebro-showcase-prod
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/runtime/creative-showcase-v1.mjs | tee /tmp/showcase-prod-result.json
          grep -F '"item_count":7' /tmp/showcase-prod-result.json >/dev/null
          grep -F '"publish_authorized":false' /tmp/showcase-prod-result.json >/dev/null
          grep -F '"additional_cost_eur":0' /tmp/showcase-prod-result.json >/dev/null
          long="$(find /tmp/cerebro-showcase-prod -maxdepth 1 -name '07-video-largo*.mp4' -print -quit)"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$long" | grep -Fx aac
          long_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$long")"
          awk -v d="$long_duration" 'BEGIN{exit !(d>60 && d<=180)}'
          sha256sum /tmp/cerebro-showcase-prod/* > /tmp/cerebro-showcase-prod/SHA256SUMS.txt
      - name: Upload PROD showcase review package
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-creative-showcase-prod
          path: /tmp/cerebro-showcase-prod
          if-no-files-found: error
          retention-days: 7
      - name: PROD queue worker
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            out="$(CEREBRO_CREATIVE_SEED_CANARY=false node cerebro/runtime/creative-job-runner-v1.mjs)"
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -F '"status":"NO_JOB"' >/dev/null; then break; fi
          done
