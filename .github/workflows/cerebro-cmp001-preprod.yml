name: CEREBRO CMP-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-rep001-reputation-engine-v0-20260911']
    paths:
      - 'cerebro/customer/complaints-engine.mjs'
      - 'cerebro/tests/complaints-engine.test.mjs'
      - '.github/workflows/cerebro-cmp001-preprod.yml'
jobs:
  cmp001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/complaints-engine.test.mjs
