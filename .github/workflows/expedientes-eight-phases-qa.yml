name: Expedientes eight phases · QA and protected Preview
on:
  push:
    branches:
      - fix/expedientes-eight-phases-substeps-20261109
permissions:
  contents: read
concurrency:
  group: expedientes-eight-phases-qa
  cancel-in-progress: false
jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_qnh6u1Ofy2WPp0MGEKlyMA50
      VERCEL_PROJECT_ID: prj_4ElVl8e2KzrHS7r5yvBGBban1DXV
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Protect existing release branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/expedientes-eight-phases-substeps-20261109"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check eight phase track, responsive and existing KPI/filter sorting
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: qa-inert-key
        run: npx playwright test tests/expedientes-eight-phases.spec.ts tests/expedientes-active-order.spec.ts --project=desktop-chromium --reporter=line
      - name: Check production compilation
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: https://cluhljgonannaafpmblx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@48.0.0
      - name: Retrieve preview settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --scope=carlosjmunozcabeza-2582s-projects --token "${VERCEL_TOKEN}"
      - name: Create isolated Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --yes --scope=carlosjmunozcabeza-2582s-projects --token "${VERCEL_TOKEN}")"
          case "${url}" in https://*.vercel.app) ;; *) exit 1;; esac
          printf 'Eight-phase QA Preview: %s\n' "${url}" >> "${GITHUB_STEP_SUMMARY}"
