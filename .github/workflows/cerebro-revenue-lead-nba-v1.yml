name: CEREBRO Revenue LEAD-001 NBA-001 V1

on:
  push:
    paths:
      - 'cerebro/revenue/lead-nba-v1.mjs'
      - 'cerebro/tests/lead-nba-v1.test.mjs'
      - 'cerebro/runtime/durable-job-runtime-v1.mjs'
      - 'cerebro/runtime/durable-worker-runner-v1.mjs'
      - '.github/workflows/cerebro-revenue-lead-nba-v1.yml'
  pull_request:
    paths:
      - 'cerebro/revenue/lead-nba-v1.mjs'
      - 'cerebro/tests/lead-nba-v1.test.mjs'
      - 'cerebro/runtime/durable-job-runtime-v1.mjs'
      - 'cerebro/runtime/durable-worker-runner-v1.mjs'
      - '.github/workflows/cerebro-revenue-lead-nba-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lead-nba-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned repository dependencies
        run: npm ci --ignore-scripts
      - name: LEAD-001 + NBA-001 focused revenue tests
        run: >-
          node --test
          cerebro/tests/lead-nba-v1.test.mjs
          cerebro/tests/durable-job-runtime-v1.test.mjs
          cerebro/tests/durable-worker-runner-v1.test.mjs
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO regression suite
        working-directory: cerebro
        run: npm test
