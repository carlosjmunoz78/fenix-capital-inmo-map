name: CEREBRO DB Safe FULL E2E REAL V1
on:
  workflow_dispatch:
  push:
    branches: [main, 'cerebro/lote12-real-consumer-db-safe-v1-*']
    paths:
      - 'cerebro/runtime/db-safe-real-consumer-adoption-v1.mjs'
      - 'cerebro/tests/db-safe-real-consumer-adoption-v1.test.mjs'
      - 'cerebro/registry/db-safe-real-consumer-adoption-v1.json'
      - 'cerebro/docs/DB_SAFE_REAL_CONSUMER_ADOPTION_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-db-safe-full-e2e-real-v1.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/db-safe-real-consumer-adoption-v1.mjs'
      - 'cerebro/tests/db-safe-real-consumer-adoption-v1.test.mjs'
      - 'cerebro/registry/db-safe-real-consumer-adoption-v1.json'
      - 'cerebro/docs/DB_SAFE_REAL_CONSUMER_ADOPTION_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-db-safe-full-e2e-real-v1.yml'
permissions: {contents: read, actions: read}
jobs:
  strict-real-consumer-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Canonical factory registry remains valid
        working-directory: cerebro
        run: npm run validate
      - name: Preserve legacy DB-SAFE and Lote 1+2 runtimes
        run: |
          git diff --exit-code 0b63a1cb6e723457ad71a29416481e25a899ebf7 -- \
            cerebro/runtime/db-safe-native-v1.mjs \
            cerebro/tests/db-safe-native-v1.test.mjs \
            cerebro/registry/capability-db-safe-native.v1.json \
            cerebro/evidence/db-safe-native-v1-preprod.json \
            cerebro/runtime/native-capability-operational-loop-v1.mjs \
            cerebro/registry/native-capability-operational-adoption-v1.json
      - name: Existing DB-SAFE plus strict real-consumer tests
        run: >-
          node --test
          cerebro/tests/db-safe-native-v1.test.mjs
          cerebro/tests/db-safe-real-consumer-adoption-v1.test.mjs
          cerebro/tests/native-capability-operational-loop-v1.test.mjs
          cerebro/tests/native-capability-continuous-improvement-v1.test.mjs
      - name: Execute strict DB-SAFE route
        run: |
          mkdir -p /tmp/cerebro-dbsafe-real
          node cerebro/runtime/db-safe-real-consumer-adoption-v1.mjs \
            --company fenix \
            --workdir /tmp/cerebro-dbsafe-real/state \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "${{ github.sha }}" \
            --out /tmp/cerebro-dbsafe-real/report.json
      - name: Strict FULL E2E REAL gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cerebro-dbsafe-real/report.json','utf8'));
          const expected=['MIG-001','DBOFF-001','CRM-001','SEC-001','QA-001','RBLD-001','OBSERV-001','FINOPS-001'];
          if(r.status!=='FULL_E2E_REAL_PREPROD'||r.full_e2e_real_preprod!==true)throw new Error('DB-SAFE strict FULL not green');
          if(JSON.stringify(r.required_consumers)!==JSON.stringify(expected)||r.consumer_coverage!==1||r.functional_consumer_coverage!==1)throw new Error('consumer coverage incomplete');
          if(r.missing_consumers.length||r.failed_consumers.length||r.consumers.length!==8)throw new Error('consumer gap remains');
          if(!r.consumers.every(x=>x.real_consumption===true&&Array.isArray(x.fields_used)&&x.fields_used.length>0&&x.outcome_hash))throw new Error('semantic use proof incomplete');
          if(r.evaluation_consumer?.decision!=='TRIBUNAL_PASS'||r.learning_sink?.decision!=='LRN_FEEDBACK_PERSISTED')throw new Error('Tribunal/LRN gate failed');
          if(r.state_persisted!==true||r.restartable!==true||r.idempotency_proven!==true||r.additional_cost_eur!==0)throw new Error('durability/cost gate failed');
          const forbidden=['prod_authorized','prod_write_authorized','db_mutation_authorized','provider_write_authorized','crm_write_authorized','spend_authorized','trading_access','android_touched'];
          if(forbidden.some(k=>r[k]!==false))throw new Error('authority expanded');
          console.log(JSON.stringify({status:'GREEN',capability:r.capability_id,bundle_hash:r.bundle_hash,outcome_hash:r.outcome_hash}));
          NODE
      - name: Registry candidate gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('cerebro/registry/db-safe-real-consumer-adoption-v1.json','utf8'));
          if(r.capability_id!=='DB-SAFE-NATIVE'||r.engine_id!=='DATA-001'||r.environment!=='PREPROD'||r.required_consumers.length!==8)throw new Error('registry identity/consumers invalid');
          if(!r.strict_gates.semantic_mutation_tests_required||!r.strict_gates.evaluation_tribunal_required||!r.strict_gates.backup_rollback_rebuild_required)throw new Error('strict gate weakened');
          const a=r.authority;if(a.prod_authorized||a.prod_write_authorized||a.db_mutation_authorized||a.provider_write_authorized||a.crm_write_authorized||a.spend_authorized||a.trading_access||a.android_touched||a.additional_cost_eur!==0)throw new Error('authority/cost expanded');
          NODE
      - name: Upload strict DB-SAFE evidence
        uses: actions/upload-artifact@v4
        with:
          name: db-safe-full-e2e-real-v1-${{ github.run_id }}
          path: |
            /tmp/cerebro-dbsafe-real/report.json
            /tmp/cerebro-dbsafe-real/state
          retention-days: 30
          if-no-files-found: error
