name: CEREBRO JARVIS MISSION-001 PREPROD V1
run-name: JARVIS-001 W${{ inputs.wave || '0' }} O${{ inputs.offset || '0' }} PREPROD

on:
  push:
    branches:
      - cerebro/mission-jarvis-001-20261030
    paths:
      - 'cerebro/jarvis/mission-001/ACTIVATE'
  workflow_dispatch:
    inputs:
      wave:
        required: false
        default: '0'
        type: string
      offset:
        required: false
        default: '0'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebro-jarvis-mission-001-preprod
  cancel-in-progress: false

jobs:
  mission-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
      CEREBRO_ALLOW_PAID_JARVIS_BUILD: 'YES'
      CEREBRO_MAX_DEEPSEEK_CONCURRENCY: '1'
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      JARVIS_MASTER_FILE: cerebro/jarvis/mission-001/JARVIS_MASTER_V1_RC2_2026-10-30.md.gz.b64
      JARVIS_DAG_OUT: artifacts/jarvis-mission-001-dag
      JARVIS_WAVE_OUT: artifacts/jarvis-mission-001-wave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enforce PREPROD and DeepSeek temporary-role guards
        shell: bash
        run: |
          set -euo pipefail
          test "$CEREBRO_SUPERVISOR_ENV" = PREPROD
          test "$CEREBRO_PROD_WRITE" = false
          test "$CEREBRO_TRADING_ACCESS" = false
          test "$CEREBRO_MAX_DEEPSEEK_CONCURRENCY" = 1
          test -n "$DEEPSEEK_API_KEY"

      - name: Reuse existing DeepSeek provider and budget guards
        run: |
          node --test cerebro/tests/deepseek-budget-guard-v0.test.mjs cerebro/tests/deepseek-cost-v0.test.mjs cerebro/tests/deepseek-provider-v0.test.mjs

      - name: Validate MISSION-JARVIS-001 DAG
        run: |
          node --test cerebro/tests/jarvis-mission-dag-v2.test.mjs
          node cerebro/runtime/jarvis-mission-dag-v2.mjs

      - name: Prepare repo file inventory
        shell: bash
        run: |
          git ls-files > /tmp/jarvis-files.txt
          {
            echo 'JARVIS_REPO_FILE_LIST<<EOF'
            cat /tmp/jarvis-files.txt
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Execute bounded JARVIS mission wave
        id: work
        shell: bash
        run: |
          set -euo pipefail
          wave='${{ inputs.wave }}'; offset='${{ inputs.offset }}'
          [ -n "$wave" ] || wave=0
          [ -n "$offset" ] || offset=0
          node cerebro/runtime/jarvis-mission-wave-runner-v1.mjs --wave="$wave" --offset="$offset" --batch=48 | tee /tmp/jarvis-summary.log
          tail -n 1 /tmp/jarvis-summary.log > /tmp/jarvis-summary.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('/tmp/jarvis-summary.json','utf8'));
          for (const [k,v] of Object.entries({next_wave:s.next_wave,next_offset:s.next_offset,human_required:s.human_required,processed:s.processed,deepseek_calls:s.deepseek_calls})) fs.appendFileSync(process.env.GITHUB_OUTPUT,`${k}=${v===null?'':v}\n`);
          NODE

      - name: Upload inspectable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mission-001-w${{ inputs.wave || '0' }}-o${{ inputs.offset || '0' }}-${{ github.run_id }}
          path: |
            artifacts/jarvis-mission-001-dag/**
            artifacts/jarvis-mission-001-wave/**
          if-no-files-found: error
          retention-days: 7

      - name: Continue automatically until governed HUMAN_REQUIRED or DAG completion
        if: success() && steps.work.outputs.human_required != 'true' && steps.work.outputs.next_wave != ''
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GH_REPO}/actions/workflows/cerebro-jarvis-mission-001-preprod-v1.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[wave]=${{ steps.work.outputs.next_wave }}" \
            -f "inputs[offset]=${{ steps.work.outputs.next_offset }}"
