name: UMS001 IGC202603 CEREBRO prompt factory V0.2 learns and retakes R02 once
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'cerebro/media-studio/v2/requests/UMS001_IGC202603_AUTO_PROMPT_CANARY_ORDER_R02.json'
permissions:
  contents: write
concurrency:
  group: ums001-igc202603-autoprompt-retake-r02-one-shot
  cancel-in-progress: false
jobs:
  create-cover-from-cerebro-prompt:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'cerebro/ums-replicate-flux-paid-lab-v0-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Only allow exact one-shot request commit
        id: change
        run: |
          if git show --format= --name-only HEAD | grep -Fxq 'cerebro/media-studio/v2/requests/UMS001_IGC202603_AUTO_PROMPT_CANARY_ORDER_R02.json'; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify generated prompt and all offline regression tests
        if: steps.change.outputs.eligible == 'true'
        run: |
          python3 -m py_compile cerebro/media-studio/v2/runtime/ums001_prompt_forge_lab_v0.py
          python3 -m py_compile cerebro/media-studio/v2/runtime/ums001_igc202603_autoprompt_retake_r02.py
          python3 cerebro/media-studio/v2/tests/test_ums001_prompt_forge_lab_v0.py -v
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('cerebro/media-studio/v2/runtime/ums001_igc202603_autoprompt_retake_r02.py')
          s=importlib.util.spec_from_file_location('canary',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          req,forged,prompt=m.preflight()
          assert len(forged['prompts'])==6
          assert forged['llm_api_calls']==0 and forged['replicate_api_calls']==0
          assert req['max_cost_usd']==0.06 and req['publish'] is False
          print('UMS001_CEREBRO_GENERATED_PROMPT_PREFLIGHT_GREEN')
          PY
      - name: One image generation with prompt actually forged by CEREBRO (not ChatGPT)
        if: steps.change.outputs.eligible == 'true'
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GH_TOKEN_FOR_LAB: ${{ secrets.GITHUB_TOKEN }}
          UMS001_IGC202603_PREPAID_GATE: OWNER_APPROVED_PREPAID_20261111
        run: python3 cerebro/media-studio/v2/runtime/ums001_igc202603_autoprompt_retake_r02.py
      - name: Upload verifiable photo and original autogenerated prompt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ums001-igc202603-real-image-autoprompt-r02
          path: ${{ runner.temp }}/ums001-igc202603-autoprompt-r02/
          retention-days: 14
          if-no-files-found: warn
      - name: Safety audit
        if: always()
        run: echo 'No DeepSeek calls. At most ONE Replicate image billed from existing prepaid credits. No publishing.'
