name: CEREBRO DeepSeek SUPER AUDIT A01-A03-A04 R3

on:
  workflow_dispatch:
  push:
    branches:
      - cerebro/boost-001-reconciled-20261027
      - cerebro/jarvis-project-hub-v0-20261027
    paths:
      - '.github/workflows/cerebro-deepseek-super-audit-a00-a04.yml'
      - 'cerebro/jarvis/boost-001/super-audit-a01-a03-a04-r3.mjs'
      - 'cerebro/jarvis/boost-001/**'
      - 'cerebro/runtime/deepseek-*.mjs'
      - 'cerebro/runtime/durable-job-runtime-v1.mjs'
      - 'cerebro/runtime/durable-worker-runner-v1.mjs'
      - 'cerebro/runtime/cerebro-continuous-supervisor-v0.mjs'
      - 'cerebro/runtime/cerebro-supervisor-daemon-v0.mjs'
      - 'cerebro/runtime/jarvis-project-hub-v1.mjs'
      - 'cerebro/console/jarvis-project-hub-binding-v1.mjs'
      - 'cerebro/console/project-hub-ui-v0.html'
      - 'cerebro/registry/jarvis-project-registry.v1.json'
      - 'cerebro/registry/console-project-hub-binding-v1.json'
      - 'cerebro/contracts/jarvis-project-hub.v1.json'
      - 'cerebro/audit/jarvis-audit-index.v1.json'
      - 'cerebro/runbooks/jarvis-project-hub-v1.md'
      - 'cerebro/runtime/test-jarvis-project-hub-v1.mjs'
      - 'cerebro/tests/deepseek-*.test.mjs'
      - 'cerebro/tests/durable-job-runtime-v1.test.mjs'
      - 'cerebro/tests/durable-worker-runner-v1.test.mjs'
      - 'cerebro/tests/cerebro-continuous-supervisor-v0.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-daemon-v0.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: cerebro-deepseek-super-audit-a01-a03-a04-r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-completion-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CEREBRO_ALLOW_PAID_SUPER_AUDIT: 'YES'
      CEREBRO_ALLOW_PAID_CANARY: 'YES'
      DEEPSEEK_APPROVED_BASELINE_USD: '100'
      DEEPSEEK_CANARY_PROJECTED_USD: '0.01'
      DEEPSEEK_SUPER_AUDIT_PROJECTED_USD: '0.15'
    steps:
      - name: Checkout current candidate with live-main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh live main reference
        shell: bash
        run: git fetch --no-tags origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify secret reference without exposing value
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "DEEPSEEK_API_KEY_MISSING"; exit 1; }
          echo "DEEPSEEK_API_KEY_PRESENT=true"

      - name: Record candidate versus live main evidence
        shell: bash
        run: |
          set -euo pipefail
          MAIN_HEAD="$(git rev-parse origin/main)"
          CANDIDATE_HEAD="$(git rev-parse HEAD)"
          MAIN_DELTA="$(git rev-list --left-right --count origin/main...HEAD | tr '\t' ':')"
          echo "CEREBRO_MAIN_HEAD=$MAIN_HEAD"
          echo "CEREBRO_CANDIDATE_HEAD=$CANDIDATE_HEAD"
          echo "CEREBRO_MAIN_DELTA=$MAIN_DELTA"
          echo "CEREBRO_PREFLIGHT_MAIN_HEAD=$MAIN_HEAD" >> "$GITHUB_ENV"
          echo "CEREBRO_PREFLIGHT_CANDIDATE_HEAD=$CANDIDATE_HEAD" >> "$GITHUB_ENV"
          echo "CEREBRO_PREFLIGHT_MAIN_DELTA=$MAIN_DELTA" >> "$GITHUB_ENV"
          echo "CEREBRO_DIFF_BEGIN"
          git diff --name-status origin/main...HEAD
          echo "CEREBRO_DIFF_END"

      - name: Project Hub contract and authority-firewall evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ -f cerebro/runtime/test-jarvis-project-hub-v1.mjs ]; then
            node cerebro/runtime/test-jarvis-project-hub-v1.mjs
            echo "CEREBRO_PREFLIGHT_PROJECT_HUB=PASS" >> "$GITHUB_ENV"
          else
            echo "CEREBRO_PREFLIGHT_PROJECT_HUB=NOT_PRESENT" >> "$GITHUB_ENV"
          fi

      - name: Current-head IAM and routing negative-control evidence
        shell: bash
        run: |
          set -euo pipefail
          node --test cerebro/tests/authorized-execution-device-profile-v1.test.mjs cerebro/tests/identity-credential-broker-v0.test.mjs cerebro/tests/identity-session-lifecycle-v0.test.mjs cerebro/tests/execution-model-router-v0.test.mjs
          echo "CEREBRO_PREFLIGHT_IAM_ROUTING=PASS" >> "$GITHUB_ENV"

      - name: Current-head durable runtime supervisor and daemon evidence
        shell: bash
        run: |
          set -euo pipefail
          node --test cerebro/tests/durable-job-runtime-v1.test.mjs cerebro/tests/durable-worker-runner-v1.test.mjs cerebro/tests/cerebro-continuous-supervisor-v0.test.mjs cerebro/tests/cerebro-supervisor-daemon-v0.test.mjs cerebro/tests/bounded-recovery-supervisor.test.mjs
          echo "CEREBRO_PREFLIGHT_RUNTIME_SUPERVISOR=PASS" >> "$GITHUB_ENV"
          echo "CEREBRO_PREFLIGHT_DAEMON_CONTRACT=PASS" >> "$GITHUB_ENV"

      - name: Re-run DeepSeek provider, pricing and live-balance guards
        shell: bash
        run: |
          set -euo pipefail
          node --test cerebro/tests/deepseek-budget-guard-v0.test.mjs cerebro/tests/deepseek-live-balance-guard-v0.test.mjs cerebro/tests/deepseek-cost-v0.test.mjs cerebro/tests/deepseek-provider-v0.test.mjs
          echo "CEREBRO_PREFLIGHT_DEEPSEEK_GUARDS=PASS" >> "$GITHUB_ENV"

      - name: Same-head paid tiny canary before auditor
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/jarvis/boost-001/canary.mjs
          echo "CEREBRO_PREFLIGHT_DEEPSEEK_CANARY=PASS" >> "$GITHUB_ENV"

      - name: Collect same-head workflow evidence without secrets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" > /tmp/cerebro-current-runs-raw.json
            jq --arg sha "$GITHUB_SHA" '{head_sha:$sha,runs:[.workflow_runs[] | select(.head_sha==$sha) | {id,name,event,status,conclusion,head_sha,run_number,run_attempt}]}' \
              /tmp/cerebro-current-runs-raw.json > /tmp/cerebro-current-runs.json
            green="$(jq '[.runs[] | select((.name=="CEREBRO Governed Main Integration V0" or .name=="CEREBRO Runtime Durable Supervisor V0" or .name=="CEREBRO RSI Promotion Readiness Shadow V1") and .status=="completed" and .conclusion=="success")] | length' /tmp/cerebro-current-runs.json)"
            if [ "$green" -ge 3 ]; then break; fi
            sleep 5
          done
          cat /tmp/cerebro-current-runs.json
          echo "CEREBRO_PREFLIGHT_RUN_INDEX_FILE=/tmp/cerebro-current-runs.json" >> "$GITHUB_ENV"

      - name: Syntax-check bounded r3 completion runner
        run: node --check cerebro/jarvis/boost-001/super-audit-a01-a03-a04-r3.mjs

      - name: Complete only A01 A03 A04 read-only reports
        run: node cerebro/jarvis/boost-001/super-audit-a01-a03-a04-r3.mjs

      - name: Emit compact structured reports
        if: always()
        shell: bash
        run: |
          if [ -d artifacts/boost001-super-audit-a01-a03-a04-r3 ]; then
            for f in artifacts/boost001-super-audit-a01-a03-a04-r3/a*-evidence-auditor-r3.json; do
              [ -f "$f" ] || continue
              echo "CEREBRO_AUDIT_R3_REPORT_BEGIN::$f"
              cat "$f"
              echo "CEREBRO_AUDIT_R3_REPORT_END::$f"
            done
            echo "CEREBRO_AUDIT_R3_SUMMARY_BEGIN"
            cat artifacts/boost001-super-audit-a01-a03-a04-r3/summary.json || true
            echo "CEREBRO_AUDIT_R3_SUMMARY_END"
          fi

      - name: Upload r3 read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-boost001-super-audit-a01-a03-a04-r3
          path: artifacts/boost001-super-audit-a01-a03-a04-r3/
          if-no-files-found: warn
          retention-days: 7
