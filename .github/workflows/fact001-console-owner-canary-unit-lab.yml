name: FACT001 Console owner Cloudflare canary unit regression only
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase/fact001-console-owner-canary-lab/logic.mjs
      - cerebro/connectors/universal/supabase/fact001-console-owner-canary-lab/tests/oidc.test.mjs
      - cerebro/connectors/universal/supabase/fact001-console-owner-canary-lab/index.ts
      - .github/workflows/fact001-console-owner-canary-unit-lab.yml
permissions:
  contents: read
jobs:
  unit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test cerebro/connectors/universal/supabase/fact001-console-owner-canary-lab/tests/oidc.test.mjs
      - name: Verify the owner canary is immutable to PROD routes
        run: |
          node --input-type=module <<'NODE'
          const fs=await import('node:fs');
          const src=fs.readFileSync('cerebro/connectors/universal/supabase/fact001-console-owner-canary-lab/index.ts','utf8');
          if(!src.includes("ctx.actor_code==='CARLOS-ADMIN'")||src.includes("route==='provision'")||!src.includes("retry_automatically:false")||!src.includes("verifyGitHubOidc(bearer)"))throw Error('CANARY_GOVERNANCE_DENIED');
          console.log('FACT001_CANARY_OWNER_ONLY_POLICY=true');
          console.log('FACT001_CANARY_429_FAIL_CLOSED=true');
          NODE
