name: CEREBRO JARVIS Learning Capability Canary V0
run-name: JARVIS LEARNING CANARY · PREPROD · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - cerebro-jarvis-learning-loop-v0-20261029
    paths:
      - 'cerebro/runtime/mission-capability-learning-loop-v0.mjs'
      - 'cerebro/tests/mission-capability-learning-loop-v0.test.mjs'
      - 'cerebro/contracts/jarvis-learning-capability-loop-v0.json'
      - 'cerebro/jarvis/boost-001/**'
      - '.github/workflows/cerebro-jarvis-learning-capability-canary-v0.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-jarvis-learning-capability-canary-v0
  cancel-in-progress: true

jobs:
  preprod-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_ALLOW_PAID_FANOUT: 'NO'
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
      CEREBRO_JARVIS_LEARNING_OUT_DIR: artifacts/jarvis-learning-loop-v0
      CEREBRO_JARVIS_DEEPSEEK_SAMPLE_MODULO: '16384'
      DEEPSEEK_APPROVED_BASELINE_USD: '100'
      DEEPSEEK_LEARNING_PROJECTED_USD: '0.01'
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Enforce PREPROD preservation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$CEREBRO_SUPERVISOR_ENV" = 'PREPROD'
          test "$CEREBRO_ALLOW_PAID_FANOUT" = 'NO'
          test "$CEREBRO_PROD_WRITE" = 'false'
          test "$CEREBRO_TRADING_ACCESS" = 'false'
          test -f cerebro/jarvis/boost-001/JARVIS_CONSTITUTION_V1.md
          test -f cerebro/jarvis/boost-001/budget-policy.v1.json
          test -f cerebro/jarvis/boost-001/DEEPSEEK_PRICING_REVALIDATION_2026-10-29.md
          test -f cerebro/contracts/jarvis-learning-capability-loop-v0.json

      - name: Contract and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test cerebro/tests/mission-capability-learning-loop-v0.test.mjs
          node --test cerebro/tests/mission-derived-useful-work-v1.test.mjs
          node cerebro/runtime/mission-recursive-decomposer-v1.test.mjs

      - name: Execute end-to-end mission to learning to JARVIS feed
        shell: bash
        env:
          CEREBRO_ALLOW_JARVIS_DEEPSEEK: 'YES'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          node cerebro/runtime/mission-capability-learning-loop-v0.mjs \
            --lane=0 \
            --cycle=0 \
            --fallback=true \
            --forceDeepSeek=true | tee /tmp/jarvis-learning-canary-result.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/jarvis-learning-canary-result.json','utf8').trim().split(/\n/).at(-1)); if(!x.ok) process.exit(2); if(x.learning_candidates<1) process.exit(3); if(x.jarvis_feed_state!=='CANDIDATE_READY_FOR_EVALUATION') process.exit(4); console.log(JSON.stringify({ok:x.ok,learning_candidates:x.learning_candidates,jarvis_feed_state:x.jarvis_feed_state,factory_gap:x.factory_gap,deepseek_status:x.deepseek_status,human_required:x.human_required,prod_write_authorized:x.prod_write_authorized,trading_access:x.trading_access}));"

      - name: Verify no direct JARVIS self-modification or PROD authorization
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files=[];
          const walk=d=>{for(const n of fs.readdirSync(d)){const f=path.join(d,n);const s=fs.statSync(f);if(s.isDirectory())walk(f);else if(n.endsWith('.jarvis-feed.json'))files.push(f);}};
          walk('artifacts/jarvis-learning-loop-v0');
          if(files.length<1) throw new Error('JARVIS feed artifact missing');
          for(const file of files){
            const feed=JSON.parse(fs.readFileSync(file,'utf8'));
            if(feed.prod_authorized!==false||feed.prod_write_authorized!==false||feed.trading_access!==false) throw new Error('unsafe JARVIS feed authorization');
            if(feed.stable_memory_write_authorized!==false||feed.skill_activation_authorized!==false||feed.autonomous_self_modification_authorized!==false) throw new Error('candidate bypassed evaluation gate');
          }
          console.log(JSON.stringify({jarvis_feed_files:files.length,safety:'GREEN'}));
          NODE

      - name: Publish inspectable PREPROD evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-jarvis-learning-capability-canary-${{ github.run_id }}
          path: |
            artifacts/jarvis-learning-loop-v0/**
            artifacts/mission-derived-work-v1/**
            artifacts/continuous-work-v0/**
          if-no-files-found: error
          retention-days: 2

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo 'environment=PREPROD' >> "$GITHUB_STEP_SUMMARY"
          echo 'chain=MISSION -> LEARNING_CANDIDATE -> RSI_SHADOW -> FACT001_GAP_IF_NEEDED -> JARVIS_FEED' >> "$GITHUB_STEP_SUMMARY"
          echo 'deepseek=BOUNDED_ADVISORY_WITH_LIVE_BALANCE_GUARD_IF_SECRET_AVAILABLE' >> "$GITHUB_STEP_SUMMARY"
          echo 'auto_recharge=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'prod_write=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'trading=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'stable_memory_write=false' >> "$GITHUB_STEP_SUMMARY"
