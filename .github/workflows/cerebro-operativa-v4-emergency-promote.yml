name: CEREBRO Operativa V4 Emergency Promote

on:
  push:
    branches:
      - cerebro/operativa-premium-v4-20261102
    paths:
      - '.github/workflows/cerebro-operativa-v4-emergency-promote.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cerebro-operativa-v4-emergency-promote
  cancel-in-progress: false

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_FENIX_ENV: prod
    steps:
      - name: Checkout V4 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify deployable output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          grep -q '/assets/' dist/index.html

      - name: Promote build to emergency-pages only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin emergency-pages
          rm -rf /tmp/fenix-emergency-pages
          git worktree add -B emergency-pages-deploy /tmp/fenix-emergency-pages origin/emergency-pages
          find /tmp/fenix-emergency-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a dist/. /tmp/fenix-emergency-pages/
          cp dist/index.html /tmp/fenix-emergency-pages/404.html
          printf 'app.fenixcapital.es\n' > /tmp/fenix-emergency-pages/CNAME
          printf '%s\n' "$GITHUB_SHA" > /tmp/fenix-emergency-pages/PROD_SOURCE_SHA.txt
          touch /tmp/fenix-emergency-pages/.nojekyll
          cd /tmp/fenix-emergency-pages
          git add -A
          git commit -m 'deploy(prod): Operativa Premium V4 React emergency snapshot'
          git push origin HEAD:emergency-pages
