name: CEREBRO VOICE-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-notif001-notification-engine-v0-20260911']
    paths:
      - 'cerebro/communications/voice-engine.mjs'
      - 'cerebro/factory/msp.mjs'
      - 'cerebro/tests/voice-engine.test.mjs'
      - 'cerebro/tests/msp.test.mjs'
      - '.github/workflows/cerebro-voice001-preprod.yml'
jobs:
  voice001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/voice-engine.test.mjs cerebro/tests/msp.test.mjs
