name: CEREBRO FRAN-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-expand001-expansion-engine-v0-20260911']
    paths:
      - 'cerebro/strategy/franchise-replication-engine.mjs'
      - 'cerebro/tests/franchise-replication-engine.test.mjs'
      - '.github/workflows/cerebro-fran001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/franchise-replication-engine.test.mjs