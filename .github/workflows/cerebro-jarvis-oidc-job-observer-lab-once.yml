name: CEREBRO JARVIS OIDC JOB OBSERVER LAB ONE SHOT 20261109

on:
  push:
    branches:
      - cerebro/jarvis-oidc-job-observer-lab-v0-20261109
    paths:
      - '.github/workflows/cerebro-jarvis-oidc-job-observer-lab-once.yml'

permissions:
  contents: read
  id-token: write

jobs:
  signed-jobs-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUD: jarvis-oidc-job-observer-lab-v0
      URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/jarvis-oidc-job-observer-lab-v0/status
    steps:
      - name: Verify signed identity connects to real PREPROD JARVIS queue without writes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const endpoint=process.env.URL;
          const audience=process.env.AUD;
          const base=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requester=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!base||!requester)throw new Error('OIDC_NOT_AVAILABLE');
          async function call(url,method='POST',auth){
            const headers={'content-type':'application/json'};
            if(auth)headers.authorization='Bearer '+auth;
            const r=await fetch(url,{method,headers,body:method==='POST'?'{}':undefined,redirect:'error',signal:AbortSignal.timeout(20000)});
            let b={};try{b=await r.json()}catch{}return{status:r.status,data:b};
          }
          async function mint(aud){
            const u=new URL(base);u.searchParams.set('audience',aud);
            const r=await fetch(u,{headers:{authorization:'Bearer '+requester},redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw new Error('OIDC_MINT_FAILED_'+r.status);
            const v=(await r.json()).value;
            if(typeof v!=='string'||v.split('.').length!==3)throw new Error('BAD_OIDC_RESPONSE');
            return v;
          }
          let result=await call(endpoint);
          if(result.status!==403||result.data.status!=='DENIED')throw new Error('NO_TOKEN_NOT_DENIED');
          result=await call(endpoint,'POST','not-a-jwt');
          if(result.status!==403||result.data.status!=='DENIED')throw new Error('BAD_TOKEN_NOT_DENIED');
          result=await call(endpoint,'GET');
          if(result.status!==404)throw new Error('WRONG_METHOD_NOT_DENIED');
          result=await call(endpoint+'/unsafe');
          if(result.status!==404)throw new Error('WRONG_PATH_NOT_DENIED');
          const good=await mint(audience);
          const wrong=await mint('jarvis-oidc-other-audience');
          result=await call(endpoint,'POST',wrong);
          if(result.status!==403||result.data.status!=='DENIED')throw new Error('WRONG_AUDIENCE_NOT_DENIED');
          const parts=good.split('.');
          parts[2]=(parts[2][0]==='A'?'B':'A')+parts[2].slice(1);
          result=await call(endpoint,'POST',parts.join('.'));
          if(result.status!==403||result.data.status!=='DENIED')throw new Error('TAMPER_NOT_DENIED');
          result=await call(endpoint,'POST',good);
          const q=result.data;
          if(result.status!==200||q.status!=='OK'||q.proof!=='SIGNED_GITHUB_OIDC_JARVIS_JOB_READONLY'||
             q.environment!=='LAB'||q.observed_environment!=='PREPROD'||
             q.company_id!=='fenix'||q.engine_id!=='CONSOLE-001'||
             q.run_id!==process.env.GITHUB_RUN_ID||q.source_sha!==process.env.GITHUB_SHA||
             q.scope!=='AGGREGATE_STATUS_ONLY'||q.no_user_jwt!==true||
             q.no_db_mutation!==true||q.no_prod_access!==true||q.no_trading_access!==true||
             q.no_job_lease!==true||q.no_auto_rearm!==true||
             !Array.isArray(q.job_names)||q.job_names.length!==2||
             !q.job_names.includes('git.safe.v1')||!q.job_names.includes('repo.sandbox.public.readonly.v0')||
             !Number.isInteger(q.total_jobs)||q.total_jobs<0||!Number.isInteger(q.pending)||q.pending<0)
             throw new Error('READONLY_JOB_ATTESTATION_FAILED_HTTP_'+result.status+'_REASON_'+String(q.reason||q.status||'NONE'));
          let observed=0;
          for(const job of q.job_names){
            const states=q.counts?.[job];
            if(!states||typeof states!=='object')throw new Error('MISSING_JOB_COUNTS');
            for(const n of Object.values(states)){if(!Number.isInteger(n)||n<0)throw new Error('INVALID_COUNT');observed+=n;}
          }
          if(observed!==q.total_jobs)throw new Error('COUNT_MISMATCH_OR_TRUNCATION');
          const pending=q.job_names.reduce((n,job)=>n+(q.counts[job].QUEUED||0)+(q.counts[job].RETRY_WAIT||0),0);
          if(q.pending!==pending)throw new Error('PENDING_COUNT_INCONSISTENT');
          console.log(JSON.stringify({status:'OIDC_TO_REAL_JARVIS_PREPROD_QUEUE=GREEN',
            security_checks:6,auth:'SIGNED_GITHUB_OIDC',
            company_id:q.company_id,environment:q.observed_environment,engine_id:q.engine_id,
            totals:q.counts,total_jobs:q.total_jobs,pending:q.pending,
            personal_jwt_used:false,new_secrets:false,db_writes:0,repo_writes:0,prod_touched:false,
            real_lease:false,ui_session_e2e:false}));
          JS
