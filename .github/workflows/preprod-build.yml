name: PRE-PROD App Build

# PRE-PROD queda parado como flujo automatico.
# Solo puede lanzarse manualmente si en el futuro se decide reactivarlo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preprod-app-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Dependency versions
        run: npm list --depth=0

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build PRE-PROD
        env:
          VITE_FUNCTION_SUFFIX: '-test'
        run: npm run build

      - name: PRE-PROD Ana CORS smoke
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for origin in 'https://carlosjmunoz78.github.io' 'https://app.fenixcapital.es'; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 1 --output "$body" --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
              -X OPTIONS \
              -H "Origin: ${origin}" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,apikey' \
              'https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/fenix-ana-api-test/capabilities')"
            echo "PREPROD_ANA_CORS origin=${origin} status=${status}"
            cat "$headers"
            echo 'PREPROD_ANA_CORS_BODY_BEGIN'; cat "$body"; echo; echo 'PREPROD_ANA_CORS_BODY_END'
            if test "$status" != "204" || ! grep -qi '^access-control-allow-origin:' "$headers" || ! grep -qi '^access-control-allow-methods:.*OPTIONS' "$headers" || ! grep -qi '^access-control-allow-headers:.*authorization' "$headers"; then failed=1; fi
            rm -f "$headers" "$body"
          done
          test "$failed" = "0"

      - name: Browser QA PRE-PROD
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npm run test:e2e -- --workers=2

      - name: Upload PRE-PROD dist
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-playwright-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
