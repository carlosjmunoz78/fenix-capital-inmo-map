name: PRE-PROD App Build

# PRE-PROD is isolated from the live production deployment channel.
on:
  push:
    branches:
      - preprod-app-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: preprod-app-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FENIX_ENV: preprod
      VITE_SUPABASE_URL: https://hnqlnvakzaywtafeiybt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uvtiidkBBkFRt2K34so27g_JpCbMUZw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies reproducibly
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Dependency versions
        run: npm list --depth=0

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build
        run: npm run build

      - name: Browser QA
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npm run test:e2e

      - name: PRE-PROD Ana CORS smoke
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
            -X OPTIONS \
            -H 'Origin: https://carlosjmunoz78.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,apikey' \
            'https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/fenix-ana-api-test/capabilities')"
          test "$status" = "204"
          grep -qi '^access-control-allow-origin:' "$headers"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-dist
          path: dist
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Build isolated PRE-PROD static snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        run: |
          npx vite build --base=/fenix-capital-inmo-map/ --outDir dist-pages
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll

      - name: Publish PRE-PROD snapshot to preprod-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/fenix-preprod-pages
          mkdir -p /tmp/fenix-preprod-pages
          cp -R dist-pages/. /tmp/fenix-preprod-pages/
          cd /tmp/fenix-preprod-pages
          git init
          git checkout -b preprod-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: PRE-PROD snapshot ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin preprod-pages
