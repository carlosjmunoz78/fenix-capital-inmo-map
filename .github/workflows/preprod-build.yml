name: PRE-PROD App Build

# PRE-PROD: QA on PR/push. The validated operational snapshot for app.fenixcapital.es is built against PROD runtime without merging main.
on:
  push:
    branches:
      - preprod-app-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: preprod-app-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies reproducibly
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Dependency versions
        run: npm list --depth=0

      - name: Persist generated lockfile in PRE-PROD branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already versioned and unchanged"
          else
            git commit -m "build(preprod): version validated package lock"
            git push origin HEAD:preprod-app-phase1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build
        run: npm run build

      - name: Browser QA
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npm run test:e2e -- --workers=2

      - name: PRE-PROD Ana CORS smoke
        shell: bash
        run: |
          set -euo pipefail
          for origin in 'https://carlosjmunoz78.github.io' 'https://app.fenixcapital.es'; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
              -X OPTIONS \
              -H "Origin: ${origin}" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,apikey' \
              'https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/fenix-ana-api-test/capabilities')"
            test "$status" = "204"
            grep -qi '^access-control-allow-origin:' "$headers"
            grep -qi '^access-control-allow-methods:.*OPTIONS' "$headers"
            grep -qi '^access-control-allow-headers:.*authorization' "$headers"
            rm -f "$headers"
          done

      - name: PROD operational CORS smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            'fenix-ana-api/capabilities' \
            'fenix-app-gateway/navigation' \
            'fenix-directory-api/notarias' \
            'fenix-directory-api/registros-propiedad' \
            'fenix-reports-api' \
            'fenix-economia-api'; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
              -X OPTIONS \
              -H 'Origin: https://app.fenixcapital.es' \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,apikey' \
              "https://cluhljgonannaafpmblx.supabase.co/functions/v1/${endpoint}")"
            test "$status" = "204"
            grep -qi '^access-control-allow-origin:' "$headers"
            grep -qi '^access-control-allow-methods:.*OPTIONS' "$headers"
            grep -qi '^access-control-allow-headers:.*authorization' "$headers"
            rm -f "$headers"
          done

      - name: PROD canonical write API CORS smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'POST|fenix-directory-actions/notarias/create' \
            'POST|fenix-special-cases-api/herencias' \
            'PATCH|fenix-task-api/TASK-CORS-PROBE' \
            'PATCH|fenix-document-actions/DOC-CORS-PROBE'; do
            method="${spec%%|*}"
            endpoint="${spec#*|}"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
              -X OPTIONS \
              -H 'Origin: https://app.fenixcapital.es' \
              -H "Access-Control-Request-Method: ${method}" \
              -H 'Access-Control-Request-Headers: authorization,apikey,content-type' \
              "https://cluhljgonannaafpmblx.supabase.co/functions/v1/${endpoint}")"
            test "$status" = "204"
            grep -qi '^access-control-allow-origin: https://app.fenixcapital.es' "$headers"
            grep -qi '^access-control-allow-methods:.*OPTIONS' "$headers"
            grep -qi '^access-control-allow-headers:.*authorization' "$headers"
            rm -f "$headers"
          done

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-dist
          path: dist
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Build operational app for custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: https://cluhljgonannaafpmblx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yjISKmA5UPfF3d7NitP_DA_j5LGydh0
        run: |
          # app.fenixcapital.es is the operational entry point and must use the dedicated PROD backend.
          npx vite build --base=/ --outDir dist-pages
          cp dist-pages/index.html dist-pages/404.html
          printf '%s\n' 'app.fenixcapital.es' > dist-pages/CNAME
          touch dist-pages/.nojekyll

          # Keep gh-pages deployable as a static snapshot if another host consumes this branch.
          cat > dist-pages/package.json <<'JSON'
          {
            "name": "fenix-capital-operational-static",
            "private": true,
            "version": "1.0.0",
            "scripts": {
              "build": "node build-static.cjs"
            }
          }
          JSON

          cat > dist-pages/build-static.cjs <<'JS'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const out = path.join(root, 'dist');
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });

          const skip = new Set(['dist', '.git', 'node_modules', 'package.json', 'package-lock.json', 'build-static.cjs', 'vercel.json']);
          for (const name of fs.readdirSync(root)) {
            if (skip.has(name)) continue;
            fs.cpSync(path.join(root, name), path.join(out, name), { recursive: true });
          }
          JS

          cat > dist-pages/vercel.json <<'JSON'
          {
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "cleanUrls": false
          }
          JSON

      - name: Publish validated operational snapshot to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/fenix-gh-pages
          mkdir -p /tmp/fenix-gh-pages
          cp -R dist-pages/. /tmp/fenix-gh-pages/
          cd /tmp/fenix-gh-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: operational snapshot ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
