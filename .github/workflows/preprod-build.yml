name: PRE-PROD App Build

# PRE-PROD validates code and produces an immutable PROD candidate artifact.
# It MUST NOT publish or move the operational gh-pages branch.
on:
  push:
    branches:
      - preprod-app-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preprod-app-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Dependency versions
        run: npm list --depth=0

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build PRE-PROD
        run: npm run build

      - name: Browser QA PRE-PROD
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npm run test:e2e -- --workers=2

      - name: PRE-PROD Ana CORS smoke
        shell: bash
        run: |
          set -euo pipefail
          for origin in 'https://carlosjmunoz78.github.io' 'https://app.fenixcapital.es'; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
              -X OPTIONS \
              -H "Origin: ${origin}" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,apikey' \
              'https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/fenix-ana-api-test/capabilities')"
            test "$status" = "204"
            grep -qi '^access-control-allow-origin:' "$headers"
            grep -qi '^access-control-allow-methods:.*OPTIONS' "$headers"
            grep -qi '^access-control-allow-headers:.*authorization' "$headers"
            rm -f "$headers"
          done

      - name: PROD operational CORS smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            'fenix-ana-api/capabilities' \
            'fenix-app-gateway/navigation' \
            'fenix-directory-api/notarias' \
            'fenix-directory-api/registros-propiedad' \
            'fenix-reports-api' \
            'fenix-economia-api'; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
              -X OPTIONS \
              -H 'Origin: https://app.fenixcapital.es' \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,apikey' \
              "https://cluhljgonannaafpmblx.supabase.co/functions/v1/${endpoint}")"
            test "$status" = "204"
            grep -qi '^access-control-allow-origin:' "$headers"
            grep -qi '^access-control-allow-methods:.*OPTIONS' "$headers"
            grep -qi '^access-control-allow-headers:.*authorization' "$headers"
            rm -f "$headers"
          done

      - name: PROD canonical write API CORS smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'POST|fenix-directory-actions/notarias/create' \
            'POST|fenix-special-cases-api/herencias' \
            'PATCH|fenix-task-api/TASK-CORS-PROBE' \
            'PATCH|fenix-document-actions/DOC-CORS-PROBE'; do
            method="${spec%%|*}"
            endpoint="${spec#*|}"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20 \
              -X OPTIONS \
              -H 'Origin: https://app.fenixcapital.es' \
              -H "Access-Control-Request-Method: ${method}" \
              -H 'Access-Control-Request-Headers: authorization,apikey,content-type' \
              "https://cluhljgonannaafpmblx.supabase.co/functions/v1/${endpoint}")"
            test "$status" = "204"
            grep -qi '^access-control-allow-origin: https://app.fenixcapital.es' "$headers"
            grep -qi '^access-control-allow-methods:.*OPTIONS' "$headers"
            grep -qi '^access-control-allow-headers:.*authorization' "$headers"
            rm -f "$headers"
          done

      - name: Upload PRE-PROD dist
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Build immutable PROD candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: https://cluhljgonannaafpmblx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yjISKmA5UPfF3d7NitP_DA_j5LGydh0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          cp dist/index.html dist/404.html
          printf '%s\n' 'app.fenixcapital.es' > dist/CNAME
          touch dist/.nojekyll

      - name: Browser QA exact PROD candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: >-
          npm run test:e2e -- --workers=2
          tests/prod-candidate-browser.spec.ts
          tests/prod-runtime-config.spec.ts
          tests/prod-release-gate.spec.ts
          tests/directory-prod-gateway-contract.spec.ts
          tests/expediente-prod-contract.spec.ts
          tests/expediente-prod-detail-contract.spec.ts
          tests/inmobiliaria-prod-contract.spec.ts
          tests/prod-canonical-write-contracts.spec.ts

      - name: Assert PROD candidate contains no test endpoints
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.js' --include='*.html' --include='*.css' 'functions/v1/[A-Za-z0-9_-]+-test' dist; then
            echo 'TEST endpoint leaked into PROD candidate' >&2
            exit 1
          fi

      - name: Seal immutable PROD candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > PROD_CANDIDATE_SHA
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf fenix-prod-candidate.tgz -C dist .
          sha256sum fenix-prod-candidate.tgz > fenix-prod-candidate.tgz.sha256
          cat > PROD_CANDIDATE_METADATA.txt <<EOF
          source_sha=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          artifact=fenix-prod-candidate.tgz
          EOF

      - name: Upload immutable PROD candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        uses: actions/upload-artifact@v4
        with:
          name: fenix-prod-candidate-${{ github.sha }}
          path: |
            fenix-prod-candidate.tgz
            fenix-prod-candidate.tgz.sha256
            PROD_CANDIDATE_SHA
            PROD_CANDIDATE_METADATA.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-playwright-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
