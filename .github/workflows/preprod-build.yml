name: PRE-PROD App Build

on:
  push:
    branches:
      - preprod-app-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preprod-app-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build
        run: npm run build

      - name: Browser QA
        run: npm run test:e2e

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-dist
          path: dist
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Build GitHub Pages PRE-PROD
        if: github.event_name != 'pull_request'
        run: |
          npx vite build --base=/fenix-capital-inmo-map/ --outDir dist-pages
          cp dist-pages/index.html dist-pages/404.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy-preprod-pages:
    if: github.event_name != 'pull_request'
    needs: build-and-browser-qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy PRE-PROD to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
