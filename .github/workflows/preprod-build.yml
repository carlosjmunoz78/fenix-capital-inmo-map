name: PRE-PROD App Build

# PRE-PROD: QA on PR/push. GitHub Pages branch snapshot is prepared from the validated PRE-PROD branch without touching main.
on:
  push:
    branches:
      - preprod-app-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: preprod-app-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies reproducibly
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Dependency versions
        run: npm list --depth=0

      - name: Persist generated lockfile in PRE-PROD branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already versioned and unchanged"
          else
            git commit -m "build(preprod): version validated package lock"
            git push origin HEAD:preprod-app-phase1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build
        run: npm run build

      - name: Browser QA
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npm run test:e2e

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-dist
          path: dist
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Build GitHub Pages PRE-PROD
        if: (github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1') || (github.event_name == 'pull_request' && github.head_ref == 'preprod-app-phase1')
        run: |
          npx vite build --base=/fenix-capital-inmo-map/ --outDir dist-pages
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll

          # Vercel is currently connected to gh-pages and invokes `npm run build`.
          # Keep the branch as a static snapshot, but make that build deterministic
          # instead of failing because package.json is absent.
          cat > dist-pages/package.json <<'JSON'
          {
            "name": "fenix-capital-preprod-static",
            "private": true,
            "version": "1.0.0",
            "scripts": {
              "build": "node build-static.cjs"
            }
          }
          JSON

          cat > dist-pages/build-static.cjs <<'JS'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const out = path.join(root, 'dist');
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });

          const skip = new Set(['dist', '.git', 'node_modules', 'package.json', 'package-lock.json', 'build-static.cjs', 'vercel.json']);
          for (const name of fs.readdirSync(root)) {
            if (skip.has(name)) continue;
            fs.cpSync(path.join(root, name), path.join(out, name), { recursive: true });
          }
          JS

          cat > dist-pages/vercel.json <<'JSON'
          {
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "cleanUrls": false
          }
          JSON

      - name: Publish validated PRE-PROD snapshot to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/preprod-app-phase1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/fenix-gh-pages
          mkdir -p /tmp/fenix-gh-pages
          cp -R dist-pages/. /tmp/fenix-gh-pages/
          cd /tmp/fenix-gh-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: PRE-PROD Pages snapshot ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
