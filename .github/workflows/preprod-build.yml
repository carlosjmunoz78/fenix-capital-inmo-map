name: PRE-PROD App Build

on:
  push:
    branches:
      - preprod-app-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: preprod-app-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Build
        run: npm run build

      - name: Browser QA
        run: npm run test:e2e

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-dist
          path: dist
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenix-preprod-playwright-report
          path: playwright-report
          if-no-files-found: ignore
