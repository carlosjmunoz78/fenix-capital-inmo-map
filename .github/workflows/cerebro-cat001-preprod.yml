name: CEREBRO CAT-001 PREPROD
on:
  pull_request:
    paths:
      - 'cerebro/property/cadastre-engine.mjs'
      - 'cerebro/tests/cadastre-engine.test.mjs'
      - '.github/workflows/cerebro-cat001-preprod.yml'
jobs:
  cat001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/cadastre-engine.test.mjs
