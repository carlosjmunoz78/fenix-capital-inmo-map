name: CEREBRO 24H MAX FANOUT V1

on:
  push:
    branches:
      - main
      - 'cerebro/max-fanout-24h-*'
      - 'cerebro/useful-run-dedupe-*'
      - 'cerebro/portfolio-fairshare-*'
  pull_request:
    paths:
      - 'cerebro/runtime/max-fanout-block-worker-v1.mjs'
      - 'cerebro/tests/max-fanout-block-worker-v1.test.mjs'
      - 'cerebro/tests/max-fanout-workflow-policy-v1.test.mjs'
      - '.github/workflows/cerebro-max-fanout-24h-v1.yml'
      - '.github/workflows/cerebro-neuronal-superparallel-v1.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      run_deepseek:
        description: 'Explicitly run the 25 DeepSeek block agents (prepaid balance, max 8 concurrent, no auto recharge)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cerebro-max-fanout-24h-v1-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate 25-block / 125-shard portfolio contract and workflow policy
        run: |
          node --test cerebro/tests/max-fanout-block-worker-v1.test.mjs
          node --test cerebro/tests/max-fanout-workflow-policy-v1.test.mjs

  evidence-workers:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 125
      matrix:
        block: [W00,W01,W02,W03,W04,W05,W06,W07,W08,W09,W10,W11,W12,W13,W14,W15,W16,W17,W18,W19,W20,W21,W22,W23,W24]
        shard: [0,1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build deterministic portfolio packet ${{ matrix.block }} shard ${{ matrix.shard }}/5
        run: node cerebro/runtime/max-fanout-block-worker-v1.mjs --mode=evidence --block=${{ matrix.block }} --shard=${{ matrix.shard }} --shards=5
      - uses: actions/upload-artifact@v4
        with:
          name: fanout-evidence-${{ matrix.block }}-s${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/max-fanout-v1/${{ matrix.block }}/shard-${{ matrix.shard }}-of-5/
          retention-days: 3

  deepseek-workers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deepseek == true }}
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        block: [W00,W01,W02,W03,W04,W05,W06,W07,W08,W09,W10,W11,W12,W13,W14,W15,W16,W17,W18,W19,W20,W21,W22,W23,W24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CEREBRO_ALLOW_PAID_FANOUT: 'YES'
      CEREBRO_FANOUT_PROJECTED_EUR_PER_BLOCK: '0.05'
      CEREBRO_FANOUT_PROJECTED_USD_PER_BLOCK: '0.05'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute bounded DeepSeek agent ${{ matrix.block }}
        run: node cerebro/runtime/max-fanout-block-worker-v1.mjs --mode=deepseek-block --block=${{ matrix.block }}
      - uses: actions/upload-artifact@v4
        with:
          name: fanout-deepseek-${{ matrix.block }}-${{ github.run_id }}
          path: artifacts/max-fanout-v1/${{ matrix.block }}/
          retention-days: 3

  summary:
    needs: [validate, evidence-workers, deepseek-workers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'CEREBRO MAX FANOUT V1 · PORTFOLIO FAIR SHARE'
          echo 'portfolio_blocks=25'
          echo 'portfolio_shards_per_block=5'
          echo 'portfolio_parallel_cap=125'
          echo 'neuronal_reserved_parallel_cap=50'
          echo 'control_reserve=5'
          echo 'enterprise_live_cap=180'
          echo 'PRs run contract/policy validation only; no 125-worker portfolio fanout'
          echo 'Deterministic portfolio fanout runs on main/authorized branches, schedule and dispatch'
          echo 'DeepSeek runs only after explicit workflow_dispatch opt-in'
          echo 'DeepSeek provider concurrency capped at 8'
          echo 'Live prepaid balance guard enabled; auto recharge=false'
          echo 'No automatic paid AI on push, PR or schedule'
          echo 'Same-tested-revision duplicate fanout runs are cancelled automatically'
          echo 'No PROD authority granted by this workflow'
          echo 'Trading remains isolated'
