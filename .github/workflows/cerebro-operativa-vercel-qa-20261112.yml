name: CEREBRO Operativa Vercel · Targeted QA
on:
  push:
    branches:
      - release/cerebro-operativa-vercel-targeted-20261112
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cerebro-operativa-vercel-qa-20261112
  cancel-in-progress: true
jobs:
  safe-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FENIX_ENV: test
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-test-only-publishable-key
      VITE_CEREBRO_CONSOLE_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-gateway-v0/
      PLAYWRIGHT_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Compare against actual Vercel PROD source; fail closed on unrelated changes
        run: |
          set -euo pipefail
          BASE='80089fae5930e63ea8d90237522b1fc16c2f6a4a'
          git cat-file -e "${BASE}^{commit}"
          git diff --name-only "$BASE" HEAD >/tmp/console-diff
          while IFS= read -r file; do
            case "$file" in
              src/CerebroConsoleHost.tsx|src/CerebroOperativeConsole.tsx|src/useCerebroOperativaChat.ts|src/cerebro-operative-console.css|src/cerebro-interface-bar.css|src/JarvisVisibleLanguageGuard.tsx|supabase/functions/cerebro-console-activity-v0/index.ts|tests/cerebro-operativa-live-vercel-e2e.spec.ts|tests/cerebro-operativa-live-vercel-contract.test.mjs|.github/workflows/cerebro-operativa-vercel-qa-20261112.yml|.github/workflows/cerebro-operativa-live-smoke-20261112.yml) ;;
              *) echo "OUT_OF_SCOPE: $file" >&2; exit 2;;
            esac
          done </tmp/console-diff
          test -z "$(git diff --name-only "$BASE" HEAD -- src/CerebroJarvisWorkConsole.tsx src/CerebroConsoleShell.tsx src/CerebroBrowserConsole.tsx src/supabase.ts src/cerebroConsoleApi.ts src/cerebroVoice.ts src/cerebroActivityApi.ts package.json package-lock.json)"
      - name: Locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and Vite production-compatible build
        run: npm run build
      - name: Activity, owner, tenant and browser-voice contracts
        run: node --test tests/cerebro-operativa-live-vercel-contract.test.mjs
      - run: npx playwright install chromium
      - name: Opera-like desktop and mobile Chromium acceptance with synthetic Gateway
        run: npx playwright test tests/cerebro-operativa-live-vercel-e2e.spec.ts --project=desktop-chromium --reporter=line
      - name: Store diagnostic artifacts only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-operativa-vercel-qa-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
