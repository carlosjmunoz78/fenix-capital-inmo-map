name: CEREBRO Browser 1 Phase 2 Credential Broker V2

on:
  push:
    branches:
      - 'cerebro/browser1-phase2-orchestrator-v1'
    paths:
      - 'cerebro/runtime/browser-job-runner-v2.mjs'
      - 'cerebro/tests/browser-job-runner-v2.test.mjs'
      - 'supabase/functions/cerebro-browser-dispatch-v2/**'
      - 'supabase/migrations/20261023194500_cerebro_browser_credential_broker_v2.sql'
      - '.github/workflows/cerebro-browser-credential-broker-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CEREBRO_BROWSER_DISPATCH_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-browser-dispatch-v2
  CEREBRO_BROWSER_OIDC_AUDIENCE: cerebro-browser-worker-v1
  CEREBRO_BROWSER_WORKER_SLOT: '1'
  CEREBRO_BROWSER_STAGE_CONCURRENCY: '2'
  CEREBRO_PHYSICAL_BROWSER_E2E: '1'

jobs:
  contracts:
    name: Credential broker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prove V2 worker keeps credential material in memory only
        run: node --test cerebro/tests/browser-job-runner-v2.test.mjs
      - name: Prove V1 credential broker remains present
        run: |
          test -f cerebro/runtime/browser-job-runner-v1.mjs
          test -f .github/workflows/cerebro-browser-job-runner-v1.yml
          grep -q "serial_v1_rollback_preserved:true" cerebro/runtime/browser-job-runner-v2.mjs

  physical-canary:
    name: Physical credential materialization canary
    needs: contracts
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Seed credential alias canary without secret material
        run: |
          node --input-type=module <<'NODE'
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience',process.env.CEREBRO_BROWSER_OIDC_AUDIENCE);
          const tr=await fetch(u,{headers:{authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},redirect:'error'});
          if(!tr.ok)throw new Error(`OIDC_TOKEN_FAILED:${tr.status}`);
          const {value:token}=await tr.json();
          const r=await fetch(`${process.env.CEREBRO_BROWSER_DISPATCH_URL}/phase2-credential-canary-seed`,{
            method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},
            body:JSON.stringify({worker_slot:1,stage_concurrency:2}),redirect:'error'
          });
          const body=await r.json().catch(()=>null);
          if(!r.ok||body?.ok!==true)throw new Error(`CREDENTIAL_CANARY_SEED_FAILED:${r.status}:${body?.error||'UNKNOWN'}`);
          console.log(JSON.stringify({seeded:true,job_id:body.job_id,status:body.status,credential_reference_only:true,secret_material_logged:false}));
          NODE
      - name: Materialize in worker memory and execute Browser 1
        env:
          CEREBRO_BROWSER_PHASE2_SEED_CANARY: 'false'
        run: node cerebro/runtime/browser-job-runner-v2.mjs
      - name: Prove inactive lease cannot materialize
        run: |
          node --input-type=module <<'NODE'
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience',process.env.CEREBRO_BROWSER_OIDC_AUDIENCE);
          const tr=await fetch(u,{headers:{authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},redirect:'error'});
          if(!tr.ok)throw new Error(`OIDC_TOKEN_FAILED:${tr.status}`);
          const {value:token}=await tr.json();
          const r=await fetch(`${process.env.CEREBRO_BROWSER_DISPATCH_URL}/credential-materialize-v2`,{
            method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},
            body:JSON.stringify({worker_slot:1,job_id:'00000000-0000-0000-0000-000000000001',lease_id:'00000000-0000-0000-0000-000000000002'}),redirect:'error'
          });
          const body=await r.json().catch(()=>null);
          if(r.status!==403||body?.error!=='CREDENTIAL_MATERIALIZE_V2_DENIED')throw new Error(`LEASE_DENIAL_NOT_ENFORCED:${r.status}`);
          console.log(JSON.stringify({inactive_lease_denied:true,secret_material_returned:false}));
          NODE
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-phase2-credential-broker-v2
          path: .cerebro/browser-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

  status:
    name: Verify broker canary queue drained
    needs: physical-canary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read governed PREPROD V2 status
        run: |
          node --input-type=module <<'NODE'
          const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          u.searchParams.set('audience',process.env.CEREBRO_BROWSER_OIDC_AUDIENCE);
          const tr=await fetch(u,{headers:{authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},redirect:'error'});
          const {value:token}=await tr.json();
          const r=await fetch(`${process.env.CEREBRO_BROWSER_DISPATCH_URL}/status-v2`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:'{}',redirect:'error'});
          const body=await r.json();
          console.log(JSON.stringify({ok:body?.ok===true,active_profiles:Number(body?.active_profiles||0),secret_material_logged:false}));
          if(!r.ok||body?.ok!==true||Number(body.active_profiles||0)!==0)process.exit(1);
          NODE
