name: CEREBRO OpenRouter quota LAB verification
on:
  push:
    branches: [lab/openrouter-quota-v1-20261124]
    paths: ['.github/workflows/cerebro-openrouter-quota-lab-v1.yml', 'cerebro/router/openrouter-lab/dispatch.mjs']
permissions:
  contents: read
concurrency:
  group: cerebro-openrouter-account-lab-v1
  cancel-in-progress: false
jobs:
  quota-and-smoke:
    if: github.repository == 'carlosjmunoz78/fenix-capital-inmo-map' && github.ref == 'refs/heads/lab/openrouter-quota-v1-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Test quota decisions
        run: node --test cerebro/router/openrouter-lab/quota.test.mjs
      - name: Validate retained reservation history without provider requests
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const ledger=JSON.parse(fs.readFileSync('cerebro/router/openrouter-lab/quota-state.json','utf8'));
          assert.equal(ledger.version,1);
          assert.ok(ledger.attempts.some(x=>x.id==='gh-45454865017'));
          assert.equal(new Set(ledger.attempts.map(x=>x.id)).size,ledger.attempts.length);
          console.log('OPENROUTER_LAB_HOLD_LIVE_DISPATCH; persistent history retained; zero provider calls');
          NODE
