name: CEREBRO Skill AutoLoop Decision Integration V1

on:
  pull_request:
    paths:
      - 'cerebro/runtime/skill-capability-autonomy-closure-v1.mjs'
      - 'cerebro/skills/skill-autoloop-autonomy-decision.mjs'
      - 'cerebro/skills/skill-autoloop-safe-handler.mjs'
      - 'cerebro/skills/skill-promotion-readiness.mjs'
      - 'cerebro/tests/skill-autoloop-autonomy-decision.test.mjs'
      - 'cerebro/tests/skill-autoloop-safe-handler.test.mjs'
      - 'cerebro/tests/skill-promotion-readiness.test.mjs'
      - '.github/workflows/cerebro-skill-autoloop-safe-handler.yml'
      - '.github/workflows/cerebro-skill-autoloop-decision-integration-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'cerebro/runtime/skill-capability-autonomy-closure-v1.mjs'
      - 'cerebro/skills/skill-autoloop-autonomy-decision.mjs'
      - 'cerebro/skills/skill-autoloop-safe-handler.mjs'
      - 'cerebro/skills/skill-promotion-readiness.mjs'
      - 'cerebro/tests/skill-autoloop-autonomy-decision.test.mjs'
      - 'cerebro/tests/skill-autoloop-safe-handler.test.mjs'
      - 'cerebro/tests/skill-promotion-readiness.test.mjs'
      - '.github/workflows/cerebro-skill-autoloop-safe-handler.yml'
      - '.github/workflows/cerebro-skill-autoloop-decision-integration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-autoloop-decision-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/skill-capability-autonomy-closure-v1.test.mjs cerebro/tests/skill-autoloop-autonomy-decision.test.mjs cerebro/tests/skill-autoloop-safe-handler.test.mjs cerebro/tests/skill-promotion-readiness.test.mjs cerebro/tests/skill-autoloop-controller.test.mjs

  skill-evolution-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/skill-capability-evolution.test.mjs cerebro/tests/skill-capability-evolution-v0.test.mjs cerebro/tests/skill-capability-evolution-bridge.test.mjs cerebro/tests/evaluation-tribunal.test.mjs

  full-cerebro-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs

  main-baseline-full-cerebro:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs
