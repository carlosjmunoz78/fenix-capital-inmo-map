name: CEREBRO POST-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-ret001-retention-engine-v0-20260911']
    paths:
      - 'cerebro/customer/postfirma-engine.mjs'
      - 'cerebro/tests/postfirma-engine.test.mjs'
      - '.github/workflows/cerebro-post001-preprod.yml'
jobs:
  post001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/postfirma-engine.test.mjs
