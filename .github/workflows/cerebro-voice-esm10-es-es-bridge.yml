name: CEREBRO VOICE-001 ESM10 Synthetic Timbre es-ES Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/voice/runtime/esm10_synthetic_timbre_es_es_bridge.py'
      - '.github/workflows/cerebro-voice-esm10-es-es-bridge.yml'

permissions:
  contents: read

jobs:
  esm10-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight Space client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.13,<2'

      - name: Generate ESM10 original timbre bridged into dedicated es-ES
        env:
          CEREBRO_ENVIRONMENT: LAB
        run: |
          mkdir -p "$RUNNER_TEMP/esm10"
          python cerebro/voice/runtime/esm10_synthetic_timbre_es_es_bridge.py --output-dir "$RUNNER_TEMP/esm10"

      - name: Verify evidence boundary
        shell: python
        run: |
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'esm10' / 'ESM10_bridge_evidence.json'
          e = json.loads(p.read_text(encoding='utf-8'))
          assert e['engine_id'] == 'VOICE-001'
          assert e['voice_target'] == 'ESM10'
          assert e['target_locale'] == 'es-ES'
          assert e['identity_policy']['synthetic_reference_only'] is True
          assert e['identity_policy']['actor_clone'] is False
          assert e['identity_policy']['character_clone'] is False
          assert e['identity_policy']['movie_audio_reference'] is False
          assert e['authority']['automatic_promotion'] is False
          assert e['authority']['voice_bank_ready'] is False
          assert e['authority']['prod_enabled'] is False
          assert len(e['candidates']) == 3
          print('GREEN: ESM10 synthetic-timbre -> es-ES owner-listening candidates generated; no promotion.')

      - name: Upload ESM10 listening candidates
        uses: actions/upload-artifact@v4
        with:
          name: voice001-esm10-synthetic-timbre-es-es-bridge
          path: |
            ${{ runner.temp }}/esm10/ESM10_*_es_ES.wav
            ${{ runner.temp }}/esm10/ESM10_bridge_evidence.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Record scope
        run: |
          echo 'ESM10 uses only original synthetic references, then the dedicated Spain-Spanish Chatterbox model.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No actor, movie, character, or identifiable-person reference audio is used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Owner listening required. PROD=false. automatic_promotion=false.' >> "$GITHUB_STEP_SUMMARY"
