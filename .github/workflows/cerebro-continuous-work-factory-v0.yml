name: CEREBRO Continuous Work Factory V0
run-name: CEREBRO CONTINUOUS FACTORY · target 68 · watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cerebro-continuous-work-factory-v0.yml'
      - '.github/workflows/cerebro-cloud-useful-continuous-worker-v0.yml'
      - 'cerebro/runtime/continuous-useful-work-factory-v0.mjs'
      - 'cerebro/tests/continuous-useful-work-factory-v0.test.mjs'

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebro-continuous-work-factory-v0
  cancel-in-progress: false

jobs:
  watchdog:
    name: Maintain 68 self-feeding PREPROD lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_LANES: '68'
      TARGET_FLOOR: '48'
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_ALLOW_PAID_FANOUT: 'NO'
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard authority and zero-cost policy
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_visibility }}" = "public"
          test "$CEREBRO_SUPERVISOR_ENV" = "PREPROD"
          test "$CEREBRO_ALLOW_PAID_FANOUT" = "NO"
          test "$CEREBRO_PROD_WRITE" = "false"
          test "$CEREBRO_TRADING_ACCESS" = "false"
          test "$TARGET_LANES" = "68"
          test "$TARGET_FLOOR" = "48"

      - name: Validate continuous factory contract
        run: node --test cerebro/tests/continuous-useful-work-factory-v0.test.mjs

      - name: Discover live lanes and refill every missing lane
        shell: bash
        run: |
          set -euo pipefail
          workflow='cerebro-cloud-useful-continuous-worker-v0.yml'
          tmp="$(mktemp)"
          : > "$tmp"

          for status in in_progress queued pending waiting requested; do
            gh api "/repos/${GH_REPO}/actions/workflows/${workflow}/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[].display_title' >> "$tmp" || true
          done

          present="$(grep -Eo 'CEREBRO CONTINUOUS [0-9]+' "$tmp" | awk '{print $3}' | sort -n -u || true)"
          present_count="$(printf '%s\n' "$present" | sed '/^$/d' | wc -l | tr -d ' ')"
          dispatched=0
          seed_cycle=$(( $(date +%s) / 300 % 1000000 ))

          for lane in $(seq 0 67); do
            if ! printf '%s\n' "$present" | grep -qx "$lane"; then
              cycle=$(( (seed_cycle + lane) % 1000000 ))
              gh api --method POST "/repos/${GH_REPO}/actions/workflows/${workflow}/dispatches" \
                -f ref=main \
                -f "inputs[lane]=${lane}" \
                -f "inputs[cycle]=${cycle}"
              dispatched=$((dispatched + 1))
            fi
          done

          echo "live_or_queued_lanes_before=${present_count}" >> "$GITHUB_STEP_SUMMARY"
          echo "dispatched_missing_lanes=${dispatched}" >> "$GITHUB_STEP_SUMMARY"
          echo "target_lanes=68" >> "$GITHUB_STEP_SUMMARY"
          echo "target_floor=48" >> "$GITHUB_STEP_SUMMARY"
          echo "self_refill=true" >> "$GITHUB_STEP_SUMMARY"
          echo "watchdog_every_5m=true" >> "$GITHUB_STEP_SUMMARY"
          echo "paid_ai=false" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"
