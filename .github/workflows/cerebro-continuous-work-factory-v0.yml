name: CEREBRO Global Capacity Controller V1
run-name: CEREBRO GLOBAL CAPACITY · RAMP350_TOTAL · PREPROD

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cerebro-continuous-work-factory-v0.yml'
      - '.github/workflows/cerebro-cloud-useful-continuous-worker-v1.yml'
      - '.github/workflows/cerebro-portfolio-priority-sustained-v1.yml'
      - '.github/workflows/cerebro-neuronal-superparallel-v1.yml'
      - 'cerebro/runtime/continuous-useful-work-factory-v0.mjs'
      - 'cerebro/runtime/portfolio-priority-sustained-v1.mjs'
      - 'cerebro/tests/continuous-useful-work-factory-v0.test.mjs'
      - 'cerebro/tests/portfolio-priority-sustained-v1.test.mjs'

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebro-global-capacity-controller-v1
  cancel-in-progress: false

jobs:
  controller:
    name: Maintain governed 350 useful jobs inside Enterprise 360
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      USEFUL_POOL: '350'
      CONTROL_RESERVE: '10'
      ENTERPRISE_CAP: '360'
      BACKGROUND_MAX_USEFUL: '350'
      MAINTENANCE_RAMP_LANES: '68'
      PRIORITY_MAX_LANES: '282'
      MAINTENANCE_MAX_LANES: '68'
      PORTFOLIO_BASE_LANES: '182'
      PORTFOLIO_LOAN_LANES: '100'
      NEURONAL_MAX_PHYSICAL: '25'
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_ALLOW_PAID_FANOUT: 'NO'
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Guard Enterprise 350+10 and zero-cost authority
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_visibility }}" = public
          test "$CEREBRO_SUPERVISOR_ENV" = PREPROD
          test "$CEREBRO_ALLOW_PAID_FANOUT" = NO
          test "$CEREBRO_PROD_WRITE" = false
          test "$CEREBRO_TRADING_ACCESS" = false
          test "$USEFUL_POOL" -eq 350
          test "$CONTROL_RESERVE" -eq 10
          test "$ENTERPRISE_CAP" -eq 360
          test $((USEFUL_POOL + CONTROL_RESERVE)) -eq "$ENTERPRISE_CAP"
          test "$BACKGROUND_MAX_USEFUL" -eq "$USEFUL_POOL"
          test "$MAINTENANCE_RAMP_LANES" -eq 68
          test "$PRIORITY_MAX_LANES" -eq 282
          test $((MAINTENANCE_RAMP_LANES + PRIORITY_MAX_LANES)) -eq "$BACKGROUND_MAX_USEFUL"
          test "$PRIORITY_MAX_LANES" -eq $((PORTFOLIO_BASE_LANES + PORTFOLIO_LOAN_LANES))
          test "$NEURONAL_MAX_PHYSICAL" -eq 25

      - name: Validate worker contracts
        run: |
          node --test cerebro/tests/continuous-useful-work-factory-v0.test.mjs
          node --test cerebro/tests/portfolio-priority-sustained-v1.test.mjs

      - name: Reconcile maximum useful capacity with NEURONAL reservation
        shell: bash
        run: |
          set -euo pipefail
          maintenance='cerebro-cloud-useful-continuous-worker-v1.yml'
          priority='cerebro-portfolio-priority-sustained-v1.yml'
          neuronal='cerebro-neuronal-superparallel-v1.yml'
          seed_cycle=$(( $(date +%s) / 300 % 1000000 ))

          dispatch_with_transient_retry() {
            local endpoint="$1"; shift
            local attempt output
            for attempt in 1 2 3 4; do
              if output="$(gh api --method POST "$endpoint" "$@" 2>&1)"; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              printf '%s\n' "$output" >&2
              case "$output" in
                *'HTTP 500'*|*'HTTP 502'*|*'HTTP 503'*|*'HTTP 504'*)
                  if [ "$attempt" -lt 4 ]; then
                    sleep $((attempt * 2))
                    continue
                  fi
                  ;;
                *) return 1 ;;
              esac
              return 1
            done
          }

          critical_regex='cerebro-enterprise-acceleration-v0.yml|cerebro-global-capacity-controller-v1-ci.yml|cerebro-auto001-preprod-patch-executor-v0.yml|cerebro-auto001-prod-closure-v1.yml|cerebro-governed-promotion-v1.yml|cerebro-fact001-repair-worker-factory-v1.yml|cerebro-app001-preprod-physical-qa-v1.yml'
          active_tmp="$(mktemp)"
          : > "$active_tmp"

          # Four pages per status cover 350 useful + 10 control with margin.
          for status in in_progress queued pending waiting requested; do
            for page in 1 2 3 4; do
              gh api "/repos/${GH_REPO}/actions/runs?status=${status}&per_page=100&page=${page}" \
                --jq '.workflow_runs[] | [.id,.status,.path,.display_title] | @tsv' \
                >> "$active_tmp" 2>/dev/null || true
            done
          done
          sort -u "$active_tmp" -o "$active_tmp"

          critical_queued_count="$(awk -F '\t' -v re="$critical_regex" '$2!="in_progress" && $3 ~ re {print $1}' "$active_tmp" | sort -u | wc -l | tr -d ' ')"
          critical_pressure=false
          pressure_cancel_budget=0
          if [ "$critical_queued_count" -gt "$CONTROL_RESERVE" ]; then
            critical_pressure=true
            pressure_cancel_budget=$((critical_queued_count - CONTROL_RESERVE))
          fi

          maint_tmp="$(mktemp)"
          priority_tmp="$(mktemp)"
          neuronal_tmp="$(mktemp)"
          awk -F '\t' -v p=".github/workflows/${maintenance}" '$3==p' "$active_tmp" > "$maint_tmp"
          awk -F '\t' -v p=".github/workflows/${priority}" '$3==p' "$active_tmp" > "$priority_tmp"
          awk -F '\t' -v p=".github/workflows/${neuronal}" '$3==p' "$active_tmp" > "$neuronal_tmp"

          maint_present="$(awk -F '\t' '{print $4}' "$maint_tmp" | sed -n -E 's/.*CEREBRO SUSTAINED ([0-9]+).*/\1/p' | sort -n -u)"
          priority_present="$(awk -F '\t' '{print $4}' "$priority_tmp" | sed -n -E 's/.*CEREBRO PRIORITY ([0-9]+).*/\1/p' | sort -n -u)"

          # GitHub's repository-wide runs listing can transiently omit an older
          # queued workflow even while its exact run remains queued. Probe the
          # NEURONAL workflow directly so its 25 physical slots are never loaned
          # back to PRIORITY because of a pagination/eventual-consistency gap.
          neuronal_probe_status='GREEN'
          neuronal_probe_json=''
          neuronal_probe_error="$(mktemp)"
          for attempt in 1 2 3; do
            : > "$neuronal_probe_error"
            if neuronal_probe_json="$(gh api "/repos/${GH_REPO}/actions/workflows/${neuronal}/runs?per_page=30" 2>"$neuronal_probe_error")"; then
              break
            fi
            if grep -qi 'rate limit' "$neuronal_probe_error"; then
              sleep "$((attempt * 2))"
              continue
            fi
            neuronal_probe_status='FAIL_CLOSED'
            break
          done
          if [ -n "$neuronal_probe_json" ]; then
            neuronal_parent_active="$(printf '%s' "$neuronal_probe_json" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
            neuronal_active_ids="$(printf '%s' "$neuronal_probe_json" | jq -r '.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested") | .id' | paste -sd, -)"
          else
            # Fail closed: uncertainty must reserve NEURONAL capacity rather
            # than overcommit the Enterprise 360 entitlement.
            neuronal_probe_status='FAIL_CLOSED'
            neuronal_parent_active=1
            neuronal_active_ids='UNKNOWN_FAIL_CLOSED'
          fi

          # Reserve the full possible 25 physical NEURONAL runners whenever a
          # NEURONAL parent is active. When it is idle, loan those 25 slots back
          # to the portfolio so the background can reach all 350 useful slots.
          neuronal_reserved=0
          priority_target="$PRIORITY_MAX_LANES"
          if [ "$neuronal_parent_active" -gt 0 ]; then
            neuronal_reserved="$NEURONAL_MAX_PHYSICAL"
            priority_target=$((PRIORITY_MAX_LANES - NEURONAL_MAX_PHYSICAL))
          fi
          background_target=$((MAINTENANCE_RAMP_LANES + priority_target))
          total_useful_target=$((background_target + neuronal_reserved))
          test "$total_useful_target" -eq "$USEFUL_POOL"
          test $((total_useful_target + CONTROL_RESERVE)) -eq "$ENTERPRISE_CAP"

          cancelled_background_queue_runs=0
          cancelled_neuronal_return_loans=0
          maintenance_dispatched=0
          priority_dispatched=0
          capacity_mode='RAMP350_TOTAL'

          if [ "$critical_pressure" = true ]; then
            capacity_mode='CONTROL_PRESSURE_BOUNDED'
            while IFS=$'\t' read -r run_id status _path _title; do
              [ -n "$run_id" ] || continue
              [ "$cancelled_background_queue_runs" -lt "$pressure_cancel_budget" ] || break
              if [ "$status" != in_progress ]; then
                gh api --method POST "/repos/${GH_REPO}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
                cancelled_background_queue_runs=$((cancelled_background_queue_runs + 1))
              fi
            done < <(cat "$maint_tmp" "$priority_tmp" | sort -u)
          else
            # If NEURONAL is active, return only queued/waiting loan lanes above
            # the reduced priority target. Never cancel useful in-progress work.
            while IFS=$'\t' read -r run_id status _path title; do
              [ -n "$run_id" ] || continue
              lane="$(printf '%s' "$title" | sed -n -E 's/.*CEREBRO PRIORITY ([0-9]+).*/\1/p')"
              if [ -n "$lane" ] && [ "$lane" -ge "$priority_target" ] && [ "$status" != in_progress ]; then
                gh api --method POST "/repos/${GH_REPO}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
                cancelled_neuronal_return_loans=$((cancelled_neuronal_return_loans + 1))
              fi
            done < "$priority_tmp"

            for lane in $(seq 0 $((MAINTENANCE_RAMP_LANES - 1))); do
              if ! printf '%s\n' "$maint_present" | grep -qx "$lane"; then
                cycle=$(( (seed_cycle + lane) % 1000000 ))
                dispatch_with_transient_retry "/repos/${GH_REPO}/actions/workflows/${maintenance}/dispatches" \
                  -f ref=main -f "inputs[lane]=${lane}" -f "inputs[cycle]=${cycle}"
                maintenance_dispatched=$((maintenance_dispatched + 1))
              fi
            done

            for lane in $(seq 0 $((priority_target - 1))); do
              if ! printf '%s\n' "$priority_present" | grep -qx "$lane"; then
                cycle=$(( (seed_cycle + 1000 + lane) % 1000000 ))
                dispatch_with_transient_retry "/repos/${GH_REPO}/actions/workflows/${priority}/dispatches" \
                  -f ref=main -f "inputs[lane]=${lane}" -f "inputs[cycle]=${cycle}"
                priority_dispatched=$((priority_dispatched + 1))
              fi
            done
          fi

          maintenance_active="$(printf '%s\n' "$maint_present" | sed '/^$/d' | wc -l | tr -d ' ')"
          priority_active="$(printf '%s\n' "$priority_present" | sed '/^$/d' | wc -l | tr -d ' ')"
          observed_background=$((maintenance_active + priority_active))

          echo "capacity_mode=$capacity_mode" >> "$GITHUB_STEP_SUMMARY"
          echo "ramp_stage=5" >> "$GITHUB_STEP_SUMMARY"
          echo "useful_pool_target=$USEFUL_POOL" >> "$GITHUB_STEP_SUMMARY"
          echo "background_target=$background_target" >> "$GITHUB_STEP_SUMMARY"
          echo "maintenance_target=$MAINTENANCE_RAMP_LANES" >> "$GITHUB_STEP_SUMMARY"
          echo "priority_target=$priority_target" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_parent_runs_active=$neuronal_parent_active" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_probe_status=$neuronal_probe_status" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_active_ids=${neuronal_active_ids:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_probe_api_calls=1" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_reserved=$neuronal_reserved" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_max_physical=$NEURONAL_MAX_PHYSICAL" >> "$GITHUB_STEP_SUMMARY"
          echo "total_useful_target=$total_useful_target" >> "$GITHUB_STEP_SUMMARY"
          echo "observed_background_before=$observed_background" >> "$GITHUB_STEP_SUMMARY"
          echo "maintenance_dispatched=$maintenance_dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "priority_dispatched=$priority_dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "cancelled_neuronal_return_loans=$cancelled_neuronal_return_loans" >> "$GITHUB_STEP_SUMMARY"
          echo "critical_queued_count=$critical_queued_count" >> "$GITHUB_STEP_SUMMARY"
          echo "critical_control_pressure=$critical_pressure" >> "$GITHUB_STEP_SUMMARY"
          echo "pressure_cancel_budget=$pressure_cancel_budget" >> "$GITHUB_STEP_SUMMARY"
          echo "cancelled_background_queue_runs=$cancelled_background_queue_runs" >> "$GITHUB_STEP_SUMMARY"
          echo "control_reserve=$CONTROL_RESERVE" >> "$GITHUB_STEP_SUMMARY"
          echo "enterprise_cap=$ENTERPRISE_CAP" >> "$GITHUB_STEP_SUMMARY"
          echo "api_snapshot_calls_max=21" >> "$GITHUB_STEP_SUMMARY"
          echo "worker_pressure_reads=0" >> "$GITHUB_STEP_SUMMARY"
          echo "dispatch_transient_retry=500,502,503,504:max4" >> "$GITHUB_STEP_SUMMARY"
          echo "dispatch_non_transient_retry=false" >> "$GITHUB_STEP_SUMMARY"
          echo "in_progress_background_cancelled=false" >> "$GITHUB_STEP_SUMMARY"
          echo "control_pressure_policy=reserve10_then_cancel_excess_only" >> "$GITHUB_STEP_SUMMARY"
          echo "priority_order=CRITICAL_GATES > P0_JARVIS_OPERATIVA_KNOWLEDGE > P1_BROWSER_ACTUATION > P2_FACTORIES > P3_BUSINESS" >> "$GITHUB_STEP_SUMMARY"
          echo "paid_ai=false" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Controller cadence contract
        run: |
          echo 'controller_self_rearmed=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'controller_reconcile_cadence=5m_schedule_plus_push_plus_manual' >> "$GITHUB_STEP_SUMMARY"
          echo 'reason=avoid_tight_loop_and_installation_rate_limit' >> "$GITHUB_STEP_SUMMARY"
          echo 'additional_cost_eur=0' >> "$GITHUB_STEP_SUMMARY"
