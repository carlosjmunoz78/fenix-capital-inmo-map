name: CEREBRO Global Capacity Controller V1
run-name: CEREBRO GLOBAL CAPACITY · 360 shared · PREPROD

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cerebro-continuous-work-factory-v0.yml'
      - '.github/workflows/cerebro-cloud-useful-continuous-worker-v1.yml'
      - '.github/workflows/cerebro-portfolio-priority-sustained-v1.yml'
      - '.github/workflows/cerebro-neuronal-superparallel-v1.yml'
      - 'cerebro/runtime/continuous-useful-work-factory-v0.mjs'
      - 'cerebro/runtime/portfolio-priority-sustained-v1.mjs'
      - 'cerebro/tests/continuous-useful-work-factory-v0.test.mjs'
      - 'cerebro/tests/portfolio-priority-sustained-v1.test.mjs'

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebro-global-capacity-controller-v1
  cancel-in-progress: false

jobs:
  controller:
    name: Maintain shared Enterprise 360 useful-work pool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      USEFUL_POOL: '350'
      MAINTENANCE_MAX_LANES: '68'
      PORTFOLIO_BASE_LANES: '182'
      PORTFOLIO_LOAN_LANES: '100'
      NEURONAL_RESERVED_LANES: '100'
      CONTROL_RESERVE: '10'
      ENTERPRISE_CAP: '360'
      CEREBRO_SUPERVISOR_ENV: PREPROD
      CEREBRO_ALLOW_PAID_FANOUT: 'NO'
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_TRADING_ACCESS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard global capacity and zero-cost authority
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_visibility }}" = public
          test "$CEREBRO_SUPERVISOR_ENV" = PREPROD
          test "$CEREBRO_ALLOW_PAID_FANOUT" = NO
          test "$CEREBRO_PROD_WRITE" = false
          test "$CEREBRO_TRADING_ACCESS" = false
          test "$USEFUL_POOL" -eq 350
          test "$MAINTENANCE_MAX_LANES" -eq 68
          test "$PORTFOLIO_BASE_LANES" -eq 182
          test "$PORTFOLIO_LOAN_LANES" -eq 100
          test "$NEURONAL_RESERVED_LANES" -eq 100
          test "$CONTROL_RESERVE" -eq 10
          test "$ENTERPRISE_CAP" -eq 360
          test $((USEFUL_POOL + CONTROL_RESERVE)) -eq "$ENTERPRISE_CAP"
          test $((MAINTENANCE_MAX_LANES + PORTFOLIO_BASE_LANES + NEURONAL_RESERVED_LANES)) -eq "$USEFUL_POOL"
          test $((MAINTENANCE_MAX_LANES + PORTFOLIO_BASE_LANES + PORTFOLIO_LOAN_LANES)) -eq "$USEFUL_POOL"
      - name: Validate worker contracts
        run: |
          node --test cerebro/tests/continuous-useful-work-factory-v0.test.mjs
          node --test cerebro/tests/portfolio-priority-sustained-v1.test.mjs
      - name: Reconcile shared capacity
        shell: bash
        run: |
          set -euo pipefail
          maintenance='cerebro-cloud-useful-continuous-worker-v1.yml'
          priority='cerebro-portfolio-priority-sustained-v1.yml'
          neuronal='cerebro-neuronal-superparallel-v1.yml'
          active_statuses='in_progress queued pending waiting requested'
          queue_statuses='queued pending waiting requested'
          seed_cycle=$(( $(date +%s) / 300 % 1000000 ))

          # Critical control-plane work must not sit behind hundreds of idempotent
          # background attempts when GitHub provisions fewer runners than the
          # verified Enterprise entitlement. 68 is therefore a normal maintenance
          # ceiling, not a sacred reservation: under control pressure background
          # queue attempts drain temporarily while in-progress useful work finishes.
          critical_workflows=(
            'cerebro-enterprise-acceleration-v0.yml'
            'cerebro-global-capacity-controller-v1-ci.yml'
            'cerebro-auto001-preprod-patch-executor-v0.yml'
            'cerebro-auto001-prod-closure-v1.yml'
            'cerebro-governed-promotion-v1.yml'
            'cerebro-fact001-repair-worker-factory-v1.yml'
          )
          critical_tmp="$(mktemp)"; : > "$critical_tmp"
          for workflow in "${critical_workflows[@]}"; do
            for status in $queue_statuses; do
              for page in 1 2; do
                gh api "/repos/${GH_REPO}/actions/workflows/${workflow}/runs?status=${status}&per_page=100&page=${page}" \
                  --jq '.workflow_runs[].id' >> "$critical_tmp" 2>/dev/null || true
              done
            done
          done
          critical_queued_count="$(sort -n -u "$critical_tmp" | sed '/^$/d' | wc -l | tr -d ' ')"
          critical_pressure=false
          if [ "$critical_queued_count" -gt 0 ]; then critical_pressure=true; fi

          # Reserve NEURONAL capacity from real physical jobs, not from the mere
          # existence of a parent workflow run. Any unused part of the 100-lane
          # NEURONAL share is immediately loaned to the prioritized portfolio.
          neuronal_runs_tmp="$(mktemp)"; : > "$neuronal_runs_tmp"
          for status in $active_statuses; do
            for page in 1 2; do
              gh api "/repos/${GH_REPO}/actions/workflows/${neuronal}/runs?status=${status}&per_page=100&page=${page}" --jq '.workflow_runs[].id' >> "$neuronal_runs_tmp" 2>/dev/null || true
            done
          done
          neuronal_jobs_tmp="$(mktemp)"; : > "$neuronal_jobs_tmp"
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            for page in 1 2; do
              gh api "/repos/${GH_REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100&page=${page}" \
                --jq '.jobs[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested") | .id' \
                >> "$neuronal_jobs_tmp" 2>/dev/null || true
            done
          done < <(sort -n -u "$neuronal_runs_tmp")
          neuronal_physical_active="$(sort -n -u "$neuronal_jobs_tmp" | sed '/^$/d' | wc -l | tr -d ' ')"
          neuronal_reserved="$neuronal_physical_active"
          if [ "$neuronal_reserved" -gt "$NEURONAL_RESERVED_LANES" ]; then neuronal_reserved="$NEURONAL_RESERVED_LANES"; fi
          priority_target=$((PORTFOLIO_BASE_LANES + PORTFOLIO_LOAN_LANES - neuronal_reserved))
          if [ "$priority_target" -lt "$PORTFOLIO_BASE_LANES" ]; then priority_target="$PORTFOLIO_BASE_LANES"; fi
          if [ "$priority_target" -gt $((PORTFOLIO_BASE_LANES + PORTFOLIO_LOAN_LANES)) ]; then priority_target=$((PORTFOLIO_BASE_LANES + PORTFOLIO_LOAN_LANES)); fi

          maint_tmp="$(mktemp)"; : > "$maint_tmp"
          for status in $active_statuses; do
            gh api "/repos/${GH_REPO}/actions/workflows/${maintenance}/runs?status=${status}&per_page=100" --jq '.workflow_runs[] | [.id,.status,.display_title] | @tsv' >> "$maint_tmp" 2>/dev/null || true
          done
          maint_present="$(awk -F '\t' '{print $3}' "$maint_tmp" | sed -n -E 's/.*CEREBRO SUSTAINED ([0-9]+).*/\1/p' | sort -n -u)"
          maint_count="$(printf '%s\n' "$maint_present" | sed '/^$/d' | wc -l | tr -d ' ')"

          priority_tmp="$(mktemp)"; : > "$priority_tmp"
          for status in $active_statuses; do
            for page in 1 2 3 4; do
              gh api "/repos/${GH_REPO}/actions/workflows/${priority}/runs?status=${status}&per_page=100&page=${page}" --jq '.workflow_runs[] | [.id,.status,.display_title] | @tsv' >> "$priority_tmp" 2>/dev/null || true
            done
          done

          cancelled_background_queue_runs=0
          maintenance_dispatched=0
          priority_dispatched=0
          cancelled_loans=0
          capacity_mode='FULL_USEFUL_POOL'

          if [ "$critical_pressure" = true ]; then
            capacity_mode='CONTROL_PRESSURE'
            background_queued_tmp="$(mktemp)"; : > "$background_queued_tmp"
            awk -F '\t' '$2!="in_progress" {print $1}' "$maint_tmp" >> "$background_queued_tmp"
            awk -F '\t' '$2!="in_progress" {print $1}' "$priority_tmp" >> "$background_queued_tmp"
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              gh api --method POST "/repos/${GH_REPO}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
              cancelled_background_queue_runs=$((cancelled_background_queue_runs + 1))
            done < <(sort -n -u "$background_queued_tmp")
          else
            for lane in $(seq 0 $((MAINTENANCE_MAX_LANES - 1))); do
              if ! printf '%s\n' "$maint_present" | grep -qx "$lane"; then
                cycle=$(( (seed_cycle + lane) % 1000000 ))
                gh api --method POST "/repos/${GH_REPO}/actions/workflows/${maintenance}/dispatches" -f ref=main -f "inputs[lane]=${lane}" -f "inputs[cycle]=${cycle}"
                maintenance_dispatched=$((maintenance_dispatched + 1))
              fi
            done

            while IFS=$'\t' read -r run_id _status title; do
              lane="$(printf '%s' "$title" | sed -n -E 's/.*CEREBRO PRIORITY ([0-9]+).*/\1/p')"
              if [ -n "$lane" ] && [ "$lane" -ge "$priority_target" ]; then
                gh api --method POST "/repos/${GH_REPO}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
                cancelled_loans=$((cancelled_loans + 1))
              fi
            done < "$priority_tmp"

            priority_present="$(awk -F '\t' '{print $3}' "$priority_tmp" | sed -n -E 's/.*CEREBRO PRIORITY ([0-9]+).*/\1/p' | sort -n -u)"
            max_lane=$((priority_target - 1))
            for lane in $(seq 0 "$max_lane"); do
              if ! printf '%s\n' "$priority_present" | grep -qx "$lane"; then
                cycle=$(( (seed_cycle + 1000 + lane) % 1000000 ))
                gh api --method POST "/repos/${GH_REPO}/actions/workflows/${priority}/dispatches" -f ref=main -f "inputs[lane]=${lane}" -f "inputs[cycle]=${cycle}"
                priority_dispatched=$((priority_dispatched + 1))
              fi
            done
          fi

          normal_target_useful=$((MAINTENANCE_MAX_LANES + priority_target + neuronal_reserved))
          test "$normal_target_useful" -eq "$USEFUL_POOL"
          test $((normal_target_useful + CONTROL_RESERVE)) -eq "$ENTERPRISE_CAP"
          echo "capacity_mode=$capacity_mode" >> "$GITHUB_STEP_SUMMARY"
          echo "critical_queued_count=$critical_queued_count" >> "$GITHUB_STEP_SUMMARY"
          echo "critical_control_pressure=$critical_pressure" >> "$GITHUB_STEP_SUMMARY"
          echo "cancelled_background_queue_runs=$cancelled_background_queue_runs" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_physical_active=$neuronal_physical_active" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_reserved=$neuronal_reserved" >> "$GITHUB_STEP_SUMMARY"
          echo "neuronal_unused_loaned_to_portfolio=$((NEURONAL_RESERVED_LANES - neuronal_reserved))" >> "$GITHUB_STEP_SUMMARY"
          echo "maintenance_max_lanes=$MAINTENANCE_MAX_LANES" >> "$GITHUB_STEP_SUMMARY"
          echo "maintenance_present_before=$maint_count" >> "$GITHUB_STEP_SUMMARY"
          echo "maintenance_dispatched=$maintenance_dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "priority_target=$priority_target" >> "$GITHUB_STEP_SUMMARY"
          echo "priority_dispatched=$priority_dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "cancelled_priority_loan_runs=$cancelled_loans" >> "$GITHUB_STEP_SUMMARY"
          echo "normal_target_useful=$normal_target_useful" >> "$GITHUB_STEP_SUMMARY"
          echo "useful_pool=$USEFUL_POOL" >> "$GITHUB_STEP_SUMMARY"
          echo "control_reserve=$CONTROL_RESERVE" >> "$GITHUB_STEP_SUMMARY"
          echo "enterprise_cap=$ENTERPRISE_CAP" >> "$GITHUB_STEP_SUMMARY"
          echo "capacity_equation=$USEFUL_POOL+$CONTROL_RESERVE=$ENTERPRISE_CAP" >> "$GITHUB_STEP_SUMMARY"
          echo "priority_order=CRITICAL_GATES > P0_JARVIS_OPERATIVA_KNOWLEDGE > P1_BROWSER_ACTUATION > P2_FACTORIES > P3_BUSINESS" >> "$GITHUB_STEP_SUMMARY"
          echo "maintenance_68_is_ceiling_not_reserved_quota=true" >> "$GITHUB_STEP_SUMMARY"
          echo "in_progress_background_cancelled=false" >> "$GITHUB_STEP_SUMMARY"
          echo "physical_neuronal_accounting=true" >> "$GITHUB_STEP_SUMMARY"
          echo "paid_ai=false" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"
      - name: Self-rearm global capacity controller
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$CEREBRO_SUPERVISOR_ENV" = PREPROD
          test "$CEREBRO_ALLOW_PAID_FANOUT" = NO
          test "$CEREBRO_PROD_WRITE" = false
          test "$CEREBRO_TRADING_ACCESS" = false
          gh api --method POST "/repos/${GH_REPO}/actions/workflows/cerebro-continuous-work-factory-v0.yml/dispatches" -f ref=main
          echo "controller_self_rearmed=true" >> "$GITHUB_STEP_SUMMARY"
          echo "controller_ref=main" >> "$GITHUB_STEP_SUMMARY"
          echo "additional_cost_eur=0" >> "$GITHUB_STEP_SUMMARY"
