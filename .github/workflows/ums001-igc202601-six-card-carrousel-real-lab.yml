name: UMS001 IGC202601 6-slide real carousel from QA green cover
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'cerebro/media-studio/v2/requests/UMS001_IGC202601_AFTER_R05_FIVE_SLIDES_V1.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: ums001-igc202601-five-slides-20261111-one-shot
  cancel-in-progress: false
jobs:
  real-carousel:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'cerebro/ums-replicate-flux-paid-lab-v0-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install free deterministic compositor dependencies before spending
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Retrieve QA-vetted R05 cover original from same-repository prior LAB run
        uses: actions/download-artifact@v4
        with:
          name: ums001-igc202601-flux-redux-r05
          run-id: 43001216700
          repository: carlosjmunoz78/fenix-capital-inmo-map
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ums001-igc202601-cover
      - name: Validate five-image request, original cover, brand SHA and required files
        run: |
          python3 -m py_compile cerebro/media-studio/v2/runtime/ums001_igc202601_five_slides_from_green_cover_v1.py
          python3 -m py_compile cerebro/media-studio/v2/runtime/ums001_igc202601_brand_carousel_compositor_v1.py
          python3 - <<'PY'
          import importlib.util,json,hashlib,os
          from pathlib import Path
          p=Path('cerebro/media-studio/v2/runtime/ums001_igc202601_five_slides_from_green_cover_v1.py')
          s=importlib.util.spec_from_file_location('ums_batch',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          order=json.loads(m.ORDER.read_text());ref=json.loads(m.REF.read_text())
          prompts,ref64=m.validate(order,ref)
          assert len(prompts)==5 and order['max_cost_usd']==0.30
          assert m.COVER_PATH.is_file() and hashlib.sha256(m.COVER_PATH.read_bytes()).hexdigest()==m.COVER_SHA
          q=Path('cerebro/media-studio/v2/runtime/ums001_igc202601_brand_carousel_compositor_v1.py')
          a=importlib.util.spec_from_file_location('ums_comp',q);c=importlib.util.module_from_spec(a);a.loader.exec_module(c)
          logo,sha=c.load_logo();assert len(c.SLIDES)==6
          print('UMS001_COVER_AND_5_PROMPTS_AND_ORIGINAL_BRAND_SHA_GREEN')
          PY
      - name: CEREBRO Productora generates 5 remaining original images using Replicate API
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GH_TOKEN_FOR_LAB: ${{ secrets.GITHUB_TOKEN }}
          UMS001_IGC202601_FIVE_PREPAID_GATE: OWNER_APPROVED_PREPAID_20261111
        run: python3 cerebro/media-studio/v2/runtime/ums001_igc202601_five_slides_from_green_cover_v1.py
      - name: Deterministically add real official Fénix logo and Spanish carrousel copy
        run: >-
          python3 cerebro/media-studio/v2/runtime/ums001_igc202601_brand_carousel_compositor_v1.py
          "${{ runner.temp }}/ums001-igc202601-five"
          "${{ runner.temp }}/ums001-igc202601-final"
          337ab92430498151d315e13044547395c7b710e9db986adb3d9630c8b6fb0e94
      - name: Preserve source images and prediction audit (no auto publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ums001-igc202601-six-replicate-originals
          path: ${{ runner.temp }}/ums001-igc202601-five/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve 6 composited cards with original logos and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ums001-igc202601-six-finished-lab-carousel
          path: ${{ runner.temp }}/ums001-igc202601-final/
          retention-days: 7
          if-no-files-found: warn
      - name: Cost and publish receipt
        if: always()
        run: |
          echo 'Max new predictions 5 x $0.06 = $0.30 existing prepaid credit.'
          echo 'R05 existing approved preview used, NOT regenerated.'
          echo 'Brand from unmodified Mr Bogart official PNG, SHA-256 verified.'
          echo 'No network posting, no social service mutation, no PROD.'
