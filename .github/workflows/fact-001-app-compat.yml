name: FACT-001 App Compatibility

on:
  push:
    branches:
      - cerebro/fact-001-factory-v0
    paths:
      - 'cerebro/factory/**'
      - '.github/workflows/fact-001-*.yml'
  pull_request:
    branches:
      - preprod-app-phase1
    paths:
      - 'cerebro/factory/**'
      - '.github/workflows/fact-001-*.yml'

permissions:
  contents: read

concurrency:
  group: fact-001-app-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Build PREPROD compatibility contract
        env:
          VITE_FUNCTION_SUFFIX: '-test'
        run: npm run build
      - name: Assert Factory remains additive
        shell: bash
        run: |
          set -euo pipefail
          test -d cerebro/factory
          test -d cerebro/runtime
          test -f cerebro/factory/governance/old-vs-new-fact-001.json
          python cerebro/factory/scripts/validate_manifest.py

# FINOPS:
# Full Playwright browser QA is intentionally NOT run on every FACT/runtime PR.
# Standalone cerebro/runtime Python/contracts/deploy changes are validated by
# FACT-001 Factory V0 and specialized/manual release gates; they do not affect
# the React/Vite app bundle and therefore no longer trigger this Node build.
# It remains available in the manual PRE-PROD App Build workflow and release gates.
# This preserves the existing browser suite while preventing repeated live PREPROD
# Edge Function traffic and GitHub Actions minutes for additive runtime/doc changes.
