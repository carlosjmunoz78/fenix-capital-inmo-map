name: CEREBRO JOB-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-evt001-event-governance-v0-20260911']
    paths:
      - 'cerebro/platform/job-governance-engine.mjs'
      - 'cerebro/tests/job-governance-engine.test.mjs'
      - '.github/workflows/cerebro-job001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/job-governance-engine.test.mjs
