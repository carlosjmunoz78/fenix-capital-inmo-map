name: JARVIS B6 PostgreSQL 17 Durable Journal LAB
on:
  pull_request:
    paths:
      - 'zeus/jarvis/gates/b6-pg17-idempotency-journal-*'
      - 'zeus/jarvis/gates/b6-sandbox-mutation-rollback-lab.mjs'
      - '.github/workflows/jarvis-b6-pg17-journal-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-claim-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jarvis_lab
          POSTGRES_PASSWORD: ephemeral_jarvis_b6_ci_only
          POSTGRES_DB: jarvis_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_lab -d jarvis_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: jarvis_lab
      PGPASSWORD: ephemeral_jarvis_b6_ci_only
      PGDATABASE: jarvis_lab
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 CLI availability
        run: command -v pg_restore >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Test durable claim concurrency and only synthetic rollback
        run: bash zeus/jarvis/gates/b6-pg17-idempotency-journal-lab.sh
      - name: Prove real temporary file mutation plus exact backup rollback
        run: node zeus/jarvis/gates/b6-sandbox-mutation-rollback-lab.mjs
