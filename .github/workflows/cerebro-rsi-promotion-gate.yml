name: CEREBRO RSI Promotion Gate
on:
  pull_request:
    paths:
      - 'cerebro/runtime/promotion-pipeline.mjs'
      - 'cerebro/tests/promotion-pipeline.test.mjs'
      - '.github/workflows/cerebro-rsi-promotion-gate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  block-g-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node --test cerebro/tests/promotion-pipeline.test.mjs
