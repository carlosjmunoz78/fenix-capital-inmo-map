name: CEREBRO Skill PROD Operational Fast Lane V1

on:
  workflow_run:
    workflows:
      - CEREBRO Dynamic Skill Adoption V1
    types:
      - completed
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cerebro/skill-prod-operational-fastlane-*'
    paths:
      - 'cerebro/runtime/skill-prod-capability-fastlane-v1.mjs'
      - 'cerebro/runtime/skill-prod-operational-fastlane-v1.mjs'
      - 'cerebro/registry/skill-dynamic-adoption-v1.json'
      - 'cerebro/tests/skill-prod-capability-fastlane-v1.test.mjs'
      - 'cerebro/tests/skill-prod-operational-fastlane-v1.test.mjs'
      - '.github/workflows/cerebro-skill-prod-operational-fastlane-v1.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-skill-prod-operational-fastlane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove-prod-operational-capabilities:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate read-only and operational fast lanes
        run: node --test cerebro/tests/skill-prod-capability-fastlane-v1.test.mjs cerebro/tests/skill-prod-operational-fastlane-v1.test.mjs
      - name: Build governed PROD operational capability set
        run: node cerebro/runtime/skill-prod-operational-fastlane-v1.mjs --output "$RUNNER_TEMP/cerebro-prod-operational-fastlane.json"
      - name: Assert operational throughput and fail-closed authority
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cerebro-prod-operational-fastlane.json','utf8'));
          if(r.status!=='GREEN_PROD_OPERATIONAL_INTERNAL_CAPABILITY_SET') throw new Error(`OPERATIONAL_SET_NOT_GREEN:${r.status}`);
          if(Number(r.available_count)<1) throw new Error('NO_OPERATIONAL_CAPABILITIES');
          for(const row of r.available??[]){
            const a=row.authority??{};
            if(row.status!=='PROD_CAPABILITY_AVAILABLE_OPERATIONAL') throw new Error(`NON_OPERATIONAL_STATUS:${row.candidate_id}`);
            if(a.direct_prod_write_authorized!==false||a.direct_prod_mutation_authorized!==false||a.external_side_effects_authorized!==false||a.external_skill_code_execution!==false||a.trading_access!==false||a.spend_authorized!==false||Number(a.additional_cost_eur)!==0) throw new Error(`AUTHORITY_EXPANSION:${row.candidate_id}`);
          }
          console.log(JSON.stringify({status:r.status,available_count:r.available_count,dynamic_available_count:r.dynamic_available_count,direct_prod_write_authorized:false,external_side_effects_authorized:false,trading_access:false,additional_cost_eur:0}));
          NODE
      - name: Upload immutable PROD operational evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-prod-operational-fastlane-${{ github.run_id }}
          path: ${{ runner.temp }}/cerebro-prod-operational-fastlane.json
          if-no-files-found: error
          retention-days: 30
