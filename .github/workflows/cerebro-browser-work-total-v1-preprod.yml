name: CEREBRO Browser Work Total V1 PREPROD

on:
  push:
    branches: ['preprod/browser-autologin-universal-v1-20261026']
    paths:
      - '.github/workflows/cerebro-browser-work-total-v1-preprod.yml'
      - 'scripts/patch-browser-autologin-core-v2.mjs'
      - 'scripts/patch-browser-autologin-ownerless-v1.mjs'
      - 'scripts/patch-browser-autologin-universal-v1.mjs'
      - 'scripts/patch-browser-autologin-google-state-machine-v1.mjs'
      - 'scripts/patch-browser-autologin-preprod-fixture-v1.mjs'
      - 'scripts/patch-browser-autologin-contract-v1.mjs'
      - 'cerebro/runtime/autologin-canary-server.mjs'
      - 'cerebro/runtime/browser-interactive-session-v3.mjs'
      - 'cerebro/runtime/browser-job-runner-v2.mjs'
      - 'cerebro/runtime/browser-work-total-autologin-v1.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cerebro-browser-autologin-universal-physical-preprod
  cancel-in-progress: true

env:
  CEREBRO_BROWSER_DISPATCH_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-browser-work-total-dispatch-v1-preprod
  CEREBRO_BROWSER_INTERACTIVE_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-browser-work-total-worker-v1-preprod
  CEREBRO_BROWSER_WORKSPACE_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-browser-work-total-workspace-canary-v1-preprod
  CEREBRO_BROWSER_AUTOLOGIN_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-browser-work-total-autologin-v1-preprod
  CEREBRO_BROWSER_OIDC_AUDIENCE: cerebro-browser-worker-v1
  CEREBRO_BROWSER_STAGE_CONCURRENCY: '1'
  CEREBRO_BROWSER_WORKER_SLOT: '1'
  CEREBRO_BROWSER_PHASE2_SEED_CANARY: 'false'
  CEREBRO_BROWSER_INTERACTIVE_MAX_MS: '180000'
  CEREBRO_BROWSER_INTERACTIVE_FRAME_MS: '1400'
  CEREBRO_BROWSER_INTERACTIVE_IDLE_FRAME_MS: '1400'
  CEREBRO_BROWSER_INTERACTIVE_POLL_MS: '35'
  CEREBRO_BROWSER_INTERACTIVE_ACTIVE_WINDOW_MS: '3000'

jobs:
  validate:
    name: Validate autonomous login physical canary build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/patch-browser-autologin-core-v2.mjs
      - run: node scripts/patch-browser-autologin-ownerless-v1.mjs
      - run: node scripts/patch-browser-autologin-universal-v1.mjs
      - run: node scripts/patch-browser-autologin-google-state-machine-v1.mjs
      - run: node scripts/patch-browser-autologin-preprod-fixture-v1.mjs
      - run: node scripts/patch-browser-autologin-contract-v1.mjs
      - run: node --test cerebro/runtime/browser-work-total-autologin-v1.test.mjs
      - run: node --test cerebro/runtime/browser-session-bundle-v1.test.mjs
      - run: node --check scripts/patch-browser-autologin-core-v2.mjs
      - run: node --check scripts/patch-browser-autologin-google-state-machine-v1.mjs
      - run: node --check cerebro/runtime/browser-interactive-session-v3.mjs
      - run: node --check cerebro/runtime/browser-job-runner-v2.mjs
      - run: node --check cerebro/runtime/autologin-canary-server.mjs

  watch:
    name: Watch isolated PREPROD autologin canary queue
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      pending: ${{ steps.watch.outputs.pending }}
    steps:
      - id: watch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const endpoint=process.env.CEREBRO_BROWSER_DISPATCH_URL;
          const deadline=Date.now()+6*60_000;
          async function oidc(){const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);u.searchParams.set('audience',process.env.CEREBRO_BROWSER_OIDC_AUDIENCE);const r=await fetch(u,{headers:{authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},redirect:'error'});if(!r.ok)throw new Error(`OIDC_TOKEN_FAILED:${r.status}`);return (await r.json()).value;}
          let pending=0;
          while(Date.now()<deadline){const token=await oidc();const r=await fetch(`${endpoint}/status-v2`,{method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:'{}',redirect:'error'});const body=await r.json().catch(()=>null);if(!r.ok||body?.ok!==true)throw new Error(`STATUS_FAILED:${r.status}:${body?.error||'UNKNOWN'}`);const s=body.states||{};pending=Number(s.QUEUED||0)+Number(s.RETRY_WAIT||0);if(pending>0)break;await new Promise(x=>setTimeout(x,3000));}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`pending=${pending}\n`);console.log(JSON.stringify({pending,environment:'PREPROD',autologin_canary:true,prod_execution:false,secret_material_logged:false}));
          NODE

  work-total-worker:
    name: Execute isolated universal autologin PREPROD canary
    needs: watch
    if: needs.watch.outputs.pending != '0'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/patch-browser-autologin-core-v2.mjs
      - run: node scripts/patch-browser-autologin-ownerless-v1.mjs
      - run: node scripts/patch-browser-autologin-universal-v1.mjs
      - run: node scripts/patch-browser-autologin-google-state-machine-v1.mjs
      - run: node scripts/patch-browser-autologin-preprod-fixture-v1.mjs
      - run: node scripts/patch-browser-autologin-contract-v1.mjs
      - name: Start isolated local login fixture
        run: |
          node cerebro/runtime/autologin-canary-server.mjs > /tmp/cerebro-autologin-canary.log 2>&1 &
          echo $! > /tmp/cerebro-autologin-canary.pid
          node --input-type=module <<'NODE'
          let last='NOT_READY';
          for(let i=0;i<30;i++){
            try{
              const r=await fetch('http://127.0.0.1:8787/health');
              const j=await r.json();
              if(r.ok&&j.ok===true&&j.secrets===false){console.log(JSON.stringify(j));process.exit(0);}
              last=`BAD_HEALTH:${r.status}`;
            }catch(e){last=String(e?.message||e);}
            await new Promise(resolve=>setTimeout(resolve,250));
          }
          console.error(last);process.exit(1);
          NODE
      - name: Execute exactly one isolated PREPROD canary job
        run: node cerebro/runtime/browser-job-runner-v2.mjs

# Physical rerun: synthetic PREPROD canary is created with the same session precondition as owner/start.
