name: TEMP CEREBRO Canary v25 Transport Gate

on:
  push:
    branches:
      - fix/cerebro-social-context-safety-voice-20261001

permissions:
  contents: read

jobs:
  safe-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_URL: https://cluhljgonannaafpmblx.supabase.co
      PROD_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Require publishable browser key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_PUBLISHABLE_KEY"

      - name: Canary fails closed without owner token
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/anon.json --write-out '%{http_code}' --max-time 20             -H "apikey: $PROD_PUBLISHABLE_KEY"             "$PROD_URL/functions/v1/cerebro-console-gateway-v0-canary-v25/health")"
          echo "ANON_HTTP_STATUS=$code"
          test "$code" = "401" || test "$code" = "403"
          ! grep -Eq '"status":"ok"|"chat_available":true' /tmp/anon.json

      - name: OLD vs NEW transport and CORS parity
        shell: bash
        run: |
          set -euo pipefail
          old_headers="$(mktemp)"
          new_headers="$(mktemp)"
          old_code="$(curl --silent --show-error --output /dev/null --dump-header "$old_headers" --write-out '%{http_code}' --max-time 20             -X OPTIONS             -H 'Origin: https://app.fenixcapital.es'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: authorization,apikey,content-type'             "$PROD_URL/functions/v1/cerebro-console-gateway-v0/chat")"
          new_code="$(curl --silent --show-error --output /dev/null --dump-header "$new_headers" --write-out '%{http_code}' --max-time 20             -X OPTIONS             -H 'Origin: https://app.fenixcapital.es'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: authorization,apikey,content-type'             "$PROD_URL/functions/v1/cerebro-console-gateway-v0-canary-v25/chat")"
          old_origin="$(awk -F': ' 'tolower($1)=="access-control-allow-origin"{gsub("\\r","",$2);print $2}' "$old_headers" | tail -1)"
          new_origin="$(awk -F': ' 'tolower($1)=="access-control-allow-origin"{gsub("\\r","",$2);print $2}' "$new_headers" | tail -1)"
          echo "OLD_CORS_STATUS=$old_code ORIGIN=$old_origin"
          echo "NEW_CORS_STATUS=$new_code ORIGIN=$new_origin"
          test "$old_code" = "204"
          test "$new_code" = "$old_code"
          test "$new_origin" = "$old_origin"

          old_bad="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20             -X OPTIONS -H 'Origin: https://evil.invalid'             "$PROD_URL/functions/v1/cerebro-console-gateway-v0/chat")"
          new_bad="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20             -X OPTIONS -H 'Origin: https://evil.invalid'             "$PROD_URL/functions/v1/cerebro-console-gateway-v0-canary-v25/chat")"
          echo "OLD_BAD_ORIGIN_STATUS=$old_bad"
          echo "NEW_BAD_ORIGIN_STATUS=$new_bad"
          test "$new_bad" = "$old_bad"
