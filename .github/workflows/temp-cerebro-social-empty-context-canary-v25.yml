name: TEMP CEREBRO Canary v25 Transport Gate

on:
  push:
    branches:
      - fix/cerebro-social-context-safety-voice-20261001

permissions:
  contents: read

jobs:
  safe-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_URL: https://cluhljgonannaafpmblx.supabase.co
      PROD_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Require publishable browser key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_PUBLISHABLE_KEY"

      - name: Canary fails closed without owner token
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/anon.json --write-out '%{http_code}' --max-time 20             -H "apikey: $PROD_PUBLISHABLE_KEY"             "$PROD_URL/functions/v1/cerebro-console-gateway-v0-canary-v25/health")"
          test "$code" = "403"
          grep -F '"reason":"OWNER_ONLY"' /tmp/anon.json >/dev/null

      - name: Canary CORS preflight allows only canonical app origin
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          code="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 20             -X OPTIONS             -H 'Origin: https://app.fenixcapital.es'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: authorization,apikey,content-type'             "$PROD_URL/functions/v1/cerebro-console-gateway-v0-canary-v25/chat")"
          test "$code" = "204"
          grep -qi '^access-control-allow-origin: https://app.fenixcapital.es' "$headers"
          bad="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20             -X OPTIONS -H 'Origin: https://evil.invalid'             "$PROD_URL/functions/v1/cerebro-console-gateway-v0-canary-v25/chat")"
          test "$bad" = "403"
