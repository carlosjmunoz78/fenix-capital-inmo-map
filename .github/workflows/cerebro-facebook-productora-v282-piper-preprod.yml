name: CEREBRO Facebook → Productora V2.8.3 Spain Voices PREPROD

on:
  push:
    branches: ['cerebro/creative-v28-different-preprod-2026-10-25']
    paths:
      - '.github/workflows/cerebro-facebook-productora-v282-piper-preprod.yml'
      - 'cerebro/runtime/facebook-video-department-v2.mjs'
      - 'cerebro/runtime/creative-facebook-productora-v28.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIPER_RELEASE: '2023.11.14-2'
  PIPER_VOICE_REV: 'b145f2ac26522d6a2ccde0164b7b0e48b1e3199c'

jobs:
  facebook-productora-spain-voices:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install media runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core
          node --check cerebro/runtime/facebook-video-department-v2.mjs
          node --check cerebro/runtime/creative-facebook-productora-v28.mjs

      - name: Facebook decides campaigns; Productora routes technical Spain voices
        run: |
          set -euo pipefail
          mkdir -p /tmp/cerebro-fb-v283/audio
          node cerebro/runtime/facebook-video-department-v2.mjs /tmp/cerebro-fb-v283/facebook-brief-source.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src='/tmp/cerebro-fb-v283/facebook-brief-source.json';
          const b=JSON.parse(fs.readFileSync(src,'utf8'));
          if(!Object.values(b.gates).every(Boolean)||b.campaigns.length!==3)throw new Error('FACEBOOK_DIRECTOR_RED');
          const map={
            'FB-FIN-25-30-FIRST-HOME':{id:'ES_ES_DAVEFX',engine:'PIPER_ES_ES_DAVEFX',locale:'es-ES',delivery:'ENERGETIC_CONVERSATIONAL',technical_owner:'PRODUCTORA'},
            'FB-FIN-35-45-FAMILY-MOVE':{id:'ES_ES_SHARVARD_F',engine:'PIPER_ES_ES_SHARVARD',speaker:'F',speaker_id:1,locale:'es-ES',delivery:'WARM_REASSURING',technical_owner:'PRODUCTORA'},
            'FB-FIN-45-55-REFINANCE':{id:'ES_ES_SHARVARD_M',engine:'PIPER_ES_ES_SHARVARD',speaker:'M',speaker_id:0,locale:'es-ES',delivery:'CALM_AUTHORITATIVE',technical_owner:'PRODUCTORA'},
          };
          for(const c of b.campaigns){
            c.facebook_voice_brief={delivery:c.voice.delivery,locale:'es-ES'};
            c.voice=map[c.id];
            if(!c.voice)throw new Error(`VOICE_ROUTE:${c.id}`);
          }
          b.voice_routing='FACEBOOK_DEFINES_VOICE_ROLE_PRODUCTORA_SELECTS_TECHNICAL_VOICE';
          fs.writeFileSync('/tmp/cerebro-fb-v283/facebook-brief.json',JSON.stringify(b,null,2));
          console.log('FACEBOOK_TO_PRODUCTORA_VOICE_ROUTING_GREEN');
          NODE

      - name: Materialize three pinned Spain-Spanish physical voice identities
        run: |
          set -euo pipefail
          mkdir -p /tmp/cerebro-piper/sharvard /tmp/cerebro-piper/davefx
          curl --fail --location --silent --show-error "https://github.com/rhasspy/piper/releases/download/${PIPER_RELEASE}/piper_linux_x86_64.tar.gz" -o /tmp/cerebro-piper/piper.tar.gz
          tar -xzf /tmp/cerebro-piper/piper.tar.gz -C /tmp/cerebro-piper
          PIPER=/tmp/cerebro-piper/piper/piper
          chmod +x "$PIPER"
          base="https://huggingface.co/rhasspy/piper-voices/resolve/${PIPER_VOICE_REV}/es/es_ES"
          curl --fail --location --silent --show-error "$base/sharvard/medium/es_ES-sharvard-medium.onnx" -o /tmp/cerebro-piper/sharvard/model.onnx
          curl --fail --location --silent --show-error "$base/sharvard/medium/es_ES-sharvard-medium.onnx.json" -o /tmp/cerebro-piper/sharvard/model.onnx.json
          curl --fail --location --silent --show-error "$base/davefx/medium/es_ES-davefx-medium.onnx" -o /tmp/cerebro-piper/davefx/model.onnx
          curl --fail --location --silent --show-error "$base/davefx/medium/es_ES-davefx-medium.onnx.json" -o /tmp/cerebro-piper/davefx/model.onnx.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/cerebro-piper/sharvard/model.onnx.json'));d=json.load(open('/tmp/cerebro-piper/davefx/model.onnx.json'))
          assert s['language']['code']=='es_ES' and s['num_speakers']==2 and s['speaker_id_map']=={'M':0,'F':1}
          assert d['language']['code']=='es_ES' and d['num_speakers']==1
          print('THREE_PINNED_ES_ES_IDENTITIES_AVAILABLE')
          PY

      - name: Generate three targets × three formats with natural target-specific pacing
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,pathlib
          b=json.load(open('/tmp/cerebro-fb-v283/facebook-brief.json',encoding='utf-8'))
          piper='/tmp/cerebro-piper/piper/piper'
          routes={
            'ES_ES_DAVEFX':('/tmp/cerebro-piper/davefx/model.onnx',None,'1.08','0.13'),
            'ES_ES_SHARVARD_F':('/tmp/cerebro-piper/sharvard/model.onnx','1','1.04','0.15'),
            'ES_ES_SHARVARD_M':('/tmp/cerebro-piper/sharvard/model.onnx','0','1.02','0.17'),
          }
          for c in b['campaigns']:
            model,speaker,scale,silence=routes[c['voice']['id']]
            for fmt in ('story','reel','long'):
              out=f"/tmp/cerebro-fb-v283/audio/{c['id'].lower()}-{fmt}.wav"
              cmd=[piper,'--model',model,'--config',model+'.json','--length_scale',scale,'--sentence_silence',silence,'--output_file',out]
              if speaker is not None:cmd += ['--speaker',speaker]
              subprocess.run(cmd,input=c['formats'][fmt]['text'].encode('utf-8'),check=True)
              assert pathlib.Path(out).stat().st_size>10000
          print('NINE_ES_ES_AUDIO_FILES_GENERATED')
          PY

      - name: Voice duration tribunal
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,subprocess,os,json
          rows=[]
          for f in sorted(glob.glob('/tmp/cerebro-fb-v283/audio/*.wav')):
            d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nk=1:nw=1',f]))
            fmt='story' if '-story.wav' in f else 'reel' if '-reel.wav' in f else 'long'
            if fmt=='story' and not 13<=d<=26.4: raise SystemExit(f'STORY_VOICE_RED:{os.path.basename(f)}:{d}')
            if fmt=='reel' and not 46<=d<=57.5: raise SystemExit(f'REEL_VOICE_RED:{os.path.basename(f)}:{d}')
            if fmt=='long' and d<177: raise SystemExit(f'LONG_VOICE_RED:{os.path.basename(f)}:{d}')
            rows.append({'file':os.path.basename(f),'format':fmt,'duration_sec':round(d,3)})
          assert len(rows)==9
          json.dump({'locale':'es-ES','physical_voice_identities':['DAVEFX','SHARVARD_F','SHARVARD_M'],'items':rows},open('/tmp/cerebro-fb-v283/voice-manifest.json','w'),indent=2)
          print(json.dumps(rows))
          PY

      - name: Materialize governed visuals and distinct CC0 music
        run: |
          set -euo pipefail
          mkdir -p /tmp/cerebro-fb-v283/assets /tmp/cerebro-fb-v283/music
          for id in 8293019 3944018 30353173 6780089 4307346 7581281 31568471 3769951 9056542 27860328 6187216 7821811 5466764; do
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors "https://www.pexels.com/download/video/${id}/" -o "/tmp/cerebro-fb-v283/assets/${id}.mp4"
            test "$(stat -c%s /tmp/cerebro-fb-v283/assets/${id}.mp4)" -gt 100000
          done
          root=https://raw.githubusercontent.com/cwilliams5/matrix-music-visualizer/main/music
          curl -fsSL "$root/02-kevin-macleod-blippy-trance.mp3" -o /tmp/cerebro-fb-v283/music/02-kevin-macleod-blippy-trance.mp3
          curl -fsSL "$root/01-bryan-teoh-starcourt-mall.mp3" -o /tmp/cerebro-fb-v283/music/01-bryan-teoh-starcourt-mall.mp3
          curl -fsSL "$root/05-kevin-macleod-bass-meant-jazz.mp3" -o /tmp/cerebro-fb-v283/music/05-kevin-macleod-bass-meant-jazz.mp3

      - name: Productora renders nine physical Facebook pieces
        run: |
          set -euo pipefail
          mkdir -p /tmp/cerebro-fb-v283/out
          node cerebro/runtime/creative-facebook-productora-v28.mjs /tmp/cerebro-fb-v283/facebook-brief.json /tmp/cerebro-fb-v283/audio /tmp/cerebro-fb-v283/assets /tmp/cerebro-fb-v283/music /tmp/cerebro-fb-v283/out | tee /tmp/cerebro-fb-v283/render.json
          grep -F '"ok":true' /tmp/cerebro-fb-v283/render.json

      - name: Physical diversity tribunal
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r='/tmp/cerebro-fb-v283/out';const m=JSON.parse(fs.readFileSync(`${r}/FACEBOOK_PRODUCTORA_V28_MANIFEST.json`));
          if(!Object.values(m.gates).every(Boolean)||m.productions.length!==9)throw new Error('PRODUCTORA_GATES');
          const reels=m.productions.filter(x=>x.format==='reel'),longs=m.productions.filter(x=>x.format==='long'),stories=m.productions.filter(x=>x.format==='story');
          if(reels.length!==3||reels.some(x=>x.duration_sec<48||x.duration_sec>=60))throw new Error('REELS');
          if(longs.length!==3||longs.some(x=>x.duration_sec<180))throw new Error('LONGS');
          if(stories.length!==3||stories.some(x=>x.duration_sec<15||x.duration_sec>28))throw new Error('STORIES');
          for(const key of ['voice','visual','camera','lighting','transition','music','concept','hook','cta']){
            const vals=m.productions.map(p=>key==='voice'?p.voice.id:key==='visual'?p.visual_profile.id:key==='music'?p.music.id:key==='concept'?p.concept:key==='hook'?p.hook:key==='cta'?p.cta:p.visual_profile[key]);
            if(new Set(vals).size!==3)throw new Error(`DIVERSITY_${key}`);
          }
          if(m.environment!=='PREPROD'||m.publish_authorized!==false||m.promotion_eligible!==false||m.additional_recurring_cost_eur!==0)throw new Error('GOVERNANCE');
          console.log('PRODUCTORA_V283_NINE_PHYSICAL_PIECES_GREEN_HUMAN_TRIBUNAL_PENDING');
          NODE

      - name: Produce review evidence
        run: |
          set -euo pipefail
          mkdir -p /tmp/cerebro-fb-v283/out/review-frames
          for f in /tmp/cerebro-fb-v283/out/*.mp4; do
            base="$(basename "$f" .mp4)";dur="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$f")"
            ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height,sample_rate,channels -of json "$f" > "/tmp/cerebro-fb-v283/out/${base}-probe.json"
            if awk "BEGIN {exit !($dur >= 180)}"; then fps='1/12'; else fps='1/4'; fi
            ffmpeg -hide_banner -loglevel error -i "$f" -vf "fps=${fps},scale=300:-2,tile=4x4:padding=3:margin=3" -frames:v 1 -q:v 3 -y "/tmp/cerebro-fb-v283/out/review-frames/${base}-contact-sheet.jpg"
          done
          cp /tmp/cerebro-fb-v283/facebook-brief-source.json /tmp/cerebro-fb-v283/out/FACEBOOK_DIRECTOR_SOURCE_BRIEF.json
          cp /tmp/cerebro-fb-v283/facebook-brief.json /tmp/cerebro-fb-v283/out/PRODUCTORA_ROUTED_BRIEF.json
          cp /tmp/cerebro-fb-v283/voice-manifest.json /tmp/cerebro-fb-v283/out/VOICE_MANIFEST.json
          sha256sum /tmp/cerebro-fb-v283/out/*.mp4 /tmp/cerebro-fb-v283/out/*.json > /tmp/cerebro-fb-v283/out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-facebook-productora-v283-${{ github.sha }}
          path: /tmp/cerebro-fb-v283/out
          retention-days: 7
