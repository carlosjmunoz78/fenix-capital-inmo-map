name: CEREBRO AUTO-001 PREPROD Patch Executor V0

on:
  pull_request:
    paths:
      - 'cerebro/platform/auto001-preprod-patch-planner-v0.mjs'
      - 'cerebro/platform/incident-root-cause-escalator-v0.mjs'
      - 'cerebro/platform/patch-transforms/**'
      - 'cerebro/qa/auto001-repair-validator-v0.mjs'
      - 'cerebro/governance/auto001-repair-tribunal-v0.mjs'
      - 'cerebro/governance/qa-promotion-readiness-v0.mjs'
      - 'cerebro/governance/governed-promotion-executor-v1.mjs'
      - 'cerebro/registry/rsi-domain-autonomy-policies.v0.json'
      - 'cerebro/registry/prod-promotion-policy-overrides.v1.json'
      - 'cerebro/tests/incident-root-cause-escalator-v0.test.mjs'
      - 'cerebro/tests/auto001-preprod-patch-executor-v0.test.mjs'
      - 'cerebro/tests/auto001-repair-validation-v0.test.mjs'
      - 'cerebro/tests/qa-promotion-readiness-v0.test.mjs'
      - 'cerebro/tests/governed-promotion-executor-v1.test.mjs'
      - '.github/workflows/cerebro-auto001-preprod-patch-executor-v0.yml'
      - '.github/workflows/cerebro-auto001-prod-closure-v1.yml'
      - '.github/workflows/cerebro-governed-promotion-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/platform/incident-root-cause-escalator-v0.mjs'
      - 'cerebro/tests/incident-root-cause-escalator-v0.test.mjs'
      - '.github/workflows/cerebro-auto001-preprod-patch-executor-v0.yml'
  workflow_run:
    workflows: ['CEREBRO QA Source Mapping V0']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cerebro-qa-control-state-writer-v0
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  QA_STATE_BRANCH: cerebro/qa-state-v0
  QA_SOURCE_MAP_PATH: cerebro/runtime/qa-source-mapping.v0.json
  AUTO_REPAIR_STATE_PATH: cerebro/runtime/auto001-repair-autonomy-state.v0.json

jobs:
  anti-loop-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove repeated-failure escalation and repair envelope
        run: node --test cerebro/tests/incident-root-cause-escalator-v0.test.mjs
      - name: Prove canonical edgesOut incident escalates to repair instead of retry loop
        run: |
          node --input-type=module <<'NODE'
          import {decideIncidentAction} from './cerebro/platform/incident-root-cause-escalator-v0.mjs';
          const f={workflow:'CEREBRO Skill AutoLoop Safe Handler V0',job:'safe-handler',step:'Install pinned zero-cost OSS inference runtime without install scripts',error:"Cannot read properties of null (reading 'edgesOut')",environment:'PREPROD'};
          const repair={bounded:true,reversible:true,preprod_only:true,tests_defined:true,rollback_defined:true,additional_cost_eur:0,prod_write:false,permission_expansion:false,gate_relaxation:false};
          const d=decideIncidentAction({current:f,history:[f],proposedRepair:repair});
          if(d.state!=='ROOT_CAUSE_REPAIR_READY'||d.retry_authorized!==false||d.repair_authorized!==true||d.prod_authorized!==false) throw new Error(JSON.stringify(d));
          console.log(JSON.stringify(d));
          NODE

  executor:
    if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prove AUTO-001 executor validation tribunal promotion and anti-loop contracts
        run: >-
          node --test
          cerebro/tests/incident-root-cause-escalator-v0.test.mjs
          cerebro/tests/auto001-preprod-patch-executor-v0.test.mjs
          cerebro/tests/auto001-repair-validation-v0.test.mjs
          cerebro/tests/qa-promotion-readiness-v0.test.mjs
          cerebro/tests/governed-promotion-executor-v1.test.mjs
      - name: Stop after contract proof on pull requests
        if: github.event_name == 'pull_request'
        run: echo 'PR validation only; autonomous branch mutation is disabled for PR events.'
      - name: Load verified source mapping and build bounded patch plan
        if: github.event_name != 'pull_request'
        id: plan
        run: |
          set -euo pipefail
          mkdir -p artifacts/auto001
          git fetch --no-tags --force origin "+refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH"
          git cat-file -e "refs/remotes/origin/$QA_STATE_BRANCH:$QA_SOURCE_MAP_PATH"
          git show "refs/remotes/origin/$QA_STATE_BRANCH:$QA_SOURCE_MAP_PATH" > artifacts/auto001/source-map.json
          BASE_SHA="$(git rev-parse HEAD)"
          node cerebro/platform/auto001-preprod-patch-planner-v0.mjs --input artifacts/auto001/source-map.json --base-sha "$BASE_SHA" --out artifacts/auto001/plan.json
          STATUS="$(jq -r '.status' artifacts/auto001/plan.json)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.branch_name // empty' artifacts/auto001/plan.json)" >> "$GITHUB_OUTPUT"
          jq '{status,plan_id,owner_engine,target,dimension,transform_id,allowed_files,max_files_changed,max_line_delta,branch_name,auto_merge,prod_write_authorized,rollback}' artifacts/auto001/plan.json
      - name: Apply certified transform on isolated branch
        if: github.event_name != 'pull_request' && steps.plan.outputs.status == 'PATCH_PLAN_READY'
        id: patch
        run: |
          set -euo pipefail
          PLAN='artifacts/auto001/plan.json'
          BRANCH="$(jq -r '.branch_name' "$PLAN")"
          BASE_SHA="$(jq -r '.base_sha' "$PLAN")"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo 'Existing deterministic patch branch found; no duplicate mutation.'
            echo 'existing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp src/App.tsx artifacts/auto001/base-App.tsx
          git checkout -b "$BRANCH"
          node cerebro/platform/patch-transforms/app-auth-shell-role-main-v0.mjs --file src/App.tsx --evidence artifacts/auto001/transform-evidence.json
          test "$(jq -r '.status' artifacts/auto001/transform-evidence.json)" = 'PATCH_APPLIED'
          cp src/App.tsx artifacts/auto001/candidate-App.tsx
          CHANGED="$(git diff --name-only | wc -l | tr -d ' ')"
          test "$CHANGED" -eq 1
          test "$(git diff --name-only)" = 'src/App.tsx'
          DELTA="$(git diff --numstat -- src/App.tsx | awk '{print $1+$2}')"
          test "$DELTA" -ge 1
          test "$DELTA" -le "$(jq -r '.max_line_delta' "$PLAN")"
          echo 'existing=false' >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "delta=$DELTA" >> "$GITHUB_OUTPUT"
      - name: Build and targeted-test patched App before any push
        if: github.event_name != 'pull_request' && steps.plan.outputs.status == 'PATCH_PLAN_READY' && steps.patch.outputs.existing != 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test cerebro/tests/incident-root-cause-escalator-v0.test.mjs cerebro/tests/auto001-preprod-patch-executor-v0.test.mjs cerebro/tests/auto001-repair-validation-v0.test.mjs cerebro/tests/qa-promotion-readiness-v0.test.mjs cerebro/tests/governed-promotion-executor-v1.test.mjs
      - name: Prove OLD vs NEW rebuild rollback and independent tribunal before any push
        if: github.event_name != 'pull_request' && steps.plan.outputs.status == 'PATCH_PLAN_READY' && steps.patch.outputs.existing != 'true'
        run: |
          set -euo pipefail
          BASE_SHA="$(jq -r '.base_sha' artifacts/auto001/plan.json)"
          node cerebro/qa/auto001-repair-validator-v0.mjs --base artifacts/auto001/base-App.tsx --candidate artifacts/auto001/candidate-App.tsx --base-sha "$BASE_SHA" --head-sha 'UNPUSHED_CERTIFIED_CANDIDATE' --out artifacts/auto001/validation.json
          jq -e '.status=="VALIDATION_GREEN" and .old_vs_new.old==0 and .old_vs_new.new==2 and .old_vs_new.improved==true and .regression.passed==true and .rebuild.passed==true and .rollback.passed==true and .promotion_authorized==false and .auto_merge==false' artifacts/auto001/validation.json >/dev/null
          node cerebro/governance/auto001-repair-tribunal-v0.mjs --validation artifacts/auto001/validation.json --build-green true --tests-green true --diff-files '${{ steps.patch.outputs.changed }}' --diff-line-delta '${{ steps.patch.outputs.delta }}' --out artifacts/auto001/tribunal.json
          jq -e '.status=="APPROVE_PREPROD_PATCH" and .approved==true and .authority.merge_authorized==false and .authority.promotion_authorized==false and .authority.prod_authorized==false and .authority.prod_write_authorized==false and .safety.additional_subscription_eur==0' artifacts/auto001/tribunal.json >/dev/null
      - name: Commit tribunal-approved snapshot-bound patch and attempt governed repair PR
        if: github.event_name != 'pull_request' && steps.plan.outputs.status == 'PATCH_PLAN_READY' && steps.patch.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PLAN='artifacts/auto001/plan.json'; BRANCH="$(jq -r '.branch_name' "$PLAN")"; PLAN_ID="$(jq -r '.plan_id' "$PLAN")"; BASE_SHA="$(jq -r '.base_sha' "$PLAN")"
          git config user.name 'cerebro-auto001[bot]'; git config user.email 'cerebro-auto001[bot]@users.noreply.github.com'
          git add src/App.tsx; git commit -m "fix(AUTO-001): certified HCI main landmark patch"; git push origin "HEAD:refs/heads/$BRANCH"
          PR_STATUS='ALREADY_OPEN'
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length' | grep -qx '0'; then
            set +e
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title 'AUTO-001: certified PREPROD HCI main landmark repair' --body "Automated bounded PREPROD repair from $PLAN_ID. Base snapshot: $BASE_SHA. Build, OLD vs NEW, regression, rebuild, rollback and tribunal passed. No direct PROD/customer data/Trading/cost. Governed PROD closure is handled separately." > artifacts/auto001/pr-create.stdout 2> artifacts/auto001/pr-create.stderr
            RC=$?; set -e
            if [ "$RC" -eq 0 ]; then PR_STATUS='OPENED_AUTONOMOUSLY'; elif grep -F 'GitHub Actions is not permitted to create or approve pull requests' artifacts/auto001/pr-create.stderr >/dev/null; then PR_STATUS='BLOCKED_REPOSITORY_ACTIONS_POLICY'; else cat artifacts/auto001/pr-create.stderr >&2; exit "$RC"; fi
          fi
          jq -n --arg status "$PR_STATUS" --arg branch "$BRANCH" --arg plan_id "$PLAN_ID" --arg base_sha "$BASE_SHA" '{state_type:"CEREBRO_AUTO001_PR_HANDOFF_V0",status:$status,branch:$branch,plan_id:$plan_id,base_sha:$base_sha,preprod_patch_validated:true,tribunal_approved:true,auto_merge:false,promotion_authorized:false,prod_authorized:false,prod_write_authorized:false,customer_data:false,trading_access:false,additional_cost_eur:0}' > artifacts/auto001/pr-handoff.json
      - name: Evaluate promotion readiness against current domain policy
        if: github.event_name != 'pull_request' && steps.plan.outputs.status == 'PATCH_PLAN_READY' && steps.patch.outputs.existing != 'true'
        run: |
          node cerebro/governance/qa-promotion-readiness-v0.mjs --tribunal artifacts/auto001/tribunal.json --pr-handoff artifacts/auto001/pr-handoff.json --policies cerebro/registry/rsi-domain-autonomy-policies.v0.json --prod-overrides cerebro/registry/prod-promotion-policy-overrides.v1.json --out artifacts/auto001/promotion-readiness.json
          jq -e '((.status=="AUTONOMOUS_PROMOTION_READY" and .authority.merge_authorized==true and .authority.promotion_authorized==true and .authority.prod_authorized==true and .authority.prod_write_authorized==true) or (.status=="HUMAN_REQUIRED" and .authority.merge_authorized==false and .authority.promotion_authorized==false and .authority.prod_authorized==false and .authority.prod_write_authorized==false)) and .safety.prod_write==false and .safety.additional_subscription_eur==0' artifacts/auto001/promotion-readiness.json >/dev/null
      - name: Build canonical AUTO repair autonomy state
        if: github.event_name != 'pull_request' && steps.plan.outputs.status == 'PATCH_PLAN_READY' && steps.patch.outputs.existing != 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const plan=JSON.parse(fs.readFileSync('artifacts/auto001/plan.json','utf8')), validation=JSON.parse(fs.readFileSync('artifacts/auto001/validation.json','utf8')), tribunal=JSON.parse(fs.readFileSync('artifacts/auto001/tribunal.json','utf8')), handoff=JSON.parse(fs.readFileSync('artifacts/auto001/pr-handoff.json','utf8')), readiness=JSON.parse(fs.readFileSync('artifacts/auto001/promotion-readiness.json','utf8'));
          const state={schema_version:'0.3.0',state_type:'CEREBRO_AUTO001_REPAIR_AUTONOMY_STATE_V0',company_id:'fenix',engine_id:'AUTO-001',environment:'PREPROD_CONTROL_PLANE',version:'0.3.0',updated_at:new Date().toISOString(),plan_id:plan.plan_id,branch:handoff.branch,base_sha:plan.base_sha,transform_id:plan.transform_id,owner_engine:plan.owner_engine,target:plan.target,preprod_patch_validated:validation.status==='VALIDATION_GREEN',old_vs_new:validation.old_vs_new,regression_passed:validation.regression?.passed===true,rebuild_passed:validation.rebuild?.passed===true,rollback_passed:validation.rollback?.passed===true,tribunal_approved:tribunal.approved===true,tribunal_status:tribunal.status,pr_handoff_status:handoff.status,promotion_readiness:readiness,anti_loop_root_cause_escalation:true,authority:{auto_merge:false,promotion_authorized:readiness.authority?.promotion_authorized===true,prod_authorized:readiness.authority?.prod_authorized===true,prod_write_authorized:readiness.authority?.prod_write_authorized===true},safety:{prod_write:false,customer_data:false,trading:false,paid_fallback:false,additional_subscription_eur:0}};
          fs.writeFileSync('artifacts/auto001/repair-autonomy-state.json',JSON.stringify(state,null,2)+'\n');
          NODE
      - name: Persist AUTO repair evidence on dedicated QA state branch
        if: github.event_name != 'pull_request' && steps.plan.outputs.status == 'PATCH_PLAN_READY' && steps.patch.outputs.existing != 'true'
        run: |
          set -euo pipefail
          cp artifacts/auto001/repair-autonomy-state.json /tmp/auto-repair-state.json
          git config user.name 'cerebro-auto001[bot]'; git config user.email 'cerebro-auto001[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --force origin "+refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH"; git checkout --detach "refs/remotes/origin/$QA_STATE_BRANCH"
            mkdir -p "$(dirname "$AUTO_REPAIR_STATE_PATH")"; cp /tmp/auto-repair-state.json "$AUTO_REPAIR_STATE_PATH"; git add "$AUTO_REPAIR_STATE_PATH"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore(cerebro): persist AUTO-001 repair autonomy evidence'
            if git push origin "HEAD:refs/heads/$QA_STATE_BRANCH"; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
      - name: Enforce no-op semantics when there is no certified transform
        if: github.event_name != 'pull_request' && steps.plan.outputs.status == 'NO_ELIGIBLE_PATCH'
        run: jq -e '.execute==false and .prod_write_authorized==false and .auto_merge==false and .additional_cost_eur==0' artifacts/auto001/plan.json >/dev/null
      - name: Upload executor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-auto001-preprod-patch-executor-v0-${{ github.run_id }}
          path: artifacts/auto001/**
          if-no-files-found: warn
          retention-days: 30
