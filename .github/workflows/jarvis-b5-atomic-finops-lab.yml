name: JARVIS B5 Atomic FinOps PostgreSQL LAB
on:
  pull_request:
    paths:
      - 'zeus/jarvis/finops-lab/**'
      - '.github/workflows/jarvis-b5-atomic-finops-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-prepaid-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jarvis_lab
          POSTGRES_PASSWORD: ephemeral_jarvis_b5_ci_only
          POSTGRES_DB: jarvis_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_lab -d jarvis_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: jarvis_lab
      PGPASSWORD: ephemeral_jarvis_b5_ci_only
      PGDATABASE: jarvis_lab
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL CLI if absent
        run: command -v pg_restore >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Prove atomic prepaid hard-stop and synthetic restore only
        run: bash zeus/jarvis/finops-lab/b5-atomic-prepaid-ledger-lab.sh
