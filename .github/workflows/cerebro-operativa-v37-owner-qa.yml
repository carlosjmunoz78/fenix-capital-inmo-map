name: CEREBRO Operativa V37 · Owner and follow-up isolated QA
on:
  push:
    branches: [fix/cerebro-operativa-owner-followup-v37-20261112]
  pull_request:
    branches: [fix/cerebro-operativa-followups-v36-20261112]
permissions: {contents: read}
jobs:
  contract-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Existing v35 and v36 regressions
        run: node --test tests/cerebro-gateway-followups-v36.test.mjs tests/cerebro-gateway-activity-v35.test.mjs tests/cerebro-gateway-natural-v35.test.mjs
      - name: 'Owner follow-up v37 - true simplification and security regression'
        run: node --test tests/cerebro-gateway-followup-v37.test.mjs
      - name: 'Owner Access Resolver - tenant denial and read-only contract'
        run: node --test tests/cerebro-owner-access-resolver.test.mjs
      - name: 'Owner authenticated LAB smoke - only if existing secret is configured'
        env:
          OWNER_E2E_JWT: ${{ secrets.CEREBRO_E2E_USER_JWT }}
        run: |
          set -eu
          if [ -z "${OWNER_E2E_JWT:-}" ]; then
            echo "AUTH_E2E_PENDING: owner test token is not configured in GitHub Actions"
            exit 0
          fi
          url="https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-gateway-v36-followups-lab/owner-capabilities"
          code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 --output "$RUNNER_TEMP/owner-lab.json" --write-out '%{http_code}' --header "Authorization: Bearer ${OWNER_E2E_JWT}" "${url}?company_id=fenix")
          if [ "$code" != 200 ]; then
            reason=$(jq -r '.code // .error_code // .reason // "UNSPECIFIED"' "$RUNNER_TEMP/owner-lab.json" 2>/dev/null || echo "NON_JSON")
            case "$reason" in
              MISSING_CREDENTIALS|INVALID_JWT|JWT_EXPIRED|EXPIRED_JWT|UNAUTHORIZED|AUTHORIZATION_FAILED|UNSPECIFIED|NON_JSON|401)
                echo "AUTH_E2E_REASON_${reason}" ;;
              *) echo "AUTH_E2E_REASON_OTHER" ;;
            esac
            echo "AUTH_E2E_FAIL_OWNER_HTTP_${code}"
            rm -f "$RUNNER_TEMP/owner-lab.json"
            exit 1
          fi
          jq -e '(.status == "OK") and (.owner_scope == "VERIFIED_FENIX_ONLY") and (.executed == false) and (.data_returned == false) and ((.capabilities | length) >= 8)' "$RUNNER_TEMP/owner-lab.json" >/dev/null
          code=$(curl --silent --show-error --connect-timeout 5 --max-time 20 --output "$RUNNER_TEMP/cross-tenant-lab.json" --write-out '%{http_code}' --header "Authorization: Bearer ${OWNER_E2E_JWT}" "${url}?company_id=aion")
          if [ "$code" != 200 ]; then
            echo "AUTH_E2E_FAIL_CROSS_TENANT_HTTP_${code}"
            exit 1
          fi
          jq -e '(.status == "NOT_CONNECTED") and (.executed == false) and (.data_returned == false) and (.capabilities == [])' "$RUNNER_TEMP/cross-tenant-lab.json" >/dev/null
          rm -f "$RUNNER_TEMP/owner-lab.json" "$RUNNER_TEMP/cross-tenant-lab.json"
          echo "AUTH_E2E_PASS: owner read-only scope and cross-company deny"
