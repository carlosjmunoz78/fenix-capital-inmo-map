name: CEREBRO Operativa V37 · Owner and follow-up isolated QA
on:
  push:
    branches: [fix/cerebro-operativa-owner-followup-v37-20261112]
  pull_request:
    branches: [fix/cerebro-operativa-followups-v36-20261112]
permissions: {contents: read}
jobs:
  contract-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Existing v35 and v36 regressions
        run: node --test tests/cerebro-gateway-followups-v36.test.mjs tests/cerebro-gateway-activity-v35.test.mjs tests/cerebro-gateway-natural-v35.test.mjs
      - name: 'Owner follow-up v37 - true simplification and security regression'
        run: node --test tests/cerebro-gateway-followup-v37.test.mjs
      - name: 'Owner Access Resolver - tenant denial and read-only contract'
        run: node --test tests/cerebro-owner-access-resolver.test.mjs
      - name: 'Dynamic company and project scope discovery contract'
        run: node --test tests/cerebro-owner-scope-registry.test.mjs
      - name: 'LIVE owner registry - Supabase companies, projects and engines mocked contract'
        run: node --test tests/cerebro-owner-registry-live.test.mjs
      - name: 'FACT-001 GitOps public catalog and unified owner Gateway gates'
        run: node --test tests/cerebro-owner-factory-gitops.test.mjs
