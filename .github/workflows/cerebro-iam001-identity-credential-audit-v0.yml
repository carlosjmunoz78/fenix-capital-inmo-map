name: CEREBRO IAM001 Identity Credential Audit V0

on:
  pull_request:
    paths:
      - 'cerebro/registry/identity-access-registry.v0.json'
      - 'cerebro/registry/credential-reference-registry.v0.json'
      - 'cerebro/registry/connector-auth-registry.v0.json'
      - 'cerebro/governance/identity-credential-broker.mjs'
      - 'cerebro/tests/identity-credential-broker-v0.test.mjs'
      - 'cerebro/docs/CEREBRO_IAM001_IDENTITY_CREDENTIAL_BROKER_AUDIT_V0_2026-10-09.md'
      - '.github/workflows/cerebro-iam001-identity-credential-audit-v0.yml'
      - '.github/workflows/cerebro-secret-ref-audit.yml'
      - '.github/workflows/cerebro-session-context-auth-e2e.yml'
      - '.github/workflows/cerebro-human-communication-v1.yml'
      - '.github/workflows/private-physical-document-gate.yml'
      - '.github/workflows/cerebro-skill-agent-browser-behavioral-lab.yml'
      - '.github/workflows/cerebro-skill-supabase-behavioral-lab.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/registry/identity-access-registry.v0.json'
      - 'cerebro/registry/credential-reference-registry.v0.json'
      - 'cerebro/registry/connector-auth-registry.v0.json'
      - 'cerebro/governance/identity-credential-broker.mjs'
      - 'cerebro/tests/identity-credential-broker-v0.test.mjs'
      - 'cerebro/docs/CEREBRO_IAM001_IDENTITY_CREDENTIAL_BROKER_AUDIT_V0_2026-10-09.md'
      - '.github/workflows/cerebro-iam001-identity-credential-audit-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-iam-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact PR head checkout when applicable
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Test deterministic IAM metadata broker
        run: node --test cerebro/tests/identity-credential-broker-v0.test.mjs
      - name: Assert IAM-001 remains canonical and all registries remain authority-safe
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {loadIdentityCredentialFoundation,identityCredentialAuditSummary,IDENTITY_CREDENTIAL_BROKER_V0_CONTRACT} from './cerebro/governance/identity-credential-broker.mjs';
          const engines=JSON.parse(fs.readFileSync('cerebro/registry/engine-registry.seed.json','utf8'));
          if(!engines.engine_ids?.includes('IAM-001')) throw new Error('IAM-001 is not canonical');
          const f=loadIdentityCredentialFoundation();
          const s=identityCredentialAuditSummary({foundation:f});
          if(s.status!=='IAM_FOUNDATION_AUDITED_FAIL_CLOSED'||s.secret_values_registered!==false||s.new_paid_vault_required!==false||s.additional_cost_eur!==0) throw new Error('IAM summary drift');
          if(IDENTITY_CREDENTIAL_BROKER_V0_CONTRACT.prod_authorized!==false||IDENTITY_CREDENTIAL_BROKER_V0_CONTRACT.prod_write_authorized!==false||IDENTITY_CREDENTIAL_BROKER_V0_CONTRACT.trading_access!==false||IDENTITY_CREDENTIAL_BROKER_V0_CONTRACT.multicompany_continuation!==false) throw new Error('IAM authority drift');
          console.log(JSON.stringify(s));
          NODE
      - name: Prove symbolic credential references correspond to existing code without reading secret values
        run: |
          set -euo pipefail
          grep -F 'secrets.PROD_SUPABASE_PUBLISHABLE_KEY' .github/workflows/cerebro-secret-ref-audit.yml >/dev/null
          grep -F 'secrets.PROD_SUPABASE_LEGACY_ANON_JWT' .github/workflows/cerebro-secret-ref-audit.yml >/dev/null
          grep -F 'secrets.CEREBRO_E2E_USER_JWT' .github/workflows/cerebro-session-context-auth-e2e.yml >/dev/null
          grep -F 'secrets.NOTION_TOKEN' .github/workflows/private-physical-document-gate.yml >/dev/null
          grep -F 'secrets.CEREBRO_GEMINI_API_KEY' .github/workflows/cerebro-skill-agent-browser-behavioral-lab.yml >/dev/null
          grep -F 'secrets.CEREBRO_GEMINI_API_KEY' .github/workflows/cerebro-skill-supabase-behavioral-lab.yml >/dev/null
          grep -F 'secrets.CEREBRO_MAIL_USERNAME' .github/workflows/cerebro-human-communication-v1.yml >/dev/null
          grep -F 'secrets.CEREBRO_MAIL_PASSWORD' .github/workflows/cerebro-human-communication-v1.yml >/dev/null
          grep -F 'secrets.CEREBRO_OWNER_EMAIL' .github/workflows/cerebro-human-communication-v1.yml >/dev/null
          grep -F 'github.token' .github/workflows/cerebro-skill-github-preprod-integration.yml >/dev/null
      - name: Assert E2E session lifecycle gap remains explicit and browser real binding is not invented
        run: |
          set -euo pipefail
          grep -F 'POR_AUDITAR_MISSING_SECURE_TOKEN' .github/workflows/cerebro-session-context-auth-e2e.yml >/dev/null
          grep -F 'AUTHENTICATED_READ_PARITY_GREEN' scripts/cerebro-secdef-canary-auth-e2e.sh >/dev/null
          grep -F "CEREBRO_ALLOW_PROD_DATA: 'false'" .github/workflows/cerebro-skill-agent-browser-behavioral-lab.yml >/dev/null
          grep -F "CEREBRO_ALLOW_CUSTOMER_DATA: 'false'" .github/workflows/cerebro-skill-agent-browser-behavioral-lab.yml >/dev/null
          node --input-type=module <<'NODE'
          import {connectorAuthDecision,loadIdentityCredentialFoundation} from './cerebro/governance/identity-credential-broker.mjs';
          const d=connectorAuthDecision({connector_id:'connector:agent-browser-candidate',environment:'PREPROD',foundation:loadIdentityCredentialFoundation()});
          if(d.decision!=='HOLD_BROWSER_REAL_IDENTITY_BINDING_AUDIT'||d.prod_authorized!==false||d.trading_access!==false) throw new Error('browser identity safety drift');
          NODE
      - name: Assert no registry introduces raw secret material or a paid vault dependency
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=['cerebro/registry/identity-access-registry.v0.json','cerebro/registry/credential-reference-registry.v0.json','cerebro/registry/connector-auth-registry.v0.json'];
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            if(/\beyJ[A-Za-z0-9_-]{12,}\.|\bsb_secret_[A-Za-z0-9_-]{8,}|\bAIza[A-Za-z0-9_-]{12,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/.test(text)) throw new Error(`raw credential-like material detected:${file}`);
          }
          const credentials=JSON.parse(fs.readFileSync('cerebro/registry/credential-reference-registry.v0.json','utf8'));
          if(credentials.storage_strategy!=='REUSE_EXISTING_PROVIDER_OR_GITHUB_SECRET_STORES'||credentials.invariants?.new_paid_vault_required!==false) throw new Error('unexpected vault/cost dependency');
          NODE
      - name: Assert next gate and documented scope
        run: |
          set -euo pipefail
          grep -F 'IAM001_LIFECYCLE_AND_REAL_SESSION_BINDING_V0' cerebro/docs/CEREBRO_IAM001_IDENTITY_CREDENTIAL_BROKER_AUDIT_V0_2026-10-09.md >/dev/null
          grep -F 'does **not** claim' cerebro/docs/CEREBRO_IAM001_IDENTITY_CREDENTIAL_BROKER_AUDIT_V0_2026-10-09.md >/dev/null
