name: CEREBRO API-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-job001-job-governance-v0-20260911']
    paths:
      - 'cerebro/platform/api-governance-engine.mjs'
      - 'cerebro/tests/api-governance-engine.test.mjs'
      - '.github/workflows/cerebro-api001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/api-governance-engine.test.mjs
