name: CEREBRO SALE-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-lead001-lead-scoring-v0-20260911']
    paths:
      - 'cerebro/sales/sales-engine.mjs'
      - 'cerebro/tests/sales-engine.test.mjs'
      - '.github/workflows/cerebro-sale001-preprod.yml'
jobs:
  sale001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/sales-engine.test.mjs
