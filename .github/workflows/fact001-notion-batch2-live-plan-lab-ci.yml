name: FACT001 Notion Batch2 Live Index LAB CI
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/notion-batch-planner-v2-lab/**
      - .github/workflows/fact001-notion-batch2-live-plan-lab-ci.yml
permissions:
  contents: read
jobs:
  live-index-planner-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify fixed OIDC and no-write batch2 planning
        run: |
          node --test cerebro/connectors/universal/services/notion-batch-planner-v2-lab/tests/*.test.mjs
          node --check cerebro/connectors/universal/services/notion-batch-planner-v2-lab/run-once.mjs
      - name: Validate isolation contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const root='cerebro/connectors/universal/services/notion-batch-planner-v2-lab/';const s=fs.readFileSync(root+'index.ts','utf8'),p=fs.readFileSync(root+'policy.mjs','utf8');
          if(!s.includes('await verifyGitHubOidc(auth.slice(7))')||!s.includes('sealNotionIndexManifest')||!p.includes('fact001-notion-batch2-live-plan-once-lab.yml'))throw Error('OIDC_OR_PARITY_GATE_MISSING');
          if(/method:\s*['"](DELETE|PATCH|PUT)['"]/.test(s))throw Error('PROVIDER_WRITES_FORBIDDEN');
          console.log('FACT001_BATCH2_V2_READONLY=PASS');
          NODE