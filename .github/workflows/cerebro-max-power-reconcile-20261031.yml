name: CEREBRO Max Power Reconcile Bridge 20261031

on:
  push:
    branches:
      - control/v2-release-promotion-20261031
    paths:
      - '.github/workflows/cerebro-max-power-reconcile-20261031.yml'

permissions:
  actions: write
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch canonical Global Capacity Controller V1
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run cerebro-continuous-work-factory-v0.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'requested_useful_pool=350' >> "$GITHUB_STEP_SUMMARY"
          echo 'reserved_control_slots=10' >> "$GITHUB_STEP_SUMMARY"
          echo 'enterprise_cap=360' >> "$GITHUB_STEP_SUMMARY"
          echo 'paid_ai=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'trading=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'prod_write=false' >> "$GITHUB_STEP_SUMMARY"
