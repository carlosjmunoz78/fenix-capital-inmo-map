name: FACT001 CF CEREBRO independent headless LAB broker policy CI
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase/cf-headless-worker-e2e-lab/**
      - .github/workflows/fact001-cf-headless-worker-policy-ci.yml
permissions:
  contents: read
jobs:
  cf-headless-policy-security:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: node --test cerebro/connectors/universal/supabase/cf-headless-worker-e2e-lab/tests/*.test.mjs
      - name: Conservative static ingress and provider scope gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=fs.readFileSync('cerebro/connectors/universal/supabase/cf-headless-worker-e2e-lab/index.ts','utf8');
          const p=fs.readFileSync('cerebro/connectors/universal/supabase/cf-headless-worker-e2e-lab/policy.mjs','utf8');
          if(!p.includes("payload.actor!=='carlosjmunoz78'")||!p.includes("payload.event_name!=='push'")||!p.includes("payload.workflow_ref!==WORKFLOW_REF")||!p.includes("payload.aud!==OIDC_AUDIENCE"))throw Error('OIDC_INSUFFICIENT');
          if(!s.includes('TOKEN_VAULT')||!s.includes('TOKEN_ID_VAULT')||!s.includes('CLAIM_OR_CREDENTIAL_NEEDS_RECONCILIATION'))throw Error('VAULT_AUDIT_INSUFFICIENT');
          if(!s.includes('await secure(child,v1)')||!s.includes('await secure(child,v2)')||!s.includes('await secure(child,rebuild)'))throw Error('NO_PHYSICAL_ROLLBACK_AND_REBUILD_GATES');
          if(!s.includes("await cf(child,'DELETE',worker)")||!s.includes("await cf(parent,'DELETE',account+'/tokens/'+childId)"))throw Error('NO_CLEANUP');
          if(!s.includes("provider:'cloudflare'")&&!p.includes("provider:'cloudflare'"))throw Error('PROVIDER_NOT_SCOPED');
          console.log('CF_HEADLESS_POLICY_STATIC=PASS');
          NODE
