name: CEREBRO Skill Creator Static LAB

on:
  push:
    paths:
      - 'cerebro/skills/skill-selected-candidate-static-lab.mjs'
      - 'cerebro/skills/skill-creator-static-lab.v0.json'
      - 'cerebro/tests/skill-selected-candidate-static-lab.test.mjs'
      - '.github/workflows/cerebro-skill-creator-static-lab.yml'
  workflow_dispatch:

concurrency:
  group: cerebro-skill-creator-static-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CEREBRO_PROFILE: cerebro/skills/skill-creator-static-lab.v0.json
  CEREBRO_OUTPUT: artifacts/cerebro-skill-creator-static-lab.json

jobs:
  skill-creator-static-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run focused deterministic static LAB tests
        run: node --test cerebro/tests/skill-selected-candidate-static-lab.test.mjs
      - name: Evaluate exact-commit skill-creator manifest as inert text only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/skills/skill-selected-candidate-static-lab.mjs --profile "$CEREBRO_PROFILE" --output "$CEREBRO_OUTPUT"
      - name: Enforce GREEN static-only contract and zero-risk boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.CEREBRO_OUTPUT,'utf8'));
          const ok=r.status==='STATIC_LAB_GREEN_FOR_NORMALIZED_WRAPPER_DESIGN' &&
            r.provenance_exact===true && r.external_code_executed===false && r.test_code_executed===false &&
            r.external_code_execution_authorized===false && r.sandbox_authorized===false && r.install_authorized===false &&
            r.prod_authorized===false && r.prod_write_authorized===false && r.customer_data_used===false &&
            r.prod_data_used===false && r.trading_access===false && r.additional_cost_eur===0;
          console.log(JSON.stringify({status:r.status,candidate_id:r.candidate_id,coverage_score:r.coverage_score,provenance_exact:r.provenance_exact,external_code_executed:r.external_code_executed,prod_authorized:r.prod_authorized,additional_cost_eur:r.additional_cost_eur}));
          if(!ok) process.exit(1);
          NODE
      - name: Upload immutable static LAB evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-creator-static-lab-${{ github.run_id }}
          path: artifacts/cerebro-skill-creator-static-lab.json
          if-no-files-found: error
          retention-days: 30
