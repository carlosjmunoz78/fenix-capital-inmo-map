name: TEMP COMP-ONB Registry Version

on:
  push:
    branches:
      - cerebro/comp-onb-001-runtime-v0
    paths:
      - '.github/workflows/temp-comp-onb-registry-version.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cerebro/comp-onb-001-runtime-v0
          fetch-depth: 0
      - name: Bump Engine Registry version only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('cerebro/factory/registry/engine-registry.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('registry_version') not in {'0.12.0','0.13.0'}:
              raise SystemExit(f"unexpected registry_version={data.get('registry_version')}")
          data['registry_version'] = '0.13.0'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name 'CEREBRO Factory'
          git config user.email 'cerebro-factory@users.noreply.github.com'
          git add cerebro/factory/registry/engine-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'GOV-001 · bump Engine Registry to 0.13.0 for COMP-ONB-001'
          git push origin HEAD:cerebro/comp-onb-001-runtime-v0
