name: CEREBRO Skill Full Adoption V1

on:
  pull_request:
    paths:
      - 'cerebro/registry/skill-full-adoption-v1.json'
      - 'cerebro/registry/skill-creator-full-safe-preprod.v1.json'
      - 'cerebro/registry/skill-github-full-safe-preprod.v1.json'
      - 'cerebro/registry/skill-supply-chain-v0.json'
      - 'cerebro/skills/skill-full-adoption-selector-v1.mjs'
      - 'cerebro/skills/skill-full-adoption-learning-ingress-v1.mjs'
      - 'cerebro/skills/skill-full-closure-validator-v1.mjs'
      - 'cerebro/skills/skill-github-full-closure-validator-v1.mjs'
      - 'cerebro/skills/skill-cerebro-github-wrapper.mjs'
      - 'cerebro/skills/skill-github-preprod-integration.mjs'
      - 'cerebro/tests/skill-full-adoption-selector-v1.test.mjs'
      - 'cerebro/tests/skill-full-adoption-learning-ingress-v1.test.mjs'
      - 'cerebro/tests/skill-full-closure-validator-v1.test.mjs'
      - 'cerebro/tests/skill-github-full-closure-validator-v1.test.mjs'
      - 'cerebro/docs/CEREBRO_SKILLS_FULL_ADOPTION_POLICY_V1_2026-10-15.md'
      - '.github/workflows/cerebro-skill-full-adoption-v1.yml'
  push:
    branches:
      - cerebro/skills-full-admitted-first-v1-20261015
    paths:
      - 'cerebro/registry/skill-full-adoption-v1.json'
      - 'cerebro/registry/skill-creator-full-safe-preprod.v1.json'
      - 'cerebro/registry/skill-github-full-safe-preprod.v1.json'
      - 'cerebro/registry/skill-supply-chain-v0.json'
      - 'cerebro/skills/skill-full-adoption-selector-v1.mjs'
      - 'cerebro/skills/skill-full-adoption-learning-ingress-v1.mjs'
      - 'cerebro/skills/skill-full-closure-validator-v1.mjs'
      - 'cerebro/skills/skill-github-full-closure-validator-v1.mjs'
      - 'cerebro/skills/skill-cerebro-github-wrapper.mjs'
      - 'cerebro/skills/skill-github-preprod-integration.mjs'
      - 'cerebro/tests/skill-full-adoption-selector-v1.test.mjs'
      - 'cerebro/tests/skill-full-adoption-learning-ingress-v1.test.mjs'
      - 'cerebro/tests/skill-full-closure-validator-v1.test.mjs'
      - 'cerebro/tests/skill-github-full-closure-validator-v1.test.mjs'
      - 'cerebro/docs/CEREBRO_SKILLS_FULL_ADOPTION_POLICY_V1_2026-10-15.md'
      - '.github/workflows/cerebro-skill-full-adoption-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-skill-full-adoption-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  admitted-first-contract:
    name: admitted-first-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove selector, aliases, FULL closures and persistent learning contract
        run: node --test cerebro/tests/skill-full-adoption-selector-v1.test.mjs cerebro/tests/skill-full-adoption-learning-ingress-v1.test.mjs cerebro/tests/skill-full-closure-validator-v1.test.mjs cerebro/tests/skill-github-full-closure-validator-v1.test.mjs
      - name: Resolve current highest-benefit safe work
        run: |
          node cerebro/skills/skill-full-adoption-selector-v1.mjs \
            --registry cerebro/registry/skill-full-adoption-v1.json \
            --output artifacts/skills-full/selection.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/skills-full/selection.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('cerebro/registry/skill-full-adoption-v1.json','utf8'));
          if(r.prod_write_authorized!==false||r.prod_mutation_authorized!==false||r.auto_merge_authorized!==false||r.customer_data_authorized!==false||r.external_skill_code_execution_authorized!==false||r.trading_access!==false||r.paid_fallback!==false||r.additional_cost_eur!==0) throw new Error('SKILL_FULL_ADOPTION_SAFETY_BOUNDARY_FAILED');
          const terminal=new Set(['FULL_SAFE_PREPROD','REJECTED','DESCARTAR']);
          const expected=[...registry.queue].sort((a,b)=>a.priority-b.priority).find((x)=>!terminal.has(x.status)&&x.human_required==null&&x.autonomous_ceiling==='FULL_SAFE_PREPROD')??null;
          if(expected){
            if(r.status!=='SAFE_WORK_AVAILABLE') throw new Error(`EXPECTED_SAFE_WORK_AVAILABLE:${r.status}`);
            if(r.selected?.candidate_id!==expected.candidate_id) throw new Error(`PRIORITY_NOT_RESPECTED:${r.selected?.candidate_id}:${expected.candidate_id}`);
          } else if(r.status==='SAFE_WORK_AVAILABLE') throw new Error('UNEXPECTED_SAFE_WORK_AVAILABLE');
          console.log(JSON.stringify({status:r.status,next:r.selected?.alias_es??null,technical_name:r.selected?.technical_name??null,prod_write:false,trading:false,cost_eur:0}));
          NODE
      - name: Reprove skill-creator PREPROD FACT-001 binding OLD vs NEW with rollback
        run: |
          mkdir -p artifacts/skills-full/skill-creator
          node cerebro/skills/skill-creator-preprod-integration.mjs \
            --output artifacts/skills-full/skill-creator/preprod-integration.json \
            --state-root artifacts/skills-full/skill-creator/preprod-state
      - name: Validate skill-creator FULL closure fail closed
        run: |
          node cerebro/skills/skill-full-closure-validator-v1.mjs \
            --closure cerebro/registry/skill-creator-full-safe-preprod.v1.json \
            --registry cerebro/registry/skill-full-adoption-v1.json \
            --static-lab cerebro/skills/skill-creator-static-lab.v0.json \
            --preprod-report artifacts/skills-full/skill-creator/preprod-integration.json \
            --output artifacts/skills-full/skill-creator/closure-validation.json
      - name: Execute GitHub PREPROD FACT-001 binding OLD vs NEW with physical rollback
        run: |
          mkdir -p artifacts/skills-full/github
          node cerebro/skills/skill-github-preprod-integration.mjs \
            --output artifacts/skills-full/github/preprod-integration.json \
            --state-root artifacts/skills-full/github/preprod-state
      - name: Validate GitHub FULL closure against pinned provenance and frozen Tribunal evidence
        run: |
          node cerebro/skills/skill-github-full-closure-validator-v1.mjs \
            --closure cerebro/registry/skill-github-full-safe-preprod.v1.json \
            --registry cerebro/registry/skill-full-adoption-v1.json \
            --supply-chain cerebro/registry/skill-supply-chain-v0.json \
            --preprod-report artifacts/skills-full/github/preprod-integration.json \
            --output artifacts/skills-full/github/closure-validation.json
      - name: Upload immutable selection and FULL closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-full-adoption-${{ github.run_id }}
          path: artifacts/skills-full/**
          if-no-files-found: error
          retention-days: 30

  admitted-skill-learning-evidence:
    name: admitted-skill-learning-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build synthetic governed improvement evidence for admitted skills
        run: |
          mkdir -p artifacts/skills-full/learning
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const base={company_id:'GLOBAL_ONLY',engine_id:'FACT-001',environment:'PREPROD_CANDIDATE',version:'0.1.0',reason:'CI_GOVERNED_ADMITTED_SKILL_LEARNING_EVIDENCE',payload:{domain:'agent-ai-orchestration'},publish_authorized:false,prod_authorized:false};
          const events=[
            {...base,event_id:`evt:${process.env.GITHUB_RUN_ID}:skill-creator`,event_type:'SKILL_CANDIDATE_STATIC_LAB_GREEN',severity:'INFO',candidate_id:'lobehub-skills:950cf07380d1daa6de69',target_engine_bindings:['FACT-001'],evidence_refs:[`run:${process.env.GITHUB_RUN_ID}`,'candidate:skill-creator']},
            {...base,event_id:`evt:${process.env.GITHUB_RUN_ID}:github`,event_type:'SKILL_CANDIDATE_STATIC_LAB_GREEN',severity:'INFO',candidate_id:'lobehub-skills:52441cd3d76607ffffab',target_engine_bindings:['FACT-001'],evidence_refs:[`run:${process.env.GITHUB_RUN_ID}`,'candidate:github']}
          ];
          fs.writeFileSync('artifacts/skills-full/learning/events.json',JSON.stringify({schema_version:'1.0.0',events},null,2)+'\n');
          NODE
      - name: Persist admitted skill learning once
        run: |
          node cerebro/skills/skill-full-adoption-learning-ingress-v1.mjs \
            --events artifacts/skills-full/learning/events.json \
            --ledger artifacts/skills-full/learning/learning-ledger.v8 \
            --version "skill-full-ci-${GITHUB_SHA}" \
            --policy-pass --security-pass --enable-local-persistence \
            --output artifacts/skills-full/learning/first-pass.json
      - name: Replay exact evidence and prove idempotency
        run: |
          node cerebro/skills/skill-full-adoption-learning-ingress-v1.mjs \
            --events artifacts/skills-full/learning/events.json \
            --ledger artifacts/skills-full/learning/learning-ledger.v8 \
            --version "skill-full-ci-${GITHUB_SHA}" \
            --policy-pass --security-pass --enable-local-persistence \
            --output artifacts/skills-full/learning/replay.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const first=JSON.parse(fs.readFileSync('artifacts/skills-full/learning/first-pass.json','utf8'));
          const replay=JSON.parse(fs.readFileSync('artifacts/skills-full/learning/replay.json','utf8'));
          if(first.status!=='GREEN_PERSISTENT_PREPROD_LEARNING'||first.persisted_total!==2||first.duplicates_total!==0) throw new Error('FIRST_PASS_PERSISTENCE_NOT_PROVEN');
          if(replay.status!=='GREEN_PERSISTENT_PREPROD_LEARNING'||replay.persisted_total!==0||replay.duplicates_total!==2) throw new Error('IDEMPOTENT_REPLAY_NOT_PROVEN');
          if(first.prod_write_authorized!==false||replay.prod_write_authorized!==false||first.trading_access!==false||replay.trading_access!==false||first.additional_cost_eur!==0||replay.additional_cost_eur!==0) throw new Error('LEARNING_EVIDENCE_SAFETY_BOUNDARY_FAILED');
          console.log(JSON.stringify({state:'GREEN_PERSISTENT_PREPROD_LEARNING',first_persisted:first.persisted_total,replay_duplicates:replay.duplicates_total,scope:first.persistence_scope,supabase_required:first.supabase_required,prod_write:false,trading:false,cost_eur:0}));
          NODE
      - name: Upload immutable persistent-learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-admitted-skill-learning-${{ github.run_id }}
          path: artifacts/skills-full/learning/**
          if-no-files-found: error
          retention-days: 30

  existing-governance-regression:
    name: existing-governance-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/skill-capability-autonomy-closure-v1.test.mjs cerebro/tests/skill-capability-evolution.test.mjs cerebro/tests/skill-capability-evolution-bridge.test.mjs cerebro/tests/skill-autonomy-action-application-v1.test.mjs cerebro/tests/skill-autonomy-safe-action-worker-v1.test.mjs cerebro/tests/evaluation-tribunal.test.mjs cerebro/tests/rsi-learning-worker.test.mjs cerebro/tests/learning-preprod-pipeline.test.mjs

  full-cerebro-regression:
    name: full-cerebro-regression
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs

  main-baseline-full-cerebro:
    name: main-baseline-full-cerebro
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test cerebro/tests/*.test.mjs
