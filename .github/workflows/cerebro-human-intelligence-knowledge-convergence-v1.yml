name: CEREBRO Human Intelligence Knowledge Convergence V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/human-intelligence/**'
      - 'cerebro/multichannel/**'
      - 'cerebro/tests/human-intelligence-conversation-learning-convergence-v1.test.mjs'
      - '.github/workflows/cerebro-human-intelligence-knowledge-convergence-v1.yml'
  push:
    branches: ['cerebro/knowledge-convergence-v1-20261014']
    paths:
      - 'cerebro/human-intelligence/**'
      - 'cerebro/multichannel/**'
      - 'cerebro/tests/human-intelligence-conversation-learning-convergence-v1.test.mjs'
      - '.github/workflows/cerebro-human-intelligence-knowledge-convergence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-human-intelligence-knowledge-convergence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  knowledge-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Assert exact head and bounded change surface
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          if [ -n "${PR_BASE_SHA:-}" ]; then
            git fetch origin "$PR_BASE_SHA" --depth=1
            base="$PR_BASE_SHA"
          else
            git fetch origin main --depth=1
            base="$(git rev-parse FETCH_HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(cerebro/human-intelligence/|cerebro/multichannel/|cerebro/tests/human-intelligence-conversation-learning-convergence-v1\.test\.mjs$|\.github/workflows/cerebro-human-intelligence-knowledge-convergence-v1\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo 'Knowledge convergence crossed its governed surface:' >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Prove knowledge convergence real synthetic and channel boundaries
        run: |
          node --test \
            cerebro/tests/human-intelligence-conversation-learning-convergence-v1.test.mjs \
            cerebro/tests/universal-learning-ingress.test.mjs \
            cerebro/tests/channel-access-profiles-v1.test.mjs \
            cerebro/tests/multichannel-conversation-policy-v1.test.mjs \
            cerebro/tests/multichannel-conversation-old-vs-new-v1.test.mjs \
            cerebro/tests/human-intelligence-tribunal-v1.test.mjs \
            cerebro/tests/human-intelligence-autonomy-bridge-v1.test.mjs

      - name: Assert no authority cost or Trading expansion
        shell: bash
        run: |
          set -euo pipefail
          map='cerebro/human-intelligence/knowledge/knowledge-surface-map.v1.json'
          channels='cerebro/multichannel/channel-registry.v1.json'
          test -f "$map" && test -f "$channels"
          jq -e '.safety.prod_authority_expansion==false and .safety.prod_write_authority_expansion==false and .safety.trading_access==false and .safety.secrets_disclosure==false and .safety.cross_company_leakage==false and .safety.additional_cost_eur==0' "$map" >/dev/null
          jq -e '.safety.prod_authority_expansion==false and .safety.prod_write_authority_expansion==false and .safety.trading_access==false and .safety.secrets_disclosure==false and .safety.cross_company_leakage==false and .safety.additional_cost_eur==0' "$channels" >/dev/null
          jq -e '.learning.real_conversation_raw_text_to_lrn==false and .learning.synthetic_direct_truth_promotion==false and .learning.auto_promote_single_conversation==false and .learning.old_vs_new_required==true and .learning.tribunal_required==true and .learning.preprod_required==true and .learning.rollback_required==true' "$channels" >/dev/null
