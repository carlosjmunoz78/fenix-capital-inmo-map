name: CEREBRO L7 Foundation Audit

on:
  push:
    branches: [cerebro-implement-l7-l8-l9-foundation-20261102]
    paths:
      - '.github/workflows/cerebro-l7-foundation-audit.yml'
      - 'cerebro/missions/audit-priority-l789-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_VALIDATED_SHA: bca728d4b5168193d7eba43047a25ddba50279f1
  OUT: /tmp/cerebro-l7-audit

jobs:
  audit-l7:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 260
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Assert isolated ancestry and no protected mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'cerebro-implement-l7-l8-l9-foundation-20261102'
          test "$GITHUB_REF_NAME" != 'main'
          git merge-base --is-ancestor "$BASE_VALIDATED_SHA" HEAD
          git diff --exit-code "$BASE_VALIDATED_SHA" -- cerebro/registry/engine-registry.v1.json cerebro/factory.mjs cerebro/factory-v1.mjs
          ! git diff --name-only "$BASE_VALIDATED_SHA" HEAD | grep -Ei '(^|/)(trading|lab-trd)(/|$)'
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Validate Registry and Factory
        shell: bash
        run: |
          set -euo pipefail
          cd cerebro
          npm run validate
          node factory-v1.mjs validate --registry registry/engine-registry.v1.json
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('registry/engine-registry.v1.json'));const ids=r.engine_ids||[];if(r.count!==179||ids.length!==179||new Set(ids).size!==179)throw new Error('Registry must remain 179 unique');console.log('REGISTRY_179_UNIQUE_GREEN');
          NODE
      - name: Run existing connection analyzer
        run: node cerebro/missions/connect-existing-engines-v3.mjs --out "$OUT/connections"
      - name: Audit L7 OLD baseline
        shell: bash
        run: |
          set -euo pipefail
          node cerebro/missions/audit-priority-l789-v1.mjs --layer L7 --out "$OUT/a"
          node cerebro/missions/audit-priority-l789-v1.mjs --layer L7 --out "$OUT/b"
          cmp "$OUT/a/PRIORITY_PHYSICAL_BASELINE.json" "$OUT/b/PRIORITY_PHYSICAL_BASELINE.json"
          node -e "const x=require(process.env.OUT+'/a/AUDIT_REPORT.json');console.log('L7_AUDIT_REPORT='+JSON.stringify(x))"
      - name: Boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e cerebro/runtime/l7 || ! grep -R --line-number -E 'SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' cerebro/runtime/l7
          echo 'L7_AUDIT_ONLY_GREEN' >> "$GITHUB_STEP_SUMMARY"
