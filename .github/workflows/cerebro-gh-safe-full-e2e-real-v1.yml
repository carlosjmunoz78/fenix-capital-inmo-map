name: CEREBRO GH Safe FULL E2E REAL V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cerebro/lote12-real-consumer-gh-safe-v1-*'
    paths:
      - 'cerebro/runtime/gh-safe-real-consumer-adoption-v1.mjs'
      - 'cerebro/tests/gh-safe-real-consumer-adoption-v1.test.mjs'
      - 'cerebro/registry/gh-safe-real-consumer-adoption-v1.json'
      - 'cerebro/docs/GH_SAFE_REAL_CONSUMER_ADOPTION_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-gh-safe-full-e2e-real-v1.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/gh-safe-real-consumer-adoption-v1.mjs'
      - 'cerebro/tests/gh-safe-real-consumer-adoption-v1.test.mjs'
      - 'cerebro/registry/gh-safe-real-consumer-adoption-v1.json'
      - 'cerebro/docs/GH_SAFE_REAL_CONSUMER_ADOPTION_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-gh-safe-full-e2e-real-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  strict-real-consumer-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical factory registry remains valid
        working-directory: cerebro
        run: npm run validate

      - name: Preserve legacy GH-SAFE and Lote 1+2 runtimes
        run: |
          git diff --exit-code 022d3f0429dace89ff42d17783967d9a67065960 -- \
            cerebro/runtime/github-safe-native-v1.mjs \
            cerebro/skills/skill-cerebro-github-wrapper.mjs \
            cerebro/registry/capability-gh-safe-native.v1.json \
            cerebro/registry/skill-github-full-safe-preprod.v1.json \
            cerebro/runtime/native-capability-operational-loop-v1.mjs \
            cerebro/runtime/native-capability-continuous-improvement-v1.mjs \
            cerebro/registry/native-capability-operational-adoption-v1.json \
            cerebro/registry/native-capability-continuous-improvement-v1.json

      - name: Existing GH-SAFE contract plus strict real-consumer E2E
        run: >-
          node --test
          cerebro/tests/github-safe-native-v1.test.mjs
          cerebro/tests/gh-safe-real-consumer-adoption-v1.test.mjs
          cerebro/tests/native-capability-operational-loop-v1.test.mjs
          cerebro/tests/native-capability-continuous-improvement-v1.test.mjs

      - name: Execute strict GH-SAFE end-to-end route
        run: |
          mkdir -p /tmp/cerebro-ghsafe-real
          node cerebro/runtime/gh-safe-real-consumer-adoption-v1.mjs \
            --company fenix \
            --repo carlosjmunoz78/fenix-capital-inmo-map \
            --workdir /tmp/cerebro-ghsafe-real/state \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "${{ github.sha }}" \
            --out /tmp/cerebro-ghsafe-real/report.json

      - name: Strict FULL E2E REAL policy gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cerebro-ghsafe-real/report.json','utf8'));
          const expected=['FACT-001','QA-001','EVA-001','MIG-001','RBLD-001','DEP-001','OBSERV-001','FINOPS-001'];
          if(r.status!=='FULL_E2E_REAL_PREPROD'||r.full_e2e_real_preprod!==true)throw new Error('GH-SAFE strict FULL not green');
          if(JSON.stringify(r.required_consumers)!==JSON.stringify(expected))throw new Error('required consumer contract changed');
          if(r.owner_resolution.resolved_owner!=='FACT-001'||r.owner_resolution.legacy_operational_owner!=='SEC-001')throw new Error('owner discrepancy not resolved explicitly');
          if(r.consumer_coverage!==1||r.functional_consumer_coverage!==1||r.consumers.length!==8)throw new Error('functional coverage incomplete');
          if(r.missing_consumers.length||r.failed_consumers.length)throw new Error('consumer gaps remain');
          if(!r.consumers.every(x=>x.real_consumption===true&&Array.isArray(x.fields_used)&&x.fields_used.length>0&&x.outcome_hash))throw new Error('consumer semantic proof incomplete');
          const decisions={
            'FACT-001':'FACT_GITHUB_CHANGE_STAGED','QA-001':'QA_GITHUB_CHECKS_PASS','EVA-001':'TRIBUNAL_PASS','MIG-001':'MIGRATION_REVERSIBLE','RBLD-001':'ROLLBACK_REBUILD_VERIFIED','DEP-001':'PREPROD_PROMOTION_VERIFIED','OBSERV-001':'OBSERVABILITY_RECORDED','FINOPS-001':'FINOPS_ZERO_COST_RECORDED'
          };
          for(const [id,d] of Object.entries(decisions))if(r.consumer_map[id]?.decision!==d)throw new Error(`${id} did not functionally consume GH-SAFE output`);
          if(r.learning_sink?.engine_id!=='LRN-001'||r.learning_sink?.decision!=='LRN_FEEDBACK_PERSISTED'||r.continuous_improvement_feedback!==true)throw new Error('LRN feedback missing');
          if(r.state_persisted!==true||r.restartable!==true||r.idempotency_proven!==true)throw new Error('durable state not proven');
          if(r.additional_cost_eur!==0)throw new Error('zero-cost gate failed');
          const forbidden=['prod_authorized','prod_write_authorized','prod_deploy_authorized','prod_mutation_authorized','provider_write_authorized','crm_write_authorized','db_mutation_authorized','spend_authorized','trading_access','android_touched'];
          if(forbidden.some(k=>r[k]!==false))throw new Error('forbidden authority expanded');
          console.log(JSON.stringify({status:'GREEN',capability:r.capability_id,consumers:r.consumers.length,bundle_hash:r.bundle_hash,outcome_hash:r.outcome_hash}));
          NODE

      - name: Strict registry candidate gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('cerebro/registry/gh-safe-real-consumer-adoption-v1.json','utf8'));
          if(r.capability_id!=='GH-SAFE-NATIVE'||r.company_id!=='fenix'||r.engine_id!=='FACT-001'||r.environment!=='PREPROD')throw new Error('strict registry identity mismatch');
          if(r.required_consumers.length!==8||r.learning_sink.engine_id!=='LRN-001'||r.learning_sink.required_for_full!==true)throw new Error('consumer/LRN contract incomplete');
          if(!r.strict_gates.real_runtime_use_required||!r.strict_gates.semantic_mutation_tests_required||!r.strict_gates.evaluation_tribunal_required||!r.strict_gates.learning_feedback_required)throw new Error('strict gates weakened');
          const a=r.authority;
          if(a.prod_authorized||a.prod_write_authorized||a.prod_deploy_authorized||a.prod_mutation_authorized||a.provider_write_authorized||a.crm_write_authorized||a.db_mutation_authorized||a.spend_authorized||a.trading_access||a.android_touched||a.additional_cost_eur!==0)throw new Error('authority/cost expanded');
          NODE

      - name: Upload strict GH-SAFE evidence
        uses: actions/upload-artifact@v4
        with:
          name: gh-safe-full-e2e-real-v1-${{ github.run_id }}
          path: |
            /tmp/cerebro-ghsafe-real/report.json
            /tmp/cerebro-ghsafe-real/state
          retention-days: 30
          if-no-files-found: error
