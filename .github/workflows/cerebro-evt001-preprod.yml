name: CEREBRO EVT-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-data001-data-governance-v0-20260911']
    paths:
      - 'cerebro/platform/event-governance-engine.mjs'
      - 'cerebro/tests/event-governance-engine.test.mjs'
      - '.github/workflows/cerebro-evt001-preprod.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cerebro/tests/event-governance-engine.test.mjs
