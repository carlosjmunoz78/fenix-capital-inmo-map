name: CEREBRO NEURONAL Superparallel V1

on:
  push:
    branches:
      - 'cerebro/neuronal-superparallel-*'
      - 'cerebro/neuronal-max-autofill-*'
      - main
    paths:
      - 'cerebro/data/neuronal-superparallel-v1.json.gz.b64'
      - 'cerebro/runtime/neuronal-superparallel-source-v1.mjs'
      - 'cerebro/runtime/neuronal-superparallel-deepseek-v1.mjs'
      - 'cerebro/tests/neuronal-superparallel-source-v1.test.mjs'
      - 'cerebro/tests/neuronal-superparallel-4cpu-workflow-v1.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-daemon-dynamic-v1.test.mjs'
      - '.github/workflows/cerebro-neuronal-superparallel-v1.yml'
      - 'docs/CEREBRO_NEURONAL_SUPERPARALLEL_V1.md'
  pull_request:
    paths:
      - 'cerebro/data/neuronal-superparallel-v1.json.gz.b64'
      - 'cerebro/runtime/neuronal-superparallel-source-v1.mjs'
      - 'cerebro/runtime/neuronal-superparallel-deepseek-v1.mjs'
      - 'cerebro/tests/neuronal-superparallel-source-v1.test.mjs'
      - 'cerebro/tests/neuronal-superparallel-4cpu-workflow-v1.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-daemon-dynamic-v1.test.mjs'
      - '.github/workflows/cerebro-neuronal-superparallel-v1.yml'
      - 'docs/CEREBRO_NEURONAL_SUPERPARALLEL_V1.md'
  workflow_dispatch:
    inputs:
      units:
        description: 'Normal deterministic NEURONAL logical units per wave. Fair-share cap 100 under the verified shared Enterprise 360 pool.'
        required: false
        default: '100'
        type: string
      offset:
        description: 'Offset into the deterministic 6,449-submission campaign.'
        required: false
        default: '0'
        type: string
      run_deepseek:
        description: 'Explicit paid DeepSeek planning/challenger opt-in (max 8 concurrent).'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: cerebro-neuronal-superparallel-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  CEREBRO_SUPERVISOR_ENV: PREPROD
  CEREBRO_PROD_WRITE: 'false'
  CEREBRO_TRADING_ACCESS: 'false'
  CEREBRO_NEURONAL_OUT_DIR: artifacts/neuronal-superparallel-v1
  CEREBRO_NEURONAL_INNER_PARALLELISM: '4'

jobs:
  validate-materialize:
    name: Validate and materialize 6,449 submissions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild canonical source
        run: node cerebro/runtime/prepare-neuronal-source-v1.mjs
      - name: Syntax gates
        run: |
          node --check cerebro/runtime/neuronal-superparallel-source-v1.mjs
          node --check cerebro/runtime/neuronal-superparallel-deepseek-v1.mjs
      - name: Contract and DAG tests
        run: |
          node --test cerebro/tests/neuronal-superparallel-source-v1.test.mjs
          node --test cerebro/tests/neuronal-superparallel-4cpu-workflow-v1.test.mjs
      - name: Validate canonical campaign
        run: node cerebro/runtime/neuronal-superparallel-source-v1.mjs --mode=validate
      - name: Materialize all 6,449 submissions as durable campaign artifact
        run: node cerebro/runtime/neuronal-superparallel-source-v1.mjs --mode=materialize
      - uses: actions/upload-artifact@v4
        with:
          name: neuronal-superparallel-campaign-${{ github.run_id }}
          path: artifacts/neuronal-superparallel-v1/
          retention-days: 7

  plan:
    name: Plan useful NEURONAL fair-share fanout
    needs: validate-materialize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      planned: ${{ steps.plan.outputs.planned }}
      physical_jobs: ${{ steps.plan.outputs.physical_jobs }}
      offset: ${{ steps.plan.outputs.offset }}
      next_offset: ${{ steps.plan.outputs.next_offset }}
      has_more: ${{ steps.plan.outputs.has_more }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild canonical source
        run: node cerebro/runtime/prepare-neuronal-source-v1.mjs
      - id: plan
        env:
          REQUESTED_UNITS: ${{ github.event_name == 'pull_request' && '20' || github.event_name == 'workflow_dispatch' && inputs.units || '100' }}
          REQUESTED_OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.offset || '0' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { planNeuronalFanoutV1 } from './cerebro/runtime/neuronal-superparallel-source-v1.mjs';
          const plan = planNeuronalFanoutV1({requested_units:Number(process.env.REQUESTED_UNITS),offset:Number(process.env.REQUESTED_OFFSET)});
          const batchSize = 4;
          const batches = [];
          for (let index=0; index<plan.matrix.length; index+=batchSize) {
            const rows = plan.matrix.slice(index,index+batchSize);
            if (rows.some(row=>String(row.submission_id).includes(','))) throw new Error('NEURONAL_SUBMISSION_ID_DELIMITER_UNSAFE');
            batches.push({batch_slot:Math.floor(index/batchSize),first_slot:rows[0].slot,logical_units:rows.length,submission_ids:rows.map(row=>row.submission_id).join(',')});
          }
          const nextOffset = plan.offset + plan.planned_units;
          const hasMore = nextOffset < 6449;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include:batches})}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `planned=${plan.planned_units}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `physical_jobs=${batches.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `offset=${plan.offset}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `next_offset=${nextOffset}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_more=${hasMore}\n`);
          console.log(JSON.stringify({logical_units:plan.planned_units,physical_jobs:batches.length,batch_size:batchSize,next_offset:nextOffset,has_more:hasMore,fair_share_logical_cap:100,physical_runner_cap:25}));
          NODE

  evidence-fanout:
    name: NEURONAL evidence batch · ${{ matrix.batch_slot }} · ${{ matrix.logical_units }} units
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild canonical source
        run: node cerebro/runtime/prepare-neuronal-source-v1.mjs
      - name: Collect up to four deterministic evidence units per runner
        env:
          SUBMISSION_IDS: ${{ matrix.submission_ids }}
          LOGICAL_UNITS: ${{ matrix.logical_units }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CEREBRO_SUPERVISOR_ENV" = PREPROD
          test "$CEREBRO_PROD_WRITE" = false
          test "$CEREBRO_TRADING_ACCESS" = false
          test "$CEREBRO_NEURONAL_INNER_PARALLELISM" -eq 4
          case "$LOGICAL_UNITS" in ''|*[!0-9]*) exit 2 ;; esac
          test "$LOGICAL_UNITS" -ge 1
          test "$LOGICAL_UNITS" -le "$CEREBRO_NEURONAL_INNER_PARALLELISM"
          IFS=',' read -r -a submissions <<< "$SUBMISSION_IDS"
          test "${#submissions[@]}" -eq "$LOGICAL_UNITS"
          pids=''
          for submission_id in "${submissions[@]}"; do
            test -n "$submission_id"
            node cerebro/runtime/neuronal-superparallel-source-v1.mjs --mode=evidence --submission="$submission_id" &
            pids="$pids $!"
          done
          for pid in $pids; do wait "$pid"; done
          count="$(find artifacts/neuronal-superparallel-v1/evidence -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$count" -eq "$LOGICAL_UNITS"
      - uses: actions/upload-artifact@v4
        with:
          name: neuronal-evidence-batch-${{ matrix.batch_slot }}-${{ github.run_id }}
          path: artifacts/neuronal-superparallel-v1/evidence/*.json
          if-no-files-found: error
          retention-days: 5

  deepseek-planning:
    name: NEURONAL DeepSeek shard ${{ matrix.shard }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deepseek }}
    needs: validate-materialize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CEREBRO_ALLOW_PAID_FANOUT: 'YES'
      CEREBRO_NEURONAL_PROJECTED_EUR_PER_SUBMISSION: '0.05'
      CEREBRO_NEURONAL_PROJECTED_USD_PER_SUBMISSION: '0.05'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild canonical source
        run: node cerebro/runtime/prepare-neuronal-source-v1.mjs
      - name: Execute bounded candidate planning
        run: node cerebro/runtime/neuronal-superparallel-deepseek-v1.mjs --mode=shard --shard=${{ matrix.shard }} --shards=8 --limit=32
      - uses: actions/upload-artifact@v4
        with:
          name: neuronal-deepseek-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/neuronal-superparallel-v1/deepseek/
          if-no-files-found: error
          retention-days: 5

  acceptance:
    name: NEURONAL launch acceptance and refill
    if: always()
    needs: [validate-materialize, plan, evidence-fanout, deepseek-planning]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record launch state
        run: |
          echo 'CEREBRO NEURONAL SUPERPARALLEL V1'
          echo 'canonical_submissions=6449'
          echo 'approved_requirements=493'
          echo 'planned_logical_discovery=${{ needs.plan.outputs.planned }}'
          echo 'planned_physical_jobs=${{ needs.plan.outputs.physical_jobs }}'
          echo 'discovery_offset=${{ needs.plan.outputs.offset }}'
          echo 'next_offset=${{ needs.plan.outputs.next_offset }}'
          echo 'has_more=${{ needs.plan.outputs.has_more }}'
          echo 'neuronal_inner_parallelism=4'
          echo 'enterprise_neuronal_logical_fair_share=100'
          echo 'enterprise_neuronal_physical_runner_cap=25'
          echo 'physical_runner_savings_at_100_logical=75'
          echo 'enterprise_shared_useful_pool=350'
          echo 'enterprise_control_reserve=10'
          echo 'enterprise_live_cap=360'
          echo 'deepseek_max_parallel=8'
          echo 'paid_deepseek_automatic=false'
          echo 'shared_enterprise_cap=true'
          echo 'discovery_completion_authority=false'
          echo 'second_queue=false'
          echo 'second_scheduler=false'
          echo 'second_daemon=false'
          echo 'prod_authorized=false'
          echo 'prod_write_authorized=false'
          echo 'trading_access=false'
      - name: Self-refill next non-overlapping NEURONAL wave
        if: ${{ github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.evidence-fanout.result == 'success' && needs.plan.outputs.has_more == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_OFFSET: ${{ needs.plan.outputs.next_offset }}
        shell: bash
        run: |
          set -euo pipefail
          critical_workflows=(
            'cerebro-enterprise-acceleration-v0.yml'
            'cerebro-global-capacity-controller-v1-ci.yml'
            'cerebro-auto001-preprod-patch-executor-v0.yml'
            'cerebro-auto001-prod-closure-v1.yml'
            'cerebro-governed-promotion-v1.yml'
            'cerebro-fact001-repair-worker-factory-v1.yml'
          )
          runs_json=''
          error_file="${RUNNER_TEMP}/neuronal-refill-gh-error.txt"
          for attempt in 1 2 3; do
            : > "$error_file"
            if runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" 2>"$error_file")"; then
              break
            fi
            if grep -qi 'rate limit' "$error_file"; then
              sleep "$((attempt * 2))"
              continue
            fi
            echo 'neuronal_self_refill=false' >> "$GITHUB_STEP_SUMMARY"
            echo 'drain_reason=CRITICAL_PRESSURE_CHECK_ERROR' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
          if [ -z "$runs_json" ]; then
            echo 'neuronal_self_refill=false' >> "$GITHUB_STEP_SUMMARY"
            echo 'drain_reason=GITHUB_API_RATE_LIMIT' >> "$GITHUB_STEP_SUMMARY"
            echo 'refill_fail_safe=true' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          critical_queued=0
          for workflow in "${critical_workflows[@]}"; do
            workflow_path=".github/workflows/${workflow}"
            count="$(printf '%s' "$runs_json" | jq --arg path "$workflow_path" '[.workflow_runs[] | select(.path == $path and (.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested"))] | length')"
            critical_queued=$((critical_queued + count))
          done
          if [ "$critical_queued" -gt 0 ]; then
            echo 'neuronal_self_refill=false' >> "$GITHUB_STEP_SUMMARY"
            echo 'drain_reason=CRITICAL_CONTROL_PRESSURE' >> "$GITHUB_STEP_SUMMARY"
            echo "critical_queued=$critical_queued" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/cerebro-neuronal-superparallel-v1.yml/dispatches" \
            --input - <<EOF
          {"ref":"main","inputs":{"units":"100","offset":"${NEXT_OFFSET}","run_deepseek":false}}
          EOF
          then
            echo 'neuronal_self_refill=false' >> "$GITHUB_STEP_SUMMARY"
            echo 'drain_reason=REFILL_DISPATCH_DEFERRED' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'neuronal_self_refill=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'critical_gate_priority=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'critical_pressure_api_calls=1' >> "$GITHUB_STEP_SUMMARY"
