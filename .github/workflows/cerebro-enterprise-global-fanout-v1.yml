name: CEREBRO Enterprise Global Fanout V1

on:
  workflow_dispatch:
    inputs:
      units:
        description: 'Useful PREPROD Mission DAG units buffered in this wave. Physical execution remains bounded by the verified live 180-runner cap.'
        required: false
        default: '360'
        type: string
      offset:
        description: 'Deterministic Mission DAG offset for the next non-overlapping wave.'
        required: false
        default: '0'
        type: string
  pull_request:
    paths:
      - '28_MACROFRENTES.md'
      - 'cerebro/registry/jarvis-project-registry.v1.json'
      - 'cerebro/runtime/mission-recursive-decomposer-v1.mjs'
      - 'cerebro/runtime/mission-derived-useful-work-v1.mjs'
      - 'cerebro/runtime/mission-real-work-router-v1.mjs'
      - 'cerebro/runtime/mission-fact001-scaffold-bridge-v1.mjs'
      - 'cerebro/runtime/fact001-request-runner.mjs'
      - 'cerebro/runtime/enterprise-global-fanout-v1.mjs'
      - 'cerebro/tests/mission-real-work-router-v1.test.mjs'
      - 'cerebro/tests/mission-fact001-scaffold-bridge-v1.test.mjs'
      - 'cerebro/tests/enterprise-global-fanout-v1.test.mjs'
      - 'cerebro/tests/enterprise-global-autostart-v1.test.mjs'
      - 'cerebro/config/github-enterprise-execution.v1.json'
      - '.github/workflows/cerebro-enterprise-global-fanout-v1.yml'
      - 'docs/CEREBRO_ENTERPRISE_GLOBAL_FANOUT_V1.md'
  push:
    branches: [main]
    paths:
      - '28_MACROFRENTES.md'
      - 'cerebro/registry/jarvis-project-registry.v1.json'
      - 'cerebro/runtime/mission-recursive-decomposer-v1.mjs'
      - 'cerebro/runtime/mission-derived-useful-work-v1.mjs'
      - 'cerebro/runtime/mission-real-work-router-v1.mjs'
      - 'cerebro/runtime/mission-fact001-scaffold-bridge-v1.mjs'
      - 'cerebro/runtime/fact001-request-runner.mjs'
      - 'cerebro/runtime/enterprise-global-fanout-v1.mjs'
      - 'cerebro/tests/mission-real-work-router-v1.test.mjs'
      - 'cerebro/tests/mission-fact001-scaffold-bridge-v1.test.mjs'
      - 'cerebro/tests/enterprise-global-fanout-v1.test.mjs'
      - 'cerebro/tests/enterprise-global-autostart-v1.test.mjs'
      - 'cerebro/config/github-enterprise-execution.v1.json'
      - '.github/workflows/cerebro-enterprise-global-fanout-v1.yml'
      - 'docs/CEREBRO_ENTERPRISE_GLOBAL_FANOUT_V1.md'

permissions:
  contents: read
  actions: write

concurrency:
  group: cerebro-enterprise-global-fanout-v1-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.offset || github.event_name == 'pull_request' && github.event.pull_request.number || 'seed' }}
  cancel-in-progress: false

env:
  CEREBRO_SUPERVISOR_ENV: PREPROD
  CEREBRO_PROD_WRITE: 'false'
  CEREBRO_TRADING_ACCESS: 'false'
  CEREBRO_ALLOW_PAID_FANOUT: 'NO'

jobs:
  plan:
    name: Governed global fanout plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix_a: ${{ steps.plan.outputs.matrix_a }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
      matrix_a_count: ${{ steps.plan.outputs.matrix_a_count }}
      matrix_b_count: ${{ steps.plan.outputs.matrix_b_count }}
      planned_units: ${{ steps.plan.outputs.planned_units }}
      effective_cap: ${{ steps.plan.outputs.effective_cap }}
      queue_buffer_cap: ${{ steps.plan.outputs.queue_buffer_cap }}
      paid_entitlement: ${{ steps.plan.outputs.paid_entitlement }}
      global_500_enabled: ${{ steps.plan.outputs.global_500_enabled }}
      offset: ${{ steps.plan.outputs.offset }}
      next_offset: ${{ steps.plan.outputs.next_offset }}
      has_more: ${{ steps.plan.outputs.has_more }}
      total_work_units: ${{ steps.plan.outputs.total_work_units }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contract tests
        run: |
          node --test cerebro/tests/enterprise-global-fanout-v1.test.mjs
          node --test cerebro/tests/enterprise-global-autostart-v1.test.mjs
          node --test cerebro/tests/mission-fact001-scaffold-bridge-v1.test.mjs
          node --test cerebro/tests/mission-real-work-router-v1.test.mjs
      - id: plan
        name: Discover unique useful Mission DAG work under live entitlement
        env:
          REQUESTED_UNITS: ${{ github.event_name == 'pull_request' && '20' || github.event_name == 'push' && '360' || inputs.units || '360' }}
          REQUESTED_OFFSET: ${{ github.event_name == 'pull_request' && '0' || github.event_name == 'push' && '0' || inputs.offset || '0' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { planEnterpriseGlobalFanoutV1 } from './cerebro/runtime/enterprise-global-fanout-v1.mjs';
          const policy = JSON.parse(fs.readFileSync('./cerebro/config/github-enterprise-execution.v1.json', 'utf8'));
          const plan = planEnterpriseGlobalFanoutV1({ policy, requested_units:Number(process.env.REQUESTED_UNITS), offset:Number(process.env.REQUESTED_OFFSET) });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix_a=${JSON.stringify({include:plan.matrix_a})}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix_b=${JSON.stringify({include:plan.matrix_b})}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix_a_count=${plan.matrix_a_count}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix_b_count=${plan.matrix_b_count}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `planned_units=${plan.planned_units}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `effective_cap=${plan.effective_physical_cap}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `queue_buffer_cap=${plan.queue_buffer_cap}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `paid_entitlement=${plan.enterprise_actions_concurrency_entitlement_verified}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `global_500_enabled=${plan.global_500_fanout_enabled}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `offset=${plan.offset}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `next_offset=${plan.next_offset}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_more=${plan.has_more}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `total_work_units=${plan.total_work_units}\n`);
          console.log(JSON.stringify({state_type:plan.state_type,requested_units:plan.requested_units,planned_units:plan.planned_units,offset:plan.offset,next_offset:plan.next_offset,has_more:plan.has_more,total_work_units:plan.total_work_units,effective_physical_cap:plan.effective_physical_cap,queue_buffer_cap:plan.queue_buffer_cap,matrix_a_count:plan.matrix_a_count,matrix_b_count:plan.matrix_b_count,prod_authorized:false,trading_access:false}));
          NODE

  fanout-a:
    name: Global A · ${{ matrix.work_unit_id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute one finite unique Mission DAG unit
        env:
          LANE: ${{ matrix.lane }}
          CYCLE: ${{ matrix.cycle }}
          EXPECTED_WORK_UNIT_ID: ${{ matrix.work_unit_id }}
          CEREBRO_MISSION_WORK_OUT_DIR: artifacts/enterprise-global-fanout-v1
          CEREBRO_MISSION_FACT001_OUT_DIR: artifacts/mission-fact001-scaffold-v1
        shell: bash
        run: |
          set -euo pipefail
          test "$CEREBRO_SUPERVISOR_ENV" = PREPROD
          test "$CEREBRO_PROD_WRITE" = false
          test "$CEREBRO_TRADING_ACCESS" = false
          test "$CEREBRO_ALLOW_PAID_FANOUT" = NO
          result="$(node cerebro/runtime/mission-real-work-router-v1.mjs --lane="$LANE" --cycle="$CYCLE" --fallback=true)"
          printf '%s\n' "$result"
          RESULT_JSON="$result" node --input-type=module <<'NODE'
          const lines=String(process.env.RESULT_JSON||'').trim().split(/\r?\n/).filter(Boolean); const result=JSON.parse(lines.at(-1));
          if(!result.ok) throw new Error('GLOBAL_FANOUT_WORK_FAILED');
          if(result.work_unit_id!==process.env.EXPECTED_WORK_UNIT_ID) throw new Error(`GLOBAL_FANOUT_WORK_ID_MISMATCH:${result.work_unit_id}`);
          if(result.paid_ai_used!==false||result.prod_write_authorized!==false||result.trading_access!==false) throw new Error('GLOBAL_FANOUT_AUTHORITY_EXPANSION_DENIED');
          NODE
      - name: Persist FACT-001 scaffold artifact
        if: ${{ matrix.work_unit_id == 'M16.implement.scaffold' || matrix.work_unit_id == 'M18.implement.scaffold' }}
        uses: actions/upload-artifact@v4
        with:
          name: fact001-${{ matrix.work_unit_id }}-${{ github.run_id }}
          path: artifacts/mission-fact001-scaffold-v1
          if-no-files-found: error
          retention-days: 14

  fanout-b:
    name: Global B · ${{ matrix.work_unit_id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute one finite unique Mission DAG unit
        env:
          LANE: ${{ matrix.lane }}
          CYCLE: ${{ matrix.cycle }}
          EXPECTED_WORK_UNIT_ID: ${{ matrix.work_unit_id }}
          CEREBRO_MISSION_WORK_OUT_DIR: artifacts/enterprise-global-fanout-v1
          CEREBRO_MISSION_FACT001_OUT_DIR: artifacts/mission-fact001-scaffold-v1
        shell: bash
        run: |
          set -euo pipefail
          test "$CEREBRO_SUPERVISOR_ENV" = PREPROD
          test "$CEREBRO_PROD_WRITE" = false
          test "$CEREBRO_TRADING_ACCESS" = false
          test "$CEREBRO_ALLOW_PAID_FANOUT" = NO
          result="$(node cerebro/runtime/mission-real-work-router-v1.mjs --lane="$LANE" --cycle="$CYCLE" --fallback=true)"
          printf '%s\n' "$result"
          RESULT_JSON="$result" node --input-type=module <<'NODE'
          const lines=String(process.env.RESULT_JSON||'').trim().split(/\r?\n/).filter(Boolean); const result=JSON.parse(lines.at(-1));
          if(!result.ok) throw new Error('GLOBAL_FANOUT_WORK_FAILED');
          if(result.work_unit_id!==process.env.EXPECTED_WORK_UNIT_ID) throw new Error(`GLOBAL_FANOUT_WORK_ID_MISMATCH:${result.work_unit_id}`);
          if(result.paid_ai_used!==false||result.prod_write_authorized!==false||result.trading_access!==false) throw new Error('GLOBAL_FANOUT_AUTHORITY_EXPANSION_DENIED');
          NODE
      - name: Persist FACT-001 scaffold artifact
        if: ${{ matrix.work_unit_id == 'M16.implement.scaffold' || matrix.work_unit_id == 'M18.implement.scaffold' }}
        uses: actions/upload-artifact@v4
        with:
          name: fact001-${{ matrix.work_unit_id }}-${{ github.run_id }}
          path: artifacts/mission-fact001-scaffold-v1
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Global fanout V1 acceptance
    needs: [plan, fanout-a, fanout-b]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record bounded global fanout acceptance
        run: |
          echo 'CEREBRO Enterprise Global Fanout V1 GREEN'
          echo 'planned_units=${{ needs.plan.outputs.planned_units }}'
          echo 'offset=${{ needs.plan.outputs.offset }}'
          echo 'next_offset=${{ needs.plan.outputs.next_offset }}'
          echo 'has_more=${{ needs.plan.outputs.has_more }}'
          echo 'total_work_units=${{ needs.plan.outputs.total_work_units }}'
          echo 'matrix_a=${{ needs.plan.outputs.matrix_a_count }}'
          echo 'matrix_b=${{ needs.plan.outputs.matrix_b_count }}'
          echo 'effective_physical_cap=${{ needs.plan.outputs.effective_cap }}'
          echo 'queue_buffer_cap=${{ needs.plan.outputs.queue_buffer_cap }}'
          echo 'paid_actions_concurrency_entitlement=${{ needs.plan.outputs.paid_entitlement }}'
          echo 'global_500_fanout_enabled=${{ needs.plan.outputs.global_500_enabled }}'
          echo 'mission_real_work_router=true'
          echo 'fact001_scaffold_routes=M16,M18'
          echo 'second_queue=false'
          echo 'second_scheduler=false'
          echo 'second_daemon=false'
          echo 'buffered_queue=true'
          echo 'self_refill=true'
          echo 'prod_authorized=false'
          echo 'trading_access=false'
      - name: Self-refill next non-overlapping buffered wave
        if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.has_more == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_OFFSET: ${{ needs.plan.outputs.next_offset }}
          QUEUE_BUFFER_CAP: ${{ needs.plan.outputs.queue_buffer_cap }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/cerebro-enterprise-global-fanout-v1.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}" \
            -f "inputs[units]=${QUEUE_BUFFER_CAP}" \
            -f "inputs[offset]=${NEXT_OFFSET}"
          echo "self_refilled=true" >> "$GITHUB_STEP_SUMMARY"
          echo "next_offset=${NEXT_OFFSET}" >> "$GITHUB_STEP_SUMMARY"
          echo "queue_buffer_cap=${QUEUE_BUFFER_CAP}" >> "$GITHUB_STEP_SUMMARY"
          echo "physical_cap=180" >> "$GITHUB_STEP_SUMMARY"
          echo "paid_ai=false" >> "$GITHUB_STEP_SUMMARY"
          echo "prod_write=false" >> "$GITHUB_STEP_SUMMARY"
          echo "trading=false" >> "$GITHUB_STEP_SUMMARY"
