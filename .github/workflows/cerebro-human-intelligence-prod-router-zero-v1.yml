name: CEREBRO Human Intelligence PROD Router ZERO V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/human-intelligence/integration/prod-router-zero-v1.mjs'
      - 'cerebro/human-intelligence/integration/promotion-controller-v1.mjs'
      - 'cerebro/human-intelligence/PROD_GRADUAL_PROMOTION_AUTHORIZATION_2026-10-13.md'
      - 'cerebro/tests/human-intelligence-prod-router-zero-v1.test.mjs'
      - 'cerebro/tests/human-intelligence-autonomy-bridge-v1.test.mjs'
      - 'supabase/functions/cerebro-console-human-router-zero-v1/**'
      - '.github/workflows/cerebro-human-intelligence-prod-router-zero-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cerebro-human-intelligence-prod-router-zero-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  ROUTER_AUDIENCE: cerebro-console-human-router-zero-v1
  PREPROD_ROUTER_URL: https://hnqlnvakzaywtafeiybt.supabase.co/functions/v1/cerebro-console-human-router-zero-v1
  PROD_ROUTER_URL: https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-human-router-zero-v1

jobs:
  zero-router-preprod-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test ownership separation and ZERO router contracts
        run: |
          node --test \
            cerebro/tests/human-intelligence-autonomy-bridge-v1.test.mjs \
            cerebro/tests/human-intelligence-prod-router-zero-v1.test.mjs

      - name: Assert stable authority is untouched and router is compiled to zero
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          d='supabase/functions/cerebro-console-human-router-zero-v1'
          r="$d/index.ts"
          s="$d/router.ts"
          a="$d/auth.ts"
          test -f "$r" && test -f "$s" && test -f "$a"
          grep -F "export const LIVE_CANARY_PERCENT=0;" "$s"
          grep -F "cerebro-console-gateway-v0" "$r"
          grep -F "cerebro-console-gateway-human-v1-canary" "$r"
          grep -F "PREPROD_NORMAL_ROUTING_DISABLED" "$r"
          grep -F "consumer_routing_enabled:false" "$r"
          ! grep -F 'SUPABASE_SERVICE_ROLE_KEY' "$r" "$s" "$a"
          ! grep -Eq 'prod_write_authorized[[:space:]]*:[[:space:]]*true|trading_access[[:space:]]*:[[:space:]]*true' "$r" "$s" "$a"
          base="${PR_BASE_SHA:-}"
          if [ -z "$base" ]; then base="$(git rev-parse origin/main)"; fi
          git cat-file -e "${base}^{commit}"
          git diff --exit-code "${base}"...HEAD -- supabase/functions/cerebro-console-gateway-v0

      - name: Assert owner authorization for phased PROD promotion
        shell: bash
        run: |
          set -euo pipefail
          auth='cerebro/human-intelligence/PROD_GRADUAL_PROMOTION_AUTHORIZATION_2026-10-13.md'
          test -f "$auth"
          grep -F 'promoción gradual del gran motor conversacional hasta el 100% en PROD' "$auth"
          grep -F 'No big-bang.' "$auth"
          grep -F 'OLD `cerebro-console-gateway-v0` permanece disponible como rollback' "$auth"

      - name: Acquire short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ROUTER_AUDIENCE}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$url" | jq -r '.value' > /tmp/cerebro-human-router-oidc
          test -s /tmp/cerebro-human-router-oidc
          chmod 600 /tmp/cerebro-human-router-oidc

      - name: Physical PREPROD router health proves ZERO and no consumer routing
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-router-oidc)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            "${PREPROD_ROUTER_URL}/router/health" > /tmp/health.json
          jq -e '.ok==true and .environment=="PREPROD_ROUTER_ZERO_TEST" and .stable_authority=="cerebro-console-gateway-v0" and .candidate_overlay=="cerebro-console-gateway-human-v1-canary" and .live_canary_percent==0 and .consumer_routing_enabled==false and .fail_closed_target=="OLD" and .live_upstream_called==false and .prod_write_authorized==false and .trading_access==false and .additional_cost_eur==0' /tmp/health.json >/dev/null

      - name: Physical PROD router health proves deployed ZERO and fail-closed OLD
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-router-oidc)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            "${PROD_ROUTER_URL}/router/health" > /tmp/prod-health.json
          jq -e '.ok==true and .environment=="PROD_ROUTER_ZERO_UNROUTED" and .stable_authority=="cerebro-console-gateway-v0" and .candidate_overlay=="cerebro-console-gateway-human-v1-canary" and .live_canary_percent==0 and .consumer_routing_enabled==false and .fail_closed_target=="OLD" and .live_upstream_called==false and .prod_write_authorized==false and .trading_access==false and .additional_cost_eur==0' /tmp/prod-health.json >/dev/null

      - name: Physical PREPROD synthetic cohort rehearsal never calls upstream or mutates route
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/cerebro-human-router-oidc)"
          cat > /tmp/rehearsal.json <<'JSON'
          {"requested_percent":1,"cohort_keys":["synthetic-a","synthetic-b","synthetic-c","synthetic-d","synthetic-e"]}
          JSON
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/rehearsal.json \
            "${PREPROD_ROUTER_URL}/router/rehearsal" > /tmp/rehearsal-out.json
          jq -e '.ok==true and .live_canary_percent==0 and .requested_rehearsal_percent==1 and (.decisions|length)==5 and .safety.synthetic_only==true and .safety.live_upstream_called==false and .safety.route_state_mutated==false and .safety.consumer_routing_enabled==false and .safety.prod_write_authorized==false and .safety.trading_access==false and .safety.additional_cost_eur==0' /tmp/rehearsal-out.json >/dev/null

      - name: PREPROD normal route is physically fail-closed
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/normal.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"message":"synthetic"}' "${PREPROD_ROUTER_URL}/chat")"
          test "$code" = '503'
          jq -e '.error=="PREPROD_NORMAL_ROUTING_DISABLED" and .fail_closed==true and .live_upstream_called==false' /tmp/normal.json >/dev/null

      - name: Record gate boundary
        run: |
          echo 'GREEN proves phase 0 only: the ZERO router is physically deployed in PREPROD and PROD, compiled to NEW=0%, fail-closed to OLD and without new PROD/Trading authority.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No consumer URL changes in this PR. Consumer cutover remains a separate governed App/PROD change.' >> "$GITHUB_STEP_SUMMARY"
