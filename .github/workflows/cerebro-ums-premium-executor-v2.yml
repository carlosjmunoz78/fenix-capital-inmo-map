name: CEREBRO UMS Premium Executor V2

on:
  workflow_dispatch:
  push:
    branches:
      - 'cerebro/ums-physical-production-executor-*'
    paths:
      - 'cerebro/media-studio/v2/runtime/production-job-contract.mjs'
      - 'cerebro/media-studio/v2/runtime/physical-capability-registry.mjs'
      - 'cerebro/media-studio/v2/runtime/media-production-queue.mjs'
      - 'cerebro/media-studio/v2/runtime/premium-production-executor.mjs'
      - 'cerebro/media-studio/v2/runtime/premium-physical-renderer-v2.mjs'
      - 'cerebro/media-studio/v2/runtime/premium-deliverable-gate-v1.mjs'
      - 'cerebro/media-studio/v2/runtime/premium-audio-master-v1.mjs'
      - 'cerebro/media-studio/v2/runtime/premium-voice-kokoro.py'
      - 'cerebro/media-studio/v2/runtime/bm13-fenix-cinematic-scene.py'
      - 'cerebro/media-studio/v2/runtime/bm13-physical-proof.mjs'
      - 'cerebro/media-studio/v2/runtime/studio-quality-standard.mjs'
      - 'cerebro/media-studio/v2/tests/premium-production-executor-v2.test.mjs'
      - 'cerebro/media-studio/v2/orders/bm13-fenix-premium-trial-v2.json'
      - '.github/workflows/cerebro-ums-premium-executor-v2.yml'

concurrency:
  group: cerebro-ums-bm13-physical-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  premium-executor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run premium executor and regression gates
        run: >-
          node --test
          cerebro/media-studio/v2/tests/premium-production-executor-v2.test.mjs
          cerebro/media-studio/v2/tests/premium-creative-preflight-gate.test.mjs
          cerebro/media-studio/v2/tests/production-quality-gate.test.mjs
          cerebro/media-studio/v2/tests/ums-production-job-runner.test.mjs

  bm13-physical-proof:
    needs: premium-executor-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER_VERSION: '5.2.3'
      BLENDER_ARCHIVE: 'blender-5.2.3-linux-x64.tar.xz'
      CEREBRO_UMS_EXPORT_DIR: '${{ github.workspace }}/dist/ums-bm13-physical-v2'
      HF_HOME: '${{ runner.temp }}/cerebro-hf-cache'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install zero-cost Spanish neural voice runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v espeak-ng >/dev/null 2>&1; then
            sudo apt-get update -qq
            timeout 120s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends espeak-ng libsndfile1
          fi
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check --no-input 'kokoro>=0.9.4,<1' soundfile
          python - <<'PY'
          from kokoro import KPipeline
          p=KPipeline(lang_code='e', device='cpu')
          print('KOKORO_SPANISH_CPU=READY', type(p).__name__)
          PY

      - name: Install isolated static FFmpeg toolchain and Montserrat
        shell: bash
        run: |
          set -euo pipefail
          for bin in curl xz fc-match; do
            command -v "$bin" >/dev/null 2>&1 || { echo "$bin=MISSING"; exit 31; }
            echo "$bin=READY:$(command -v "$bin")"
          done
          toolroot="$RUNNER_TEMP/cerebro-ums-media-tools"
          mkdir -p "$toolroot/npm" "$toolroot/bin"
          cd "$toolroot/npm"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --save-exact ffmpeg-static@5.2.0 ffprobe-static@3.1.0
          ffmpeg_src="$(node -p "require('ffmpeg-static')")"
          ffprobe_src="$(node -p "require('ffprobe-static').path")"
          test -x "$ffmpeg_src"
          test -x "$ffprobe_src"
          ln -sf "$ffmpeg_src" "$toolroot/bin/ffmpeg"
          ln -sf "$ffprobe_src" "$toolroot/bin/ffprobe"
          echo "$toolroot/bin" >> "$GITHUB_PATH"
          export PATH="$toolroot/bin:$PATH"
          mkdir -p "$HOME/.local/share/fonts/montserrat"
          curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 45 -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf' -o "$HOME/.local/share/fonts/montserrat/Montserrat.ttf"
          fc-cache -f "$HOME/.local/share/fonts"
          ffmpeg -version | head -1
          ffprobe -version | head -1
          fc-match Montserrat

      - name: Install and verify Blender 5.2.3 official binary
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 3 --connect-timeout 15 -fsSLO "https://download.blender.org/release/Blender5.2/${BLENDER_ARCHIVE}"
          curl --retry 3 --retry-delay 3 --connect-timeout 15 -fsSLO "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}.sha256"
          grep " ${BLENDER_ARCHIVE}$" "blender-${BLENDER_VERSION}.sha256" | sha256sum -c -
          tar -xf "${BLENDER_ARCHIVE}"
          echo "BLENDER_BIN=${GITHUB_WORKSPACE}/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
          "${GITHUB_WORKSPACE}/blender-${BLENDER_VERSION}-linux-x64/blender" --version | head -2

      - name: Ensure minimal EGL runtime for headless Eevee
        shell: bash
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -F 'libEGL.so.1' >/dev/null; then
            echo 'libEGL.so.1=MISSING; installing libegl1 only'
            timeout 90s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1
          fi
          ldconfig -p | grep -F 'libEGL.so.1' >/dev/null || { echo 'libEGL.so.1=STILL_MISSING'; exit 42; }
          echo 'libEGL.so.1=READY'

      - name: Execute BM13 physical premium proof
        run: |
          set -euo pipefail
          node --check cerebro/media-studio/v2/runtime/premium-physical-renderer-v2.mjs
          node --check cerebro/media-studio/v2/runtime/premium-audio-master-v1.mjs
          node --check cerebro/media-studio/v2/runtime/premium-deliverable-gate-v1.mjs
          python -m py_compile cerebro/media-studio/v2/runtime/premium-voice-kokoro.py
          node cerebro/media-studio/v2/runtime/bm13-physical-proof.mjs | tee bm13-physical-proof.log
          test -s dist/ums-bm13-physical-v2/FENIX_CAPITAL_BM13_PREMIUM_PHYSICAL_V2.mp4
          test -s dist/ums-bm13-physical-v2/FENIX_CAPITAL_BM13_CONTACT_SHEET.jpg
          test -s dist/ums-bm13-physical-v2/FENIX_CAPITAL_BM13_EVIDENCE.json
          test -s dist/ums-bm13-physical-v2/FENIX_CAPITAL_BM13_VOICE_EVIDENCE.json
          test -s dist/ums-bm13-physical-v2/FENIX_CAPITAL_BM13_AUDIO_MASTER_EVIDENCE.json
          sha256sum dist/ums-bm13-physical-v2/* > dist/ums-bm13-physical-v2/SHA256SUMS.txt

      - name: Upload physical proof package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FENIX-BM13-PREMIUM-PHYSICAL-V2
          path: dist/ums-bm13-physical-v2/
          if-no-files-found: warn
          retention-days: 14
