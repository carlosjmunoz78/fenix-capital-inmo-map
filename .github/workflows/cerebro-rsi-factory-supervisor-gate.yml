name: CEREBRO RSI Factory Supervisor Gate
on:
  pull_request:
    paths:
      - 'cerebro/runtime/factory-supervisor-improvement.mjs'
      - 'cerebro/tests/factory-supervisor-improvement.test.mjs'
      - 'cerebro/docs/RSI_FACTORY_SUPERVISOR_SELF_IMPROVEMENT_V0.md'
      - '.github/workflows/cerebro-rsi-factory-supervisor-gate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  block-i-factory-supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node --test cerebro/tests/factory-supervisor-improvement.test.mjs
