name: CEREBRO Connect Existing Engines

on:
  push:
    branches:
      - cerebro-connect-existing-engines-20261102
    paths:
      - 'cerebro/missions/connect-existing-engines-v1.mjs'
      - 'cerebro/registry/dependency-overlay-policy.v1.json'
      - '.github/workflows/cerebro-connect-existing-engines.yml'
      - 'cerebro/factory.mjs'
      - 'cerebro/factory-v1.mjs'
      - 'cerebro/registry/engine-registry.v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-connect-existing-engines-${{ github.ref }}
  cancel-in-progress: false

env:
  EXACT_SOURCE_SHA: ${{ github.sha }}
  OUT: /tmp/cerebro-connect-existing-engines

jobs:
  connect-validate-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_SHA }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Assert isolated LAB PREPROD branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
          test "$GITHUB_REF_NAME" = 'cerebro-connect-existing-engines-20261102'
          test "$GITHUB_REF_NAME" != 'main'

      - name: Install repository-declared dependencies only
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Syntax and canonical Factory gates
        shell: bash
        run: |
          set -euo pipefail
          node --check cerebro/missions/connect-existing-engines-v1.mjs
          cd cerebro
          npm run validate
          node factory-v1.mjs validate --registry registry/engine-registry.v1.json

      - name: Regression gate preserving intentionally paused worker baseline
        working-directory: cerebro
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find tests -maxdepth 1 -name '*.test.mjs' \
            ! -name 'continuous-worker-entitlement-drain-canary-v1.test.mjs' \
            ! -name 'continuous-worker-job001-control-plane-binding-v1.test.mjs' \
            -print | sort)
          test "${#TESTS[@]}" -gt 0
          node --test "${TESTS[@]}"
          git diff --exit-code HEAD^ -- \
            .github/workflows/cerebro-continuous-useful-worker-v1.yml \
            cerebro/tests/continuous-worker-entitlement-drain-canary-v1.test.mjs \
            cerebro/tests/continuous-worker-job001-control-plane-binding-v1.test.mjs
          printf '%s\n' 'KNOWN_BASELINE_DEFERRED: continuous worker remains intentionally paused and untouched.'

      - name: Build evidence-gated connection overlay for L0 L1 L2 L6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          node cerebro/missions/connect-existing-engines-v1.mjs --out "$OUT" 2>&1 | tee /tmp/CEREBRO_CONNECT_RUNNER_LOG.txt

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-connect-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/CEREBRO_CONNECT_RUNNER_LOG.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify mission reports
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p=process.env.OUT;
          const s=JSON.parse(fs.readFileSync(`${p}/MISSION_SUMMARY.json`));
          const b=JSON.parse(fs.readFileSync(`${p}/ENGINE_CONNECTION_BASELINE.json`));
          const t=JSON.parse(fs.readFileSync(`${p}/TEST_REPORT.json`));
          const r=JSON.parse(fs.readFileSync(`${p}/REBUILD_PROOF.json`));
          if(s.status!=='GREEN'||s.registry_total!==179||s.priority_engines!==67||s.blocked!==0||s.additional_cost_eur!==0||s.prod_touched!==false||s.trading_touched!==false) throw new Error('mission summary gate failed');
          if(b.layer_counts.L0!==13||b.layer_counts.L1!==14||b.layer_counts.L2!==15||b.layer_counts.L6!==25||b.registry_mutated!==false||b.factory_mutated!==false) throw new Error('baseline gate failed');
          if(t.status!=='GREEN'||t.failed!==0||t.all_checks_passed!==true) throw new Error('tests not green');
          if(r.status!=='GREEN'||r.priority_engine_count!==67||r.all_hashes_equal!==true) throw new Error('rebuild not deterministic');
          console.log('MISSION_METRICS='+JSON.stringify({registry:s.registry_total,priority:s.priority_engines,layers:s.layers,physically_connected:s.physically_connected,scaffold_only:s.scaffold_only,verified_runtime_dependency_edges:s.verified_runtime_dependency_edges,inferred_candidate_edges:s.inferred_candidate_edges,blocked:s.blocked,test_assertions:s.test_assertions,rebuild:s.rebuild,cost_eur:s.additional_cost_eur,p23:s.p23}));
          NODE

      - name: Prove canonical sources unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            cerebro/registry/engine-registry.v1.json \
            cerebro/factory.mjs \
            cerebro/factory-v1.mjs

      - name: Build continuity package
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/CEREBRO_CONNECT_RUNNER_LOG.txt "$OUT/RUNNER_LOG.txt"
          printf '%s\n' "$EXACT_SOURCE_SHA" > "$OUT/SOURCE_SHA.txt"
          (cd /tmp && zip -qr CEREBRO_CONNECT_EXISTING_ENGINES_2026-11-02.zip "$(basename "$OUT")")
          sha256sum /tmp/CEREBRO_CONNECT_EXISTING_ENGINES_2026-11-02.zip | tee "$OUT/CONTINUITY_PACKAGE_SHA256.txt"

      - name: Upload full evidence and continuity package
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-connect-existing-engines-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/cerebro-connect-existing-engines
            /tmp/CEREBRO_CONNECT_EXISTING_ENGINES_2026-11-02.zip
          if-no-files-found: error
          retention-days: 30

      - name: Mission boundary
        shell: bash
        run: |
          echo 'Canonical Registry remains 179 and immutable.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Priority wave is 67 engines: L0=13, L1=14, L2=15, L6=25.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only verified runtime dependency evidence enters the effective graph.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Weak/documentary references remain candidates and are not canonicalized.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PROD and Trading LAB untouched; additional cost 0 EUR.' >> "$GITHUB_STEP_SUMMARY"
