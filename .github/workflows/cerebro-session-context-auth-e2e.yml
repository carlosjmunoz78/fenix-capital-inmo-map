name: CEREBRO Session Context Auth E2E Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/cerebro-secdef-canary-auth-e2e.sh'
      - '.github/workflows/cerebro-session-context-auth-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-read-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_URL: https://cluhljgonannaafpmblx.supabase.co
      PROD_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
      CEREBRO_E2E_TEST_EMAIL: ${{ secrets.CEREBRO_E2E_TEST_EMAIL || 'cerebro-e2e@fenixcapital.es' }}
      CEREBRO_E2E_TEST_PASSWORD: ${{ secrets.CEREBRO_E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Acquire FRESH test-user JWT; no fixed owner token and no green skip
        shell: bash
        run: bash scripts/cerebro-e2e-ephemeral-session.sh

      - name: Run authenticated read-only OLD vs NEW parity
        shell: bash
        run: bash scripts/cerebro-secdef-canary-auth-e2e.sh

      - name: Classify gate
        shell: bash
        run: |
          test "${CEREBRO_E2E_AUTH_MODE:-}" = 'EPHEMERAL_PASSWORD_GRANT'
          echo 'SESSION_CONTEXT_AUTH_HTTP_E2E=EXECUTED_FRESH_JWT'
