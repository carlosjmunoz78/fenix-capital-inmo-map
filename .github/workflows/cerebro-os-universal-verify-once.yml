name: CEREBRO OS Universal PREPROD Verify Once

on:
  push:
    branches:
      - work/finops-supabase-offload-wave1-2026-09-28
    paths:
      - ".github/workflows/cerebro-os-universal-verify-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify universal plugin status
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --max-time 20             -o /tmp/cerebro-os-status.json             -w '%{http_code}'             https://staging.fenixcapital.es/wp-json/cerebro-os/v1/status)
          echo "HTTP_STATUS=$status"
          cat /tmp/cerebro-os-status.json
          test "$status" = "200"
          grep -Fq '"ok":true' /tmp/cerebro-os-status.json
          grep -Fq '"engine_id":"PLUGIN-UNIVERSAL-001"' /tmp/cerebro-os-status.json
          grep -Fq '"environment":"PREPROD"' /tmp/cerebro-os-status.json
          echo 'CEREBRO_OS_UNIVERSAL_PREPROD=PASS'
