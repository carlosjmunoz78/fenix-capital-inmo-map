name: CEREBRO Generate All Engine Skeletons

on:
  push:
    branches:
      - cerebro-generate-all-engine-skeletons-20261102
    paths:
      - 'cerebro/missions/generate-all-engine-skeletons-v1.mjs'
      - '.github/workflows/cerebro-generate-all-engine-skeletons.yml'
      - 'cerebro/factory.mjs'
      - 'cerebro/factory-v1.mjs'
      - 'cerebro/registry/engine-registry.v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-generate-all-engine-skeletons-${{ github.ref }}
  cancel-in-progress: false

env:
  EXACT_SOURCE_SHA: ${{ github.sha }}
  OUT: /tmp/cerebro-generate-all-engine-skeletons

jobs:
  generate-validate-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_SHA }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Assert isolated non-PROD branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE_SHA"
          test "$GITHUB_REF_NAME" = 'cerebro-generate-all-engine-skeletons-20261102'
          test "$GITHUB_REF_NAME" != 'main'

      - name: Install repository-declared dependencies only
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Regression gate for existing CEREBRO preserving intentional paused-worker baseline
        working-directory: cerebro
        shell: bash
        run: |
          set -euo pipefail
          npm run validate
          node factory-v1.mjs validate --registry registry/engine-registry.v1.json

          mapfile -t TESTS < <(find tests -maxdepth 1 -name '*.test.mjs' \
            ! -name 'continuous-worker-entitlement-drain-canary-v1.test.mjs' \
            ! -name 'continuous-worker-job001-control-plane-binding-v1.test.mjs' \
            -print | sort)
          test "${#TESTS[@]}" -gt 0
          node --test "${TESTS[@]}"

          # These two files are red on current main because the sustained worker is deliberately paused.
          # This mission must not reactivate or rewrite that existing behavior merely to force a green count.
          git diff --exit-code HEAD^ -- \
            .github/workflows/cerebro-continuous-useful-worker-v1.yml \
            cerebro/tests/continuous-worker-entitlement-drain-canary-v1.test.mjs \
            cerebro/tests/continuous-worker-job001-control-plane-binding-v1.test.mjs
          printf '%s\n' 'KNOWN_BASELINE_DEFERRED: continuous worker remains intentionally paused; mission made no change to it.'

      - name: Generate all 179 canonical engine skeletons through existing FACT-001 V1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          node cerebro/missions/generate-all-engine-skeletons-v1.mjs --out "$OUT" | tee "$OUT.runner.log"

      - name: Verify mission reports
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p=process.env.OUT;
          const summary=JSON.parse(fs.readFileSync(`${p}/MISSION_SUMMARY.json`));
          const baseline=JSON.parse(fs.readFileSync(`${p}/ENGINE_SCAFFOLD_BASELINE.json`));
          const tests=JSON.parse(fs.readFileSync(`${p}/TEST_REPORT.json`));
          const rebuild=JSON.parse(fs.readFileSync(`${p}/REBUILD_PROOF.json`));
          if(summary.status!=='GREEN'||summary.total_registry!==179||summary.new_scaffold_wrappers!==179||summary.blocked!==0||summary.additional_cost_eur!==0||summary.prod_touched!==false) throw new Error('mission summary gate failed');
          if(baseline.duplicate_ids.length||baseline.dependency_errors.length||baseline.version_errors.length||baseline.company_scope_errors.length) throw new Error('baseline validation failed');
          if(tests.status!=='GREEN'||tests.failed!==0||tests.all_checks_passed!==true) throw new Error('test report not green');
          if(rebuild.status!=='GREEN'||rebuild.engine_count!==179||rebuild.all_pack_hashes_equal!==true) throw new Error('global rebuild failed');
          console.log(JSON.stringify({summary,baseline:{total_registry:baseline.total_registry,existing_physical:baseline.existing_physical,partial:baseline.partial,documented_only:baseline.documented_only,missing_scaffold:baseline.missing_scaffold},tests:{total_assertions:tests.total_assertions,failed:tests.failed},rebuild:rebuild.status}));
          NODE

      - name: Build immutable continuity package
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT.runner.log" "$OUT/RUNNER_LOG.txt"
          printf '%s\n' "$EXACT_SOURCE_SHA" > "$OUT/SOURCE_SHA.txt"
          printf '%s\n' 'Two unrelated continuous-worker test files remain intentionally deferred because current main pauses that worker. No mission code changed that baseline.' > "$OUT/PREEXISTING_TEST_BASELINE.txt"
          (cd /tmp && zip -qr CEREBRO_GENERATE_ALL_ENGINE_SKELETONS_2026-11-02.zip "$(basename "$OUT")")
          sha256sum /tmp/CEREBRO_GENERATE_ALL_ENGINE_SKELETONS_2026-11-02.zip | tee "$OUT/CONTINUITY_PACKAGE_SHA256.txt"

      - name: Upload full scaffold and continuity package
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-generate-all-engine-skeletons-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/cerebro-generate-all-engine-skeletons
            /tmp/CEREBRO_GENERATE_ALL_ENGINE_SKELETONS_2026-11-02.zip
          if-no-files-found: error
          retention-days: 30

      - name: Mission boundary
        shell: bash
        run: |
          echo 'FACT-001 V1 preserved; no Factory V2 created.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical Registry count: 179; Registry not mutated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'All outputs are SCAFFOLD/LAB-PREPROD artifacts; no PROD promotion.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing intentionally paused continuous worker was not reactivated or modified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Additional cost: 0 EUR.' >> "$GITHUB_STEP_SUMMARY"
