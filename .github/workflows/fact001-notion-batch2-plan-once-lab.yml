name: FACT001 Notion Second 25 Encrypted Plan LAB One Shot
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/services/notion-batch-planner-lab/requests/execute-20261111.v1.json
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: fact001-notion-second-batch-plan-once
  cancel-in-progress: false
jobs:
  plan-readonly:
    if: github.actor == 'carlosjmunoz78' && startsWith(github.event.head_commit.message, 'FACT001_NOTION_SECOND_25_PLAN_RUN_ONCE_20261111')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify prior 25-page offsite backup and seal second plan with private OIDC service
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cerebro/connectors/universal/services/notion-batch-planner-lab/run-once.mjs
      - name: Publish encrypted-only plan and fail-closed report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fact001-notion-second-25-batch-plan-aes256gcm-20261111
          path: fact001-notion-batch2-plan-encrypted
          if-no-files-found: warn
          retention-days: 90