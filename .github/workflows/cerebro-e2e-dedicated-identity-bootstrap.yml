name: CEREBRO · Dedicated E2E identity bootstrap (NO OWNER PRIVILEGE)
on:
  push:
    branches: [cerebro/operativa-runtime-p0-handoff-20261118]
    paths:
      - cerebro/universal/v0/e2e-ephemeral-token.mjs
      - cerebro/universal/v0/e2e-ephemeral-token.test.mjs
      - .github/workflows/cerebro-e2e-dedicated-identity-bootstrap.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auth-contract-and-negative-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CEREBRO_E2E_TEST_PASSWORD: ${{ secrets.CEREBRO_E2E_TEST_PASSWORD }}
      PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: node --test cerebro/universal/v0/e2e-ephemeral-token.test.mjs
      - name: Validate dedicated account only when provisioned; no owner privilege
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$CEREBRO_E2E_TEST_PASSWORD" ]; then
            echo 'BLOCKED_CEREBRO_E2E_TEST_PASSWORD_NOT_CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
            exit 4
          fi
          node cerebro/universal/v0/e2e-ephemeral-token.mjs
          echo 'PASS_REAL_NEW_TOKEN_DEDICATED_SUPABASE_ACCOUNT'
      - name: Prove the technical account cannot access owner-only activity or directory
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CEREBRO_E2E_RUNTIME_JWT:-}" ] || { echo 'BLOCKED_NO_RUNTIME_JWT'; exit 4; }
          umask 077
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          activity='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-activity-v0/'
          dir='https://app.fenixcapital.es/api/cerebro-agent-directory?company_id=fenix&kind=ALL&limit=1'
          code="$(curl --max-time 15 -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $CEREBRO_E2E_RUNTIME_JWT" -H "apikey: $PROD_SUPABASE_PUBLISHABLE_KEY" "$activity")"
          case "$code" in 401|403) echo 'PASS_TECH_ACCOUNT_ACTIVITY_OWNER_DENIED';; *) echo "BLOCKED_TECH_ACTIVITY_UNEXPECTED_HTTP_$code"; exit 5;; esac
          code="$(curl --max-time 15 -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $CEREBRO_E2E_RUNTIME_JWT" -H "apikey: $PROD_SUPABASE_PUBLISHABLE_KEY" "$dir")"
          case "$code" in 401|403) echo 'PASS_TECH_ACCOUNT_DIRECTORY_OWNER_DENIED';; *) echo "BLOCKED_TECH_DIRECTORY_UNEXPECTED_HTTP_$code"; exit 6;; esac
          echo 'OWNER_PROD_GATE_NOT_REPLACED; APP_CRM_AUTH_UNCHANGED'
      - name: Revoke ephemeral test session at end of job
        if: always()
        shell: bash
        run: |
          if [ -n "${CEREBRO_E2E_RUNTIME_JWT:-}" ]; then
            curl --max-time 15 -sS -o /dev/null -X POST -H "Authorization: Bearer $CEREBRO_E2E_RUNTIME_JWT" -H "apikey: $PROD_SUPABASE_PUBLISHABLE_KEY" 'https://cluhljgonannaafpmblx.supabase.co/auth/v1/logout' || true
          fi
