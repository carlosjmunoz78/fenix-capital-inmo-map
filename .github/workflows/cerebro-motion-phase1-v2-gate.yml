name: CEREBRO MOTION-001 Phase 1 V2 Gate

on:
  pull_request:
    paths:
      - 'cerebro/runtime/motion001-neural-presence-v2.mjs'
      - 'cerebro/tests/motion001-neural-presence-v2.test.mjs'
      - '.github/workflows/cerebro-motion-phase1-v2-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neural-presence-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check cerebro/runtime/motion001-neural-presence-v2.mjs
      - name: Contract tests
        run: node --test cerebro/tests/motion001-neural-presence-v2.test.mjs
