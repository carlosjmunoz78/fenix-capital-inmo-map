name: FACT001 Vercel independent service proof via GitHub OIDC LAB
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase/vercel-service-lab/requests/verify.v1.json
      - cerebro/connectors/universal/supabase/vercel-service-lab/requests/verify-write.v1.json
      - cerebro/connectors/universal/supabase/vercel-service-lab/requests/cleanup.v1.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: fact001-vercel-service-read-lab
  cancel-in-progress: false
jobs:
  signed-service-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify OIDC service scope and reversible LAB write before any network call
        run: node --test cerebro/connectors/universal/supabase/vercel-service-lab/tests/*.test.mjs
      - name: Signed CEREBRO service -> Vault -> Vercel read-only project listing
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const base='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-fact001-vercel-service-lab';
          const order=JSON.parse(readFileSync('cerebro/connectors/universal/supabase/vercel-service-lab/requests/verify.v1.json','utf8'));
          const expected={company_id:'fenix-capital',engine_id:'FACT-001',environment:'LAB',version:'1.0.0',client_id:'cerebro',team_id:'team_qnh6u1Ofy2WPp0MGEKlyMA50',operation:'vercel.projects.list_lab',request_id:'FACT001-VERCEL-SERVICE-READ-20261110'};
          if(JSON.stringify(Object.keys(order).sort())!==JSON.stringify(Object.keys(expected).sort())||Object.keys(expected).some(k=>order[k]!==expected[k]))throw Error('VERCEL_ORDER_DENIED');
          async function call(route,jwt,method='GET',body){
           const resp=await fetch(base+'/'+route,{method,headers:{Accept:'application/json',...(jwt?{Authorization:'Bearer '+jwt}:{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(35000)});
           let data={};try{data=await resp.json()}catch{}
           return {status:resp.status,data};
          }
          const anon=await call('health');
          const forged=await call('health','not-a-signed-github-jwt');
          if(anon.status!==401||forged.status!==401)throw Error('UNAUTHENTICATED_ACCESS_ALLOWED');
          console.log('FACT001_VERCEL_ANON_401=true');
          console.log('FACT001_VERCEL_FORGED_401=true');
          const endpoint=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,grant=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!endpoint||!grant)throw Error('OIDC_UNAVAILABLE');
          const u=endpoint+(endpoint.includes('?')?'&':'?')+'audience='+encodeURIComponent('cerebro-fact001-vercel-service-lab-20261110');
          const tokenResponse=await fetch(u,{headers:{Authorization:'Bearer '+grant},redirect:'error',signal:AbortSignal.timeout(12000)});
          if(!tokenResponse.ok)throw Error('OIDC_HTTP_'+tokenResponse.status);
          const jwt=(await tokenResponse.json()).value;
          if(typeof jwt!=='string'||jwt.split('.').length!==3)throw Error('OIDC_INVALID');
          const health=await call('health',jwt);
          if(health.status!==200||health.data?.status!=='AUTHENTICATED')throw Error('SIGNED_SERVICE_DENIED');
          console.log('FACT001_VERCEL_SIGNED_SERVICE_200=true');
          const verify=await call('verify-projects',jwt,'POST',order);
          console.log('FACT001_VERCEL_VAULT_TO_API_HTTP='+verify.status);
          console.log('FACT001_VERCEL_READ_STATUS='+String(verify.data?.status||'BLOCKED'));
          console.log('FACT001_VERCEL_AUTHORIZED_COUNT='+String(verify.data?.authorized_projects??0));
          console.log('FACT001_VERCEL_EXPECTED_COUNT='+String(verify.data?.expected_projects??0));
          console.log('FACT001_VERCEL_CREDENTIAL_IN_RUNNER=false');
          console.log('FACT001_VERCEL_WRITES=0');
          if(verify.status!==200||verify.data?.status!=='VERCEL_SERVICE_READ_VERIFIED'||verify.data?.credential_exposed!==false||verify.data?.vercel_writes!==0)throw Error('VERCEL_SERVICE_PROOF_NOT_VERIFIED');
          console.log('FACT001_VERCEL_AUTONOMOUS_READ_E2E=PASS');
          const writeOrder=JSON.parse(readFileSync('cerebro/connectors/universal/supabase/vercel-service-lab/requests/verify-write.v1.json','utf8'));
          const writeExpected={company_id:'fenix-capital',engine_id:'FACT-001',environment:'LAB',version:'1.0.0',client_id:'cerebro',team_id:'team_qnh6u1Ofy2WPp0MGEKlyMA50',project_id:'prj_vvil5epQ99mngK29vpLVOWmlVRP1',operation:'vercel.project.lab_framework_change_and_restore',request_id:'FACT001-VERCEL-SERVICE-WRITE-20261110'};
          if(JSON.stringify(Object.keys(writeOrder).sort())!==JSON.stringify(Object.keys(writeExpected).sort())||Object.keys(writeExpected).some(k=>writeOrder[k]!==writeExpected[k]))throw Error('VERCEL_WRITE_ORDER_DENIED');
          const write=await call('verify-reversible-update',jwt,'POST',writeOrder);
          console.log('FACT001_VERCEL_LAB_WRITE_HTTP='+write.status);
          console.log('FACT001_VERCEL_LAB_WRITE_STATUS='+String(write.data?.status||'BLOCKED'));
          console.log('FACT001_VERCEL_LAB_ROLLBACK_VERIFIED='+String(write.data?.rollback_verified===true));
          console.log('FACT001_VERCEL_LAB_PROJECT_ID_CONFIRMED='+String(write.data?.project_id===writeExpected.project_id));
          if(write.status!==200||write.data?.status!=='VERCEL_LAB_WRITE_AND_ROLLBACK_VERIFIED'||write.data?.rollback_verified!==true||write.data?.write_verified!==true||write.data?.project_id!==writeExpected.project_id)throw Error('VERCEL_LAB_WRITE_ROLLBACK_NOT_VERIFIED');
          console.log('FACT001_VERCEL_AUTONOMOUS_WRITE_E2E=PASS');
          const cleanup=JSON.parse(readFileSync('cerebro/connectors/universal/supabase/vercel-service-lab/requests/cleanup.v1.json','utf8'));
          const expectedCleanup={...writeExpected,operation:'vercel.project.cleanup_test_only',request_id:'FACT001-CLEANUP-LAB-20261110-001'};
          if(JSON.stringify(Object.keys(cleanup).sort())!==JSON.stringify(Object.keys(expectedCleanup).sort())||Object.keys(expectedCleanup).some(k=>cleanup[k]!==expectedCleanup[k]))throw Error('CLEANUP_ORDER_DENIED');
          const removed=await call('cleanup-vercel-lab',jwt,'POST',cleanup);
          console.log('FACT001_CLEANUP_HTTP='+removed.status);
          console.log('FACT001_CLEANUP_STATUS='+String(removed.data?.status||'BLOCKED'));
          console.log('FACT001_CLEANUP_EXPECTED_PROJECT='+String(removed.data?.project_id===expectedCleanup.project_id));
          console.log('FACT001_CLEANUP_OTHER_PROJECTS_DELETED='+String(removed.data?.other_projects_deleted??'N/A'));
          if(removed.status!==200||removed.data?.status!=='VERCEL_TEST_PROJECT_DELETED'||removed.data?.project_id!==expectedCleanup.project_id||removed.data?.other_projects_deleted!==0||removed.data?.credential_exposed!==false)throw Error('CLEANUP_NOT_VERIFIED');
          console.log('FACT001_CLEANUP_VERCEL_LAB=PASS');
          NODE
