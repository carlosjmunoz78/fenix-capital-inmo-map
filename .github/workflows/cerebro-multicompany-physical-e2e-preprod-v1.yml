name: CEREBRO Multi-company Physical E2E PREPROD V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/evidence/multicompany-physical-e2e-acceptance-2026-10-14.json'
      - 'cerebro/multicompany/acceptance/physical-e2e-preprod-v1.sql'
      - 'cerebro/tests/multicompany-physical-e2e-evidence-v1.test.mjs'
      - '.github/workflows/cerebro-multicompany-physical-e2e-preprod-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/evidence/multicompany-physical-e2e-acceptance-2026-10-14.json'
      - 'cerebro/multicompany/acceptance/physical-e2e-preprod-v1.sql'
      - 'cerebro/tests/multicompany-physical-e2e-evidence-v1.test.mjs'
      - '.github/workflows/cerebro-multicompany-physical-e2e-preprod-v1.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-multicompany-physical-e2e-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  physical-e2e-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Validate CEREBRO regression
        working-directory: cerebro
        run: |
          npm run validate
          npm test
      - name: Focused physical E2E evidence contract
        run: node --test cerebro/tests/multicompany-physical-e2e-evidence-v1.test.mjs
      - name: Assert acceptance remains non-PROD and transactional
        shell: bash
        run: |
          set -euo pipefail
          sql='cerebro/multicompany/acceptance/physical-e2e-preprod-v1.sql'
          evidence='cerebro/evidence/multicompany-physical-e2e-acceptance-2026-10-14.json'
          grep -F 'begin;' "$sql"
          grep -F 'rollback;' "$sql"
          grep -F 'LOW_CONFIDENCE' "$sql"
          grep -F 'NEW_BETTER' "$sql"
          grep -F 'MULTICOMPANY_PHYSICAL_E2E_ACCEPTANCE_REQUIRED' "$sql"
          grep -F '"prod_authorized": false' "$evidence"
          grep -F '"trading_access": false' "$evidence"
          grep -F '"additional_cost_eur": 0' "$evidence"
          ! grep -Eqi '\btruncate\b|\bdelete[[:space:]]+from\b|\bcascade\b' "$sql"
      - name: Record boundary
        run: |
          echo 'Physical evidence covers the durable synthetic new-company PREPROD control plane from registration through LRN-001.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It does not claim real external scan execution, all real action/channel E2E, PROD autonomy, PROD write authority or Trading access.' >> "$GITHUB_STEP_SUMMARY"
