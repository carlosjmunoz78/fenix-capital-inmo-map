name: One shot PROD candidate promotion

on:
  push:
    branches:
      - prod-promo-899839d
    paths:
      - .github/workflows/one-shot-promote-899839d.yml

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify PREPROD run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_JSON=$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/34325603806")
          test "$(printf '%s' "$RUN_JSON" | jq -r .conclusion)" = success
          test "$(printf '%s' "$RUN_JSON" | jq -r .head_sha)" = 899839d264c6b4c2d30320f8d5391a5936599c4e
          test "$(printf '%s' "$RUN_JSON" | jq -r .head_branch)" = preprod-app-phase1

      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: fenix-prod-candidate-899839d264c6b4c2d30320f8d5391a5936599c4e
          path: candidate
          run-id: 34325603806
          github-token: ${{ github.token }}

      - name: Verify exact candidate
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c fenix-prod-candidate.tgz.sha256
          test "$(tr -d '\r\n' < PROD_CANDIDATE_SHA)" = 899839d264c6b4c2d30320f8d5391a5936599c4e
          grep -qx 'source_sha=899839d264c6b4c2d30320f8d5391a5936599c4e' PROD_CANDIDATE_METADATA.txt
          mkdir ../candidate-dist
          tar -xzf fenix-prod-candidate.tgz -C ../candidate-dist
          test -f ../candidate-dist/index.html
          test -f ../candidate-dist/404.html
          test "$(cat ../candidate-dist/CNAME)" = app.fenixcapital.es
          if grep -RInE --include='*.js' --include='*.html' --include='*.css' 'functions/v1/[A-Za-z0-9_-]+-test' ../candidate-dist; then exit 1; fi

      - name: Checkout current PROD
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: live

      - name: Publish exact candidate
        run: |
          set -euo pipefail
          cd live
          PREVIOUS=$(git rev-parse HEAD)
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../candidate-dist/. .
          printf '%s\n' 899839d264c6b4c2d30320f8d5391a5936599c4e > PROD_SOURCE_SHA.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Candidate already live.'
          else
            git commit -m "deploy(prod): promote 899839d264c6b4c2d30320f8d5391a5936599c4e [previous:${PREVIOUS}]"
            git push origin HEAD:gh-pages
          fi

      - name: Smoke PROD
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -L --silent --show-error --output /tmp/prod --write-out '%{http_code}' --max-time 20 https://app.fenixcapital.es/) || CODE=000
            if [ "$CODE" = 200 ] && grep -qi '<!doctype html' /tmp/prod; then exit 0; fi
            sleep 10
          done
          exit 1
