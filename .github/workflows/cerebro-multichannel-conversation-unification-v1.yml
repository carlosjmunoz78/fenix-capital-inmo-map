name: CEREBRO Multichannel Conversation Unification V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/cerebro-conversation-policy-v1.ts'
      - 'supabase/functions/cerebro-telegram-gateway-v0/**'
      - 'supabase/functions/cerebro-telegram-voice-v1/**'
      - 'supabase/migrations/20261013010500_cerebro_multichannel_ana_overlay_v1.sql'
      - 'cerebro/multichannel/**'
      - 'cerebro/tests/multichannel-conversation-policy-v1.test.mjs'
      - '.github/workflows/cerebro-multichannel-conversation-unification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multichannel-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Test common CHAT-001 and VOICE-001 policy
        run: node --test cerebro/tests/multichannel-conversation-policy-v1.test.mjs cerebro/tests/universal-learning-ingress.test.mjs
      - name: Assert channel adapters preserve existing authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          policy='supabase/functions/_shared/cerebro-conversation-policy-v1.ts'
          text='supabase/functions/cerebro-telegram-gateway-v0/index.ts'
          voice='supabase/functions/cerebro-telegram-voice-v1/index.ts'
          ana='supabase/migrations/20261013010500_cerebro_multichannel_ana_overlay_v1.sql'
          test -f "$policy" && test -f "$text" && test -f "$voice" && test -f "$ana"
          grep -F "TELEGRAM_TEXT" "$text"
          grep -F "TELEGRAM_VOICE" "$voice"
          grep -F "VOICE-001" "$policy"
          grep -F "APP_ANA_VOICE" "$policy"
          grep -F "CONSOLE_VOICE" "$policy"
          grep -F "prod_authority_changed:false" "$policy"
          grep -F "HUMAN_REQUIRED" "$policy"
          grep -F "fenix_prod_ana_knowledge_answer_user(p_question)" "$ana"
          grep -F "APP_ANA_TEXT" "$ana"
          ! grep -Eqi '\b(drop|truncate)\b|\bdelete\s+from\b' "$ana"
      - name: Assert stable Console and unrelated App gateway are untouched
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [ -z "$base" ]; then git fetch origin main --depth=1; base="$(git rev-parse FETCH_HEAD)"; else git fetch origin "$base" --depth=1; fi
          changed="$(git diff --name-only "$base" HEAD)"
          ! printf '%s\n' "$changed" | grep -Eq '^supabase/functions/cerebro-console-gateway-v0/'
          ! printf '%s\n' "$changed" | grep -Eq '^supabase/functions/fenix-app-gateway/'
      - name: Assert no channel may auto-promote a learning observation
        shell: bash
        run: |
          set -euo pipefail
          grep -F "signal_type:'METRIC_OBSERVATION'" supabase/functions/_shared/cerebro-conversation-policy-v1.ts
          grep -F "prod_authorized:false" supabase/functions/_shared/cerebro-conversation-policy-v1.ts
          grep -F "prod_write_authorized:false" supabase/functions/_shared/cerebro-conversation-policy-v1.ts
          grep -F "trading_access:false" supabase/functions/_shared/cerebro-conversation-policy-v1.ts
          grep -F "additional_cost_eur:0" supabase/functions/_shared/cerebro-conversation-policy-v1.ts
      - name: Record boundary
        run: |
          echo 'GREEN proves one conservative conversation policy across Console/Ana/Telegram text and VOICE-001 voice adapters without changing channel authority.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This gate does not authorize new PROD actions or Trading, and learning remains observation-only through the existing LRN-001 path.' >> "$GITHUB_STEP_SUMMARY"
