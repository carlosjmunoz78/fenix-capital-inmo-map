name: CEREBRO SEO · creative single-dispatch CLOSED, read-only verification V0

on:
  pull_request:
    paths:
      - '.github/workflows/cerebro-seo-creative-single-dispatch-v0.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify-closed-state:
    if: ${{ github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the existing creative worker remains disabled after one-shot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url='https://api.github.com/repos/carlosjmunoz78/fenix-capital-inmo-map/actions/workflows/cerebro-creative-job-runner-v1.yml';
          const r=await fetch(url,{headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'},signal:AbortSignal.timeout(12000)});
          if(!r.ok)throw Error('WORKFLOW_READ_UNAVAILABLE:'+r.status);
          const b=await r.json();
          console.log(JSON.stringify({workflow:'cerebro-creative-job-runner-v1.yml',
            state:b.state,expected:'disabled_manually',
            diagnostic:'ONE_SHOT_CLOSED_PROD_SCHEDULE_OFF',site_changes:0,
            actions_write_permission:false,paid_provider_called:false}));
          if(b.state!=='disabled_manually')throw Error('HUMAN_REQUIRED_WORKFLOW_NOT_DISABLED');
          NODE
