name: CEREBRO Creative Output Pipeline V1

on:
  pull_request:
    paths:
      - 'cerebro/contracts/creative-output-pipeline-v1.contract.json'
      - 'cerebro/runtime/creative-output-pipeline-v1.mjs'
      - 'cerebro/tests/creative-output-pipeline-v1.test.mjs'
      - 'docs/CEREBRO_CREATIVE_OUTPUT_PIPELINE_V1_2026-10-24.md'
      - '.github/workflows/cerebro-creative-output-pipeline-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate contract
        run: |
          node -e "const c=require('./cerebro/contracts/creative-output-pipeline-v1.contract.json'); if(c.owner_engine!=='FACT-001'||c.new_canonical_engine!==false||c.cost_policy.default_additional_cost_eur!==0||c.authority_separation.publish!==false) process.exit(1); console.log('creative contract ok')"
      - name: Run shared creative output tests
        run: node --test cerebro/tests/creative-output-pipeline-v1.test.mjs
      - name: Guard no direct publication authority
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('cerebro/contracts/creative-output-pipeline-v1.contract.json','utf8'));
          if (c.authority_separation.publish || c.authority_separation.send || c.authority_separation.spend) process.exit(1);
          if (!c.video_policy.deterministic_rendering || !c.video_policy.visual_identity_gate) process.exit(1);
          console.log('authority and deterministic render guards ok');
          NODE
