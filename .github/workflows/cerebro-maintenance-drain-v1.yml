name: CEREBRO Maintenance Drain V1

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebro-maintenance-drain-v1
  cancel-in-progress: true

jobs:
  pause-new-work:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disable future CEREBRO workflows and cancel only not-yet-started runs
        id: drain
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const SELF = 'CEREBRO Maintenance Drain V1';
            const ALLOW = new Set([
              SELF,
              'CEREBRO Runtime Durable Supervisor V0',
              'CEREBRO JOB-001 Ledger Control Plane V1'
            ]);

            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner, repo, per_page: 100
            });

            const targets = workflows.filter(w =>
              w.state === 'active' &&
              String(w.name || '').toUpperCase().startsWith('CEREBRO') &&
              !ALLOW.has(w.name)
            );

            const disabled = [];
            const disableErrors = [];
            for (const w of targets) {
              try {
                await github.request('PUT /repos/{owner}/{repo}/actions/workflows/{workflow_id}/disable', {
                  owner, repo, workflow_id: w.id
                });
                disabled.push({id: w.id, name: w.name, path: w.path, previous_state: w.state});
              } catch (error) {
                disableErrors.push({id: w.id, name: w.name, error: String(error.message || error).slice(0, 300)});
              }
            }

            const disabledIds = new Set(disabled.map(w => Number(w.id)));
            const cancelled = [];
            const cancelErrors = [];
            for (const status of ['queued','requested','waiting','pending']) {
              let runs = [];
              try {
                runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner, repo, status, per_page: 100
                });
              } catch (error) {
                cancelErrors.push({status, error: String(error.message || error).slice(0, 300)});
                continue;
              }
              for (const run of runs) {
                if (!disabledIds.has(Number(run.workflow_id))) continue;
                if (Number(run.id) === Number(context.runId)) continue;
                try {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/cancel', {
                    owner, repo, run_id: run.id
                  });
                  cancelled.push({id: run.id, workflow_id: run.workflow_id, name: run.name, status});
                } catch (error) {
                  cancelErrors.push({id: run.id, workflow_id: run.workflow_id, name: run.name, status, error: String(error.message || error).slice(0, 300)});
                }
              }
            }

            const report = {
              schema_version: '1.0.0',
              state_type: 'CEREBRO_MAINTENANCE_DRAIN_V1',
              mode: 'DRAIN',
              policy: 'FINISH_RUNNING_CANCEL_NOT_STARTED_DISABLE_FUTURE',
              created_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              running_jobs_cancelled: false,
              trigger_event: context.eventName,
              trigger_workflow: context.payload.workflow_run?.name || null,
              allowlisted_workflows: [...ALLOW],
              disabled,
              cancelled_not_started: cancelled,
              disable_errors: disableErrors,
              cancel_errors: cancelErrors,
              prod_mutation_authorized: false,
              trading_access: false,
              additional_cost_eur: 0
            };
            fs.writeFileSync('cerebro-maintenance-drain-v1.json', JSON.stringify(report, null, 2) + '\n');
            await core.summary
              .addHeading('CEREBRO Maintenance Drain V1')
              .addRaw(`Disabled future CEREBRO workflows: ${disabled.length}\n`)
              .addRaw(`Cancelled not-started CEREBRO runs: ${cancelled.length}\n`)
              .addRaw(`Running runs intentionally left untouched.\n`)
              .addRaw(`Disable errors: ${disableErrors.length}; cancel errors: ${cancelErrors.length}.\n`)
              .write();
            core.setOutput('disabled_count', disabled.length);
            core.setOutput('cancelled_count', cancelled.length);
            if (disableErrors.length > 0) core.setFailed(`DRAIN_DISABLE_ERRORS:${disableErrors.length}`);

      - name: Upload reversible drain receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-maintenance-drain-v1-${{ github.run_id }}
          path: cerebro-maintenance-drain-v1.json
          if-no-files-found: error
          retention-days: 30
