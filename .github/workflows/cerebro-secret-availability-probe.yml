name: CEREBRO Secret Availability Probe

# SECURITY_INCIDENT #383: presence-only probe. Never prints secret values.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cerebro-secret-availability-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-secret-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_PROD_LEGACY_ANON_JWT: ${{ secrets.PROD_SUPABASE_LEGACY_ANON_JWT }}
      CANDIDATE_PROD_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
      CANDIDATE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in CANDIDATE_PROD_LEGACY_ANON_JWT CANDIDATE_PROD_ANON_KEY CANDIDATE_SUPABASE_ANON_KEY; do
            if [ -n "${!name:-}" ]; then
              printf '%s_READY=yes\n' "$name"
            else
              printf '%s_READY=no\n' "$name"
            fi
          done
          echo 'No secret values were printed.'
