name: CEREBRO Continuous Human QA V0

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cerebro/qa/**'
      - 'cerebro/supervisor/**'
      - 'cerebro/communication/enrich-daily-summary-with-qa.mjs'
      - 'cerebro/tests/continuous-human-qa-v0.test.mjs'
      - 'cerebro/tests/qa-email-enrichment-v0.test.mjs'
      - 'cerebro/tests/qa-improvement-scout-v0.test.mjs'
      - 'cerebro/tests/qa-autonomous-remediation-loop-v0.test.mjs'
      - 'cerebro/tests/qa-learning-bridge-v0.test.mjs'
      - 'cerebro/tests/self-healing.test.mjs'
      - '.github/workflows/cerebro-continuous-human-qa-v0.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cerebro/qa/**'
      - 'cerebro/supervisor/**'
      - 'cerebro/communication/enrich-daily-summary-with-qa.mjs'
      - 'cerebro/tests/continuous-human-qa-v0.test.mjs'
      - 'cerebro/tests/qa-email-enrichment-v0.test.mjs'
      - 'cerebro/tests/qa-improvement-scout-v0.test.mjs'
      - 'cerebro/tests/qa-autonomous-remediation-loop-v0.test.mjs'
      - 'cerebro/tests/qa-learning-bridge-v0.test.mjs'
      - 'cerebro/tests/self-healing.test.mjs'
      - '.github/workflows/cerebro-continuous-human-qa-v0.yml'
      - '.github/workflows/cerebro-human-communication-v1.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: cerebro-continuous-human-qa-v0-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  QA_STATE_BRANCH: cerebro/qa-state-v0
  QA_STATE_PATH: cerebro/runtime/qa-daily-quality-state.v0.json
  QA_IMPROVEMENT_PATH: cerebro/runtime/qa-improvement-scout.v0.json
  QA_REMEDIATION_PATH: cerebro/runtime/qa-remediation-state.v0.json
  QA_HEALING_PATH: cerebro/runtime/qa-healing-plans.v0.json
  QA_WEB_URL: https://fenixcapital.es
  QA_APP_URL: https://app.fenixcapital.es

jobs:
  continuous-human-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install existing repository dependencies
        run: npm ci

      - name: Prove QA contracts improvement routing SELF-001 planning learning bridge and daily-email integration
        run: |
          node --test \
            cerebro/tests/continuous-human-qa-v0.test.mjs \
            cerebro/tests/qa-improvement-scout-v0.test.mjs \
            cerebro/tests/qa-autonomous-remediation-loop-v0.test.mjs \
            cerebro/tests/qa-learning-bridge-v0.test.mjs \
            cerebro/tests/self-healing.test.mjs \
            cerebro/tests/universal-learning-ingress.test.mjs \
            cerebro/tests/improvement-candidate-factory.test.mjs \
            cerebro/tests/qa-email-enrichment-v0.test.mjs

      - name: Install Chromium for existing Playwright stack
        run: npx playwright install --with-deps chromium

      - name: Load previous quality state without touching business PROD
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa
          if git fetch --no-tags origin "refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH" 2>/dev/null && \
             git cat-file -e "refs/remotes/origin/$QA_STATE_BRANCH:$QA_STATE_PATH" 2>/dev/null; then
            git show "refs/remotes/origin/$QA_STATE_BRANCH:$QA_STATE_PATH" > artifacts/qa/state.before.json
          else
            echo '{}' > artifacts/qa/state.before.json
          fi

      - name: Exercise authenticated App journeys on isolated local synthetic runtime
        id: auth_probe
        env:
          VITE_FENIX_ENV: prod
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: qa-auth-synthetic-not-a-real-key
        run: |
          set +e
          npx playwright test tests/app-real-five-flows.spec.ts \
            --project='desktop-chromium' \
            --project='mobile-chromium' \
            --reporter=json \
            > artifacts/qa/playwright-auth-synthetic-report.json \
            2> artifacts/qa/playwright-auth-synthetic-stderr.log
          AUTH_EXIT=$?
          set -e
          echo "exit_code=$AUTH_EXIT" >> "$GITHUB_OUTPUT"
          test -s artifacts/qa/playwright-auth-synthetic-report.json
          echo "Authenticated synthetic App exit=$AUTH_EXIT (isolated local harness; no customer data or PROD write)"

      - name: Act as a human on public PROD surfaces in strict read-only mode
        id: probe
        run: |
          set +e
          npx playwright test \
            --config=cerebro/qa/playwright.qa.config.ts \
            --project='qa-desktop-chromium' \
            --project='qa-mobile-chromium' \
            --reporter=json \
            > artifacts/qa/playwright-report.json \
            2> artifacts/qa/playwright-stderr.log
          QA_EXIT=$?
          set -e
          echo "exit_code=$QA_EXIT" >> "$GITHUB_OUTPUT"
          test -s artifacts/qa/playwright-report.json
          echo "QA product/browser exit=$QA_EXIT (findings are evidence, not controller failure)"

      - name: Build OLD vs NEW quality delta and deterministic owner routing
        run: |
          node cerebro/qa/quality-delta.mjs \
            --report artifacts/qa/playwright-report.json \
            --authenticated-report artifacts/qa/playwright-auth-synthetic-report.json \
            --previous artifacts/qa/state.before.json \
            --targets cerebro/qa/targets.v0.json \
            --out artifacts/qa/state.after.json
          jq '{status,quality_score,previous_quality_score,quality_delta,tests,targets,new_issues,resolved_issue_fingerprints,recurring_issues,dispatch_queue,coverage,safety}' artifacts/qa/state.after.json

      - name: Discover measured human improvements even when nothing is broken
        run: |
          node cerebro/qa/improvement-scout.mjs \
            --report artifacts/qa/playwright-report.json \
            --quality artifacts/qa/state.after.json \
            --out artifacts/qa/improvements.json
          jq '{status,observations_total,candidates_total,human_required,safety}' artifacts/qa/improvements.json

      - name: Route bugs and improvements into bounded PREPROD candidates
        run: |
          node cerebro/qa/autonomous-remediation-loop.mjs \
            --quality artifacts/qa/state.after.json \
            --improvements artifacts/qa/improvements.json \
            --out artifacts/qa/remediation.json
          jq '{status,open_cases,bug_cases,improvement_cases,learning_records_total,candidate_packages_total,human_required,next_gate,authority,safety}' artifacts/qa/remediation.json

      - name: Plan reversible SELF-001 repair work without granting code or PROD authority
        run: |
          node cerebro/supervisor/self-healing.mjs \
            --input artifacts/qa/remediation.json \
            --output artifacts/qa/healing-plans.json
          jq '{status,plans_total,plan_ready,human_required_total,next_gate,execution_authority,safety}' artifacts/qa/healing-plans.json

      - name: Build bounded QA learning signals for existing universal RSI ingress
        run: |
          node cerebro/qa/qa-learning-bridge.mjs \
            --input artifacts/qa/state.after.json \
            --output artifacts/qa/learning-signals.json
          jq -e '.state_type=="CEREBRO_QA_LEARNING_SIGNAL_BATCH_V0" and .prod_authorized==false and .prod_write_authorized==false and .trading_access==false and .contains_customer_data==false and .contains_secrets==false and .additional_cost_eur==0' artifacts/qa/learning-signals.json >/dev/null
          jq '{signals_total,downstream,repair_semantics}' artifacts/qa/learning-signals.json

      - name: Attach improvement remediation SELF-001 and learning summary to canonical QA state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const qa=JSON.parse(fs.readFileSync('artifacts/qa/state.after.json','utf8'));
          const improvements=JSON.parse(fs.readFileSync('artifacts/qa/improvements.json','utf8'));
          const remediation=JSON.parse(fs.readFileSync('artifacts/qa/remediation.json','utf8'));
          const healing=JSON.parse(fs.readFileSync('artifacts/qa/healing-plans.json','utf8'));
          const learning=JSON.parse(fs.readFileSync('artifacts/qa/learning-signals.json','utf8'));
          qa.improvement_scout={status:improvements.status,observations_total:improvements.observations_total,candidates_total:improvements.candidates_total,top_candidates:(improvements.candidates??[]).slice(0,5),safety:improvements.safety};
          qa.remediation={status:remediation.status,open_cases:remediation.open_cases,bug_cases:remediation.bug_cases,improvement_cases:remediation.improvement_cases,candidate_packages_total:remediation.candidate_packages_total,human_required:remediation.human_required,next_gate:remediation.next_gate,authority:remediation.authority,safety:remediation.safety};
          qa.self_healing={status:healing.status,plans_total:healing.plans_total,plan_ready:healing.plan_ready,human_required_total:healing.human_required_total,next_gate:healing.next_gate,execution_authority:healing.execution_authority,safety:healing.safety};
          qa.learning_bridge={signals_total:learning.signals_total,downstream:learning.downstream,repair_semantics:learning.repair_semantics,prod_write_authorized:false,additional_cost_eur:0};
          fs.writeFileSync('artifacts/qa/state.after.json',JSON.stringify(qa,null,2)+'\n');
          NODE

      - name: Enforce immutable safety boundaries
        run: |
          jq -e '.company_id=="fenix" and .engine_id=="QA-001" and .safety.prod_write==false and .safety.customer_data==false and .safety.trading==false and .safety.paid_fallback==false and .safety.additional_subscription_eur==0 and (.human_required|length)==0' artifacts/qa/state.after.json >/dev/null
          jq -e '.coverage.app_authenticated=="LOCAL_ISOLATED_SYNTHETIC_NO_CUSTOMER_DATA" and .coverage.app_authenticated_deployed_preprod=="POR_AUDITAR_CANONICAL_PREPROD_TARGET"' artifacts/qa/state.after.json >/dev/null
          jq -e '.targets.PRODUCT.status=="POR_AUDITAR" or .coverage.products=="ENABLED_SYNTHETIC_PREPROD"' artifacts/qa/state.after.json >/dev/null
          jq -e '.safety.prod_write==false and .safety.customer_data==false and .safety.trading==false and .safety.paid_fallback==false and .safety.additional_subscription_eur==0 and ([.candidates[]|select(.prod_write_authorized!=false or .additional_cost_eur!=0)]|length)==0' artifacts/qa/improvements.json >/dev/null
          jq -e '.safety.prod_write==false and .safety.customer_data==false and .safety.trading==false and .safety.paid_fallback==false and .safety.additional_subscription_eur==0 and .authority.app_web_prod_autofix==false and .authority.assisted_owner_engines_preserved==true and .authority.promotion_authorized==false and .authority.prod_write_authorized==false and ([.candidate_packages[]|select(.prod_write_authorized!=false or .additional_cost_eur!=0)]|length)==0' artifacts/qa/remediation.json >/dev/null
          jq -e '.safety.prod_write==false and .safety.customer_data==false and .safety.trading==false and .safety.paid_fallback==false and .safety.additional_subscription_eur==0 and .execution_authority.plan_only==true and .execution_authority.code_mutation_authorized==false and .execution_authority.promotion_authorized==false and .execution_authority.prod_authorized==false and .execution_authority.prod_write_authorized==false and ([.plans[]|select((.prod_write_authorized//false)!=false or (.additional_cost_eur//0)!=0 or (.execute//false)!=false)]|length)==0' artifacts/qa/healing-plans.json >/dev/null
          jq -e '.prod_authorized==false and .prod_write_authorized==false and .trading_access==false and .contains_customer_data==false and .contains_secrets==false and .additional_cost_eur==0' artifacts/qa/learning-signals.json >/dev/null

      - name: Dispatch only new verified QA evidence to existing universal RSI learning ingress
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COUNT="$(jq -r '.signals_total' artifacts/qa/learning-signals.json)"
          if [ "$COUNT" = '0' ]; then
            echo 'No new/resolved/regressed QA evidence; idempotent learning no-op.'
            exit 0
          fi
          jq '{event_type:"cerebro_learning_signal",client_payload:{signal:{signals:.signals}}}' artifacts/qa/learning-signals.json > artifacts/qa/repository-dispatch.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" --input artifacts/qa/repository-dispatch.json
          echo "Dispatched $COUNT bounded QA learning signal(s) to existing universal RSI ingress."

      - name: Persist only QA and SELF-001 evidence state on its dedicated branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cp artifacts/qa/state.after.json /tmp/qa-state.json
          cp artifacts/qa/improvements.json /tmp/qa-improvements.json
          cp artifacts/qa/remediation.json /tmp/qa-remediation.json
          cp artifacts/qa/healing-plans.json /tmp/qa-healing.json
          git fetch --no-tags origin "+refs/heads/$QA_STATE_BRANCH:refs/remotes/origin/$QA_STATE_BRANCH"
          git checkout --detach "refs/remotes/origin/$QA_STATE_BRANCH"
          mkdir -p "$(dirname "$QA_STATE_PATH")"
          cp /tmp/qa-state.json "$QA_STATE_PATH"
          cp /tmp/qa-improvements.json "$QA_IMPROVEMENT_PATH"
          cp /tmp/qa-remediation.json "$QA_REMEDIATION_PATH"
          cp /tmp/qa-healing.json "$QA_HEALING_PATH"
          git config user.name 'cerebro-qa[bot]'
          git config user.email 'cerebro-qa[bot]@users.noreply.github.com'
          git add "$QA_STATE_PATH" "$QA_IMPROVEMENT_PATH" "$QA_REMEDIATION_PATH" "$QA_HEALING_PATH"
          if ! git diff --cached --quiet; then
            git commit -m 'chore(cerebro): advance continuous human QA and SELF-001 evidence state'
            git push origin "HEAD:refs/heads/$QA_STATE_BRANCH"
          fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-continuous-human-qa-v0-${{ github.run_id }}
          path: |
            artifacts/qa/**
            playwright-report/**
            test-results/**
          if-no-files-found: warn
          retention-days: 30
