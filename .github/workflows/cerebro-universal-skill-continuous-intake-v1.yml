name: CEREBRO Universal Skill Continuous Intake V1

on:
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types: [cerebro_skill_intake]
  workflow_dispatch:
    inputs:
      company_id:
        description: company_id
        required: true
        default: fenix
      github_urls:
        description: Optional GitHub skill URLs separated by comma or newline. Leave empty to run the autonomous scout.
        required: false
        default: ''
  push:
    branches:
      - 'cerebro/universal-skill-activation-factory-v1-*'
    paths:
      - 'cerebro/runtime/universal-skill-source-queue-v1.mjs'
      - 'cerebro/runtime/universal-skill-autonomous-scout-v1.mjs'
      - 'cerebro/tests/universal-skill-source-queue-v1.test.mjs'
      - 'cerebro/tests/universal-skill-autonomous-scout-v1.test.mjs'
      - '.github/workflows/cerebro-universal-skill-continuous-intake-v1.yml'

permissions:
  contents: read

concurrency:
  group: universal-skill-continuous-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  durable-source-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CEREBRO_SOURCE_QUEUE_ROOT: ${{ runner.temp }}/cerebro-source-queue-persistent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare persistent PREPROD queue root
        shell: bash
        run: mkdir -p "$CEREBRO_SOURCE_QUEUE_ROOT"
      - name: Restore durable queue state
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cerebro-source-queue-persistent
          key: usaf-source-queue-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            usaf-source-queue-v1-${{ github.ref_name }}-
      - name: Continuous intake tests
        run: node --test cerebro/tests/universal-skill-source-queue-v1.test.mjs cerebro/tests/universal-skill-autonomous-scout-v1.test.mjs
      - name: Autonomous public skill discovery
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.github_urls == '')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CEREBRO_COMPANY_ID: ${{ github.event.inputs.company_id || 'fenix' }}
          CEREBRO_SKILL_SCOUT_MAX: '16'
        run: node cerebro/runtime/universal-skill-autonomous-scout-v1.mjs --out "$RUNNER_TEMP/cerebro-skill-scout-event.json"
      - name: Autonomous PREPROD intake
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.github_urls == '')
        env:
          CEREBRO_SOURCE_CONCURRENCY: '8'
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cerebro-skill-scout-event.json','utf8'));process.stdout.write(String(x.client_payload.github_urls.length));")"
          if [ "$COUNT" -eq 0 ]; then
            echo 'No eligible public skill sources discovered in this bounded cycle.'
            exit 0
          fi
          node cerebro/runtime/universal-skill-source-queue-v1.mjs --event "$RUNNER_TEMP/cerebro-skill-scout-event.json"
      - name: Event-driven intake
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.github_urls != '')
        env:
          CEREBRO_SOURCE_CONCURRENCY: '8'
        run: node cerebro/runtime/universal-skill-source-queue-v1.mjs --event "$GITHUB_EVENT_PATH"
      - name: Assert PREPROD-only authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'prod_authorized[[:space:]]*:[[:space:]]*true|prod_write_authorized[[:space:]]*:[[:space:]]*true|trading_access[[:space:]]*:[[:space:]]*true|external_skill_code_execution[[:space:]]*:[[:space:]]*true|npm install|child_process' cerebro/runtime/universal-skill-source-queue-v1.mjs cerebro/runtime/universal-skill-autonomous-scout-v1.mjs
      - name: Save durable queue state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cerebro-source-queue-persistent
          key: usaf-source-queue-v1-${{ github.ref_name }}-${{ github.run_id }}
