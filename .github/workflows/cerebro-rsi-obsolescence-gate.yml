name: CEREBRO RSI Obsolescence Gate
on:
  pull_request:
    paths: ['cerebro/runtime/knowledge-obsolescence.mjs','cerebro/tests/knowledge-obsolescence.test.mjs','cerebro/docs/RSI_OBSOLESCENCE_V0.md','.github/workflows/cerebro-rsi-obsolescence-gate.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  block-j-obsolescence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node --test cerebro/tests/knowledge-obsolescence.test.mjs
