name: CEREBRO JOB-001 Ledger Control Plane V1

on:
  pull_request:
    paths:
      - 'cerebro/runtime/job001-ledger-control-plane-v1.mjs'
      - 'cerebro/runtime/job001-ledger-control-plane-cli-v1.mjs'
      - 'cerebro/runtime/job001-remote-telemetry-v1.mjs'
      - 'cerebro/runtime/cerebro-supervisor-entrypoint-v1.mjs'
      - 'cerebro/runtime/mission-derived-job001-adapter-v1.mjs'
      - 'cerebro/runtime/adaptive-hierarchical-agent-work-pump-v3.mjs'
      - 'cerebro/runtime/execution-placement-policy-v1.mjs'
      - 'cerebro/scripts/install-supervisor-preprod-windows.ps1'
      - 'cerebro/tests/job001-ledger-control-plane-v1.test.mjs'
      - 'cerebro/tests/job001-remote-telemetry-v1.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-entrypoint-v1.test.mjs'
      - 'cerebro/tests/continuous-worker-job001-control-plane-binding-v1.test.mjs'
      - 'cerebro/tests/mission-derived-job001-adapter-v1.test.mjs'
      - 'cerebro/tests/adaptive-hierarchical-agent-work-pump-v3.test.mjs'
      - 'cerebro/tests/execution-placement-policy-v1.test.mjs'
      - 'cerebro/docs/JOB001_LEDGER_CONTROL_PLANE_V1.md'
      - '.github/workflows/cerebro-cloud-useful-continuous-worker-v1.yml'
      - 'supabase/migrations/20261028164800_job001_remote_sanitized_telemetry_v1.sql'
      - '.github/workflows/cerebro-job001-ledger-control-plane-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/runtime/job001-ledger-control-plane-v1.mjs'
      - 'cerebro/runtime/job001-ledger-control-plane-cli-v1.mjs'
      - 'cerebro/runtime/job001-remote-telemetry-v1.mjs'
      - 'cerebro/runtime/cerebro-supervisor-entrypoint-v1.mjs'
      - 'cerebro/runtime/mission-derived-job001-adapter-v1.mjs'
      - 'cerebro/runtime/adaptive-hierarchical-agent-work-pump-v3.mjs'
      - 'cerebro/runtime/execution-placement-policy-v1.mjs'
      - 'cerebro/scripts/install-supervisor-preprod-windows.ps1'
      - 'cerebro/tests/job001-ledger-control-plane-v1.test.mjs'
      - 'cerebro/tests/job001-remote-telemetry-v1.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-entrypoint-v1.test.mjs'
      - 'cerebro/tests/continuous-worker-job001-control-plane-binding-v1.test.mjs'
      - 'cerebro/tests/mission-derived-job001-adapter-v1.test.mjs'
      - 'cerebro/tests/adaptive-hierarchical-agent-work-pump-v3.test.mjs'
      - 'cerebro/tests/execution-placement-policy-v1.test.mjs'
      - 'cerebro/docs/JOB001_LEDGER_CONTROL_PLANE_V1.md'
      - '.github/workflows/cerebro-cloud-useful-continuous-worker-v1.yml'
      - 'supabase/migrations/20261028164800_job001_remote_sanitized_telemetry_v1.sql'
      - '.github/workflows/cerebro-job001-ledger-control-plane-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JOB-001 ledger control plane contract tests
        run: node --test cerebro/tests/job001-ledger-control-plane-v1.test.mjs
      - name: JOB-001 remote sanitized telemetry tests
        run: node --test cerebro/tests/job001-remote-telemetry-v1.test.mjs
      - name: Supervisor verified 360-cap entrypoint tests
        run: node --test cerebro/tests/cerebro-supervisor-entrypoint-v1.test.mjs
      - name: Sustained worker canonical JOB-001 binding guard
        run: |
          node --test cerebro/tests/continuous-worker-job001-control-plane-binding-v1.test.mjs
          node --test cerebro/tests/continuous-worker-entitlement-drain-canary-v1.test.mjs
      - name: Mission-derived durable JOB-001 adapter restart idempotency and exhaustion tests
        run: node --test cerebro/tests/mission-derived-job001-adapter-v1.test.mjs
      - name: Canonical V3 pump additive-source reconcile tests
        run: node --test cerebro/tests/adaptive-hierarchical-agent-work-pump-v3.test.mjs
      - name: Hostless-first edge-optional placement tests
        run: node --test cerebro/tests/execution-placement-policy-v1.test.mjs
      - name: Canonical Windows PREPROD installer is entrypoint V1 and fail-closed
        shell: bash
        run: |
          test -s cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "cerebro\\runtime\\cerebro-supervisor-entrypoint-v1.mjs" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "CEREBRO-Supervisor-PREPROD" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "RunLevel Limited" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "prod_write_authorized" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "target_global_concurrency -ne 360" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "max_global_concurrency -ne 360" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "max_company_concurrency -ne 360" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "max_provider_concurrency.deepseek -ne 8" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "max_repo_write_concurrency -ne 1" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "CEREBRO_ENABLE_DEEPSEEK_WORK_PUMP = 'NO'" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "CEREBRO_REMOTE_TELEMETRY = 'NO'" cerebro/scripts/install-supervisor-preprod-windows.ps1
      - name: Control-plane contract is PREPROD fail-closed at verified 360 cap
        run: |
          node cerebro/runtime/job001-ledger-control-plane-cli-v1.mjs contract > control-plane-contract.json
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('control-plane-contract.json','utf8')); if(x.environment!=='PREPROD'||x.second_queue!==false||x.second_scheduler!==false||x.second_daemon!==false||x.target_useful_default!==360||x.max_global_default!==360||x.max_company_default!==360||x.max_deepseek_default!==8||x.max_repo_write_default!==1||x.heartbeat_ttl_max_ms!==120000||x.dynamic_concurrency_whitelist_only!==true||x.prod_authorized!==false||x.trading_access!==false) process.exit(1);"
