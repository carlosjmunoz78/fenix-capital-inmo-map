name: CEREBRO Browser Autologin Universal V1 PREPROD

on:
  workflow_dispatch:
  push:
    branches: ['preprod/browser-autologin-universal-v1-20261026']
    paths:
      - '.github/workflows/cerebro-browser-autologin-universal-v1-preprod.yml'
      - 'scripts/patch-browser-autologin-v1.mjs'
      - 'scripts/patch-browser-autologin-ownerless-v1.mjs'
      - 'scripts/patch-browser-autologin-universal-v1.mjs'
      - 'scripts/patch-browser-autologin-contract-v1.mjs'
      - 'scripts/patch-browser-realtime-fastlane-v1.mjs'
      - 'cerebro/runtime/browser-interactive-session-v3.mjs'
      - 'cerebro/runtime/browser-job-runner-v2.mjs'
      - 'cerebro/runtime/browser-work-total-autologin-v1.test.mjs'
      - 'supabase/functions/cerebro-browser-work-total-autologin-v1-prod/**'
      - 'supabase/migrations/20261026100000_cerebro_browser_credential_broker_v3_interactive.sql'

permissions:
  contents: read

concurrency:
  group: cerebro-browser-autologin-universal-v1-preprod
  cancel-in-progress: true

jobs:
  validate:
    name: Validate universal autonomous login contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply governed realtime patch
        run: node scripts/patch-browser-realtime-fastlane-v1.mjs
      - name: Apply existing governed autonomous relogin patch
        run: node scripts/patch-browser-autologin-v1.mjs
      - name: Preserve canonical owner and broker-only secret resolution
        run: node scripts/patch-browser-autologin-ownerless-v1.mjs
      - name: Apply universal governed login adapter
        run: node scripts/patch-browser-autologin-universal-v1.mjs
      - name: Preserve auth challenge human-exception contract
        run: node scripts/patch-browser-autologin-contract-v1.mjs
      - name: Test universal autonomous relogin contract
        run: node --test cerebro/runtime/browser-work-total-autologin-v1.test.mjs
      - name: Test session bundle integrity
        run: node --test cerebro/runtime/browser-session-bundle-v1.test.mjs
      - name: Syntax-check patched runtime and patches
        run: |
          node --check scripts/patch-browser-autologin-v1.mjs
          node --check scripts/patch-browser-autologin-ownerless-v1.mjs
          node --check scripts/patch-browser-autologin-universal-v1.mjs
          node --check scripts/patch-browser-autologin-contract-v1.mjs
          node --check cerebro/runtime/browser-interactive-session-v3.mjs
          node --check cerebro/runtime/browser-job-runner-v2.mjs
      - name: Build application
        run: npm run build
      - name: Assert no PROD execution path exists in this workflow
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const yml=fs.readFileSync('.github/workflows/cerebro-browser-autologin-universal-v1-preprod.yml','utf8');
          for(const forbidden of ['cluhljgonannaafpmblx.supabase.co','browser-work-total-v1-prod-canary','Execute at most one isolated PROD Work Total job']){
            if(yml.includes(forbidden))throw new Error(`PREPROD_WORKFLOW_PROD_PATH_FORBIDDEN:${forbidden}`);
          }
          console.log(JSON.stringify({ok:true,environment:'PREPROD_VALIDATION',prod_execution:false,incremental_cost_eur:0}));
          NODE
