name: JARVIS Online Voice LAB - Cloudflare Free Only Safety Gate

on:
  push:
    branches:
      - fix/jarvis-full-chat-dictation-voice-persona-lab-20261107
    paths:
      - '.github/workflows/jarvis-online-cloudflare-free-tts-lab-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-free-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CEREBRO_PROD_WRITE: 'false'
      CEREBRO_CRM_WRITE: 'false'
      JARVIS_VOICE_ONLINE_ENABLED: 'false'
      JARVIS_GATEWAY_ENABLED: 'false'
      CF_PAID_TTS_ENABLED: 'false'
      DEEPSEEK_AUTO_RESUME: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Free-only Voice Gate unit and privacy tests (no Cloudflare AI calls)
        run: node --test zeus/jarvis/voice/online-cloudflare-lab/*.test.mjs
      - name: Assert no mutation of Cloudflare original, public routes or canonical JARVIS clone
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const code=readFileSync('zeus/jarvis/voice/online-cloudflare-lab/jarvis-online-free-tts-port-v0.mjs','utf8');
          const http=readFileSync('zeus/jarvis/voice/online-cloudflare-lab/jarvis-online-free-voice-http-v0.mjs','utf8');
          const must=[
            'environment:"LAB"', 'defaultEnabled:false', 'autoTopup:false',
            'allowPaidOverage:false', 'productionAuthorized:false',
            'canonicalJarvisV2:false', 'cloudflare_account_plan',
            'accountWideFreeBudgetVerified', 'paidOverflowAllowed:false',
            'requireCloudflareFreePlanAttestation:true',
            'OWNER_SCOPE_DENIED', 'B3_DENY','VOICE_CONSENT_REQUIRED',
            'PRIVATE_CONTENT_REQUIRES_CANONICAL_LOCAL', 'UNVERIFIED_SHARED_FREE_QUOTA'
          ];
          for(const token of must)if(!code.includes(token))throw Error('FREE_TTS_SAFETY_POLICY_MISSING: '+token);
          if(code.includes('workers_dev: true')||code.includes('new Worker('))
            throw Error('CLOUDFLARE_ORIGINAL_RUNTIME_MUTATION_RISK');
          if(!code.includes('GENERIC_SPANISH_MALE_NOT_JARVIS_V2'))
            throw Error('CANNOT_CONFLATE_GENERIC_TTS_AND_APPROVED_V2');
          if(!http.includes('accessVerified')||
             !http.includes('GENERIC_NOT_JARVIS_V2')||
             !http.includes('CLIENT_PRIVILEGE_CLAIMS_FORBIDDEN')||
             !http.includes('cache-control')){
            throw Error('VOICE_HTTP_ACCESS_AND_PRIVACY_GATE_MISSING');
          }
          console.log('VOICE_FREE_ONLINE_LAB_SAFE_NO_PROD_NO_EXTERNAL_AI_CALLS');
          NODE
