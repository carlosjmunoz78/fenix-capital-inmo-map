name: CEREBRO Post-SCAN Parallel PREPROD V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'cerebro/multicompany/post-scan-parallel-v1.mjs'
      - 'cerebro/multicompany/rollback/post-scan-parallel-preprod-v1.rollback.sql'
      - 'cerebro/tests/post-scan-parallel-v1.test.mjs'
      - 'cerebro/tests/post-scan-parallel-preprod-persistence-v1.test.mjs'
      - 'supabase/migrations/20261013101500_cerebro_post_scan_parallel_preprod_v1.sql'
      - '.github/workflows/cerebro-post-scan-parallel-preprod-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/multicompany/post-scan-parallel-v1.mjs'
      - 'cerebro/multicompany/rollback/post-scan-parallel-preprod-v1.rollback.sql'
      - 'cerebro/tests/post-scan-parallel-v1.test.mjs'
      - 'cerebro/tests/post-scan-parallel-preprod-persistence-v1.test.mjs'
      - 'supabase/migrations/20261013101500_cerebro_post_scan_parallel_preprod_v1.sql'
      - '.github/workflows/cerebro-post-scan-parallel-preprod-v1.yml'

permissions:
  contents: read

concurrency:
  group: cerebro-post-scan-parallel-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  post-scan-parallel-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Validate canonical CEREBRO contracts
        working-directory: cerebro
        run: |
          npm run validate
          npm test
      - name: Prove shared logical runtime and durable contract
        run: |
          node --test \
            cerebro/tests/post-scan-parallel-v1.test.mjs \
            cerebro/tests/post-scan-parallel-preprod-persistence-v1.test.mjs
      - name: Assert strict PREPROD authority boundary
        shell: bash
        run: |
          set -euo pipefail
          runtime='cerebro/multicompany/post-scan-parallel-v1.mjs'
          m='supabase/migrations/20261013101500_cerebro_post_scan_parallel_preprod_v1.sql'
          r='cerebro/multicompany/rollback/post-scan-parallel-preprod-v1.rollback.sql'
          test -f "$runtime" && test -f "$m" && test -f "$r"
          grep -F "POST_SCAN_ENGINE_IDS=Object.freeze(['KW-001','WAUD-001','SOCAUD-001','LOCALP-001'])" "$runtime"
          grep -F "POST_SCAN_ENVIRONMENT='PREPROD'" "$runtime"
          grep -F 'cerebro_post_scan_audit_record_preprod' "$m"
          grep -F "engine_id in ('KW-001','WAUD-001','SOCAUD-001','LOCALP-001')" "$m"
          grep -F "engine_id='SEOBOOT-001' and state='BLOCKED'" "$m"
          grep -F "engine_id='SOCBOOT-001' and state='BLOCKED'" "$m"
          grep -F "engine_id='KBOOT-001' and state='BLOCKED'" "$m"
          grep -F "'BOOTSTRAP_TIER_DURABLE_EXECUTION_REQUIRED'" "$m"
          grep -F 'enable row level security' "$m"
          grep -F 'to service_role' "$m"
          ! grep -F 'cluhljgonannaafpmblx' "$m"
          ! grep -F 'fenix_prod.' "$m"
          ! grep -Eqi '\btruncate\b|\bdelete[[:space:]]+from\b' "$m"
          ! grep -Fi 'cascade' "$r"
      - name: Record boundary
        run: |
          echo 'KW-001 / WAUD-001 / SOCAUD-001 / LOCALP-001 share one deterministic PREPROD runtime and receipt layer.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No paid AI, remote mutation, PROD authority, Trading bridge or cross-company bypass is introduced.' >> "$GITHUB_STEP_SUMMARY"
