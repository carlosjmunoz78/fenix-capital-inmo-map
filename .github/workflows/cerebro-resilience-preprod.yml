name: CEREBRO DR-RBLD-BCP PREPROD
on:
  pull_request:
    branches: ['cerebro-iam-policy-v0-20260911']
    paths:
      - 'cerebro/resilience/resilience-gate.mjs'
      - 'cerebro/tests/resilience-gate.test.mjs'
      - '.github/workflows/cerebro-resilience-preprod.yml'
jobs:
  resilience-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/resilience-gate.test.mjs
