name: FACT001 Supabase admin exact disposable Edge Function DELETE
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase/supabase-admin-once/requests/delete.v1.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: fact001-supabase-admin-exact-once
  cancel-in-progress: false
jobs:
  retire-one-tested-function:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify signed IAM policy (no management credentials in GitHub)
        run: node --test cerebro/connectors/universal/supabase/supabase-admin-once/tests/policy.test.mjs
      - name: One signed CEREBRO request: remove ONLY isolated retired Edge Function
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const file='cerebro/connectors/universal/supabase/supabase-admin-once/requests/delete.v1.json';
          const order=JSON.parse(readFileSync(file,'utf8'));
          const expected={company_id:'fenix-capital',engine_id:'FACT-001',environment:'LAB',version:'1.0.0',project_ref:'cluhljgonannaafpmblx',client_id:'cerebro',function_slug:'cerebro-fact001-vercel-service-lab',function_id:'f004e7f1-4911-440d-8809-c656f5f89b38',operation:'supabase.edge_function.delete_disposable_test',request_id:'FACT001-SUPABASE-CLEANUP-20261110-001'};
          if(JSON.stringify(Object.keys(order).sort())!==JSON.stringify(Object.keys(expected).sort())||Object.entries(expected).some(([k,v])=>order[k]!==v))throw Error('UNAUTHORIZED_REQUEST_BODY');
          const base='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-fact001-vercel-service-lab';
          async function call(route,jwt,method='GET',body){
            const r=await fetch(base+'/'+route,{method,headers:{Accept:'application/json',...(jwt?{Authorization:'Bearer '+jwt}:{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}) ,redirect:'error',signal:AbortSignal.timeout(25000)});
            let d={};try{d=await r.json()}catch{}return {status:r.status,data:d};
          }
          const anon=await call('health');const forged=await call('health','invalid-jwt');
          if(anon.status!==401||forged.status!==401)throw Error('AUTH_BYPASS');
          console.log('FACT001_SB_ANON_401=true');
          console.log('FACT001_SB_FORGED_401=true');
          const endpoint=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,grant=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(!endpoint||!grant)throw Error('SIGNED_RUNNER_UNAVAILABLE');
          const aud='cerebro-fact001-supabase-admin-once-20261110';
          const reqUrl=endpoint+(endpoint.includes('?')?'&':'?')+'audience='+encodeURIComponent(aud);
          const auth=await fetch(reqUrl,{headers:{Authorization:'Bearer '+grant},redirect:'error',signal:AbortSignal.timeout(12000)});
          if(!auth.ok)throw Error('OIDC_HTTP_'+auth.status);
          const jwt=(await auth.json()).value;
          if(typeof jwt!=='string'||jwt.split('.').length!==3)throw Error('OIDC_MALFORMED');
          const health=await call('health',jwt);
          if(health.status!==200||health.data?.status!=='SIGNED_SERVICE_AUTHENTICATED')throw Error('SIGNED_SERVICE_DENIED');
          console.log('FACT001_SB_SIGNED_SERVICE_200=true');
          // Mutate once only; if network is interrupted during self-delete, do not retry!
          let response;
          try{response=await call('delete-once',jwt,'POST',order)}
          catch{console.log('FACT001_SB_DELETE_RESPONSE=UNCERTAIN_CHECK_MCP_LIST_NO_RETRY');exitCode=1;}
          if(response){
           console.log('FACT001_SB_DELETE_HTTP='+response.status);
           console.log('FACT001_SB_DELETE_STATUS='+String(response.data?.status||'NO_STATUS'));
           if(response.status!==200||!['SUPABASE_TEST_FUNCTION_DELETED_AND_VERIFIED','ALREADY_ABSENT_VERIFIED'].includes(response.data?.status))throw Error('ADMIN_DELETE_REQUIRES_RECONCILIATION');
           console.log('FACT001_SB_DELETE_E2E=ACCEPTED_PLEASE_VERIFY_MCP_LIST');
          }else process.exitCode=1;
          NODE
