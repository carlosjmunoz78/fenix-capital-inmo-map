name: CEREBRO MORTGAGE OPERATIONS FULL E2E REAL V1
on:
  workflow_dispatch:
  push:
    branches: [main, 'cerebro/lote4-mortgage-operations-full-preprod-v1*']
    paths:
      - 'cerebro/mortgage/mortgage-operations-native-v1.mjs'
      - 'cerebro/runtime/mortgage-operations-real-adoption-v1.mjs'
      - 'cerebro/tests/mortgage-operations-native-v1.test.mjs'
      - 'cerebro/tests/mortgage-operations-real-adoption-v1.test.mjs'
      - 'cerebro/registry/mortgage-operations-real-adoption-v1.json'
      - 'cerebro/docs/MORTGAGE_OPERATIONS_STRICT_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-mortgage-operations-full-e2e-real-v1.yml'
  pull_request:
    paths:
      - 'cerebro/mortgage/mortgage-operations-native-v1.mjs'
      - 'cerebro/runtime/mortgage-operations-real-adoption-v1.mjs'
      - 'cerebro/tests/mortgage-operations-native-v1.test.mjs'
      - 'cerebro/tests/mortgage-operations-real-adoption-v1.test.mjs'
      - 'cerebro/registry/mortgage-operations-real-adoption-v1.json'
      - 'cerebro/docs/MORTGAGE_OPERATIONS_STRICT_V1_RUNBOOK.md'
      - '.github/workflows/cerebro-mortgage-operations-full-e2e-real-v1.yml'
permissions: {contents: read, actions: read}

jobs:
  strict-mortgage-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Canonical registry validation
        working-directory: cerebro
        run: npm run validate
      - name: Preserve already-certified commercial and customer journey blocks
        run: |
          git diff --exit-code 32f0223f59fe6259fbd0934320fd4c2b567d60c5 -- \
            cerebro/runtime/lead-native-v1.mjs \
            cerebro/runtime/sale-native-v1.mjs \
            cerebro/communication/com-delivery-router-v1.mjs \
            cerebro/communication/notif-native-v1.mjs \
            cerebro/customer/c360-native-v1.mjs \
            cerebro/customer/customer-journey-native-v1.mjs \
            cerebro/customer/ret-ref-rep-runtime-v0.mjs \
            cerebro/registry/sale-real-consumer-adoption-v1.json \
            cerebro/registry/lote3-com-notif-c360-real-v1.json \
            cerebro/registry/customer-journey-real-adoption-v1.json
      - name: Native and strict mortgage tests
        run: >-
          node --test
          cerebro/tests/mortgage-operations-native-v1.test.mjs
          cerebro/tests/mortgage-operations-real-adoption-v1.test.mjs
      - name: Execute strict mortgage route
        run: |
          mkdir -p /tmp/cerebro-mortgage
          node cerebro/runtime/mortgage-operations-real-adoption-v1.mjs \
            --company fenix \
            --workdir /tmp/cerebro-mortgage/state \
            --source-run-id "${{ github.run_id }}" \
            --source-head-sha "${{ github.sha }}" \
            --out /tmp/cerebro-mortgage/report.json
      - name: Strict FULL E2E gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cerebro-mortgage/report.json','utf8'));
          const required=['VIA-001','BNK-001','BNK-002','BNK-003','BNK-004','BNK-005','BNK-006','OFR-001','LRN-001','OBSERV-001','FINOPS-001'];
          const expected={'VIA-001':'MORTGAGE_VIABILITY_READY','BNK-001':'BANK_KNOWLEDGE_READY','BNK-002':'BANK_RANKING_READY','BNK-003':'BANK_ROUTING_PLAN_READY','BNK-004':'BANK_PRESENTATION_PLAN_READY','BNK-005':'BANK_FOLLOWUP_PLAN_READY','BNK-006':'BANK_NEGOTIATION_PLAN_READY','OFR-001':'OFFER_COMPARISON_READY','LRN-001':'LRN_FEEDBACK_PERSISTED','OBSERV-001':'OBSERVABILITY_RECORDED','FINOPS-001':'FINOPS_ZERO_COST_RECORDED'};
          if(r.status!=='FULL_E2E_REAL_PREPROD'||r.full_e2e_real_preprod!==true)throw new Error('mortgage strict FULL not green');
          if(JSON.stringify(r.required_consumers)!==JSON.stringify(required)||r.consumer_coverage!==1||r.functional_consumer_coverage!==1||r.missing_consumers.length||r.failed_consumers.length)throw new Error('consumer coverage incomplete');
          if(!required.every(id=>r.consumer_map?.[id]?.decision===expected[id]&&r.consumer_map[id].real_consumption===true&&r.consumer_map[id].outcome_hash))throw new Error('semantic proof incomplete');
          if(r.independent_tribunal?.decision!=='PASS'||r.audit_green!==true)throw new Error('tribunal/audit failed');
          const b=r.mortgage_bundle;
          if(b.actual_credit_decision!==false||b.actual_bank_submission!==false||b.actual_external_contact!==false||b.viability?.credit_decision!==false||b.viability?.lender_commitment!==false||b.presentation?.bank_submission_authorized!==false||b.followup?.external_communication!==false||b.negotiation?.external_communication!==false)throw new Error('mortgage authority leak');
          const br=r.backup_rollback_rebuild;if(!br?.backup_ready||!br.rollback_green||!br.rebuild_green||br.applied_state_hash!==br.rebuilt_state_hash)throw new Error('backup/rollback/rebuild failed');
          if(r.restartable!==true||r.idempotency_proven!==true||r.additional_cost_eur!==0)throw new Error('restart/idempotency/cost failed');
          const forbidden=['prod_authorized','prod_write_authorized','db_mutation_authorized','crm_write_authorized','provider_write_authorized','bank_submission_authorized','credit_decision_authorized','external_communication_authorized','spend_authorized','trading_access','external_code_execution'];
          if(forbidden.some(k=>r[k]!==false))throw new Error('authority expanded');
          console.log(JSON.stringify({status:'GREEN',bundle_id:r.bundle_id,outcome_hash:r.outcome_hash}));
          NODE
      - name: Registry state and authority gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('cerebro/registry/mortgage-operations-real-adoption-v1.json','utf8'));
          const allowedStates=new Set(['STRICT_CANDIDATE_PREPROD','FULL_E2E_REAL_PREPROD']);
          if(r.environment!=='PREPROD'||!allowedStates.has(r.status)||r.strict_target_status!=='FULL_E2E_REAL_PREPROD')throw new Error('registry state invalid');
          if(r.status==='FULL_E2E_REAL_PREPROD'&&r.main_gate?.full_e2e_real_preprod!==true)throw new Error('certified state lacks main evidence');
          const ids=['VIA-001','BNK-001','BNK-002','BNK-003','BNK-004','BNK-005','BNK-006','OFR-001'];
          if(!ids.every(id=>r.engines?.[id]?.decision==='EXTEND_HISTORICAL_CONTRACT'))throw new Error('historical contracts not reconciled');
          const a=r.authority;const keys=['prod_authorized','prod_write_authorized','db_mutation_authorized','crm_write_authorized','provider_write_authorized','bank_submission_authorized','credit_decision_authorized','external_communication_authorized','spend_authorized','trading_access','external_code_execution'];
          if(keys.some(k=>a[k]!==false)||a.additional_cost_eur!==0)throw new Error('authority/cost expanded');
          NODE
      - name: Upload strict mortgage evidence
        uses: actions/upload-artifact@v4
        with:
          name: mortgage-operations-full-e2e-real-${{ github.run_id }}
          path: |
            /tmp/cerebro-mortgage/report.json
            /tmp/cerebro-mortgage/state
          retention-days: 30
          if-no-files-found: error
