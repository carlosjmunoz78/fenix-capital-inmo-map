name: Promote PROD once efb15bee

on:
  push:
    branches:
      - prod-preparation

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact immutable candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 34382958285 --repo "$GITHUB_REPOSITORY" --name "fenix-prod-candidate-efb15bee38dcf045fb58c787237416a08070f52d" --dir candidate
      - name: Validate and extract exact immutable candidate
        run: |
          set -euo pipefail
          test -f candidate/PROD_CANDIDATE_SHA
          test -f candidate/PROD_CANDIDATE_METADATA.txt
          test -f candidate/fenix-prod-candidate.tgz
          test -f candidate/fenix-prod-candidate.tgz.sha256
          test "$(tr -d '\r\n' < candidate/PROD_CANDIDATE_SHA)" = "efb15bee38dcf045fb58c787237416a08070f52d"
          grep -Fxq 'source_sha=efb15bee38dcf045fb58c787237416a08070f52d' candidate/PROD_CANDIDATE_METADATA.txt
          grep -Fxq 'workflow_run_id=34382958285' candidate/PROD_CANDIDATE_METADATA.txt
          (cd candidate && sha256sum -c fenix-prod-candidate.tgz.sha256)
          mkdir -p candidate/dist
          tar -xzf candidate/fenix-prod-candidate.tgz -C candidate/dist
          leaks="$(grep -RInE --include='*.js' --include='*.html' --include='*.css' 'functions/v1/[A-Za-z0-9_-]+-test' candidate/dist || true)"
          if [ -n "$leaks" ]; then
            printf '%s\n' "$leaks"
            echo 'TEST endpoint leaked into exact immutable PROD candidate' >&2
            exit 1
          fi
          test -f candidate/dist/index.html
          test -f candidate/dist/CNAME
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Promote exact artifact without rebuild
        run: |
          set -euo pipefail
          find site -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a candidate/dist/. site/
          printf '%s\n' 'efb15bee38dcf045fb58c787237416a08070f52d' > site/PROD_SOURCE_SHA.txt
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No deployment changes required'
          else
            git commit -m 'deploy(prod): efb15bee exact immutable candidate'
            git push origin gh-pages
          fi
      - name: Post-deploy read-only smoke
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            body="$(curl -fsS --max-time 20 https://app.fenixcapital.es/PROD_SOURCE_SHA.txt || true)"
            if [ "$(printf '%s' "$body" | tr -d '\r\n')" = 'efb15bee38dcf045fb58c787237416a08070f52d' ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'PROD_SOURCE_SHA marker did not converge to expected SHA'
          exit 1
