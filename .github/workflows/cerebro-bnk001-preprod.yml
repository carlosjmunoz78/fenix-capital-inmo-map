name: CEREBRO BNK-001 PREPROD
on:
  pull_request:
    branches: ['cerebro-via001-mortgage-viability-v0-20260911']
    paths:
      - 'cerebro/finance/bank-knowledge-engine.mjs'
      - 'cerebro/tests/bank-knowledge-engine.test.mjs'
      - '.github/workflows/cerebro-bnk001-preprod.yml'
jobs:
  bnk001-preprod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cerebro/tests/bank-knowledge-engine.test.mjs
