name: UMS001 DeepSeek premium creative autonomous image LAB one-job
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'cerebro/media-studio/v2/requests/deepseek-auto/UMS001-IGC202603-DEEPSEEK-ARTLAB-20261111-01.json'
permissions:
  contents: write
concurrency:
  group: ums001-deepseek-igc202603-once-20261111
  cancel-in-progress: false
jobs:
  autonomous-creative-canary:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'cerebro/ums-replicate-flux-paid-lab-v0-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      LAB_JOB_FILE: cerebro/media-studio/v2/requests/deepseek-auto/UMS001-IGC202603-DEEPSEEK-ARTLAB-20261111-01.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Demand exact owner job request changed in this commit
        id: requested
        run: |
          if git show --format= --name-only HEAD | grep -Fxq "$LAB_JOB_FILE"; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile and verify premium photography contract before paid calls
        if: steps.requested.outputs.eligible == 'true'
        run: |
          python3 -m py_compile cerebro/media-studio/v2/runtime/ums001_deepseek_primary_auto_lab_v1.py
          python3 cerebro/media-studio/v2/tests/test_ums001_deepseek_primary_auto_lab_v1.py -v
          python3 cerebro/media-studio/v2/runtime/ums001_deepseek_primary_auto_lab_v1.py --job "$LAB_JOB_FILE" --validate-only
      - name: Verify already-configured encrypted DeepSeek and Replicate credentials
        if: steps.requested.outputs.eligible == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo 'BLOCKED: DeepSeek secret DEEPSEEK_API_KEY is not configured in this LAB repository.'
            exit 3
          fi
          if [ -z "$REPLICATE_API_TOKEN" ]; then
            echo 'BLOCKED: Replicate LAB secret is not configured.'
            exit 3
          fi
          echo 'LAB provider secrets present, values never printed.'
      - name: Execute CEREBRO DeepSeek prompt -> Replicate -> DeepSeek Vision QA only
        if: steps.requested.outputs.eligible == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GH_TOKEN_FOR_LAB: ${{ secrets.GITHUB_TOKEN }}
          UMS001_DEEPSEEK_AUTOMATION_GATE: OWNER_AUTHORIZED_LAB_20261111
        run: python3 cerebro/media-studio/v2/runtime/ums001_deepseek_primary_auto_lab_v1.py --job "$LAB_JOB_FILE"
      - name: Preserve all generated files and QA audit for independent visual evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ums001-deepseek-autonomous-premium-igc202603-lab
          path: ${{ runner.temp }}/ums001-deepseek-autonomous/
          if-no-files-found: warn
          retention-days: 14
      - name: Safety and cost receipt
        if: always()
        run: |
          echo 'LAB only, no social publication, no PROD, no Cloudflare AI.'
          echo 'Two Replicate predictions maximum: $0.12 existing credit estimate.'
          echo 'Four DeepSeek Flash calls maximum and conservative $0.05 usage cap.'
          echo 'If credentials unavailable: no paid calls; mark blocked, not GREEN.'
