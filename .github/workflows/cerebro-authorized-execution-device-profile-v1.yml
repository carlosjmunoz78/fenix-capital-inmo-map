name: CEREBRO Authorized Execution Device Profile V1

on:
  pull_request:
    paths:
      - 'cerebro/runtime/authorized-execution-device-profile-v1.mjs'
      - 'cerebro/tests/authorized-execution-device-profile-v1.test.mjs'
      - 'cerebro/registry/authorized-execution-device-profile.v1.json'
      - 'cerebro/docs/CEREBRO_AUTHORIZED_EXECUTION_DEVICE_PROFILE_V1_2026-10-14.md'
      - 'cerebro/governance/identity-credential-broker.mjs'
      - 'cerebro/governance/identity-session-lifecycle.mjs'
      - 'cerebro/router/execution-model-router.mjs'
      - 'cerebro/runtime/continuous-improvement-contract.mjs'
      - '.github/workflows/cerebro-authorized-execution-device-profile-v1.yml'
  push:
    branches: [main]
    paths:
      - 'cerebro/runtime/authorized-execution-device-profile-v1.mjs'
      - 'cerebro/tests/authorized-execution-device-profile-v1.test.mjs'
      - 'cerebro/registry/authorized-execution-device-profile.v1.json'
      - 'cerebro/docs/CEREBRO_AUTHORIZED_EXECUTION_DEVICE_PROFILE_V1_2026-10-14.md'
      - 'cerebro/governance/identity-credential-broker.mjs'
      - 'cerebro/governance/identity-session-lifecycle.mjs'
      - 'cerebro/router/execution-model-router.mjs'
      - 'cerebro/runtime/continuous-improvement-contract.mjs'
      - '.github/workflows/cerebro-authorized-execution-device-profile-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-authorized-execution-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cerebro/tests/authorized-execution-device-profile-v1.test.mjs

  existing-control-plane-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cerebro/tests/identity-credential-broker-v0.test.mjs cerebro/tests/identity-session-lifecycle-v0.test.mjs cerebro/tests/execution-model-router-v0.test.mjs

  candidate-full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cerebro/tests/*.test.mjs

  base-full-suite:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cerebro/tests/*.test.mjs
