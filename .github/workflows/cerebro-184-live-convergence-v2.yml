name: CEREBRO 184 Live Convergence V2

on:
  push:
    paths:
      - 'cerebro/skills/cerebro-184-live-convergence.v2.json'
      - 'cerebro/skills/cerebro-184-live-convergence-controller-v1.mjs'
      - 'cerebro/skills/cerebro-184-items-1-24-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-25-37-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-38-50-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-51-61-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-62-68-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-69-73-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-74-82-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-83-92-live-reconciliation.v2.json'
      - 'cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs'
      - 'cerebro/tests/cerebro-184-items-1-24-live-reconciliation-v2.test.mjs'
      - 'cerebro/tests/cerebro-184-items-25-50-live-reconciliation-v2.test.mjs'
      - 'cerebro/tests/cerebro-184-items-51-61-live-reconciliation-v2.test.mjs'
      - 'cerebro/tests/cerebro-184-items-62-92-live-reconciliation-v2.test.mjs'
      - '.github/workflows/cerebro-184-live-convergence-v2.yml'
  pull_request:
    paths:
      - 'cerebro/skills/cerebro-184-live-convergence.v2.json'
      - 'cerebro/skills/cerebro-184-live-convergence-controller-v1.mjs'
      - 'cerebro/skills/cerebro-184-items-1-24-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-25-37-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-38-50-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-51-61-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-62-68-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-69-73-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-74-82-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-83-92-live-reconciliation.v2.json'
      - 'cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs'
      - 'cerebro/tests/cerebro-184-items-1-24-live-reconciliation-v2.test.mjs'
      - 'cerebro/tests/cerebro-184-items-25-50-live-reconciliation-v2.test.mjs'
      - 'cerebro/tests/cerebro-184-items-51-61-live-reconciliation-v2.test.mjs'
      - 'cerebro/tests/cerebro-184-items-62-92-live-reconciliation-v2.test.mjs'
      - '.github/workflows/cerebro-184-live-convergence-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Focused 184 convergence contracts
        run: >-
          node --test
          cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs
          cerebro/tests/cerebro-184-items-1-24-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-25-50-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-51-61-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-62-92-live-reconciliation-v2.test.mjs
      - name: Generate fail-closed convergence report
        run: node cerebro/skills/cerebro-184-live-convergence-controller-v1.mjs | tee /tmp/cerebro-184-live-convergence-report.json
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO OLD-vs-NEW regression baseline
        working-directory: cerebro
        run: npm test
      - name: Enforce authority boundary
        run: >-
          node -e "const s=require('./cerebro/skills/cerebro-184-live-convergence.v2.json'); const files=['1-24','25-37','38-50','51-61','62-68','69-73','74-82','83-92'].map(x=>require('./cerebro/skills/cerebro-184-items-'+x+'-live-reconciliation.v2.json')); const a=s.authority; const denied=x=>x.prod_authorized||x.prod_write_authorized||x.auto_merge_authorized||x.external_skill_code_execution_authorized||x.external_dependency_install_authorized||x.customer_data_authorized||x.trading_access||x.automatic_paid_fallback||x.additional_cost_eur!==0; if(a.prod_authorized||a.prod_write_authorized||a.auto_merge_authorized||a.external_skill_code_execution_authorized||a.customer_data_authorized||a.trading_access||a.automatic_paid_fallback||a.additional_cost_eur!==0) process.exit(1); if(files.some(x=>denied(x.authority))) process.exit(1); if(s.normalized_item_count!==92||s.remaining_item_normalization_count!==92) process.exit(1); if(files.some(x=>x.summary.additional_cost_eur!==0||x.items.some(i=>i.disposition==='PAGO_JUSTIFICADO'))) process.exit(1); const byId=id=>files.flatMap(x=>x.items).find(i=>i.id===id); for(const id of [47,48,57,62,74]) if(byId(id)?.disposition!=='FABRICAR_GRATIS') process.exit(1); for(const id of [45,54,69,72,76,78,90]) if(byId(id)?.disposition!=='HOLD') process.exit(1); if(s.deployment_boundary.main_is_cloudflare_production_branch!==false||s.deployment_boundary.cloudflare_production_branch!=='deploy/cloudflare-prod') process.exit(1); console.log('184 authority and 1-92 reconciliation boundary GREEN')"
      - name: Upload convergence report
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-184-live-convergence-report
          path: /tmp/cerebro-184-live-convergence-report.json
          retention-days: 14
