name: CEREBRO 184 Live Convergence V2

on:
  push:
    paths:
      - 'cerebro/skills/cerebro-184-live-convergence.v2.json'
      - 'cerebro/skills/cerebro-184-live-convergence-controller-v1.mjs'
      - 'cerebro/skills/cerebro-184-items-1-24-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-25-37-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-38-50-live-reconciliation.v2.json'
      - 'cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs'
      - 'cerebro/tests/cerebro-184-items-1-24-live-reconciliation-v2.test.mjs'
      - 'cerebro/tests/cerebro-184-items-25-50-live-reconciliation-v2.test.mjs'
      - '.github/workflows/cerebro-184-live-convergence-v2.yml'
  pull_request:
    paths:
      - 'cerebro/skills/cerebro-184-live-convergence.v2.json'
      - 'cerebro/skills/cerebro-184-live-convergence-controller-v1.mjs'
      - 'cerebro/skills/cerebro-184-items-1-24-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-25-37-live-reconciliation.v2.json'
      - 'cerebro/skills/cerebro-184-items-38-50-live-reconciliation.v2.json'
      - 'cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs'
      - 'cerebro/tests/cerebro-184-items-1-24-live-reconciliation-v2.test.mjs'
      - 'cerebro/tests/cerebro-184-items-25-50-live-reconciliation-v2.test.mjs'
      - '.github/workflows/cerebro-184-live-convergence-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Focused 184 convergence contracts
        run: >-
          node --test
          cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs
          cerebro/tests/cerebro-184-items-1-24-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-25-50-live-reconciliation-v2.test.mjs
      - name: Generate fail-closed convergence report
        run: node cerebro/skills/cerebro-184-live-convergence-controller-v1.mjs | tee /tmp/cerebro-184-live-convergence-report.json
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO OLD-vs-NEW regression baseline
        working-directory: cerebro
        run: npm test
      - name: Enforce authority boundary
        run: >-
          node -e "const s=require('./cerebro/skills/cerebro-184-live-convergence.v2.json'); const r=require('./cerebro/skills/cerebro-184-items-1-24-live-reconciliation.v2.json'); const r25=require('./cerebro/skills/cerebro-184-items-25-37-live-reconciliation.v2.json'); const r38=require('./cerebro/skills/cerebro-184-items-38-50-live-reconciliation.v2.json'); const a=s.authority; const all=[r,r25,r38]; const denied=x=>x.prod_authorized||x.prod_write_authorized||x.auto_merge_authorized||x.external_skill_code_execution_authorized||x.external_dependency_install_authorized||x.customer_data_authorized||x.trading_access||x.automatic_paid_fallback||x.additional_cost_eur!==0; if(a.prod_authorized||a.prod_write_authorized||a.auto_merge_authorized||a.external_skill_code_execution_authorized||a.customer_data_authorized||a.trading_access||a.automatic_paid_fallback||a.additional_cost_eur!==0) process.exit(1); if(all.some(x=>denied(x.authority))) process.exit(1); if(s.normalized_item_count!==50||s.remaining_item_normalization_count!==134) process.exit(1); if(r.summary.active_unresolved!==0||r.summary.additional_cost_eur!==0||r.summary.external_code_executed!==false||r.summary.external_dependencies_installed.length!==0||r.summary.new_engine_ids_created.length!==0) process.exit(1); if(r25.summary.additional_cost_eur!==0||r25.items.some(i=>i.disposition==='PAGO_JUSTIFICADO')) process.exit(1); if(r38.summary.additional_cost_eur!==0||r38.items.some(i=>i.disposition==='PAGO_JUSTIFICADO')) process.exit(1); if(r38.items.find(i=>i.id===47)?.disposition!=='FABRICAR_GRATIS'||r38.items.find(i=>i.id===48)?.disposition!=='FABRICAR_GRATIS') process.exit(1); if(s.deployment_boundary.main_is_cloudflare_production_branch!==false||s.deployment_boundary.cloudflare_production_branch!=='deploy/cloudflare-prod') process.exit(1); console.log('184 authority and 1-50 reconciliation boundary GREEN')"
      - name: Upload convergence report
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-184-live-convergence-report
          path: /tmp/cerebro-184-live-convergence-report.json
          retention-days: 14
