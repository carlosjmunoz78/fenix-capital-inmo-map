permissions:
  contents: read

jobs:
  live-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Focused 184 convergence contracts
        run: >-
          node --test
          cerebro/tests/cerebro-184-live-convergence-controller-v1.test.mjs
          cerebro/tests/cerebro-184-fact001-gap-router-v1.test.mjs
          cerebro/tests/fact001-gap-capabilities-v0.test.mjs
          cerebro/tests/evt001-browser-staging-e2e-v0.test.mjs
          cerebro/tests/cerebro-184-items-1-24-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-25-50-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-51-61-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-62-92-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-93-131-live-reconciliation-v2.test.mjs
          cerebro/tests/cerebro-184-items-132-184-live-reconciliation-v2.test.mjs
      - name: Generate fail-closed convergence report
        run: node cerebro/skills/cerebro-184-live-convergence-controller-v1.mjs | tee /tmp/cerebro-184-live-convergence-report.json
      - name: Validate FACT-001 gap routing
        run: node cerebro/runtime/cerebro-184-fact001-gap-router-v1.mjs | tee /tmp/cerebro-184-fact001-gap-routing-report.json
      - name: Validate canonical engine registry
        working-directory: cerebro
        run: npm run validate
      - name: Full CEREBRO OLD-vs-NEW regression baseline
        working-directory: cerebro
        run: npm test
      - name: Enforce authority boundary and live physical evidence
        run: >-
          node -e "const s=require('./cerebro/skills/cerebro-184-live-convergence.v2.json'); const g=require('./cerebro/skills/cerebro-184-fact001-gap-routing.v1.json'); const p=require('./cerebro/registry/fact001-gap-capabilities.v0.json'); const e=require('./cerebro/registry/fact001-six-gap-old-vs-new.v0.json'); const x=require('./cerebro/registry/fact001-six-gap-physical-e2e.v0.json'); const remote=require('./cerebro/registry/fact001-remote-source-bindings-57-62.v0.json'); const watch=require('./cerebro/registry/watch-learn-remote-observation.v0.json'); const android=require('./cerebro/registry/fact001-android-staging-48-183.v0.json'); const evt=require('./cerebro/registry/evt001-browser-staging-e2e.v0.json'); const b3=require('./cerebro/registry/b3-readonly-audit-schema-blocker.v0.json'); const names=['1-24','25-37','38-50','51-61','62-68','69-73','74-82','83-92','93-104','105-117','118-131','132-142','143-151','152-161','162-175','176-184']; const files=names.map(v=>require('./cerebro/skills/cerebro-184-items-'+v+'-live-reconciliation.v2.json')); const denied=a=>a.prod_authorized||a.prod_write_authorized||a.auto_merge_authorized||a.external_skill_code_execution_authorized||a.external_dependency_install_authorized||a.customer_data_authorized||a.trading_access||a.automatic_paid_fallback||a.additional_cost_eur!==0; if(denied(s.authority)||files.some(v=>denied(v.authority))||denied(g.policy)||denied(p.authority)||denied(e.authority)||denied(x.authority)||denied(remote.authority)||denied(watch.authority)||denied(android.authority)||denied(evt.authority)||denied(b3.authority)) process.exit(1); if(s.normalized_item_count!==184||s.remaining_item_normalization_count!==0) process.exit(1); if(files.some(v=>v.summary.additional_cost_eur!==0||v.items.some(i=>i.disposition==='PAGO_JUSTIFICADO'))) process.exit(1); const byId=id=>files.flatMap(v=>v.items).find(i=>i.id===id); for(const id of [47,48,57,62,74,183]) if(byId(id)?.disposition!=='FABRICAR_GRATIS') process.exit(1); if(JSON.stringify(g.summary.item_ids)!==JSON.stringify([47,48,57,62,74,183])||g.summary.new_engine_ids_created.length!==0||g.summary.additional_cost_eur!==0) process.exit(1); if(p.status!=='VERIFIED_PREPROD_CORE_PHYSICAL_BINDINGS_PENDING'||e.global_decision!=='NEW_BETTER_NO_REGRESSION_AT_PREPROD_CORE_SCOPE'||x.status!=='VERIFIED_LOCAL_E2E_EXTERNAL_BINDINGS_PENDING'||remote.status!=='VERIFIED_REMOTE_PREPROD_SOURCE_BINDINGS_GREEN'||watch.status!=='CONTINUOUS_PREPROD_ACCEPTANCE_GREEN'||android.status!=='VERIFIED_SIGNED_APK_BUILD_AND_STAGING_DRAFT_PREVIEW_GREEN'||evt.status!=='VERIFIED_BROWSER_FIRST_PARTY_EMITTER_PERSISTENCE_IDEMPOTENCY_GREEN_SERVER_JOURNAL_BINDING_PENDING'||b3.status!=='CORE_GUARD_SCHEMA_BLOCKER_RESOLVED_B3_READONLY_GREEN_SERVER_WRITE_BINDING_PENDING') process.exit(1); if(android.item_48.physical_device_bound||android.item_183.physical_device_installed||android.item_183.web_staging_acceptance.page_status!=='draft'||!android.item_183.web_staging_acceptance.robots_noindex||android.item_183.web_staging_acceptance.public_prod_deploy) process.exit(1); if(evt.wordpress_staging.page_status!=='draft'||!evt.wordpress_staging.robots_noindex||!evt.wordpress_staging.robots_nofollow||evt.wordpress_staging.public_publish_performed||!evt.physical_evidence.browser_script_executed||evt.physical_evidence.second_load_mode!=='EVENT_REPLAY_IDEMPOTENT'||evt.physical_evidence.server_side_event_persistence_claimed||evt.server_binding_audit.current_connected_mcp_get_observe_granted||evt.server_binding_audit.permission_weakened_or_bypassed||evt.server_binding_audit.server_journal_binding_verified) process.exit(1); if(b3.schema_resolution.result!=='GREEN'||b3.schema_resolution.readiness_after.schema_version_status!=='pass'||b3.schema_resolution.readiness_after.schema_version_detail!=='1'||!b3.schema_resolution.readiness_after.ready_for_preprod_observer||b3.schema_resolution.readiness_after.blocking_failures.length!==0||b3.live_core_guard_after_resolution.health_score!==100||b3.live_core_guard_after_resolution.mode!=='observer'||b3.live_core_guard_after_resolution.runtime_gate_active||b3.live_core_guard_after_resolution.operational_writes_allowed||!b3.live_b3_journal_observe.ok||!b3.live_b3_journal_observe.sources_sha256_match||!b3.live_b3_journal_observe.innodb_unique_index||b3.live_b3_journal_observe.writes_performed!==0||!b3.live_universal_qa_replay.replay||b3.live_universal_qa_replay.writes_performed||b3.server_write_contract_audit.permission_weakened_or_bypassed||b3.server_write_contract_audit.new_server_journal_write_performed||b3.server_write_contract_audit.server_write_binding_verified_for_evt001||b3.authority.server_journal_write_authorized||b3.authority.persistent_core_guard_gate_authorized) process.exit(1); for(const id of [45,54,69,72,76,78,90,109,110,171,172,173,174]) if(byId(id)?.disposition!=='HOLD') process.exit(1); if(byId(177)?.state!=='FULL_PREPROD_DETERMINISTIC_LOCAL') process.exit(1); if(s.priority_queue[0]!=='VERIFY_EXACT_INSTALLED_B3_WRITE_ADAPTER_AND_GRANT_CONTRACT_THEN_RUN_NEW_SYNTHETIC_INTENT_LEASE_GATE_VERIFY_RECEIPT_ROLLBACK_E2E') process.exit(1); if(s.deployment_boundary.main_is_cloudflare_production_branch!==false||s.deployment_boundary.cloudflare_production_branch!=='deploy/cloudflare-prod') process.exit(1); console.log('184 convergence GREEN: Core Guard schema=1/readiness green; B3 read-only live verified; 74 server write E2E remains fail-closed pending exact installed contract')"
      - name: Upload convergence reports
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-184-live-convergence-reports
          path: |
            /tmp/cerebro-184-live-convergence-report.json
            /tmp/cerebro-184-fact001-gap-routing-report.json
          retention-days: 14