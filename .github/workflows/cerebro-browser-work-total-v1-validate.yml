name: CEREBRO Browser Work Total V1 Validate

on:
  push:
    branches:
      - 'promote/browser-work-total-main-final-20261025'
      - 'fix/browser-realtime-fullsize-20261026'
      - 'main'
      - 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
    paths:
      - '.github/workflows/cerebro-browser-work-total-v1-validate.yml'
      - 'public/browser-ergonomics-v1.css'
      - 'public/browser-ergonomics-v1.js'
      - 'src/main.tsx'
      - 'src/cerebroBrowserWorkTotalDock.ts'
      - 'src/cerebroBrowserInteractive.ts'
      - 'src/CerebroBrowserConsole.tsx'
      - 'cerebro/runtime/browser-session-freshness-v3.ts'
      - 'cerebro/tests/browser-console-session-freshness.test.mjs'
      - 'cerebro/runtime/browser-interactive-session-v3.mjs'
      - 'cerebro/runtime/browser-session-bundle-v1.mjs'
      - 'cerebro/runtime/browser-session-bundle-v1.test.mjs'
      - 'cerebro/runtime/browser-work-total-v1-contract.test.mjs'
      - 'cerebro/runtime/browser-work-total-v1-prod-contract.test.mjs'
      - 'cerebro/runtime/browser-ergonomics-p0.test.mjs'
      - 'supabase/functions/cerebro-browser-work-total-owner-v1-prod/**'
      - 'supabase/functions/cerebro-browser-work-total-v1-prod/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-browser-work-total-v1-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Work Total UI + runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test session bundle integrity
        run: node --test cerebro/runtime/browser-session-bundle-v1.test.mjs
      - name: Test Work Total contracts
        run: node --test cerebro/runtime/browser-work-total-v1-contract.test.mjs
      - name: Test Work Total PROD contracts
        run: node --test cerebro/runtime/browser-work-total-v1-prod-contract.test.mjs
      - name: Verify isolated NAVEGADOR changes only
        if: github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$(git merge-base HEAD origin/main)" HEAD | while IFS= read -r file; do
            case "$file" in
              src/CerebroBrowserConsole.tsx|src/cerebroBrowserSessionFreshness.ts|cerebro/runtime/browser-session-freshness-v3.ts|cerebro/tests/browser-console-session-freshness.test.mjs|cerebro/runtime/browser-work-total-v1-contract.test.mjs|cerebro/runtime/browser-work-total-v1-prod-contract.test.mjs|cerebro/runtime/browser-ergonomics-p0.test.mjs|.github/workflows/cerebro-browser-work-total-v1-validate.yml|supabase/functions/cerebro-browser-interactive-v3/gateway-prod.ts) echo "ALLOWED $file" ;;
              *) echo "UNEXPECTED_CHANGE $file"; exit 1 ;;
            esac
          done
      - name: Prove owner/list projection adds expiry only (no new authority)
        if: github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/functions/cerebro-browser-interactive-v3/gateway-prod.ts'
          base="$(git merge-base HEAD origin/main)"
          git show "$base:$file" > /tmp/browser-owner-status-before.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const original=fs.readFileSync('/tmp/browser-owner-status-before.ts','utf8');
          const candidate=fs.readFileSync('supabase/functions/cerebro-browser-interactive-v3/gateway-prod.ts','utf8');
          const old="'session_id,state,control_owner,worker_alive,current_url,current_title,opened_at,last_heartbeat_at,closed_at,updated_at'";
          const newer="'session_id,state,control_owner,worker_alive,current_url,current_title,opened_at,last_heartbeat_at,expires_at,closed_at,updated_at'";
          if(original.split(old).length!==2||candidate!==original.replace(old,newer)){
            console.error('HOLD_OWNER_LIST_DIFF_OUT_OF_SCOPE: only existing expires_at column may be projected');
            process.exit(1);
          }
          console.log('PASS_OWNER_LIST_EXPIRES_AT_READ_ONLY; old authority unchanged; no routes or mutations added');
          NODE
      - name: Test browser session freshness P0
        run: node --test cerebro/tests/browser-console-session-freshness.test.mjs
      - name: Test browser P0 ergonomics
        run: node --test cerebro/runtime/browser-ergonomics-p0.test.mjs
      - name: Syntax-check interactive runtime
        run: node --check cerebro/runtime/browser-interactive-session-v3.mjs
      - name: Build App with Work Total dock mounted
        run: npm run build
      - name: Owner gateway E2E identity check · read-only, no secret disclosure
        if: github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        env:
          CEREBRO_E2E_OWNER_JWT: ${{ secrets.CEREBRO_E2E_USER_JWT }}
          CEREBRO_E2E_PUBLISHABLE_KEY: ${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const jwt=process.env.CEREBRO_E2E_OWNER_JWT||'';
          const key=process.env.CEREBRO_E2E_PUBLISHABLE_KEY||'';
          let result='OWNER_IDENTITY_PROOF_UNAVAILABLE';
          let status=null;
          if(jwt&&key){
            try{
              const response=await fetch('https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-browser-gateway-v1/owner/status',{
                method:'POST',
                headers:{authorization:`Bearer ${jwt}`,apikey:key,'content-type':'application/json',origin:'https://app.fenixcapital.es'},
                body:JSON.stringify({company_id:'fenix',list:true}),
                redirect:'error',signal:AbortSignal.timeout(12000)
              });
              status=response.status;
              const body=await response.json().catch(()=>null);
              result=response.status===200&&body?.ok===true&&Array.isArray(body?.sessions)
                ?'OWNER_IDENTITY_VERIFIED_READ_ONLY':'OWNER_IDENTITY_NOT_VERIFIED';
            }catch{result='OWNER_GATEWAY_UNREACHABLE';}
          }
          const evidence={check:'BROWSER_1_OWNER_GATEWAY',result,http_status:status,prod_mutation:false,secret_material_logged:false,owner_login_bypassed:false};
          console.log(JSON.stringify(evidence));
          await import('node:fs').then(fs=>fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Browser 1 owner E2E preflight\\n\\n${result}; no production mutation.\\n`));
          NODE
      - name: Install isolated Chromium for read-only physical canary
        if: github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        run: npx playwright install --with-deps chromium
      - name: Physical browser canary · public website read-only
        if: github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        env:
          CEREBRO_BROWSER_CANARY_URL: https://fenixcapital.es/
          CEREBRO_BROWSER_PROFILES_ROOT: .cerebro/browser-profiles
          CEREBRO_BROWSER_ARTIFACTS_ROOT: .cerebro/browser-artifacts
        run: node cerebro/canary/cloud-browser-prod-observe-v0.mjs
      - name: Preserve physical canary evidence
        if: always() && github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        uses: actions/upload-artifact@v4
        with:
          name: browser-navegador-p0-readonly-canary
          path: .cerebro/browser-artifacts/prod-canary-summary/**
          if-no-files-found: ignore
          retention-days: 7
