name: CEREBRO Browser Work Total V1 Validate

on:
  push:
    branches:
      - 'promote/browser-work-total-main-final-20261025'
      - 'fix/browser-realtime-fullsize-20261026'
      - 'main'
      - 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
    paths:
      - '.github/workflows/cerebro-browser-work-total-v1-validate.yml'
      - 'public/browser-ergonomics-v1.css'
      - 'public/browser-ergonomics-v1.js'
      - 'src/main.tsx'
      - 'src/cerebroBrowserWorkTotalDock.ts'
      - 'src/cerebroBrowserInteractive.ts'
      - 'src/CerebroBrowserConsole.tsx'
      - 'cerebro/runtime/browser-session-freshness-v3.ts'
      - 'cerebro/tests/browser-console-session-freshness.test.mjs'
      - 'cerebro/runtime/browser-interactive-session-v3.mjs'
      - 'cerebro/runtime/browser-session-bundle-v1.mjs'
      - 'cerebro/runtime/browser-session-bundle-v1.test.mjs'
      - 'cerebro/runtime/browser-work-total-v1-contract.test.mjs'
      - 'cerebro/runtime/browser-work-total-v1-prod-contract.test.mjs'
      - 'cerebro/runtime/browser-ergonomics-p0.test.mjs'
      - 'supabase/functions/cerebro-browser-work-total-owner-v1-prod/**'
      - 'supabase/functions/cerebro-browser-work-total-v1-prod/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-browser-work-total-v1-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Work Total UI + runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test session bundle integrity
        run: node --test cerebro/runtime/browser-session-bundle-v1.test.mjs
      - name: Test Work Total contracts
        run: node --test cerebro/runtime/browser-work-total-v1-contract.test.mjs
      - name: Test Work Total PROD contracts
        run: node --test cerebro/runtime/browser-work-total-v1-prod-contract.test.mjs
      - name: Verify isolated NAVEGADOR changes only
        if: github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$(git merge-base HEAD origin/main)" HEAD | while IFS= read -r file; do
            case "$file" in
              src/CerebroBrowserConsole.tsx|src/cerebroBrowserSessionFreshness.ts|cerebro/runtime/browser-session-freshness-v3.ts|cerebro/tests/browser-console-session-freshness.test.mjs|cerebro/runtime/browser-work-total-v1-contract.test.mjs|cerebro/runtime/browser-work-total-v1-prod-contract.test.mjs|cerebro/runtime/browser-ergonomics-p0.test.mjs|.github/workflows/cerebro-browser-work-total-v1-validate.yml) echo "ALLOWED $file" ;;
              *) echo "UNEXPECTED_CHANGE $file"; exit 1 ;;
            esac
          done
      - name: Test browser session freshness P0
        run: node --test cerebro/tests/browser-console-session-freshness.test.mjs
      - name: Test browser P0 ergonomics
        run: node --test cerebro/runtime/browser-ergonomics-p0.test.mjs
      - name: Syntax-check interactive runtime
        run: node --check cerebro/runtime/browser-interactive-session-v3.mjs
      - name: Build App with Work Total dock mounted
        run: npm run build
      - name: Install isolated Chromium for read-only physical canary
        if: github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        run: npx playwright install --with-deps chromium
      - name: Physical browser canary · public website read-only
        if: github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        env:
          CEREBRO_BROWSER_CANARY_URL: https://fenixcapital.es/
          CEREBRO_BROWSER_PROFILES_ROOT: .cerebro/browser-profiles
          CEREBRO_BROWSER_ARTIFACTS_ROOT: .cerebro/browser-artifacts
        run: node cerebro/canary/cloud-browser-prod-observe-v0.mjs
      - name: Preserve physical canary evidence
        if: always() && github.ref_name == 'cerebro/navegador-prod-stale-session-voice-p0-20261119'
        uses: actions/upload-artifact@v4
        with:
          name: browser-navegador-p0-readonly-canary
          path: .cerebro/browser-artifacts/prod-canary-summary/**
          if-no-files-found: ignore
          retention-days: 7
