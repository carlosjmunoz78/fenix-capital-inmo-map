name: FACT001 Supabase admin credential capability presence LAB
on:
  push:
    branches: [cerebro/fact001-cloudflare-universal-dual-lab-v0-20261109]
    paths:
      - cerebro/connectors/universal/supabase-admin-lab/requests/credential-probe.v1.json
permissions:
  contents: read
concurrency:
  group: fact001-supabase-admin-secret-probe
  cancel-in-progress: false
jobs:
  detect-existing-management-credential-without-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      SUPABASE_PERSONAL_ACCESS_TOKEN: ${{ secrets.SUPABASE_PERSONAL_ACCESS_TOKEN }}
      CEREBRO_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.CEREBRO_SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Verify the exact signed scope and report only whether credential exists
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync('cerebro/connectors/universal/supabase-admin-lab/requests/credential-probe.v1.json','utf8'));
          const expected={company_id:'fenix-capital',engine_id:'FACT-001',environment:'LAB',version:'1.0.0',project_ref:'cluhljgonannaafpmblx',function_slug:'cerebro-fact001-vercel-service-lab',operation:'supabase.management.credentials.preflight',request_id:'FACT001-SUPABASE-ADMIN-PREFLIGHT-20261110'};
          if(JSON.stringify(Object.keys(body).sort())!==JSON.stringify(Object.keys(expected).sort())||Object.keys(expected).some(k=>body[k]!==expected[k]))throw Error('INVALID_LAB_PREFLIGHT');
          const names=['SUPABASE_ACCESS_TOKEN','SUPABASE_MANAGEMENT_TOKEN','SUPABASE_PERSONAL_ACCESS_TOKEN','CEREBRO_SUPABASE_MANAGEMENT_TOKEN'];
          const available=names.filter(k=>typeof process.env[k]==='string'&&process.env[k].length>=20);
          console.log('FACT001_SUPABASE_PROTECTED_CREDENTIAL_PRESENT='+String(available.length>0));
          console.log('FACT001_SUPABASE_PROTECTED_CREDENTIAL_MATCH_COUNT='+available.length);
          console.log('FACT001_SUPABASE_TOKEN_VALUES_PRINTED=false');
          console.log('FACT001_SUPABASE_MANAGEMENT_REQUESTS=0');
          NODE
