name: CEREBRO Runtime Durable Supervisor V0

on:
  push:
    branches:
      - cerebro/boost-001-reconciled-20261027
      - 'cerebro/useful-run-dedupe-*'
      - cerebro/job001-drain-mode-v2-20261028
      - main
    paths:
      - 'cerebro/runtime/durable-job-runtime-v1.mjs'
      - 'cerebro/runtime/durable-worker-runner-v1.mjs'
      - 'cerebro/runtime/cerebro-continuous-supervisor-v0.mjs'
      - 'cerebro/runtime/cerebro-supervisor-daemon-v0.mjs'
      - 'cerebro/runtime/cerebro-supervisor-entrypoint-v1.mjs'
      - 'cerebro/runtime/job001-remote-telemetry-v1.mjs'
      - 'cerebro/runtime/job001-maintenance-drain-v1.mjs'
      - 'cerebro/runtime/persistent-runtime.mjs'
      - 'cerebro/runtime/bounded-recovery-supervisor.mjs'
      - 'cerebro/tests/durable-job-runtime-v1.test.mjs'
      - 'cerebro/tests/durable-worker-runner-v1.test.mjs'
      - 'cerebro/tests/cerebro-continuous-supervisor-v0.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-daemon-v0.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-daemon-dynamic-v1.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-entrypoint-v1.test.mjs'
      - 'cerebro/tests/job001-remote-telemetry-v1.test.mjs'
      - 'cerebro/tests/job001-maintenance-drain-v1.test.mjs'
      - 'cerebro/scripts/install-supervisor-preprod-windows.ps1'
      - '.github/workflows/cerebro-runtime-durable-job-v1.yml'
  pull_request:
    paths:
      - 'cerebro/runtime/durable-job-runtime-v1.mjs'
      - 'cerebro/runtime/durable-worker-runner-v1.mjs'
      - 'cerebro/runtime/cerebro-continuous-supervisor-v0.mjs'
      - 'cerebro/runtime/cerebro-supervisor-daemon-v0.mjs'
      - 'cerebro/runtime/cerebro-supervisor-entrypoint-v1.mjs'
      - 'cerebro/runtime/job001-remote-telemetry-v1.mjs'
      - 'cerebro/runtime/job001-maintenance-drain-v1.mjs'
      - 'cerebro/runtime/persistent-runtime.mjs'
      - 'cerebro/runtime/bounded-recovery-supervisor.mjs'
      - 'cerebro/tests/durable-job-runtime-v1.test.mjs'
      - 'cerebro/tests/durable-worker-runner-v1.test.mjs'
      - 'cerebro/tests/cerebro-continuous-supervisor-v0.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-daemon-v0.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-daemon-dynamic-v1.test.mjs'
      - 'cerebro/tests/cerebro-supervisor-entrypoint-v1.test.mjs'
      - 'cerebro/tests/job001-remote-telemetry-v1.test.mjs'
      - 'cerebro/tests/job001-maintenance-drain-v1.test.mjs'
      - 'cerebro/scripts/install-supervisor-preprod-windows.ps1'
      - '.github/workflows/cerebro-runtime-durable-job-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebro-runtime-durable-supervisor-v0-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  durable-supervisor-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned repository dependencies
        run: npm ci --ignore-scripts
      - name: Durable queue worker continuous supervisor and daemon focused tests
        run: >-
          node --test
          cerebro/tests/durable-job-runtime-v1.test.mjs
          cerebro/tests/durable-worker-runner-v1.test.mjs
          cerebro/tests/cerebro-continuous-supervisor-v0.test.mjs
          cerebro/tests/cerebro-supervisor-daemon-v0.test.mjs
          cerebro/tests/cerebro-supervisor-daemon-dynamic-v1.test.mjs
          cerebro/tests/cerebro-supervisor-entrypoint-v1.test.mjs
          cerebro/tests/job001-remote-telemetry-v1.test.mjs
          cerebro/tests/job001-maintenance-drain-v1.test.mjs
          cerebro/tests/bounded-recovery-supervisor.test.mjs
      - name: Syntax-check Windows PREPROD installer as text contract
        shell: bash
        run: |
          test -s cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "CEREBRO-Supervisor-PREPROD" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "cerebro\\runtime\\cerebro-supervisor-entrypoint-v1.mjs" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "prod_authorized" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "prod_write_authorized" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "RunLevel Limited" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "target_global_concurrency -ne 360" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "max_global_concurrency -ne 360" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "max_company_concurrency -ne 360" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "max_provider_concurrency.deepseek -ne 8" cerebro/scripts/install-supervisor-preprod-windows.ps1
          grep -F "max_repo_write_concurrency -ne 1" cerebro/scripts/install-supervisor-preprod-windows.ps1
      - name: Full CEREBRO regression suite
        working-directory: cerebro
        run: npm test
