name: CEREBRO Skill Autonomy Physical Branch Acceptance V1

on:
  push:
    branches:
      - cerebro/skill-autonomy-action-application-v1-20261014
    paths:
      - 'cerebro/runtime/skill-capability-autonomy-closure-v1.mjs'
      - 'cerebro/skills/skill-autonomy-action-application-v1.mjs'
      - 'cerebro/skills/skill-autonomy-safe-action-worker-v1.mjs'
      - 'cerebro/tests/skill-autonomy-action-application-v1.test.mjs'
      - 'cerebro/tests/skill-autonomy-safe-action-worker-v1.test.mjs'
      - '.github/workflows/cerebro-skill-autonomy-physical-branch-acceptance-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-branch-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run focused contracts
        run: node --test cerebro/tests/skill-capability-autonomy-closure-v1.test.mjs cerebro/tests/skill-autonomy-action-application-v1.test.mjs cerebro/tests/skill-autonomy-safe-action-worker-v1.test.mjs

      - name: Execute canonical decision to existing-engine handoff in isolated branch acceptance
        run: |
          mkdir -p artifacts/skill-autonomy-physical
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {decideSkillCapabilityAutonomy} from './cerebro/runtime/skill-capability-autonomy-closure-v1.mjs';
          import {buildSkillAutonomyActionReceipt,applySkillAutonomyActionReceipt} from './cerebro/skills/skill-autonomy-action-application-v1.mjs';
          import {routeNextSkillAutonomyAction} from './cerebro/skills/skill-autonomy-safe-action-worker-v1.mjs';

          const skill='physical-skill-acceptance';
          const decision=decideSkillCapabilityAutonomy({
            company_id:'fenix',environment:'PREPROD',skill_id:skill,skill_version:'v1',risk_class:'LOW',
            evidence:{complete:true,confidence:0.96},
            security:{provenance_ok:true,supply_chain_ok:true,license_ok:true,incident:false,legal_required:false},
            policy_conflict:false,policy_locked:true,permissions_locked:true,rollback_ready:true,rebuild_ready:true,
            duplicate:{exact:false},demand:{needed_now:true},impact:{existing_engine_bindings:['SEO-001']},
            old_vs_new:{decision:'PASS'},tribunal:{decision:'PASS'},cost:{additional_cost_eur:0,zero_cost_alternative:false,roi_positive:true},
            internal_wrapper_ready:false,external_code_execution_required:false,source_ref:'BRANCH_PHYSICAL_ACCEPTANCE'
          });
          if(decision.decision!=='ENVOLVER') throw new Error(`EXPECTED_ENVOLVER_GOT_${decision.decision}`);

          const baseState={
            schema_version:'0.1.0',state_type:'CEREBRO_SKILL_AUTOLOOP_SAFE_STATE',company_id:'GLOBAL',engine_id:'FACT-001',environment:'LAB',version:'0.1.0',enabled:true,mode:'SAFE_AUTONOMY_V0',
            safe_autonomy:{discovery:true,license_evidence:true,risk_and_overlap:true,static_lab:true,disabled_wrapper_plans:true,old_vs_new_synthetic_contracts:true,judge_and_tribunal_evidence:true,rollback_and_rebuild_proof:true,synthetic_behavioral_when_candidate_handler_is_green:true,preprod_promotion:false,prod_readonly_canary:false,prod_write:false,auto_merge:false,customer_data:false,external_skill_code_execution:false,trading:false,paid_fallback:false,additional_cost_budget_eur:0},
            processed_candidate_ids:[skill],in_flight:{},waiting_human:{},waiting_safe_handler:{},terminal_hold:{},
            completed:{[skill]:{candidate_id:skill,wrapper_id:'wrapper-physical-acceptance',domain:'seo',source_discovery_run_id:null,stage:'SKILL_AUTONOMY_DECISION_RECORDED',status:'COMPLETED',disposition:decision.decision,evidence:{decision_id:decision.decision_id},prod_authorized:false,prod_write:false,trading_access:false,additional_cost_eur:0}},
            prod_authorized:false,autonomous_prod_promotion_authorized:false
          };

          const receipt=buildSkillAutonomyActionReceipt(decision,{observed_at:new Date().toISOString()});
          const queued=applySkillAutonomyActionReceipt(baseState,receipt,{now:new Date().toISOString()});
          if(queued.autonomy_action_queue?.[skill]?.status!=='WAITING_SAFE_ACTION_WORKER') throw new Error('ACTION_NOT_QUEUED');

          const result=routeNextSkillAutonomyAction(queued,{now:new Date().toISOString()});
          const h=result.handoff;
          if(result.status!=='ROUTED'||h?.state_type!=='CEREBRO_SKILL_ENGINE_EXTENSION_HANDOFF') throw new Error('HANDOFF_NOT_ROUTED');
          if(h.next_gate!=='SKILL_CAPABILITY_EVOLUTION_EXISTING_ENGINE') throw new Error('WRONG_NEXT_GATE');
          if(h.target_engine_ids?.length!==1||h.target_engine_ids[0]!=='SEO-001') throw new Error('WRONG_ENGINE_TARGET');
          if(h.prod_authorized!==false||h.prod_write_authorized!==false||h.trading_access!==false||h.external_skill_code_execution_authorized!==false||h.paid_activation_authorized!==false||h.auto_merge_authorized!==false||Number(h.additional_cost_eur)!==0) throw new Error('AUTHORITY_EXPANSION');
          if(result.state.autonomy_action_queue?.[skill]!==undefined) throw new Error('QUEUE_NOT_CONSUMED');
          if(result.state.completed?.[skill]?.action_status!=='ROUTED_TO_EXISTING_GOVERNED_PIPELINE') throw new Error('COMPLETION_NOT_RECORDED');

          const evidence={
            schema_version:'1.1.0',status:'GREEN_DECISION_TO_ENGINE_PHYSICAL_BRANCH_ACCEPTANCE',
            branch:process.env.GITHUB_REF_NAME,head_sha:process.env.GITHUB_SHA,company_id:'fenix',skill_id:skill,
            canonical_decision:decision.decision,decision_id:decision.decision_id,action_id:receipt.action_id,
            target_engine_ids:h.target_engine_ids,handoff_type:h.state_type,next_gate:h.next_gate,
            action_queued:true,queue_consumed:true,completion_recorded:true,
            prod_authorized:false,prod_write_authorized:false,trading_access:false,external_skill_code_execution_authorized:false,
            paid_activation_authorized:false,additional_cost_eur:0,customer_data_used:false
          };
          fs.writeFileSync('artifacts/skill-autonomy-physical/evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload immutable physical acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-skill-autonomy-physical-branch-${{ github.run_id }}
          path: artifacts/skill-autonomy-physical/evidence.json
          if-no-files-found: error
          retention-days: 30
