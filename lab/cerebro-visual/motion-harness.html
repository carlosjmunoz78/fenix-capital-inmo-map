<!doctype html><html><head><meta charset="utf-8"><title>CEREBRO Motion QA Harness</title><style>html,body{margin:0;width:100%;height:100%;background:#01060a;color:#7fdff8;font:11px monospace}#m{padding:10px}</style></head><body><div id="m">MOTION QA BOOT…</div><script>'use strict';
const BASE='https://raw.githubusercontent.com/carlosjmunoz78/fenix-capital-inmo-map/76a19de070a1af5c197557a79acec2c51227507e/lab/cerebro-visual/index.html';
const MOTION='https://raw.githubusercontent.com/carlosjmunoz78/fenix-capital-inmo-map/baf4d629bbbf5d21339abf80044e39176e78a63c/lab/cerebro-visual/motion-controller-v1.js';
Promise.all([
 fetch(BASE,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('BASE '+r.status);return r.text()}),
 fetch(MOTION,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('MOTION '+r.status);return r.text()})
]).then(([html,motion])=>{
 document.open();document.write(html);document.close();
 setTimeout(()=>{try{Function(motion)()}catch(e){const b=document.createElement('div');b.textContent='MOTION EXEC FAIL · '+e.message;Object.assign(b.style,{position:'fixed',left:'18px',top:'62px',zIndex:30,color:'#ff9f9f',background:'rgba(20,0,0,.8)',padding:'8px',font:'10px monospace'});document.body.appendChild(b)}},80);
}).catch(e=>{document.getElementById('m').textContent='MOTION QA FAIL · '+e.message});
</script></body></html>
