SCREEN BLOOM</div><div id="state">GLOBAL</div><script>'use strict';const app=document.getElementById('app'),state=document.getElementById('state');const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x01060a,1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;app.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x01060a,.022);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.03,60);const root=new THREE.Group();scene.add(root);function rng(seed){let s=seed>>>0;return()=>((s=(1664525*s+1013904223)>>>0)/4294967296)}function gauss(r){let u=1-r(),v=1-r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.28318530718*v)}function sprite(soft=false){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),d=x.createImageData(64,64),a=d.data;for(let y=0;y<64;y++)for(let xx=0;xx<64;xx++){const dx=xx-31.5,dy=y-31.5,rr=Math.sqrt(dx*dx+dy*dy)/31.5;let al=0;if(rr<1)al=soft?Math.pow(1-rr,2.7)*.55:(rr<.18?1:Math.pow(1-rr,2.0));const o=(y*64+xx)*4;a[o]=a[o+1]=a[o+2]=255;a[o+3]=Math.round(al*255)}x.putImageData(d,0,0);return new THREE.CanvasTexture(c)}const coreTex=sprite(false),haloTex=sprite(true);function mat(size,opacity,soft=false){return new THREE.PointsMaterial({size,map:soft?haloTex:coreTex,transparent:true,opacity,vertexColors:true,alphaTest:.005,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:false})}function makePoints(P,C,size,opacity,soft=false){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));return new THREE.Points(g,mat(size,opacity,soft))}const centers=[[-1.52,.76,.02],[-.66,1.27,-.05],[.34,1.24,.06],[1.22,
