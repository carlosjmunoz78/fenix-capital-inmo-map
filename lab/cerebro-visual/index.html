ate=document.getElementById('state');let W=0,H=0,DPR=1;function resize(){DPR=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();function R(seed){let s=seed>>>0;return()=>((s=(1664525*s+1013904223)>>>0)/4294967296)}function G(r){let u=1-r(),v=1-r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.28318530718*v)}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;function sprite(size,inner,outer){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);g.addColorStop(0,inner);g.addColorStop(.18,inner);g.addColorStop(.56,outer);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,size,size);return c}const sBlue=sprite(12,'rgba(12,130,230,.95)','rgba(0,100,210,.02)'),sCyan=sprite(16,'rgba(70,235,255,1)','rgba(0,180,255,.025)'),sWhite=sprite(20,'rgba(245,255,255,1)','rgba(25,225,255,.035)'),sHalo=sprite(34,'rgba(175,250,255,.22)','rgba(0,195,255,0)');const centers=[[-1.48,.80],[-.68,1.24],[.36,1.20],[1.22,.77],[1.50,-.03],[1.04,-.80],[.18,-1.16],[-.80,-1.08],[-1.47,-.31],[-.08,.04]],names=['OPS','AUTOMATION','KNOWLEDGE','GROWTH','COMMS','FINANCE','SECURITY','SUPERVISION','FACTORY','CORE'];const clusters=[];for(let ci=0;ci<10;ci++){const r=R(500+ci),cx=centers[ci][0],cy=centers[ci][1],subs=[];for(let s=0;s<(ci===9?7:6);s++){const a=r()*Math.PI*2,rd=.035+r()*.18;subs.push([cx+Math.cos(a)*rd,cy+Math.sin(a)*rd*.72])}if(ci===9)subs.push([cx,cy]);const nodes=[],detail=[],links=[];const n=ci===9?1050:720;for(let i=0;i<n;i++){const q=subs[(r()*subs.length)|0],sig=(ci===9?.080:.072)*(.62+r()*.78),x=q[0]+G(r)*sig,y=q[1]+G(r)*sig*.72,d=Math.hypot((x-q[0])/(sig*1.2),(y-q[1])/(sig*.88));let h=Math.pow(Math.max(0,1-d*.43),1.55)*(.68+.32*r());nodes.push({x,y,h});for(let k=0;k<(h>.55?2:1);k++){const a=r()*6 ect(Math.round(p[0]),Math.round(p[1]),1,1)}}function render(){if(performance.now()>manualUntil){cam.cx=lerp(cam.cx,want.cx,.075);cam.cy=lerp(cam.cy,want.cy,.075);cam.zoom=lerp(cam.zoom,want.zoom,.075)}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#01060a';ctx.fillRect(0,0,W,H);const close=clamp((cam.zoom-1.45)/2.1,0,1),deep=clamp((cam.zoom-3.4)/2.2,0,1);ctx.globalCompositeOperation='lighter';for(const n of shell)point({x:n.x,y:n.y,h:.08+n.h*.12},.65*(1-close*.78));ctx.globalCompositeOperation='source-over';for(const [a,b] of routes)line({x:a[0],y:a[1]},{x:b[0],y:b[1]},.025*(1-close*.7),.45);for(let ci=0;ci<clusters.length;ci++){const c=clusters[ci],focus=ci===selected,fade=close?(focus?1:.12):1;ctx.globalCompositeOperation='source-over';for(const [a,b] of c.links)line(a,b,(focus?.085:.055)*fade,.42);ctx.globalCompositeOperation='lighter';for(const n of c.nodes)point(n,fade);if(focus&&close>.03)for(const n of c.detail)point(n,.72*close*(.7+.3*deep))}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';requestAnimationFrame(render)}canvas.addEventListener('wheel',e=>{e.preventDefault();manualUntil=performance.now()+500;const m=1+Math.min(2.5,Math.abs(e.deltaY)/180),nz=clamp(want.zoom*Math.exp(-e.deltaY*.00058*m),.75,6);want.zoom=nz;if(nz>1.5){want.cx=centers[selected][0];want.cy=centers[selected][1]}else if(nz<1.15){want.cx=0;want.cy=0}},{passive:false});canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;manualUntil=performance.now()+700;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;const base=Math.min(W/5,H/3.85)*want.zoom;want.cx-=dx/base;want.cy+=dy/base});canvas.addEventListener('pointerup',()=>drag=false);document.getElementById('follow').onclick=()=>{selected=(selected+1)%10;setStage(stage===0?1:stage)};document.getElementById('home').onclick=()=>setStage(0);setStage(0);const auto=location.search.includes('auto=1');if(auto)setInterval(()=>setStage((stage+1)%4),7000);requestAnimationFrame(render);window.CEREBRO_LAB={version:'v1.2.1',prod_authorized:false,setStage};</script></body></html>
