<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEREBRO Visual QA Harness</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#01060a}#msg{position:fixed;left:10px;top:10px;z-index:5;color:#7fdff8;font:11px monospace;background:#001018cc;padding:6px 8px;border-radius:6px}</style></head><body><div id="msg">QA BOOT…</div><iframe id="f" src="https://htmlpreview.github.io/?https://raw.githubusercontent.com/carlosjmunoz78/fenix-capital-inmo-map/470f73e67982a38533d70deb555901ff752d962b/lab/cerebro-visual/index.html"></iframe><script>const f=document.getElementById('f'),msg=document.getElementById('msg');const m=location.hash.match(/stage=(\d)/),stage=m?+m[1]:0;let tries=0;const t=setInterval(()=>{tries++;try{if(f.contentWindow&&f.contentWindow.CEREBRO_LAB){f.contentWindow.CEREBRO_LAB.setStage(stage);msg.textContent='QA STAGE '+stage+' · OK';setTimeout(()=>msg.remove(),900);clearInterval(t)}}catch(e){msg.textContent='QA WAIT '+tries}if(tries>80){msg.textContent='QA FAIL · stage '+stage;clearInterval(t)}},125);</script></body></html>
