<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>CEREBRO · Console móvil</title>
<style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#111827}
main{max-width:860px;margin:0 auto;padding:20px 14px 36px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand small{display:block;font-size:11px;letter-spacing:.12em;color:#6b7280;font-weight:800}
.brand h1{margin:3px 0 0;font-size:28px;letter-spacing:-.03em}
.pill{border:1px solid #d1d5db;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;background:#fff}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.06)}
.status{font-size:13px;color:#6b7280;margin-bottom:12px}
.log{display:grid;gap:10px;min-height:52vh;max-height:62vh;overflow:auto;padding:10px;border:1px solid #e5e7eb;border-radius:14px;background:#f9fafb}
.msg{max-width:92%;padding:10px 12px;border-radius:13px;line-height:1.45;white-space:pre-wrap;font-size:15px}
.user{justify-self:end;background:#111827;color:white}
.bot{justify-self:start;background:white;border:1px solid #e5e7eb}
.label{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;margin-bottom:4px;opacity:.65}
form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px;align-items:end}
textarea{width:100%;min-height:86px;resize:none;border:1px solid #d1d5db;border-radius:12px;padding:12px 13px;font:inherit;background:white;color:inherit}
button,.back{border:0;border-radius:12px;background:#111827;color:white;padding:12px 16px;font:inherit;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:disabled{opacity:.45}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px;font-size:12px;color:#6b7280}
.notice{margin-top:12px;padding:12px;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:13px;line-height:1.45}
@media(max-width:640px){main{padding:14px 10px 24px}.brand h1{font-size:24px}.card{padding:12px;border-radius:16px}.log{min-height:58vh;max-height:64vh}form{grid-template-columns:1fr}button{width:100%}}
@media(prefers-color-scheme:dark){body{background:#0f1115;color:#f3f4f6}.card,.pill,.bot,textarea{background:#17191f;border-color:#2a2e37}.log{background:#111318;border-color:#2a2e37}.status,.meta,.brand small{color:#9ca3af}.notice{background:#1f2440;color:#c7d2fe}.user,button,.back{background:#f3f4f6;color:#111827}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><small>CEREBRO OS · CONSOLE MÓVIL V0</small><h1>CEREBRO</h1></div>
  <span id="pill" class="pill">Comprobando…</span>
</header>
<section class="card">
  <div id="status" class="status">Conectando con CEREBRO Gateway…</div>
  <div id="log" class="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" maxlength="2000" placeholder="Pregunta algo o pide una acción…" disabled></textarea>
    <button id="send" type="submit" disabled>Enviar</button>
  </form>
  <div class="notice">Consultas: sin confirmación. Acciones: CEREBRO presenta el alcance exacto y espera un único «sí». Preguntar o pedir explicación no ejecuta nada.</div>
  <div class="meta"><a class="back" href="/perfil">Volver a Fénix</a><span>Fénix · sesión autenticada</span></div>
</section>
</main>
<script>
const ENDPOINT='https://cluhljgonannaafpmblx.supabase.co/functions/v1/cerebro-console-gateway-v0/';
const APIKEY='sb_publishable_yjISKmA5UPfF3d7NitP_DA_j5LGydh0';
const STORAGE='fenix-prod-auth-v1';
let pendingAction=null;

const pill=document.getElementById('pill');
const statusEl=document.getElementById('status');
const log=document.getElementById('log');
const input=document.getElementById('input');
const send=document.getElementById('send');
const form=document.getElementById('form');

function token(){
  try{
    const raw=localStorage.getItem(STORAGE);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    return parsed?.access_token||parsed?.currentSession?.access_token||parsed?.session?.access_token||null;
  }catch{return null}
}
function headers(){
  const t=token();
  return t?{Authorization:'Bearer '+t,apikey:APIKEY,'content-type':'application/json'}:null;
}
function add(role,text){
  const el=document.createElement('div');
  el.className='msg '+(role==='user'?'user':'bot');
  const label=document.createElement('span');
  label.className='label';
  label.textContent=role==='user'?'Tú':'CEREBRO';
  const body=document.createElement('span');
  body.textContent=text;
  el.append(label,body);
  log.appendChild(el);
  log.scrollTop=log.scrollHeight;
}
async function getHealth(){
  const h=headers();
  if(!h){
    pill.textContent='Sin sesión';
    statusEl.textContent='No encuentro una sesión de Fénix en este navegador. Entra primero en la App Fénix y vuelve a CEREBRO.';
    add('bot','Necesito una sesión autenticada de Fénix para abrir CEREBRO.');
    return;
  }
  try{
    const r=await fetch(ENDPOINT+'health',{headers:h,cache:'no-store'});
    const data=await r.json().catch(()=>null);
    const ok=r.status===200&&data?.status==='ok'&&data?.authenticated_transport===true&&data?.direct_model_access===false&&data?.live_writes===false;
    if(!ok)throw new Error('unsafe');
    pill.textContent='Conectado';
    statusEl.textContent='Gateway autenticado · '+(data.version||'V0')+' · '+(data.environment||'LAB');
    input.disabled=false;send.disabled=false;
    add('bot','Estoy conectado. Puedes preguntarme información autorizada de CEREBRO o pedirme una acción. Si la petición cambia algo, primero te propondré el alcance exacto.');
    input.focus();
  }catch{
    pill.textContent='No disponible';
    statusEl.textContent='No he podido verificar una conexión segura con CEREBRO Gateway.';
    add('bot','El Gateway no está disponible o la sesión ha caducado. Vuelve a la App Fénix, inicia sesión y reintenta.');
  }
}
async function sendMessage(text){
  const h=headers();
  if(!h){add('bot','La sesión ha caducado. Vuelve a iniciar sesión en Fénix.');return}
  add('user',text);
  input.value='';input.disabled=true;send.disabled=true;
  try{
    const r=await fetch(ENDPOINT+'chat',{
      method:'POST',
      headers:h,
      body:JSON.stringify({message:text,pending_action:pendingAction}),
      cache:'no-store'
    });
    const data=await r.json().catch(()=>null);
    if(data?.action)pendingAction=data.action;
    else if(data?.status==='CANCELED'||data?.status==='ACTION_CONFIRMED'||data?.status==='ACTION_ACCEPTED')pendingAction=null;
    add('bot',data?.message||('Respuesta no disponible · HTTP '+r.status));
  }catch{
    add('bot','No he podido contactar con CEREBRO Gateway.');
  }finally{
    input.disabled=false;send.disabled=false;input.focus();
  }
}
form.addEventListener('submit',e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(text)sendMessage(text);
});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const text=input.value.trim();
    if(text)sendMessage(text);
  }
});
getHealth();
</script>
</body>
</html>
